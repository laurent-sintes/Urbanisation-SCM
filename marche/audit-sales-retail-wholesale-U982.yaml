  reason: Erreur à l’ouverture; non retenue. Le document valide catalogs-b2b-sites est consulté sous ELM900.
- Aucune source consultée ne justifie exactement le découpage hiérarchique FLOW recommandé; il reste une proposition locale.
- Cycle complet des ouvertures, fermetures, immobilier, RH, CRM et fidélité non audité; pas de domaines correspondants créés.
clarification_U983:
  verbatim: Oui, POS et gestion de réseau de magasin ou backoffice magasin, ce n'est pas la même chose.
  scope: Distinction confirmée, sans adoption globale du découpage ou modification canonique.
  interpretation: Vente et caisse sous Store Commerce; backoffice local sous Store Operations; pilotage du réseau sous Retail
    Network Management. Le même produit peut servir plusieurs périmètres sans les fusionner.
  market_comparison: ELM888 et ELM892 distinguent opérations commerciales et opérations magasin; ELM887 et ELM895 éclairent
    le pilotage du réseau. Les produits peuvent regrouper ces fonctions; ils ne prescrivent ni séparation logicielle ni hiérarchie
    FLOW.
