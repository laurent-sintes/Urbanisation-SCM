system_options:
  recommended: Conserver les quatre Business Systems, ajouter Retail Operations comme Domain de Business Operations.
  alternative: Retail Management pourrait devenir un Business System après preuve d’un mandat autonome, responsabilités, échanges
    et frontières. Pas de promotion du POS ou de Storeland sur le seul critère logiciel.
  comparison: ELM887 et ELM895 appuient l’existence d’un réseau; ELM896 montre un produit intégré. Aucun ne fixe les Business
    Systems FLOW.
elastic:
  business_position:
  - Wholesale Commerce
  - Assortment & Catalog Management
  application_position: Conserver Elastic comme application dans le panorama As Is; ses couvertures métier restent des rapprochements
    documentaires, pas une nouvelle hiérarchie de réalisation dans Atlas.
  documented_local: 'APP-ELA, U03: prise de commande B2B du périmètre historique; U982 précise portail, assortiments, showroom
    et whiteboard. U955 conserve la mémoire qualifiée d’Elastic interactif Boardriders et de fichiers grands comptes vers
    AFS.'
  market: ELM897 et ELM898 appuient les usages annoncés. Le whiteboard est une présentation du panier dans l’application;
    le statut Order de l’éditeur ne prouve pas une commande ferme ou déjà reçue par FLOW.
  limits: Marques, versions, modules effectivement activés, modalités de synchronisation, source de vérité et statut à la
    transmission restent à établir. Pas de rattachement installé généralisé à Boardriders ou Sarenza.
case_tests:
- case: Vente magasin emportée
  owner: Store Commerce
  core: Recevoir faits de vente et effets de stock selon contrat; pas de nouvelle promesse ni affectation pour une demande
    déjà satisfaite.
  boundary: Ticket et vente réalisée distincts d’une commande restant à servir.
- case: Commande magasin à livrer / retrait de commande web
  owner: Store Commerce ou Digital Commerce selon origine commerciale; Store Operations exécute le retrait.
  core: Sales Order conserve identité et engagements; promesse, affectation et coordination restent Core.
  boundary: Canal commercial distinct du lieu et exécutant.
- case: Showroom et whiteboard Elastic
  owner: Wholesale Commerce
  core: Sélection commerciale non engagée; ne pas réserver du stock sur la seule visualisation.
  boundary: Une sélection n’est ni un nouveau produit PLM ni un plan de ressources.
- case: Commande revendeur saisonnière ou réassort
  owner: Wholesale Commerce
  core: Commande explicite reçue, contraintes et confirmations; Sales Order, promesse et affectation sous Core.
  boundary: Portal, représentant, fichier ou échange électronique sont des modalités alternatives à qualifier; crédit sous
    Finance.
- case: Affilié, franchise, concession, consignation
  owner: À qualifier selon vendeur, propriétaire et bénéficiaire du stock.
  core: Ne pas confondre apport de stock, transfert, vente au partenaire et vente finale.
  boundary: Wholesale couvre les revendeurs; le statut juridique du partenaire ne détermine pas seul le parcours. Données
    de vente au consommateur distinctes de vente au revendeur.
proposed_data_contracts:
- source: Store Commerce
  target: Supply Chain Orchestration
  contents: Faits de vente, retours, annulations et corrections liés aux effets de stock utiles au Core.
  condition: Identité, provenance, moment de l’événement, reprise sans doublon et règle d’imputation; aucune décrémentation
    double depuis vente et mouvement.
- source: Store Operations
  target: Supply Chain Orchestration
  contents: Réceptions, comptages, ajustements, préparation et remise au client.
  condition: Séparer stock physique constaté, stock attendu, stock vendable et stock engagé; autorité de chaque état à établir.
- source: Wholesale Commerce / Store Commerce / Digital Commerce
  target: Supply Chain Orchestration
  contents: Demandes à satisfaire, engagements commerciaux applicables et changements autorisés.
  condition: Séparer panier, proposition, précommande, commande et engagement; conserver identité et référence source.
- source: Supply Chain Orchestration
  target: Commerce
  contents: Disponibilité, promesses, confirmations et avancement utiles au parcours client.
  condition: Le canal applique ses règles propres sans recalculer les décisions Supply ni forcer leurs transitions.
- source: Assortment & Catalog Management
  target: Core et canaux selon contrat
  contents: Assortiments publiés, validités, catalogues et conditions applicables.
  condition: Attributs et autorité à établir; pas de transfert automatique de maîtrise du produit PLM ou des prix Finance.
- source: Store Commerce / Retail Operations
  target: Finance
  contents: Encaissements, clôtures et justificatifs financiers selon responsabilité.
  condition: Pas de passage obligatoire par Core pour toute donnée POS; comptabilité sous Finance.
atlas_limits: Les échanges internes entre domaines de Business Operations peuvent être modélisés avec shares-data. La vue
  Enterprise Architecture actuelle projette seulement les échanges entre Business Systems; elle ne représente pas ces liens
  internes. Ne pas créer un système pour obtenir une flèche.
glossary_review:
  current:
  - 'TER108 Sales: aligné au modèle actuel'
  - 'TER194 B2C et TER195 B2B: relation commerciale, non canal'
  - 'TER155: crédit sous Finance'
  required_if_adopted:
  - Mettre à jour ensemble noms, frontières et références de Sales et de ses sous-domaines, TER108 et fiches associées, sans
    toucher aux identités persistantes.
  - Définir POS, assortment, catalog, showroom, whiteboard, sell-in et sell-through au glossaire si utilisés dans de nouvelles
    fiches.
  - 'Réviser Commercial Reference Ingestion: Commerce ne serait plus seulement un repère historique; ne pas en déduire une
    autorité générale sur toutes les références.'
  changes_applied: true
