- url: https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/9905622a5c1f49ba84e9076fc83a9c2c/9412a95740a9ab6be10000000a4450e5.html
  reason: Page sans contenu direct lisible; non retenue comme preuve. SAP Learning ELM892 fournit l’appui effectivement consulté.
