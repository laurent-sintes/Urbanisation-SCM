current_findings:
- target: domain-sales
  finding: Le périmètre actuel inclut déjà offre et vente B2C/B2B, avec B2C E-commerce, B2C Store et Wholesale. Les sous-domaines
    sont surtout décrits par leurs Cases et mobilisation du Core.
  classification: documented
- target: subdomain-sales-b2c-store
  finding: Réseau, caisse et opérations de stock magasin ne sont pas explicitement délimités dans sa fiche.
  classification: description_gap_not_proof_of_absence
- target: subdomain-sales-wholesale
  finding: La fiche détaille surtout le contrôle de crédit; catalogues, sélection d’assortiments et vente assistée B2B sont
    peu décrits.
  classification: description_gap_not_proof_of_absence
- target: D04.i
  finding: Sales Order décrit des commandes à satisfaire; distinguer les ventes POS déjà réalisées des demandes de livraison
    ou retrait.
  classification: boundary_to_clarify_not_new_capability
- target: BHV081
  finding: Store Visibility existe et suit réceptions, réserve, mise en rayon et réassort de surface. L’audit ne conclut pas
    à un manque de visibilité Core.
  classification: documented
- target: domain-logistics-execution
  finding: Logistics réalise transport et entreposage. La formule générale des fiches Sales sur toute exécution physique est
    trop large pour décrire les gestes réalisés par le magasin.
  classification: editorial_boundary_to_refine
