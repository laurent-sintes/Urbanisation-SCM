recommendations:
- name: Commerce
  proposed_level: Domain
  proposed_parent: Business Operations
  service: Préparer les offres et conduire les ventes au consommateur ou au revendeur.
  boundaries: Remplace le nom Sales si accepté, en conservant son identité. Ni achats fournisseur, ni allocation Supply, ni
    comptabilité, ni construction de plans de ressources.
  comparison:
    relationship: Recouvrement partiel
    microsoft:
    - ELM887
    - ELM890
    - ELM900
    sap:
    - ELM896
    - ELM899
    - ELM893
    similarities: Préparer les offres et conduire les ventes au consommateur ou au revendeur.
    differences: La proposition FLOW sépare responsabilités et applications; les produits les regroupent. Le niveau et le
      rattachement sont un choix local.
    benefit: Rendre visibles la préparation commerciale et les canaux, au-delà du seul traitement de commandes.
    limits: Recouvrement partiel de périmètre, sans taxonomie FLOW prescrite, équivalence exacte ni preuve de réalisation
      Beaumanoir. Édition globale non indiquée; synthèse et lien seulement, sans redistribution intégrale.
  status: proposed_not_validated
