depth_assessment:
  current_rule: 'U981 : seules les capacités du Core sont détaillées ; U848/U880 : Business Area contient au moins une capacité
    et les capacités ont un parent Business Area.'
  business_area_required_now: false
  reason: Les responsabilités adjacentes peuvent être définies par sous-domaines et contrats explicites. Aucun partage de
    responsabilité justifiant une Business Area distincte n’est encore documenté.
  trigger_for_exception: Si définition des règles, détermination du prix et publication relèvent de mandats distincts non
    exprimables clairement à la maille sous-domaine, proposer une exception ciblée avec responsabilité, bénéfice et frontière
    ; faire arbitrer la profondeur et les exigences de contenu des Business Areas avant application.
  constraints: Ne pas créer de Business Area vide pour contourner la règle ; ne pas transférer le calcul du prix ou de la
    prime dans le Core pour éviter de préciser son producteur.
limitations:
- Deux éditeurs documentent les fonctions mais ne prouvent pas un consensus de hiérarchie ni les responsabilités Beaumanoir.
- La disponibilité technique d’un moteur de calcul ne transfère pas l’autorité métier.
- L’audit U431 reste clos ; aucun rejeu historique ni décomposition supplémentaire de comportements.
- Aucune modification canonique, release, affectation d’outil ni contrat de partage adopté.
- SAP Help sur Condition Records et Maintaining Condition Contracts ne rendait pas de corps exploitable ; les cours SAP Learning
  cités ont été consultés.
- La paie et les réglementations de promotion/soldes ne font pas l’objet de cet audit.
