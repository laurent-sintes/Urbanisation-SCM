findings:
- id: F01
  priority: high
  topic: Production des prix et conditions
  evidence:
  - product-price-book
  - service-price-book
  - D11
  - D03
  - D04.i
  finding: Le modèle distingue tarif de référence et prix contextualisé ; aucun sous-domaine adjacent ne porte explicitement
    le service complet de production et publication du prix applicable.
  risk: Attribuer implicitement le calcul à Price Book, PTP ou Billing, ou laisser plusieurs producteurs produire des conditions
    contradictoires.
  recommendation: 'Sous Commerce : Pricing & Promotions Management, incluant politique, périodes, dérogations, détermination
    et publication des prix client/canal/produit. Sourcing and Procurement porte les conditions d’achat ; les prix des prestations
    proviennent de leurs accords et responsables. La fonction de calcul peut être réalisée par un composant spécialisé.'
  microsoft:
  - ELM904
  - ELM906
  - ELM911
  sap:
  - ELM905
  - ELM907
- id: F02
  priority: high
  topic: Consommation contrôlée des conditions par FLOW
  evidence:
  - D04
  - D04.i
  - D04.j
  - master-data-ingestion
  - D03.k
  finding: Prix applicables et stabilité des engagements présents ; contrat complet de consommation, refus et correction non
    explicite.
  recommendation: 'Préciser Reference Ingestion, Order Management et les parcours : prix reçu, contexte évalué, référence
    et version, période, date métier retenue, dérogation, statut de contrôle. Demander un résultat corrigé au producteur ;
    ne pas recalculer les règles commerciales dans FLOW. Le contrôle vérifie l’applicabilité du résultat sans déterminer un
    nouveau prix.'
  microsoft:
  - ELM904
  - ELM911
  sap:
  - ELM905
  - ELM907
- id: F03
  priority: high
  topic: Ristournes et primes commerciales
  evidence:
  - D11
  - service-order-billing
  - service-order-payment-collection
  finding: Les porteurs génériques d’accord, facture et paiement existent ; assiette éligible, seuils, périodes, droits acquis,
    régularisations et statut de règlement ne sont pas définis comme responsabilité.
  recommendation: 'Sous Commerce : Rebates & Incentives Management pour les dispositifs commerciaux de vente. Purchase Contract
    Management porte les dispositifs d’achat. Finance porte le calcul financier et le règlement sous une responsabilité Commercial
    Settlement Management. FLOW fournit les faits Supply et reçoit les conséquences autorisées qui concernent ses commandes,
    sans devenir le calculateur du droit à prime.'
  microsoft:
  - ELM908
  sap:
  - ELM909
- id: F04
  priority: high
  topic: Commissions et primes de personnel
  evidence:
  - service-order-payment-collection
  - domain-finance
  - system-enterprise-management-control
  finding: Payment est limité aux encaissements/remboursements clients ; les versements fournisseurs, agents et salariés ne
    sont pas couverts par extension.
  recommendation: 'Agents externes : convention commerciale, calcul et règlement financier hors Core. Primes salariales :
    responsabilité RH/paie hors Core à représenter seulement si une interface utile à FLOW doit être documentée. Fournir des
    faits au responsable ; ne pas traiter une prime salariale comme une remise client.'
  microsoft:
  - ELM910
  sap:
  - ELM909
  gap: La paie et les règles de rémunération Beaumanoir ne sont pas étudiées ; aucun sous-domaine RH ni Business Area proposé
    comme déjà justifié.
- id: F05
  priority: medium
  topic: Commerce / Retail Operations
  evidence:
  - domain-sales
  - domain-retail-operations
  - subdomain-store-backoffice-operations
  - subdomain-retail-network-management
  finding: La séparation de responsabilités est utile ; la séparation en deux domaines n’est pas obligatoire et alourdit le
    contexte.
  recommendation: 'Préférence après U993 : un seul domaine Commerce avec Store Commerce, Store Backoffice Operations, Retail
    Network Management, Digital Commerce, Wholesale Commerce et Assortment & Catalog Management. Décrire l’exploitation des
    canaux dans la définition Commerce. Les deux nouveaux sujets prix/avantages restent des sous-domaines proposés distincts.
    Conserver les identités des nœuds déplacés ; un éventuel retrait du domaine Retail Operations doit être explicite.'
  microsoft:
  - ELM888
  - ELM887
  sap:
  - ELM892
  - ELM895
- id: F06
  priority: medium
  topic: Mandat de planification du transport
  evidence:
  - transport-plan-decision
  - subdomain-transport-planning-dispatch
  finding: FLOW peut composer chargements et trajets ; Logistics organise aussi le transport local. La distinction est rédigée
    mais le mandat transmis n’est pas assez explicite pour décider qui fait quel calcul.
  recommendation: 'Décrire le contrat par périmètre : contraintes et groupements décidés par l’orchestration, possibilités
    et plan local produits par Logistics, confirmations, adaptations et conséquences sur la promesse. Ne pas ajouter une seconde
    décision de plan ni retirer automatiquement Transport Plan Decision.'
  basis: Cohérence interne du modèle ; aucune nouvelle attribution d’outil ou source de calcul présumée.
- id: F07
  priority: medium
  topic: Noms de portée trop larges ou techniques
  evidence:
  - D03
  - subdomain-policies
  - ba-financial-service-order-management
  - service-order-payment-collection
  finding: Availability couvre aussi matching, configurations et plan interne ; Control Plane peut évoquer une plateforme
    informatique ; Financial Services et Payment peuvent laisser croire à une finance complète.
  recommendation: Rendre les limites visibles dans les résumés et fiches ; envisager Customer Payment seulement si un renommage
    améliore la lecture. Ne pas renommer systématiquement Availability ou Control Plane, déjà définis. Aucun catalogue de
    capacités financières ajouté.
  basis: Lecture comparée du nom et du périmètre canonique ; évaluation lexicale, sans synonymie marché revendiquée.
- id: F08
  priority: low
  topic: Nom identique dans deux familles de commande
  evidence:
  - BHV059
  - BHV068
  finding: Direct Delivery est présent côté achat et côté vente. Ce sont deux contributions coordonnées au même cas, pas deux
    flux physiques indépendants.
  recommendation: Afficher le parent dans la recherche et les fiches ; garder le nom si le contexte est visible. Ne pas fusionner
    les identités ni compter deux livraisons.
  basis: Les définitions et parents différencient les responsabilités ; aucun réexamen de l’audit des comportements U431.
- id: F09
  priority: medium
  topic: Sources responsables et interfaces adjacentes
  evidence:
  - master-data-ingestion-commerce
  - D11
  - D12
  - D16
  - product-price-book
  finding: Références locales présentes ; producteurs, priorités et dates d’application de certaines données restent à établir.
    Les échanges internes Commerce/Core sont absents des sept relations shares-data actuelles.
  recommendation: 'Documenter les contrats utiles par donnée : produit, assortiment, condition, prix contextualisé et correction.
    Les relations entre domaines du même système peuvent être modélisées ; elles ne sont pas projetées en flèches intersystèmes
    dans la vue Enterprise Architecture.'
  basis: Contrats sources explicitement ouverts dans les fiches ; absence de relation documentée ne démontre pas absence d’interface
    installée.
- id: F10
  priority: low
  topic: Précision des systèmes adjacents
  evidence:
  - system-design-development
  - system-enterprise-management-control
  - domain-plan
  - domain-logistics-execution
  finding: Les systèmes de contexte couvrent les domaines et sous-domaines utiles à FLOW. Ils ne constituent pas un inventaire
    complet de toutes les fonctions d’entreprise.
  recommendation: Conserver cette limite. Les achats restent dans les opérations ; Collection Planning définit l’offre, Demand
    & Supply Planning les prévisions, le Matching Master Plan les affectations opérationnelles. Ajouter un périmètre adjacent
    seulement pour identifier une responsabilité ou un contrat utile.
  basis: Cohérence interne et frontières canoniques ; absence de RH, immobilier ou production interne ne constitue pas un
    manque démontré de FLOW.
scenario_checks:
- case: Client B2B avec prix contractuel et promotion en cours
  expected: Le producteur précise priorité et exclusion/cumul. FLOW reçoit le prix net autorisé ; ne choisit pas implicitement
    le moins cher.
  current_coverage: partial
  source_refs:
  - ELM904
  - ELM905
- case: Commande avant soldes, expédition pendant soldes
  expected: Le producteur précise la date de référence du calcul. Le changement de période ne modifie pas automatiquement
    un engagement confirmé.
  current_coverage: partial
  source_refs:
  - ELM911
  - ELM907
- case: Remise de volume et commande fractionnée
  expected: Le producteur établit le résultat et ses allocations par ligne ; les fragments conservent le lien à la décision
    d’origine et ne déclenchent pas plusieurs fois l’avantage.
  current_coverage: not_explicit
  source_refs:
  - ELM906
  - ELM905
- case: Retour après fin de promotion
  expected: Conserver le prix et les remises de l’engagement d’origine pour le règlement autorisé ; le prix actuel ne remplace
    pas silencieusement cette base.
  current_coverage: partial
  source_refs:
  - ELM905
  - ELM908
- case: Correction tardive d’une condition déjà appliquée
  expected: Recevoir la correction, reconnaître les documents affectés, obtenir une décision autorisée ; tracer sans réécrire
    silencieusement le passé.
  current_coverage: not_explicit
  source_refs:
  - ELM907
  - ELM911
- case: Ristourne annuelle puis retour client
  expected: Le responsable calcule les volumes éligibles et la régularisation. FLOW fournit ses faits et applique seulement
    les conséquences autorisées.
  current_coverage: not_explicit
  source_refs:
  - ELM908
  - ELM909
- case: Prime en marchandises offertes
  expected: Un avantage autorisé en biens crée une demande de réalisation distincte, sans inventer paiement ni revenu ; FLOW
    peut orchestrer l’apport.
  current_coverage: not_explicit
  source_refs:
  - ELM908
  - ELM909
- case: Commission d’agent après facture et correction ultérieure
  expected: Identifier bénéficiaire, assiette, date, correction et résultat de règlement ; Payment client ne couvre pas le
    versement à l’agent.
  current_coverage: not_explicit
  source_refs:
  - ELM910
  - ELM909
- case: Prime d’équipe magasin
  expected: RH/paie définit et règle la rémunération ; les faits de vente utiles sont fournis sous contrat, hors calcul Supply.
  current_coverage: outside_core
  source_refs:
  - U991
  - U992
- case: Résultat de prix absent, expiré ou incohérent
  expected: Exposer le problème et déclencher l’attente, le contrôle humain ou la demande de correction autorisée ; aucune
    validation automatique ni prix inventé.
  current_coverage: not_explicit
  source_refs:
  - ELM904
  - ELM907
glossary_review:
  canonical_modified: false
  existing:
  - TER097
  - TER145
  - TER146
  - TER048
  - TER153
  - TER154
  gaps:
  - Prix de référence / prix déterminé / prix engagé
  - Remise immédiate / ristourne différée
  - Prime commerciale en argent ou en biens
  - Commission d’agent / prime de personnel
  - Assiette éligible et période de calcul
  - Cumul, exclusion, date métier du prix et dérogation
  rule: Aligner modèle et glossaire dans le même lot si une proposition est adoptée ; aucun accord U987 transféré à ces nouveaux
