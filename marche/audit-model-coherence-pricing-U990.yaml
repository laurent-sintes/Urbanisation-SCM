    proposed_name: Supply Policy Management
    scope: 'Tenir les politiques opérationnelles Supply : protections, plafonds, recours aux prestataires, versions, validités
      et dérogations autorisées. Recommandation et application restent chez leurs responsables ; aucune autorité tarifaire
      ou financière transférée.'
  availability:
    id: D03
    proposed_name: Availability
    action: keep_name
    proposed_short_definition: Déterminer comment couvrir les besoins et ce qui peut être promis, en tenant compte des ressources,
      des priorités et des engagements.
  market_limit: Nom Supply Policy Management proposé par cohérence du modèle ; les deux sources documentent des fonctions
    voisines, pas un consensus de taxonomie.
