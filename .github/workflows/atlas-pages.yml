name: FLOW Atlas — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'modeles/**'
      - 'Lancer-FLOW-Atlas.ps1'
      - 'requirements.txt'
      - '.github/workflows/atlas-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-pages
  cancel-in-progress: false

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s app -p test_launcher.py
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python -m unittest discover -s app -p "test_*.py"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Retired snapshots are read at the exact commits in git-history.json.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - run: python -m pip install -r requirements.txt
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app test
      - run: pnpm --dir app build
      - run: pnpm --dir app exec playwright install --with-deps chromium
      - run: pnpm --dir app verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-delivery-manifest
          path: app/dist/delivery.json
  deploy:
    needs: [build, launcher, contracts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: atlas-delivery-manifest
          path: .runtime/delivery
      - name: Deploy Atlas
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed content
        env:
          ATLAS_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/atlas_delivery.py --manifest .runtime/delivery/delivery.json --url "$ATLAS_URL" --attempts 6
