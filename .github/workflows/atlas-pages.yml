name: FLOW Atlas — GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.plan.outputs.contracts }}
      frontend: ${{ steps.plan.outputs.frontend }}
      frontend_tests: ${{ steps.plan.outputs.frontend_tests }}
      browser: ${{ steps.plan.outputs.browser }}
      matrix: ${{ steps.plan.outputs.matrix }}
      launcher: ${{ steps.plan.outputs.launcher }}
      release_browser: ${{ steps.plan.outputs.release_browser }}
      contract_profile: ${{ steps.plan.outputs.contract_profile }}
      contract_modules: ${{ steps.plan.outputs.contract_modules }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - id: plan
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$PUSH_BASE"
          else
            BASE="$(git rev-list --max-parents=0 HEAD | head -1)"
          fi
          python scripts/plan_checks.py --base "$BASE" --github-output
  launcher:
    needs: plan
    if: needs.plan.outputs.launcher == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s app -p test_launcher.py
  contracts:
    needs: plan
    if: needs.plan.outputs.contracts == 'true'
    concurrency:
      group: atlas-contracts-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - env:
          CONTRACT_PROFILE: ${{ needs.plan.outputs.contract_profile }}
          CONTRACT_MODULES: ${{ needs.plan.outputs.contract_modules }}
        run: python scripts/contract_checks.py --profile "$CONTRACT_PROFILE" --modules "$CONTRACT_MODULES" --full
  frontend_tests:
    needs: plan
    if: needs.plan.outputs.frontend_tests == 'true' && needs.plan.outputs.frontend != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app test
  build:
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    concurrency:
      group: atlas-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Retired snapshots are read at the exact commits in git-history.json.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - run: python -m pip install -r requirements.txt
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app check:code
      - run: pnpm --dir app test
      - name: Restore verified export candidates
        uses: actions/cache@v5
        with:
          path: |
            app/public/data
            .runtime/atlas-export-receipts
            .runtime/parsed-models
            .runtime/export-document-index
          key: atlas-export-v2-${{ runner.os }}-${{ hashFiles('scripts/structured_io.py', 'scripts/parsed_cache.py', 'requirements.txt') }}-${{ hashFiles('modeles/release/index.json', 'modeles/modeling-guides/index.yaml') }}
          restore-keys: |
            atlas-export-v2-${{ runner.os }}-
            atlas-export-${{ runner.os }}-
      - run: pnpm --dir app build
      - run: pnpm --dir app exec playwright install --with-deps chromium
        if: needs.plan.outputs.browser == 'true'
      - run: python scripts/verify_atlas.py --workers 3 --smoke
        if: needs.plan.outputs.browser == 'true' && needs.plan.outputs.matrix != 'true' && needs.plan.outputs.release_browser != 'true'
      - run: python scripts/verify_atlas.py --workers 3 --release
        if: needs.plan.outputs.browser == 'true' && needs.plan.outputs.matrix != 'true' && needs.plan.outputs.release_browser == 'true'
      - run: python scripts/verify_atlas.py --workers 3
        if: needs.plan.outputs.matrix == 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: atlas-failed-recipes
          path: app/.runtime/qa-*/**
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: app/dist
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: atlas-delivery-manifest
          path: app/dist/delivery.json
  checks:
    name: Atlas checks
    needs: [plan, build, launcher, contracts, frontend_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          LAUNCHER: ${{ needs.launcher.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          FRONTEND_TESTS: ${{ needs.frontend_tests.result }}
          NEED_BUILD: ${{ needs.plan.outputs.frontend }}
          NEED_LAUNCHER: ${{ needs.plan.outputs.launcher }}
          NEED_CONTRACTS: ${{ needs.plan.outputs.contracts }}
          NEED_FRONTEND_TESTS: ${{ needs.plan.outputs.frontend_tests }}
        run: |
          test "$PLAN" = "success"
          for RESULT in "$BUILD" "$LAUNCHER" "$CONTRACTS" "$FRONTEND_TESTS"; do
            test "$RESULT" = "success" || test "$RESULT" = "skipped"
          done
          if [ "$NEED_BUILD" = "true" ]; then test "$BUILD" = "success"; fi
          if [ "$NEED_LAUNCHER" = "true" ]; then test "$LAUNCHER" = "success"; fi
          if [ "$NEED_CONTRACTS" = "true" ]; then test "$CONTRACTS" = "success"; fi
          if [ "$NEED_FRONTEND_TESTS" = "true" ] && [ "$NEED_BUILD" != "true" ]; then test "$FRONTEND_TESTS" = "success"; fi
  deploy:
    needs: [checks, build]
    if: always() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.checks.result == 'success'
    concurrency:
      group: atlas-pages-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - id: freshness
        run: |
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$REMOTE" = "$GITHUB_SHA" ]; then echo "fresh=true" >> "$GITHUB_OUTPUT"; else echo "fresh=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/configure-pages@v5
        if: steps.freshness.outputs.fresh == 'true'
      - uses: actions/download-artifact@v4
        if: steps.freshness.outputs.fresh == 'true'
        with:
          name: atlas-delivery-manifest
          path: .runtime/delivery
      - name: Deploy Atlas
        if: steps.freshness.outputs.fresh == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed content
        if: steps.freshness.outputs.fresh == 'true'
        env:
          ATLAS_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/atlas_delivery.py --manifest .runtime/delivery/delivery.json --url "$ATLAS_URL" --attempts 6
