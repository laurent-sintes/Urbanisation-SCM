- decision_id: ADOPT-REASSESS-8fd1acba9f551962c468f9b8
  action: retain
  rationale: Le rattachement contains de Design & Development à Enterprise Architecture conserve ses extrémités et son type.
    Les trois nouveaux domaines U975 enrichissent ce système sans changer ce parent ; aucune description ni réalisation adoptée
    par extension. Réexamen limité aux champs historiques conservés, sans accord sur les exemples, appuis marché, mandats
    ou réalisations installées.
- decision_id: ADOPT-REASSESS-b234f5c51b530daf5c2c3793
