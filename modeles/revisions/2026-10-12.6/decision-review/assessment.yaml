- decision_id: ADOPT-REASSESS-3c293e678dd29417d31304d4
  action: retain
  rationale: Demand / Supply Matching conserve son nom et ses décisions de couverture. U976 situe la construction du Supply
    Plan reçu dans le domaine externe ; le Matching Master Plan interne reste distinct et sa responsabilité demeure dans Availability.
    Réexamen limité aux champs historiques conservés, sans accord sur les exemples, appuis marché, mandats ou réalisations
    installées.
- decision_id: ADOPT-REASSESS-ed3b3e49f44eac88ae6b6f27
  action: retain
  rationale: Physical Stock Target Optimization conserve son nom et son objet de décision. Le nouveau domaine Warehousing
    tient les faits et contrôles physiques ; il ne remplace pas la décision Supply sur les cibles de couverture. Aucun contenu
    de cette capacité n’est étendu. Réexamen limité aux champs historiques conservés, sans accord sur les exemples, appuis
    marché, mandats ou réalisations installées.
- decision_id: ADOPT-REASSESS-b4963f51ab97aca45301464b
  action: retain
  rationale: Logical Stock Protection Optimization conserve son nom et ses droits logiques de groupe. U975 ne transfère pas
    ces décisions à Logistics ou à GRC ; le pilotage local du prestataire reste distinct. Réexamen limité aux champs historiques
    conservés, sans accord sur les exemples, appuis marché, mandats ou réalisations installées.
- decision_id: ADOPT-REASSESS-f03aee75b9542d4f67d433d7
  action: retain
  rationale: Reservation Rule Optimization conserve son nom et son objet de décision. La réalisation logistique ne devient
