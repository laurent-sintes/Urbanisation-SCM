items:
- decision_id: ADOPT-REASSESS-df75cc7e8b44461fa1dd558b
  action: retain_partial
  rationale: Le nom Design & Development est inchangé. U975 adopte sa décomposition en domaines et sous-domaines de contexte
    ; la valeur historique modeling_depth=context a changé et est exclue de cette transcription. Seul name est conservé ;
    aucun accord historique n’est transféré aux nouveaux textes ni à la nouvelle valeur de profondeur. Réexamen limité aux
    champs historiques conservés, sans accord sur les exemples, appuis marché, mandats ou réalisations installées.
  approved_fields:
  - name
- decision_id: ADOPT-REASSESS-34de658fc201bbf565894071
  action: retain
  rationale: Le nom Control Plane et ses responsabilités locales restent identiques. Governance, Risk & Compliance porte les
    exigences d’entreprise ; U975 ne lui transfère pas la tenue des règles actives locales Supply. Le champ name historique
    reste applicable. Réexamen limité aux champs historiques conservés, sans accord sur les exemples, appuis marché, mandats
    ou réalisations installées.
- decision_id: ADOPT-REASSESS-9ad41347a877b08481a85c18
  action: retain
  rationale: La qualification data_governance du référentiel local est inchangée. Les systèmes de contexte U975 ne deviennent
    pas implicitement maîtres de ces données ; leur rôle source doit être établi. L’autorité locale et les frontières entreprise
    de U479/U908 restent applicables. Réexamen limité aux champs historiques conservés, sans accord sur les exemples, appuis
    marché, mandats ou réalisations installées.
- decision_id: ADOPT-REASSESS-b90055aafd9295e998ec0d05
  action: retain
  rationale: La qualification data_governance est inchangée. La séparation Logistics et le contexte GRC n’acquièrent pas l’autorité
    sur ce référentiel de Control Plane ; les décisions et règles locales restent dans Supply. Réexamen limité aux champs
    historiques conservés, sans accord sur les exemples, appuis marché, mandats ou réalisations installées.
