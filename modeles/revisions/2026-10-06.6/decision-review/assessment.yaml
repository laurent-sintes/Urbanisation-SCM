  rationale: 'plans-visibility : maintien limité aux champs historiques inchangés (name, nature). Les corrections U859–U871
    précisent les commandes passives, séparent les Price Books et réorganisent leur présentation, déplacent Plan Visibility
    et ajoutent Preorder sans invalider ces valeurs ni les rattachements conservés. Aucune extension aux nouvelles descriptions,
    nouveaux objets ou accords retirés.'
