- decision_id: ADOPT-REASSESS-52792500c75cf0e6a56f8c61
  action: retain
  rationale: 'Cible domain-warehousing : conserver uniquement name, valeurs historiques inchangées. Warehousing conserve entreposage,
    gestes physiques et travail local à profondeur Business Areas. Son scope ne fait que renommer le relais SCM ; pièces,
    routes et autorités financières restent à qualifier. Les principes corrigés explicitent Master Plan/Availability et Process/Service
    Orders sans déplacer ces parents ou mandats ; les réserves de preuve et de réalisation installée restent distinctes de
    la reprise. Le complément de TER106 aligne uniquement le nom Supply Chain Management dans Business Operations ; Logistics
    demeure un système distinct et les responsabilités de Commerce et Procurement sont préservées.'
