- decision_id: ADOPT-REASSESS-78ba3d0c6a3cfa44071596b4
  action: retain
  rationale: 'Cible domain-warehousing : reprise des seuls champs historiques name. Warehousing garde le traitement physique
    et le travail local, avec la profondeur Business Areas. Les nouvelles remises vers transport/douane et les justificatifs
    vers Financial Accounting restent conditionnels à la prestation ; ils ne transfèrent ni les engagements Supply ni la reconnaissance
    comptable. Les routes, pièces et autorités financières restent à qualifier. Les changements globaux Application/Informations
    concernent les décisions Supply et les preuves SAP historiques ; le contrat Process Ledger conserve l’autorité des faits
    d’origine et ne transfère pas le travail physique de Logistics. Les notes de revue et les nouveaux liens ne valent pas
    extension d’accord : contrats U1115, compléments rédactionnels, comparaisons et réalisation installée gardent leur qualification
    propre.'
- decision_id: ADOPT-REASSESS-0112eb8429c3821abad4dd3d
  action: retain
  rationale: 'Cible REL-U975-subdomain-inbound-operations : reprise des seuls champs historiques source_id, target_id, type.
    Le rattachement presents domain-warehousing → subdomain-inbound-operations garde son sens de décomposition explicite,
    distinct des nouvelles coopérations et participations aux scénarios. Inbound Operations conserve réception et entrée en
    entrepôt, avec Receiving et Putaway pour enfants. Le nouveau retour du transport vers Receiving prépare ou documente la
    réception ; il ne la transforme pas en entrée de stock reconnue par une simple annonce. Les changements globaux Application/Informations
