    Scenario Reconciliation. La responsabilité reste de confronter les versions de demande et de ressources, qualifier les
    écarts et retenir une version cohérente ou une décision attendue, avant le calcul net distinct de Master Planning. Les
    corrections indirectes TER112/TER155 et la capture des décisions dans TER375/376 ne déplacent pas cette autorité. Aucun
    contrat de diffusion ou de capture nouvellement rédigé n’est validé par ce maintien.
- decision_id: ADOPT-U1113-REL-EXECUTION-FACTS-D04.i
  action: retain
  rationale: Le type shares-data reste adapté aux résultats de Service Reconciliation transmis à Sales Order. Le raccordement
    crédit, prix, magasin et fidélité ajouté U1115 ne transfère ni la reconnaissance du réalisé ni la validité des transitions
    ; les précisions TER112/155/375/376 sont compatibles. Reprise du seul type adopté U1113, sans accord sur les nouveaux
    contrats.
- decision_id: ADOPT-U1113-REL-EXECUTION-FACTS-D04.j
  action: retain
  rationale: Le partage des faits rapprochés vers Purchase Order reste un apport de connaissance pour tenir le réalisé et
    le reste à satisfaire. Les nouvelles chaînes demande, sélection, accord et suivi fournisseur distinguent toujours demande,
    engagement et réception ; les distinctions du glossaire restent compatibles. Reprise du seul type shares-data U1113, sans
    adoption des raccordements U1115 ni de leurs contenus.
- decision_id: ADOPT-U1113-REL-EXECUTION-FACTS-D04.k
  action: retain
  rationale: Le partage des résultats rapprochés vers Transfer Order demeure distinct du transfert engagé. Les libellés séparant
    implantation et réassort gardent les apports attendus comme connaissance, sans transformer les estimations en réalisations
    ; les ajustements du glossaire ne changent pas cette frontière. Reprise du seul type shares-data U1113.
- decision_id: ADOPT-U1113-REL-EXECUTION-FACTS-D04.l
  action: retain
  rationale: Les résultats rapprochés transmis à Return Order restent des faits à reconnaître par la famille de commande.
    Le nouveau raccordement fidélité utilise seulement les retours reconnus et préserve le non-double-compte ; il ne transforme
    pas un retour attendu en réalisé. Reprise du seul type shares-data U1113, sans accord sur la coopération fidélité ni sur
    les contrats détaillés.
- decision_id: ADOPT-U1113-REL-EXECUTION-FACTS-D04.m
  action: retain
  rationale: La fourniture des résultats rapprochés à Supplier Return Order reste un partage de données, distinct des engagements
    et transitions du retour fournisseur. Les nouvelles coopérations de suivi et évaluation fournisseur utilisent les mêmes
    faits avec provenance et non-double-compte ; elles ne changent pas le sens du type. Reprise du seul type shares-data U1113.
- decision_id: ADOPT-U1113-REL-SERVICE-CATALOG-PROMISING
  action: retain
  rationale: Availability reste le consommateur pertinent des conditions de Service Catalog pour évaluer une promesse. La
    consolidation du doublon catalogue vers Service Management conserve les engagements individuels dans les prestations ;
    la clarification TER112 sépare toujours évaluation et confirmation. Reprise du seul target_id=D03 U1113, sans adopter
    les compléments de contrat.
- decision_id: ADOPT-U1113-REL-EXECUTION-PROMISING
  action: retain
  rationale: Fulfilment Orchestration fournit toujours ses résultats et impacts à Order Management, qui conserve les engagements
    et leur révision. Les clarifications Availability, crédit, prix et Process Ledger ne déplacent pas cette autorité. Reprise
    du seul type shares-data U1113 ; aucun accord étendu aux contenus ou interfaces.
- decision_id: ADOPT-U1113-REL-EXECUTION-TRACKING-ORCHESTRATION
  action: retain
  rationale: Operations Tracking demeure le producteur des faits observés qui éclairent Fulfilment Coordination. La variation
    autorisée reçue de Fulfilment Adaptation Decision et les vues implantation/réassort ne confondent pas coordination, décision
    et réalisé. Reprise du seul type shares-data U1113 ; les contrats U1115 restent qualifiés séparément.
- decision_id: ADOPT-U1113-REL-EXECUTION-TRACKING-ADAPTATION
  action: retain
  rationale: Les faits et exceptions d’Operations Tracking éclairent toujours Fulfilment Adaptation Decision dans son mandat
    local, sans modifier seuls la promesse. Le partage de la variation retenue vers la coordination conserve cette distinction.
    Reprise du seul type shares-data U1113, sans adopter ce nouveau détail de contrat.
- decision_id: ADOPT-U1113-REL-NEEDS-U290-102
  action: retain
  rationale: Plan Application reste le consommateur du résultat de création ou modification autorisée de Purchase Order. Les
    nouvelles chaînes Procurement et la capture de ses événements dans Process Ledger ne lui transfèrent ni engagement fournisseur
    ni réalisation physique. Reprise du seul source_id=D02.e U1113 ; les contenus et nouveaux liens ne sont pas adoptés par
    report.
- decision_id: ADOPT-U1113-REL-NEEDS-U290-103
  action: retain
  rationale: Plan Application reste le consommateur du résultat d’application autorisée de Transfer Order. La séparation entre
    implantation et réassort et la référence des événements au Case ne modifient pas son rôle de suivi de prise en compte.
    Reprise du seul source_id=D02.e U1113.
- decision_id: ADOPT-U1113-REL-AUDIT-U435-PLNK-06
  action: retain
  rationale: Plan Application reste le consommateur du résultat porté par Consignment Fill-up Order. Les besoins d’implantation
    initiale et de réassort continu sont mieux distingués, sans déplacer la validité des transitions ou l’engagement de la
    commande. Reprise du seul source_id=D02.e U1113 ; les précisions et la nouvelle capture Case restent proposées.
- decision_id: ADOPT-U1113-REL-SUPPLY-PLAN-VISIBILITY
  action: retain
  rationale: Availability fournit toujours au Master Plan les possibilités de promesse et leurs limites, tandis que le Master
    Plan conserve les arbitrages collectifs. La correction de TER112 supprime les anciens commentaires contradictoires ; les
    nouvelles entrées objectifs et budgets ne changent pas ce partage de responsabilité. Reprise de source_id, target_id et
    type adoptés U1113 seulement.
- decision_id: ADOPT-U1113-REL-U673-PROMISING-ORDER
  action: retain
  rationale: Availability reste le producteur d’une proposition de promesse utilisée par Order Management, qui conserve confirmation
    et engagements. Les clarifications du glossaire et les chaînes Commerce/crédit ne transforment pas la proposition en réservation
    ou confirmation. Reprise des seuls source_id=D03 et type=shares-data U1113, sans adopter les contrats ni le consommateur
    par extension.
- decision_id: ADOPT-U1113-REL-U673-MATCHING-PROMISING
  action: retain
  rationale: Le Master Plan reste producteur du contexte collectif utilisé par Availability. Les nouveaux objectifs et budgets
    éclairent les arbitrages du plan sans faire porter à Availability la planification ou l’affectation ; TER112 est aligné
    sur cette frontière. Reprise des seuls source_id, target_id et type U1113.
- decision_id: ADOPT-U1113-REL-U673-ORDER-MATCHING
  action: retain
  rationale: Master Plan demeure le destinataire des commandes et engagements fournis par Order Management pour les besoins
    nets et les arbitrages collectifs. Les chaînes prix/crédit et les entrées budgétaires ne déplacent pas les engagements
    de commande. Reprise des seuls target_id=domain-plan et type=shares-data U1113.
- decision_id: ADOPT-U1113-REL-U673-PLANS-PROMISING
  action: retain
  rationale: Supply Plan Visibility reste le producteur de la connaissance contextualisée des apports pour Order Promising.
    Le passage de la contribution externe intégrée à shares-data en amont ne la confond pas avec un apport reçu ni une promesse
    ferme. Reprise des seuls source_id, target_id et type U1113, sans adopter les nouveaux contrats d’ingestion.
- decision_id: ADOPT-U1113-REL-U673-PLANS-MATCHING
  action: retain
  rationale: Planning Scenario Reconciliation fournit toujours à Master Planning les scénarios de demande et de ressources
    qualifiés avant calcul net. La consolidation du doublon Supply Assignment précise une coopération distincte de l’engagement
    et de la réservation ; les événements de plan liés au Case ne changent pas cette responsabilité. Reprise des seuls source_id,
    target_id et type U1113.
- decision_id: ADOPT-U1113-REL-U673-POLICIES-PROMISING
  action: retain
  rationale: Availability demeure le destinataire des règles locales actives pour établir une possibilité de promesse. Les
    exigences d’entreprise reçues par Supply Policy Management ne déplacent pas l’autorité des politiques locales ni ne confirment
    une commande ; TER112 reste compatible. Reprise des seuls target_id=D03 et type=shares-data U1113.
- decision_id: ADOPT-U1113-REL-U673-POLICIES-MATCHING
  action: retain
  rationale: Master Plan demeure le destinataire des règles actives de besoins nets et d’arbitrage collectif. Les nouveaux
    budgets, objectifs et exigences d’entreprise gardent leurs statuts et autorités propres ; une proposition du plan n’active
    toujours pas une politique. Reprise des seuls target_id=domain-plan et type=shares-data U1113.
- decision_id: ADOPT-U1113-REL-U673-FULFILMENT-MATCHING
  action: retain
  rationale: Master Plan reste le destinataire des impacts de Fulfilment Orchestration nécessitant un réarbitrage collectif.
    Le mandat local de coordination/adaptation et les contraintes budgétaires demeurent distincts de cette remontée d’impacts.
    Reprise des seuls target_id=domain-plan et type=shares-data U1113, sans accord étendu aux nouvelles coopérations.
- decision_id: ADOPT-U1113-REL-U673-CAPACITY-PROMISING
  action: retain
  rationale: Service Capacity Visibility fournit toujours à Availability des capacités de service contextualisées pour évaluer
    la faisabilité, sans réservation ni garantie implicite. La clarification TER112 et les notes de rattachement n’en changent
    pas le sens. Reprise des seuls source_id=D06.b, target_id=D03 et type=shares-data U1113.
- decision_id: ADOPT-U1113-REL-U673-PLAN-COVERAGE
  action: retain
  rationale: Supply Plan Visibility fournit toujours à Master Planning la projection d’apports utile au calcul net. Les corrections
    implantation/réassort et la consolidation Supply Assignment maintiennent la distinction entre projection, décision, commande
    et réalisation. Reprise du seul type shares-data U1113 ; aucun contrat détaillé nouveau adopté.
- decision_id: ADOPT-U1113-REL-U826-D01.g-TO-accounting-data-provision
  action: retain
  rationale: Le registre Inventory Ledger fournit toujours ses faits reconnus à Accounting Data Provision. Le nouveau lien
    vers Process Ledger transporte leur référence sans reproduire l’effet de stock, et le rapprochement propriété/positions
    préserve chaque registre. Reprise du seul type shares-data U1113, sans adoption du contrat de capture ni d’une écriture
    comptable détaillée.
- decision_id: ADOPT-U1113-REL-U826-inventory-ownership-ledger-TO-accounting-data-provision
  action: retain
  rationale: Inventory Ownership Ledger demeure producteur des faits de propriété reconnus utiles à Accounting Data Provision.
    La clarification des transferts établis et des références de propriété distingue mouvement physique, propriété et référence
    de Case ; elle ne change pas la nature du partage comptable. Reprise du seul type shares-data U1113.
- decision_id: ADOPT-U1113-REL-U826-D01.c-TO-planning-data-provision
  action: retain
  rationale: Inventory Visibility fournit toujours à Planning Data Provision les positions de stock documentées, avec limites
    de connaissance et non-double-compte. Les vues d’implantation/réassort ne créent aucun autre producteur du Master Plan.
    Reprise du seul type shares-data U1113 ; la restriction historique au stock documenté reste applicable.
- decision_id: ADOPT-U1113-REL-U848-PARENT-plans-ingestion
  action: retain
  rationale: Plan Ingestion reste rattachée à Master Plan Management, au plus près des plans alimentés. Les contributions
    externes intégrées deviennent des partages explicités vers leurs visibilités ; le producteur externe garde sa prévision
    et la réception locale conserve correction ou rejet. Reprise du seul source_id=ba-master-plan-management U1113, sans accord
    sur les nouveaux détails.
- decision_id: ADOPT-U1113-REL-U848-PARENT-master-data-ingestion
  action: retain
  rationale: Reference Maintenance reste le parent métier de Reference Ingestion, distinct de la diffusion par les producteurs
    externes. Les clarifications prix, crédit et événements ne transfèrent ni maîtrise d’entreprise ni contrôle transactionnel
    à cette réception locale. Reprise du seul source_id=ba-reference-maintenance U1113.
- decision_id: ADOPT-U1113-REL-U848-PARENT-accounting-data-provision
  action: retain
  rationale: Inventory State Management reste le parent d’Accounting Data Provision, près des registres qui produisent les
    faits de gestion. Les liens de références vers le Case et les clarifications de propriété ne déplacent pas ces producteurs
    ni la responsabilité comptable externe. Reprise du seul source_id=ba-inventory-position-management U1113.
- decision_id: ADOPT-U1113-REL-U848-PARENT-planning-data-provision
  action: retain
  rationale: Inventory State Management reste le parent de Planning Data Provision, près d’Inventory Visibility. Les clarifications
    des coopérations conservent la portée stock documenté seulement, avec les autres producteurs à qualifier. Reprise du seul
    source_id=ba-inventory-position-management U1113, sans extension à de nouveaux contenus du Master Plan.
- decision_id: ADOPT-U1113-REL-U848-PARENT-product-feedback
  action: retain
  rationale: Inventory State Management reste le parent de Product Feedback, conformément à l’origine des constats dans les
    registres de stock. Les clarifications des coopérations adjacentes n’en déplacent pas le producteur. Reprise du seul source_id=ba-inventory-position-management
    U1113 ; aucun contrat détaillé ou déploiement adopté par report.
- decision_id: ADOPT-U1113-REL-U885-process-mining-BHV082
  action: retain
  rationale: Process Mining conserve Process Ledger comme source des traces analysées. Les six nouveaux apports Case ajoutent
    des événements ou références avec identité, deux dates et corrections ; ils ne remplacent pas le registre par une vue
    courante ni ne prouvent une couverture installée exhaustive. Reprise du seul target_id=process-ledger U1113, sans adoption
    des nouveaux contrats de capture.
- decision_id: ADOPT-U1113-REL-U996-contextual-prices
  action: retain
  rationale: Sales Order demeure le consommateur du prix de vente contextualisé et conserve le prix engagé, la version et
    la révision autorisée. Le nouveau producteur Sales Price Determination appartient au même périmètre Commerce, et les précisions
    TER257/345 préservent prix proposé, engagement de vente et prix d’achat distincts. Reprise du seul target_id=D04.i U1113
    ; le nouveau source_id et les chaînes de détermination ne sont pas adoptés par ce report.
- decision_id: ADOPT-U1113-REL-U1101-forecast-to-demand-plan
  action: retain
  rationale: Plan Ingestion demeure le destinataire local du Forecast Plan source, avec réception, correction et rejet. Les
    nouvelles hypothèses Commerce, Sourcing et Finance enrichissent la prévision externe sans lui retirer son autorité ni
    créer une seconde source Supply. Reprise du seul target_id=plans-ingestion U1113 ; nouveaux apports et contrats non adoptés
    par report.
- decision_id: ADOPT-U1113-REL-U1113-sentry-events
  action: retain
  rationale: Process Sentry fournit toujours au Process Ledger les événements externes corrélés et les réactions. Le contrat
    commun U1115 conserve la même identité entre chemin direct et sentinelle, sans doubler le fait ni prouver une réalisation
    sur simple notification. Reprise des seuls source_id, target_id et type U1113 ; les nouveaux raccordements et contenus
    détaillés restent proposés.
- decision_id: ADOPT-U1113-REL-U1113-ledger-visibility
  action: retain
  rationale: Process Ledger fournit toujours l’histoire des faits du Case à Process, Tasks & Order Visibility pour une restitution
    datée. Les nouvelles captures conservent les deux dates, les corrections et les autorités des Orders et registres de stock
    ; elles ne font pas de la vue une autorité transactionnelle. Reprise des seuls source_id, target_id et type U1113, sans
    accord sur les compléments de capture.
- decision_id: ADOPT-U1113-REL-U1113-ledger-mining
  action: retain
  rationale: Process Ledger demeure le producteur des traces de Case analysées par Process Mining. Les nouveaux événements
    de service, décision et références de stock gardent provenance, dates et limites de couverture ; le mining n’invente pas
    les chemins absents. Reprise des seuls source_id, target_id et type U1113 ; les six nouveaux contrats et leur exhaustivité
    ne sont pas adoptés.
- decision_id: ADOPT-U1113-process-ledger
  action: retain
  rationale: Le nom Process Ledger et la nature ledger restent cohérents avec le registre durable des événements d’un Case,
    distinct des ledgers de stock et des vues d’analyse. L’ajout au périmètre explicite six familles d’événements ou références
    avec non-double-compte et autorités conservées ; il ne change pas cette identité. Reprise des seuls name et nature U1113
    ; le nouveau paragraphe de capture, ses contrats et la couverture installée ne sont pas adoptés par extension.
