  element_name: Intercompany order
  element_type: Concept et usage documentés
  relationship: Recouvrement partiel
  similarities: Une vente à un client externe peut être reliée à un achat de la société vendeuse et à une vente de la société
    du groupe qui fournit les produits.
  differences: Microsoft décrit des créations automatiques de commandes à deux ou trois branches. FLOW décrit les engagements
    et leurs liens sans imposer une automatisation ou un outil.
  flow_position: Intercompany qualifie la relation entre sociétés. Le scénario assemble des capacités réutilisables ; Intercompany
    Sales reste une variante d’exécution de Sales Order.
  status: proposed
  source_refs:
  - U830
  - U831
  - ELM437
  concept_name: Intercompany order
  scope_summary: Vente et achat entre sociétés d’un groupe.
  approach_summary: Relier les commandes de chaque société.
  definition_choice: Distinguer les engagements de chaque société, le trajet physique et les changements de propriétaire.
    Les fonctions du produit ne prescrivent pas la décomposition FLOW.
  term_choice: Intercompany conserve le terme des deux éditeurs pour une relation entre sociétés distinctes d’un même groupe
    ; il ne nomme pas une capacité autonome dans FLOW.
