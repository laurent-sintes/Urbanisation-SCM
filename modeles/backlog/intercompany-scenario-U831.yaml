decision_scope:
  accepted:
  - Conserver BHV069 Intercompany Sales comme comportement de D04.i Sales Order, au sens de variante d’exécution.
  - 'Illustrer la coopération des capacités par le récit fictif présenté sous U830 : A vend 100 vestes, B détient le stock
    et livre directement le client.'
  - Distinguer engagements commerciaux, mouvement physique, propriété et contributions comptables ; aucune capacité Intercompany
    autonome.
  proposed_after_agreement:
  - Détail des étapes et dépendances du parcours.
  - Classement, conditions, points de contrôle et rédaction de TER122.
  capture: 'record_field_agreement de scripts/scenario_catalog.py : titre, situation et nature illustrative uniquement ; empreintes
    dans le catalogue canonique.'
alignment:
  behavior: BHV069, son parent D04.i et ses champs sont inchangés ; le scénario référence ce comportement sans le convertir
    en capacité.
  business_glossary: TER122 explique Intercompany et renvoie aux commandes de vente et d’achat ; TER069 et TER070 restent
    inchangés.
  modeling_glossary: 'MOD015, MOD027 et MOD028 restent cohérents : aptitude durable, situation autonome et parcours de mobilisation
    sont distincts ; aucune modification.'
