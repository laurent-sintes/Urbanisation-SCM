id: MASTER-PLAN-MICROSOFT-ALIGNMENT-U1094
date: '2026-10-16'
status: applied_to_backlog
source_refs:
- U1094
decision: Aligner le Master Plan FLOW sur le calcul opérationnel des besoins nets documenté par Microsoft. Préparer séparément
  la prévision et la projection des ressources dans Business Operations ; qualifier en amont les hypothèses de collection
  de Design & Development.
market_comparison:
  microsoft: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/master-planning-home-page
  microsoft_forecasts: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/inventory-forecast
  sap_s4hana: https://learning.sap.com/courses/exploring-production-planning-in-sap-s-4hana/understanding-mrp-in-sap-s-4hana
  finding: Microsoft distingue forecast planning et master plan. SAP distingue demandes prévues ou commandées, stock et réceptions
    fermes dans le calcul MRP des besoins nets. FLOW sépare ces responsabilités sans calquer la hiérarchie produit.
  limits: Une prévision sélectionnée peut entrer dans un master plan ; l’alignement porte sur la fonction de calcul net, pas
    sur une exclusion absolue de la prévision ni sur un déploiement prouvé.
publication_delivery:
  state: applied
  source_refs:
  - U1094
  summary: Master Planning calcule les besoins nets opérationnels ; prévision et projection des ressources sont préparées
    en amont dans Business Operations, à partir notamment des hypothèses stratégiques de collection.
