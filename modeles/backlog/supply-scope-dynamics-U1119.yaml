offer_vs_business_scope:
  microsoft_source_ids:
  - MS1
  - MS6
  - MS7
  - MS8
  - MS9
  - MS10
  - MS14
  sap_source_ids:
  - SAP1
  - SAP10
  conclusion: Dynamics et S/4HANA couvrent plusieurs domaines EA du modèle. Un produit peut réunir plans, commandes, stocks,
    prix, sourcing, production, actifs et réalisation sans imposer leur rattachement à un domaine unique.
  FLOW_scope: Commandes et engagements à effet stock, inventaire et propriété, plans/arbitrages, possibilités de promesse,
    politiques, références locales, processus et prestations confiées.
  limits: Ni couverture complète du produit, ni choix de solution, ni disponibilité commerciale ou assemblage de licences
    déduits de ces documents.
subdomain_matrix:
- id: business-references
  name: Operational References
  model_scope: Tenir les références locales fiables et leur cohérence, alimentées par les domaines sources sans transférer
    la maîtrise d’entreprise.
  illustrative_node_ids:
  - master-data-ingestion
  - D08
  - D11
  relationship: Recouvrement partiel
  microsoft:
    source_ids:
    - MS7
  sap_s4hana:
    source_ids:
    - SAP7
  similarities: Données réutilisables, mise à disposition et contextes locaux sont distingués.
  differences: Microsoft décrit aussi définition centrale et création produit ; SAP les niveaux de données ERP. FLOW tient
    une source de vérité locale active alimentée par des autorités externes.
  benefit_of_FLOW_boundary: Conserver provenance, version, validité et cohérence sans réduire la responsabilité à une copie
    reçue.
  coverage_limits_or_gaps:
  - Aucun maître d’entreprise Beaumanoir ni contrat détaillé de chaque objet n’est démontré ; leur qualification reste requise.
  status: proposed_market_comparison
  business_adoption: false
- id: subdomain-policies
  name: Supply Policy Management
  model_scope: Tenir et rendre applicables stratégies, protections, limites et autorisations Supply.
  illustrative_node_ids:
  - demand-fulfilment-policy-management
  - D02.b
  - D19.b
  relationship: Recouvrement partiel
  microsoft:
    source_ids:
    - MS4
    - MS2
  sap_s4hana:
    source_ids:
    - SAP4
  similarities: Pools protégés, allocation et stratégies de réexamen encadrent les décisions et confirmations.
  differences: Les produits réunissent configuration et consommation. FLOW distingue recommandation de paramètres, politique
    active et réservation ; Product Allocation et allocation de groupe ne sont pas Supply Assignment.
  benefit_of_FLOW_boundary: Séparer le cadre applicable de l’arbitrage contextuel et éviter les doubles protections.
  coverage_limits_or_gaps:
  - Ces passages ne démontrent pas toutes les règles de gouvernance, dérogations, seuils de renouvellement ou restrictions
    prestataires FLOW.
  status: proposed_market_comparison
  business_adoption: false
- id: D01
  name: Inventory Management
  model_scope: Tenir faits reconnus, positions, réservations et changements de propriété du stock, avec historique et corrections.
  illustrative_node_ids:
  - D01.f
  - D01.g
  - D01.c
  - D02.c
  - D01.h
  - inventory-ownership-ledger
  relationship: Recouvrement partiel
  microsoft:
    source_ids:
    - MS3
  sap_s4hana:
    source_ids:
    - SAP3
  similarities: Stocks de sources multiples, états, mouvements et documents permettent d’expliquer les ressources connues.
  differences: Inventory Visibility Microsoft inclut ATP, allocation et soft reservation ; FLOW place la promesse dans Availability.
    SAP inclut valeurs et FI ; FLOW conserve les faits sans absorber les autorités comptables.
  benefit_of_FLOW_boundary: Séparer connaissance du stock, effets reconnus, protection et promesse, sans double imputation.
  coverage_limits_or_gaps:
  - Pas d’identité démontrée entre soft reservation et Reservation opposable FLOW, ni équivalence complète des deux ledgers
    et de leur contrat temporel.
  status: proposed_market_comparison
  business_adoption: false
- id: D04
  name: Order Management
  model_scope: Gérer le cycle complet des commandes à effet stock, leurs contenus, engagements, changements et restes à satisfaire.
  illustrative_node_ids:
  - D04.i
  - D04.j
  - D04.k
  - D04.l
  - D04.m
  - D04.n
  - D04.r
  - D04.t
  relationship: Recouvrement partiel
  microsoft:
    source_ids:
    - MS6
    - MS14
  sap_s4hana:
    source_ids:
    - SAP8
    - SAP9
  similarities: Commandes structurées, lignes, échéances, confirmation, reliquats, retours et documents liés sont décrits
    côté achats et ventes.
  differences: Les processus produit réunissent sourcing, prix, commandes, réalisation et finance. Procurement garde accords
    et décisions d’achat, Commerce les décisions commerciales et canaux ; FLOW garde le cycle et les engagements de la commande.
  benefit_of_FLOW_boundary: Une autorité de commande unique consomme les résultats autorisés sans cycle concurrent.
  coverage_limits_or_gaps:
  - Consignation, regroupement et résolutions des retours ne sont pas tous démontrés par ces documents. U1120 fixe la portée
    métier Beaumanoir ; aucune réalisation installée n’en découle.
  status: proposed_market_comparison
  business_adoption: false
- id: domain-plan
  name: Master Plan
  model_scope: Préparer demande et ressources opérationnelles, calculer les besoins nets, arbitrer le carnet et proposer les
    adaptations de stock.
  illustrative_node_ids:
  - D05.f
  - D03.m
  - D03.o
  - D05.e
  - D05.c
  - D02.e
  relationship: Recouvrement partiel
  microsoft:
    source_ids:
    - MS2
  sap_s4hana:
    source_ids:
    - SAP2
  similarities: Demandes connues, prévisions, stocks et ressources attendues alimentent besoins nets et propositions d’apport.
  differences: FLOW distingue préparation des plans, calcul net, priorités/affectations, optimisation du stock et application
    autorisée. Le cours SAP est centré sur la production et n’impose pas une fabrication Beaumanoir.
  benefit_of_FLOW_boundary: Distinguer demande retenue, proposition, manque et effet autorisé sans confondre apport proposé
    et commande ferme.
  coverage_limits_or_gaps:
  - L’appui MRP ne couvre pas toutes les affectations collectives, simulations ou arbitrages économiques FLOW. Aucun moteur
    unique ni transfert installé depuis MAP déduit.
  status: proposed_market_comparison
  business_adoption: false
- id: D03
  name: Availability
  model_scope: Déterminer et réexaminer quantités, dates et conditions proposées pour une demande identifiée.
  illustrative_node_ids:
  - ba-order-promising
  - D03.i
  - D03.j
  - D03.k
  relationship: Recouvrement partiel
  microsoft:
    source_ids:
    - MS5
  sap_s4hana:
    source_ids:
    - SAP4
  similarities: ATP/aATP évaluent quantités ou dates ; CTP Microsoft examine les capacités ; BOP SAP révise les confirmations
    lorsque la situation change.
  differences: FLOW sépare promesse proposée, affectation collective, confirmation et réservation. Les sections S/4HANA du
    cours IBP ne sont ni tout IBP ni toute Supply Assignment.
  benefit_of_FLOW_boundary: Éviter qu’une évaluation soit lue comme engagement, affectation ou réservation.
  coverage_limits_or_gaps:
  - PTP économique complet non prouvé par ces passages. Le détail SAP de toute la faisabilité CTP n’est pas établi par la
    seule section aATP.
  status: proposed_market_comparison
  business_adoption: false
- id: subdomain-process-management
  name: Process Management
  model_scope: Définir, conduire et superviser parcours et travail humain, conserver les événements du Case et analyser leurs
    traces.
  illustrative_node_ids:
  - workflow-definition-management
  - order-workflow-orchestration
  - order-workflow-sentry
  - process-ledger
  - process-mining
  relationship: Recouvrement partiel
  microsoft:
    source_ids:
    - MS11
    - MS12
    - MS13
  sap_s4hana:
    source_ids:
    - SAP5
  similarities: Workflows, tâches, décisions, approbations, activités de Cases et processus documentaires sont représentés
    dans les sources.
  differences: FLOW porte une conduite générique. VCM vise trois processus préconfigurés et conserve des IDs de documents
    sans leurs données métier. Historique workflow ou case log Microsoft ne vaut pas Process Ledger complet.
  benefit_of_FLOW_boundary: Séparer conduite du Case, états/engagements des commandes et faits/effets des ledgers de stock.
  coverage_limits_or_gaps:
  - Lacune Microsoft et SAP explicite pour Process Ledger exhaustif, reconstitution exacte à un instant t et chaînage Process
    Mining complet. SAP5 ne démontre pas tout le travail humain ni la définition générique de processus FLOW.
  status: proposed_market_comparison
  business_adoption: false
- id: D06
  name: Fulfilment Orchestration
  model_scope: Composer, coordonner et adapter les prestations confiées dans le mandat reçu, sans absorber l’organisation
    locale.
  illustrative_node_ids:
  - D06.d
  - D06.f
  - D06.e
  - D06.b
  - D07.d
  - D07.c
  - transport-plan-decision
  - service-order-release-decision
  relationship: Recouvrement partiel
  microsoft:
    source_ids:
    - MS11
    - MS9
  sap_s4hana:
    source_ids:
    - SAP5
  similarities: Orchestration multi-SI, chaînes documentaires et plans de transport se rapprochent de certaines coopérations
    FLOW.
  differences: VCM reste préconfiguré ; IOM et Transportation Management réunissent des fonctions que FLOW distingue. Process
    garde le parcours, Service Management les engagements et Logistics l’organisation/réalisation locales.
  benefit_of_FLOW_boundary: Délimiter mandat transverse, adaptations admises et impacts à transmettre au réexamen de plan
    ou promesse.
  coverage_limits_or_gaps:
  - Les sources SAP retenues ne démontrent pas toute la coordination spécialisée, l’adaptation et le rapprochement des prestations
    FLOW ; aucune équivalence complète à VCM/IOM.
  status: proposed_market_comparison
  business_adoption: false
- id: subdomain-service-orders
  name: Service Management
  model_scope: Tenir demandes, exigences et engagements individuels des prestations, leurs changements et résultats attendus.
  illustrative_node_ids:
  - service-order-transport
  - service-order-transport-booking
  - service-order-receiving
  - service-order-packing
  - service-order-billing
  - service-order-payment-collection
  relationship: Recouvrement partiel
  microsoft:
    source_ids:
    - MS10
    - MS9
    - MS8
  sap_s4hana:
    source_ids:
    - SAP6
  similarities: Service orders, niveaux de service, confirmations et facturation documentent une partie du suivi des prestations.
  differences: Service management Microsoft et Service S/4HANA visent surtout le service client terrain. FLOW couvre aussi
    prestations logistiques, douanières et financières, sans catalogue natif complet équivalent.
  benefit_of_FLOW_boundary: Conserver le responsable de chaque engagement sans absorber les opérations locales ni imposer
    un achat à chaque prestation.
  coverage_limits_or_gaps:
  - Homonymie partielle. Lacune Microsoft/SAP explicite pour l’ensemble des familles FLOW ; les sources de visites/réparations
    terrain ne suffisent pas à la combler.
  status: proposed_market_comparison
  business_adoption: false
