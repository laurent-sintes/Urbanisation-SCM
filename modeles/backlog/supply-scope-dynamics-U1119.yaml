  - MS9
  - SAP1
  - SAP3
  responsibility_ids:
  - domain-logistics-execution
  - domain-warehousing
  - domain-transportation
  - domain-customs-management
  disposition: Logistique externalisée. Supply Chain Management pilote les engagements confiés et la coordination transverse
    ; Logistics organise ses moyens et réalise localement.
  limits: Externaliser ne supprime pas le management Supply ; les décisions des autorités douanières restent distinctes des
    prestations confiées.
  gap_status: documented_boundary
- topic: Sourcing, consultations et accords d’achat
  source_ids:
  - MS6
  - SAP8
  responsibility_ids:
  - domain-sourcing-procurement
  - subdomain-purchase-contract-management
  disposition: Procurement garde sélection, négociation et accords ; Supply Chain Management garde le cycle complet des commandes
    d’achat à effet stock.
  limits: Le produit ne prescrit ni second cycle de Purchase Order ni même parent métier.
  gap_status: documented_boundary
- topic: Canaux Commerce, réseau, backoffice, prix et dispositifs commerciaux
  source_ids:
  - MS1
  - MS14
  - SAP9
  responsibility_ids:
  - domain-sales
  - subdomain-pricing-promotions-management
  - subdomain-rebates-incentives-management
  disposition: Pilotage des canaux/réseau/backoffice et décisions commerciales hors domaine ; Supply Chain Management gère
    les commandes à effet stock et leur prix engagé.
  limits: Ces frontières de responsabilité ne s’opposent pas au nom SCM. Les pages retenues ne démontrent pas toutes les règles
    de promotions/primes.
  gap_status: documented_boundary
- topic: Finance, valorisation et règlements
  source_ids:
  - MS1
  - SAP3
  - SAP6
  responsibility_ids:
  - domain-finance
  - subdomain-financial-accounting
  - subdomain-cost-profitability
  - subdomain-commercial-settlement-management
  disposition: Méthodes et décisions financières restent sous Finance. Ledgers et Accounting Data Provision transmettent les
    faits ; Billing/Payment gardent leurs services autorisés.
  limits: FI et coûts/factures natifs ne transfèrent pas l’autorité comptable ; Payment client n’est pas étendu aux règlements
    fournisseurs. Pas d’audit exhaustif Finance.
  gap_status: documented_boundary
- topic: Définition produit et données sources
  source_ids:
  - MS7
  - SAP7
  responsibility_ids:
  - system-design-development
  - domain-product-definition-lifecycle
  disposition: Définitions et versions sources restent dans les responsabilités amont ; Operational References tient une source
    locale active.
  limits: Ni copie passive ni transfert de maîtrise d’entreprise ; autorité précise de chaque objet à qualifier.
  gap_status: documented_boundary
- topic: Gestion industrielle des actifs
  source_ids:
  - MS1
  - SAP1
  responsibility_ids: []
  disposition: Non détaillée dans le périmètre actuel ; présence dans une suite ne suffit pas à imposer une capacité FLOW.
  limits: Applicabilité non évaluée ici ; ne pas la déduire de la seule absence de fabrication.
  gap_status: applicability_not_assessed
naming_conclusion:
  status: adopted_under_U1121
  source_refs:
  - U1120
  - U1121
  domain_id: supply-chain-orchestration
  name: Supply Chain Management
  scope_change: false
  primary_support:
  - MS1
  - SAP10
  - CSCMP1
  terminology_comparisons:
  - KINAXIS1
  - ORACLE1
  reason: Management exprime les responsabilités durables de commandes et engagements, stock et propriété, plans/arbitrages,
    politiques, références et processus, en plus de la coordination des prestations. U1120 explique l’absence de production
    ; l’externalisation logistique conserve un pilotage Supply. Sourcing et canaux restent des frontières EA, sans interdire
    le nom.
  inference: CSCMP décrit un champ de management/coordination ; Microsoft et SAP emploient SCM pour une portée large. Cela
    appuie le nom dans le contexte FLOW sans imposer le contenu intégral d’une suite ni toutes les activités à chaque entreprise.
  orchestration_term_not_disqualified: Kinaxis emploie Orchestration au-delà de l’exécution et Oracle conserve Supply Chain
    Orchestration. Le renommage FLOW ne rend pas ces usages faux et ne réécrit pas leurs noms natifs.
  boundaries_preserved:
  - Autorités produit et prévision source
  - Sourcing et négociation
  - Décisions commerciales et pilotage des canaux
  - Autorités financières et comptables
  - Organisation et réalisation locales de Logistics
  adoption_limit: Accord sur le nom du domaine seulement ; TER035 aligné éditorialement. Aucun accord global sur les comparaisons,
    corrections proposées, produits ou licences.
