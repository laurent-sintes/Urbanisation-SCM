- U1121
purpose: Comparer le périmètre métier local à Microsoft Dynamics 365 et aux appuis pertinents SAP S/4HANA, sans faire de l’offre
  logicielle la taxonomie FLOW.
related_audit: supply-definitions-boundaries-audit-U1119.yaml
baseline:
  domain_id: supply-chain-orchestration
  name_at_audit: Supply Chain Orchestration
  adopted_name_U1121: Supply Chain Management
  model_sha256_at_audit: 48f0868944b027076b52ad678842b68d5b62c3517bda5de8f8c251e111e57b65
  glossary_sha256_at_audit: 4e0bcfd17df97d132b645bfefaf64fd6a2821ef13d836311715dbdb5f46781c6
  scope_change: false
qualification:
  naming: Nom du domaine Supply Chain Management adopté U1121 à périmètre constant.
  market_comparisons: Correspondances détaillées et formulations de comparaison proposées ; aucun accord étendu.
  new_agreement_scope: Seul nodes/supply-chain-orchestration.name est nouvellement capturé. TER035 est aligné éditorialement
    avec même ID/définition inchangée, sans accord autonome.
  canonical_changes_by_this_annex: false
  publication: false
  product_selection: false
  license_choice: false
method:
  evidence_reuse: Passages effectivement consultés par la racine le 2026-10-16 puis transmis pour consolidation. Aucune nouvelle
    lecture web par cet agent. Les résumés sont des paraphrases, pas des citations verbatim.
  comparison_rule: Chaque ligne possède un document Microsoft et un document SAP S/4HANA pertinents et délimités. Toute partie
    non démontrée reste une limite/lacune explicite ; deux éditeurs ne prouvent ni consensus ni équivalence complète.
  product_boundary: Distinguer responsabilité métier, regroupement logiciel, réalisation, couverture documentaire, offre commerciale
    et licence.
  SAP_scope_control: SAP4 est un cours IBP utilisé seulement pour ses sections S/4HANA aATP/BOP/Product Allocation. SAP10
    est utilisé pour les capabilities SCM S/4HANA Cloud Public/Private Edition ; IBP/GTS et autres produits de la page ne
    sont pas amalgamés.
  unavailable_sources: Les pages SAP Help de vue S/4HANA et de BOP au corps vide ont été remplacées par SAP Learning réellement
    lu ; elles ne servent pas d’appui de contenu.
  U431: Aucun réexamen du découpage ou du nombre des comportements clos U431.
coverage:
  subdomain_rows: 9
  domain_and_descendants_in_related_audit: 220
  microsoft_documents: 14
  sap_documents: 10
  additional_primary_sources: 3
  consulted_on: '2026-10-16'
