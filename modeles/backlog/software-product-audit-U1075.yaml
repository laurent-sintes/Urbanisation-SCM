id: software-product-audit-U1075
as_of: '2026-10-14'
status: applied
source_refs:
- U1074
- U1075
scope: 'Douze fiches : onze produits éditeurs et Flow Core System interne cible. Audit du catalogue applicatif, de ses sources
  et de son affichage ; aucun ajout de nœud métier ni étude d’un SI non évalué.'
method:
- Lecture des fiches, des composants et de chaque correspondance métier ; confrontation des responsabilités aux définitions
  canoniques.
- 'Recherche primaire : pages produit, documentation fonctionnelle, guides techniques, communiqués datés, chronologies et
  logos servis par les sites éditeurs.'
- Distinction lancement produit, création de l’entreprise, acquisition, édition documentaire et mise en service d’un SI. Conservation
  de la précision des dates et qualification des lacunes.
- Application au YAML canonique et à la fiche Atlas ; contrôles des canaux, composants, sources, dates, logos et intégrité
  de publication.
baseline:
  products: 12
  vendor_products: 11
  vendor_products_with_logo: 1
  vendor_products_with_launch_date: 0
  vendor_products_with_latest_release: 0
  components: 60
  offering_mappings: 73
findings:
- id: AUD-APP-01
  finding: NewStore et SoCloz ne montraient pas leur contribution au commerce B2C en ligne.
  action: Correspondances OMS vers Digital Commerce ; Shopping App et Studio CMS NewStore ajoutés avec liens propres.
  status: applied
- id: AUD-APP-02
  finding: Les paiements NewStore étaient rapprochés de Commercial Settlement Management, qui porte ristournes et commissions.
  action: Retrait de la correspondance erronée ; lien vers Payment pour l’encaissement des achats.
  retired_mapping_ids:
  - offer-newstore-payments-settlement
  status: applied
- id: AUD-APP-03
  finding: L’offre Y2 omettait fidélité, promotions, Négoce et achats ; SAP ECC omettait stocks, FI et CO ; Centric omettait
    matières, échantillons et dossiers.
  action: Ajout des composants et correspondances documentés, sans activation implicite dans les SI.
  status: applied
- id: AUD-APP-04
  finding: Elastic omettait campagnes et personnalisation ; SoCloz clienteling et retour ; Storeland collection, prix et opérations
    magasin ; Winstore commandes assistées et retours.
  action: Compléments sourcés aux arbres et périmètres.
  status: applied
- id: AUD-APP-05
  finding: Un seul logo éditeur / produit était enregistré.
  action: Logos officiels locaux pour tous les produits du marché ; distinction logo de produit / logo de l’éditeur pour SAP,
    Salesforce, Centric et produits Cegid.
  status: applied
- id: AUD-APP-06
  finding: Le champ de lancement exigeait une date au jour et la fiche ne distinguait pas les versions connues d’une dernière
    release.
  action: Historique sourcé à précision année, mois ou jour ; suivi de version documentée avec date de vérification et lacunes.
    Aucun jour artificiel ou dernière build inventée.
  status: applied
- id: AUD-APP-07
  finding: La source du storefront SFCC décrivait en fait son raccordement à Salesforce Order Management.
  action: Référence corrigée vers les API B2C de catalogue, panier et commande ; offres Salesforce distinctes explicitées.
  status: applied
- id: AUD-APP-08
  finding: Les tests validaient des listes de composants et liens existantes sans vérifier la cohérence entre les canaux documentés
    et les correspondances métier.
  action: Contrôles de canaux, composants non mappés, logo, dates et sources ; empreintes de livraison sur produits et sélections.
  status: applied
- id: AUD-APP-09
  finding: Une preuve publique décrit des Shopping Apps Roxy et Quiksilver sous Boardriders.
  action: Sélection qualifiée uniquement pour ces applications et leur périmètre publié ; absence de déduction sur les POS
    et le routage OMS.
  status: applied
source_policy:
  authority: Sources primaires de l’éditeur concerné ; les appuis Microsoft Dynamics / SAP S/4HANA existants des fiches métier
    sont conservés. Il ne s’agit pas de leur réécriture ni d’une comparaison de marché des responsabilités métier.
  access_limits: Certains portails SAP et Cegid ne rendent que du texte indexé ou demandent une authentification. Ces limites
    sont exposées dans la documentation des produits ; une page de référence ou un numéro documentaire n’est pas présenté
    comme la dernière version disponible.
  preserved_si_unknowns: Pas de version d’instance ou date globale de déploiement déduite d’une acquisition, d’une documentation
    ou d’un cas client limité à une marque.
glossary_alignment: Définitions Digital Commerce, Wholesale Commerce, Payment et Commercial Settlement Management contrôlées,
  frontières conservées. Quinze entrées explicatives ajoutées pour les sigles et termes des fiches produit ; OMS logiciel
  est distingué du sens fonctionnel FLOW de TER034.
