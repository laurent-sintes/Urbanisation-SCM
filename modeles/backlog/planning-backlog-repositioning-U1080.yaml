request:
  verbatim: Je pense que les problématiques de planification et des gestion de carnet de commande doit etre mise en exergue.
    Le domaine Demand & Supply Planning est trop mis en exergue. J'aime l'approche master plan microsoft car c'est vrai que
    centraliser la planification et l'optimisation est sans doute plus efficace que de disperser les responsabilités.
  validation: Je valide
  scope: Planning & Optimization et Order Backlog visibles sous Supply Chain Orchestration ; responsabilités de Demand & Supply
    Planning repositionnées ; préparation des collections et engagements conservés chez leurs responsables.
