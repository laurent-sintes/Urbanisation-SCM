  microsoft: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/master-planning-home-page
  sap_s4hana: https://learning.sap.com/courses/exploring-business-processes-in-sap-s-4hana-production-planning/evaluating-planning-results
