decision:
  status: adopted_principles
  scope: Retrait des couches métier ; univers/domaines en interaction ; Atlas strictement métier. Les détails de découpage
    et de migration ne sont pas adoptés par extension.
  canonical_principles:
  - PRINCIPLE-DOMAIN-INTERACTIONS
  - PRINCIPLE-ATLAS-BUSINESS-SCOPE
retired_principles:
- previous:
    id: PRINCIPLE-TWO-LAYERS
    statement: Socle transactionnel et modèle processus distincts ; chacun possède ses objets, sa persistance et son urbanisation.
    source_refs:
    - U18
    - U19
    - U20
    - U49
    - U50
    - U62
  retired_by: U455
  identifier_reuse: false
example:
  user_example: Commerce capte des intentions et les transforme en engagement via la Supply qui elle-même le concrétise via
    la logistique.
  interpretation: Coopération autour du résultat métier, avec retours sur possibilités, engagement, progression et réalisation
    ; pas un workflow universel ni une création de trois domaines.
  illustrative_interactions:
  - 'Commerce vers Supply : intention et attentes de satisfaction.'
  - 'Supply vers Commerce : possibilités et engagement de satisfaction.'
  - 'Supply vers logistique : prestations attendues et conditions métier.'
  - 'Logistique vers Supply : progression, faits de réalisation et écarts.'
  not_adopted:
  - Noms anglais, niveau univers/domaine et parents de Commerce et Logistics.
  - Assimilation de Business Services à Commerce.
  - Nouveaux propriétaires, applications ou flux installés Beaumanoir.
  - Renommage ou déplacement de Process Management, Orchestration et Tracking.
atlas_scope:
  included:
  - Univers, domaines, capacités et comportements.
  - Interactions et parcours métier, responsabilités, limites, engagements et invariants.
  - Objets, informations, structures conceptuelles métier, documents et faits.
  - Autorités et sources d’alimentation exprimées comme responsabilités métier.
  excluded:
  - Catalogue de produits logiciels ou applications et couverture installée.
  - Schémas API, messages techniques, tables, composants et déploiements.
  - Liens ou vues vers les réalisations de solution.
  market_material: 'U459 corrige l’interprétation C106/U458 : les comparaisons et leur positionnement métier sont visibles
    dans Atlas, avec les sources primaires externes. Réserves, statuts de revue et sources backlog restent internes. Aucune
    application installée ou solution choisie n’en est déduite.'
migration:
  status: implemented_current_model_and_reader_future_publication_pending
  reason: 'U458 : retrait des 142 champs layer, contrôles compatibles avec les publications historiques, corrections éditoriales
    ciblées et parcours publics métier appliqués. Guide révisé préparé en brouillon pour la prochaine publication ; index
    et versions publiées inchangés.'
  items:
  - Retirer layer des données courantes et des comparaisons d’appartenance ; prévoir lecture des anciens snapshots.
  - Remplacer les mentions de couches dans les six scopes D14, D07.d, D06, D06.d, D06.f, BHV082 et relire les qualifications
    héritées.
  - Adapter schéma, validation, suivi des révisions, tests et chargement frontend de façon compatible avec les preuves historiques.
  - Préparer un nouveau guide lié à la future publication ; ne pas modifier le guide versionné existant.
  - 'U459 : conserver les comparaisons produits comme références métier visibles ; les vues de réalisation restent hors Atlas.'
  protected:
  - Publications, révisions et preuves historiques.
  - Noms, parents, capacités, comportements et relations courants hors des formulations à revoir.
  evidence: audits/2026-09-19-plan-U458/rapport.md
  guide_draft: modeles/modeling-guides/versions/2026-09-22.2.yaml
  follow_up_U459: Repères marché rétablis dans toutes les fiches métier ; état non documenté explicite sans héritage implicite
    des comparaisons des descendants. Guide pédagogique sans simulateur de réalisations conservé.
  follow_up_U463:
    report: audits/2026-09-19-definition-supply-U463/rapport.md
    scope: Définition de universe-supply et termes TER034/TER035 alignés sur les responsabilités métier ; deux rapprochements
      sourcés et exemple U455 sur la fiche de l’univers.
    limits: Retrait de la qualification transactionnelle du périmètre et de la hiérarchie OMS/Supply. Les citations historiques
      et les mécanismes techniques documentés restent conservés ; aucune suppression lexicale générale ni nouveau découpage.
market_comparison:
  comparison_ref: CMP174
  sources:
  - ELM278
  - ELM279
  benefit: Séparer structure durable des responsabilités et lecture des coopérations ; garder les données utiles au métier
    sans dériver vers les solutions.
  limits: TOGAF consulté en édition 9.2 pour ce passage ; Microsoft décrit un produit. Aucun standard ne prescrit le découpage
    FLOW ni ne prouve une origine SAP des anciennes couches.
