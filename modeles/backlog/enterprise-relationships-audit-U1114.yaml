  observation: 'Le registre conserve explicitement les événements de neuf producteurs : orchestration, planification de parcours,
    contributions humaines, affectations, échéances, interventions, exceptions, sentinelle et Order Management. Les transitions
    reconnues des familles Service Management et les références des décisions ou faits de stock mobilisés par un Case n’ont
    pas de contrat de capture explicite. Les résultats rapprochés transmis à la sentinelle couvrent une partie des faits de
    service, sans démontrer la couverture de toutes les transitions métier de la famille.'
  impact: La structure permet déjà registre → visibilité → mining, mais elle ne permet pas d’affirmer que l’état d’un Case
    peut être reconstruit pour tous ses événements métier. La limite est celle de la couverture documentée, pas celle de l’existence
    du registre.
  recommendation: 'Définir un contrat commun de capture des événements reconnus d’un Case : producteur, lien au Case, date
    du fait/date de connaissance, version, correction et référence au fait d’origine. Qualifier quels événements Service Management
    et quelles références de décisions ou faits de stock sont nécessaires au dossier, puis leur chemin de capture direct ou
    via Sentry.'
