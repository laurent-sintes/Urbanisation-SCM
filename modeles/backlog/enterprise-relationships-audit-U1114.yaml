findings:
- id: EA-CHAIN-01
  priority: P1
  title: L’offre commerciale publiée n’est reliée à aucun de ses parcours consommateurs
  kind: missing_documented_chain
  object_ids:
  - cap-assortment-eligibility-management
  - cap-commercial-catalog-publication
  - cap-wholesale-offer-preparation
  - cap-wholesale-sales-engagement
  - cap-digital-sales-journey-management
  - cap-in-store-sales-journey-management
  evidence:
  - object_id: cap-commercial-catalog-publication
    field: fields.scope
    value: |-
      Diffuser aux canaux et clients une présentation commerciale valide des produits autorisés.

      Présentation et diffusion de l’offre ; ne pas redéfinir les produits, les prix ou l’admissibilité. La liste d’assortiment SAP est un appui plus étroit que tout catalogue commercial.
    transverse_incident_ids: []
  - object_id: cap-wholesale-offer-preparation
    field: fields.scope
    value: Sélectionner les produits et conditions proposés au revendeur pour une saison, puis rendre la proposition disponible
      au parcours de vente wholesale. Le résultat est une offre, distincte de la demande et de la commande du client ; l’assortiment
      et le prix restent sous leurs autorités respectives.
    transverse_incident_ids: []
  - object_id: cap-digital-sales-journey-management
    field: fields.scope
    value: Présenter une offre commerciale autorisée, permettre au client de choisir, constituer son panier et soumettre une
      demande de vente en ligne. Montrer le suivi commercial sans décider des engagements de la commande. [Sales Order](model:D04.i)
      tient identité et transitions ; [Store Order Preparation & Handover](model:cap-store-order-preparation-handover) peut
      réaliser un retrait en magasin.
    transverse_incident_ids:
    - REL-U1091-digital-demand-to-sales-order
    - REL-U1113-sales-order-cap-digital-sales-journey-management
  consequence: Le modèle décrit une offre autorisée préalable à la vente, mais son graphe ne permet pas de retrouver quels
    parcours reçoivent l’assortiment, le catalogue ou la proposition wholesale. Les 9 relations Commerce sont toutes externes.
  proposal: Relier explicitement admissibilité→publication/proposition, catalogue→parcours de vente et proposition wholesale→Wholesale
    Sales Engagement avec produits, destinataires, validité et version. Conserver une dépendance distincte si seule une condition
    de capacité est connue.
  reserve: Ce sont des relations cible entre objets déjà décrits ; ne pas transformer le catalogue en maître produit ou l’assortiment
    en affectation de stock. Pas de diffusion à tous les canaux par défaut.
  market_source_ids:
  - MS-ASSORTMENT
  - SAP-ASSORTMENT
  prior_audit: Nouveau périmètre Enterprise Architecture ; ne réouvre pas les corrections U1113.
  status: proposed
  not_installed_claim: true
  recommendation_status: proposed_not_adopted
- id: EA-CHAIN-02
  priority: P1
  title: La production des prix est isolée des règles et de la vente
  kind: missing_documented_chain
  object_ids:
  - cap-sales-pricing-rule-management
  - cap-promotion-rule-management
  - cap-sales-price-determination
  - cap-wholesale-offer-preparation
  - cap-store-checkout-management
  - D04.i
  - REL-U996-contextual-prices
  evidence:
  - object_id: cap-sales-price-determination
    field: fields.scope
    value: Calculer le prix contextualisé selon produit, client, canal et date à partir des règles approuvées par [Sales Pricing
      Rule Management](model:cap-sales-pricing-rule-management) et des promotions autorisées. Fournir le prix proposé à la
      vente ; [Order Management](model:D04) conserve le prix engagé.
    transverse_incident_ids: []
  - object_id: cap-sales-pricing-rule-management
    field: fields.scope
    value: Définir les tarifs, conditions et priorités de prix autorisés. Le résultat est une règle valide à utiliser par
      [Sales Price Determination](model:cap-sales-price-determination), pas le prix engagé d’une commande.
    transverse_incident_ids: []
  - object_id: cap-promotion-rule-management
    field: fields.scope
    value: |-
      Définir une mécanique promotionnelle, ses bénéficiaires, sa validité et ses conditions d’application.

      Les règles promotionnelles sont combinées par Pricing ; la planification des ressources de la promotion reste extérieure.
    transverse_incident_ids: []
  consequence: La seule relation de prix part du sous-domaine Pricing & Promotions Management vers Sales Order ; la capacité
    qui calcule le prix n’a aucune relation transverse. Les règles et promotions citées comme entrées ne sont pas raccordées,
    ni les offres et ventes immédiates consommatrices.
  proposal: Documenter règles/promotion→Sales Price Determination, puis les prix proposés vers les consommateurs prouvés ;
    préciser demande de calcul, contexte et résultat si l’interaction est transactionnelle. Rattacher le flux existant à son
    producteur exact ou déclarer sa maille agrégée.
  reserve: Ne pas étendre les seuls prix de vente aux Purchase Orders ; la conservation du prix engagé reste dans la famille
    de commande. La rétroactivité et la fréquence restent à qualifier.
  market_source_ids:
  - MS-PRICING
  - SAP-PRICING
  prior_audit: Nouveau périmètre Enterprise Architecture ; ne réouvre pas les corrections U1113.
  status: proposed
  not_installed_claim: true
  recommendation_status: proposed_not_adopted
- id: EA-CHAIN-03
  priority: P1
  title: Le magasin peut recueillir une commande à servir sans relation vers Sales Order
  kind: missing_documented_chain
  object_ids:
  - cap-in-store-sales-journey-management
  - cap-store-checkout-management
  - D04.i
  - REL-U1091-digital-demand-to-sales-order
  - REL-U1091-wholesale-demand-to-sales-order
  evidence:
  - object_id: cap-in-store-sales-journey-management
    field: fields.scope
    value: Conseiller le client, constituer son choix et recueillir une demande d’achat ou de commande en magasin. [Store
      Checkout Management](model:cap-store-checkout-management) réalise la transaction de caisse ; une commande à livrer ou
      retirer mobilise [Sales Order](model:D04.i).
    transverse_incident_ids: []
  - object_id: cap-store-checkout-management
    field: fields.scope
    value: Enregistrer la transaction de vente, l’encaissement et les retours ou échanges au point de vente. Transmettre les
      faits de vente et de paiement utiles aux périmètres concernés ; une commande à servir conserve son identité dans [Sales
      Order](model:D04.i).
    transverse_incident_ids: []
  consequence: Les demandes digitales et wholesale sont reliées à Sales Order avec leurs retours ; la variante magasin à livrer
    ou retirer, explicitement décrite, n’a aucun lien équivalent et aucun retour d’acceptation/engagement.
  proposal: Distinguer vente immédiate de la demande magasin à satisfaire ; qualifier l’émetteur entre le parcours magasin
    et la caisse, relier la demande autorisée à Sales Order, puis le résultat d’acceptation et le suivi au parcours demandeur.
  reserve: Une transaction encaissée et emportée ne doit pas créer artificiellement une commande restant à servir. Ne pas
    dupliquer les retours digital/wholesale U1113.
  market_source_ids:
  - MS-STORE
  - SAP-STORE
  prior_audit: Nouveau périmètre Enterprise Architecture ; ne réouvre pas les corrections U1113.
  status: proposed
  not_installed_claim: true
  recommendation_status: proposed_not_adopted
  related_findings:
  - EA-CHAIN-04
  - EA-CAT-04
- id: EA-CHAIN-04
  priority: P1
  title: Les ventes et encaissements de caisse sont décrits mais sans sortie structurée
  kind: missing_documented_chain
  object_ids:
  - cap-store-checkout-management
  - cap-store-stock-operations-management
  - D01.f
  - subdomain-financial-accounting
  - subdomain-treasury-cash
  - subdomain-commercial-settlement-management
  evidence:
  - object_id: cap-store-checkout-management
    field: fields.scope
    value: Enregistrer la transaction de vente, l’encaissement et les retours ou échanges au point de vente. Transmettre les
      faits de vente et de paiement utiles aux périmètres concernés ; une commande à servir conserve son identité dans [Sales
      Order](model:D04.i).
    transverse_incident_ids: []
  - object_id: subdomain-treasury-cash
    field: fields.scope
    value: Ne transfère pas à FLOW la trésorerie ni les paiements fournisseurs ; les faits d’encaissement et décaissement
      alimentent les prévisions.
    transverse_incident_ids: []
  - object_id: cap-store-stock-operations-management
    field: fields.scope
    value: Constater les quantités reçues, compter le stock, qualifier les écarts et déplacer des biens entre réserve et surface
      de vente. Fournir les faits physiques au Core sans décider de promesse ni d’affectation. [Store Order Preparation &
      Handover](model:cap-store-order-preparation-handover) traite les commandes à remettre.
    transverse_incident_ids:
    - REL-U1091-store-stock-facts-to-inventory
  consequence: Store Checkout Management annonce la transmission des faits de vente et de paiement mais ne possède que son
    parent. Le modèle ne montre ni la reconnaissance des sorties/retours de stock issus de vente immédiate, ni le destinataire
    financier des faits monétaires. Les ledgers de stock ne peuvent être présumés producteurs d’un encaissement.
  proposal: Qualifier séparément faits physiques→Inventory Tracking (directement ou via Store Stock Operations selon le mandat
    établi), transactions de vente/paiement→Finance et faits éligibles→Settlement ; faire porter chaque diffusion à son producteur.
  reserve: La voie précise et les autorités financières doivent être établies ; ne pas attribuer la comptabilité ou le paiement
    à Inventory et ne pas confondre encaissement confirmé avec demande de paiement.
  market_source_ids:
  - MS-STORE
  - SAP-FSD
  prior_audit: Nouveau périmètre Enterprise Architecture ; ne réouvre pas les corrections U1113.
  status: proposed
  not_installed_claim: true
  recommendation_status: proposed_not_adopted
- id: EA-CHAIN-05
  priority: P1
  title: Le parcours d’achat est interrompu avant l’engagement de commande
  kind: missing_documented_chain
  object_ids:
  - cap-purchase-requisition-handling
  - cap-supplier-eligibility-assessment
  - cap-supplier-consultation-coordination
  - cap-supplier-offer-selection
  - cap-purchase-agreement-lifecycle-management
  - cap-purchasing-case-coordination
  - D04.j
  evidence:
  - object_id: cap-purchase-requisition-handling
    field: fields.scope
    value: |-
      Qualifier un besoin d’achat et produire une demande autorisée avant tout engagement fournisseur.

      Les plans et propositions de FLOW ne valent pas demande approuvée.
    transverse_incident_ids: []
  - object_id: cap-supplier-offer-selection
    field: fields.scope
    value: |-
      Évaluer les offres, négocier leurs conditions proposées et choisir la source pour le besoin.

      Formalisation des accords sous [Purchase Contract Management](model:subdomain-purchase-contract-management) ; pas achat implicitement engagé.
    transverse_incident_ids: []
  - object_id: cap-purchase-agreement-lifecycle-management
    field: fields.scope
    value: |-
      Formaliser et maintenir les conditions d’un accord d’achat pendant sa période de validité.

      Accord cadre et prix d’achat distincts du cycle d’une commande.
    transverse_incident_ids: []
  consequence: Aucune relation transverse interne ne relie les 10 capacités Procurement ; les 3 sorties existantes concernent
    des changements/réponses de commande et des barèmes de ristourne. Le besoin approuvé, l’offre retenue et l’accord/prix
    d’achat n’ont pas de destinataire structuré vers la commande.
  proposal: 'Modéliser les passages attestés : besoin→consultation, admissibilité→sélection, offre retenue→formalisation d’accord,
    demande autorisée/conditions d’achat→Purchase Order, puis état d’application vers le parcours d’achat ; les voies directes
    sans consultation ou sans accord restent possibles et explicites.'
  reserve: Pas de séquence obligatoire unique ni d’achat automatiquement engagé par la sélection. Le flux de réponse fournisseur
    U1091 et le suivi du document dans SCO restent préservés. Les maîtres partenaires restent une lacune distincte déjà reconnue
    U1113.
  market_source_ids:
  - MS-PROCUREMENT
  - SAP-RFQ
  prior_audit: Nouveau périmètre Enterprise Architecture ; ne réouvre pas les corrections U1113.
  status: proposed
  not_installed_claim: true
  recommendation_status: proposed_not_adopted
  related_findings:
  - EA-CHAIN-06
  - EA-CHAIN-09
- id: EA-CHAIN-06
  priority: P2
  title: Les résultats de commande et les faits observés n’alimentent pas l’évaluation fournisseur
  kind: missing_documented_chain
  object_ids:
  - cap-supplier-performance-evaluation
  - cap-supplier-commitment-follow-up
  - cap-purchasing-case-coordination
  - D04.j
  - D07.d
  evidence:
  - object_id: cap-supplier-performance-evaluation
    field: fields.scope
    value: |-
      Produire une appréciation de la performance du fournisseur à partir des résultats observés et signaler les écarts à traiter.

      Consommer les faits d’achat et qualité ; ne pas conduire toutes les relances de commande.
    transverse_incident_ids: []
  - object_id: cap-supplier-commitment-follow-up
    field: fields.scope
    value: |-
      Constater les confirmations, dates et quantités annoncées par le fournisseur et signaler leurs écarts.

      La réalisation du transport et de la réception reste sous [Logistics](model:domain-logistics-execution) ; [Purchase Order](model:D04.j) garde le carnet d’achat cible et ses engagements.
    transverse_incident_ids:
    - REL-U1091-supplier-response-to-purchase-order
  - object_id: cap-purchasing-case-coordination
    field: fields.scope
    value: Lorsqu’un fournisseur annonce un retard ou une quantité révisée, qualifier l’impact commercial, obtenir une réponse
      et retenir une issue autorisée. Le résultat est une instruction de changement ou de maintien transmise à [Purchase Order](model:D04.j),
      qui garde identité, engagements et transitions. [Supplier Commitment Follow-up](model:cap-supplier-commitment-follow-up)
      constate les confirmations et écarts ; [Process Management](model:subdomain-process-management) suit le travail transversal.
    transverse_incident_ids:
    - REL-U1091-purchasing-decision-to-purchase-order
  consequence: Supplier Performance Evaluation indique consommer les faits d’achat et qualité mais n’a aucun lien transverse.
    Supplier Commitment Follow-up émet des annonces vers Purchase Order sans recevoir l’engagement applicable et les réalisations
    nécessaires au calcul d’écarts ; Purchasing Case Coordination envoie un changement sans retour d’application.
  proposal: Relier les états et engagements de Purchase Order, les résultats de réception/qualité reconnus et leurs corrections
    vers les consommateurs Procurement pertinents ; distinguer réponse annoncée, fait constaté et évaluation durable.
  reserve: Le choix de la source de qualité et du producteur d’une mesure doit être documenté. Les annonces du fournisseur
    ne valent pas preuve de livraison. La référence SAP générale sourcing ne couvre pas à elle seule tout un score fournisseur.
  market_source_ids:
  - MS-PROCUREMENT
  - SAP-FSD
  prior_audit: Nouveau périmètre Enterprise Architecture ; ne réouvre pas les corrections U1113.
  status: proposed
  not_installed_claim: true
  recommendation_status: proposed_not_adopted
- id: EA-CHAIN-07
  priority: P2
  title: Les domaines Design sont décomposés mais leurs passages de relais ne sont pas reliés
  kind: missing_documented_chain
  object_ids:
  - subdomain-product-strategy-requirements
  - subdomain-collection-planning
  - subdomain-development-planning
  - subdomain-product-design-specification
  - subdomain-sampling-product-validation
  - subdomain-product-definition-variants
  - subdomain-product-change-release
  evidence:
  - object_id: subdomain-collection-planning
    field: fields.scope
    value: '[Sous-domaine](method:MOD038) de [Product Portfolio & Collection Management](model:domain-product-portfolio-collection).
      Composer la collection : modèles, coloris, variantes envisagées, cohérence de gamme et dates de lancement. [Product
      Design & Specification](model:subdomain-product-design-specification) définit ensuite les caractéristiques du produit.
      [Demand & Supply Forecasting](model:subdomain-demand-supply-forecasting) utilise la sélection de produits et le calendrier
      comme hypothèses pour estimer la demande et les ressources possibles. La composition de la collection ne produit pas
      à elle seule un Forecast Plan ; [Commerce](glossary:TER108) décide les assortiments par canal.'
    transverse_incident_ids:
    - REL-U1101-collection-to-demand-supply-forecast
  - object_id: subdomain-product-design-specification
    field: fields.scope
    value: Précise forme, dimensions, composants et exigences ; la définition approuvée et ses changements sont ensuite maîtrisés
      dans [Product Definition & Lifecycle Management](glossary:TER214).
    transverse_incident_ids: []
  - object_id: subdomain-product-change-release
    field: fields.scope
    value: Maîtrise version et conditions d’usage ; un retour opérationnel peut demander un changement sans modifier automatiquement
      la définition.
    transverse_incident_ids: []
  consequence: Product Development et Product Definition & Lifecycle Management n’ont aucune relation transverse incidente.
    Les fiches décrivent pourtant les caractéristiques définies après la collection, leur validation, puis la maîtrise des
    versions approuvées. La seule chaîne interne Design existante est Collection Planning→Demand & Supply Forecasting.
  proposal: Relier, à la profondeur de contexte existante, orientations/collection→développement, spécifications et validation→définition
    approuvée, changements autorisés→versions mises à disposition ; préciser les retours de validation ou demande de correction
    là où ils sont documentés.
  reserve: Aucune capacité périphérique supplémentaire n’est nécessaire. Ne pas imposer de cycle séquentiel unique ni une
    autorité sur tous les produits achetés déjà conçus ; les responsables par objet restent à établir.
  market_source_ids:
  - MS-PRODUCT-RELEASE
  - SAP-FSD
  prior_audit: Nouveau périmètre Enterprise Architecture ; ne réouvre pas les corrections U1113.
  status: proposed
  not_installed_claim: true
  recommendation_status: proposed_not_adopted
  related_findings:
  - EA-CHAIN-08
  - EA-CAT-04
- id: EA-CHAIN-08
  priority: P2
  title: La définition produit arrive globalement dans Business Operations sans consommateurs Commerce et Procurement identifiés
  kind: missing_documented_chain
  object_ids:
  - system-design-development
  - domain-product-definition-lifecycle
  - subdomain-product-documentation-classification
  - cap-assortment-eligibility-management
  - cap-commercial-catalog-publication
  - cap-supplier-consultation-coordination
  - REL-U979-product-definitions
  - REL-U1113-design-product-reference
  evidence:
  - object_id: subdomain-product-definition-variants
    field: fields.scope
    value: Conserve des identités et caractéristiques utilisables par les consommateurs ; les sources responsables sont à
      établir par objet, notamment pour les produits achetés déjà conçus.
    transverse_incident_ids: []
  - object_id: subdomain-product-documentation-classification
    field: fields.scope
    value: Relie documents et catégories aux versions pertinentes ; les contenus commerciaux spécifiques aux canaux restent
      à qualifier avec [Commerce](glossary:TER108).
    transverse_incident_ids: []
  - object_id: subdomain-assortment-catalog-management
    field: fields.scope
    value: |-
      Définir et publier l’offre proposée par magasin, canal ou partenaire, avec sa présentation commerciale et sa période de validité.

      Publie les produits proposés par canal, magasin ou partenaire, avec leur période de validité et leur présentation commerciale. Distingue l’[assortiment](glossary:TER250), qui délimite l’offre, du [catalogue](glossary:TER251), qui la présente, et de la sélection préparée pour un client dans [Wholesale Commerce](model:subdomain-sales-wholesale).

      [Design & Development](model:system-design-development) conserve définition et préparation des produits. [Master Plan](model:domain-plan) construit les plans prévisionnels de ressources ; publier un assortiment ne calcule pas un plan Supply ni une affectation de stock. Les autorités par donnée et conditions commerciales restent à documenter. Exemple fictif : publier une sélection de modèles autorisés pour un groupe de magasins pendant une saison, indépendamment de leur disponibilité physique immédiate.

      Responsabilités distinguées : [Assortment Management](model:ba-assortment-management), [Catalog Management](model:ba-catalog-management).
    transverse_incident_ids: []
  consequence: Le raccordement vers Reference Ingestion de Supply est maintenant présent, mais les responsabilités Design
    définies et les consommateurs produit Commerce/Procurement restent sans liens. Une relation entre systèmes n’explicite
    pas les spécifications de consultation, l’offre autorisée ou la documentation commerciale.
  proposal: Qualifier les contributions produit approuvées vers les périmètres consommateurs déjà décrits, avec état d’usage/version/retrait
    ; préciser le rôle de Product Change & Release et de la source responsable par objet. Préserver une voie séparée pour
    les données locales Supply.
  reserve: Le producteur exact ne doit pas être déduit de la simple existence du domaine Lifecycle ; la maîtrise enterprise
    reste à prouver. Ce constat étend le scope au-delà du producteur→réception Supply corrigé sous FL-U1112-13.
  market_source_ids:
  - MS-PRODUCT-RELEASE
  - SAP-FSD
  - MS-ASSORTMENT
  - SAP-ASSORTMENT
  prior_audit: Nouveau périmètre Enterprise Architecture ; ne réouvre pas les corrections U1113.
  status: proposed
  not_installed_claim: true
  recommendation_status: proposed_not_adopted
- id: EA-CHAIN-09
  priority: P2
  title: Le Forecast Plan amont ne reçoit pas les hypothèses de supply et contraintes commerciales citées
  kind: missing_documented_chain
  object_ids:
  - subdomain-demand-supply-forecasting
  - domain-sourcing-procurement
  - cap-category-sourcing-strategy
  - cap-supplier-offer-selection
  - domain-sales
  - subdomain-collection-planning
  - REL-U1101-forecast-to-demand-plan
  evidence:
  - object_id: subdomain-demand-supply-forecasting
    field: fields.scope
    value: '[Sous-domaine](method:MOD038) de [Product Portfolio & Collection Management](model:domain-product-portfolio-collection),
      dans [Design & Development](glossary:TER105). À partir des produits et jalons de [Collection Planning](model:subdomain-collection-planning),
      le chef de produit et les métiers contributeurs estiment la demande future par produit, canal et horizon, puis les volumes,
      sources, délais ou capacités d’approvisionnement envisageables. Les hypothèses de supply proviennent notamment de [Sourcing
      and Procurement](model:domain-sourcing-procurement) et des contraintes connues ; elles ne valent ni accord fournisseur
      ni commande. Comparer les scénarios, leurs écarts et leurs incertitudes, puis versionner un [Forecast Plan](glossary:TER372)
      demand/supply. [Demand & Supply Plan Preparation](model:ba-demand-supply-plan-preparation) en qualifie une version pour
      le [Master Plan](model:domain-plan), qui calcule les besoins nets et décide la couverture opérationnelle. [Order Management](model:D04)
      conserve les commandes et engagements ; [Enterprise Planning & Performance](glossary:TER221) conserve les budgets.'
    transverse_incident_ids:
    - REL-U1101-collection-to-demand-supply-forecast
    - REL-U1101-forecast-to-demand-plan
  - object_id: domain-product-portfolio-collection
    field: fields.scope
    value: Choisir les orientations et les produits à développer. [Product Strategy & Requirements](model:subdomain-product-strategy-requirements)
      examine tendances, usages et nouveaux canaux. [Collection Planning](model:subdomain-collection-planning) compose les
      produits et jalons de collection ; [Demand & Supply Forecasting](model:subdomain-demand-supply-forecasting) estime demande
      future, supply envisageable et écarts avant lancement. [Product Design & Specification](model:subdomain-product-design-specification)
      définit les caractéristiques du produit dans un autre domaine. [Demand & Supply Plan Preparation](model:ba-demand-supply-plan-preparation)
      qualifie une version prévisionnelle pour le [Master Plan](model:domain-plan), sans reprendre l’autorité de la prévision
      amont. [Commerce](glossary:TER108) décide les assortiments par canal ; [Enterprise Planning & Performance](glossary:TER221)
      conserve les objectifs et budgets financiers.
    transverse_incident_ids: []
  consequence: La sortie Forecast Plan vers Plan Ingestion est corrigée et la collection l’alimente. En revanche la fiche
    précise que ses hypothèses de ressources proviennent notamment de Sourcing and Procurement sans aucune relation de contribution
    depuis ce domaine ; les choix de canal/assortiment restent également sans articulation documentée.
  proposal: Qualifier la contribution des sources, délais, volumes possibles et incertitudes de Procurement vers Forecasting.
    Examiner les hypothèses Commerce pertinentes et les retours d’écarts avant de les ajouter. Garder la qualification du
    plan opérationnel dans SCO.
  reserve: Aucun fournisseur engagé ni plan acheté n’est créé par la prévision. Pas de nouveau flux toutes directions par
    défaut ; les producteurs précis et conditions de mise à jour restent à arbitrer.
  market_source_ids:
  - MS-PROCUREMENT
  - SAP-FSD
  prior_audit: Nouveau périmètre Enterprise Architecture ; ne réouvre pas les corrections U1113.
  status: proposed
  not_installed_claim: true
  recommendation_status: proposed_not_adopted
- id: EA-CHAIN-10
  priority: P1
  title: Objectifs, budgets et résultats consolidés n’ont aucun raccordement dans le graphe
  kind: missing_documented_chain
  object_ids:
  - domain-enterprise-planning-performance
  - subdomain-strategy-objectives
  - subdomain-budgeting-forecasting
  - subdomain-performance-analysis
  - domain-finance
  - subdomain-product-strategy-requirements
  - domain-plan
  evidence:
  - object_id: subdomain-strategy-objectives
    field: fields.scope
    value: Donne les objectifs aux plans ; leur traduction financière ne couvre pas toute la stratégie entreprise.
    transverse_incident_ids: []
  - object_id: subdomain-budgeting-forecasting
    field: fields.scope
    value: Traduit les hypothèses en enveloppes financières ; ne remplace pas les prévisions de quantités de [Demand Planning](glossary:TER218)
      ni les méthodes de coût de [Finance](glossary:TER117).
    transverse_incident_ids: []
  - object_id: subdomain-performance-analysis
    field: fields.scope
    value: Compare les résultats consolidés aux objectifs ; les faits opérationnels et leurs autorités restent dans les domaines
      producteurs.
    transverse_incident_ids: []
  - object_id: subdomain-product-strategy-requirements
    field: fields.scope
    value: Exprimer les besoins, tendances et orientations produit. Examiner ce que des évolutions de style, de clientèle
      ou de canal pourraient changer dans l’offre, sans décider seul l’ouverture d’un canal. Les objectifs financiers sont
      des contraintes ; les prix de vente et les choix commerciaux par canal restent dans Commerce.
    transverse_incident_ids: []
  consequence: Enterprise Planning & Performance et ses 3 sous-domaines sont dépourvus de relations transverses. Les fiches
    disent pourtant que les objectifs guident les plans, les enveloppes financières bornent les hypothèses et l’analyse compare
    les résultats aux objectifs. La synthèse BO→EM&C est limitée aux faits comptables et ne couvre pas cette boucle.
  proposal: Documenter au niveau Domain/Subdomain les objectifs/enveloppes vers les périmètres concernés et les résultats,
    plans ou écarts consolidables en retour. Séparer budget financier, plan en quantités et méthodes de coûts Finance ; choisir
    explicitement les producteurs et destinataires sans créer de capacités périphériques.
  reserve: L’absence de détail en capacités est un choix autorisé ; la lacune porte sur les liens déjà annoncés. Ne pas inventer
    de contrôle budget systématique ou d’autorisation centrale sur toutes les décisions locales.
  market_source_ids:
  - MS-PLANNING
  - SAP-PLANNING
  - MS-BUDGET
  - SAP-BUDGET
  prior_audit: Nouveau périmètre Enterprise Architecture ; ne réouvre pas les corrections U1113.
  status: proposed
  not_installed_claim: true
  recommendation_status: proposed_not_adopted
