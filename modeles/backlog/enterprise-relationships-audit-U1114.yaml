  - cap-wholesale-account-stewardship
  - cap-wholesale-sales-engagement
  - D04.i
  - REL-U1113-finance-credit-reference
  - REL-U979-credit-profiles
  evidence:
  - object_id: subdomain-credit-collections
    field: fields.scope
    value: '[Finance](glossary:TER117) conserve l’autorité de crédit ; [Commerce](glossary:TER108) sollicite les contrôles
      et FLOW utilise les profils reçus sans acquérir cette autorité.'
    transverse_incident_ids: []
  - object_id: cap-wholesale-account-stewardship
    field: fields.scope
    value: |-
      Tenir le contexte commercial d’un revendeur, ses interlocuteurs et les conditions de relation applicables.

      Consommer les conditions autorisées par Pricing et les résultats [Finance](model:domain-finance) ; ne pas reprendre la promesse ni les engagements de chaque commande.
    transverse_incident_ids: []
  consequence: La fiche Credit & Collections indique que Commerce sollicite les contrôles. Seuls des profils sont fournis
    à Reference Ingestion ; ni demande de contrôle sur une transaction ni réponse/blocage/libération contextualisé n’est relié.
    Le profil reçu ne renseigne pas à lui seul l’exposition à jour.
  proposal: Distinguer la référence de crédit des demandes de contrôle et décisions Finance à appliquer à une vente ou commande
    ; qualifier le point de sollicitation Commerce/Sales Order, le contexte/exposition transmis et la portée temporelle du
    résultat.
  reserve: Le modèle n’oblige pas un appel synchrone à chaque vente. Ne pas déplacer l’autorité de crédit dans FLOW ni faire
    du profil un résultat universel. Ce constat complète sans annuler la réception de référence corrigée U1113.
