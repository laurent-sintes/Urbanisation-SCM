- id: EA-CHAIN-13
  priority: P2
  title: Les raccordements internes Logistics et financiers de prestation ne sont pas qualifiés
  kind: explicit_context_gap
  object_ids:
  - domain-warehousing
  - domain-transportation
  - domain-customs-management
  - ba-packing-shipping-operations
  - ba-transport-execution
  - ba-customs-procedure-management
  - subdomain-financial-accounting
  - domain-finance
  evidence:
  - object_id: domain-warehousing
    field: fields.scope
    value: |-
      Organiser et réaliser l’entreposage, le traitement physique des biens et le travail local.

      Réceptionner, ranger, compter, préparer, emballer, expédier et traiter physiquement les retours. FLOW conserve les engagements à satisfaire et la coordination entre acteurs.

      Responsabilités distinguées : [Inbound Operations](model:subdomain-inbound-operations), [Storage & Inventory Control](model:subdomain-storage-inventory-control), [Outbound Operations](model:subdomain-outbound-operations), [Value-Added Operations](model:subdomain-value-added-returns), [Returns Operations](model:subdomain-returns-operations), [Warehouse Operations Control](model:subdomain-warehouse-operations-control).
    transverse_incident_ids:
    - REL-U1113-service-order-cross-docking-mandate
    - REL-U1113-service-order-inspection-mandate
    - REL-U1113-service-order-scrapping-mandate
    - REL-U1113-domain-warehousing-service-results
    - REL-U1113-domain-warehousing-inventory-facts
  - object_id: domain-transportation
    field: fields.scope
    value: |-
      Organiser les moyens de transport, réaliser les déplacements et traiter leurs écarts locaux.

      Organiser les moyens, les chargements et les tournées ; suivre et résoudre les incidents du transport. FLOW coordonne les conséquences sur les commandes, les promesses et les autres prestations.

      Responsabilités distinguées : [Transport Planning & Dispatch](model:subdomain-transport-planning-dispatch), [Transport Execution & Tracking](model:subdomain-transport-execution-tracking), [Transport Exception Management](model:subdomain-transport-exception).
    transverse_incident_ids: []
  - object_id: domain-customs-management
    field: fields.scope
    value: |-
      Préparer les dossiers douaniers et conduire les procédures applicables aux mouvements internationaux jusqu’à leurs résultats.

      Mandat opérationnel douanier, pas définition du droit ni toute conformité commerciale d’entreprise. [Customs Clearance Order](model:service-order-customs-clearance) FLOW confie et suit la prestation ; les autorités rendent les décisions applicables.

      Limite de comparaison : Dynamics documente surtout le suivi de passage douanier dans les sources consultées ; SAP S/4HANA documente une délégation à GTS. Appuis partiels, sans prétendre une réalisation française complète ni un déploiement Beaumanoir.

      Responsabilités distinguées : [Customs Documentation](model:subdomain-customs-documentation), [Customs Clearance](model:subdomain-customs-clearance).
    transverse_incident_ids: []
  consequence: Tous les liens Logistics détaillés vont à SCO ou en viennent ; aucun passage local entre entreposage, transport
    et douane, ni échange Logistics↔Finance, n’est documenté. Les mandats/résultats opérationnels U1113 sont présents, mais
    ils ne démontrent pas qui fournit les pièces de facturation du prestataire, les coûts, ou la disponibilité de la mainlevée
    pour le mouvement.
  proposal: 'Qualifier les interfaces de contexte nécessaires au mandat : remise au transport, contraintes/résultats douaniers
    et justification des prestations facturables ; décider pour chacune si le passage est local, relayé par SCO ou fourni
    à Finance. Documenter la route retenue et les responsabilités, sans ajouter de capacités artificielles.'
  reserve: 'L’absence de flèches directes n’est pas une anomalie fonctionnelle démontrée : la coordination peut légitimement
    passer par SCO. Cette entrée est une lacune documentaire de contexte à qualifier, pas un schéma d’interfaces imposé. Le
    lot U1113 ne promettait pas une comptabilité de Logistics.'
  market_source_ids:
  - MS-PROCUREMENT
  - SAP-FSD
  prior_audit: Nouveau périmètre Enterprise Architecture ; ne réouvre pas les corrections U1113.
  status: proposed
  not_installed_claim: true
  recommendation_status: proposed_not_adopted
