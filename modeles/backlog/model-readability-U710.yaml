  publication_delivery:
    state: applied
    source_refs:
    - U764
    summary: Scénarios métier multiples et partagés appliqués au modèle ; exemples optionnels, sans niveau supplémentaire.
    required_nodes:
    - id: universe-supply
      fields:
        examples:
        - title: Livrer 100 tee-shirts à un magasin vendredi
          situation: Le magasin attend 100 tee-shirts pour vendredi. Un entrepôt en détient 60 et un fournisseur doit en livrer
            40 jeudi.
          outcome: La Supply vérifie si les 100 peuvent être livrés à temps, établit la quantité et la date promises, puis
            coordonne préparation et transport. Si les 40 sont retardés, elle examine les alternatives et les conséquences
            sur la commande.
          lesson: La Supply organise et suit la satisfaction de la demande ; les exécutants réalisent les opérations physiques.
            La promesse ne réserve pas implicitement le stock.
          source_refs:
          - U470
          - U436
        - title: Recevoir une nouvelle référence produit
          situation: Une nouvelle variante de tee-shirt, bleu taille M, est créée dans l’application qui fait autorité sur
            les produits.
          outcome: Son identifiant et ses caractéristiques utiles sont reçus dans [Product Reference](glossary:TER052). La
            Supply peut alors utiliser cette référence dans ses commandes et ses stocks.
          lesson: La projection sert aux opérations Supply. La création et les corrections de la référence restent dans la
            source de vérité externe.
          source_refs:
          - U470
          - U97
          - U460
        - id: b2b-partial-stock
          title: Livrer une commande B2B avec un stock partiel
          situation: 'Illustration FLOW fictive : un client B2B attend 100 vêtements ; 60 sont disponibles et une rentrée
            de 40 est annoncée. Plusieurs solutions de livraison sont examinées.'
          trigger: Une commande nécessite une proposition de quantité et de date.
          objective: Préparer une promesse réalisable et expliquer les conséquences économiques des options.
          constraints:
          - Date demandée et fractionnement autorisé par le client.
          - Disponibilité effective, fiabilité de la rentrée et délais de préparation et de transport.
          - Engagements existants et règles de protection du stock.
          options:
          - title: Livraison fractionnée
            description: 'Expédier les 60 disponibles, puis les 40 attendus : rendre visible le service anticipé et le coût
              des deux expéditions.'
          - title: Livraison regroupée
            description: 'Attendre les 40 pour préparer et expédier ensemble : examiner le gain logistique, le délai et les
              conséquences économiques d’une attente.'
          contributions:
          - node_id: D03.i
            role: '[Available-to-Promise (ATP)](model:D03.i) évalue ce que permettent le stock courant et les disponibilités
              futures pertinentes.'
          - node_id: D03.j
            role: '[Capable-to-Promise (CTP)](model:D03.j) évalue les faisabilités supplémentaires utiles si les disponibilités
              ne suffisent pas ; son invocation n’est pas systématique.'
          - node_id: D03.k
            role: '[Profitable-to-Promise (PTP)](model:D03.k) expose, par option, les coûts, bénéfices, risques économiques
              et hypothèses disponibles, sans choisir.'
          - node_id: D03.l
            role: '[Promise Selection Decision](model:D03.l) choisit la proposition en tenant compte des évaluations et des
              règles applicables.'
          - node_id: D06
            role: '[Fulfilment Orchestration](model:D06) coordonne les prestations après engagement et détermine leur libération,
              en cherchant à préserver la promesse.'
          outcome: Un dossier présente les options avec quantité, date et conséquences économiques ; le choix reste explicite
            et distinct de l’évaluation. Aucun gagnant n’est présumé.
          lesson: Les capacités coopèrent selon le besoin ; ce récit n’impose ni pipeline universel ni modification des grands
            équilibres du Matching. Promettre, affecter les ressources et libérer les prestations restent distincts.
          source_refs:
          - U763
          - U764
          - U762
          - ELM763
          - ELM767
          - ELM768
    - id: D01
      fields:
        scenario_refs:
        - node_id: universe-supply
          scenario_id: b2b-partial-stock
          contribution: Fournir les positions de stock, les engagements de quantité et les apports attendus qui alimentent
            les évaluations d’Order Promising.
    - id: D06
      fields:
        scenario_refs:
        - node_id: universe-supply
          scenario_id: b2b-partial-stock
          contribution: Retenir ou libérer les ordres de prestation en cohérence avec la promesse, notamment pour permettre
            une préparation regroupée.
    - id: D03.k
      fields:
        examples:
        - id: transport-speed
          title: Comparer un transport standard et un transport express
          situation: 'Illustration FLOW fictive : Deux modes peuvent être envisagés pour une même commande.'
          objective: Produire un dossier économique local et contextuel permettant de comprendre les avantages et inconvénients
            des options.
          options:
          - title: Transport standard
            description: Évaluer le coût et les conséquences économiques de la date obtenue.
          - title: Transport express
            description: Évaluer le surcoût et les pertes ou pénalités éventuellement évitées.
          outcome: Les montants comparables, hypothèses, incertitudes et données manquantes sont exposés pour chaque option.
            [Promise Selection Decision](model:D03.l) porte le choix.
          lesson: Séparer les montants connus des hypothèses ; un gain de délai ne devient pas automatiquement un gain financier.
          source_refs:
          - U762
          - U763
          - U764
          - ELM762
          - ELM763
        - id: substitution
          title: Comparer un article demandé et un article de remplacement
          situation: 'Illustration FLOW fictive : Une pénurie conduit à examiner un remplacement autorisé par les règles commerciales.'
          objective: Produire un dossier économique local et contextuel permettant de comprendre les avantages et inconvénients
            des options.
          options:
          - title: Article demandé différé
            description: Évaluer l’attente, ses coûts et ses risques économiques.
          - title: Article de remplacement
            description: Évaluer le prix applicable, le coût produit et les gestes commerciaux éventuels.
          outcome: Les montants comparables, hypothèses, incertitudes et données manquantes sont exposés pour chaque option.
            [Promise Selection Decision](model:D03.l) porte le choix.
          lesson: L’acceptabilité du remplacement et les règles de prix sont des contraintes fournies ; PTP ne les invente
            pas.
          source_refs:
          - U762
          - U763
          - U764
          - ELM762
          - ELM763
        - id: alternate-site
          title: Comparer deux sites de départ
          situation: 'Illustration FLOW fictive : Deux entrepôts offrent des options de satisfaction pour une commande.'
          objective: Produire un dossier économique local et contextuel permettant de comprendre les avantages et inconvénients
            des options.
          options:
          - title: Site habituel
            description: Évaluer les coûts de préparation et de transport ainsi que la date associée.
          - title: Autre site
            description: Évaluer le trajet, les prestations et les éventuels coûts de transfert associés.
          outcome: Les montants comparables, hypothèses, incertitudes et données manquantes sont exposés pour chaque option.
            [Promise Selection Decision](model:D03.l) porte le choix.
          lesson: Conserver le même périmètre de coût pour comparer les options ; l’évaluation locale n’affecte pas les ressources
            et ne rééquilibre pas le master plan.
          source_refs:
          - U762
          - U763
          - U764
          - ELM762
          - ELM763
        - id: additional-supply
          title: Éclairer une option avec approvisionnement supplémentaire
          situation: 'Illustration FLOW fictive : Une option conditionnelle repose sur un approvisionnement supplémentaire
            dont la faisabilité doit être établie.'
          objective: Produire un dossier économique local et contextuel permettant de comprendre les avantages et inconvénients
            des options.
          options:
          - title: Disponibilités déjà prévues
            description: Évaluer les conséquences économiques des quantités et dates accessibles.
          - title: Approvisionnement supplémentaire
            description: Évaluer les coûts additionnels de fourniture, transport et prestations, ainsi que les effets économiques
              attendus.
