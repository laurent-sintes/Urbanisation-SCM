    atlas: businessExamples lit les exemples structurés ou les exemples explicites du scope ; section Exemples sur les fiches,
      indexée dans la recherche.
    gap: Aucune structure spécifique aux alternatives et contributions croisées ; les exemples narratifs ne garantissent pas
      l’explication des situations de bout en bout.
  proposal:
    label: Scénarios métier
    levels:
    - Domain
    - Subdomain
    - Capability
    principle: Enrichir et rendre plus explicite la rubrique illustrative des fiches, sans niveau dans l’arbre et sans nouvelle
      backlog.
    content:
    - Situation et déclencheur
    - Résultat recherché et contraintes utiles
    - Options examinées lorsque pertinentes
    - Contribution des capacités et interactions
    - Résultat produit ou issue illustrative explicitement hypothétique
    scope_by_level:
      Domain: Situation de bout en bout mobilisant plusieurs sous-domaines.
      Subdomain: Coopération des capacités pour traiter la situation.
      Capability: Résultat propre dans un contexte concret et variantes examinées.
    example: 'Livrer une commande B2B avec stock partiel : ATP évalue courant/futur, CTP les faisabilités supplémentaires
      pertinentes, PTP expose les conséquences économiques, Promise Selection Decision choisit et Fulfilment coordonne la
      libération des prestations.'
    reuse: Conserver fields.examples comme point d’ancrage ; qualifier les besoins de champs structurés et liens avant extension.
      Éviter de recopier le même récit aux trois niveaux.
    boundary: Un scénario illustre une collaboration ; les comportements décrivent la profondeur ou la manière d’évaluer.
      Pas de scénario érigé en capacité, ni parcours universel imposé.
  market_comparison: Oracle ELM763 illustre des scénarios alternatifs avec coûts/dates ; Microsoft ELM767/ELM768 décrit des
    parcours et cas de consolidation. Les sources déjà consultées appuient l’illustration par situations, pas une prescription
    de métamodèle ni les champs proposés.
