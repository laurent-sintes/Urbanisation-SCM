approval_scope: Neuf derniers sujets et périmètres validés sous U968, dont HS-023 comme question architecturale Decision Provenance.
validated_subjects:
- id: HS-022
  subject: Continuité des parcours, tâches et engagements
  boundary: '[Process Management](glossary:TER164) conduit les parcours ; [Order Management](model:D04) garde identité, engagements
    et validité des transitions. La généricité ne transfère pas les règles Commerce ou Finance au cœur Supply ; aucun choix
    de plateforme.'
- id: HS-023
  subject: Provenance des décisions prises dans FLOW
  boundary: C12 regroupait I01 (autorité des règles) et I02 (explication/version de décision). U968 recentre HS-023 sur la
    provenance des décisions. I01 reste traité par [Control Plane](glossary:TER130) ; sa source est conservée. Ancrage transversal
    dans le cœur Supply proposé, sans preuve de composant ou de traçabilité installés.
- id: HS-024
  subject: Continuité des dossiers CBS et de service après-vente
  boundary: Distinct des échanges d’achat C18. Aucun retrait de CBS ni reprise du service après-vente Sarenza présumé ; Sarenza
    reste non évalué. Les possibilités de reprise ne sont pas démontrées.
- id: HS-025
  subject: Performance et stabilité du calcul de couverture du carnet
  boundary: La politique [Wholesale](glossary:TER193) reste dans HS-008. Un bon résultat de calcul ne vaut pas autorisation
    d’engager ses changements ; aucune performance ni architecture installée démontrée.
- id: HS-026
  subject: Versions, remise et corrections des documents opérationnels
  boundary: Ancrage Integration de contexte provisoire ; le sujet concerne aussi les échanges opérationnels. Ne pas créer
    un hotspot par format ni confondre fichier et opération métier.
- id: HS-027
  subject: Actions du Commerce et engagements pris dans FLOW
  boundary: L’absence de gestionnaire d’interfaces rapportée dans les notes ne prouve pas absence de tous les contrôles. Les
    appuis événements ne documentent qu’une partie des échanges, pas la sécurité complète.
- id: HS-028
  subject: Versions et interprétation des plans amont reçus par FLOW
  boundary: '[Plan Ingestion](model:plans-ingestion) reçoit les plans ; [Demand & Supply Planning](glossary:TER111) conserve
    leur production hors du cœur [Supply Chain Orchestration](model:supply-chain-orchestration). Les types et contrats réels
    restent à documenter.'
- id: HS-029
  subject: Commande d’achat FLOW et suivi d’approvisionnement CBS
  boundary: La commande d’achat dans FLOW est la cible de travail rapportée. Ce sujet ne décide pas de la reprise de fonctions
    CBS/SAV C13 ; les interfaces réelles restent à éprouver.
- id: HS-031
  subject: Prérequis de coopération ou de reprise des services existants
  boundary: Sujet transversal conservé sur instruction U958 avec ancrage [Enterprise Architecture](model:beaumanoir-target-universe)
    de contexte provisoire ; cet ancrage ne signifie ni réalisation commune ni lacune généralisée. Ne pas dupliquer les contrats
    des frontières précises.
