findings:
- id: FL-U1112-01
  priority: P1
  category: contradiction_actuelle
  title: Des flèches de promesse et de planification conservent leurs anciennes responsabilités
  node_ids:
  - D01
  - D03
  - D04
  - D06
  - domain-plan
  - ba-master-plan-management
  relation_ids:
  - REL-SERVICE-CATALOG-PROMISING
  - REL-SUPPLY-PLAN-VISIBILITY
  - REL-U673-PROMISING-ORDER
  - REL-U673-MATCHING-PROMISING
  - REL-U673-ORDER-MATCHING
  - REL-U673-PLANS-PROMISING
  - REL-U673-PLANS-MATCHING
  - REL-U673-POLICIES-PROMISING
  - REL-U673-POLICIES-MATCHING
  - REL-U673-FULFILMENT-MATCHING
  - REL-U673-CAPACITY-PROMISING
  - REL-EXECUTION-PROMISING
  - REL-U835-D03-D04
  evidence:
  - D01 est Inventory Management ; D03 est Availability ; domain-plan est Master Plan dans la hiérarchie courante.
  - REL-U673-PROMISING-ORDER fait recommander la promesse par D01 ; REL-U835-D03-D04 fournit en parallèle une proposition
    depuis D03.
  - REL-U673-ORDER-MATCHING envoie Orders et engagements à D03 alors que son texte vise le master plan.
  - Les autres relations citées placent encore Availability & Promising au sein d’Inventory Management ou les arbitrages collectifs
    dans Availability. REL-EXECUTION-PROMISING a les bonnes extrémités mais garde cette ancienne attribution dans son texte.
  recommendation: 'Requalifier chaque contenu puis ses extrémités selon le résultat produit : faits/positions de stock, possibilités
    de promesse, engagements, plan collectif ou impact d’exécution. Consolider les doublons sémantiques après examen ; ne
    pas déplacer toutes les flèches par une substitution de noms.'
  limit: Relations actives, souvent en revue partial/proposed. La présence dans une publication ne vaut pas adoption de leurs
    contenus.
  market_evidence_refs:
  - MKT-FLOW-MS-PROMISE
  - MKT-FLOW-SAP-AATP
  status: open
- id: FL-U1112-02
  priority: P2
  category: semantique_de_relation
  title: Les dépendances et les données fournies utilisent parfois le même type de relation
  node_ids:
  - D01.g
  - D01.f
  - inventory-ownership-ledger
  - D01.c
  relation_ids:
  - REL-NEEDS-U290-002
  - REL-U756-VISIBILITY
  - REL-EXECUTION-FACTS-D04.i
  - REL-NEEDS-U290-048
  evidence:
  - REL-NEEDS-U290-002 va Inventory Ledger → Inventory Tracking et signifie que le ledger consomme les faits intégrés.
  - REL-U756-VISIBILITY va Inventory Ownership Ledger → Inventory Visibility et signifie que le premier fournit des écritures.
  - Huit couples de relations opposées décrivent un apport et le besoin correspondant ; les interpréter comme deux flux créerait
    des retours artificiels. uses-reference est aussi orienté consommateur → référence.
  recommendation: Conserver les dépendances et représenter les échanges d’information avec un sens producteur → destinataire
    et un contenu explicite. Ne pas convertir automatiquement relates-to ou uses-reference en flux.
  limit: La carte Flux actuelle ne dessine pas relates-to ; ce constat concerne la complétude du modèle de flux et toute extension
    de la projection.
  market_evidence_refs: []
  status: open
- id: FL-U1112-03
  priority: P1
  category: responsabilite_absente
  title: Process Ledger et sa chaîne vers la visibilité et Process Mining manquent
  node_ids:
  - subdomain-process-management
  - order-workflow-sentry
  - order-workflow-orchestration
  - BHV082
  - process-mining
  - operational-analysis-reporting
  relation_ids:
  - REL-U843-D07.c-order-workflow-sentry
  - REL-U885-work-deadline-management-order-workflow-sentry
  - REL-U885-process-mining-BHV082
  - REL-U885-process-mining-human-task-management
  - REL-U885-operational-analysis-reporting-process-mining
  evidence:
  - Aucun nœud Process Ledger dans le backlog ni la publication courante ; les deux ledgers explicites sont ceux du stock
    et de sa propriété.
  - Les faits d’exécution et échéances peuvent solliciter Process Sentry ; la tenue exhaustive des événements internes/externes
    corrélés au Case n’est attribuée à aucune capacité.
  - Process Mining dépend de la visibilité et de Human Task Management. U1110/U1111 désignent désormais les traces conservées
    dans Process Ledger comme sa source.
  recommendation: Préparer Process Ledger dans Process Management et les contrats producteurs/captation → ledger → visibilité
    et mining ; conserver identifiant du Case, date du fait et date de connaissance, provenance, corrections et liens aux
    objets. Préserver l’autorité des commandes sur leurs engagements et transitions.
  limit: Besoin exprimé par Laurent U1110/U1111 ; nom de la Business Area, fiche détaillée et contrats restent à construire.
    Aucune équivalence complète de ledger opérationnel établie chez les éditeurs consultés.
  market_evidence_refs:
  - MKT-FLOW-MS-AUDIT
  - MKT-FLOW-SAP-MINING
  status: open
- id: FL-U1112-04
  priority: P1
  category: couverture_frontiere
  title: Le raccordement Logistics reste limité à deux échanges entre systèmes
  node_ids:
  - supply-chain-orchestration
  - domain-logistics-execution
  - domain-warehousing
  - domain-transportation
  - subdomain-service-orders
  - D07.d
  - D01.f
  relation_ids:
  - REL-U979-service-requests
  - REL-U979-execution-results
  evidence:
  - Demandes, exigences et engagements sont envoyés de Business Operations à Logistics ; résultats, estimations et stock reviennent
    dans le sens inverse.
  - Aucun shares-data détaillé ne relie les familles Service Orders aux périmètres Warehousing/Transportation/Customs ni leurs
    faits à Operations Tracking ou Inventory Tracking. Les résultats de préparation magasin constituent un cas détaillé distinct.
  recommendation: 'Décrire les passages de relais prouvés : demande autorisée et modification, acceptation/refus de prise
    en charge, avancement/résultat, faits physiques et corrections. Attribuer les producteurs à la profondeur autorisée de
    Logistics et qualifier la réception par les Tracking concernés.'
  limit: Absence de détail structuré, pas preuve d’absence d’interface installée. Ne pas créer de capacités logistiques au-delà
    de la profondeur déclarée.
  market_evidence_refs:
  - MKT-FLOW-MS-WMS
  - MKT-FLOW-SAP-WMS
  - MKT-FLOW-SAP-TM
  status: open
- id: FL-U1112-05
  priority: P1
  category: couverture_interne
  title: La préparation des plans et la libération du carnet sont isolées dans les relations
  node_ids:
  - demand-forecast-development
  - demand-plan-development
  - supply-plan-development
  - planning-scenario-reconciliation
  - delivery-release-decision
  - ba-demand-supply-plan-preparation
  relation_ids:
  - REL-U1101-forecast-to-demand-plan
  evidence:
  - Les cinq capacités citées ont zéro relation transverse tous types confondus.
  - Les fiches décrivent pourtant qualification → plan de demande, demande → supply, rapprochement des scénarios → Master
    Planning et décision de libération → application du plan/commandes.
  - Le Forecast Plan externe arrive seulement à la Business Area de préparation, ce qui ne matérialise pas ses échanges internes.
  recommendation: Écrire les données d’entrée, décisions produites et résultats transmis entre capacités, à partir des frontières
    déjà décrites. Conserver une Business Area comme synthèse sans la substituer à la traçabilité des producteurs précis.
  limit: La carte actuelle s’arrête aux Business Areas ; une documentation à maille capacité reste utile dans le détail et
    les Relations.
  market_evidence_refs:
  - MKT-FLOW-MS-PROMISE
  - MKT-FLOW-SAP-AATP
  status: open
- id: FL-U1112-06
  priority: P1
  category: contradiction_producteur
  title: L’application de décisions reste attribuée directement à Master Planning dans trois relations
  node_ids:
  - D02.e
  - D04.j
  - D04.k
  - D04.r
  relation_ids:
  - REL-NEEDS-U290-102
  - REL-NEEDS-U290-103
  - REL-AUDIT-U435-PLNK-06
  - REL-BACKLOG-REQUEST-ASSIGNMENT
  evidence:
  - Les trois premières relations font mobiliser achats, transferts et consignation par Master Planning pour mettre en action
    les choix.
  - Plan Application porte maintenant la transmission et le suivi des changements aux capacités responsables. Les liens actuels
    mélangent calcul, mise en application et retour.
  recommendation: Raccorder la décision retenue à Plan Application, puis les changements autorisés et leurs résultats aux
    familles de commandes concernées. Qualifier séparément une dépendance de calcul qui doit rester sur Master Planning.
  limit: Aucune séquence technique ni appel direct systématique n’est déduit de ces relations.
  market_evidence_refs: []
  status: open
- id: FL-U1112-07
  priority: P2
  category: contradiction_information
  title: Deux formulations brouillent la provenance des prévisions
  node_ids:
  - plans-visibility
  - demand-plan-visibility
  - demand-forecast-development
  - demand-plan-development
  - subdomain-demand-supply-forecasting
  relation_ids:
  - REL-U673-PLAN-COVERAGE
  evidence:
  - REL-U673-PLAN-COVERAGE part de Supply Plan Visibility mais dit fournir la demande prévisionnelle à Master Planning ; aucune
    relation équivalente ne part de Demand Plan Visibility.
  - demand-plan-development.scope dit que Demand Forecast Qualification calcule la prévision ; sa fiche décrit au contraire
    la qualification d’un Forecast Plan reçu de Demand & Supply Forecasting sans seconde prévision maîtresse.
  recommendation: Aligner le contenu, le producteur et le glossaire sur Forecast Plan source, qualification opérationnelle,
    Demand Plan et Supply Plan distincts ; préciser chaque apport au calcul du plan.
  limit: La distinction entre prévision source et élaboration des plans est conservée ; aucune nouvelle responsabilité de
    prévision n’est déduite.
  market_evidence_refs: []
  status: open
- id: FL-U1112-08
  priority: P2
  category: lignage_information
  title: Les producteurs des positions futures et engagées sont insuffisamment reliés à Inventory Visibility
  node_ids:
  - D01.c
  - D02.c
  - plans-visibility
  - demand-plan-visibility
  relation_ids:
  - REL-NEEDS-U290-006
  - REL-U717-SUPPLY-TRACKING-VISIBILITY
  evidence:
  - La fiche Inventory Visibility rapproche achats, transferts, retours, consignation, plans et engagements ; leurs producteurs
    précis ne sont pas tous reliés à sa composition.
  - Le besoin de Reservation envers Inventory Visibility ne représente pas la contribution des réservations à la vue.
  - REL-NEEDS-U290-006 renvoie encore les ressources futures à Supply Visibility, qui n’est plus un nœud distinct.
  recommendation: 'Documenter la composition des positions : faits physiques, changements de propriété, attendus, affectations/réservations
    et limites de connaissance ; préserver dates, corrections et règles de non-double-compte.'
  limit: Le constat porte sur la lignée structurée de calcul ; il ne prouve pas une erreur de calcul dans un outil installé.
  market_evidence_refs: []
  status: open
- id: FL-U1112-09
  priority: P2
  category: couverture_services
  title: Des prestations détaillées sont décrites sans raccordement à leur maille
  node_ids:
  - transport-plan-decision
  - service-order-billing
  - service-order-payment-collection
  - D04.t
  relation_ids: []
  evidence:
  - Transport Plan Decision, Billing et Payment ont zéro relation transverse à leur maille.
  - Le plan de transport articule pourtant sélection de service, Transport Order/Booking, libération et planification locale
    Logistics.
  - Consignment Pick-up Order a un lien vers la visibilité mais pas vers le rapprochement des résultats pourtant décrit dans
    sa fiche ; les cinq familles historiques et Consignment Fill-up ont ce besoin relié.
  recommendation: Qualifier les demandes et résultats des prestations concernées, les refus et corrections, puis raccorder
    les capacités porteuses à leurs producteurs et consommateurs documentés.
  limit: Des relations agrégées existent pour Service Management et Fulfilment ; il s’agit d’une lacune de détail, pas d’une
    absence totale de coopération.
  market_evidence_refs:
  - MKT-FLOW-SAP-TM
  status: open
- id: FL-U1112-10
  priority: P2
  category: retour_metier_non_documente
  title: Le retour du Core vers les parcours de vente n’est pas structuré
  node_ids:
  - cap-digital-sales-journey-management
  - D04.i
  relation_ids:
  - REL-U1091-digital-demand-to-sales-order
  - REL-U1091-wholesale-demand-to-sales-order
  evidence:
  - Les deux relations documentent la demande Commerce → Sales Order.
  - Aucune relation transverse ne restitue depuis Supply vers ces parcours l’acceptation, l’engagement ou l’avancement ; leurs
    fiches prévoient le suivi commercial.
  recommendation: Préciser les résultats nécessaires au parcours commercial et les capacités sources, puis qualifier les retours
    de confirmation, changement, annulation, réalisation ou écart selon les cas retenus.
  limit: Un sens inverse n’est pas exigé pour chaque relation ; le besoin de retour provient ici des fiches. Ne pas étendre
    aux ventes emportées.
  market_evidence_refs: []
  status: open
- id: FL-U1112-11
  priority: P2
  category: demande_metier_non_documentee
  title: La préparation magasin a un résultat relié mais pas de demande entrante identifiée
  node_ids:
  - cap-store-order-preparation-handover
  - D07.d
  relation_ids:
  - REL-U1091-store-preparation-results-to-fulfilment
  evidence:
