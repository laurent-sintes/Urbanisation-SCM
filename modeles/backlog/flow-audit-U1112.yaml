  market_evidence_refs: []
  status: open
- id: FL-U1112-13
  priority: P2
  category: source_a_qualifier
  title: La chaîne des référentiels commence à l’ingestion sans producteur externe détaillé
  node_ids:
  - master-data-ingestion
  - business-references
  relation_ids:
  - REL-U979-product-definitions
  - REL-U979-credit-profiles
  evidence:
  - Les supplies-reference matérialisent l’alimentation des références locales et les comportements distinguent des provenances.
  - Aucun lien détaillé ne raccorde un producteur externe à cette réception. La répartition des sources commerciales entre
    Commerce et Sourcing reste explicitement à documenter.
  recommendation: Raccorder uniquement les producteurs établis sur preuve et conserver les autres sources comme non qualifiées
    ; maintenir la distinction maîtrise externe et autorité locale Supply.
  limit: Ne pas inventer de maîtres d’entreprise ni d’alimentations installées.
  market_evidence_refs:
  - MKT-FLOW-MS-EXCHANGE
  status: open
- id: FL-U1112-14
  priority: P2
  category: articulation_a_qualifier
  title: L’émission du Forecast Plan et sa réception locale dessinent deux parcours non articulés
  node_ids:
  - plans-ingestion
  - subdomain-demand-supply-forecasting
  - ba-demand-supply-plan-preparation
  - domain-plan
  relation_ids:
  - REL-U1101-forecast-to-demand-plan
  - REL-U794-PLAN-INGESTION
  evidence:
  - Le producteur externe fournit le Forecast Plan directement à la Business Area de préparation.
  - Plan Ingestion fournit parallèlement à Master Plan les contributions externes acceptées ; le raccordement entre réception
    et qualification du même apport n’est pas explicite.
  recommendation: Décrire le contrat source → réception locale → qualification sans laisser supposer deux apports indépendants.
    Qualifier à part les autres contributions externes.
  limit: Deux niveaux de responsabilité peuvent être légitimes ; aucun double flux ni double comptage réel n’est démontré.
  market_evidence_refs: []
  status: open
- id: FL-U1112-15
  priority: P2
  category: apports_recents_non_appliques
  title: Le regroupement Integration conserve des diffusions détachées des producteurs précisés par Laurent
  node_ids:
  - subdomain-integration
  - accounting-data-provision
  - planning-data-provision
  - product-feedback
  - D01.g
  - inventory-ownership-ledger
  - D01.c
  relation_ids:
  - REL-U826-D01.g-TO-accounting-data-provision
  - REL-U826-inventory-ownership-ledger-TO-accounting-data-provision
  - REL-U826-D01.c-TO-planning-data-provision
  - REL-U979-product-feedback
  evidence:
  - Les deux ledgers sont déjà reliés comme producteurs comptables et Inventory Visibility comme source des positions utiles
    au plan.
  - Product Feedback n’a aucune relation métier transverse à sa maille vers ses producteurs ou Design & Development.
  - Les précisions U1105–U1109 placent les faits comptables et produit sur les ledgers stock et limitent la source de plan
    actuellement retenue au stock documenté ; ces précisions ne sont pas encore appliquées.
  recommendation: Préparer le retrait du regroupement Integration avec redistribution près des producteurs et maintien des
    responsabilités locales de réception. Rendre explicites contenus et destinataires avant de retirer ou fusionner des capacités.
  limit: L’audit ne vaut pas accord sur les retraits, scissions, noms ou nouvelles Business Areas ; aucune de ces propositions
    n’est appliquée ici.
  market_evidence_refs: []
  status: open
- id: FL-U1112-16
  priority: P2
  category: consommateur_trop_large
  title: Les prix de vente et résultats de régularisation visent tout Order Management
  node_ids:
  - subdomain-pricing-promotions-management
  - D04
  - subdomain-commercial-settlement-management
  relation_ids:
  - REL-U996-contextual-prices
  - REL-U996-commercial-settlement-results
  evidence:
  - Le producteur des prix porte les prix de vente ; le destinataire D04 couvre aussi achats et autres familles.
  - Les régularisations affectent des engagements ou demandes sans désigner les familles consommatrices ; les conditions restent
    à qualifier par donnée.
  recommendation: Préciser les consommateurs et cas concrets sans transformer la synthèse de sous-domaine en contrat universel.
    Conserver les autorités Commerce/Finance.
  limit: Le sens global est cohérent ; le problème est une portée encore insuffisante pour le détail des flux.
  market_evidence_refs: []
  status: open
- id: FL-U1112-17
  priority: P2
  category: limite_cartographique
  title: Le cadrage SCO masque ses adhérences externes
  node_ids:
  - supply-chain-orchestration
  relation_ids: []
  evidence:
  - buildFlowMap limite le scope aux descendants. Une extrémité externe sans ancêtre dessiné fait exclure la relation.
  - Les 11 échanges supportés aux frontières explicites SCO et les 6 relations de contexte entre Business Systems sont hors
    de ce cadrage.
  - Le cadrage Enterprise Architecture permet de les retrouver ; le comportement est attendu par les tests.
  recommendation: Prévoir un cadrage de voisinage SCO et adhérences, ou signaler clairement le périmètre affiché et donner
    l’accès aux frontières. Utiliser la racine EA pour lire l’ensemble en attendant.
  limit: Limite de représentation du code de travail examiné ; aucun test de la version distante déployée n’a été effectué.
  market_evidence_refs: []
  status: open
  code_evidence:
  - path: app/src/flowMapLayout.ts
    line: 273
    meaning: Périmètre limité aux descendants ; filtrage des extrémités hors cadrage.
  - path: app/test-flow-map-layout.mjs
    line: 97
    meaning: Comportement attendu du cadrage.
- id: FL-U1112-18
  priority: P2
  category: information_non_restituee
  title: Le détail Flux omet les conditions et effets qui limitent le sens d’un échange
  node_ids: []
  relation_ids:
  - REL-U979-management-facts
  evidence:
  - FlowMapPanel affiche finalité et contenus pour shares-data ; la finalité remplace qualification.meaning et conditions/effects
    ne sont pas rendus.
  - La condition disant qu’une transmission ne vaut pas écriture enregistrée n’apparaît pas dans ce volet.
  recommendation: Afficher le sens, les conditions et les effets utiles du contrat avec les contenus. Préserver les détails
    des relations sources dans les regroupements.
  limit: Les informations existent dans le modèle et peuvent être accessibles ailleurs, notamment dans Relations ; elles manquent
    au volet Flux.
  market_evidence_refs: []
  status: open
  code_evidence:
  - path: app/src/components/FlowMapPanel.tsx
    line: 553
    meaning: Rendu du détail des flux ; finalité/contenus, sans conditions ni effets.
- id: FL-U1112-19
  priority: P2
  category: niveau_de_preuve_cartographique
  title: Une synthèse et ses détails peuvent coexister sans lignée explicite
  node_ids: []
  relation_ids:
  - REL-U979-management-facts
  - REL-U981-accounting-facts
  evidence:
  - Les échanges entre systèmes et entre capacités/domaines sont des relations distinctes sans lien de raffinement explicite.
  - La carte regroupe par source visible, cible visible et type ; au zoom fin, une synthèse système et les détails peuvent
    coexister.
  - 'La carte s’arrête aux Business Areas : les producteurs précis restent dans le détail. Un échange au sein de la même BA
    serait masqué ; aucun échange supporté actuel de SCO ne présente ce cas.'
  recommendation: Qualifier synthèse, détail et provenance afin que le lecteur ne compte pas deux échanges opérationnels.
    Afficher le niveau et les extrémités canoniques de chaque relation ; ne pas interpréter le nombre de flèches comme un
    nombre d’interfaces.
  limit: Il n’existe pas de doublon exact source/cible/type dans les shares-data examinés ; le risque est sémantique entre
    niveaux.
  market_evidence_refs: []
  status: open
  code_evidence:
  - path: app/src/components/FlowMapPanel.tsx
    line: 122
    meaning: Remontée aux ancêtres visibles et regroupement par source/cible/type.
  - path: app/src/flowMapLayout.ts
    line: 42
    meaning: Types de territoires dessinés ; arrêt aux Business Areas.
- id: FL-U1112-20
  priority: P3
  category: contrat_editorial
  title: Deux noms d’informations partagées sont des actions rédigées en français
  node_ids: []
  relation_ids:
  - REL-U794-PLAN-INGESTION
  - REL-U826-planning-data-provision-TO-domain-plan
  evidence:
  - data_exchange.contents[].name vaut « Fournit les contributions externes de plan » et « Fournit les entrées internes de
    calcul ».
  - U979 demande des noms anglais d’informations ; les descriptions et finalités restent françaises.
  recommendation: Nommer les informations produites, puis garder le verbe de fourniture dans la description de responsabilité
    ou le libellé de lecture.
  limit: Écart éditorial distinct des erreurs de producteur ou des manques de couverture.
  market_evidence_refs: []
  status: open
