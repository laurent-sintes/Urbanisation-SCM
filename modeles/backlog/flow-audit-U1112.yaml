  - La relation documente seulement ses résultats vers Operations Tracking ; aucun lien transverse ne désigne le producteur
    Supply de la demande et de ses modifications.
  recommendation: Raccorder le mandat confié et ses modifications à leur producteur documenté, puis conserver le retour de
    réalisation déjà défini.
  limit: Pas d’interface réelle ni d’affectation de site déduite du modèle.
  market_evidence_refs: []
  status: open
- id: FL-U1112-12
  priority: P2
  category: retour_metier_non_documente
  title: Le suivi d’acceptation ou de rejet des faits comptables n’a pas de retour structuré
  node_ids:
  - accounting-data-provision
  - subdomain-financial-accounting
  relation_ids:
  - REL-U981-accounting-facts
  - REL-U996-commercial-settlement-results
  evidence:
  - Accounting Data Provision doit suivre transmission, acceptation ou rejet ; Financial Accounting conserve corrections et
    rejets motivés.
  - Aucun retour correspondant n’est relié. Le résultat de régularisation commerciale vers Order Management répond à un autre
