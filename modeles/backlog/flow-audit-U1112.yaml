  recommendation: Décrire le retour nécessaire au suivi auprès du producteur des faits, en distinguant réception technique,
    acceptation métier et enregistrement comptable.
  limit: Absence de preuve structurée seulement ; U1108 précise les ledgers stock comme producteurs, sans modifier à ce stade
