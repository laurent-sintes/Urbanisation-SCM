market_evidence:
- id: MKT-FLOW-MS-PROMISE
  family: microsoft_dynamics
  product: Dynamics 365 Supply Chain Management
  title: Order promising
  url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/delivery-dates-available-promise-calculations
  consulted_on: '2026-10-16'
  locator: Order promising ; ATP calculations ; CTP calculations
  version: Documentation évolutive ; version globale non précisée
  finding: La promesse calcule des quantités et dates en utilisant stock, réceptions et besoins ; ces données sources ne confèrent
    pas à leur producteur la responsabilité de la promesse.
  limit: Appui fonctionnel partiel ; ne démontre pas le découpage FLOW Inventory/Availability/Master Plan ni une réalisation
    Beaumanoir.
- id: MKT-FLOW-SAP-AATP
  family: sap_s4hana
  product: SAP S/4HANA aATP
  title: Outlining Advanced Available-to-Promise (aATP) in SAP S/4HANA
  url: https://learning.sap.com/courses/exploring-aatp-in-sap-s-4hana/outlining-advanced-available-to-promise-aatp-in-sap-s-4hana
  consulted_on: '2026-10-16'
  locator: The Intelligent Order Promising ; Product Availability Check
  version: Cours en ligne ; version globale non précisée
  finding: aATP reçoit matériel/site/quantité/date et produit une proposition de confirmation fondée sur le stock et les apports
    futurs, avec concurrence des besoins.
  limit: Recouvrement partiel ; le cours regroupe aussi allocation et protection, sans imposer la hiérarchie FLOW.
- id: MKT-FLOW-MS-WMS
  family: microsoft_dynamics
  product: Dynamics 365 Supply Chain Management
  title: Warehouse management only mode with external ERP systems
  url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/wms-only-mode-external-erp
  consulted_on: '2026-10-16'
  locator: Inbound/Outbound process example ; On-hand inventory updates/reconciliation/update logs
  version: Documentation évolutive ; version globale non précisée
  finding: Demandes externes, résultats de réception/expédition et ajustements de stock sont distingués ; le document traite
    le risque des doubles mises à jour.
  limit: Appui entrepôt et ERP ; ne couvre pas toute Logistics ni une interface installée Beaumanoir.
- id: MKT-FLOW-SAP-WMS
  family: sap_s4hana
  product: SAP S/4HANA 2025
  title: Feature Scope Description
  url: https://help.sap.com/doc/e2048712f0ab45e791e6d15ba5e20c68/2025/en-US/FSD_OP2025_latest.pdf
  consulted_on: '2026-10-16'
  locator: p.192 Connecting to External Warehouse Control Systems ; p.534 Decentralized EWM
  version: 3.0 du 2026-10-07
  finding: La description distingue tâches/annulations émises et confirmations/mouvements reçus ; le partage dépend du périmètre
    d’intégration retenu.
  limit: Appui partiel aux échanges entrepôt ; pas preuve exhaustive transport/douane ni couverture FLOW installée.
- id: MKT-FLOW-MS-EXCHANGE
  family: microsoft_dynamics
  product: Dynamics 365 Supply Chain Management
  title: Exchange data between systems
  url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/wms-only-mode-exchange-data
  consulted_on: '2026-10-16'
  locator: Progress data and business events ; shipment order messages ; master data
  version: Documentation évolutive ; version globale non précisée
  finding: Identités des sources, validation des messages, progression et faits de stock sont documentés ; certains événements
    portent un identifiant permettant de lire le détail.
  limit: Un contrat produit de messages ne devient pas une capacité métier ni un protocole imposé à FLOW.
- id: MKT-FLOW-SAP-TM
  family: sap_s4hana
  product: SAP S/4HANA Transportation Management
  title: Warehouse Integration
  url: https://learning.sap.com/courses/planning-and-execution-in-sap-s-4hana-transportation-management/warehouse-integration
  consulted_on: '2026-10-16'
  locator: Integration of Transportation Management and Warehouse Management
  version: Cours en ligne ; version globale non précisée
  finding: La coordination du transport et de l’entrepôt articule plan, chargement, autorisation de sortie et retours d’exécution.
  limit: Exemple de coordination TM/EWM ; ne prouve pas tous les mandats de Transport Plan Decision ni les échanges FLOW.
- id: MKT-FLOW-MS-AUDIT
  family: microsoft_dynamics
  product: Dataverse utilisé par Dynamics 365 ; Dynamics 365 Customer Service
  title: Manage Dataverse auditing ; Work with cases
  url: https://learn.microsoft.com/en-us/power-platform/admin/manage-dataverse-auditing
  additional_url: https://learn.microsoft.com/en-us/dynamics365/customer-service/use/customer-service-hub-user-guide-create-a-case
  consulted_on: '2026-10-16'
  locator: Audit History ; activation par table/colonne ; Case Timeline
  version: Documentation évolutive ; version globale non précisée
  finding: Audit des changements d’enregistrement et historique du Case constituent des appuis de traçabilité ; la conservation
    dépend de la configuration.
  limit: Ni audit de lignes ni timeline ne prouvent la conservation exhaustive de tous événements métier externes et internes
    ou la reconstruction complète d’un Case FLOW.
- id: MKT-FLOW-SAP-MINING
  family: sap_other_supplementary
  product: SAP Signavio Process Intelligence
  title: Introducing to Data Transformation
  url: https://learning.sap.com/courses/analyzing-business-processes-with-sap-signavio-solutions/data-requirements-and-setup_c3cc0080-8486-4157-824f-d37acce55c0e
  consulted_on: '2026-10-16'
  locator: Introduction to Data Transformation ; What’s your Case?
  version: Cours en ligne ; version globale non précisée
  finding: Les données sources sont transformées en journal chronologique corrélé par Case ID, nom d’événement et date pour
    le mining.
  limit: Journal analytique reconstruit depuis les sources ; ne démontre pas un ledger opérationnel maître et ne remplace
    pas l’appui SAP S/4HANA exigé pour une future fiche comparée.
