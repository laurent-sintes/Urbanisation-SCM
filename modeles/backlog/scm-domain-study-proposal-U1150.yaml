boundaries:
- Aucun renommage, parent, nouvelle capacité, flux, formule ou objectif chiffré ajouté.
- La métaphore de la plomberie sert d’aide à la lecture dans le dossier ; elle ne devient pas une taxonomie du modèle.
- Promesse réalisable, autorisation de décision, réservation éventuelle et réalisation restent distinguées.
- Les sept KPI et les six questions restent développés dans le dossier ; les valeurs fictives ne deviennent pas des objectifs
  Beaumanoir.
- Le PDF lui-même reste inchangé dans cette proposition. Une révision ultérieure du dossier déclencherait sa procédure de
  synchronisation locale et distante.
