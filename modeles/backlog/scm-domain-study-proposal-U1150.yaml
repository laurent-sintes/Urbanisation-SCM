findings:
- id: F01
  finding: La définition actuelle commence par organiser les ressources et prestations ; elle rend peu visible le pilotage
    intégré des flux et ses objectifs.
  action: Formuler directement service rendu, largeur du parcours et compromis à piloter.
- id: F02
  finding: La pédagogie actuelle présente surtout rapprochement des demandes et coordination des prestations ; l’appoint nearshore
    est déjà illustré.
  action: Expliquer les arbitrages de bout en bout, la boucle faits–plans–décisions–résultats et ajouter le cas de préparation
    sans transfert, sans retirer les exemples existants.
- id: F03
  finding: Le dossier développe service, risque de retard, coût, transferts, surplus, délais et valeur récupérée.
  action: En donner une synthèse dans la fiche et renvoyer au PDF pour les sept KPI, six questions et fiches de calcul ; ne
    pas copier un tableau de bord ni adopter les cibles fictives.
- id: F04
  finding: Le dossier page 22 se réfère à la v087 ; le modèle courant a intégré en U1146 les précisions de délai de décision
    et de conditionnements, avant l’intercompany U1149.
  action: Présenter ces responsabilités comme documentées dans le modèle courant, sans reprendre comme statuts actuels les
    réserves temporelles du dossier. Les réalisations et résultats restent à prouver.
- id: F05
  finding: Le PDF est une étude courante commune aux versions, importée dans scmStudy.ts et déjà accessible depuis Télécharger
    et Documents → Études FLOW.
  action: Ajouter un accès contextuel au même asset dans la fiche du domaine, avec qualification temporelle visible.
proposed_domain_fields:
  definition: Piloter les ressources et les flux entre l’offre et la demande, en reliant achats, stocks, ventes, service après-vente,
    retours et déstockage.
  finality: Tenir les engagements de service en maîtrisant les coûts, les délais et le stock immobilisé, et en récupérant
    de la valeur sur les retours et les excédents.
  scope_change:
    operation: prepend_paragraph
    text: Le pilotage relie l’offre et la demande sur les parcours d’achat, de vente, de service après-vente, de retour et
      de déstockage. Les choix portent sur les ressources utilisables, les priorités, les lots, les destinations et les prestations.
      Leurs effets sont appréciés ensemble sur le service, les coûts, les délais, le stock et la valeur récupérée.
    preserve: Conserver la liste et les frontières des neuf sous-domaines ainsi que le cadrage offshore/nearshore, les règles
      de délégation, les limites des données et les distinctions planification/engagement/exécution.
  pedagogical_description:
    explanation: |-
      Ce domaine prépare et ajuste la façon dont les produits sont approvisionnés, affectés, livrés, repris ou réorientés. Il rapproche les demandes, le stock, les apports attendus et les capacités de prestation pour construire des engagements réalisables.

      Il compare les options sur l’ensemble du parcours : acheter autrement, choisir un autre site préparateur, adapter les lots, protéger une quantité pour le service après-vente ou remettre un retour en état. Une économie locale peut augmenter le coût ou le délai ailleurs. Les décisions tiennent compte des règles, des ressources et des engagements déjà pris.

      Les résultats observés permettent de réviser les plans et les règles de gestion. Le pilotage relie la planification, les décisions et leurs effets réels ; il distingue le temps nécessaire pour disposer de l’information, décider et réaliser l’action.
    additional_example:
      id: whole-chain-preparation-choice-U1150
      title: Choisir le site qui évite un transfert inutile
      situation: 'Exemple fictif : une commande de 100 pièces peut être préparée depuis A après un transfert de 70 pièces
        depuis B, ou directement depuis B. Les deux options permettent de tenir la date demandée et préservent le stock protégé
        pour le service après-vente.'
      contribution: Comparer les ressources utilisables, la faisabilité et le coût du parcours complet avant d’autoriser le
        choix du site préparateur.
      outcome: 'L’option depuis B coûte ici 220 € de préparation et transport, contre 300 € depuis A : un transfert préalable
        est évité. Les effets réels sur le service, le coût et les autres engagements restent à vérifier après exécution.'
      lesson: Le transport final peut être plus cher alors que le parcours complet est moins coûteux. Une simulation ne prouve
        pas un gain réalisé.
      source_pdf_page: 14
    boundary_explanation: Le domaine tient les plans, commandes, engagements et faits de stock de son périmètre, arbitre les
      usages des ressources et coordonne les prestations confiées. Commerce conserve offres, canaux et décisions commerciales
      ; Sourcing and Procurement conserve sources, accords et échanges fournisseur. Finance garde les autorités financières
      ; Logistics et les autres exécutants réalisent les opérations. Les cas de fabrication ne sont pas ajoutés au modèle
      actuel. Cette répartition n’exclut ni la planification ni les commandes de vente et d’achat du domaine, et ne présume
      aucun moteur ou déploiement unique.
    preserve_existing_examples: true
    guidance: 'Réutiliser le contrat pédagogique structuré existant : exemple dans fields.examples, référence dans example_refs
      ; frontières dans distinctions avec les périmètres concernés. Aucun nouveau champ de métamodèle nécessaire pour ces
      textes.'
