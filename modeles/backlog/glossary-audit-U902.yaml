schema_version: 1.0.0
id: glossary-audit-U902
status: applied_verified
source_refs:
- U901
- U902
- U903
- U904
as_of: '2026-10-07'
scope: Backlog courant, glossaires métier et méthodologique, liens depuis fiches/scénarios et présentation Atlas. Les éditions
  publiées restent inchangées.
method:
- Lecture des 220 noms et définitions métier et des 40 entrées méthodologiques brutes.
- Reconstitution des listes exposées par le guide candidat et GlossaryPage, pour distinguer archives, alias et entrées visibles.
- Contrôles des liens, définitions courtes, doublons de libellés, contextes répétitifs et mentions des candidats manquants.
- Lecture ciblée des contextes, notes et frontières pour chaque constat ; absence de lien non assimilée à inutilité.
counts:
  raw_business: 220
  raw_method: 40
  visible_business: 210
  visible_method: 30
  verbs: 25
  no_external_link: 116
  placeholder_context: 51
findings:
- id: G01
  priority: P1
  kind: object_vs_capability
  terms:
  - TER069
  - TER150
  - TER104
  finding: Sales Order, Preorder et Scrapping Order définissent une action de gestion plutôt que l’objet ou le statut. Le
    nom de capacité peut rester identique, mais la définition lexicale doit expliquer la notion.
  recommendation: Définir commande, statut et demande de rebut ; renvoyer aux capacités responsables. Ne pas copier automatiquement
    toute définition de capacité dans son terme homonyme.
  status: applied
- id: G02
  priority: P1
  kind: duplicate
  terms:
  - TER102
  - TER161
  finding: 'Deux entrées visibles portent exactement le nom Inventory Disposition : l’une définit le devenir retenu, l’autre
    la responsabilité de le déterminer.'
  recommendation: Une définition lexicale de disposition ; la responsabilité reste expliquée dans la fiche Inventory Disposition
    et sa décision. Conserver une résolution des anciens liens, sans réutiliser les identifiants.
  status: applied
- id: G03
  priority: P1
  kind: rendering_gap
  terms:
  - TER008
  - TER013
  - TER014
  - TER015
  - TER042
  - TER078
  - TER080
  finding: 'Des distinctions utiles figurent dans notes, mais GlossaryPage ne rend pas les notes métier. Exemple : TER014
    précise seulement dans notes qu’une proposition calculée n’est pas encore une promesse prise ; TER080 y distingue réassort
    local et replenishment.'
  evidence: 'app/src/components/GlossaryPage.tsx : contexte affiché ; notes rendues uniquement pour les termes méthodologiques
    issus du guide.'
  recommendation: Remonter les distinctions utiles dans la définition ou le contexte public. Ne pas afficher en bloc les notes
    internes contenant historiques, identifiants de preuves et réserves éditoriales.
  status: applied
- id: G04
  priority: P1
  kind: stale_cross_reference
  terms:
  - TER098
  - TER078
  finding: TER098 indique encore que les projections d’achat peuvent être adressées à Purchase Order ; la frontière actuelle
    sépare Planned Purchase Order et Purchase Order après affermissement. TER078 parle encore de réception dans Plans, alors
    que Plan Ingestion relève d’Integration.
  recommendation: Aligner ces explications sur les objets et rattachements actuels ; conserver les distinctions déjà approuvées,
    sans changer les flux métier.
  status: applied
- id: G05
  priority: P2
  kind: historical_alias
  terms:
  - TER188
  finding: Merchandise Reference reste une entrée visible alors que le sujet est désormais Product Reference. Aucun lien entrant
    trouvé depuis les fiches ou scénarios ni depuis les autres contextes lexicaux audités.
  recommendation: Retirer cette entrée de la liste courante et conserver un alias/routage vers Product Reference. Préserver
    les éditions historiques et l’identité retirée.
  status: applied
- id: G06
  priority: P2
  kind: near_duplicate
  terms:
  - TER007
  - TER055
  finding: Mouvement de stock et Stock movement / Inventory movement ; Goods movement chez SAP expliquent le même noyau métier
    à deux endroits.
  recommendation: Une entrée principale de mouvement de stock, avec synonymes et différences éditeurs explicites ; ne pas
    assimiler sans nuance tous les objets ERP.
  status: applied
- id: G07
  priority: P2
  kind: ambiguous_local_convention
  terms:
  - TER004
  - TER060
  finding: Article / unité de gestion est historique ; Article est défini comme un rôle de Product. La séparation et ses raisons
    sont surtout dans des notes non affichées.
  recommendation: Revoir ces deux entrées ensemble pour définir simplement le bien géré et le vocabulaire local utile ; éviter
    une taxonomie logicielle implicite. Retrait ou alias de TER004 à arrêter avec le sens retenu de TER060.
  status: applied
- id: G08
  priority: P2
  kind: overlap
  terms:
  - TER036
  - TER120
  - TER037
  finding: Fait de gestion — sens plateforme et Business Fact se recouvrent. La règle locale de rattachement à un document
    reste une distinction à conserver, pas une raison suffisante pour répéter le concept.
  recommendation: Une notion métier principale et un encadré de convention documentaire FLOW ; garder Document distinct du
    fait et de sa notification.
  status: applied
- id: G09
  priority: P2
  kind: low_current_use
  terms:
  - TER065
  - TER034
  finding: Supply Order est un terme générique local sans lien entrant ni mention littérale dans les fiches et scénarios examinés.
    OMS — sens fonctionnel du projet décrit un découpage ancien ; sa pertinence actuelle doit être justifiée par un usage
    explicite.
  recommendation: Candidats à sortir du premier niveau du glossaire courant, en conservant les sens historiques. Ne pas confondre
    faible lien documentaire et inutilité métier prouvée.
  status: applied
- id: G10
  priority: P2
  kind: editorial_noise
  terms:
  - VER001
  - VER004
  - VER024
  - VER025
  finding: Les 25 entrées VER sont affichées dans le glossaire métier. Les verbes génériques alourdissent la lecture ; réserver,
    affecter ou libérer portent toutefois des distinctions métier utiles.
  recommendation: Déplacer les consignes de rédaction génériques vers le guide de modélisation. Conserver les verbes métier
    utiles comme alias ou compléments de leurs notions, sans suppression uniforme des 25 entrées.
  status: applied
- id: G11
  priority: P2
  kind: placeholder
  terms: []
  finding: 51 entrées métier affichent le contexte générique « Notion locale en cours de consolidation ; consulter les sources
    et les réserves ». Toutes ont néanmoins une définition et une définition courte.
  recommendation: Remplacer ce contexte par une précision utile ou le supprimer s’il ne fournit aucune information ; ne pas
    supprimer les notions elles-mêmes.
  status: applied
- id: G12
  priority: P2
  kind: method_boundary
  terms:
  - MOD009
  - MOD014
  finding: Business Reference et Projection ne rappellent pas explicitement la frontière entre autorité source d’entreprise
    et responsabilité locale sur la référence utilisable. Les fiches métier la précisent déjà.
  recommendation: Compléter brièvement cette frontière dans le vocabulaire méthodologique ; « partagé » ne doit pas imposer
    un référentiel technique commun, ni « projection » une copie passive.
  status: applied
- id: G13
  priority: P2
  kind: metadata
  terms: []
  finding: Les en-têtes as_of sont encore au 26 septembre pour le métier et au 28 septembre pour la méthode, malgré les évolutions
    d’octobre.
  recommendation: Définir la signification de cette date et l’actualiser avec les lots si elle représente l’état courant ;
    aucune modification de dates de publications figées.
  status: applied
- id: G14
  priority: P1
  kind: container_clarity
  terms:
  - TER061
  - TER196
  - TER185
  - TER186
  - TER189
  finding: Container était défini comme un rôle de Product, formulation inutilement liée à une construction de modèle. Le
    contenant, son type, la consigne et l’unité avec contenu sont des notions utiles à distinguer.
  recommendation: Conserver Container, défini simplement comme contenant ou support ; maintenir Container Type comme notion
    documentaire interne au périmètre Packaging.
  status: applied
  evidence: Définition, infobulle, contexte et positionnement marché TER061 alignés ; preuves antérieures conservées dans
    packaging-container-vocabulary-U899.yaml.
