    market_inspiration:
      choice: 'Comprendre les noms anglais du mouvement de stock : Stock movement et Inventory movement renvoient aux variations
        reconnues ; SAP utilise notamment Goods movement. Le mouvement reste distinct de son écriture justificative et ne
        suppose pas toujours un déplacement.'
      flow_scope: Variations de quantité, lieu, état ou propriété.
      flow_approach: Lire le sens du terme dans son contexte produit.
      synthesis:
      - Microsoft met en avant Inventory journals ; SAP parle de Goods movements et de leurs effets de gestion. Ce sont des
        vocabulaires voisins dont les découpages dépendent des produits.
      - FLOW conserve Mouvement de stock pour le fait reconnu, y compris un changement d’état sans déplacement. Les écritures,
        messages et justificatifs décrivent ce fait sans devenir des mouvements supplémentaires.
      examples:
