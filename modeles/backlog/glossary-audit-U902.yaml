      status: proposed
      source_refs:
      - U892
      - U893
      - U894
      term_choice: Sales Order conserve sa responsabilité générique.
      definition_choice: 'Gérer les commandes clients à satisfaire : enregistrer ce qui est demandé, maintenir les quantités,
        destinations et échéances applicables, suivre les évolutions autorisées et déterminer ce qui reste à servir.'
    market_inspiration:
      choice: Savoir ce que le client attend et ce qui reste à lui servir. Sales Order conserve ce nom usuel pour la gestion
        de la commande, avec livraison, retrait ou livraison directe selon les lignes.
      flow_scope: 'Gérer les commandes clients à satisfaire : enregistrer ce qui est demandé, maintenir les quantités, destinations
        et échéances applicables, suivre les évolutions autorisées et déterminer ce qui reste à servir.'
      flow_approach: |-
        Tenir les lignes, quantités, destinations, échéances et prix applicables de la commande client. Distinguer demandé, proposé, confirmé et réalisé ; suivre le reste à satisfaire et les évolutions autorisées selon le [cycle commun d’Order Management](model:D04#scope). Les conditions de l’[Agreement](glossary:TER048) restent sous leur autorité ; leur consultation n’autorise pas à les négocier.

        Exemple fictif : sur 100 pièces, 60 sont livrées et 40 restent à servir. Une demande de report des 40 ne change pas automatiquement la date promise. Un retour ultérieur crée une [Return Order](glossary:TER072) distincte, liée à la vente lorsque connue ; il n’efface pas la livraison.

        [Availability](glossary:TER112) détermine les propositions de promesse et les affectations ; la commande conserve les engagements effectivement acceptés. [Process Management](glossary:TER164) conduit le parcours ; [Service Management](glossary:TER152) porte les prestations confiées et [Fulfilment Coordination](glossary:TER176) les coordonne. Les exécutants réalisent les opérations. Les règles détaillées d’imputation, tolérances et autorisations restent à instruire.

        [Ship to Customer](model:BHV066), [Customer Pickup](model:BHV067), [Direct Delivery](model:BHV068) et [Intercompany Sales](model:BHV069) décrivent des axes combinables. Intercompany qualifie la relation commerciale ; les autres précisent le mode de satisfaction. Identifier les quantités concernées sans les compter deux fois.

        [Preorder](glossary:TER150) est un statut de la commande existante avant disponibilité commerciale. Suivre l’attente, le degré d’engagement et les révisions autorisées ; la sortie de précommande conserve la même identité. Une précommande peut déjà être ferme. La [distinction avec les propositions d’achat planifiées](model:D04#scope) dépend de la nature des objets, pas d’une règle générale achat/vente.

        Les demandes et précommandes connues peuvent éclairer [Plan Visibility](model:subdomain-plans) selon leur horizon. Leur prise en compte ne crée pas une seconde commande ni une addition automatique à la prévision ; les ventes observées constituent un apport distinct.

        Appliquer le résultat du [Credit Check](glossary:TER155) conduit par le [Case](glossary:TER064) de [Wholesale](model:subdomain-sales-wholesale) selon le [contrat commun](model:D04#scope), avec motif, portée, version et validité. Tenir la suspension ou la reprise autorisée ; une information absente, périmée ou une échéance dépassée ne lève pas le blocage. La dérogation reste sous autorité de [Finance](glossary:TER117).

        La vue [Product Reference](model:D08) aide à comprendre les biens demandés à la vente ; leur identité reste commune dans [Product Reference](model:D08). Leurs offres et sélections ne deviennent pas de nouvelles identités produit.
      synthesis:
      - Microsoft Commerce distingue les modes de remise au client ; les documentations Direct delivery et Intercompany ajoutent
        respectivement le chemin fournisseur et la relation entre sociétés.
      - FLOW retient ces distinctions combinables. Le contenu attendu reste dans Sales Order, tandis que choisir la meilleure
        solution, promettre et exécuter mobilisent d’autres responsabilités.
      examples:
      - title: Illustration FLOW — Une vente, deux modes de remise
        situation: Un client commande une veste à retirer samedi et un sac à recevoir chez lui.
        outcome: Chaque ligne conserve son lieu, sa date et son reste à servir.
        lesson: Le retrait de la veste ne clôt pas automatiquement la demande du sac.
        source_title: Customer orders in point of sale (POS)
        source_url: https://learn.microsoft.com/en-us/dynamics365/commerce/customer-orders-overview
        source_refs:
        - U400
        - U401
        - ELM240
        - CMP151
        - U477
        - ELM392
        - CMP189
  TER078:
    context: Objet métier descriptif de résultat, pas un niveau supplémentaire de comportement ; convention de vocabulaire
      U289.
    notes: |-
      Préciser statut proposé/retenu/appliqué, périmètre, version et hypothèses. Exemple fictif : ressource de 100 pièces affectée à deux commandes pour 60 et 40 selon les règles. Il ne s’agit ni d’une enveloppe par canal ni nécessairement d’un transfert entre sites. Décider les affectations, les enregistrer, confirmer la promesse et modifier les [Orders](glossary:TER012) ont des effets distincts.

      U290 : la finalité de l’affectation est de maximiser une valeur multidimensionnelle sous contraintes. Service, engagements, coûts et risques sont des exemples éditoriaux ; leurs poids et modes d’arbitrage ne sont pas fixés.

      U436 : seule la réservation bloque les usages concurrents ; l’affectation seule ne les bloque pas. Créer, conserver ou réviser un lien d’affectation ne crée donc pas implicitement une réservation. Les protections de groupe conservent leurs règles d’admissibilité, et un gel d’affectation sa restriction de modification. Expiration, consommation, libération et déclenchement automatique éventuel d’une réservation restent à préciser ; aucun mécanisme technique de concurrence n’est déduit de cette frontière.

      U668/U673 : cet objet porte le [master plan de matching](glossary:TER100), construit et géré dans [Availability](glossary:TER112). Il est distinct du [Supply Plan](glossary:TER098), prévision d’entrées et sorties de stock hors achats reçue dans Plans.
    market_inspiration:
      choice: Un Supply Assignment Plan décrit les ressources, quantités et dates proposées ou retenues pour les commandes
        et besoins prévisionnels identifiés. Son statut doit dire s’il est seulement envisagé, choisi ou déjà appliqué.
      flow_scope: Ensemble cohérent d’affectations avec hypothèses et contraintes.
      flow_approach: Rendre visibles les liens proposés et le reste sans couverture.
      synthesis:
      - Microsoft IFO produit un fulfillment plan détaillant les lignes couvertes ou non. Oracle Backlog Management distingue
        résultats planifiés et résultats transmis. Les deux aident à séparer contenu d’un plan et effet de son application.
      - FLOW précise « Assignment » pour nommer un plan de liens aux ressources. Cet objet n’est pas un comportement supplémentaire
        et ne réserve pas par sa seule existence.
      - Microsoft Supply Chain Management documente un plan intégrant commandes et prévisions ; son périmètre inclut la création
        de Planned Orders. FLOW décrit ici les affectations, avec réservation et couverture amont distinctes.
      examples:
      - title: Illustration FLOW — un plan avant application
        situation: Un stock de 100 pièces est proposé pour deux commandes à hauteur de 60 et 40.
        outcome: Le plan expose ces liens, sa version et ses hypothèses ; leur mise en place reste identifiable séparément.
        lesson: Le fulfillment plan Microsoft éclaire la représentation du résultat, sans imposer son mécanisme d’application.
        source_title: Intelligent Fulfillment Optimization architecture
        source_url: https://learn.microsoft.com/en-us/dynamics365/intelligent-order-management/ifo-arch
        source_refs:
        - U477
        - ELM403
        - CMP191
