superseded_fields_U903:
  TER001:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Décrire ce que l’entreprise sait faire permet de conserver un repère quand ses équipes ou ses outils changent.
        Capacité métier désigne cette aptitude durable.
      flow_scope: Aptitude de l’entreprise à produire un résultat métier.
      flow_approach: Définir le service attendu avant les moyens employés.
      synthesis:
      - Le guide TOGAF sépare le « quoi » des rôles, processus et outils qui le rendent possible. GEA-NZ reprend cette distinction
        en rattachant plus explicitement chaque capacité à sa raison d’être. Les deux partent du besoin de l’entreprise.
      - 'FLOW conserve cette indépendance : un changement d’application ne suffit pas à créer une nouvelle capacité. L’étape
        d’un parcours ou la fonction d’un produit n’en devient une que si elle correspond à une aptitude métier justifiée.'
      examples:
      - title: GEA-NZ — payer les salariés
        situation: GEA-NZ compare un petit employeur qui paie directement son personnel à un employeur utilisant un logiciel
          de paie et des virements.
        outcome: Les moyens changent ; le besoin de payer les salariés demeure.
        lesson: La même distinction permet de parler de la capacité avant de choisir sa réalisation.
        source_title: Business capabilities
        source_url: https://dns.govt.nz/standards-and-guidance/technology-and-architecture/government-enterprise-architecture/gea-nz-framework/business-capabilities
        source_refs:
        - U477
        - ELM333
        - CMP192
  TER002:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Nommer ce sur quoi l’entreprise raisonne permet de partager les mêmes faits et décisions. Objet métier désigne
        cette notion, indépendamment de son stockage ou de sa représentation.
      flow_scope: Commandes, ressources et autres notions utiles au raisonnement métier.
      flow_approach: Distinguer le sens métier des documents et outils qui le portent.
      synthesis:
      - Fowler décrit un Domain Model composé d’objets qui portent des informations et des comportements. Evans distingue
        notamment les objets suivis par leur identité de ceux caractérisés par leur valeur. Ils cherchent tous deux à représenter
        le métier dans un logiciel.
      - 'FLOW emploie Objet métier à une maille plus générale : reconnaître une commande ou une ressource ne choisit pas encore
        sa forme informatique. Ni une table ni un message ne deviennent un objet métier par leur seule existence.'
      examples:
      - title: Fowler — la ligne de commande
        situation: Fowler cite la ligne d’un bon de commande parmi les objets qui peuvent avoir un sens dans un modèle de
          domaine.
        outcome: L’objet peut représenter une notion plus fine qu’une entreprise entière, également citée dans le texte.
        lesson: Dans FLOW, la pertinence vient du raisonnement métier ; cet exemple ne fixe pas une structure de données.
        source_title: Domain Model
        source_url: https://martinfowler.com/eaaCatalog/domainModel.html
        source_refs:
        - U477
        - ELM461
        - CMP192
  TER003:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Désigner ce qui peut être mobilisé pour un résultat : Ressource couvre un bien, un moyen ou un droit, sous
        des conditions explicites. Ce terme de travail est plus large que le stock de marchandises.'
      flow_scope: Biens, moyens et droits mobilisables.
      flow_approach: Préciser disponibilité, accès et usage admissible.
      synthesis:
      - Microsoft éclaire les moyens pris en compte pour répondre aux besoins ; SAP montre qu’un droit peut limiter leur accès.
        Les documents ne proposent pas le même objet ni une définition commune du mot ressource.
      - FLOW utilise Ressource comme terme englobant, puis nomme le bien, le moyen ou le droit concerné. La quantité et l’information
        qui le représente ne doivent pas être comptées comme deux ressources physiques.
      examples:
      - title: Illustration FLOW — cent pièces, un accès limité
        situation: Cent pièces existent dans le réseau, mais un groupe ne peut en confirmer que vingt sur la période.
        outcome: Le stock vaut cent ; le droit de ce groupe borne son accès à vingt.
        lesson: La ressource physique et la règle d’accès ont des rôles différents.
        source_title: Explaining aATP Product Allocation (PAL)
        source_url: https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-aatp-product-allocation-pal-_dd30c229-d63f-4aba-a950-a174280c4a58
        source_refs:
        - U477
        - ELM448
        - CMP190
  TER004:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Nommer le bien à la maille utile à sa gestion. Article / unité de gestion rappelle qu’une référence commune
        et un exemplaire physique ne répondent pas au même besoin d’identification.
      flow_scope: Bien identifié pour les usages commerciaux ou opérationnels.
      flow_approach: Préciser la maille avant d’interpréter le mot article.
      synthesis:
      - Microsoft parle de produit et de variante pour la définition partagée. GS1 parle de trade item pour la référence commerciale
        et distingue son identification de celle d’un exemplaire. Ces vocabulaires se recouvrent sans désigner une maille
        unique dans tous les usages.
      - FLOW conserve ce terme général comme repère de lecture. Lorsqu’une distinction est nécessaire, les notions Product,
        Product Variant et Product Unit donnent un sens plus précis.
      examples:
      - title: Illustration FLOW — compter dix exemplaires
        situation: Dix tee-shirts partagent une même taille/couleur et une référence de gestion.
        outcome: On peut parler d’un article de référence et de dix pièces physiques.
        lesson: Préciser cette maille évite de confondre référence et quantité.
        source_title: Product information overview
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/pim/product-information
        source_refs:
        - U477
        - ELM423
        - CMP193
  TER005:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Parler des biens présents dans un périmètre à une date : Stock désigne ici les marchandises. Leur existence,
        leur propriété et leur disponibilité restent trois questions distinctes.'
      flow_scope: Biens matériels du périmètre considéré.
      flow_approach: Dater le périmètre et distinguer présence et disponibilité.
      synthesis:
      - SAP relie le stock à des qualifications et à sa valeur ; Microsoft distingue plusieurs quantités pour une même marchandise.
        Aucun de ces usages ne justifie de traiter tout stock comme librement utilisable.
      - FLOW retient le sens matériel. Une réservation, un blocage ou une propriété fournisseur expliquent son usage possible
        sans créer un second ensemble de biens.
      examples:
      - title: Illustration FLOW — présentes mais pas toutes disponibles
        situation: Cent pièces sont présentes dans un entrepôt ; vingt sont réservées et dix bloquées.
        outcome: Le stock physique reste cent, alors que la quantité utilisable dépend des règles retenues.
        lesson: Stock ne signifie ni propriété acquise ni disponibilité immédiate pour toute demande.
        source_title: Inventory on-hand list
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-on-hand-list
        source_refs:
        - U477
        - ELM408
        - CMP190
  TER006:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Situer une quantité de stock sans perdre son contexte : Position de stock précise le produit, le lieu, la date
        et les dimensions métier utiles. Deux vues de la même quantité ne constituent pas deux stocks.'
      flow_scope: Quantité datée à une maille explicite.
      flow_approach: Conserver les dimensions nécessaires à son interprétation.
      synthesis:
      - Microsoft montre pourquoi un total change lorsqu’on détaille les lieux ou autres dimensions ; Oracle ajoute la lecture
        chronologique. Les deux rendent une quantité interprétable par son contexte.
      - FLOW nomme Position de stock cette quantité qualifiée. Le détenteur, le propriétaire ou l’état sont précisés lorsqu’ils
        changent le sens ; la copie du même fait dans un autre système ne crée pas de stock.
      examples:
      - title: Illustration FLOW — quarante pièces, deux lieux
        situation: Quinze pièces d’un article sont au magasin A et vingt-cinq au magasin B à la même date.
        outcome: Les deux positions détaillées expliquent un total réseau de quarante.
        lesson: Additionner le total réseau aux détails produirait un double compte.
        source_title: Inventory on-hand list
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-on-hand-list
        source_refs:
        - U477
        - ELM408
        - CMP190
  TER007:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Reconnaître ce qui change la situation de stock : Mouvement de stock désigne un fait, comme une réception ou
        un changement d’état. Une intention et le document qui l’annonce ne suffisent pas à établir ce fait.'
      flow_scope: Faits qui modifient une position de stock.
      flow_approach: Distinguer fait reconnu, enregistrement et correction.
      synthesis:
      - Microsoft présente les enregistrements qui modifient les quantités ; GS1 organise la description et la correction
        des faits de visibilité. Les périmètres se recouvrent sans rendre journal, événement et mouvement synonymes.
      - FLOW part du changement reconnu. Une réservation peut changer une qualification du stock ; elle ne prouve aucune sortie
        physique.
      examples:
      - title: Illustration FLOW — transfert annoncé puis réalisé
        situation: Un transfert de vingt pièces est demandé, puis son départ est constaté.
        outcome: L’annonce exprime un projet ; le départ reconnu change les positions concernées.
        lesson: 'Le même document peut porter plusieurs étapes : il faut identifier le fait effectivement acquis.'
        source_title: Inventory journals
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-journals
        source_refs:
        - U477
        - ELM407
        - CMP190
  TER008:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Identifier ce qui devrait devenir mobilisable : Ressource attendue comporte une date et des conditions de mise
        à disposition. Elle reste distincte d’une ressource déjà présente et d’un simple potentiel non daté.'
      flow_scope: Apports attendus, datés et qualifiés.
      flow_approach: Rendre explicites origine, échéance et conditions.
      synthesis:
      - Oracle rend visibles les apports futurs ; Microsoft montre que certains peuvent soutenir un engagement avant réception.
        Visibilité, admissibilité et présence sont donc des propriétés différentes.
      - FLOW exige une date et des conditions pour parler de Ressource attendue. La source de l’attente et son degré de fermeté
        doivent permettre d’apprécier ce qu’elle peut réellement soutenir.
      examples:
      - title: Illustration FLOW — trente pièces prévues demain
        situation: Trente pièces d’une commande fournisseur doivent être reçues demain.
        outcome: Elles peuvent entrer dans une projection à demain si les règles l’autorisent, mais pas dans le stock présent
          aujourd’hui.
        lesson: Une prévision d’achat encore sans date ne porte pas le même niveau d’attente.
        source_title: How You Review Item Supply and Demand
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25d/famml/how-you-review-item-supply-and-demand.html
        source_refs:
        - U477
        - ELM356
        - CMP190
  TER009:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'La disponibilité indique quelle quantité peut servir un usage à une date donnée. Nous gardons ce sens contextualisé
        : un stock présent n’est pas nécessairement mobilisable pour toute demande.'
      flow_scope: Quantité admissible pour un usage et un horizon.
      flow_approach: Lire ressources, engagements et règles ensemble.
      synthesis:
      - Microsoft distingue le stock physique disponible et la disponibilité future calculée. Oracle distingue aussi ce qui
        est promettable de ce qui est déjà présent pour réservation. Le mot disponibilité dépend donc de la question posée.
      - FLOW exige d’indiquer l’usage, la date et les conditions. Une réponse positive n’engage pas automatiquement la quantité
        et ne prouve pas sa réception.
      examples:
      - title: Oracle — disponible pour plus tard
        situation: Une réception attendue au jour 28 peut couvrir une demande du jour 30.
        outcome: Elle ne constitue pourtant pas du stock présent réservable au jour 1.
        lesson: Toujours qualifier de quelle disponibilité on parle.
        source_title: Keep Global Order Promising and Inventory Management Synchronized
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26a/fascp/keep-availability-in-global-order-promising-and-inventory-management-synchronized.html
        source_refs:
        - U477
        - ELM361
        - CMP191
  TER010:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Nommer ce qui manque ou le résultat recherché avant de choisir comment le demander. Besoin reste une convention
        locale plus large qu’une commande déjà formalisée.
      flow_scope: Résultat souhaité ou manque, exprimé ou encore à préciser.
      flow_approach: Distinguer le besoin, sa formulation en demande et la réponse retenue.
      synthesis:
      - Microsoft montre un besoin issu d’un seuil de stock ; Oracle traite une demande d’approvisionnement déjà identifiée.
        Les deux se situent à des moments différents de sa formalisation.
      - FLOW conserve Besoin pour parler du résultat recherché même avant une commande. Ce rapprochement éclaire la convention,
        sans transformer le terme en objet universel adopté.
      examples:
      - title: Illustration FLOW — Un stock trop faible avant commande
        situation: Un stock risque de passer sous son minimum ; aucun achat n’a encore été lancé.
        outcome: Un besoin de couverture est identifié.
        lesson: Identifier ce besoin ne prouve ni une demande acceptée ni une ressource promise.
        source_title: Safety stock fulfillment for items
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/safety-stock-replenishment
        source_refs:
        - U477
        - ELM422
        - CMP189
  TER011:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Rendre identifiable ce que quelqu’un souhaite obtenir. Demande précise le résultat et, lorsque cela a du sens,
        l’objet, la quantité, l’échéance et le bénéficiaire.
      flow_scope: Expression suivable d’un résultat souhaité.
      flow_approach: Conserver l’expression initiale sans lui attribuer acceptation, promesse ou couverture.
      synthesis:
      - Oracle montre une demande adressée à l’orchestration ; OASIS distingue l’ordre commercial de sa réponse. Tous deux
        permettent de séparer ce qui est demandé de ce qui est accepté.
      - FLOW retient cette séparation de sens. La convention ne crée pas un objet unique qui remplacerait toutes les familles
        de commandes ou de demandes.
      examples:
      - title: Illustration FLOW — Demander n’est pas obtenir
        situation: Un acheteur demande 40 pièces pour jeudi ; le fournisseur n’a pas encore répondu.
        outcome: La demande est identifiable mais non confirmée par cette seule émission.
        lesson: Quantité demandée, quantité promise et quantité reçue restent trois notions distinctes.
        source_title: Universal Business Language Version 2.4
        source_url: https://docs.oasis-open.org/ubl/UBL-2.4.html
        source_refs:
        - U477
        - ELM336
        - CMP189
  TER013:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Un engagement précise ce qui est tenu envers une demande ou un usage, pour quel bénéficiaire et sous quelles
        conditions. Ce mot doit être qualifié : engagement de fourniture, de ressource et d’exécution n’ont pas automatiquement
        les mêmes effets.'
      flow_scope: Décision tenue et conditions qui l’accompagnent.
      flow_approach: Identifier l’objet engagé, sa fermeté et ses possibilités de révision.
      synthesis:
      - Microsoft parle de customer commitments liés aux dates confirmées et à leur couverture. Oracle sépare les résultats
        simulés des engagements de planification effectivement modifiés. Les deux distinguent une hypothèse de ce sur quoi
        l’on doit compter.
      - FLOW utilise engagement comme notion plus générale. Une réservation protège un usage ; une promesse porte sur une
        fourniture. Leur association éventuelle doit être explicite.
      examples:
      - title: Illustration FLOW — conserver ce qui soutient la date promise
        situation: Une date a été confirmée et un arrivage lui est lié.
        outcome: Un nouveau plan doit rendre visible ce qu’il préserve ou remet en question.
        lesson: Microsoft documente une politique de préservation ; FLOW ne la transforme pas en fermeté universelle de tout
          engagement.
        source_title: Keep supply for confirmed demand
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/keep-supply-for-confirmed-demand
        source_refs:
        - U477
        - ELM418
        - CMP191
  TER014:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Une promesse engage sur la fourniture attendue d’une demande, notamment une quantité et une date. Nous réservons
        ce mot à la réponse engagée ; une solution calculée ou présentée peut encore n’être qu’une proposition.
      flow_scope: Engagement de satisfaction et conditions explicites.
      flow_approach: Distinguer demande, possibilité, proposition et promesse prise.
      synthesis:
      - Microsoft Order promising travaille les dates auxquelles les produits pourront être livrés. Oracle Check Availability
        emploie promising jusque dans l’exploration de résultats non appliqués. Le vocabulaire produit peut donc couvrir davantage
        que l’engagement déjà pris.
      - FLOW précise ce niveau de fermeté pour éviter l’ambiguïté. Une promesse peut exister sans affectation à une ressource
        précise ; elle ne signifie pas que la livraison est réalisée.
      examples:
      - title: Illustration FLOW — proposer n’est pas encore promettre
        situation: Un résultat indique 60 pièces vendredi et 40 lundi.
        outcome: Tant que cette réponse n’est pas confirmée selon les conditions applicables, elle reste une proposition.
        lesson: Oracle distingue exploration et application ; FLOW explicite le mot correspondant à l’engagement.
        source_title: Check Availability
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/fascp/check-availability.html
        source_refs:
        - U477
        - ELM350
        - CMP191
  TER015:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: La confirmation de promesse établit les quantités et dates sur lesquelles le demandeur peut compter. Elle doit
        être distinguée d’un simple accusé de réception ou d’une confirmation documentaire de commande.
      flow_scope: Acte ou résultat qui établit l’engagement de satisfaction.
      flow_approach: Identifier ce qui est confirmé et la part qui ne l’est pas.
      synthesis:
      - SAP parle de confirmations de quantités dans BOP. Microsoft Confirm sales orders désigne un parcours documentaire
        de commande, avec statut et contrôle de crédit. Le même mot confirmation ne porte donc pas toujours le même effet.
      - FLOW ajoute « de promesse » pour nommer précisément l’engagement de satisfaction. Confirmer ne prouve ni réservation,
        ni expédition, ni réalisation physique.
      examples:
      - title: Microsoft — un document confirmé
        situation: Le parcours Microsoft confirme une commande et lui donne le statut documentaire Confirmation.
        outcome: Ce statut atteste l’action documentaire décrite.
        lesson: Pour FLOW, il faut encore préciser les quantités et dates engagées ; le mot confirmation seul ne suffit pas.
        source_title: Confirm sales orders
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/tasks/confirm-sales-orders
        source_refs:
        - U477
        - ELM439
        - CMP191
  TER016:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves. La réservation protège une ressource
      pour une demande ; elle se distingue d’une interdiction d’usage pour non-conformité décidée par [Inventory Disposition](glossary:TER102)
      Decision.
    market_inspiration:
      choice: 'Préserver une quantité pour une demande identifiée : Réservation de ressource enregistre cet engagement et
        ses effets sur les demandes concurrentes. Une simple affectation de ressource ne produit pas ce blocage.'
      flow_scope: Engagement quantitatif en faveur d’une demande.
      flow_approach: Préciser concurrence, durée, révision et consommation.
      synthesis:
      - Microsoft insiste sur l’effet partagé entre canaux ; Oracle sur le lien demande–ressource et sa maille. Leur point
        commun utile est un engagement qui change ce que les concurrents peuvent obtenir.
      - 'FLOW conserve cette frontière avec Supply Assignment : proposer une affectation n’est pas encore réserver. La portée
        de la réservation, ses révisions et sa consommation doivent être expliquées.'
      examples:
      - title: Exemple Microsoft — dix pièces retenues sur cent
        situation: Un canal réserve dix pièces alors que cent sont présentes.
        outcome: L’autre canal voit quatre-vingt-dix pièces disponibles selon le mécanisme décrit.
        lesson: Les dix pièces n’ont pas quitté le stock physique ; c’est la possibilité de les engager ailleurs qui change.
        source_title: Inventory Visibility reservations
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-reservations
        source_refs:
        - U477
        - ELM411
        - CMP190
  TER017:
    context: Ressources et commandes ou autres besoins identifiés ; choix lexical Assignment confirmé U275, stabilisé U289.
    market_inspiration:
      choice: Une affectation de ressource indique quelle ressource est retenue pour quelle demande. Nous utilisons Assignment
        pour ce lien, qui peut porter sur une ressource future et ne constitue pas à lui seul une réservation.
      flow_scope: Lien identifié au degré de précision utile.
      flow_approach: Conserver la ressource, le bénéficiaire et la quantité liée.
      synthesis:
      - SAP Supply Assignment relie ressource et besoin ; Microsoft utilise pegging dans les chaînes de couverture. Les deux
        éclairent le lien, avec des mécanismes et effets différents. SAP associe notamment une protection contre d’autres
        usages à son affectation.
      - 'FLOW sépare ces effets : l’affectation désigne le lien, la réservation bloque les usages concurrents. Allocation
        seul reste ambigu, car son sens dépend de la source.'
      examples:
      - title: Illustration FLOW — 40 pièces sur un arrivage
        situation: Une commande est liée à 40 pièces d’un achat attendu.
        outcome: Le lien peut être maintenu quand l’arrivage devient stock reçu.
        lesson: SAP fournit ce mécanisme de continuité ; FLOW conserve séparément réservation et promesse.
        source_title: Explaining Supply Assignment
        source_url: https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-supply-assignment_af05618d-4954-4f22-9857-3dd12e3940c4
        source_refs:
        - U477
        - ELM452
        - CMP191
  TER018:
    context: 'Terme qualifié utilisable dans FLOW sous la formulation « allocation de stock par groupe » ; formulation anglaise
      : Group Inventory Allocation. Désigne une enveloppe destinée à un usage ou à une population, avec droits, horizon et
      règles de consommation explicites. Le comportement concerné reste [Group Supply Protection](model:BHV017), sous [Supply
      Protection Policy](model:D02.b).'
    market_inspiration:
      choice: 'Comprendre l’Allocation de groupe des sources : elle peut attribuer une enveloppe d’usage à une population.
        Dans le texte courant FLOW, allocation de stock par groupe est autorisé ; préciser les droits évite la confusion avec
        Supply Assignment.'
      flow_scope: Terme de rapprochement historique pour les droits par groupe.
      flow_approach: Qualifier le sens d’Allocation à chaque usage.
      synthesis:
      - 'Microsoft et SAP emploient Allocation avec des effets différents : enveloppe protégée chez Microsoft, limite de confirmation
        dans la page SAP. Le nom seul ne permet pas de déduire la protection obtenue.'
      - FLOW conserve ce terme comme rapprochement historique et explicite le droit effectivement accordé. Il ne devient ni
        le nom générique de Supply Assignment ni un synonyme automatique de réservation.
      examples:
      - title: Exemple SAP — un plafond ne garde pas les pièces
        situation: Dans l’exemple PAL, les groupes Nord et Sud ont des plafonds et d’autres clients peuvent aussi consommer
          le stock commun.
        outcome: Un groupe peut ne pas obtenir sa limite si le stock a été consommé auparavant.
        lesson: Décrire le droit réel évite de présenter un plafond comme une enveloppe garantie.
        source_title: Explaining aATP Product Allocation (PAL)
        source_url: https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-aatp-product-allocation-pal-_dd30c229-d63f-4aba-a950-a174280c4a58
        source_refs:
        - U477
        - ELM448
        - CMP190
  TER019:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Préserver un usage face à certaines demandes concurrentes : Protection de ressource désigne une restriction
        d’accès explicite. Elle n’implique ni sortie physique ni garantie absolue de réalisation.'
      flow_scope: Restrictions qui préservent une quantité pour un usage.
      flow_approach: Nommer bénéficiaires, concurrents et conditions de levée.
      synthesis:
      - Microsoft décrit une part préservée ; SAP montre les limites d’un simple plafond dans un stock commun. Les deux mécanismes
        encadrent la concurrence, mais ne donnent pas le même droit au bénéficiaire.
      - FLOW utilise Protection pour l’effet recherché et précise le mécanisme retenu. Un blocage qualité peut également rendre
        indisponible, mais il n’est pas pour autant une protection en faveur d’un autre usage.
      examples:
      - title: Illustration FLOW — une part pour un lancement
        situation: Deux cents pièces sont préservées pour les magasins du lancement jusqu’à une date convenue.
        outcome: Les autres usages ne peuvent pas consommer cette part tant que la règle s’applique.
        lesson: Les droits du groupe, leur horizon et la libération du reliquat doivent être connus.
        source_title: Inventory Visibility inventory allocation
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-allocation
        source_refs:
        - U477
        - ELM410
        - CMP190
  TER020:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Limiter ce qui peut être confirmé : Plafond de confirmation fixe un maximum pour des critères et une période.
        Il ne promet pas que cette quantité sera effectivement disponible.'
      flow_scope: Maximum confirmable par groupe, produit et période.
      flow_approach: Cumuler les confirmations et contrôler la limite.
      synthesis:
      - SAP met l’accent sur la limite d’accès au stock commun ; Microsoft associe limite et protection d’une part. Les deux
        suivent une consommation, mais leurs conséquences pour les autres demandes diffèrent.
      - FLOW retient Plafond de confirmation pour exprimer uniquement le maximum. La disponibilité et la protection éventuelle
        restent des conditions séparées.
      examples:
      - title: Illustration FLOW — autorisé jusqu’à cent, disponible à soixante
        situation: Un groupe peut confirmer au plus cent pièces sur la semaine, mais soixante seulement restent utilisables.
        outcome: Le plafond n’autorise pas à confirmer cent si les autres conditions limitent la réponse à soixante.
        lesson: Un droit maximal ne crée aucune ressource.
        source_title: Explaining aATP Product Allocation (PAL)
        source_url: https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-aatp-product-allocation-pal-_dd30c229-d63f-4aba-a950-a174280c4a58
        source_refs:
        - U477
        - ELM448
        - CMP190
  TER021:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Rassembler des ressources selon des règles compréhensibles : Pool de ressources décrit ce regroupement et,
        s’il existe, son droit d’usage. Il ne signifie pas à lui seul stock logique, stock virtuel ou stock exclusivement
        protégé.'
      flow_scope: Regroupement explicite de ressources et de droits associés.
      flow_approach: Préciser appartenance, accès et consommation.
      synthesis:
      - Microsoft donne au pool un rôle de base commune à partager ; Oracle montre plusieurs niveaux de ciblage des ressources.
        Regrouper et réserver sont deux opérations différentes.
      - 'FLOW nomme les règles du pool : ressources incluses, éventuels recouvrements, bénéficiaires et consommation. Le nom
        ne permet pas d’inférer une exclusivité ni une disponibilité supplémentaire.'
      examples:
      - title: Illustration FLOW — regrouper plusieurs dépôts
        situation: Les pièces admissibles de deux dépôts constituent un pool pour certaines demandes.
        outcome: Le regroupement fournit une vue commune ; les restrictions de chaque pièce et les délais restent applicables.
        lesson: Les biens déjà comptés dans les dépôts ne s’ajoutent pas une seconde fois dans le pool.
        source_title: Inventory Visibility inventory allocation
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-allocation
        source_refs:
        - U477
        - ELM410
        - CMP190
  TER023:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Dire ce qui est admissible et ce qui doit en découler rend les décisions explicables. Règle métier désigne la
        condition ou le principe appliqué, distinct du moyen qui l’exécute.
      flow_scope: Conditions de validité, d’admissibilité et d’effet des décisions ou faits.
      flow_approach: Expliciter la règle, son contexte et ses conséquences.
      synthesis:
      - SBVR insiste sur une règle assez précise pour juger un comportement acceptable ; il distingue la prescription de l’action
        qui la fait respecter. Microsoft DOM montre des règles appliquées au choix de satisfaction, comme conserver du stock
        pour les visiteurs d’un magasin.
      - Le standard explique le sens de la règle ; l’éditeur montre un usage concret, avec ses propres paramètres et possibilités
        de relâchement. FLOW garde la règle métier lisible sans reprendre automatiquement le fonctionnement du moteur.
      examples:
      - title: Microsoft — garder du stock pour les visiteurs
        situation: La règle Minimum inventory de DOM permet d’écarter une partie du stock magasin de la satisfaction des commandes.
        outcome: Lorsque la règle est maintenue, cette quantité est préservée pour d’autres usages, notamment les clients
          présents en magasin.
        lesson: Le caractère impératif ou relâchable de la règle doit être explicite ; elle ne crée pas à elle seule une nouvelle
          capacité.
        source_title: DOM rules
        source_url: https://learn.microsoft.com/en-us/dynamics365/commerce/dom-rules
        source_refs:
        - U477
        - ELM394
        - CMP192
  TER024:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Expliquer comment un résultat est obtenu rend visibles les étapes et les passages entre acteurs. Processus désigne
        ce déroulement, qui peut mobiliser plusieurs capacités.
      flow_scope: Activités, événements et décisions enchaînés dans un contexte.
      flow_approach: Décrire le parcours vers un résultat.
      synthesis:
      - BPMN représente l’enchaînement des activités et événements, avec leurs conditions de passage. Le guide TOGAF regarde
        le processus comme l’un des moyens qui permettent d’exercer une capacité. Le premier décrit le déroulement ; le second
        le situe par rapport à l’aptitude.
      - 'FLOW conserve les deux lectures : la carte dit ce que l’entreprise sait faire, le processus raconte comment elle
        le fait dans un cas. Un parcours peut traverser plusieurs purposes sans leur imposer un nouveau découpage.'
      examples:
      - title: TOGAF — recruter une personne
        situation: L’exemple Recruitment Management cite notamment l’évaluation du besoin, la recherche de candidats et leur
          sélection.
        outcome: Plusieurs processus concourent au recrutement.
        lesson: Une étape ou un parcours de recrutement ne se confond pas avec l’aptitude durable à recruter.
        source_title: Business Capabilities
        source_url: https://governance.foundation/assets/frameworks/togaf/g189%20-%20Business%20Capbility.pdf
        source_refs:
        - U477
        - ELM374
        - CMP192
  TER025:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Préciser l’action accomplie et ce qu’elle change rend son résultat vérifiable. Opération métier désigne une
        action sur des objets, avec des conditions et des effets définis.
      flow_scope: Action telle qu’enregistrer une réception ou confirmer une promesse.
      flow_approach: Décrire ce qui doit être vrai avant et après l’action.
      synthesis:
      - BPMN appelle Task un travail élémentaire à la maille du processus décrit. Microsoft montre une opération concrète
        d’enregistrement de réception, qui produit un journal identifiable. Le standard fixe une place dans le déroulement
        ; l’éditeur expose l’action et sa trace.
      - FLOW se concentre sur le sens de l’action et ses effets métier. Une opération peut contribuer à une capacité sans
        en constituer une à elle seule ; un bouton ou une opération informatique ne fixe pas cette maille.
      examples:
      - title: Microsoft — enregistrer quatre pièces reçues
        situation: Le parcours Microsoft part d’une commande de cinq pièces et enregistre la réception de quatre.
        outcome: Le journal conserve la réception effectivement enregistrée, avec sa référence.
        lesson: L’opération change les faits tenus sur la commande ; elle reste distincte de la réception physique des pièces.
        source_title: Record the receipt of goods on the purchase order
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/tasks/record-receipt-goods-purchase-order
        source_refs:
        - U477
        - ELM431
        - CMP192
  TER026:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Montrer avec quels moyens une capacité est exercée permet de comprendre ce qui peut changer sans changer le
        besoin. Réalisation d’une capacité désigne ces moyens concrets.
      flow_scope: Acteurs, pratiques, outils et échanges mobilisés.
      flow_approach: Distinguer l’aptitude de sa mise en œuvre dans un contexte.
      synthesis:
      - 'TOGAF décrit les rôles, processus, informations et ressources qui rendent une capacité possible. GEA-NZ donne une
        illustration simple : payer les salariés peut se faire avec des moyens très différents. Les deux relient le besoin
        à une combinaison de moyens.'
      - FLOW utilise Réalisation pour cette combinaison, sans réduire le mot au logiciel. La présente comparaison n’établit
        ni une solution choisie ni une réalisation installée chez Beaumanoir ; Atlas conserve sa présentation métier.
      examples:
      - title: GEA-NZ — changer le moyen de paiement des salaires
        situation: L’employeur de l’exemple peut payer son personnel directement ou utiliser un logiciel de paie.
        outcome: Le moyen concret évolue sans supprimer le besoin de payer.
        lesson: C’est le sens de réalisation retenu par FLOW ; chaque situation réelle demanderait ses propres preuves.
        source_title: Business capabilities
        source_url: https://dns.govt.nz/standards-and-guidance/technology-and-architecture/government-enterprise-architecture/gea-nz-framework/business-capabilities
        source_refs:
        - U477
        - ELM333
        - CMP192
  TER027:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Préciser ce que l’on entend par « fonction » évite de mélanger un rôle dans l’entreprise et une possibilité
        offerte par un outil. FLOW ne donne pas à ce mot un niveau unique dans la carte.
      flow_scope: Mot à qualifier selon le contexte de son emploi.
      flow_approach: Demander le sens et le périmètre avant de rapprocher les notions.
      synthesis:
      - Le guide TOGAF emploie des noms de fonctions pour parler d’unités ou de périmètres d’organisation, en les distinguant
        des capacités. SAP présente des fonctions aATP comme des possibilités de son produit. Le même mot renvoie ainsi à
        des angles différents.
      - 'FLOW garde cette ambiguïté visible : fonction métier, fonction d’organisation et fonctionnalité de produit doivent
        être précisées. Aucun de ces usages ne crée automatiquement un étage entre purpose et capacité.'
      examples:
      - title: TOGAF — une capacité dans plusieurs fonctions
        situation: Le guide rapproche Project Management et Learning Management de plusieurs unités, dont les ressources humaines
          et l’informatique.
        outcome: Une même capacité peut être exercée dans plusieurs parties de l’organisation.
        lesson: Le nom d’une fonction ou d’un service ne suffit donc pas à définir une capacité distincte.
        source_title: Business Capabilities
        source_url: https://governance.foundation/assets/frameworks/togaf/g189%20-%20Business%20Capbility.pdf
        source_refs:
        - U477
        - ELM374
        - CMP192
  TER028:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Décrire ce qu’un produit permet effectivement de faire aide à comparer son apport au besoin métier. Fonctionnalité
        de produit désigne un comportement offert dans une édition et une configuration données.
      flow_scope: Possibilités documentées d’un produit.
      flow_approach: Vérifier l’édition, les conditions et les effets avant de conclure sur la couverture.
      synthesis:
      - SAP rassemble dans aATP des possibilités de confirmation, d’alternative et de réexamen du carnet. Microsoft détaille
        les règles DOM et précise les versions qui modifient le découpage des commandes. Les deux montrent qu’une fonctionnalité
        possède des conditions concrètes d’usage.
      - Le nom commercial ne suffit donc pas à mesurer la couverture d’une capacité FLOW. Une fonction peut n’en couvrir qu’une
        partie ou contribuer à plusieurs responsabilités ; la documentation ne prouve pas son installation.
      examples:
      - title: Microsoft — le nombre de lieux de satisfaction
        situation: Microsoft explique que le réglage de satisfaction depuis un seul lieu a évolué vers un nombre maximal de
          lieux.
        outcome: Les possibilités de découpage varient selon la version, la règle et les options activées.
        lesson: Comparer une fonctionnalité exige ce contexte ; on ne peut conclure à partir de « DOM » seul.
        source_title: DOM rules
        source_url: https://learn.microsoft.com/en-us/dynamics365/commerce/dom-rules
        source_refs:
        - U477
        - ELM394
        - CMP192
  TER029:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Rapprocher les capacités selon un critère métier rend la carte plus facile à lire. Regroupement de capacités
        désigne cette organisation de lecture, sans présumer une capacité parente.
      flow_scope: Ensemble de capacités réunies pour une raison explicite.
      flow_approach: Indiquer le critère commun et distinguer regroupement et décomposition.
      synthesis:
      - TOGAF distingue la classification des capacités pour lire une carte et leur décomposition pour détailler une aptitude.
        GEA-NZ recommande également de les classer afin de repérer lacunes et recouvrements. Les deux donnent un but à l’organisation
        de la carte.
      - 'FLOW conserve cette distinction : partager un thème ne signifie pas être les parties d’une même capacité. Une purpose
        peut apporter ce cadre de lecture quand ses problèmes métier sont cohérents ; le regroupement ne crée pas un niveau
        « fonction ».'
      examples:
      - title: TOGAF — catégories et décomposition
        situation: Le guide présente des catégories Strategic, Core et Supporting puis, séparément, la décomposition de Human
          Resource Management.
        outcome: Le premier classement facilite une lecture ; le second détaille une aptitude.
        lesson: FLOW reprend la différence entre les deux opérations, sans adopter ces catégories comme niveaux du modèle.
        source_title: Business Capabilities
        source_url: https://governance.foundation/assets/frameworks/togaf/g189%20-%20Business%20Capbility.pdf
        source_refs:
        - U477
        - ELM374
        - CMP192
  TER032:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Nommer l’achat dans lequel le donneur d’ordre procure des composants et confie leur transformation. Fabrication
        à façon conserve ce sens de travail local, avec les responsabilités à préciser.
      flow_scope: Composants acquis puis confiés à un façonnier pour transformation.
      flow_approach: Préciser les biens fournis, leur propriété et le résultat acheté sans assimiler tous les montages de
        sous-traitance.
      synthesis:
      - SAP Subcontracting insiste sur les composants fournis ; Oracle Contract Manufacturing organise les documents d’une
        fabrication externe. Le recouvrement est réel mais leurs montages ne sont pas synonymes exacts.
      - FLOW conserve le sens rapporté par Laurent. Les sources aident à poser les questions de propriété et de consommation
        ; elles ne répondent pas à la place de l’étude du cas local.
      examples:
      - title: Illustration FLOW — Transformer des composants confiés
        situation: Un donneur d’ordre achète du tissu et le confie pour confectionner des pièces.
        outcome: Le résultat transformé est attendu, avec les composants fournis identifiés.
        lesson: L’illustration rend le mécanisme concret ; elle ne décrit pas un flux installé chez Beaumanoir.
        source_title: Outlining Subcontracting
        source_url: https://learning.sap.com/courses/detailing-subcontracting-and-supplier-consignment/outlining-subcontracting_af403e3e-188d-4dbb-bde1-632253739fa6
        source_refs:
        - U477
        - ELM447
        - CMP189
  TER034: {}
  TER036: {}
  TER038:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Décrire la situation d’un objet à un instant donné. État d’objet métier couvre les valeurs utiles et ne se limite
        pas à une étiquette de statut.
      flow_scope: Situation courante ou représentée à une date donnée.
      flow_approach: Distinguer dimensions de l’état, document qui les montre et événement qui les change.
      synthesis:
      - Microsoft sépare plusieurs dimensions d’un achat ; Oracle distingue les niveaux de progression de la vente. Les deux
        montrent qu’un seul statut peut masquer une situation plus riche.
      - FLOW conserve État pour la situation et les valeurs pertinentes. Un document daté en donne une représentation ; l’événement
        explique comment elle a changé.
      examples:
      - title: Illustration FLOW — Approuvée et partiellement reçue
        situation: Une commande d’achat est approuvée, avec 60 pièces reçues sur 100.
        outcome: Son état combine approbation interne, quantité reçue et quantité restante.
        lesson: « Approuvée » ne permet pas à lui seul de connaître les 40 encore attendues.
        source_title: Purchase order overview
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-order-overview
        source_refs:
        - U477
        - ELM430
        - CMP189
  TER039:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Prévenir un destinataire de ce qui vient de se produire lui permet de réagir avec les bonnes références. Notification
        d’événement désigne ce message, distinct du fait lui-même.
      flow_scope: Message qui signale un fait à un destinataire.
      flow_approach: Transmettre le contexte utile sans confondre informer et demander une action.
      synthesis:
      - Fowler distingue la notification d’événement d’une demande d’action déguisée ; le message peut ne contenir que les
        références utiles pour consulter les détails. CloudEvents distingue le fait capté par un système de sa représentation
        transmise et admet plusieurs événements pour ce même fait.
      - Le premier explique l’intention du message ; le second facilite son échange entre systèmes. FLOW retient l’intention
        métier et les références nécessaires, sans prescrire de format, de protocole ou de mode de conservation.
      examples:
      - title: Illustration FLOW — signaler une réception
        situation: Une réception a été enregistrée avec son document ; un message avertit le responsable d’une commande concernée.
        outcome: Le destinataire dispose des références pour consulter le fait et décider de la suite.
        lesson: 'Le message informe : son émission ne constitue ni une nouvelle réception ni, à elle seule, un ordre de poursuivre.'
        source_title: What do you mean by Event-Driven?
        source_url: https://martinfowler.com/articles/201701-event-driven.html
        source_refs:
        - U477
        - ELM459
        - CMP192
  TER040:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Nommer les biens qui existent réellement : Stock physique désigne leur présence dans le périmètre considéré.
        La quantité enregistrée doit pouvoir être rapprochée de cette réalité.'
      flow_scope: Existence matérielle des biens à une date.
      flow_approach: Distinguer présence réelle, mesure et enregistrement.
      synthesis:
      - Microsoft emploie Physical inventory pour une quantité dans la vue de stock ; Oracle l’emploie aussi pour le contrôle
        complet de cette quantité. Le contexte distingue objet observé et méthode de contrôle.
      - FLOW retient le sens matériel pour Stock physique. Une pièce réservée, bloquée ou appartenant au fournisseur reste
        physique tant qu’elle est présente.
      examples:
      - title: Illustration FLOW — quatre-vingt-dix-huit réellement comptées
        situation: Le système indique cent pièces ; un comptage fiable en trouve quatre-vingt-dix-huit au même périmètre et
          au même repère temporel.
        outcome: L’écart de deux doit être expliqué avant correction.
        lesson: Une valeur enregistrée n’est pas à elle seule la preuve du stock physique.
        source_title: Mobile Materials Management
        source_url: https://docs.oracle.com/cd/E26401_01/doc.122/e48826/T256582T257763.htm
        source_refs:
        - U477
        - ELM340
        - CMP190
  TER041:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Décrire les états métier des mêmes biens : Stock logique qualifie le stock physique selon ses usages et restrictions.
        Ces états ne sont pas un second stock à additionner au premier.'
      flow_scope: États métier du stock physique considéré.
      flow_approach: Préciser les combinaisons et exclusions entre états.
      synthesis:
      - Microsoft montre l’effet d’un statut sur l’usage ; SAP ajoute d’autres qualifications, dont la propriété. Les classifications
        diffèrent et certaines dimensions peuvent se croiser.
      - FLOW garde Stock logique comme expression de travail pour ces états. Toute addition suppose de savoir si les catégories
        s’excluent ou se recouvrent ; réservé et consigné peuvent, par exemple, décrire des dimensions différentes.
      examples:
      - title: Illustration FLOW — cent pièces décrites par leurs états
        situation: Dans un exemple construit avec des catégories exclusives, cent pièces se répartissent en soixante libres,
          vingt réservées, dix allouées, cinq bloquées et cinq défectueuses.
        outcome: La description totale reste cent pièces physiques.
        lesson: Cette partition illustre le principe ; elle ne tranche pas les règles de combinaison des états dans FLOW.
        source_title: Inventory statuses
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-statuses
        source_refs:
        - U76
        - U477
        - ELM409
        - CMP190
  TER042:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Exprimer une disponibilité calculée : Stock virtuel dépend des quantités, dates et règles retenues. Ce résultat
        ne crée pas de marchandises et doit rester distingué du Stock physique.'
      flow_scope: Quantité disponible selon un calcul explicite.
      flow_approach: Nommer horizon, engagements et apports inclus.
      synthesis:
      - Microsoft donne plusieurs lectures de la disponibilité ; Oracle construit un bilan chronologique. Tous deux montrent
        que le résultat dépend de ce qui entre dans le calcul.
      - FLOW conserve Stock virtuel pour cette quantité calculée, sans lui attribuer une formule unique. Un engagement déjà
        soustrait d’une quantité de départ ne doit pas être déduit une deuxième fois.
      examples:
      - title: Illustration FLOW — soixante-quinze disponibles à demain
        situation: Le calcul retient soixante pièces libres, trente reçues demain et quinze promises qui ne sont pas encore
          déduites des soixante.
        outcome: Selon ces hypothèses, le disponible calculé à demain est soixante-quinze.
        lesson: Le chiffre change si l’apport devient incertain ou si les quinze étaient déjà déduites ; ce n’est pas le stock
          physique présent.
        source_title: How You Review Item Supply and Demand
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25d/famml/how-you-review-item-supply-and-demand.html
        source_refs:
        - U76
        - U477
        - ELM356
        - CMP190
  TER043:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Parler d’une disponibilité envisagée plus tard : Stock futur reste une expression de travail qui demande une
        date, un lieu et un degré de fermeté. Le potentiel non daté et la Ressource attendue qualifiée ne sont pas équivalents.'
      flow_scope: Ressources envisagées ou attendues pour un usage futur.
      flow_approach: Distinguer potentiel, prévu, engagé et déjà en transit.
      synthesis:
      - Oracle montre des ressources entrantes déjà décrites ; Microsoft inclut des apports issus de la planification. Les
        degrés de fermeté diffèrent, même lorsque les deux concernent une disponibilité future.
      - FLOW garde cette expression exploratoire et exige la qualification du cas. Une pièce en transit existe physiquement
        quelque part mais reste future pour son site destinataire ; un potentiel fournisseur non daté est encore autre chose.
      examples:
      - title: Illustration FLOW — présente sur la route, future au magasin
        situation: Vingt pièces ont quitté le dépôt et sont attendues demain au magasin.
        outcome: Elles sont physiques dans le réseau et futures pour l’usage au magasin.
        lesson: Le périmètre et la date empêchent de confondre absence locale et inexistence de la marchandise.
        source_title: How You Review Item Supply and Demand
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25d/famml/how-you-review-item-supply-and-demand.html
        source_refs:
        - U477
        - ELM356
        - CMP190
  VER001:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Établir clairement une signification, une règle ou une caractéristique. Définir désigne ici ce travail de cadrage,
        distinct de l’application de ce qui a été défini.
      flow_scope: Sens, caractéristiques ou règles rendus explicites.
      flow_approach: Nommer l’objet défini et les effets que son application devra produire.
      synthesis:
      - 'Les deux documents Microsoft montrent comment établir une règle avant son usage : horizon du plan ou minimum de stock.
        Ils n’imposent pas un verbe canonique français.'
      - FLOW retient Définir comme convention de rédaction. Le résultat doit dire ce qui devient explicite et rester distinct
        de son application, sans imposer deux capacités séparées.
      examples:
      - title: Illustration FLOW — Fixer un minimum
        situation: Une règle retient un minimum de 20 pièces pour un article à un site.
        outcome: Le seuil est défini ; l’analyse peut ensuite constater si le stock y répond.
        lesson: La définition de la règle ne crée aucune pièce disponible.
        source_title: Safety stock fulfillment for items
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/safety-stock-replenishment
        source_refs:
        - U477
        - ELM422
        - CMP189
  VER002: {}
  VER003:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Établir une réponse à partir des faits et règles utiles : Déterminer exprime le résultat attendu. Dans la convention
        FLOW, un calcul peut y contribuer sans être la seule façon de parvenir au résultat.'
      flow_scope: Établissement d’un résultat métier.
      flow_approach: Choisir les moyens nécessaires au résultat demandé.
      synthesis:
      - Microsoft éclaire un résultat quantitatif ; Blue Yonder un choix de devenir parmi plusieurs possibilités. Les moyens
        diffèrent, mais les deux conduisent à établir une réponse utile au métier.
      - FLOW emploie Déterminer pour cette finalité. Le nom ne crée pas une séquence humaine obligatoire et ne signifie pas
        que le résultat est déjà appliqué.
      examples:
      - title: Illustration FLOW — déterminer une filière de retour
        situation: L’état du produit et les règles permettent la réparation ou le renvoi au fournisseur.
        outcome: La décision établit l’orientation retenue et ses conditions.
        lesson: Des calculs de coût peuvent éclairer ce résultat ; le service rendu reste de déterminer le devenir.
        source_title: Smart Disposition
        source_url: https://blueyonder.com/solutions/returns-management/smart-disposition
        source_refs:
        - U477
        - ELM328
        - CMP190
  VER004:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Produire une valeur par des opérations quantitatives : Calculer annonce un résultat chiffré. FLOW conserve
        ce verbe lorsqu’il rend le service plus précis, sans imposer un algorithme.'
      flow_scope: Établissement d’une valeur quantitative.
      flow_approach: Rendre explicites données, règles et unité du résultat.
      synthesis:
      - Microsoft illustre une quantité à commander ; Oracle des paramètres de réapprovisionnement. Les calculs portent sur
        des objets différents et utilisent des hypothèses différentes.
      - FLOW retient le sens quantitatif. Calculer peut faire partie de Déterminer ; cela n’exige ni une capacité autonome
        par formule ni une validation humaine systématique.
      examples:
      - title: Illustration FLOW — douze nécessaires, des lots à respecter
        situation: Le retour vers la cible demande douze pièces mais l’approvisionnement se fait par lots de cinq.
        outcome: Le calcul doit appliquer une règle explicite pour obtenir une quantité réalisable.
        lesson: 'Arrondir vers dix ou quinze ne va pas de soi : la politique choisie donne son sens au nombre.'
        source_title: Replenishment methods and quantity modification
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/replenishment-methods-quantity-modification
        source_refs:
        - U477
        - ELM420
        - CMP190
  VER005:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Vérifier consiste à établir si des conditions sont respectées et à en donner le constat. Ce verbe ne signifie
        pas, à lui seul, autoriser ou exécuter l’action envisagée.
      flow_scope: Conditions, éléments examinés et constat produit.
      flow_approach: Rendre lisible la conclusion et ses limites.
      synthesis:
      - Oracle Check Availability recherche une réponse possible avant application. SAP Release Check contrôle si les quantités
        affectées remplissent les conditions de départ. Les deux font un contrôle, mais pas sur la même question.
      - 'FLOW garde un verbe général à qualifier par son objet : vérifier une disponibilité ou vérifier un seuil de livraison.
        L’effet d’autorisation éventuel doit être nommé séparément.'
      examples:
      - title: SAP — vérifier avant de rendre livrable
        situation: Une affectation existe, mais un contrôle de libération reste requis.
        outcome: SAP compare les quantités aux règles et distingue notamment les situations nécessitant une libération manuelle.
        lesson: Le constat favorable et l’autorisation peuvent être séparés ; le mot vérifier ne les confond pas.
        source_title: Explaining Supply Assignment
        source_url: https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-supply-assignment_af05618d-4954-4f22-9857-3dd12e3940c4
        source_refs:
        - U477
        - ELM452
        - CMP191
  VER006:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Autoriser rend une action admissible pour un périmètre et sous des conditions donnés. Cela ne signifie pas que
        l’action est déjà exécutée ou que sa ressource est réservée.
      flow_scope: Droit de poursuivre une action identifiée.
      flow_approach: Préciser les conditions et la portée de l’autorisation.
      synthesis:
      - Microsoft distingue un ordre planifié approuvé de son affermissement. SAP distingue aussi une affectation qui attend
        une libération manuelle d’un état permettant de créer la livraison. Les deux montrent une possibilité de passage soumise
        à une décision.
      - 'FLOW utilise autoriser comme convention de sens, sans assimiler les statuts éditeurs entre eux. L’action autorisée
        doit être nommée : affermir, libérer ou prendre en charge ne sont pas interchangeables.'
      examples:
      - title: Microsoft — approuvé pour affermissement
        situation: Un ordre planifié reçoit le statut Approved.
        outcome: Il est conservé pour un éventuel affermissement ; l’approbation n’est pas l’affermissement lui-même.
        lesson: Cet usage illustre la séparation entre rendre une action admissible et l’exécuter.
        source_title: View, manage, and approve planned orders
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/approved-planned-order
        source_refs:
        - U477
        - ELM416
        - CMP191
  VER007:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Faire entrer durablement un fait ou une décision dans ce qui est connu. Enregistrer précise le résultat métier
        devenu consultable, au-delà de la seule action de saisie.
      flow_scope: Fait ou décision pris en compte avec son contexte et ses effets.
      flow_approach: Dire ce qui devient connu, puis distinguer les décisions ou réalisations qui peuvent suivre.
      synthesis:
      - Microsoft distingue plusieurs moments de constat d’une réception ; SAP sépare l’enregistrement du service et son approbation.
        Dans les deux cas, rendre un fait connu ne remplace pas toutes les étapes qui l’entourent.
      - FLOW emploie Enregistrer pour décrire cette prise en compte durable. Le texte doit préciser si l’on connaît une annonce,
        une réalisation ou une décision.
      examples:
      - title: Illustration FLOW — Connu avant acceptation
        situation: Le prestataire déclare la réparation terminée et le constat est enregistré.
        outcome: La réalisation déclarée est consultable ; l’acceptation peut encore être en attente.
        lesson: L’enregistrement ne doit pas masquer ce qui reste à décider.
        source_title: Processing a Service Entry Sheet
        source_url: https://learning.sap.com/courses/business-processes-in-sap-s-4hana-sourcing-and-procurement/processing-a-service-entry-sheet_e42ab0b6-291a-4dad-9f5c-7f508d21ae5c
        source_refs:
        - U477
        - ELM446
        - CMP189
  VER008:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Exprimer à un destinataire le résultat souhaité et ses conditions. Demander ne suffit pas à établir que le destinataire
        a accepté ou réalisé ce résultat.
      flow_scope: Expression d’un besoin adressé.
      flow_approach: Distinguer demande, réponse et réalisation.
      synthesis:
      - TM Forum sépare dates demandées, prévues et réalisées d’un Service Order. Microsoft décrit les demandes envoyées à
        l’entrepôt et les retours d’exécution. Les deux rendent visible la distance entre une sollicitation et son résultat.
      - FLOW utilise ces usages pour éclairer un verbe courant, sans lui attribuer une définition normative de consortium.
        Les conditions et réponses attendues dépendent de la prestation.
      examples:
      - title: Illustration FLOW — demander une préparation
        situation: Une préparation de 100 pièces est demandée avant 16 h.
        outcome: Le besoin est exprimé ; sa prise en charge et sa progression doivent encore être connues.
        lesson: Le simple envoi ne prouve pas le résultat métier.
        source_title: Exchange data between systems
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/wms-only-mode-exchange-data
        source_refs:
        - U477
        - ELM445
        - CMP193
  VER009:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Préserver une quantité pour un usage face à des concurrents identifiés : Protéger décrit cet effet. Il faut
        préciser le mécanisme et les règles de levée, car toutes les limites d’accès ne protègent pas de la même manière.'
      flow_scope: Préservation d’un usage par restriction d’accès.
      flow_approach: Expliciter bénéficiaire, concurrence et horizon.
      synthesis:
      - Microsoft éclaire la part préservée ; SAP oblige à distinguer cette protection d’un simple maximum de confirmation.
        Employer le même verbe sans préciser l’effet masquerait cette différence.
      - FLOW utilise Protéger comme convention locale d’effet métier. Le bien reste présent ; ce sont certaines possibilités
        d’usage concurrent qui changent.
      examples:
      - title: Illustration FLOW — préserver le lancement
        situation: Une part est protégée pour un lancement et ne peut pas servir aux autres demandes avant une échéance.
        outcome: Les concurrents sont limités selon la règle en vigueur.
        lesson: Protéger exige un bénéficiaire et des conditions ; ce n’est pas déclarer une quantité inviolable pour toujours.
        source_title: Inventory Visibility inventory allocation
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-allocation
        source_refs:
        - U477
        - ELM410
        - CMP190
  VER010:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Attribuer une enveloppe à une population ou un usage : Allouer à un groupe précise le sens collectif de l’action.
        FLOW qualifie toujours ce verbe pour éviter la confusion avec l’affectation de ressources à une demande.'
      flow_scope: Attribution de droits quantitatifs à un groupe.
      flow_approach: Décrire enveloppe, horizon et consommation autorisée.
      synthesis:
      - Microsoft et SAP illustrent deux sens d’Allocation par groupe, dont les protections diffèrent. Le complément du verbe
        ne dispense donc pas d’expliquer le droit obtenu.
      - Dans la convention FLOW, Allouer à un groupe signifie attribuer l’enveloppe définie. Le texte courant peut préférer
        « attribuer une enveloppe de protection » ; aucun synonyme général avec Supply Assignment n’est établi.
      examples:
      - title: Illustration FLOW — attribuer cent pièces au canal
        situation: Un canal reçoit un droit d’usage de cent pièces sur une période définie.
        outcome: Sa consommation est suivie à l’intérieur de cette enveloppe.
        lesson: Il reste à préciser si les pièces sont protégées et dans quelles conditions le reliquat peut revenir à d’autres
          usages.
        source_title: Inventory Visibility inventory allocation
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-allocation
        source_refs:
        - U477
        - ELM410
        - CMP190
  VER011:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Engager une quantité pour une demande identifiée : Réserver change les possibilités des demandes concurrentes.
        La portée et la durée de cet engagement doivent être connues.'
      flow_scope: Engagement quantitatif en faveur d’une demande.
      flow_approach: Préciser ressource, effets concurrents et fin de l’engagement.
      synthesis:
      - Oracle met l’accent sur le lien à la ressource ; commercetools sur le moment et la durée dans le parcours commercial.
        Les deux montrent un engagement qui doit avoir des conditions.
      - FLOW emploie Réserver pour cet effet quantitatif. Une proposition d’affectation ou une vérification de disponibilité
        ne suffit pas à dire que la réservation existe.
      examples:
      - title: Illustration FLOW — deux pièces pendant le panier
        situation: Deux pièces sont réservées pour un panier selon une règle de maintien de quinze minutes.
        outcome: Elles ne peuvent pas être engagées ailleurs pendant ce maintien ; la règle traite ensuite expiration ou conversion.
        lesson: 'La durée est illustrative : le verbe Réserver n’impose ni panier ni quinze minutes.'
        source_title: Inventory overview
        source_url: https://docs.commercetools.com/api/inventory-overview
        source_refs:
        - U477
        - ELM334
        - CMP190
  VER012:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Affecter établit un lien entre une ressource et une demande ou un bénéficiaire précis. Dans le cas Supply, le
        verbe décrit ce lien et ne suffit pas à promettre la fourniture ou à bloquer la ressource.
      flow_scope: Action créant une affectation identifiée.
      flow_approach: Nommer ressource, bénéficiaire et quantité concernée.
      synthesis:
      - SAP nomme Assign l’association de ressources physiques ou futures à des besoins. Microsoft emploie pegging pour la
        couverture liée à des demandes. Les mots diffèrent, mais rendent visible une association déterminée.
      - FLOW garde affecter pour l’acte de création du lien. L’affectation d’une tâche est un autre objet ; elle doit être
        qualifiée pour ne pas être confondue avec celle d’un stock.
      examples:
      - title: SAP — choisir une ressource future
        situation: Dans ITA, SAP permet de choisir le type de ressource, présente ou future, à associer au besoin.
        outcome: Le traitement crée une affectation sur le périmètre sélectionné.
        lesson: FLOW retient l’effet de lien ; réservation et confirmation conservent leur propre acte.
        source_title: Explaining Supply Assignment
        source_url: https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-supply-assignment_af05618d-4954-4f22-9857-3dd12e3940c4
        source_refs:
        - U477
        - ELM452
        - CMP191
  VER013:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Promettre prend un engagement sur ce qui sera fourni à une demande. Il faut préciser le résultat, notamment
        quantité et date, ainsi que les conditions qui permettent de compter dessus.
      flow_scope: Acte d’engager une réponse de satisfaction.
      flow_approach: Passer d’une proposition à une réponse tenue.
      synthesis:
      - Oracle distingue le résultat exploré de son application. PeopleSoft emploie promise pour les quantités attribuées
        à des demandes dans ses traitements de stock. Ces usages rapprochent calcul et engagement à des degrés différents.
      - FLOW emploie le verbe pour l’effet d’engagement, et non pour tout calcul préparatoire. Promettre ne signifie ni affecter
        une ressource précise ni constater une livraison.
      examples:
      - title: Illustration FLOW — engager vendredi
        situation: Après examen des possibilités, 60 pièces vendredi sont proposées puis confirmées.
        outcome: Le demandeur dispose désormais d’un engagement sur ces 60 pièces, selon les conditions convenues.
        lesson: La séparation Oracle entre exploration et application éclaire le passage, sans définir la procédure d’accord
          FLOW.
        source_title: Check Availability
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/fascp/check-availability.html
        source_refs:
        - U477
        - ELM350
        - CMP191
  VER014:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Préciser quel fait, résultat ou engagement est établi. Confirmer doit toujours indiquer sa portée : accuser
        réception et accepter une date n’ont pas le même effet.'
      flow_scope: Résultat ou engagement attesté, avec effet explicite.
      flow_approach: Nommer ce qui est confirmé, par qui et ce que la confirmation change.
      synthesis:
      - Microsoft distingue la réponse du fournisseur, son traitement et l’action de confirmation. Les deux pages ne décrivent
        donc pas un effet unique du mot Confirm.
      - FLOW utilise cette ambiguïté pour exiger un complément précis. La convention ne transforme ni un accusé de réception
        ni une saisie en promesse de satisfaction.
      examples:
      - title: Illustration FLOW — Message reçu, date non acceptée
        situation: Un fournisseur accuse réception de la commande mais n’a pas accepté la date demandée.
        outcome: L’échange est connu ; la date reste à confirmer au sens d’engagement.
        lesson: Le verbe doit préciser l’effet, pas seulement l’existence d’une réponse.
        source_title: Vendor collaboration with external vendors
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/vendor-collaboration-work-external-vendors
        source_refs:
        - U477
        - ELM432
        - CMP189
  VER015:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Prioriser établit un ordre relatif entre des demandes concurrentes. Le résultat doit indiquer lesquelles passent
        avant les autres et pour quelles raisons, sans prétendre les avoir déjà satisfaites.
      flow_scope: Classement de traitement ou de satisfaction.
      flow_approach: Appliquer des critères explicites et rendre les conflits visibles.
      synthesis:
      - SAP BOP peut réordonner des besoins ; PeopleSoft utilise des rangs de priorité avant la distribution. Le premier décrit
        un traitement de réexamen, le second explicite la séquence d’examen.
      - FLOW retient le sens commun de classement, sans imposer leurs critères. Un rang prioritaire n’affecte pas une ressource
        à lui seul et n’autorise pas la levée d’une protection.
      examples:
      - title: PeopleSoft — plusieurs règles, un rang
        situation: L’exemple PeopleSoft fait correspondre une ligne aux rangs 10, 30 et 50.
        outcome: Le produit retient le rang 10 selon sa convention.
        lesson: FLOW exige un ordre explicite, mais n’adopte ni cette numérotation ni ce mode de résolution.
        source_title: Promising and Reserving Inventory
        source_url: https://docs.oracle.com/cd/E13228_01/fscm9pbr0/eng/psbooks/sinv/htm/sinv18.htm
        source_refs:
        - U477
        - ELM337
        - CMP191
  VER016:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Arbitrer choisit entre des possibilités ou demandes qui ne peuvent pas toutes être retenues ensemble. Le choix
        doit rendre explicites ses règles, contraintes et conséquences.
      flow_scope: Possibilités concurrentes et résultat décidé.
      flow_approach: Expliquer ce qui est retenu, écarté ou laissé sans solution.
      synthesis:
      - Oracle Profitable to Promise départage des sources selon délai et coût. Microsoft DOM associe plusieurs objectifs
        et contraintes de satisfaction. Les deux illustrent des choix sous contraintes, avec des règles particulières à leurs
        fonctions.
      - 'FLOW garde arbitrer comme verbe à qualifier : arbitrer une priorité, un coût ou un plan ne donne pas la même responsabilité.
        Il ne nomme ni un comité ni un outil et n’impose aucune pondération.'
      examples:
      - title: Illustration FLOW — une économie ne lève pas une obligation
        situation: Une solution coûte moins cher mais manque un délai impératif ; une autre respecte l’engagement.
        outcome: Le choix explique pourquoi l’économie seule ne suffit pas à retenir la première.
        lesson: Le rapprochement coût/service d’Oracle illustre le conflit ; les contraintes réelles sont celles du cas métier.
        source_title: Create Alternative Fulfillment Scenarios to Reduce Cost
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26c/fascp/create-alternative-fulfillment-scenarios-to-reduce-cost.html
        source_refs:
        - U477
        - ELM372
        - CMP191
  VER017:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Réexaminer une règle, une décision ou un engagement et le modifier si nécessaire. Réviser rend explicites le
        résultat de ce réexamen et la prise d’effet d’un éventuel changement.
      flow_scope: Règle, décision ou engagement existant réexaminé.
      flow_approach: Identifier le changement retenu et ses conséquences sans confondre projet de modification et version
        applicable.
      synthesis:
      - La revue Microsoft aide à comprendre le changement ; le parcours d’approbation gouverne sa prise d’effet. Examiner
        et appliquer la révision sont donc distinguables.
      - FLOW retient ce sens de réexamen métier, qui peut confirmer l’existant ou conduire à un changement. Une simple republication
        technique ne suffit pas à le démontrer.
      examples:
      - title: Illustration FLOW — Revoir une date annoncée
        situation: Un délai fournisseur augmente ; la date confirmée est réexaminée avec les demandes concernées.
        outcome: Une nouvelle date peut être retenue après décision, ou la proposition refusée.
        lesson: La révision se comprend par son effet sur l’engagement existant.
        source_title: Review and accept changes to confirmed purchase orders
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-order-changes-after-confirmation
        source_refs:
        - U477
        - ELM428
        - CMP189
  VER018:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Réaffecter modifie un lien de ressource déjà établi. Ce verbe décrit le changement de ressource ou de bénéficiaire,
        sans supposer qu’une promesse change en même temps.
      flow_scope: Affectations existantes dans un périmètre révisable.
      flow_approach: Appliquer les nouveaux liens autorisés.
      synthesis:
      - SAP Reassignment remet en jeu les liens d’une ligne. Microsoft montre qu’une ressource reçue peut aussi être rattachée
        à une demande plus précoce selon les règles de préservation. Ces usages rendent visible le changement de couverture.
      - FLOW exige de qualifier ce qui devient différent et ce qui reste protégé. Réaffecter ne donne pas un droit général
        de casser réservations, gels ou engagements.
      examples:
      - title: Illustration FLOW — autre arrivage, même promesse
        situation: Les 40 pièces d’une commande étaient liées à l’arrivage A ; B offre les mêmes quantités et dates admissibles.
        outcome: Le lien peut passer de A à B sans modifier la promesse.
        lesson: SAP étaye la révision de liens ; FLOW précise que son effet sur l’engagement doit être examiné séparément.
        source_title: Backorder Processing — Reassignment
        source_url: https://help.sap.com/docs/PRODUCT_ID/f132c385e0234fe68ae9ff35b2da178c/6b8eb017a1d1431abde00056a249f72b.html
        source_refs:
        - U477
        - ELM378
        - CMP191
  VER019: {}
  VER020:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: 'Imputer une utilisation à la quantité ou au droit concerné : Consommer décrit ce qui est utilisé dans son contexte.
        Consommer une enveloppe, solder une réservation et sortir physiquement une pièce ne sont pas des synonymes.'
      flow_scope: Utilisation d’une quantité, d’un droit ou d’un engagement.
      flow_approach: Nommer l’objet consommé et ses effets.
      synthesis:
      - Microsoft utilise la consommation pour une enveloppe de droits et pour l’utilisation de matière consignée. Ces deux
        documents d’un même éditeur montrent précisément pourquoi le complément change le sens.
      - FLOW garde le verbe comme convention locale, en indiquant ce qui diminue ou est soldé. Les effets sur propriété, disponible
        et stock physique sont ensuite qualifiés séparément.
      examples:
      - title: Illustration FLOW — trente prises sur une enveloppe de cent
        situation: Un groupe utilise trente unités du droit qui lui avait été attribué.
        outcome: Son enveloppe restante vaut soixante-dix selon la règle de consommation.
        lesson: Cela ne prouve pas que trente pièces ont déjà quitté un entrepôt.
        source_title: Inventory Visibility inventory allocation
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-allocation
        source_refs:
        - U477
        - ELM410
        - CMP190
  VER021:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Retirer un effet encore applicable selon les règles de l’objet concerné. Annuler conserve l’histoire et ne signifie
        pas défaire physiquement ce qui a déjà eu lieu.
      flow_scope: Partie de demande, décision ou effet identifié pouvant être retirée.
      flow_approach: Préciser l’effet annulé et les autres traitements encore nécessaires.
      synthesis:
      - Oracle retire la partie encore annulable de la demande ; Microsoft corrige l’effet d’une réception enregistrée. Le
        même verbe vise donc des objets et conséquences différents.
      - FLOW exige de nommer cet effet. L’annulation n’efface pas l’historique et ne propage pas automatiquement son résultat
        à toutes les commandes liées.
      examples:
      - title: Illustration FLOW — Annuler le reste
        situation: Dix pièces étaient demandées ; sept ont été servies et les trois restantes ne sont plus voulues.
        outcome: L’annulation porte sur les trois encore attendues.
        lesson: Les sept réalisées restent connues ; leur éventuel retour relève d’un autre traitement.
        source_title: Cancel Sales Orders
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fauom/cancel-sales-orders.html
        source_refs:
        - U477
        - ELM366
        - CMP189
  VER022:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Comparer des faits pour comprendre leur concordance ou leur écart. Rapprocher précise ce qui est comparé avant
        de décider quoi faire de la différence.
      flow_scope: Attendus, constats ou représentations comparables.
      flow_approach: Relier les éléments puis qualifier leurs écarts.
      synthesis:
      - Microsoft permet de relier une demande d’entrepôt à son retour de réception. GS1 décrit les informations identifiables
        d’expédition et de réception. Ces usages donnent les repères nécessaires à une comparaison, sans définir tout traitement
        des écarts.
      - FLOW emploie le verbe au sens de comparaison métier. Selon l’objet, un écart peut alimenter une commande, un suivi
        de prestation ou une décision ; le verbe seul ne signifie pas corriger ou facturer.
      examples:
      - title: Illustration FLOW — expliquer une différence
        situation: Une réception constate 80 pièces pour 100 attendues.
        outcome: Le rapprochement fait apparaître un écart de 20.
        lesson: Il faut ensuite qualifier cet écart ; aucune correction de stock n’est déduite du verbe seul.
        source_title: Exchange data between systems
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/wms-only-mode-exchange-data
        source_refs:
        - U477
        - ELM445
        - CMP193
  VER023:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Accomplir l’action ou la prestation demandée. Exécuter désigne la réalisation métier, qu’elle soit physique,
        humaine ou numérique.
      flow_scope: Réalisation du travail attendu.
      flow_approach: Distinguer accomplissement, déclenchement et coordination.
      synthesis:
      - Microsoft Field Service décrit le technicien qui réalise le travail. Camunda coordonne des activités accomplies par
        des personnes ou des systèmes. L’un montre l’exécutant, l’autre le processus qui relie plusieurs contributions.
      - 'FLOW conserve cette distinction : préparer un colis ou produire un document est une réalisation ; envoyer la demande
        ou coordonner son enchaînement ne prouve pas qu’elle a eu lieu.'
      examples:
      - title: Illustration FLOW — préparer les colis
        situation: L’exécutant prélève et prépare les pièces demandées.
        outcome: Le résultat est communiqué aux autres responsabilités.
        lesson: Un ordre émis et une préparation réalisée restent deux faits distincts.
        source_title: Work order architecture
        source_url: https://learn.microsoft.com/en-us/dynamics365/field-service/field-service-architecture
        source_refs:
        - U477
        - ELM397
        - CMP193
  VER024:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Désigner un ensemble d’actions relatives à un objet. Gérer reste utile comme terme englobant, à condition de
        préciser ce que cette gestion produit et ses limites.
      flow_scope: Périmètre d’actions explicitement décrit.
      flow_approach: Décomposer seulement lorsque des responsabilités distinctes le justifient.
      synthesis:
      - IBM utilise Order Management pour un cycle étendu de commande. TM Forum emploie Service Management pour des actions
        définies sur les demandes de service. Le même mot management peut donc couvrir des ensembles très différents.
      - FLOW traite Gérer comme une convention de lecture, pas comme une capacité suffisante en soi. Le nom ne permet pas
        de déduire création, décision, validation, exécution ou administration sans description du périmètre.
      examples:
      - title: Illustration FLOW — préciser une gestion
        situation: « Gérer les demandes de prestation » peut couvrir émission, réponses et modifications.
        outcome: La liste des effets rend le périmètre compréhensible.
        lesson: Le seul verbe ne donne pas la responsabilité de décider du plan ou d’exécuter la prestation.
        source_title: TMF641 Service Ordering Management API REST Specification
        source_url: https://tmf-open-api-table-documents.s3.eu-west-1.amazonaws.com/Historic/TMF641_Service_Ordering/3.0.0/user_guides/TMF641_Service_Ordering_Management_API_user_guides_18.5.1.pdf
        source_refs:
        - U477
        - ELM464
        - CMP193
  VER025:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Dire l’effet recherché avant d’employer Valider. Selon le cas, il faut vérifier, autoriser, accepter ou confirmer
        ; ces actions ne sont pas interchangeables.
      flow_scope: Terme courant à expliciter avant son usage canonique.
      flow_approach: Choisir le verbe qui décrit la décision ou le contrôle réellement effectué.
      synthesis:
      - Microsoft Approved préserve une proposition ; SAP approuve un constat de service avec des effets de gestion. Même
        un nom proche d’approbation ne garantit donc pas la même décision.
      - FLOW conserve Valider comme mot à préciser. Les sources éclairent le risque d’ambiguïté ; elles ne fondent pas une
        nouvelle définition universelle ni l’adoption d’un verbe unique.
      examples:
      - title: Illustration FLOW — Une proposition approuvée reste planifiée
        situation: Un ordre planifié reçoit le statut Approved mais n’a pas été affermi.
        outcome: Il peut être conservé par le plan sans être encore un achat ferme.
        lesson: Dire seulement « ordre validé » empêcherait de comprendre ce qui a changé.
        source_title: Approve planned orders
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/approved-planned-order
        source_refs:
        - U477
        - ELM416
        - CMP189
  TER051:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Distinguer le droit métier de déplacer une marchandise du déplacement lui-même. Movement Authorization reste
        le nom FLOW de cette autorisation et de ses conditions, dont un document porte la preuve.
      flow_scope: Autorisation de mouvement dans un périmètre défini.
      flow_approach: Conserver le sens métier, distinct du départ, de la réception et des droits informatiques.
      synthesis:
      - Microsoft Release to warehouse illustre le lancement de tout ou partie d’une commande vers le traitement logistique.
        Manage order holds montre les empêchements métier pouvant bloquer ce traitement. Les deux éclairent des conditions
        préalables au mouvement.
      - 'Aucun de ces documents ne définit exactement Movement Authorization. Le nom FLOW explicite une notion plus générale
        : lever un blocage ou lancer une préparation ne suffit pas à établir toutes ses règles, ni à prouver le départ physique.'
      examples:
      - title: Illustration FLOW — traitement permis, départ inconnu
        situation: Une commande peut être transmise à l’entrepôt pour préparation.
        outcome: Le traitement peut commencer, mais aucune expédition n’est encore constatée.
        lesson: La décision qui permet le mouvement et la preuve de sa réalisation gardent des sens distincts.
        source_title: Release to warehouse
