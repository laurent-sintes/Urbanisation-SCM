  TER055:
    name: Stock movement / Inventory movement ; Goods movement chez SAP
    short_description: Changement reconnu de quantité, de lieu ou de statut du stock, conservé avec ses justificatifs.
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    notes: |2-


