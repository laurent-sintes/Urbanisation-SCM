- id: M02
  target: business
  name: Credit Exposure / Exposition de crédit
  evidence:
  - customer-credit-profile
  - D04
  - customer-credit-hold-path
  reason: Le scénario compare une exposition avec une limite, sans définition lexicale de cette exposition.
  action: Définir le périmètre financier, distinguer encours, limite et exposition projetée sans imposer une formule universelle.
  status: applied
- id: M03
  target: business
  name: Operational Capacity / Capacité opérationnelle
  evidence:
  - D03.j
  - D06.b
  - BHV076
  reason: La capacité de traitement d’un atelier ou prestataire est différente de Capability, aptitude métier durable.
  action: Définir charge admissible, unité et horizon ; préciser capacité finie dans le contexte CTP. Vérifier les appuis
    marché précis avant rédaction définitive.
  status: applied
- id: M04
  target: business
  name: Process Instance / Instance de processus
  evidence:
  - BHV082
  - process-mining
  - TER064
  - TER089
  reason: Les fiches parlent de parcours courant, d’exécution et de traces corrélées, tandis que le métamodèle utilise aussi
    parcours pour une mobilisation descriptive.
  action: Clarifier occurrence suivie, définition de parcours, Case et scénario descriptif ; ajouter une entrée si ces distinctions
    ne tiennent pas dans Processus et Case.
  status: applied
- id: M05
  target: business
  name: Mesures de processus
  evidence:
  - process-mining
  reason: Temps en file, traitement actif, attentes externes, débit et ancienneté sont employés sans repères lexicaux propres.
  action: Un petit ensemble de définitions ou une entrée regroupée ; préciser début, fin, population et unité. Ne pas ajouter
    des indicateurs non utilisés.
  status: applied
- id: M06
  target: method
  name: Core métier et contexte opérationnel
  evidence:
  - domain-sales
  - domain-sourcing-procurement
  - customer-credit-profile
  reason: La frontière Core/Cases est devenue structurante sans repère lexical central.
  action: Expliquer capacité générique et règles propres au contexte ; ne pas créer un niveau de hiérarchie ou un nouveau
    domaine.
  status: applied
- id: M07
  target: method
  name: Mandat de décision
  evidence:
  - MOD037
  - MOD038
  - D06.d
  - ba-process-supervision
  reason: Le mandat intervient dans la méthode et le pilotage opérationnel sans définition courte de sa portée.
  action: Définir qui peut décider quoi, dans quelles limites et quand escalader ; ne pas inventer le mandat réel du programme.
  status: applied
- id: M08
  target: existing_entries
  name: Proposition de promesse, engagement, confirmation
  evidence:
  - TER013
  - TER014
  - TER015
  - ba-order-promising
  reason: La distinction existe mais reste en partie dans des notes non affichées.
  action: Enrichir les entrées existantes et les liens ; pas de nouvelle entrée par défaut.
  status: applied
- id: M09
  target: existing_method_references
  name: TOGAF, BIZBOK, BPMN
  evidence:
  - atlas-transformation-methodology.yaml
  reason: Le guide emploie ces noms. Les appuis existent ; leur accès lexical peut être plus direct.
  action: Rendre les notices déjà présentes accessibles depuis les occurrences ; ne pas dupliquer les références en nouvelles
    fiches métier.
  status: applied
keep_distinct:
- 'Product Reference, Product, Product Variant et Product Unit : référence, bien, déclinaison et exemplaire ne sont pas interchangeables.'
- 'Container, Container Type, Packaging Specification et Handling Unit : distinctions explicites, sans nouveau référentiel
  autonome.'
- 'Party, Role, Agreement et Customer Credit Profile : identité, rôle, contrat et profil financier.'
- 'Supply, Supply Chain et Fulfilment : ressources, chaîne étendue et satisfaction de la commande.'
- 'ATP, CTP et PTP : décisions de promesse ; leurs calculs ne créent pas de nouvelles capacités.'
- 'Allocation, protection, affectation et réservation : effets différents.'
- 'Scénario, parcours de mobilisation, Case et processus : description et occurrence ne sont pas automatiquement identiques.'
already_covered:
- Credit Check existe dans TER155 Customer Credit Control ; améliorer le libellé/alias au besoin, ne pas créer un doublon.
- Work Item, Work Queue et Escalation existent sous TER180–TER182.
- Visibility existe sous MOD040 et est exposé dans les qualificatifs.
- Les anciens termes méthodologiques TER sont retirés de la liste métier et redirigés par les alias du guide ; MOD004 et MOD026
  sont déjà traités comme historiques.
proposed_sequence:
- Corriger les contradictions objet/capacité et les deux renvois devenus inexacts.
- Rendre visibles les distinctions utiles, actuellement perdues dans notes ; retirer les contextes vides.
- Dédoublonner avec alias et compatibilité des liens, puis alléger les verbes et anciens noms locaux.
- Ajouter les quelques notions réellement manquantes, avec appuis marché pertinents et définition courte.
