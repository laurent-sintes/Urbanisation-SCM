        - CMP193
  TER053:
    context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
    market_inspiration:
      choice: Identifier où une opération ou un mouvement a lieu. Location désigne le lieu, distinct de la partie responsable
        et sans supposer qu’il porte toujours du stock.
      flow_scope: Origine, destination, étape ou espace physique utile.
      flow_approach: Nommer le lieu à la maille nécessaire.
      synthesis:
      - GS1 distingue l’identification des lieux de celle des parties. Microsoft emploie sites, entrepôts et emplacements
        à plusieurs niveaux de détail. Les sources éclairent respectivement le sens du repère et sa granularité opérationnelle.
      - FLOW conserve une notion de lieu assez générale pour représenter une étape sans stockage. La présence d’un identifiant
        de lieu ne renseigne pas automatiquement son stock ou sa capacité.
      examples:
      - title: Exemple GS1 — Dal Giardino et son siège
        situation: GS1 utilise la marque fictive Dal Giardino pour distinguer l’entreprise de son siège physique.
        outcome: La partie et le lieu ont des sens différents, même lorsqu’une clé est utilisée conjointement.
        lesson: Le modèle distingue les notions sans exiger artificiellement deux clés dans tous les cas.
