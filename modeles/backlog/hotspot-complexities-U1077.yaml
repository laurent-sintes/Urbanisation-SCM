id: hotspot-complexities-U1077
date: '2026-10-14'
status: applied_to_backlog
source_refs: [U1077]
scope: Réestimer les complexités de sept hotspots visibles après la reprise du périmètre omnicanal de HS-032, afin que celui-ci soit le seul visible de criticité XL.
assessment:
  hs_032: XL/XL pour l'option de Core omnicanal, avec arbitrage de gouvernance transverse et réalisation à éprouver.
  hs_002: M/L car l'orientation de principe FLOW–C-LOG est décrite ; garanties, validité et engagement restent ouverts.
  hs_008: M/L pour la construction circonscrite du carnet Wholesale ; règles et faisabilité restent à éprouver.
  hs_020: M/L pour la répartition Négoces sans compromis intermarques démontré.
  hs_021: M/L pour la frontière FLOW–Finance–SAP à coordonner par type de flux.
  hs_024: M/M car l'autorité sur Purchase Order entre CBS et FLOW demande encore un accord entre périmètres.
  hs_033: S/M seulement si Sarenza garde la responsabilité de ses parcours et consomme des services communs FLOW.
  boundary: Estimations de cadrage ; aucune Option retenue, faisabilité installée ou urgence inférée.
glossary_alignment: MOD044, axes de complexité et matrice-v1 relus ; les valeurs changent sans modifier leurs définitions. Les noms et frontières métier restent ceux du backlog.
market_comparison: Les appuis Microsoft, SAP, Oracle, Manhattan, Shopify et commercetools déjà consultés pour HS-032 étayent la possibilité d'un socle omnicanal, sans en chiffrer l'effort FLOW. Aucun nouveau fait marché ne motive les autres estimations.
