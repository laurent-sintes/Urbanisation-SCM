findings:
- id: AUD1020-01
  severity: high
  category: scenario_mapping
  targets:
  - b2b-partial-stock-path
  - b2b-partial-stock-split-path
  finding: Les deux variantes décrivent une attente de complétude ou un départ 60/40, mais ne mobilisent pas Delivery Release
    Decision. Service Order Release Decision est présente et couvre les prestations, pas l’éligibilité des commandes et quantités
    à livrer.
  evidence_locator: paths/step-4/contributions et outcome ; frontière de delivery-release-decision
  recommendation: Ajouter une contribution de Delivery Release Decision explicitant quantités à libérer, attente et reste
    à satisfaire. Dans la variante fractionnée, rendre aussi explicite la tenue de l’engagement accepté par Sales Order. Ne
    pas créer une seconde commande par défaut.
  status: proposed_not_applied
- id: AUD1020-02
  severity: high
  category: scenario_mapping
  targets:
  - additional-purchase-partial-path
  finding: step-1 évalue un achat supplémentaire et fait piloter le plan, sans contribution de Replenishment pour déterminer
    l’apport proposé. Le rattachement récent de Replenishment à Stock Optimization rend ce raccourci plus visible.
  evidence_locator: 'paths/step-1 : CTP, Master Planning, Supply Assignment, Plan Application, Purchase Order ; Replenishment
    absente'
  recommendation: Distinguer Replenishment qui propose l’apport, CTP qui en établit la faisabilité et le Master Plan qui combine
    les résultats. Décrire la proposition adressée à MAP et sa réponse avant l’achat autorisé ; garder le cycle et le reliquat
    de Purchase Order.
  status: proposed_not_applied
- id: AUD1020-03
  severity: high
  category: scenario_mapping
  targets:
  - transfer-replenishment-order-driven-path
  - fashion-launch-path
  finding: Les parcours rendent effectifs des transferts à partir d’un besoin, d’affectations et du plan, mais omettent la
    décision Stock Redistribution alors que le modèle lui attribue le choix du déplacement physique entre sites.
  evidence_locator: transfer-replenishment-order-driven-path/step-2 ; fashion-launch-path/step-2 ; D05.c définition/scope
  recommendation: Mobiliser Stock Redistribution lorsque les ressources retenues sont du stock existant à déplacer, avec origine,
    destination, quantité et date. Garder Supply Assignment pour la couverture, Plan Application pour l’application et Transfer
    Order pour la demande/les engagements du transfert.
  status: proposed_not_applied
- id: AUD1020-04
  severity: medium
  category: scenario_mapping
  targets:
  - seasonal-order-backlog-path
  finding: Les 28 contributions copient les définitions générales des capacités au lieu de décrire leur rôle dans le cas.
    À backlog-5, Reservation Rule Optimization est mobilisée pour l’affermissement courant sans condition de réexamen de règle,
    alors que les règles actives suffisent normalement à leur application.
  evidence_locator: Tous les roles ; backlog-5/contributions/D05.h ; D05.h distingue recommandation et politique active
  recommendation: Écrire des contributions contextualisées. Déclarer que la stratégie active est fournie, sa maintenance étant
    préalable. Rendre D05.h conditionnelle à un véritable réexamen des conditions de réservation ; garder la consommation
    de règles actives et Reservation pour les engagements individuels.
  status: proposed_not_applied
- id: AUD1020-05
  severity: medium
  category: scenario_mapping
  targets:
  - preorder-future-availability-path
  - complete-order-multiline-path
  - b2b-release-deadline-path
  finding: 'Certaines responsabilités sont expliquées dans le texte sans contribution correspondante à cette maille. D04.j
    est cité à coverage mais mobilisé au jalon firm : ce décalage est explicable. Reservation est mentionnée conditionnellement
    dans complete-order-multiline sans variante mappée. Le cas b2b-release-deadline ne précise pas si les commandes sont déjà
    autorisées en livraison.'
  recommendation: Ne pas ajouter mécaniquement toutes les capacités citées. Mapper une variante conditionnelle de réservation
    si elle fait partie du parcours ; pour la préparation B2B, poser l’autorisation de livraison comme précondition ou mobiliser
    Delivery Release Decision si le parcours la décide.
  status: proposed_not_applied
- id: AUD1020-06
  severity: high
  category: market_coverage
  targets:
  - ba-order-promising
  finding: La lacune Microsoft repose encore sur Create orchestration flows, document trop général. Une documentation Dynamics
    intitulée Order promising décrit précisément ATP, CTP, dates d’expédition/réception et réexamen. La lacune n’est donc
    plus justifiée par les seules recherches consignées.
  market_refs:
  - MKT-U1020-MS-PROMISING
  - MKT-U1017-MS
  recommendation: Remplacer cette lacune par une correspondance primaire pertinente. Garder SAP aATP et expliciter que le
    produit peut confirmer des dates alors que FLOW sépare possibilité de promesse et engagement. La page Microsoft générale
    contient des mentions techniques CTP anciennes ; utiliser la page CTP spécialisée pour ces paramètres.
  status: proposed_not_applied
- id: AUD1020-07
  severity: medium
  category: market_coverage
  targets:
  - D03.k
  - ba-master-plan-management
  - ba-order-backlog-management
  - ba-physical-stock-configuration-optimization
  finding: 'Les appuis de fonctions produit ne démontrent pas une nomenclature identique de Business Areas. Pour PTP, SAP
    Charge Calculation étaye une entrée de coût, pas toute la sélection économique d’une promesse. Les fiches le signalent
    déjà : il faut conserver cette limite à la lecture des résultats.'
  market_refs:
  - MKT-U1020-MS-DOM
  - MKT-U1020-SAP-CHARGES
  - MKT-U1020-ORACLE-COSTS
  recommendation: Conserver la comparaison partielle et les résultats propres des quatre périmètres. Chercher un appui SAP
    plus direct à l’arbitrage économique avant de prétendre à une couverture complète de PTP. Ne pas renommer automatiquement
    un périmètre FLOW d’après un module ERP.
  status: qualified_limit
- id: AUD1020-08
  severity: medium
  category: definitions
  targets:
  - subdomain-policies
  - ba-service-provider-controls
  - operational-analysis-reporting
  - BHV006
  finding: 'Les scopes rendent les responsabilités compréhensibles, mais certaines définitions restent trop générales ou héritées
    : référentiels de contrôle pour les stratégies, présenter des référentiels pour des exclusions actives, informations opérationnelles
    pour une capacité de Process Intelligence, plusieurs réponses possibles pour une simulation de plan.'
  recommendation: 'Faire commencer les définitions par le service durable rendu : stratégies/règles applicables, exclusions/limites
    actives, analyse des parcours Supply, alternatives d’un plan et leurs impacts. Contrôler le glossaire dans le même lot
    ; ne pas étendre automatiquement les accords historiques aux nouvelles formulations.'
  status: proposed_not_applied
- id: AUD1020-09
  severity: low
  category: definitions
  targets:
  - subdomain-sales-b2c-ecommerce
  - subdomain-sales-b2c-store
  - subdomain-sales-wholesale
  - subdomain-assortment-catalog-management
  - subdomain-retail-network-management
  - subdomain-store-backoffice-operations
  finding: Plusieurs définitions de contexte sont des listes nominales très courtes. Elles désignent un sujet, mais expliquent
    moins bien le résultat durable que les autres sous-domaines. Digital Commerce est limité localement à B2C, sans que le
    nom seul indique cette restriction.
  recommendation: Rédiger une phrase de responsabilité et rendre la frontière de canal explicite dans définition/scope, sans
    ajouter de capacités aux domaines de contexte. Aucun changement automatique de nom ou de périmètre.
  status: proposed_not_applied
- id: AUD1020-10
  severity: medium
  category: market_coverage
  targets:
  - D05.h
  - D04.t
  - service-order-labeling
  - service-order-garment-finishing
  - service-order-cleaning
  - service-order-repair-alteration
  - service-order-personalization
  - service-order-transport-booking
  - ba-order-promising
  - ba-execution-assurance
  - ba-inbound-information-integration
  - ba-outbound-information-provision
  - ba-service-references
  - subdomain-sampling-product-validation
  - subdomain-strategy-objectives
  - subdomain-audit-assurance
  - subdomain-value-added-returns
  - subdomain-transport-exception
  finding: 18 fiches ne portent pas encore la paire d’appuis Microsoft Dynamics / SAP S/4HANA. Les 27 lacunes sont déclarées
    et qualifiées ; la validation technique peut donc réussir sans prouver une documentation marché complète.
  recommendation: Réexaminer d’abord les lacunes génériques des Business Areas ; préserver les lacunes spécialisées tant qu’aucun
    passage pertinent n’est établi. L’impression d’étiquette ne prouve pas à elle seule le cycle d’une commande d’étiquetage
    textile ; une configuration de réservation ne prouve pas son optimisation.
  status: documented_gap
- id: AUD1020-11
  severity: medium
  category: scenario_readability
  targets:
  - return-fashion-recovery-path
  - consignment-sale-pickup-path
  - fashion-launch-path
  - export-remote-services-path
  - stocktaking-variance-path
  - last-item-concurrency-path
  - substitution-price-service-path
  - additional-purchase-partial-path
  - pickup-or-direct-shipment-path
  - transport-missed-connection-path
  - remote-payment-ambiguous-path
  - reference-plan-correction-path
  - redistribute-protected-stock-path
  - supplier-return-outcomes-path
  - gift-kits-crossdock-path
  - ownership-transit-deadline-path
  - order-structuring-engaged-path
  - b2b-release-deadline-path
  - trace-accessory-kits-path
  - damaged-stock-disposition-path
  - transport-loads-six-stores-path
  - transfer-replenishment-order-driven-path
  - consignment-launch-replenishment-path
  - partial-receiving-path
  finding: 24 parcours ont le titre Réponse illustrée. 24 parcours et leurs scénarios n’ont pas de préconditions structurées,
    même si les textes peuvent contenir des hypothèses. Cela gêne la lecture et l’évaluation du mapping sans constituer une
    erreur de schéma.
  recommendation: Nommer les parcours par résultat/variante ; expliciter les préconditions utiles et les sorties sans promettre
    une exhaustivité. Conserver la distinction entre illustrations, preuve de besoin et réalisation installée.
  status: proposed_not_applied
- id: AUD1020-12
  severity: medium
  category: functional_completeness
  targets:
  - seasonal-order-backlog-path
  finding: 'Les capacités nécessaires au récit sont présentes, mais les 40 use cases sont des illustrations. Le corpus ne
    démontre pas encore les variantes critiques : refus/révision d’une proposition par MAP, passage automatique à la fermeté
    contractuelle, arbitrage de carnets partageant une ressource et contraintes de qualité/assortiment d’une livraison partielle.'
  recommendation: Ajouter ou approfondir ces variantes avant de conclure à une couverture fonctionnelle complète. Mobiliser
    les capacités existantes ; aucun nouveau manque de capacité durable n’est établi par cet audit.
  status: proposed_not_applied
- id: AUD1020-13
  severity: low
  category: reading_order
  targets:
  - D03
  finding: Le lecteur des codes ignorait reading_order pour les Business Areas sous un nœud area et conservait leur ordre
    de relation.
  recommendation: Prendre en compte les ordres explicites complets sous un sous-domaine ; garder la lecture historique lorsque
    ces champs sont absents.
  status: corrected
  code_files:
  - scripts/display_codes.py
  - scripts/test_display_codes.py
- id: AUD1020-14
  severity: low
  category: validation
  targets:
  - supply-chain-orchestration
  finding: Le test de synthèse de domaine ne considérait que les relations contains. Les sous-domaines du domaine courant
    sont présentés par presents ; sa boucle pouvait donc ne vérifier aucun enfant.
  recommendation: Le test lit désormais les enfants de l’arbre explicite et vérifie que la population est non vide ; il contrôle
    réellement les neuf sous-domaines courants.
  status: corrected
  code_files:
  - scripts/test_model_coherence.py
