method:
  name_definition_review: Lecture des noms/définitions des 168 nœuds, des frontières structurantes et des scopes concernés
    ; respect des familles nominales de commandes adoptées. Les contextes périphériques ne sont pas transformés en capacités.
  market_review: Inventaire de toutes les correspondances et lacunes des 168 fiches ; comparaison ciblée des frontières modifiées
    et des lacunes. Les sources antérieures sont réutilisées comme preuves documentées et distinguées des dix sources directement
    consultées pour cet audit.
  scenario_review: Lecture des 43 parcours, leurs descriptions, résultats et contributions ; vérification du rôle et des conditions,
    sans exiger une capacité pour chaque simple mention de responsabilité externe.
  limits: Paire d’appuis primaire = documentation partielle, pas équivalence complète ni réalisation installée. Le corpus
    illustratif ne démontre pas l’exhaustivité fonctionnelle. U431 n’est pas rouvert.
conclusion:
  structural: Cohérence structurelle et distinctions principales conservées ; ordre de lecture corrigé.
  semantic: Découpage lisible, quelques définitions à préciser et mappings à compléter ; aucun nouveau manque de capacité
    durable établi.
  market: 150 fiches portent la paire documentaire ; 18 fiches/27 lacunes restent explicites. Order Promising possède désormais
    un appui Microsoft consulté à intégrer lors de la correction.
  completeness: 77 capacités mobilisées au moins une fois ; cela ne prouve ni couverture de toutes les variantes ni exhaustivité
    du domaine. Compléter les parcours critiques avant de conclure complet.
