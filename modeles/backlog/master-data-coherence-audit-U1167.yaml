    line: 37935
  impact: Deux lectures restent possibles sur la préparation et la qualité des données reçues ; le lecteur ne peut pas déterminer
    le rôle de Master Data pour ces apports.
  recommendation: 'Arbitrer contrat par contrat : contribution à Master Data puis distribution, ou apport spécialisé direct
    avec autorité, qualité attendue et motif de dérogation documentés. Préserver la source financière et la définition produit
    ; ne supprimer aucun flux existant par principe.'
  approval: Arbitrage métier ciblé requis ; aucune preuve de flux installé déduite.
- id: MDM-U1167-04
  priority: P2
  category: glossary_semantic_collision
  title: Le glossaire confond les deux responsabilités portant les fournitures internes
  observation: Les BA ba-internal-supplies-equipment-references et ba-mdm-internal-supplies portent le même nom Internal Supplies
    & Equipment References. TER184 est partagé, mais son contexte renvoie uniquement à la BA Master Data et décrit la fabrication
    commune. La perspective du référentiel simple Supply a disparu du contexte du terme.
  evidence:
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: ba-internal-supplies-equipment-references
    fields:
    - definition
    - scope
    line: 47474
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: ba-mdm-internal-supplies
    fields:
    - definition
    - scope
    line: 72358
  - path: modeles/backlog/glossary.yaml
    collection: terms
    id: TER184
    fields:
    - definition
    - context
    line: 31069
  impact: Une aide de lecture du référentiel local peut présenter la responsabilité de l’usine MDM. La distinction explicitement
    demandée par Laurent devient ambiguë.
  recommendation: Conserver un terme documentaire commun avec un contexte expliquant et reliant les deux responsabilités si
    le concept est identique. Si les sens sont distincts, proposer deux entrées qualifiées. Éviter un renommage automatique
    des BA validées ou une nouvelle identité de bien.
  approval: Alignement sémantique à proposer ; les identifiants et preuves historiques restent conservés.
- id: MDM-U1167-05
  priority: P2
  category: market_evidence_granularity
  title: Certaines paires de références satisfont le contrôle formel sans prouver la responsabilité fine
  observation: Trade Item Identification cite Product identifiers côté Dynamics et Introducing SAP Master Data Governance
    côté SAP. Le passage SAP enregistré porte sur le modèle général et la gouvernance, sans démonstration de l’attribution
    des GTIN ; la page vérifiée ne contient pas GTIN. La fiche évoque une extension Utopia sans référencer sa preuve dans
    sa propre comparaison. Les preuves de Source Contribution Management et Reference Code & Classification Management sont
    également plus larges ou différentes que leur mandat fin.
  evidence:
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: cap-mdm-trade-item
    fields:
    - fields.market_comparisons
    line: 71860
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: cap-mdm-source-contribution
    fields:
    - fields.market_comparisons
    line: 69691
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: cap-mdm-codes-classification
    fields:
    - fields.market_comparisons
    line: 73836
  impact: Le succès du contrôle des familles Microsoft/SAP peut être pris à tort pour une conformité documentaire complète
    ou une couverture native des fonctions.
  recommendation: Requalifier les correspondances au niveau du résultat métier, compléter les passages directement pertinents
    et déclarer les lacunes restantes. Pour les GTIN Retail, distinguer preuve native S/4HANA et extension Utopia ; préserver
    la preuve Microsoft pertinente. Aucun nom, périmètre ni accord ne découle de la seule disponibilité d’un produit.
  approval: Audit documentaire ciblé ; il ne remet pas automatiquement en cause le découpage métier validé.
