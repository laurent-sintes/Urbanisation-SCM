verified:
- Un domaine rattaché à Business Operations, neuf sous-domaines, vingt et une BA et trente-trois capacités ; parent structurel
  unique pour chaque entrée.
- Toutes les capacités Master Data appartiennent à une BA ; aucun comportement ajouté, aucun cycle structurel ou lien irrésolu
  signalé par le contrôle courant.
- Les cinq capacités de stewardship retirées n’ont plus de nœud ni de relation ; leurs termes restent historiques.
- Operational References conserve ses cinq familles documentaires, Reference Maintenance, Reference Ingestion et ses trois
  comportements de provenance.
- Les cent trente captures U1166 conservent leurs valeurs et leur contexte sémantique exacts.
- Les frontières prix de référence/prix contextualisé/prix engagé, définition produit/variante opérationnelle, consigne/unité
  physique et configuration/autorité métier sont préservées dans les textes.
- Les sources Finance et les responsabilités produit restent qualifiées ; aucune réalisation installée ni Sarenza évalué n’est
  déduit.
observations:
- kind: not_a_defect
  subject: Scénarios
  finding: Aucun lien de scénario n’est documenté pour les capacités Master Data. Cela ne prouve pas une absence d’usage ;
    aucun scénario n’est inventé pour compléter l’arbre.
- kind: naming_watch
  subject: Noms partagés BA/capacité
  finding: Source Contribution Management et Master Record Consolidation nomment chacun une BA et une capacité ; leur niveau
    et leur parent les distinguent. Ce seul doublon ne prouve pas une erreur, mais les contextes de glossaire méritent une
    lecture explicite.
- kind: limit
  subject: Autorités de données
  finding: Le modèle cible ne vaut pas inventaire de sources installées. Les maîtres et responsabilités encore inconnus doivent
    rester à documenter par objet et attribut, sans attribution implicite au nouveau domaine.
findings:
- id: MDM-U1167-01
  priority: P1
  category: external_business_relations
  title: Les producteurs et la plupart des consommateurs de Master Data ne sont pas reliés
  observation: 'Le domaine possède zéro relation métier entrante et une seule sortante : Master Data Distribution vers Reference
    Ingestion Supply. Aucun lien ne décrit ses contributions reçues ni la fourniture des références à Commerce, Sourcing and
    Procurement ou aux consommateurs des configurations partagées.'
  evidence:
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: domain-master-data
    fields:
    - scope
    line: 68849
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: cap-mdm-ingestion
    fields:
    - definition
    line: 69769
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: cap-mdm-distribution
    fields:
    - definition
    line: 70825
  - path: modeles/backlog/model.yaml
    collection: relations
    id: REL-U1166-MDM-TO-SUPPLY-REFERENCES
    fields:
    - source_id
    - target_id
    - fields.data_exchange
    line: 94851
  impact: La carte ne permet pas de suivre la provenance ou le retour des données communes entre les domaines, alors que cette
    responsabilité est décrite et validée.
  recommendation: 'Documenter les échanges cibles par objet : données approuvées fournies à Master Data, versions certifiées
    distribuées et signalements de correction. Identifier les responsabilités connues ; conserver explicitement les producteurs
    restant à établir. Ne déduire aucune interface installée ni imposer un passage technique universel.'
  approval: Relations et contrats à proposer avant application ; ne pas étendre automatiquement U1166.
- id: MDM-U1167-02
  priority: P1
  category: internal_business_relations
  title: Les capacités de l’usine sont rattachées mais leurs contributions ne sont pas reliées
  observation: Les 64 liens de structure couvrent le rattachement du domaine et son arbre ; aucune relation métier ne relie
    deux nœuds Master Data. Les 33 capacités existent, mais 32 ne participent à aucune relation métier explicite. Les textes
    annoncent que les capacités par objet mobilisent les traitements communs sans porter ces contributions dans les relations.
  evidence:
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: domain-master-data
    fields:
    - scope
    line: 68849
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: cap-mdm-consolidation
    fields:
    - scope
    line: 70007
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: cap-mdm-quality-assessment
    fields:
    - scope
    line: 69366
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: cap-mdm-certification
    fields:
    - scope
    line: 70498
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: cap-mdm-publication
    fields:
    - scope
    line: 70581
  impact: La carte relationnelle ne montre ni les résultats nécessaires à la certification, ni les versions publiées à distribuer,
    ni le recours des capacités par objet aux fonctions communes.
  recommendation: Décrire les données et décisions échangées entre préparation, capacités par objet, qualité, changement,
    certification, publication et diffusion. Qualifier conditions, résultats et autorités. Éviter une séquence obligatoire
    identique pour tous les objets, une dépendance à chaque capacité et un graphe complet artificiel.
  approval: Complément de modélisation à soumettre ; aucune nouvelle capacité nécessaire par défaut.
- id: MDM-U1167-03
  priority: P2
  category: legacy_route_boundary
  title: Les apports directs Design et Finance vers la Supply restent à qualifier
  observation: REL-U1113-design-product-reference et REL-U1113-finance-credit-reference alimentent encore directement Reference
    Ingestion, en parallèle de la nouvelle relation depuis Master Data. Ce maintien n’est pas structurellement invalide, mais
    chaque contrat ne dit pas s’il s’agit d’une exception directe autorisée ou d’un trajet cible à réviser avec l’usine commune.
  evidence:
