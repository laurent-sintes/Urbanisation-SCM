    complète ni réalisation installée.
  target:
    collection: nodes
    id: subdomain-policies
    approved_fields:
    - definition
    - market_comparisons
    values:
      definition: Définir, tenir et rendre applicables les stratégies, protections, limites et autorisations qui guident les
        décisions et opérations Supply.
      market_comparisons:
      - vendor: Microsoft
        product: DOM rules
        element_name: DOM rules
        element_type: Concept ou fonction documenté dans un produit
        relationship: Recouvrement partiel
        similarities: Règles distinctes avec validité, activation, contraintes, protection de stock, priorités de lieux et
          limites de fractionnement.
        differences: Les règles DOM et protections SAP étayent l’encadrement des décisions. Ces produits ne prescrivent pas
          un sous-domaine autonome Supply Policy Management.
        flow_position: |-
          Supply Policy Management tient les références locales de contrôle dont Supply Chain Orchestration a la maîtrise : règles de protection des ressources et des demandes, limites de recours aux prestataires, seuils et activations temporaires. Chaque version précise sa portée, sa validité, son autorité et ses dérogations. Les capacités consommatrices utilisent la version applicable ; une recommandation d’Availability ne la modifie pas automatiquement.

          Exemple fictif : activer une protection de stock pour un groupe de demandes ou suspendre les nouvelles sollicitations d’un prestataire, sans annuler les engagements déjà pris. Les réservations et faits opérationnels restent dans Inventory Management ; les parcours et leurs règles de structure relèvent de Process Management. Les règles de crédit reçues du contrôle de gestion restent sous autorité externe et sont documentées dans [Partner & Agreement References](model:ba-partner-agreement-references). Supply Policy Management désigne ici une responsabilité métier de gouvernance par configuration, sans présumer d’une plateforme technique unique ni d’une réalisation installée.
        source_title: DOM rules
        source_url: https://learn.microsoft.com/en-us/dynamics365/commerce/dom-rules
        source_version: Documentation évolutive, mise à jour affichée le 22 janvier 2026
        consulted_on: '2026-09-23'
        source_locator: Common attributes ; Minimum inventory rule ; Fulfillment location priority ; Partial orders rule
        evidence_limits: Règles propres au solveur DOM ; ne prouve pas un sous-domaine autonome réunissant toutes les policies
          Supply. Les règles DOM et protections SAP étayent l’encadrement des décisions. Ces produits ne prescrivent pas un
          sous-domaine autonome Supply Policy Management.
        status: proposed
        source_refs:
        - ELM394
        - CMP269
        - CMP270
        - U673
        - U843
        term_choice: Nom du sous-domaine retenu pour la responsabilité FLOW ; pas de correspondance universelle aux modules
