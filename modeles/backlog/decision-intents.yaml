  - U1160
  note: 'U1160 approuve la correction de cohérence F07 de l’audit U1159 : code BA et convention de profondeur courante. Capture
    du seul énoncé de cette convention ; aucun autre principe, description, exemple, portée normative ou réalisation installée
    adopté par extension.'
  target:
    collection: principles
    id: PRINCIPLE-BUSINESS-SYSTEM
    approved_fields:
    - statement
    values:
      statement: 'Enterprise Architecture → Business System → Domain → Subdomain → Business Area → Capability → Behavior.
        Un système métier regroupe des domaines coopérant pour une finalité commune, indépendamment des applications et de
        l’organisation. Chaque domaine a un seul système parent explicite. Profondeur ciblée : contexte autour de Business
        Operations, domaines opérationnels précis, capacités dans les trois domaines de Business Operations et comportements
        dans Supply Chain Management. Les référentiels sources utiles aux ingestions seront documentés à terme sur preuve
        ; aucune exhaustivité périphérique, source de vérité ou réalisation installée n’est inférée. Logistics est un système
        métier autonome de prestation ; ses domaines peuvent s’arrêter aux Business Areas de contexte. Dans Business Operations,
        Commerce, Sourcing and Procurement et Supply Chain Management vont jusqu’aux capacités ; seul Supply Chain Management
        est détaillé jusqu’aux comportements. Master Plan est un sous-domaine de Supply Chain Management. Les autres systèmes
        conservent leur profondeur déclarée.'
    value_sha256:
      statement: 89b27a4302fb8246ac838b5f3f304c80ae20e2f97fb99cfdc68fa23eba63af01
