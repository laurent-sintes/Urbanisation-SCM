    du seul énoncé de cette convention ; aucun autre principe, description, exemple, portée normative ou réalisation installée
    adopté par extension.'
  target:
    collection: principles
    id: PRINCIPLE-DISPLAY-CODES
    approved_fields:
    - statement
    values:
      statement: 'Identité persistante distincte du code de lecture : UNI/SYS/DOM/SUB/BA/REF/CAP/BHV, trois chiffres au minimum,
        séquence globale par type dans le parcours en profondeur de l’arbre de haut en bas. Arbre, cartes et fiches partagent
        le même ordre. Filtres, recherche, repli et placement du graphe ne renumérotent rien. Codes et ordre sont figés dans
        chaque nouvelle publication ; historiques inchangés. Recherche par code ou identité ; liens par identité et version.
        Règles méthodologiques détaillées : identification_rules dans modeling-glossary.yaml. Convention FLOW adoptée U783,
        sans changement de responsabilité ni parent.'
