id: HOTSPOT-GAP-RESEARCH-U955
status: applied
searched_on: '2026-10-12'
source_refs:
- U951
- U952
- U955
- U956
- U957
scope: Recherche ciblée inter-SI et intra-SI dans les contributions, corrections, panoramas et dossiers FLOW déjà liés ; ni
  audit exhaustif des capacités ni observation des installations.
canonical_changes: Extension du contrat observation_scope et intégration dans le modèle cible ; observations rapportées, hypothèses
  et comparaisons incomplètes restent distinctes. Aucun panorama ni snapshot modifié.
integration_candidates:
- hotspot_id: HS-002
  readiness: ready_as_reported
  basis: Deux côtés décrits directement par Laurent, avec une frontière explicitement limitée au choix des prestations confiées
    à C-LOG.
  proposed_gap:
    id: hs-002-decision-location
    title: Responsabilité du choix des prestations et exécutants
    subject_node_id: D06.e
    natures:
    - realization_difference
    observations_by_context:
    - context_id: beaumanoir-historique
      business_need: Déterminer les services et exécutants à mobiliser pour les prestations nécessaires.
      system_coverage: not_assessed
      handling: Pour les demandes confiées à C-LOG, Laurent décrit un choix de l’entrepôt et du transporteur par l’OMS C-LOG,
        selon les opérations requises et les exécutants admissibles.
      business_rules:
      - C-LOG choisit l’entrepôt capable de réaliser les opérations demandées et le transporteur.
      source_refs:
      - U04
      - U06
      - U07
      evidence_state: documented
      evidence_kind: user_report
      limits: 'Pratique rapportée dans le récit historique. Ne concerne pas tous les parcours : le ship-from-store a son fonctionnement
        propre. Aucun audit actuel du partage des décisions.'
    - context_id: boardriders
      business_need: Déterminer les services et exécutants à mobiliser pour les prestations nécessaires.
      system_coverage: not_assessed
      handling: Laurent décrit Boardriders comme détenteur du réseau de fulfillment et constructeur du plan ; les prestataires
        exécutent les ordres reçus et C-LOG pilote localement sans initiative sur le plan.
      business_rules:
      - Boardriders construit le plan, passe les ordres et choisit leur moment de libération.
      - C-LOG exécute et pilote localement, sans initiative sur le plan dans le fonctionnement décrit.
      source_refs:
      - U925
      evidence_state: documented
      evidence_kind: user_report
      limits: Déclaration de Laurent du 10 octobre 2026 ; le rôle global ne prouve pas le porteur de chaque décision détaillée
        ni les exceptions.
    comparison: Pour les prestations confiées à C-LOG, le choix des moyens est décrit côté logisticien dans le récit Marques
      Historiques et côté Boardriders dans U925. Cette différence de responsabilité ne signifie pas absence de capacité métier
      dans l’une des entités.
    convergence_question: Quelle répartition commune des choix entre marques, Core System FLOW et C-LOG faut-il retenir, et
      quelles décisions locales restent à l’exécutant ?
    business_effects:
    - Une convergence doit expliciter qui propose, choisit et engage le plan, afin d’éviter décisions contradictoires ou délégation
      implicite. Il s’agit d’un risque à instruire, pas d’un incident établi.
    open_questions:
    - Quelles décisions portent exactement sur les ressources, les services, les exécutants et la libération des ordres ?
    - Quelles garanties le plan proposé apporte-t-il, pendant combien de temps et quand devient-il engageant ?
    - Quels parcours actuels des Marques Historiques diffèrent du récit initial ?
    resolution_option_ids:
    - hs-002-joint-plan
    - hs-002-brand-plan
    source_refs:
    - U04
    - U06
    - U07
    - U925
    - U926
- hotspot_id: HS-011
  readiness: ready_as_reported
  basis: Comparaison explicite des deux côtés dans U925 ; besoin de conservation multi-prestataires demandé.
  proposed_gap:
    id: hs-011-provider-landscape
    title: Un prestataire logistique ou plusieurs partenaires
    subject_node_id: D06.e
    natures:
    - realization_difference
    observations_by_context:
    - context_id: beaumanoir-historique
      business_need: Déterminer les services et exécutants à mobiliser pour les prestations nécessaires.
      system_coverage: not_assessed
      handling: Laurent indique que les Marques Historiques travaillent uniquement avec C-LOG pour le périmètre des prestataires
        logistiques comparé.
      business_rules:
      - C-LOG est le partenaire logistique décrit dans ce périmètre.
      source_refs:
      - U925
      evidence_state: documented
      evidence_kind: user_report
      limits: Le périmètre de comparaison est celui des prestataires logistiques du hotspot ; ne pas l’étendre à tous les
        transporteurs ou opérations physiques. Aucun manque technique multi-prestataires n’est démontré.
    - context_id: boardriders
      business_need: Déterminer les services et exécutants à mobiliser pour les prestations nécessaires.
      system_coverage: not_assessed
      handling: Laurent indique que Boardriders travaille avec C-LOG et d’autres prestataires logistiques ; Boardriders construit
        et libère leurs ordres.
      business_rules:
      - Plusieurs prestataires peuvent être mobilisés selon le plan tenu par Boardriders.
      source_refs:
      - U925
      evidence_state: documented
      evidence_kind: user_report
      limits: Identité des autres prestataires, variantes de contrat et couverture technique détaillée non documentées dans
        cette contribution.
    comparison: Même responsabilité de sélection des services et exécutants, sur des périmètres partenaires différents. Le
      fait de n’utiliser que C-LOG ne prouve pas que le SI historique soit incapable de gérer plusieurs prestataires.
    convergence_question: Comment conserver dans Core System FLOW le fonctionnement multi-prestataires Boardriders, avec un
      contrat commun et des variantes, ou avec des contrats propres aux prestataires ?
    business_effects:
    - Une cible conçue uniquement pour C-LOG risque de ne pas reconduire les autres partenaires Boardriders. Cette conséquence
      est une analyse du besoin déclaré.
    open_questions:
    - Quels prestataires, services et périmètres doivent être reconduits ?
    - Quels événements, engagements et règles de libération diffèrent réellement par prestataire ?
    resolution_option_ids:
    - hs-011-common-contract
    - hs-011-provider-contracts
    source_refs:
    - U925
