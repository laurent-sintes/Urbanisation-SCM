excluded_inferences:
- Différents noms d’applications ne prouvent pas une différence de capacité ou de règle métier.
- Un contexte non décrit ne reçoit pas un constat not_covered.
- Le chiffre 5 % de décisions SAP contredisant NewStore ne repose pas sur une mesure datée dans le dossier consulté ; non
  intégré.
- Les besoins cibles Synvance ne sont pas convertis en fonctions existantes.
- Aucun accord historique ou statut de source intégrée dans FLOW-Program n’est étendu à ces propositions.
