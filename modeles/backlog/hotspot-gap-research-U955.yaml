comparison_axes:
  inter_system: Comparer des observations dans plusieurs contextes SI canoniques, pour une même responsabilité métier.
  within_system: 'Comparer des périmètres documentés du même contexte SI : marques, parcours ou populations, sans en faire
    de nouveaux systèmes.'
  mixed: Une même analyse peut comparer plusieurs SI et plusieurs périmètres dans l’un d’eux ; chaque observation garde ses
    sources propres.
  boundary: Une variante peut être légitime. Une différence de parcours n’est un écart pertinent que si le service, les moyens
    ou les règles comparés sont explicités.
scope_contract_proposal:
  state: implemented
  observation_scope:
    id: Identité stable du périmètre comparé au sein du contexte, distincte de context_id.
    label: Libellé compréhensible du périmètre.
    description: Marques, parcours ou population concernés, avec les limites connues.
  validation: Le couple context_id + observation_scope.id identifie un côté de la comparaison ; les périmètres sont obligatoires
    si le même SI apparaît plusieurs fois. Ne pas autoriser deux observations indifférenciées du même SI.
  display: Afficher le nom du SI et le libellé du périmètre ; deux côtés intra-SI ne doivent pas porter le même seul titre.
  current_limit: Anciennes observations sans périmètre conservées ; identité du couple contexte/périmètre contrôlée.
  applicability: Ne pas ajouter artificiellement des contextes SI pour contourner cette limite ; aucune évaluation globale
    héritée des sous-périmètres.
within_system_candidates:
- id: RESEARCH-HISTORICAL-FULFILMENT-PATHS
  classification: ready_as_reported_if_scoped_contract
  canonical_hotspot_ids: []
  related_hotspot_id: HS-002
  subject_node_id: D06.e
  title: Choix des moyens de livraison entrepôt ou magasin
  context_id: beaumanoir-historique
  natures:
  - realization_difference
  compared_scopes:
  - id: warehouse-fulfilment
    label: Commandes servies depuis un entrepôt
    handling: UR porte le parcours décrit ; C-LOG choisit l’entrepôt et le transporteur pour les opérations qui lui sont demandées.
    source_refs:
    - U03
    - U04
    - U06
  - id: ship-from-store
    label: Commandes servies depuis un magasin
    handling: Socloz prend en charge le ship-from-store et l’extension de gamme dans le récit U03, car UR n’est pas décrit
      comme capable de cette complexité. Les magasins éligibles sont sollicités selon leur charge et leurs quotas ; refus
      ou absence de réponse conduisent à essayer un autre magasin.
    source_refs:
    - U03
    - U04
    - U05
  comparison: Dans le même SI historique, choisir un exécutant ne repose pas sur le même porteur ni les mêmes critères selon
    entrepôt ou magasin. L’écart de réalisation est rapporté ; la règle de canal est une variante légitime à qualifier, pas
    une anomalie démontrée.
  convergence_question: Quel mécanisme commun de sélection et de coordination faut-il partager, et quelles règles d’éligibilité
    et de charge restent propres aux magasins ou aux entrepôts ?
  limits:
  - Récit utilisateur, sans vérification actuelle des instances ou latences.
  - Ne pas étendre l’incapacité rapportée d’UR à toute la capacité Service Selection Decision.
  - Le délai de réponse et l’escalade de fin de journée comportent des réserves dans U04 ; ne pas les convertir en SLA ferme.
  - 'HS-002 porte l’accord avec C-LOG : ce cas magasin doit rester un périmètre distinct, à localiser avant de décider d’un
    rattachement ou d’un autre hotspot.'
  - Comparaison marché spécifique au ship-from-store non réalisée dans cette recherche ; appuis ERP/WMS seulement partiels.
