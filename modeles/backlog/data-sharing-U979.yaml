agreement:
  author: Laurent
  decided_at: '2026-10-12'
  validated_scope: Les quatre sous-domaines et frontières présentés CMP313 ; relation orientée et contenu métier demandé U979,
    ouverte à plusieurs niveaux.
  proposed_scope: Descriptions détaillées des échanges et des nouvelles fiches, exemples et correspondances ; aucune réalisation
    installée.
contract:
  type: shares-data
  direction: source_id → target_id
  content: 'fields.data_exchange.contents : noms anglais, description française, références au glossaire métier publié.'
  meaning: Partage d’information métier, distinct d’une décomposition, d’une dépendance générale, d’un transfert physique
    et d’une interface technique.
  levels: Tout élément métier du modèle, sans restriction aux Business Systems.
  projection: 'Enterprise Architecture uniquement : remonter chaque extrémité à son Business System par les relations hiérarchiques
    ; conserver les relations sources et ne pas créer de flux internes implicites.'
  limits:
  - PLM est une origine de réalisation citée, pas un Business System ajouté.
  - 'Les retours ne sont pas supposés : une relation orientée séparée porte chaque sens documenté.'
  - Information Catalogue historique inchangé ; contenu et liens métier portés par les relations.
  - Fréquence, protocole, système maître entreprise et flux installés restent à documenter.
market:
  comparison_id: CMP314
  sources:
  - ELM860
  - ELM862
  - ELM869
  - ELM871
  - ELM878
  - ELM885
  - ELM886
  limits:
  - Socle primaire SAP S/4HANA et Dynamics ; recouvrements fonctionnels, pas preuve Beaumanoir.
  - Les noms du contrat sont une convention FLOW ; aucune équivalence à un format de message produit.
