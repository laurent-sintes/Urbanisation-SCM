id: COMMERCE-PROCUREMENT-DEPTH-APPLICATION-U1089
date: '2026-10-15'
status: applied_to_backlog
source_refs:
- U1088
- U1089
baseline_audit: commerce-procurement-depth-audit-U1088.yaml
scope: Application ciblée de l’audit aux frontières démontrées par les parcours. Noms et descriptions détaillés restent proposés
  ; aucun état installé n’est déduit.
case_tests:
- id: procurement-delay
  situation: Le fournisseur annonce un retard et une quantité réduite après confirmation.
  results:
  - Supplier Commitment Follow-up constate la réponse et l’écart.
  - Purchasing Case Coordination instruit une issue commerciale et transmet une décision autorisée.
  - Purchase Order tient le changement d’engagement ; Master Planning réévalue les conséquences.
  decision: 'Conserver Purchasing Execution Coordination et Supplier Delivery Follow-up distincts : leurs résultats diffèrent.'
- id: omnichannel-pickup-return
  situation: Une commande web est retirée en magasin ; un article manque puis le client retourne un autre achat.
  results:
  - Digital Sales Journey Management recueille la demande.
  - Sales Order tient la commande et les promesses.
  - Store Order Preparation & Handover constate préparation et remise.
  - Store Checkout Management traite la transaction et le retour au point de vente.
  - Store Stock Operations Management tient les faits physiques.
  decision: Séparer transaction de caisse, opérations de stock et préparation de commande sans dupliquer les engagements du
    Core.
- id: wholesale-season
  situation: Une proposition de saison est préparée pour un revendeur, qui commande ensuite une sélection.
  results:
  - Wholesale Offer Preparation compose la proposition.
  - Wholesale Sales Engagement recueille la demande.
  - Sales Order tient la commande acceptée.
  decision: Conserver Wholesale Account Management distinct, faute d’autorité commune démontrée avec la vente.
- id: sourcing-event
  situation: Une consultation recueille plusieurs offres puis une source est choisie.
  results:
  - Supplier Consultation Coordination obtient les offres comparables.
  - Supplier Offer Selection choisit et motive la source dans le même événement.
  decision: Regrouper les deux capacités sous Sourcing Event Management et retirer la Business Area Source Selection.
retained_separations:
- 'Supplier Qualification et Supplier Performance Management : résultats différents et autorité commune non établie.'
- 'Purchase Agreement et Supplier Rebate & Incentive Management : cycles et portée contractuelle potentiellement distincts.'
- 'Assortment et Catalog Management : autorisation de vente et publication de l’offre distinctes.'
- 'Pricing et Promotion Management, Rebates et Sales Incentives : règles et bénéficiaires distincts.'
- 'Les cinq Business Areas de Retail Commerce : responsabilités distinctes.'
market_limits: Microsoft Dynamics et SAP S/4HANA étayent les fonctions, sans imposer le nombre de capacités FLOW ni prouver
  un déploiement Beaumanoir. La fidélité est illustrée côté SAP par Customer Checkout intégré à S/4HANA, pas par une capacité
  native générale de S/4HANA Retail.
