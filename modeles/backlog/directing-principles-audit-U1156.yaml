schema_version: 1.0.0
id: directing-principles-audit-U1156
status: proposed
date: '2026-10-23'
source_refs:
- U1156
- U1157
scope: Audit et propositions seulement ; aucune modification canonique ou frontend, aucun commit, release ou push.
basis:
  current_principles: 30
  model_sha256: f3dae9afd664ab5746bfde8115853cf48584bc79a7834d15ba8194a3fdcd18f9
  glossary_sha256: a51d29512a25ed2bb2641b27385d8a5f2076026e34610b5f31c06ce4abb2136d
  coverage: Socle courant des 30 énoncés, fiches et décisions ciblées citées, contrats de lecture et recherches. Pas une réadoption
    ou requalification exhaustive des accords historiques.
distinctions:
  principle: Orientation durable pour choisir et faire évoluer la cartographie, avec raisons, effets et limites.
  convention: 'Règle de représentation et de contrat : niveaux, cardinalités, sens des flèches, codes.'
  decision: Application d’un principe à un périmètre daté, avec compromis ou exception explicites.
  observation: Constat documenté, distinct d’un choix prospectif.
  core: Le cœur approfondi de FLOW ne définit pas tout ce qui est métier ou important pour l’entreprise.
findings:
- id: A01
  title: Accès absent au référentiel demandé
  observation: 30 énoncés existent dans model.yaml.principles ; principles ouvre Méthodologie de transformation.
  recommendation: Ajouter Principes directeurs comme entrée distincte et conserver les liens de la méthode.
- id: A02
  title: Contrat trop court
  observation: Le schéma ne porte que id, statement, source_refs et métadonnées de révision.
  recommendation: Enrichir les principes canoniques, sans deuxième catalogue concurrent.
- id: A03
  title: Natures et portées mélangées
  observation: Choix d’architecture, conventions de représentation et limites du programme se côtoient.
  recommendation: Distinguer catégories et portée ; 14 propositions de lecture, conventions détaillées reliées.
- id: A04
  title: Formulations historiques à réexaminer
  observation: FLOW-LOGISTICS reste hors développement FLOW / C-Log ; plusieurs textes utilisent purposes, Demand ou Fulfillment,
    et une ingestion par référentiel.
  recommendation: Aligner sur le modèle courant et les ingestions mutualisées avant exposition ; préserver les preuves historiques.
- id: A05
  title: Identifiants utilisés par les contrôles
  observation: validate_models.py, atlas_metamodel.py et model_depth.py activent des règles par présence de PRINCIPLE-*.
  recommendation: Préserver les identifiants ; distinguer enrichissement éditorial, changement normatif et remplacement explicite.
- id: A06
  title: Qualification des principes incomplète
  observation: Révisions, empreintes et contrôles de livraison existent ; record_decision ne capture que nodes et relations.
  recommendation: Étendre la capture aux champs des principes avant de les afficher comme adoptés. Statut et publication ne
    donnent pas accord.
- id: A07
  title: Impact large sur le réexamen
  observation: semantic_context et decision_carry incluent aujourd’hui tout le catalogue des principes.
  recommendation: Qualifier champs sémantiques et portée ; tester le réexamen ciblé sans neutraliser les changements réellement
    globaux.
- id: A08
  title: Liens et recherche à créer
  observation: Pas de cibles métier structurées ni d’index typé des principes du snapshot dans la recherche.
  recommendation: Liens de lecture réciproques dérivés de la source publiée, sans relation de parentage.
- id: A09
  title: Chronologie générale non prouvée
  observation: Les exemples documentent plusieurs évolutions, pas un passage universel de quatre à deux saisons ni de tous
    les SI 1980–1990 à une configuration universelle.
  recommendation: Présenter le choix prospectif FLOW, avec cas datés et limites ; la grille reste utile et les dimensions
    restent métier.
canonical_design:
  authority: Enrichir modeles/backlog/model.yaml.principles ; publier dans le snapshot. Pas de catalogue concurrent dans la
    méthode, un autre YAML métier ou le frontend.
  identity: Conserver PRINCIPLE-* ; DP01–DP14 sont uniquement des repères de proposition. Aucun renommage, retrait ou fusion
    implicite.
  proposed_fields:
    name_label_summary: Nom court, libellé français, résumé clair et énoncé.
    rationale: Pourquoi ce choix, bénéfice et problème traité.
    implications: Effets concrets sur les objets, frontières et relations.
    scope: Portée globale ou cibles typées explicites, conditions et responsabilité du choix.
    tradeoffs_alternatives: Compromis et alternatives écartées, avec leurs raisons.
    examples_counterexamples: Illustrations qualifiées ; une illustration ne devient pas une observation.
    references: Éditeur/auteur, titre, URL, version, consultation, passage, contenu observé, rôle dans la justification et
      limites.
    related_principles: Liens explicites ; aucun parent de capacité.
    exceptions_supersedes_review_trigger: Optionnels et structurés, sans écrasement historique.
  qualification: Les accords restent champ par champ et liés aux valeurs finales. Sources utilisateur, empreintes, réserves
    et statuts internes de revue ne sont pas exposés automatiquement.
  historical_contract: Les anciens id/statement/source_refs restent lisibles ; justification manquante signalée sans reprise
    du backlog. Nouvelle édition des principes, fiches, glossaire et preuves issue du même snapshot.
  context_contract: Définir les champs normatifs et la portée du réexamen ; une référence de source corrigée ne donne pas
    de nouvel accord. Les champs inconnus et les changements globaux réellement sémantiques restent conservateurs.
ux_proposal:
  menu: Entrée Principes directeurs près de la cartographie et du glossaire ; garder Méthodologie de transformation et Aide
    distinctes.
  index: Titre, énoncé court, catégories et filtre par périmètre. Aucune chronologie d’accords présentée comme catalogue de
    principes.
  detail:
  - Le principe
  - Pourquoi ce choix
  - Ce que cela change dans la carte
  - Exemple et contre-exemple
  - Limites et compromis
  - Périmètres concernés
  - Recherche et marché
  contextual_access: 'Dans les fiches : Principes expliquant ce périmètre. Depuis le principe : objets et relations concernés.
    Index inverse calculé depuis les liens canoniques, sans duplication.'
  search: Résultats typés Principe directeur ; saison, intercompany et grille retrouvent les entrées utiles.
  routing: Route distincte telle que design-principles ; ne pas réaffecter principles, déjà utilisé par la méthode. Liens
    directs, retour au périmètre d’origine et version sélectionnée conservés.
  accessibility: Clavier, liens et titres natifs, mobile ; les tooltips restent courts.
  public_qualification: Distinguer orientation cible, justification documentée et preuve d’application ; ne pas afficher une
    nouvelle formulation ou un énoncé historique comme adopté sans preuve. Ne pas publier les statuts internes de revue.
initial_principles:
- id: DP01
  label_fr: Des capacités durables
  status: proposed
  statement: Structurer la carte par les responsabilités et résultats métier, indépendamment des équipes, outils et configurations.
  rationale: La cible doit survivre aux changements d’organisation et d’application. Durable ne signifie ni universel ni immuable.
  implications_and_limits: Un changement de calendrier ou de prestataire ne crée pas une capacité ; une transformation réelle
    du métier peut justifier une nouvelle frontière.
  existing_principle_refs:
  - PRINCIPLE-CAPABILITY
  target_node_ids:
  - beaumanoir-target-universe
  evidence_refs:
  - LOCAL-CAPABILITY
  - OMG-BMM
- id: DP02
  label_fr: Trois domaines complémentaires dans Business Operations
  status: proposed
  statement: Au sein de Business Operations, distinguer les responsabilités de Commerce, Sourcing and Procurement et Supply
    Chain Management en conservant un ensemble métier intégré.
  rationale: La spécialisation des responsabilités clarifie leurs autorités sans fragmenter le contexte des commandes et des
    décisions.
  implications_and_limits: Commerce conserve offres, canaux et décisions commerciales ; Sourcing and Procurement conserve
    sources, négociations et accords fournisseurs. Le SCM porte le cycle complet des commandes d’achat et de vente de son
    périmètre et les décisions sur leur satisfaction. Ce cadrage est proche de la logique intégrée Microsoft et SAP ; les
    frontières des modules ne sont pas reproduites mécaniquement.
  existing_principle_refs: []
  target_node_ids:
  - system-business-operations
  - supply-chain-orchestration
  - domain-sales
  - domain-sourcing-procurement
  evidence_refs:
  - LOCAL-BOUNDARIES
  - MS-SCM
  - SAP-SCM
- id: DP14
  label_fr: Un SCM décisionnel fondé sur le cycle complet des commandes
  status: proposed
  statement: Supply Chain Management porte le cycle de vie des commandes d’achat et de vente de son périmètre afin que ses
    décisions disposent d’un contexte métier complet, cohérent et traçable.
  rationale: Les arbitrages de couverture, priorité, affectation, promesse et adaptation doivent connaître ce qui est demandé,
    proposé, confirmé, changé, réalisé et restant à satisfaire. La tenue des commandes et les décisions Supply appartiennent
    au même ensemble métier intégré.
  implications_and_limits: Relier lignes, quantités, dates, réponses, engagements, évolutions autorisées et résultats aux
    plans, ressources et règles utilisés pour décider. Les trois domaines appartiennent à Business Operations. Commerce et
    Procurement gardent leurs autorités commerciales et fournisseurs ; réalisation logistique et autorités financières restent
    explicites. L’intégration métier ne prescrit ni application, ni stockage, ni moteur de décision uniques.
  existing_principle_refs:
  - PRINCIPLE-SUPPLY-DOCUMENTS
  - PRINCIPLE-TO-PROMISE
  target_node_ids:
  - system-business-operations
  - supply-chain-orchestration
  - D04
  - D04.i
  - D04.j
  - domain-plan
  - D03
  evidence_refs:
  - LOCAL-ORDER-CONTEXT
  - MS-PO-LIFECYCLE
  - MS-SALES-LIFECYCLE
  - SAP-INTEGRATED-SCM
  - SAP-ORDER-PLANNING
- id: DP03
  label_fr: Logistics, système métier autonome
  status: proposed
  statement: Représenter Logistics comme l’ensemble cohérent de Warehousing, Transportation et Customs Management, avec leur
    pilotage opérationnel local.
  rationale: Le SCM coordonne les engagements entre acteurs ; Logistics réalise et pilote ses prestations. C-LOG est un acteur
    de réalisation, pas l’identité du système.
  implications_and_limits: L’externalisation seule ne justifie pas un Business System. Le niveau découle du métamodèle FLOW
    et de la cohérence du périmètre ; il ne désigne ni application ni entreprise.
  existing_principle_refs:
  - PRINCIPLE-FLOW-LOGISTICS
  - PRINCIPLE-BUSINESS-SYSTEM
  target_node_ids:
  - domain-logistics-execution
  - domain-warehousing
  - domain-transportation
  - domain-customs-management
  evidence_refs:
  - LOCAL-LOGISTICS
  - MS-SCM
  - SAP-SCM
- id: DP04
  label_fr: Des contextes configurables
  status: proposed
  statement: Traiter saisons, capsules et situations intercompany comme des contextes qualifiant données, plans, règles et
    parcours, sans en faire automatiquement des branches de capacités.
  rationale: Les rythmes, marchés, produits et sociétés varient ; leurs combinaisons doivent pouvoir évoluer sans restructurer
    la carte.
  implications_and_limits: 'Ne pas réduire intercompany à un drapeau : engagements réciproques, sociétés, prix, propriété,
    transit et factures restent explicites. Tous les plans ne sont pas de la master data ; une capsule n’est pas obligatoirement
    une sous-saison.'
  existing_principle_refs: []
  target_node_ids:
  - domain-product-portfolio-collection
  - subdomain-collection-planning
  - domain-plan
  - subdomain-policies
  - D04
  evidence_refs:
  - LOCAL-CYCLES
  - LOCAL-INTERCOMPANY
  - RESEARCH-CYCLES
  - MS-PLANS
  - SAP-FASHION
- id: DP05
  label_fr: La variante ne dépend pas de la grille
  status: proposed
  statement: Identifier les Product Variants par leurs caractéristiques métier et combinaisons admissibles ; utiliser la grille
    comme représentation et moyen de gestion.
  rationale: TER058 définit déjà Product Variant. Une matrice taille–couleur est pratique sans constituer à elle seule l’identité
    du produit ni les mêmes axes pour toutes les marchandises.
  implications_and_limits: La grille reste utile. Taille et couleur restent métier ; les combinaisons possibles ne sont pas
    toutes nécessairement admissibles. Variante, segmentation de stock/demande, assortiment et conditionnement sont distincts.
  existing_principle_refs: []
  target_node_ids:
  - D08
  - D04.i
  - D04.j
  - D01
  evidence_refs:
  - LOCAL-VARIANT
  - MS-VARIANTS
  - SAP-VARIANTS
  - SAP-FASHION
- id: DP06
  label_fr: L’intention et l’engagement avant le document
  status: proposed
  statement: Définir responsabilités et familles de commandes par l’intention, les parties et les engagements ; distinguer
    objet, document et fait.
  rationale: Un écran, un message ou une chaîne documentaire ne suffit pas à définir une capacité. Les documents peuvent porter
    des preuves et obligations propres.
  implications_and_limits: Une adaptation du parcours documentaire ne supprime pas les obligations contractuelles ou comptables.
    Billing reste un savoir-faire durable ; un document métier peut être un enregistrement structuré sans PDF.
  existing_principle_refs:
  - PRINCIPLE-SUPPLY-DOCUMENTS
  - PRINCIPLE-MANAGEMENT-FACT-DOCUMENT
  target_node_ids:
  - D04
  - subdomain-service-orders
  - process-ledger
  evidence_refs:
  - LOCAL-DOCUMENTS
  - LOCAL-INTERCOMPANY
  - OMG-BMM
- id: DP07
  label_fr: Des responsabilités uniques, des parcours transversaux
  status: proposed
  statement: Conserver un parent métier explicite pour une capacité ; décrire ses mobilisations dans les scénarios, Cases
    et processus sans créer de nouvelles appartenances.
  rationale: Une même responsabilité sert plusieurs contextes ; la dupliquer par canal ou scénario rend l’autorité ambiguë.
  implications_and_limits: Distinguer hiérarchie, besoin, partage et mobilisation. Un parcours ne constitue ni une séquence
    universelle ni une réalisation installée. Les cardinalités détaillées restent des conventions.
  existing_principle_refs:
  - PRINCIPLE-DOMAIN-INTERACTIONS
  - PRINCIPLE-BUSINESS-SCENARIOS
  - PRINCIPLE-CASE-SUPPLY-ORDERS
  target_node_ids:
  - subdomain-process-management
  - D04
  evidence_refs:
  - LOCAL-HIERARCHY
  - OMG-BMM
- id: DP08
  label_fr: Des décisions et effets métier distincts
  status: proposed
  statement: Distinguer calcul, choix autorisé, promesse, confirmation, réservation et réalisation physique.
  rationale: Une solution réalisable n’est pas encore acceptée ; une affectation ne bloque pas seule le stock ; un nouveau
    plan ne réécrit pas les engagements.
  implications_and_limits: Tracer décision, versions, règles et conditions ; les commandes conservent leurs engagements et
    les exécutants leurs opérations. Aucun ordre universel imposé.
  existing_principle_refs:
  - PRINCIPLE-TO-PROMISE
  - PRINCIPLE-RESERVATION-CONCURRENCY
  - PRINCIPLE-INVENTORY-SCENARIO-APPLICATION
  - PRINCIPLE-ORDER-AGREEMENT
  target_node_ids:
  - domain-plan
  - D03
  - D04
  - D02.e
  - D02.c
  - D06
  evidence_refs:
  - LOCAL-COMMITMENTS
  - LOCAL-CYCLES
- id: DP09
  label_fr: Une autorité explicite pour chaque information
  status: proposed
  statement: Distinguer source de vérité d’entreprise, source locale, données reçues et résultats produits, avec provenance
    et validité connues.
  rationale: L’intégration ne transfère pas automatiquement l’autorité. Une référence locale peut être tenue et qualifiée
    activement.
  implications_and_limits: Placer les échanges chez les producteurs et destinataires métier. Réexaminer la formule historique
    une ingestion par référentiel avec l’ingestion mutualisée actuelle ; ne pas réduire la projection à une copie passive.
  existing_principle_refs:
  - PRINCIPLE-REFERENCE-PROJECTIONS
  - PRINCIPLE-RELATION-DIRECTION
  target_node_ids:
  - business-references
  - D08
  - plans-ingestion
  evidence_refs:
  - LOCAL-REFERENCES
  - MS-PRODUCT
  - SAP-FASHION
- id: DP10
  label_fr: Des faits traçables pour reconstruire et analyser
  status: proposed
  statement: Conserver les faits reconnus, datés et justifiés dans les registres métier responsables ; distinguer faits de
    stock et traces de processus.
  rationale: Les états à une date, explications de décisions et analyses doivent être reliés aux faits disponibles et à leur
    contexte.
  implications_and_limits: Inventory Management et Process Ledger gardent leurs mandats distincts. Process Mining exploite
    les traces. Ce choix ne prescrit ni event sourcing universel, ni stockage commun, ni reconstruction parfaite au-delà de
    la couverture connue.
  existing_principle_refs:
  - PRINCIPLE-MANAGEMENT-FACT-DOCUMENT
  - PRINCIPLE-CAPABILITY-NATURE
  target_node_ids:
  - D01
  - process-ledger
  - process-mining
  - BHV082
  evidence_refs:
  - LOCAL-LEDGERS
- id: DP11
  label_fr: Des arbitrages explicites sur le parcours complet
  status: proposed
  statement: Comparer les options selon service, coût, délais, stock et valeur récupérée, sous contraintes et délégations
    explicites.
  rationale: Une économie locale peut déplacer les coûts ou dégrader une promesse ailleurs. Le résultat recherché est multidimensionnel.
  implications_and_limits: Distinguer simulation, décision et résultat réel. Aucun optimum ou poids universel ; les chiffres
    fictifs ne deviennent pas des objectifs ou gains Beaumanoir.
  existing_principle_refs:
  - PRINCIPLE-SUPPLY-ASSIGNMENT-VALUE
  target_node_ids:
  - supply-chain-orchestration
  - D03.o
  - D03.k
  evidence_refs:
  - LOCAL-PILOTAGE
- id: DP12
  label_fr: Cible, observation et réalisation prouvée
  status: proposed
  statement: Distinguer observation métier, choix prospectif, comparaison de marché et preuve de réalisation installée.
  rationale: Une cartographie exprime une architecture cible ; une offre éditeur ou une illustration n’a pas la même valeur
    de preuve qu’un fonctionnement observé.
  implications_and_limits: Conserver les différences et limites des sources. Une norme de description ne prescrit pas la taxonomie
    FLOW ; les produits Microsoft et SAP ne déterminent pas ses domaines.
  existing_principle_refs:
  - PRINCIPLE-ATLAS-BUSINESS-SCOPE
  - PRINCIPLE-TARGET-UNIVERSE
  target_node_ids:
  - beaumanoir-target-universe
  evidence_refs:
  - ISO-AD
  - MS-SCM
  - SAP-SCM
- id: DP13
  label_fr: Une profondeur proportionnée au besoin
  status: proposed
  statement: Déclarer et justifier la profondeur du cœur FLOW et des périmètres de contexte sans inventer de capacités pour
    compléter l’arbre.
  rationale: Une partie moins étudiée n’est pas un métier absent ; le cœur du programme n’est pas toute l’entreprise.
  implications_and_limits: Conserver les profondeurs déclarées, susceptibles d’évolution sur étude autorisée. Externalisé
    ou périphérique ne signifie pas non métier ou inutile.
  existing_principle_refs:
  - PRINCIPLE-SUPPLY-FIRST
  - PRINCIPLE-ORCHESTRATION-DETAIL
  target_node_ids:
  - supply-chain-orchestration
  - domain-sales
  - domain-sourcing-procurement
  - domain-logistics-execution
  evidence_refs:
  - LOCAL-DEPTH
