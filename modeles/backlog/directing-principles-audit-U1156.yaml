implementation_order:
- phase: 1
  title: Source unique et qualification
  work:
  - Réexaminer les énoncés historiques et préserver les identifiants utilisés par les contrôles.
  - Schéma et validation rétrocompatibles ; cibles et références.
  - Capture d’accords sur les principes et contrôle des impacts sémantiques.
- phase: 2
  title: Lecture Atlas et sept priorités
  work:
  - Entrée, index, fiche, recherche et liens contextuels.
  - 'DP01–DP06 et DP14 : capacités, domaines intégrés de Business Operations, cycle complet des commandes pour les décisions
    SCM, Logistics, contextes, variantes/grilles et documents.'
  - Préserver méthodologie, aide et sélection historique.
- phase: 3
  title: Compléter et publier
  work:
  - DP07–DP13 à partir des preuves citées.
  - Relier les conventions détaillées sans doubler les catalogues.
  - Capturer les accords pertinents ; release et déploiement seulement sur demande.
acceptance_checks:
- Anciens et nouveaux contrats ; identités et cibles résolues.
- Contraintes activées par PRINCIPLE-* préservées.
- Accords limités aux champs approuvés ; remplacement explicite et historique intègre.
- Réexamen ciblé d’une justification locale, global d’un principe global effectivement modifié.
- Même publication pour principes, fiches, glossaire et preuves ; aucun repli backlog.
- Recherche saison/intercompany/grille, liens réciproques, mobile et clavier.
- Aucune double autorité méthode/modèle/frontend.
verification:
  state: passed
  scope: Audit documentaire ; pas de build ni de tests métier nécessaires. Références, identités et empreintes à contrôler.
  checks:
  - 30 énoncés inventoriés ; 14 propositions, dont le cadrage et le principe ajoutés U1157.
  - Références locales existantes, sources et limites explicites.
  - Modèle, glossaire et frontend inchangés par l’audit.
  clarification: Correction et ajout dans la proposition uniquement ; modèle et glossaire inchangés.
clarification_U1157:
  source_ref: U1157
  correction: Commerce, Sourcing and Procurement et SCM sont trois domaines complémentaires du même système Business Operations.
    Le SCM porte le cycle complet des commandes d’achat et de vente pour donner à ses décisions un contexte métier complet,
    cohérent et traçable.
  market_position: Proximité de logique intégrée avec Microsoft et SAP ; aucune identité mécanique entre leurs modules et
    les domaines FLOW.
