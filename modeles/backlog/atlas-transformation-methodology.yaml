- id: explore
  title: Explorer et concevoir
  intro: 'Question : quel problème voulons-nous résoudre et quelles réponses peuvent améliorer les résultats ? Confronter
    usages réels, carte métier, organisation, informations et faisabilité dès les premières investigations.'
  sections:
  - title: Cartographier pour éclairer une décision
    text: La carte des [domaines](method:MOD008) et des [capacités](method:MOD015) situe les responsabilités et les savoir-faire
      concernés. Les [scénarios](method:MOD027) et [flux de valeur](method:MOD029) montrent comment plusieurs capacités contribuent
      à un résultat. Relier ces vues aux personnes, informations et solutions concernées, avec la profondeur nécessaire à
      la question.
    detail: La cartographie fait partie de l’architecture métier. Elle ne prétend pas représenter à elle seule toute la transformation.
      Une capacité durable n’est ni une fonctionnalité de produit ni une équipe.
  - title: Mettre la démarche produit au travail dès le début
    text: La [démarche produit](method:MOD034) part des utilisateurs, de leurs problèmes et des résultats attendus. Observer
      les pratiques, tester des réponses et mesurer leurs effets avec un responsable produit et les experts concernés. Les
      apprentissages continuent pendant la réalisation.
    example: 'Pour la ressaisie : vérifier qui saisit, pourquoi, dans quelles exceptions et avec quel impact avant de décider
      qu’une nouvelle fonction est nécessaire.'
  - title: Utiliser DDD à la bonne profondeur
    text: Le [Domain-Driven Design ou DDD](method:MOD033) aide tôt à partager le langage et à comprendre les règles du domaine
      avec les experts métier. Sa conception stratégique délimite les modèles logiciels et leurs coopérations ; sa conception
      tactique intervient lorsque le logiciel exige ce niveau de détail.
    detail: Un [contexte délimité](method:MOD035) définit où un modèle et son langage sont cohérents. Domaine FLOW, capacité,
      contexte logiciel, produit, équipe et service déployé ne se correspondent pas automatiquement.
  - title: Décrire une cible avec plusieurs vues
    text: Pour chaque option, préciser le résultat visé, les pratiques et responsabilités, les capacités mobilisées, les informations
      nécessaires, les solutions possibles et leurs exigences techniques. Comparer à l’existant documenté ; distinguer faits,
      hypothèses, écarts et transitions nécessaires.
    example: Une cible utile précise qui cesse de ressaisir, qui corrige une erreur, quelle donnée fait autorité et comment
      le service continue pendant la transition.
    detail: 'Preuves utiles : carte ciblée, parcours observé, options comparées, exigences et essais. Contributeurs : métier
      et utilisateurs, produit, organisation, données, technologie et architecture d’entreprise. Appuis : [BIZBOK](guide:references#method-section-0),
      DDD, SVPG et [TOGAF](guide:references#method-section-1), détaillés dans Références. Distinguer le [Core métier et le
      contexte opérationnel](method:MOD041) sans en déduire automatiquement le découpage logiciel.'
- id: decisions
  title: Préparer et prendre les décisions
  intro: 'Question : quel engagement est maintenant justifié, par qui doit-il être pris et avec quelles conditions ? Présenter
    les avancées souvent pour que les décideurs comprennent progressivement le problème et les compromis.'
  sections:
  - title: S’appuyer sur la gouvernance existante
    text: 'Le [Transformation Leader](method:MOD037) désigne le rôle de conduite de la transformation porté par la direction
      de programme. Il coordonne l’équipe, les dépendances, les résultats et les décisions. Le [Transformation Board](method:MOD038)
      désigne le comité de pilotage de transformation mensuel, avec les sponsors concernés : direction générale, direction
      des systèmes d’information, direction métier et direction technologique. Le [mandat de décision](method:MOD042) précise
      les limites de chaque responsabilité et les conditions d’escalade.'
    detail: Ces noms sont une convention de présentation FLOW. Ils ne créent ni instance, ni nomination, ni pouvoir supplémentaire.
      Les décisions locales suivent le mandat effectivement donné ; lorsqu’il est incertain, faire confirmer le décideur compétent
      avant de prendre un engagement, tout en poursuivant les investigations réversibles.
  - title: Préparer les trois prochains comités
    text: 'Tenir une feuille de route glissante : décisions proches et suffisamment instruites ; décisions suivantes dont
      les preuves sont à préparer ; sujets probables et dépendances à anticiper. Pour chaque sujet, préciser la date utile,
      le décideur attendu, les options, les preuves manquantes et le coût d’un report.'
    detail: Ces trois horizons sont une pratique proposée, pas trois passages obligatoires d’un dossier. Les échanges préparatoires
      entre équipe et sponsors alimentent le comité ; ils ne préjugent pas de l’accord. Le comité examine aussi les bénéfices,
      les risques et les réorientations.
  - title: Faire mûrir le choix avant sa formalisation
    text: Présenter le problème, les options et leurs conséquences en termes de valeur, de pratiques, de coût, de délai et
      de risque. Adapter le niveau de détail au décideur. Une [fiche de décision d’architecture ou ADR](method:MOD036) peut
      être ouverte à l’état proposé ; elle conserve ensuite le choix, ses motifs, ses preuves et ses conséquences.
    example: 'Pour la ressaisie : expliquer le gain attendu et les exceptions restantes ; montrer les résultats de l’essai,
      les responsabilités futures et les coûts de transition. Le métier participe au choix sans devoir valider chaque détail
      technique.'
    detail: 'Preuves utiles : comparaison d’options, résultat d’essai, exigences, décision attendue et conditions de réexamen.
      Les ADR concernent l’architecture ; elles ne remplacent pas tous les arbitrages du programme.'
  - title: Conserver une cohérence durable
    text: L’[architecture d’entreprise](method:MOD032) relie les décisions locales à la stratégie et aux autres transformations.
      Elle analyse leurs conséquences sur métier, organisation, informations et technologie et maintient une vision cohérente
      au-delà du programme.
    detail: 'C’est une fonction et une pratique contribuant à la gouvernance, pas seulement un comité ou une architecture
      logicielle. Elle éclaire les décisions sans ajouter automatiquement un niveau de validation. Appuis : [TOGAF](guide:references#method-section-1),
      PMI et ADR ; choix d’organisation adaptés à FLOW.'
  visual:
    kind: governance
    title: Collaborer en continu, décider au bon niveau
    description: L’équipe, la direction de programme et les sponsors échangent directement pour préparer les choix. Le comité
      mensuel prend les décisions structurantes relevant de son autorité. L’architecture d’entreprise contribue à la cohérence,
      sans instance de validation supplémentaire.
    center: 'Architecture d’entreprise : cohérence pendant et après la transformation'
    items:
    - Équipe pluridisciplinaire
    - Transformation Leader
    - Transformation Board
