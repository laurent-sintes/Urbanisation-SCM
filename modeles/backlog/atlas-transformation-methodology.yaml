- id: transform
  title: Organiser et réaliser les changements
  intro: 'Question : quel changement utile peut-on engager et rendre opérable avec les moyens disponibles ? Construire une
    trajectoire réaliste et la réviser à mesure que les preuves et les priorités évoluent.'
  sections:
  - title: Valider les fondations progressivement
    text: La technologie intervient dès le cadrage, en parallèle de la démarche produit. Identifier contraintes, possibilités,
      sécurité, intégration, qualité de service et exploitation. Éprouver tôt les options qui portent un risque important,
      puis vérifier les conditions de mise en service pour chaque incrément.
    detail: 'Trois repères utiles : contraintes et exigences connues ; options significatives éprouvées ; aptitude au service
      vérifiée. Ce sont des niveaux de preuve adaptés au risque, pas des étapes universelles. Un prototype concluant ne démontre
      pas à lui seul la disponibilité, la sécurité ou l’exploitabilité en production.'
  - title: Rendre les transitions soutenables
    text: Comparer les trajectoires avec la capacité réelle des équipes et du métier, les autres initiatives, les dépendances
      et les coûts de transition et de fonctionnement. Prévoir migration, coexistence, bascule et retour en arrière lorsque
      nécessaires, avec des critères explicites.
    example: 'Pour la ressaisie : essayer sur un périmètre limité, organiser la correction des écarts, préserver la continuité
      du service puis étendre si les résultats le justifient.'
  - title: Préparer les personnes et les pratiques
    text: Identifier les populations touchées, les responsabilités qui changent, les compétences nécessaires et la charge
      d’apprentissage. Faire participer utilisateurs et managers, essayer les nouvelles pratiques et lever les freins. La
      conduite du changement commence pendant le cadrage.
    detail: 'Preuves utiles : trajectoire, disponibilité des équipes, essai métier, exigences de service vérifiées et dispositif
      d’accompagnement. Contributeurs : équipe pluridisciplinaire, managers, exploitation, sponsors et responsables des périmètres
      concernés. Appuis : [TOGAF](guide:references#method-section-1), Microsoft Well-Architected, PMI et Prosci.'
- id: sustain
  title: Mesurer et faire durer
  intro: 'Question : les changements sont-ils utilisés, produisent-ils les résultats attendus et peuvent-ils durer ? Livraison,
    adoption et bénéfice sont trois observations distinctes.'
  sections:
  - title: Attribuer et mesurer les bénéfices
    text: Pour chaque bénéfice attendu, identifier un responsable, une situation initiale, un indicateur, une cible, une source
      de données et une échéance de mesure. Présenter les résultats et leurs limites au comité pour décider de poursuivre,
      ajuster ou arrêter les actions concernées.
    example: 'Pour la ressaisie : mesurer le temps total de traitement et les erreurs avant et après l’essai, vérifier l’usage
      réel et contrôler que le travail n’a pas été transféré ailleurs. Les valeurs cibles sont à établir sur des observations,
      pas à inventer.'
  - title: Organiser la continuité après le programme
    text: Préciser qui reste responsable du produit ou service, des pratiques métier, de l’exploitation, des bénéfices et
      de la cohérence d’architecture. Préparer l’accompagnement, le support et la stabilisation ; convenir des conditions
      de transfert avec les équipes qui reprennent ces responsabilités.
    detail: 'Preuves utiles : mesures, retours utilisateurs, problèmes résiduels, responsabilités acceptées et capacité de
      fonctionnement durable. Appuis : management de programme PMI, approche produit SVPG et changement individuel Prosci.'
  - title: Réexaminer les hypothèses
    text: Un résultat insuffisant conduit à revisiter les usages, les pratiques, les données, la solution ou la priorité stratégique.
      Conserver les décisions et leurs conditions de réexamen permet d’ajuster sans perdre la mémoire des raisons du choix.
- id: metamodel
  title: Métamodèle FLOW
  intro: Le métamodèle décrit les objets, relations et règles effectivement structurés dans FLOW. Le glossaire méthodologique
    explique aussi des notions utiles à la transformation, sans en faire automatiquement des objets du modèle.
  sections:
  - title: Une capacité, un résultat identifiable
    text: |-
      Une [capacité](method:MOD015) est une aptitude durable de l’entreprise à produire un résultat métier identifiable, indépendamment de son organisation et de ses outils. Elle exprime ce que l’entreprise sait faire pour agir, décider, tenir des engagements ou des actifs métier, et produire ou exploiter une connaissance.

      Son périmètre permet d’identifier sa contribution propre dans des [scénarios](method:MOD027) métier : les informations et conditions qu’elle mobilise, le résultat qu’elle produit et ses limites de responsabilité. Ses [comportements](method:MOD006) précisent les manières significatives dont elle s’exerce.
  - title: Des relations explicites
    text: Le modèle de responsabilité se lit Business System → Domain → Subdomain → Business Area. Le modèle de capacité précise
      ensuite les [capacités](method:MOD015) et leurs [comportements](method:MOD006). Une Business Area exprime un résultat
      et une frontière de responsabilité ; elle ne représente ni une équipe ni une application.
    detail: Une capacité possède un parent unique, obligatoirement une Business Area. Une Business Area peut porter une seule
      capacité lorsque son sens le justifie. Une Business Area peut aussi présenter des références et porter la cohérence
      de leurs vues locales. Ces objets restent documentaires et ne deviennent pas des capacités ni leurs parents. Les scénarios
      mobilisent plusieurs périmètres sans former une autre hiérarchie.
  - title: Les comportements
    text: Les [comportements](method:MOD006) décrivent des manières métier significatives d’exercer une [capacité](method:MOD015).
      Une [capacité](method:MOD015) possède zéro ou au moins deux [comportements](method:MOD006) différenciants, avec une
      justification de cette décomposition.
    example: Une stratégie ou une variante qui change le résultat métier peut être utile à décrire. Un bouton, un paramètre
      ou une étape technique ne suffit pas.
  - title: Deux sortes d’étapes
    text: Dans le flux de valeur de traitement d’une commande, une étape de valeur décrit une progression pour le client,
      par exemple obtenir un engagement de livraison. Dans un scénario de stock partiel, une étape de mobilisation décrit
      comment les capacités évaluent les options puis sélectionnent une promesse. Les deux vues se relient sans se confondre.
- id: method
  title: Conventions de cartographie
  intro: Partir du service concret rendu, préciser les frontières, puis éprouver les [capacités](method:MOD015) sur des [scénarios](method:MOD027)
    indépendants de l’organisation et des outils.
  sections:
  - title: Définir le résultat et la frontière
    text: Partir d’un résultat métier identifiable, préciser le bénéficiaire et les limites de responsabilité. Une [capacité](method:MOD015)
      est durable et indépendante des outils et de l’organisation.
  - title: Structurer par flux de valeur
    text: Un flux décrit la valeur pour un bénéficiaire et ses étapes. Chaque [scénario](method:MOD027) possède une identité
      unique et peut concerner plusieurs flux. Événement, objet métier et type de situation sont des filtres transverses.
  - title: Décrire le scénario
    text: Préciser situation, déclencheur, conditions et résultat recherché. Distinguer illustration et situation documentée.
      Les exemples courts peuvent rester dans les fiches sans devenir des [scénarios](method:MOD027).
  - title: Explorer les parcours
    text: Un [scénario](method:MOD027) peut être étudié selon plusieurs réponses. Chaque parcours explicite les étapes, contributions
      des [capacités](method:MOD015), dépendances et résultats. [Étapes de valeur](method:MOD030) et [étapes de mobilisation](method:MOD031)
      ne se confondent pas.
  - title: Vérifier la couverture
    text: Vérifier les résultats nécessaires, les [capacités](method:MOD015) responsables, les informations et conditions,
      puis leur utilisation. Distinguer trou métier, documentation insuffisante, lien absent et responsabilité externe. Une
      [capacité](method:MOD015) citée ne prouve pas la couverture exhaustive.
  - title: Distinguer décision et mise en effet
    text: Une décision détermine une réponse. La capacité responsable la rend effective. Mettre à jour une protection, utiliser
      cette protection pour choisir une réponse et déplacer physiquement un article sont trois responsabilités distinctes.
  - title: Qualifier la couverture
    text: Préciser ce qui est couvert, par quoi, dans quel périmètre et avec quelles limites. Un parcours vérifie quelles
      capacités répondent au scénario. La réalisation vérifie quels moyens permettent d’exercer une capacité. Une couverture
      documentée ne prouve pas une réalisation installée.
  - title: Termes à ne pas confondre
    text: 'Une [capacité](method:MOD015) décrit une aptitude métier ; une [fonctionnalité](method:MOD018) décrit une possibilité
      offerte par un produit. « Fonction » doit être qualifié avant emploi : ce mot ne désigne pas un niveau supplémentaire
      du modèle.'
  - title: Regrouper par responsabilité
    text: Rattacher chaque [capacité](method:MOD015) à exactement une [Business Area](method:MOD039) de son [sous-domaine](method:MOD013).
      Définir ce périmètre par le service rendu, le bénéficiaire et une frontière utile. Une Business Area peut porter une
      seule capacité. Les types, filtres et codes de lecture ne changent ni les identités ni les parents.
    example: '[Order Promising](model:ba-order-promising) regroupe [ATP](model:D03.i), [CTP](model:D03.j) et [PTP](model:D03.k)
      dans [Availability](model:D03). Dans [Policies](model:subdomain-policies), les capacités appartiennent à [Protection
      Policies](model:ba-protection-policies) ou à [Service Provider Controls](model:ba-service-provider-controls). Le bandeau
      de la carte rend chaque Business Area visible et ouvre sa fiche.'
  - title: Justifier une capacité, au-delà d’un accès aux données
    text: Une [capacité](method:MOD015) doit produire un résultat métier identifiable, avec une responsabilité propre. Un
      objet de données, une opération technique ou une fonctionnalité d’écran ne suffisent pas. Pour [Visibility](method:MOD040),
      identifier la connaissance réellement construite, les informations rapprochées et les règles métier appliquées.
    example: Consulter un tarif reçu relève du référentiel. Rapprocher les stocks, les réceptions attendues et les engagements
      sans double compte établit une situation utile aux décisions.
    detail: Examiner aussi les doublons, les étapes internes d’une autre capacité et les variantes qui pourraient être des
      comportements. Une dépendance ou un scénario existant ne prouve pas à lui seul qu’une capacité doit subsister. Avant
      un retrait, conserver les responsabilités utiles et corriger leurs liens.
  - title: Choisir un verbe qui précise le résultat
    text: Nommer l’objet, le résultat et l’effet attendu. Vérifier constate ; autoriser rend une action admissible ; exécuter
      réalise. Gérer ou valider exigent une précision. Les verbes métier gardent leurs distinctions dans les notions de [protection](glossary:TER019),
      [allocation](glossary:TER018), [réservation](glossary:TER016), [affectation](glossary:TER017) et [promesse](glossary:TER014).
    detail: |-
      Définir : Établir la signification, les règles ou les caractéristiques d’un objet ou d’une politique. Distinguer définition et application effective.

      Tenir : Maintenir dans la durée un état métier cohérent et à jour, avec ses évolutions, obligations et justifications. La réserve historique U35 concernait l’usage trop général du verbe. La définition courante précise l’objet et le résultat attendus sans en faire un préfixe obligatoire.

      Déterminer : Établir un résultat à partir de faits et de règles. Exemple : déterminer une disponibilité ; le calcul peut être un moyen.

      Calculer : Produire une valeur par des opérations quantitatives définies. L’employer si le résultat quantitatif est bien le besoin métier ; ne pas imposer un algorithme.

      Vérifier : Établir si des conditions sont respectées et produire un constat. Un contrôle favorable n’autorise pas nécessairement l’action.

      Autoriser : Rendre une action admissible dans un périmètre et sous des conditions définis. Ne signifie pas exécuter l’action ni réserver sa ressource.

      Enregistrer : Prendre en compte durablement un fait ou une décision dans la connaissance métier. Décrire ce qui devient connu et ses effets ; ne pas réduire le résultat à une écriture technique.

      Demander : Exprimer un résultat souhaité à un destinataire, avec les conditions pertinentes. Distinguer demande, acceptation et engagement de fourniture.

      Confirmer : Établir ou attester un résultat, un fait ou un engagement, en précisant la portée et l’effet de cette confirmation. Compléter obligatoirement le sens : confirmer une promesse et accuser réception ne sont pas équivalents.

      Prioriser : Établir un ordre relatif de traitement ou de satisfaction entre des demandes. Ne réaffecte pas nécessairement les ressources à lui seul.

      Arbitrer : Choisir entre des possibilités ou demandes concurrentes selon des règles et contraintes. Exprimer ce qui est décidé ; ne nomme pas un comité ou un outil.

      Réviser : Réexaminer puis modifier, si nécessaire, une règle, décision ou engagement existant. Une simple republication technique ne démontre pas une révision métier.

      Libérer : Selon l’objet, lever un droit ou une restriction sur une ressource, ou autoriser un ordre à entrer en exécution. Préciser « libérer une quantité réservée » ; « libérer pour livraison » peut vouloir dire autoriser.

      Consommer : Imputer une utilisation sur un droit, une enveloppe, une quantité ou un engagement. Préciser l’objet : consommation d’allocation et sortie physique ne sont pas le même fait.

      Annuler : Retirer l’effet encore applicable d’une demande, décision ou engagement identifié, selon ses règles. Ne signifie pas effacer l’historique ni annuler automatiquement les autres objets liés.

      Rapprocher : Comparer des faits ou représentations pour établir leur concordance ou leurs écarts. Constater un écart ne signifie pas autoriser sa correction.

      Exécuter : Accomplir la prestation ou l’action métier demandée. Préciser le résultat ; distinguer l’intention, l’exécution et l’enregistrement de son constat.

      Gérer : Couvrir un ensemble d’aptitudes ou d’actions relatives à un objet. Acceptable si le périmètre est défini ; ne suffit pas seul à préciser les effets.

      Valider : Terme courant dont le sens doit être explicité avant emploi canonique. Choisir vérifier, autoriser, accepter ou confirmer selon l’effet recherché ; ces verbes ne sont pas interchangeables.
- id: references
  title: Références
  intro: Références consultées le 28 septembre 2026. Elles éclairent des aspects complémentaires ; leur combinaison est une
    adaptation FLOW, pas une méthode normative unique. Les limites de consultation sont explicites.
  sections:
  - title: BIZBOK — architecture métier
    text: Cartes des capacités, flux de valeur, organisation et informations. La hiérarchie FLOW reste une convention locale
      ; la présentation publique des domaines a été consultée, pas l’intégralité du guide.
    url: https://learning.businessarchitectureguild.org/products/domain-2-core-mapping-knowledge
  - title: TOGAF — architecture d’entreprise
    text: Cohérence, transitions, gouvernance et entretien de l’architecture. ArchiMate fournit un langage complémentaire
      de représentation. FLOW adapte ces apports sans revendiquer une conformité complète.
    url: https://help.opengroup.org/hc/en-us/articles/32115987894930-How-the-ArchiMate-Language-and-the-TOGAF-Standard-Complement-Each-Other
  - title: DDD — Eric Evans
    text: Langage partagé, modèles délimités et conception logicielle. Aucun découpage automatique du logiciel à partir des
      capacités.
    url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
  - title: Démarche produit — SVPG
    text: Problèmes, résultats, équipes et responsabilité durable du produit. Ce n’est pas une phase qui suit le cadrage technique.
    url: https://www.svpg.com/the-product-operating-model-an-introduction/
  - title: Discovery et delivery — SVPG
    text: Exploration des réponses et réalisation se nourrissent continuellement. FLOW étend le cadrage aux transformations
      de pratiques et d’organisation.
    url: https://www.svpg.com/discovery-vs-delivery/
  - title: Principes agiles
    text: Collaboration, retours fréquents et adaptation. Leur application au cadrage est une adaptation FLOW ; aucun cadre
      Scrum imposé.
    url: https://agilemanifesto.org/iso/fr/principles.html
  - title: ADR — Michael Nygard
    text: Décisions d’architecture courtes et contextualisées. Les arbitrages de programme conservent leurs propres objets
      et décideurs.
    url: https://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions
  - title: Fondations — Microsoft Well-Architected
    text: Collaboration entre architecture, équipes et plateformes, essais et exigences de service. Les trois repères de preuve
      proposés par FLOW ne prescrivent aucun choix Azure.
    url: https://learn.microsoft.com/en-us/azure/well-architected/architect-role/collaboration
  - title: Management de programme — PMI
    text: 'Stratégie, gouvernance, bénéfices et transfert vers les opérations. Appui : contenu de l’examen PgMP de mars 2024,
      pas audit du standard complet. Leader et Board sont des intitulés FLOW.'
    url: https://www.pmi.org/-/media/pmi/documents/public/pdf/certifications/pgmp-exam-content-outline.pdf?rev=67166f23d2794860865edbaeff922a59
  - title: Conduite du changement — Prosci ADKAR
    text: Compréhension, engagement, connaissances, capacité et maintien du changement individuel. Cet appui ne vaut pas adoption
      de toute la méthodologie Prosci.
    url: https://www.prosci.com/methodology/adkar
  - title: BPMN — OMG
    text: Notation des processus lorsque le détail des enchaînements est utile. Les schémas pédagogiques de ce guide ne sont
      pas des diagrammes BPMN.
    url: https://www.omg.org/spec/BPMN/2.0.2/About-BPMN
note: 'Édition préparée après l’audit UX du 27 septembre 2026 : accueil orienté lecture, liens vers les notions publiées et
  séparation des notes de maintenance. Définitions et preuves historiques préservées.'
