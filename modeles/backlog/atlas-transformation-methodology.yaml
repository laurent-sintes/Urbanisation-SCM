  - id: MOD040
    canonical_fields:
    - name
    - label_fr
    - definition
    - short_description
    role: Distinguer une connaissance métier construite d’un accès aux données.
    notes:
    - 'Justifier une [capacité](method:MOD015) par la connaissance métier produite : rapprochement de faits, consolidation
      sans double compte, interprétation des états, qualification de validité ou traitement des incohérences.'
    - Une consultation, une recherche, un affichage, une copie ou une transformation purement technique ne justifient pas
      une capacité Visibility autonome. Une règle métier simple peut suffire si elle établit un résultat distinct ; aucune
      complexité minimale artificielle.
    - Visibility établit ce qui est connu, estimé ou incertain. Une [Evaluation](method:MOD021) apprécie des possibilités
      et une [Decision](method:MOD001) choisit une réponse. L’acquisition de faits peut contribuer à Visibility sans imposer
      un nouveau découpage technique.
    - Convention de nommage et de périmètre FLOW, rattachée à la nature Knowledge lorsqu’elle est pertinente ; ni nouveau
      type, ni niveau hiérarchique, ni prescription d’outil.
    - Avant un retrait, conserver les données, leurs sources, les responsabilités utiles et les dépendances des scénarios.
      Ne pas créer automatiquement une capacité générique de remplacement.
    examples:
    - '[Inventory Visibility](model:D01.c) rapproche stock, apports attendus et engagements sans compter deux fois une réception.'
    - '[Service Capacity Visibility](model:D06.b) interprète les informations fournisseur et distingue plafond, charge, disponibilité
      annoncée et inconnues.'
    - '[Operations Visibility](model:operations-visibility) consolide faits et attentes pour exposer la progression et les
      informations absentes.'
    - Lire le tarif reçu d’un [Product Price Book](model:product-price-book) et [Service Price Book](model:service-price-book)
      reste un accès au référentiel ; le choix économique appartient à la décision consommatrice.
    - '[Supply Plan Visibility](model:plans-visibility) et [Demand Plan Visibility](model:demand-plan-visibility) interprètent
      les prévisions pour une demande donnée, sans inventer une précision absente ni décider de sa couverture.'
