chapters:
- id: start
  title: Comprendre la démarche
  intro: Une transformation change la manière de travailler et les résultats de l’entreprise. Le cadrage construit une compréhension
    partagée, compare des réponses et réduit les incertitudes avant d’engager les changements. Ces rubriques sont des angles
    de travail que l’équipe mobilise ensemble, pas des étapes à terminer dans l’ordre.
  sections:
  - title: Partir d’un problème concret
    text: 'Exemple pédagogique : des utilisateurs ressaisissent une information dans plusieurs outils. Réunir métier, utilisateurs,
      produit, organisation, données et technologie pour observer le travail réel. Examiner ensemble l’origine de l’information,
      sa qualité, les responsabilités et les contraintes techniques.'
    example: 'Comparer trois réponses : modifier une pratique, configurer un outil existant ou construire une intégration.
      Un échange avec les utilisateurs, quelques dossiers observés et un essai ciblé peuvent déjà invalider une option. Cet
      exemple ne décrit pas un fonctionnement constaté chez Beaumanoir.'
  - title: Avancer par questions et par preuves
    text: Choisir une question qui bloque une décision, un responsable de sa coordination et les personnes nécessaires. Préparer
      une observation, une comparaison ou un essai. Partager ce qui a été appris, les effets sur les autres dimensions et
      la prochaine question à instruire.
    example: 'Question : peut-on supprimer une ressaisie sans déplacer le travail vers une autre équipe ? Preuves : parcours
      observé, échantillon de données, essai et retour des personnes concernées. Décision attendue : approfondir, essayer
      sur un périmètre limité ou abandonner cette option.'
    detail: Une itération peut produire une preuve utile sans logiciel livré. On ne réserve pas une itération au métier, puis
      une autre à la technologie.
  - title: Conserver les repères utiles du delivery
    text: Garder des responsables, des dates, des dépendances et des productions concrètes. En cadrage, mesurer aussi les
      hypothèses vérifiées, les options éliminées et les décisions rendues possibles. Un livrable sert une question ; son
      existence ne prouve pas que le problème est compris.
    detail: Un diagramme de Gantt aide à planifier les disponibilités et les dépendances. Il ne représente pas à lui seul
      le raisonnement collectif. L’instruction des dimensions se chevauche ; les prérequis réels d’un engagement ou d’une
      mise en service restent obligatoires.
  - title: Une équipe, plusieurs compétences
    text: Les responsables métier, produit, organisation, données et technologie travaillent dans une même équipe de cadrage
      et de transformation. Les leaders d’expertise apportent des analyses et des preuves, puis en discutent les conséquences
      ensemble. La direction de programme reste en contact continu avec l’équipe.
    detail: L’[architecture d’entreprise](method:MOD032) aide à conserver la cohérence entre stratégie, fonctionnement métier,
      organisation, informations et technologie. Cette responsabilité se poursuit après le programme.
  visual:
    kind: dimensions
    title: Six dimensions qui se répondent
    description: Une équipe pluridisciplinaire explore les six dimensions ensemble. Chaque apprentissage peut modifier les
      autres vues. L’architecture d’entreprise aide à maintenir leur cohérence dans la durée.
    center: Une équipe, des questions communes
    items:
    - Stratégie et valeur
    - Métier et capacités
    - Usages et produit
    - Organisation et compétences
    - Informations et données
    - Solutions et technologie
    overview_svg: |
      <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1720" viewBox="0 0 1600 1720" role="img" aria-labelledby="title desc">
        <title id="title">FLOW — Transformer : instruire les dimensions ensemble</title>
        <desc id="desc">Vue d’ensemble de la méthode de transformation adaptée après U825. Une équipe pluridisciplinaire avec des leaders d’expertise et une direction de programme associée en continu examine conjointement six dimensions : stratégie et valeur, métier et capacités, usages et produit, organisation et compétences, informations et données, solutions et technologie. Les décisions locales respectent le mandat du programme ; les décisions les plus structurantes sont préparées pour le COPIL de transformation mensuel avec les sponsors invités. La cible métier, l’architecture, les expérimentations et la trajectoire se construisent par itérations. Des revues fréquentes associent le métier aux options, aux preuves et aux arbitrages. Les fiches de décision d’architecture, ou ADR, accompagnent cette convergence progressive. Produit et technologie interviennent dès le cadrage. Le DDD éclaire le langage et la conception des modèles logiciels. Les fondations sont validées par des preuves adaptées au risque, puis pour chaque mise en production. Ce schéma représente une méthode de décision, pas un calendrier ni une succession obligatoire de phases. Le schéma gouvernance-decisions.svg détaille les rythmes et la préparation des COPIL.</desc>
