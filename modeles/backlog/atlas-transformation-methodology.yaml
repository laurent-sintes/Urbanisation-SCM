    notes:
    - Niveau obligatoire entre sous-domaine et capacité ; une seule capacité reste admissible.
    - Ne désigne automatiquement ni une équipe, ni un produit, ni une application.
    - Chaque capacité est rattachée à une Business Area de son sous-domaine.
    - Une Area de références porte leur cohérence et leur fourniture locale. Elle les présente sans les transformer en capacités
      ; chaque référence conserve un parent de présentation unique.
