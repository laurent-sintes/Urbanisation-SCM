        <text x="60" y="51" class="eyebrow">FLOW ATLAS / GOUVERNANCE DE LA TRANSFORMATION</text>
        <text x="60" y="103" class="title">Préparer les décisions en continu, anticiper les COPIL</text>
        <text x="60" y="140" class="body">Deux rythmes de décision, une préparation partagée avec les personnes concernées.</text>
        <rect x="60" y="172" width="1380" height="126" rx="12" fill="#e4efed" stroke="#a9ccc7"/>
        <text x="82" y="209" class="heading">Architecture d’entreprise · cohérence transverse et durable</text>
        <text x="82" y="246" class="body">Relier stratégie, métier, organisation, informations et technologie ; éclairer les choix et leurs impacts.</text>
        <text x="82" y="279" class="small">Cohérence pendant et après la transformation · Collaboration avec les acteurs ci-dessous · Aucune nouvelle instance présumée</text>
        <g transform="translate(0 150)">
        <text x="60" y="186" class="section">UNE ÉQUIPE EN DIALOGUE AVEC LA DIRECTION ET LES SPONSORS</text>
        <g>
          <rect x="60" y="213" width="390" height="232" rx="14" fill="#eaf3f1" stroke="#bad4d0"/>
          <text x="82" y="255" class="heading">Équipe pluridisciplinaire</text>
