        <text x="750" y="462" text-anchor="middle" style="font-size:16px;fill:#506476;paint-order:stroke;stroke:#f7f9fa;stroke-width:6px">Échanges préparatoires directs avec les sponsors</text>
        <text x="60" y="502" class="body">Décisions locales dans le mandat ; arbitrages structurants et suivi des résultats au comité mensuel.</text>
        <text x="60" y="534" class="small">Le mandat reste à préciser, sans bloquer le cadrage. L’autorité d’arbitrage est identifiée au moment utile pour chaque sujet.</text>
