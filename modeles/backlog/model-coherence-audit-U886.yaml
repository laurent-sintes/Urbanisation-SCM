  - Le périmètre de Sales Order atteint 662 mots ; ATP/CTP/PTP dépassent chacun 600 mots selon le décompte whitespace du YAML.
  - Un paragraphe de 88 mots est identique dans les douze familles de commandes de traitement de biens.
  - 'Exemples de jargon non lié : Service Capacity Visibility cite VAS ; les périmètres des Business Areas citent notamment
    Reactive Workflow Management et Inventory Ownership Management sans lien vers leur explication. Ce relevé ne prétend pas
    compter toutes les occurrences.'
  impact: La règle utile est noyée ; les copies favorisent les désalignements constatés et les aides de lecture restent inégales.
    Ce constat n’est pas un comptage exhaustif du jargon.
  recommended_correction: Conserver les invariants communs dans le périmètre propriétaire ; donner dans chaque fiche le résumé
    autonome nécessaire et le lien utile. Réviser les occurrences spécialisées dans les fiches touchées, sans supprimer les
    nuances ni réécrire les preuves historiques.
  resolution: Contraintes communes de promesse et contrat des commandes de traitement mutualisés chez leurs responsables ;
    résumés autonomes et liens conservés. Sales Order allégé ; vocabulaire spécialisé relié ou explicité dans les passages
    corrigés.
  resolved_under: U887
