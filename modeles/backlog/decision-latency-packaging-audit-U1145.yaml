  publication_sha256: 6436a86f95655d40cffb508ea6a63d4456f7a4487fb1aa5dd5862ac3fb7dc101
  parity: Noms, définitions et périmètres identiques pour les huit capacités de processus examinées. Champs métier identiques
    pour les douze fiches de promesse, conditionnement et planification examinées. Définitions et contextes des termes concernés
    cohérents avec ces deux états ; les métadonnées techniques de publication peuvent différer.
verdict: Les responsabilités nécessaires existent. Le délai de décision n'est pas défini comme mesure explicite et la coopération
  entre CTP, conditionnements et comparaison de scénarios reste partiellement implicite. Préciser sept fiches existantes,
  leurs reprises dans le glossaire et deux relations suffit à ce stade.
boundaries:
- Aucun nouveau domaine, sous-domaine, capacité ou comportement proposé.
- Aucun renommage ou changement de parent ; les identifiants historiques ne déterminent pas la nature des fiches.
- Le modèle décrit une cible ; aucune réalisation installée Beaumanoir n'est déduite.
- L'audit des comportements clos U431 n'est pas rouvert.
- Les sept KPI du dossier et ses six questions sont conservés ; les mesures de délai sont des diagnostics complémentaires.
- La rapidité d'une décision ne prouve ni sa pertinence ni son gain économique.
