purpose: Vérifier la couverture du délai de décision et du choix des conditionnements, puis proposer des précisions ciblées.
authority: Lot proposé U1145 validé explicitement par Laurent en U1146 et appliqué au modèle et au glossaire. Les propositions
  antérieures restent conservées ci-dessous comme base de l’accord.
