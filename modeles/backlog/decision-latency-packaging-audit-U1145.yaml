    évolutions.
  gap: Rendre explicite la comparaison de conditionnements et le retour vers les choix des approvisionnements futurs.
proposed_node_changes:
- node_id: work-deadline-management
  name: Work Deadline Management
  field: scope
  operation: append
  proposed_text: Pour une décision sensible au temps, distinguer l'objectif de traitement de la dernière date à laquelle la
    décision permet encore de produire l'effet attendu. Recevoir cette échéance utile de la responsabilité métier qui établit
    les possibilités de réalisation et leurs délais ; conserver ses hypothèses, sa provenance et ses révisions. Suivre cette
    date et déclencher les relances ou escalades autorisées avant que l'option devienne inutilisable. La gestion des échéances
    ne choisit pas la réponse métier. Un dépassement ne vaut ni accord, ni refus, ni autorisation de dérogation.
  example: Une commande d'appoint reste livrable vendredi si elle est autorisée avant mardi midi ; un objectif administratif
    de réponse sous 48 heures ne garantit pas cette possibilité.
  glossary_context_to_align:
  - TER172
  market_support:
  - MS-WORK-TASK
  - SAP-DEADLINE
  - SAP-PROCUREMENT-WORKFLOW
  market_limit: Échéances et réactions documentées ; dernière date économiquement utile et origine métier de cette date sont
    une précision FLOW.
- node_id: process-ledger
  name: Process Ledger
  field: scope
  operation: append
  proposed_text: Pour un dossier comportant une décision, relier les événements qualifiés qui distinguent le fait déclencheur,
    la disponibilité d'un signal exploitable, la décision autorisée et l'effet réalisé au jalon retenu. Conserver aussi les
    propositions, refus, décisions motivées de ne pas agir et révisions lorsqu'ils sont produits. Le producteur responsable
    qualifie chaque événement ; le registre ne déduit pas une décision de la réception d'un message ni une réalisation de
    son autorisation. Une borne absente reste inconnue. La réception d'une information et le moment où elle devient exploitable
    peuvent différer.
  glossary_context_to_align:
  - TER375
  - TER376
  market_support:
  - MS-WORK-HISTORY
  - SAP-INBOX-ACTIONS
  market_limit: Historiques de tâches et décisions documentés ; ces exemples ne couvrent pas le registre transverse complet
    de FLOW et ne résolvent pas ses lacunes de comparaison déjà déclarées.
- node_id: process-mining
  name: Process Mining
  field: scope
  operation: append
  proposed_text: Mesurer séparément le délai d'information, le délai de décision et le délai de mise en œuvre lorsque leurs
    bornes sont documentées. Le délai de décision inclut l'analyse, la comparaison, les attentes et l'approbation jusqu'à
    la décision autorisée. Identifier chaque décision attendue et son itération dans le dossier. Présenter les distributions
    des durées, l'ancienneté des attentes et la part des décisions prises avant leur échéance utile. Inclure les décisions
    attendues arrivées à échéance sans réponse dans ce dernier suivi. Expliciter les inconnues et les révisions d'échéance.
    Une décision rapide n'est pas nécessairement pertinente ; les activités et boucles qui se chevauchent ne s'additionnent
    pas automatiquement.
  glossary_context_to_align:
  - TER173
  - TER201
  market_support:
  - MS-WORK-HISTORY
  - SAP-DEADLINE
  market_limit: Appuis sur les traces et bornes temporelles ; ni équivalence complète à Process Mining ni standard commun
    des formules proposées ci-dessous.
- node_id: BHV082
  name: Process, Tasks & Order Visibility
  field: scope
  operation: append
  proposed_text: Pour les dossiers en attente d'une décision, montrer depuis quand le signal est exploitable, qui porte la
    décision, son échéance utile et le temps restant ou dépassé. Distinguer analyse en cours, approbation attendue, décision
    autorisée et mise en œuvre restante. Présenter les valeurs inconnues et les options devenues caduques sans autoriser une
    action à la place de la capacité responsable.
  glossary_context_to_align:
  - TER175
  market_support:
  - MS-WORK-HISTORY
  - SAP-INBOX-ACTIONS
  market_limit: Les vues documentées restent celles des workflows concernés ; la visibilité sur tous les flux FLOW est une
    cible distincte.
- node_id: D03.j
  name: Capable-to-Promise (CTP)
  field: scope
  operation: append
  proposed_text: Lorsque la possibilité étudiée dépend du conditionnement, vérifier les quantités admissibles, les conversions
    d'unités, les consignes applicables et les opérations nécessaires pour obtenir le résultat demandé. Une scission de commande
    ne réalise pas un déconditionnement physique. Si l'option nécessite une ouverture ou un reconditionnement autorisé, contrôler
    les matières, capacités, calendriers et délais correspondants. Expliquer la quantité et la date réalisables, les contraintes
    bloquantes et les hypothèses restant à confirmer. Le résultat peut alimenter la comparaison de conditionnements par Simulation
    & Analysis ; il ne définit pas à lui seul un conditionnement optimal. Des packs déjà disponibles et admissibles relèvent
    d'ATP ; tout choix de conditionnement n'est donc pas un calcul CTP.
  example: Servir 18 pièces vendredi avec trois packs de six disponibles, ou vérifier la possibilité d'ouvrir des cartons
    de douze. Un créneau de reconditionnement seulement lundi interdit la seconde option pour vendredi ; livrer 24 exige un
    accord distinct.
  glossary_context_to_align:
  - TER045
  market_support:
  - MS-CTP
  - SAP-CTP-PPO
  market_limit: Faisabilité de production et distinction optimisation/confirmation étayées ; application à toutes les prestations
    logistiques ou conception de l'emballage non démontrées chez les deux éditeurs.
- node_id: BHV076
  name: Capacity-Constrained CTP
  field: scope
  operation: append
  proposed_text: Pour une option nécessitant un reconditionnement, vérifier les capacités et créneaux de la prestation requise
    avec les matières, durées et dépendances connues. Un délai standard ou une capacité non confirmée reste une hypothèse.
    Le contrôle de faisabilité ne choisit pas l'organisation interne du prestataire et n'autorise pas la prestation.
  glossary_context_to_align:
  - TER045
  market_support:
  - MS-CTP
  - SAP-CTP-PPO
  market_limit: Exemple concret du périmètre logistique déjà présent dans FLOW ; aucune fonction native identique de reconditionnement
    CTP présumée.
- node_id: BHV006
  name: Simulation & Analysis
  field: scope
  operation: append
  proposed_text: Comparer également les tailles de lots et conditionnements admissibles, par produit et flux, en mobilisant
    Replenishment, ATP, CTP et PTP selon le besoin. Conserver pour chaque variante les quantités et dates réalisables, opérations
    supplémentaires, charge, reliquats, coûts et effets sur le service. Distinguer les options physiquement accessibles pour
    la décision courante des variantes envisagées pour un futur approvisionnement. Les résultats peuvent recommander une évolution
    des quantités, conditionnements ou consignes aux responsables concernés ; la recommandation ne modifie ni leurs paramètres
    actifs ni les commandes. Le choix dépend du périmètre, des hypothèses de demande et des objectifs retenus, sans pondération
    implicite.
  example: Comparer cartons de douze et packs de six sur des demandes représentatives ; mettre en regard surcoûts, reconditionnements,
    excédents et retards évités avant de recommander le prochain conditionnement.
  glossary_context_to_align: []
  glossary_check: Pas d'entrée au nom de cette capacité ; utiliser les termes existants ATP, CTP, PTP, Replenishment et Packaging
    Specification. Les définitions de ces termes restent compatibles ; préciser TER045 seulement.
  market_support:
  - MS-MASTER-PLANS
  - SAP-PPO-LOTS
  market_limit: Simulation et contraintes de lots étayées ; boucle de recommandation vers les conditionnements futurs proposée
    pour FLOW, pas fonction identique attestée chez les deux éditeurs.
