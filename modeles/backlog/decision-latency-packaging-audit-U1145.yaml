relation_checks:
- Les deux liens ci-dessus sont absents de l'état examiné ; attribuer leurs identifiants seulement lors d'une application.
- Conserver REL-U891-USE-10, Replenishment vers Packaging Specification.
- Conserver REL-CTP-EXECUTION-SERVICE et REL-PTP-CTP-SCENARIOS ; ne pas les doubler.
proposed_measure_contract:
  glossary_target: TER201
  field: context
  status: proposed
  unit: Durée ; préciser calendrier ouvré ou écoulé et fuseau.
  timestamps:
    t0: Date du fait déclencheur.
    t1: Date à laquelle le signal est qualifié comme exploitable pour la décision considérée.
    t2: Date de la décision autorisée, humaine ou selon une règle autorisée.
    t3: Date de l'effet réellement obtenu au jalon défini pour ce type d'action.
  formulas:
    information_delay: t1 - t0
    decision_delay: t2 - t1
    implementation_delay: t3 - t2
    decisions_on_time: Décisions attendues de la population autorisées au plus tard à leur échéance utile / décisions attendues
      dont cette échéance est atteinte dans la période.
  measurement_rules:
  - Numérateur et dénominateur portent sur la même population et la même version d'échéance.
  - Identifier chaque décision attendue et son itération dans le dossier ; relier t0, t1, t2, t3 et l'échéance à cette même
    occurrence. Une décision antérieure ne clôt pas une nouvelle attente.
  - Fixer avant mesure le critère de signal exploitable et son producteur responsable ; conserver aussi la réception et la
    qualification. Une qualification tardive ne doit pas masquer une attente déjà ouverte.
  - Les décisions attendues échues sans réponse restent au dénominateur ; les attentes non échues sont suivies séparément
    par leur ancienneté.
  - Conserver échéance initiale et révisions justifiées ; ne pas déplacer rétroactivement une date pour masquer le retard.
  - Documenter données manquantes et couverture de mesure ; absence de date ne vaut pas durée nulle.
  - Une décision motivée de ne pas agir peut clore la décision ; ne pas lui inventer une réalisation physique t3.
  - Expliciter les annulations et refus ; compter les boucles distinctes sans additionner les activités parallèles.
  - Fixer population, dates, exclusions et jalon avant la comparaison de deux périodes ou flux.
  example: 'Illustration en heures écoulées dans un même fuseau : fait lundi 8 h, signal exploitable lundi 10 h, autorisation
    mardi 11 h, effet vendredi 14 h. Délais respectifs 2 h, 25 h et 75 h. Si l''échéance utile était mardi midi, la décision
    est à temps. Une décision encore absente après mardi midi est en retard.'
integration_rules_if_adopted:
- Appliquer ensemble les ajouts aux scopes et aux contextes des termes associés ; contrôler résumés, exemples et descriptions
  pédagogiques concernés sans réécriture générale.
- Relier les termes spécialisés au glossaire existant ; ne pas introduire un terme « grain idéal » ni créer une notion autonome
  pour chaque mesure.
- Conserver les définitions générales, noms, parents et frontières compatibles ; aucune extension implicite d'accord sur les
  autres champs.
- Conserver les limites des comparaisons existantes et joindre les appuis ci-dessous aux seuls champs enrichis.
- L'échéance utile doit être fournie et justifiée par la décision métier concernée, à partir de la faisabilité et des délais
  connus ; aucune formule universelle date promise moins délai moyen.
- Réévaluer la possibilité avant confirmation si une hypothèse ou un créneau n'est plus valide ; aucune attente d'approbation
  supposée nulle.
- Enregistrer séparément l'accord sur les valeurs finales, puis appliquer les contrôles proportionnés ; publier seulement
  sur demande.
