implementation_notes:
- Appeler recompose_summaries(model_final) après application des autres lots ; remplacer les six éditions de synthèse et leur
  lignée dans le manifeste.
- Comparaison marché récente U1114 réutilisée ; aucun fait éditeur ni réalisation installée ajouté. Corrections d’alignement
  internes, compléments rédactionnels proposés.
- Aucun accord de termes ou de descriptions nouvelles à capturer automatiquement.
- Lecture ciblée via scripts.inspect_model.inspect ; documents canoniques lus avec scripts.structured_io.read. Aucun canonique
  modifié par cet agent.
- 'Périmètre : 21 fiches Commerce/Procurement, leurs termes, TER155 et TER257 ; nouveaux contrats proposés. Le terme TER353
  reste cohérent : les autres faits de magasin suivent leur lien U1091 existant.'
- Les sources primaires consultées et indexées dans U1114 sont réutilisées ; les rapprochements historiques des fiches sont
  préservés et leur positionnement réexaminé sur le périmètre inchangé.
- Aucun nouveau parent, capacité, comportement, maître entreprise, autorité financière ou réalisation installée créé.
- Les nouveaux liens vers des destinations choisies après le Go restent proposés. intent_targets ne suggère que les extrémités
  concrètes déjà nommées par la proposition de l’audit ; le parent doit encore qualifier chaque capture.
- La capacité Sales Price Determination devient l’extrémité productrice du flux REL-U996-contextual-prices existant ; aucune
  seconde relation parallèle de prix vers Sales Order n’est ajoutée.
- Coopérations CH07–CH13 justifiées par les fiches et les passages primaires MS/SAP de l’audit U1114, relus ; pas de taxonomie
  importée.
- Les relations nouvelles précisent une cible proposée et ses conditions ; leurs extrémités précises et leurs textes rédigés
  après Go ne reçoivent pas un accord de champ implicite.
- Lacune SAP S/4HANA propre à GRC conservée malgré les appuis complémentaires Process Control.
- Les faits monétaires de caisse restent produits par Commerce ; les registres de stock ne deviennent pas producteurs d’encaissements.
- La lignée des synthèses EA sera recalculée sur le lot final après tous les ajouts.
- Ajouter MOD051 à presentation.groups[id=objects].term_ids du glossaire méthodologique (parent).
- Les étapes modifiées perdent uniquement leurs accords actifs field_agreements steps devenus périmés ; les autres accords
  sont préservés et aucun complément n’est automatiquement validé.
- Aucune participation Enterprise Planning ou Governance ajoutée sans étape documentée ; leurs coopérations restent portées
  par les relations de contexte.
- Exports bruts conservent automatiquement context_participants ; métamodèle, validation, contexte de décisions et delta sont
  alignés.
