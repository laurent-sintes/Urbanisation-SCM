assessment:
  to_explore: Négoce, Finance, CBS et Sarenza ont un sujet décrit, des pistes ouvertes et une prochaine étape ; leur exploration
    reste à conduire. Ce classement ne prouve ni étude réalisée, ni option crédible.
  preserved: La négociation C-LOG reste en qualification. Les autres sujets restent à explorer. Les statuts de reconnaissance
    du sujet, complexités et ancrages sont conservés.
  editorial: Descriptions, exemples, options et comparaisons sont rédigés pour une présentation professionnelle. Attribution
    personnelle conservée dans les preuves et notes de revue historiques.
