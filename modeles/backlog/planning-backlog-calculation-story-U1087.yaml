id: PLANNING-BACKLOG-CALCULATION-STORY-U1087
status: applied_to_backlog
source_refs:
- U1082
- U1084
- U1085
- U1086
- U1087
request:
  verbatim: Je ne vois pas quand on calcule la Demand Planning et la supply planning par exemple ; Oui ; Il faut que ça raconte
    une histoire avec des uses cases afin de vérifier qu’on a rien oublié. Une histoire avec pénurie bien entendu.
  scope: Revue du contenu de Planning & Optimization et Order Backlog Management, sans changement de leurs périmètres métier.
market_audit:
  microsoft: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/reduction-keys
  sap_s4hana: https://learning.sap.com/courses/exploring-production-planning-in-sap-s-4hana/execute-supply-chain-planning
  limit: Appuis fonctionnels partiels ; la chaîne FLOW et les règles locales ne sont pas des équivalents natifs ni des réalisations
    prouvées.
business_area_review:
  single_capability_count_before: 35
  decision: Une seule capacité ne justifie pas une fusion automatique. Demand Plan Management reçoit une capacité distincte
    de construction du plan ; Supply Resource Planning et Planning Reconciliation restent séparées pour leurs résultats métier
    distincts.
  open_gap: Availability porte la consommation de prévision, mais sa capacité détaillée responsable de cette règle n’est pas
    explicitement identifiée dans le modèle courant ; le parcours signale cette responsabilité sans l’attribuer artificiellement
    à ATP.
