approval_scope: U1130/U1131 autorisent la généralisation éditoriale à ces niveaux. Les explications, résultats illustratifs
  et distinctions rédigés ensuite restent proposés ; aucun accord historique ni réalisation installée n’est étendu.
reading_contract: Définition courte conservée ; explication, exemple concret et distinction dans la fiche. Tooltips simples,
  aucun lien Comprendre ajouté. Un périmètre de contexte reste terminal à sa profondeur déclarée.
editorial_review:
  authorship: 134 explications et distinctions rédigées individuellement à partir des définitions, périmètres, finalités,
    exemples et frontières canoniques consultés avec inspect_model.py. Aucun texte générique produit à partir du seul nom.
  examples: Exemples canoniques réutilisés et complétés par un résultat. Les termes spécialisés des illustrations retenues
    sont reliés au glossaire ; les formulations anglaises non expliquées sont clarifiées en français. Nouveaux cas fictifs
    seulement en l’absence d’exemple local pertinent. Contribution explicite de la fiche, sans couverture de scénario artificielle.
  concrete_example_correction:
  - node_id: subdomain-value-added-returns
    reason: L’exemple ancien décrivait le traitement d’un retour ; il est remplacé par un réétiquetage, conforme au périmètre
      distinct des traitements complémentaires. TER236 ne reprenait pas cet exemple et conserve son sens inchangé.
  business_invariants: Noms, définitions courtes, finalités, périmètres, parents, ordre, relations, niveaux et capacités inchangés.
glossary_alignment:
  result: Sens et frontières des termes miroirs contrôlés. Définitions courtes et périmètres du modèle inchangés ; le glossaire
    reste cohérent sans modification. Pas de copie du bloc pédagogique dans le glossaire. Les liens de jargon utilisent des
    entrées dont la définition courte existe.
