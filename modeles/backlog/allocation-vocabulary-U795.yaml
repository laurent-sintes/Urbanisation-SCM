agreement_scope:
  lexical_rule: Allocation de stock par groupe (Group Inventory Allocation) est un terme qualifié autorisé pour attribuer
    une enveloppe de stock à un usage ou une population, avec des droits et règles de consommation explicites. Allocation
    seul reste ambigu ; distinguer protection minimale, plafond de consommation, affectation aux demandes, réservation et
    réassort.
  parent_name: Supply Protection Policy
  excluded: Renommage/scission du parent, renommage du comportement, extension des droits, approbation globale des rédactions
    ou des correspondances.
