target_proposal_U883:
  status: applied_U885
  source_refs:
  - U882
  - U883
  subdomain:
    name: Process Management
    parent_id: supply-chain-orchestration
    definition: Définir, conduire, superviser et améliorer les parcours de traitement Supply, en organisant leurs contributions
      humaines et automatisées.
    boundary: Pas de moteur universel de tous les processus de l’entreprise. Les capacités mobilisées conservent leurs décisions,
      invariants et engagements.
  business_areas:
  - name: Reactive Workflow Management
    existing_id: ba-reactive-workflow-management
    change: Déplacer depuis Order Management ; généraliser explicitement le contexte au parcours Supply, sans réduire la validité
      des transitions des Orders.
    capabilities:
    - existing_id: workflow-definition-management
      proposed_name: Process Definition Management
      intent: Tenir activités, règles de composition, prérequis et versions.
    - existing_id: order-workflow-sentry
      proposed_name: Process Sentry
      intent: Interpréter les événements dans le contexte du parcours et déclencher la réaction autorisée.
    - existing_id: order-workflow-planning
      proposed_name: Process Planning
      intent: Composer ou adapter les activités, attentes et dépendances ; ne pas planifier les ressources Supply à la place
        d’Availability.
    - existing_id: order-workflow-orchestration
      proposed_name: Process Orchestration
      intent: Conduire le parcours et solliciter ses contributions, sans reprendre les pouvoirs des capacités sollicitées.
  - name: Process Supervision
    change: Nouvelle Business Area
    capabilities:
    - existing_id: BHV082
      proposed_name: Process Visibility
      change: Promouvoir le comportement existant en capacité, préserver son identité et étendre son périmètre au parcours
        complet. Retirer son ancien lien contains sous Operations Visibility.
      intent: Comprendre résultats, attentes, blocages et suites possibles à partir des faits corrélés.
    - proposal_ref: U881-P01
      proposed_name: Process Intervention
      intent: Encadrer démarrage, suspension, reprise ou terminaison autorisés et vérifier leur effet.
    - proposal_ref: U881-P02
      proposed_name: Process Exception Management
      intent: Tenir la prise en charge et la résolution des exceptions affectant un ou plusieurs parcours.
  - name: Human Work Management
    change: Nouvelle Business Area
    capabilities:
    - proposal_ref: U881-P03
      proposed_name: Human Task Management
    - proposal_ref: U881-P04
      proposed_name: Work Assignment
    - proposal_ref: U881-P05
      proposed_name: Work Deadline Management
  - name: Process Intelligence
    change: Nouvelle Business Area
    capabilities:
    - proposal_ref: U881-P06
      proposed_name: Process Mining
      intent: Reconstituer les parcours observés, analyser leurs variantes et performances, repérer attentes, reprises et
        écarts ; comparer au parcours attendu lorsque celui-ci existe.
      boundary: Inclut les mesures de performance des parcours ; aucune deuxième capacité Process Performance Analysis dans
        cette cible. Exige des traces corrélables ; pas de reconstitution fiable des activités non observées ni de causalité
        automatique.
    - proposal_ref: U881-P07
      proposed_name: Operational Analysis & Reporting
      intent: Explorer et partager les informations et indicateurs utiles au pilotage des parcours et de leurs résultats métier.
      boundary: Peut croiser commandes, prestations et délais ; ni moteur de widgets ni plateforme BI d’entreprise.
  other_changes:
  - existing_id: D06.d
    current_name: Process Orchestration
    proposed_name: Fulfilment Coordination
    reason: Conserver le pilote exécutant et éviter deux capacités homonymes Process Orchestration. Même responsabilité locale
      de coordination des prestations.
  - existing_id: D06.f
    current_name: Process Adaptation Decision
    proposed_name: Fulfilment Adaptation Decision
    reason: Rendre explicite le périmètre des adaptations locales ; les changements du parcours complet restent Process Planning.
  - existing_id: operations-visibility
    change: Conserver dans Fulfilment, recentrer nom/description sur les prestations et conserver les trois comportements
      Warehouse, Transportation et Store. Fournir cette connaissance à Process Visibility.
  - existing_id: D07.d
    change: Conserver Operations Tracking pour les faits de réalisation des prestations. Les faits de parcours viennent aussi
      de Process Orchestration et Human Task Management, sans inventer un tracking autonome par type.
  identity_policy: Préserver les identités existantes et les anciens snapshots ; renouveler seulement codes de lecture au
    prochain parcours de publication. Toute extension de sens et tout nouveau parent restent soumis à arbitrage propre.
  counts:
    target_capabilities: 12
    existing_capabilities_moved: 4
    behavior_promoted: 1
    new_capabilities: 7
    existing_business_area_moved: 1
    new_business_areas: 3
    new_subdomain: 1
  market_basis:
    source_ids:
    - U881-S01
    - U881-S02
    - U881-S04
    - U881-S07
    - U881-S08
    - U881-S10
    - U881-S13
    - U881-S14
    - U881-S17
    - U881-S20
    relation: Appuis fonctionnels et sémantiques déjà consultés ; aucun standard commun de cette hiérarchie, de ces noms ou
      de la promotion BHV082 revendiqué.
    limit: La découverte de processus est étayée par Power Automate, distinct de Dynamics. Les sources Dynamics couvrent tâches,
      dossiers et workflow. SAP documente notamment l’intégration de Flexible Workflow avec Process Visibility.
  implementation_scope_after_approval:
  - Aligner modèle, glossaires, comparaisons et liens dans un même lot.
  - Réécrire les frontières Order Management / Process Management / Fulfilment sans double orchestration.
  - Mettre à jour les scénarios ciblés U881 et leurs contributions explicites.
  - Vérifier identité persistante de BHV082, nature capability, parent unique Business Area et trois comportements restants
    sous Operations Visibility.
  - Contrôler les références et codes figés ; publication seulement si demandée.
  alternative: Conserver le nom Operations Management et les quatre capacités dans Order Management ne réalise pas pleinement
    la centralité Process proposée ici. Ne pas mélanger silencieusement ces deux cibles.
update_plan_U884:
  status: applied_verified
  approval:
    source: U884
    scope: Cible cumulative U883 ; structure, noms et frontières présentés.
    excluded: Formulations détaillées futures, nouvelle décomposition de comportements et réalisation installée non approuvées
      implicitement.
  target_ref: target_proposal_U883
  scope: Un lot cohérent ; pas de réécriture générale des fiches ou des historiques.
  steps:
  - step: 1
    title: Établir la matrice de transformation et les identités
    actions:
    - S’appuyer sur Git et les empreintes de basis, sans copie avant concurrente.
    - Lister les nœuds déplacés, renommés, promus et créés avec parents avant/après et champs concernés.
    - Conserver les identités des quatre capacités et de la Business Area déplacées, de BHV082 promu et de D06.d/D06.f renommés.
    - Attribuer les identifiants des créations après contrôle des identifiants courants et retirés ; ne pas réserver des codes
      de lecture manuellement.
    - 'Préparer le contrat publication_delivery au format du parcours release : required_nodes, noms, natures, parents et
      retraits explicites de rattachements.'
    acceptance: Chaque changement de la cible a une entrée traçable ; aucune suppression de responsabilité, aucun identifiant
      recyclé.
  - step: 2
    title: Appliquer la structure et les frontières dans le modèle
    actions:
    - Créer Process Management sous Supply Chain Orchestration.
    - Déplacer Reactive Workflow Management avec ses quatre capacités, les renommer et étendre explicitement leur contexte
      au parcours Supply.
    - Créer Process Supervision, Human Work Management et Process Intelligence avec leurs capacités.
    - Promouvoir BHV082 en capacité Process Visibility, la rattacher à Process Supervision et préserver ses contenus utiles.
    - Retirer uniquement son ancien rattachement de comportement à Operations Visibility ; conserver les trois autres comportements.
    - Renommer D06.d en Fulfilment Coordination et D06.f en Fulfilment Adaptation Decision.
    - Réviser les références actives aux anciens noms et les dépendances métier touchées, sans remplacer des citations ou
      réécrire les publications historiques.
    - 'Préciser la collecte des faits : Operations Tracking pour les prestations, faits de parcours et de tâches issus de
      leurs responsables, corrélation pour les analyses.'
    acceptance: Douze capacités sous quatre Business Areas ; chaque capacité a exactement un parent Business Area ; aucune
      seconde orchestration concurrente.
  - step: 3
    title: Aligner fiches, glossaires et preuves marché
    actions:
    - Rédiger définitions, résultats attendus, périmètres, exclusions et exemples concrets des fiches touchées.
    - Aligner le glossaire métier dans les deux sens ; conserver Task et Case en distinguant contribution, travail attribuable,
      dossier et commande.
    - Documenter Process Mining, Work Queue, délais, escalade et intervention avec définitions courtes et liens sur le jargon.
    - Réutiliser les 21 sources valables ; compléter uniquement les appuis manquants aux fiches nouvelles ou élargies, avec
      un appui SAP S/4HANA et un appui Dynamics pertinents par fiche comparée.
    - 'Conserver les limites : Power Automate distinct de Dynamics, intégration SAP distincte du cœur S/4HANA, aucun catalogue
      commun de capacités revendiqué.'
    - Actualiser les champs et exemples concernés du guide assemblé et du glossaire méthodologique, dont Visibility et identité
      versus code ; ne pas créer un second catalogue.
    - Conserver zéro comportement pour les nouvelles capacités sauf justification et arbitrage d’au moins deux variantes différenciantes.
    acceptance: Aucun désalignement de noms ou frontières ; preuves et limites explicites ; aucun accord étendu aux nouvelles
      rédactions.
  - step: 4
    title: Mettre à jour les scénarios et leur couverture
    actions:
    - 'Compléter customer-credit-hold-path : tâche humaine, autorité Finance, affectation, échéance et reprise autorisée.'
    - 'Compléter remote-payment-ambiguous-path : dossier d’exception, investigation, résultat attesté et prévention du double
      paiement.'
    - 'Compléter export-remote-services-path : réception manuelle et vérification d’une pièce sans intégration externe présumée.'
    - 'Mettre à jour workflow-version-change-path : noms canoniques, versions, intervention et préservation du réalisé.'
    - 'Ajouter un scénario illustratif de Process Mining : observer les variantes, localiser l’attente, rééquilibrer le travail
      et vérifier les effets.'
    - Rendre explicites les contributions des douze capacités ; vérifier aussi les autres parcours référençant les identités
      déplacées ou les anciens noms.
    acceptance: Couverture narrative des douze capacités, liens de parcours valides et aucune preuve d’existant inventée.
  - step: 5
    title: Vérifier contrats et lecture Atlas
    actions:
    - Exécuter validate_models.py et les tests ciblés de niveaux, Business Areas, identités/codes, scénarios et guide.
    - Ajouter des régressions utiles pour la promotion behavior vers capability, les rattachements, les compteurs et les liens
      versionnés.
    - Vérifier arbre, bandeaux Business Area, overviews, recherche par nom/id/code, fiches, glossaires, infobulles clavier
      et scénarios associés.
    - Comparer l’inventaire prévu et réellement produit ; vérifier aussi les contenus et références, pas seulement le nombre
      de nœuds.
    - Régénérer la vue backlog ; si le frontend change, exécuter ses tests et son build.
    - Pour la recette prépublication, utiliser une fixture isolée validée ; Atlas courant reste exclusivement sur son snapshot
      publié.
