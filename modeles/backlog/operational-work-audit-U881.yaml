      scope: |-
        Filtrer, regrouper et comparer commandes, prestations, parcours et travail humain ; enregistrer et partager les vues utiles. Consommer les mesures de [Process Mining](glossary:TER173) et les connaissances d’[Order Visibility](model:order-visibility) et [Operations Visibility](glossary:TER178). Donner la population, la formule, la période, la fraîcheur et la version des indicateurs ; revenir aux dossiers à l’origine d’un résultat.

