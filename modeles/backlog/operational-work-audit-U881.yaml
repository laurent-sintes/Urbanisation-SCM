recommendation:
  parent_domain: supply-chain-orchestration
  new_subdomain: Operations Management
  label_fr: Pilotage de l’activité opérationnelle
  status: Proposition initiale U881 ; remplacée pour arbitrage par target_proposal_U883. Non appliquée.
  purpose: Assurer la prise en charge du travail Supply, intervenir sur les situations en cours et piloter la performance
    de leur traitement.
  knowledge:
  - Situations à traiter et impacts
  - Travaux humains et responsabilités
  - Échéances et mandats d’intervention
  - Mesures, populations et preuves de résolution
  business_areas:
  - name: Operational Supervision
    responsibility: Interventions autorisées et résolution des écarts.
    proposals:
    - U881-P01
    - U881-P02
  - name: Human Work Management
    responsibility: Distribution, contribution et ponctualité du travail humain.
    proposals:
    - U881-P03
    - U881-P04
    - U881-P05
  - name: Operational Intelligence
    responsibility: Analyse des performances et restitution de pilotage.
    proposals:
    - U881-P06
    - U881-P07
  alternatives:
  - option: Tout placer dans Order Management
    assessment: Simple mais mélange tenue des engagements, moteur de parcours, travail collectif et analyse transverse. Non
      recommandé pour le périmètre complet demandé.
  - option: Créer deux sous-domaines, Work Management et Operational Intelligence
    assessment: Défendable si responsables et cycles de gouvernance divergent ; séparation prématurée au stade actuel.
  - option: Créer un Domain Case Management
    assessment: 'Non justifié : pattern de traitement réutilisable, pas automatiquement nouveau domaine de connaissance de
      l’entreprise.'
  tradeoff: Un sous-domaine supplémentaire rend les responsabilités visibles mais peut devenir un fourre-tout. Le borner au
    travail de Supply Chain Orchestration, avec Business Areas obligatoires ; exclure l’exploitation informatique et les opérations
    internes Logistics.
proposals:
- id: U881-P01
  status: proposed_not_applied
  name: Process Intervention
  business_area: Operational Supervision
  definition: Autoriser et conduire une intervention sur un parcours engagé, avec une portée et un résultat vérifiables.
  gap: Couverture partielle dans Order Workflow Orchestration, Process Orchestration et les états des Orders ; mandat de supervision
    non explicite.
  existing_node_ids:
  - order-workflow-orchestration
  - D06.d
  - D04.i
  scope: Démarrer une activité admissible, demander une suspension, reprendre ou terminer une portée autorisée. Conserver
    auteur, motif, cible, version, impact attendu et résultat observé. Une commande envoyée au moteur ne prouve pas son effet.
  boundary: Les propriétaires des Orders valident leurs transitions ; le moteur existant applique. Ni annulation physique
    implicite ni effacement du réalisé.
  example_fictitious: Suspendre le reste d’un parcours avant une seconde sollicitation de paiement, puis reprendre après rapprochement.
  name_and_scope_justification: Distinguer pilotage d’une intervention exceptionnelle et conduite ordinaire du workflow ;
    éviter un second orchestrateur.
  market_comparison:
    relationship: Recouvrement partiel ; mécanismes produits transposés en responsabilité FLOW
    source_ids:
    - U881-S01
    - U881-S07
    - U881-S15
    - U881-S20
    similarity: Autoriser et conduire une intervention sur un parcours engagé, avec une portée et un résultat vérifiables.
    difference: Les propriétaires des Orders valident leurs transitions ; le moteur existant applique. Ni annulation physique
      implicite ni effacement du réalisé.
    limit: Distinguer pilotage d’une intervention exceptionnelle et conduite ordinaire du workflow ; éviter un second orchestrateur.
  behaviors: Non décomposés dans cet audit ; zéro ou au moins deux comportements différenciants après arbitrage.
