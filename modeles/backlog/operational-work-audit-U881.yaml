case_management_findings:
  sources:
  - U881-S10
  - U881-S17
  - U881-S18
  - U881-S19
  - U881-S20
  - U881-S21
  distinctions:
  - Case = dossier/contextualisation ; Process = parcours ; Task = contribution à accomplir ; Work Item = travail attribuable
    ; Queue = ensemble de travaux en attente de prise en charge.
  - Un Case peut coordonner plusieurs tâches et plusieurs commandes ; une commande conserve son identité et ses engagements.
  - Le travail humain inclut la progression normale, pas seulement les exceptions.
  - Actions facultatives et activation conditionnelle prolongent Reactive Workflow Management ; pas de moteur Case concurrent
    créé par défaut.
  additional_requirements:
  - 'Contexte partagé : pièces, observations, échanges et décisions reliés au dossier, sans créer un moteur documentaire métier
    générique.'
  - Responsable du dossier distinct des contributeurs ; clôture de tâche distincte de résolution attestée.
  - 'Traçabilité des actes : qui, pourquoi, portée, avant/après, autorisation et résultat.'
  - Droits de consultation et d’intervention, délégation et séparation des rôles ; aucune nouvelle gouvernance financière.
  - 'Connaissances de résolution réutilisables : piste ultérieure, périmètre Supply et responsabilité à instruire avant capacité
    autonome.'
semantics_to_settle:
- Visualiser définition, parcours prévu, instance en cours et parcours observé sont quatre lectures distinctes ; elles ne
  créent pas quatre capacités.
- Suspendre une tâche, un parcours, une commande et une prestation extérieure ne sont pas équivalents ; arrêt demandé distinct
  d’arrêt effectif.
- Redémarrer n’autorise ni double paiement ni rejeu des actes déjà réalisés. Une correction du moteur peut nécessiter une
  décision métier séparée.
- Politique de run, règle de routage, engagement contractuel de délai et mandat d’intervention ont des autorités différentes.
- 'Pas de capacité autonome par bouton : démarrer, suspendre, reprendre et arrêter sont des opérations à qualifier dans leur
  portée.'
measurement_contract:
- Identité de dossier, de parcours/version et d’activité, corrélation avec Orders et prestations ; aucune relation un-pour-un
  imposée.
- Dates d’occurrence et de réception, origine, correction, tentative, résultat et responsable connus.
- Distinguer temps de file, travail actif, attente extérieure, pause autorisée et durée de bout en bout.
- Définir population, numérateur/dénominateur, calendriers, unités, exclusions, dossiers ouverts et percentile choisi ; éviter
  les moyennes seules.
- Distinguer zéro, donnée absente et événement tardif ; afficher couverture et fraîcheur ; corrélation statistique distincte
  de causalité.
