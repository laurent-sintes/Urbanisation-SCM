id: STOCK-CONFIGURATION-BOUNDARIES-U910
source_refs:
- U910
status: applied_to_backlog
decision:
  accepted:
  - Lire Plan Application après Simulation & Analysis dans Master Plan Management.
  - Expliciter la demande identifiée comme maille de Order Promising et le carnet, la prévision résiduelle et les seuils magasins
    comme contexte global de Demand / Supply Matching.
  - Définir le site de Stock Redistribution comme nœud de stockage du Fulfilment Network, pouvant être magasin, ensemble d’entrepôts
    ou autre lieu de stockage.
  - Renommer Supply Matching en Demand / Supply Matching.
  - Exposer les notions déjà présentes de stock physique et stock logique dans le glossaire et les lier aux optimisations
    concernées.
  - Distinguer recommandations de configuration physique et logique, règles actives du Control Plane et réservations effectives
    d’Inventory State Management.
  implementation:
  - Les identifiants persistants et les parents des capacités sont conservés.
  - Policy Optimization est renommée Stock Configuration Optimization ; ses trois capacités deviennent Physical Stock Target
    Optimization, Logical Stock Protection Optimization et Reservation Rule Optimization.
  - Les descriptions détaillées, exemples, noms concrets de mise en œuvre et rapprochements marché rédigés par Codex restent
    proposés ; le Go n’en approuve pas chaque mot.
  boundaries:
  - Une cible physique recommandée ne déplace pas le stock ; Stock Redistribution décide des transferts, sans les réaliser.
  - Le stock logique qualifie les états et droits d’usage des mêmes biens physiques ; les droits de groupe ne sont pas des
    réservations individuelles.
  - Les règles de protection et de réservation actives sont maintenues dans Control Plane ; Inventory State Management tient
    les états et réservations effectifs.
  - Aucun type de site d’un progiciel, stock supplémentaire ou déploiement Beaumanoir n’est présumé.
market_position:
  microsoft_dynamics: La documentation distingue le stock physique, la disponibilité calculée, les réservations et des allocations
    virtuelles par groupe. Les transferts entre entrepôts sont documentés ; ces fonctions ne définissent pas la taxonomie
    FLOW.
  sap_s4hana: La documentation distingue les types de stock et les transferts entre lieux ; aATP distingue la protection de
    supply des contrôles de disponibilité. La création d’une réservation ne prouve pas une optimisation autonome de ses règles.
  terminology: Physical Stock Target Optimization et Logical Stock Protection Optimization sont des noms FLOW qui explicitent
    deux objets de décision différents ; leur symétrie est limitée par le rôle distinct de Stock Redistribution et des réservations.
  sources:
  - https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-on-hand-list
  - https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-allocation
  - https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/transfer-orders-warehouse
  - https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/91b21005dded4984bcccf4a69ae1300c/fc62bd534f22b44ce10000000a174cb4.html
  - https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/91b21005dded4984bcccf4a69ae1300c/9e64bd534f22b44ce10000000a174cb4.html
  - https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/f132c385e0234fe68ae9ff35b2da178c/e541e617043545a0bb60e5067d037046.html
