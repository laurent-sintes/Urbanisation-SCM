assessment:
  finding: La documentation Cegid décrit le module Négoce de Storeland, absent de la fiche produit. Il couvre clients professionnels, catalogues et prix, commandes, modes de traitement configurables, préparation et facturation.
  model_fit: Wholesale Account Management et Wholesale Sales représentent le cœur commercial. Les commandes et les options de traitement recoupent des responsabilités Supply, Achats, Logistics et Finance distinctes ; aucune capacité Négoce autonome n'est nécessaire.
  limits: L'offre documentée ne prouve pas la licence, l'activation, le paramétrage ou les usages réels du module par marque GBM. Le dossier FLOW-Program indique une couverture différenciée, à corroborer avant tout choix de convergence.
  source_urls:
  - https://retail-docs.cegid.cloud/r/fr-FR/UR/Storeland/Functional_Doc/Toutes-versions/Clients-negoce/471
