  - https://retail-docs.cegid.cloud/r/fr-FR/UR/Storeland/Functional_Doc/Toutes-versions/Preparation-de-commande-negoce/476
  - https://retail-docs.cegid.cloud/r/fr-FR/UR/Storeland/Functional_Doc/Toutes-versions/Facturation-negoce/478
glossary_alignment:
  checked: Wholesale Commerce, Wholesale Account Management et Wholesale Sales sont déjà présents et cohérents avec le périmètre commercial documenté. Les frontières avec Sales Order, Pricing, Achats, Logistics et Billing restent explicites dans le modèle.
  result: Aucun terme ni nœud métier nouveau ; aucune modification du glossaire métier nécessaire.
