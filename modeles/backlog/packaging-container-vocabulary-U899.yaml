schema_version: 1.0.0
id: packaging-container-vocabulary-U899
status: applied_verified
source_refs:
- U899
- U900
canonical_model_modified: true
current_scope:
  business_area: ba-packaging-references
  references:
  - packaging-material-reference
  - packaging-specification
  glossary_terms:
  - TER061
  - TER183
  - TER185
  - TER186
  - TER189
findings:
  microsoft: Container est bien un terme utilisé, mais ne nomme pas à lui seul tout le périmètre de conditionnement. Container
    type, container physique et règles de constitution sont distincts.
  sap: Packaging Material et Handling Unit distinguent référence de conditionnement et unité concrète ; les instructions constituent
    un autre objet.
  local: TER061 définit Container comme rôle de bien contenant ou supportant des unités. TER189 définit Handling Unit avec
    contenu annoncé ou constaté. La Business Area couvre aussi les consignes réutilisables.
recommendation:
  name: Packaging References
  reason: Conserver un nom qui couvre matières, supports et consignes, sans réduire le périmètre aux contenants.
  container_type: Employer Container Type pour préciser les types de contenants au sein du périmètre documentaire existant,
    sans créer automatiquement une nouvelle référence.
  clarification: Rendre explicite dans la documentation le rapprochement partiel avec Container Type de Dynamics et la distinction
    entre Container, Packaging Specification et Handling Unit.
  tradeoff: Packaging est moins centré sur les objets que Container ; le libellé français références de conditionnement et
    les exemples carton, palette, consigne et unité reçue précisent le sens.
market_comparisons:
- vendor: Microsoft
  source_ids:
  - MS1
  - MS2
  relationship: Recouvrement partiel
  similarity: Types de contenants et règles pour constituer les unités à expédier.
  difference: Packaging References FLOW inclut plus largement matières, supports et consignes ; la fonction de cartonisation
    reste chez l’exécutant.
  limit: Container type ne couvre pas à lui seul toute matière de conditionnement ni une spécification produit ; aucune équivalence
    un-à-un.
- vendor: SAP
  source_ids:
  - SAP1
  - SAP2
  relationship: Appui sémantique partiel
  similarity: Séparation matière de référence, instruction et unité concrète.
  difference: FLOW décrit les informations nécessaires à l’orchestration, pas le moteur d’exécution d’entrepôt.
  limit: La documentation SAP ne prescrit pas le nom ou la maille de la Business Area FLOW.
