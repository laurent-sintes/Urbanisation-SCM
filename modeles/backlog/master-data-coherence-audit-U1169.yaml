verified:
- Rattachements uniques, capacités sous Business Areas et profondeur Master Data limitée aux capacités ; 64 nœuds inchangés.
- Les cinq capacités de stewardship retirées ne réapparaissent pas et n’ont plus de lien incident ; familles documentaires
  et trois provenances Supply préservées.
- Les droits de diffusion, la certification portant sur une version et la publication sont explicitement distincts dans les
  contrats.
- 'Enrichissement facultatif : une contribution intégrée peut être soumise au changement sans cette étape ; aucune exécution
  universelle déduite du graphe.'
- 132 captures actives conservent valeurs et contextes courants. Les 130 prédécesseurs restent intacts ; les nouveaux examens
  n’élargissent pas leurs champs.
- Les nouveaux contrats détaillés restent proposés ; les accords de routage Design/Finance ne valent pas adoption de tous
  leurs champs.
- Les frontières prix de référence/prix contextualisé/prix engagé, règles métier/configuration partagée, référence de conditionnement/unité
  physique sont conservées.
- Empreintes de la release et du pointeur As Is identiques à l’état précédant U1168. Aucune nouvelle source de vérité installée
  déduite.
observations:
- kind: known_limit
  subject: Autorités sources
  finding: Les responsables par objet et attribut encore inconnus restent à documenter, notamment services, conditionnements
    et biens internes. C’est une limite déclarée, pas une attribution implicite ni une nouvelle anomalie.
- kind: known_limit
  subject: Marché
  finding: L’accord sémantique entre contributeurs et la couverture de toutes les listes de codes ne sont pas prouvés par
    les seuls passages consultés. Les fiches le disent explicitement.
- kind: not_a_defect
  subject: Vues
  finding: Les six échanges de versions publiées vers des sous-domaines sont des relations métier autorisées à ce niveau.
    Ils ne créent pas une nouvelle hiérarchie ni une nouvelle capacité ; leur agrégation ne constitue pas à elle seule un
    défaut.
- kind: not_a_defect
  subject: Scénarios
  finding: Aucun scénario Master Data ajouté par U1168. Aucun usage n’est inventé pour compléter cette couverture documentaire.
- kind: audit_limit
  subject: Tests
  finding: Les tests formels et de connectivité ne prouvent pas le sens des liens de glossaire, la fermeture des boucles de
    correction ni une réalisation installée. Les réserves ci-dessus résultent de la relecture des contrats.
findings:
- id: MDM-U1169-01
  priority: P2
  category: glossary_link_semantics
  title: Des données échangées renvoient à la définition du traitement qui les gère
  observation: Approved assortment contributions est lié à TER426, Assortment Reference Management, dont la définition décrit
    la consolidation. Reference content correction reports renvoie à TER397, le traitement de correction, et Reference access
    and subscription requests à TER411, la tenue des droits. Le lien présente donc une activité comme définition de la donnée.
    Le repérage trouve 74 libellés liés à des entrées nommées comme des traitements ; ce nombre est un indicateur de revue,
    pas une validation sémantique automatique des 74 cas.
  evidence:
  - path: modeles/backlog/model.yaml
    collection: relations
    id: REL-U1168-SOURCE-assortment
    fields:
    - data_exchange.contents
    line: 95014
  - path: modeles/backlog/glossary.yaml
    collection: terms
    id: TER426
    fields:
    - name
    - definition
    line: 47600
  - path: modeles/backlog/model.yaml
    collection: relations
    id: REL-U1168-RETURN-commerce
    fields:
    - data_exchange.contents
    line: 95383
  - path: modeles/backlog/glossary.yaml
    collection: terms
    id: TER397
    fields:
    - name
    - definition
    line: 45460
  - path: modeles/backlog/model.yaml
    collection: relations
    id: REL-U1168-REQUEST-commerce
    fields:
    - data_exchange.contents
    line: 95417
  - path: modeles/backlog/glossary.yaml
    collection: terms
    id: TER411
    fields:
    - name
    - definition
    line: 46466
  impact: Le survol explique le savoir-faire au lieu du contenu échangé ; les contrats paraissent alignés parce que leurs
    identifiants sont valides.
  recommendation: Nommer les informations échangées comme des résultats métier et relier leurs notions au bon terme, par exemple
    Assortment TER087. Réserver les liens vers une capacité au traitement effectivement nommé. Compléter le glossaire seulement
    si une notion utile manque, sans créer mécaniquement un terme pour chaque message.
  rationale: 'Cohérence du modèle : objet, résultat et savoir-faire sont distincts. Bénéfice : une définition utile au lecteur
    sans nouvelle capacité ni catalogue technique de messages.'
  approval: Proposition de correction ; aucun lien ni terme modifié par cet audit.
- id: MDM-U1169-02
  priority: P2
  category: source_correction_loop
  title: Les demandes de correction ne rejoignent pas les producteurs identifiés
  observation: Les signalements des consommateurs rejoignent Quality Remediation. REL-U1168-COMMON-remediation-source transmet
    ensuite une demande à Source Contribution Management pour obtenir une contribution corrigée. La seule sortie métier de
    cette dernière rejoint Master Data Ingestion ; aucun contrat ne transmet la demande au producteur concerné. La branche
    de correction autorisée dans Master Data existe, mais elle ne remplace pas une correction dont l’autorité est en source.
  evidence:
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: cap-mdm-quality-remediation
    fields:
    - definition
    line: 69461
  - path: modeles/backlog/model.yaml
    collection: relations
    id: REL-U1168-RETURN-supply
    fields:
    - source_id
    - target_id
    - data_exchange
    line: 95511
  - path: modeles/backlog/model.yaml
    collection: relations
    id: REL-U1168-COMMON-remediation-source
    fields:
    - source_id
    - target_id
    - data_exchange
    line: 95958
  - path: modeles/backlog/model.yaml
    collection: relations
    id: REL-U1168-COMMON-source-ingestion
    fields:
    - source_id
    - target_id
    - data_exchange
    line: 95639
  - path: modeles/backlog/model.yaml
    collection: relations
    id: REL-U1113-finance-credit-reference
    fields:
    - source_id
    - target_id
    - qualification
    line: 89466
  reproduction: 'Lire toutes les relations métier sortant de cap-mdm-source-contribution : une seule, vers cap-mdm-ingestion.
    Aucun échange sortant Master Data vers un producteur ne porte une demande de correction de source.'
  impact: Le parcours décrit comment demander une correction en interne, mais pas comment solliciter puis suivre le responsable
    source lorsque lui seul peut changer la valeur.
  recommendation: Pour les producteurs documentés, expliciter la demande de correction et le retour de décision ou de contribution
    corrigée, avec référence, version, anomalie et autorité. Garder les corrections internes autorisées comme une branche
    distincte. Ne pas imposer de réécriture automatique des systèmes sources ni de trajet identique pour tous les objets.
  rationale: 'Frontière déjà retenue par U1166/U1168 : les autorités sources sont conservées. Bénéfice : une correction traçable
    jusqu’au responsable ; compromis : distinguer correction en source et correction commune au lieu d’imposer un mécanisme
    unique.'
  approval: Complément relationnel à proposer ; aucune source inconnue ni interface installée déduite.
- id: MDM-U1169-03
  priority: P2
  category: delivery_feedback_contract
  title: Le suivi des livraisons manque de retours de réception explicites
  observation: Master Data Distribution promet de suivre livraisons, échecs et reprises, et distingue livraison technique
    et prise en compte métier. Ses seules entrées métier sont les versions publiées et les droits autorisés. Les consommateurs
    signalent les anomalies de contenu à Quality Remediation et demandent leurs droits à Access & Subscription ; aucun contrat
    ne renseigne Distribution sur la version reçue, le rejet ou la reprise attendue.
  evidence:
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: cap-mdm-distribution
    fields:
    - definition
    - scope
    line: 70847
  - path: modeles/backlog/model.yaml
    collection: relations
    id: REL-U1168-COMMON-publication-distribution
    fields:
    - data_exchange
    line: 96120
  - path: modeles/backlog/model.yaml
    collection: relations
    id: REL-U1168-COMMON-access-distribution
    fields:
    - data_exchange
    line: 96157
  - path: modeles/backlog/model.yaml
    collection: relations
    id: REL-U1166-MDM-TO-SUPPLY-REFERENCES
    fields:
    - data_exchange
    - qualification
    line: 94915
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: master-data-ingestion
    fields:
    - scope
    line: 37935
  reproduction: 'Examiner toutes les relations métier entrantes de cap-mdm-distribution : publication et droits uniquement
    ; zéro retour depuis les consommateurs.'
  impact: La carte décrit ce qui est envoyé, mais pas les informations permettant de distinguer une livraison réussie, une
    version non reçue et un rejet. Elle ne suffit donc pas à expliquer le suivi annoncé.
  recommendation: 'Préciser le résultat de livraison attendu et les retours nécessaires à son suivi : version, destinataire,
    réception ou rejet et motif. Distinguer ces retours des anomalies de contenu ; une éventuelle prise en compte métier reste
    séparée et ne se déduit pas de la réception. Ne pas imposer un protocole technique ou un accusé applicatif universel.'
  rationale: Cohérence entre responsabilité déclarée et information reçue. Les mécanismes Dynamics et SAP consultés distinguent
    aussi états de transfert et résultats ; ils appuient cette distinction sans imposer leur technologie à FLOW.
  approval: Complément de contrat à proposer ; aucune réalisation installée présumée.
