  glossary_term: TER155
  glossary_name: Customer Credit Control
  scenario_id: customer-credit-hold
  path_ids:
  - customer-credit-hold-path
  - credit-review-no-response-path
  finding: Le contrôle existe dans les textes et parcours, mais aucune capacité nommée Credit Check ne matérialise le résultat
    décisionnel.
  limits: Le scénario principal décrit surtout le blocage et la reprise ; les données nécessaires et le contrôle favorable
    avant progression sont peu visibles.
recommendation:
  candidate_id: credit-check-decision
  kind: capability
  name: Credit Check Decision
  nature: decision
  parent_id: ba-order-lifecycle-management
  parent_name: Order Lifecycle Management
  subdomain_id: D04
  subdomain_name: Order Management
  definition: Déterminer si une commande client peut franchir une étape soumise au contrôle de crédit, selon les informations
    et les règles fournies ou le résultat rendu par Finance.
  finality: Autoriser ou retenir la progression d’une vente avec un résultat financier explicable et applicable à cette commande.
  scope:
  - Identifier la commande et sa version, le client ou payeur concerné, le montant, la devise, l’étape et le périmètre financier
    contrôlés.
  - Obtenir les informations financières nécessaires, ou un résultat de contrôle fourni par Finance ; conserver leur origine,
    date et validité.
  - Appliquer les règles financières autorisées lorsque les informations suffisantes sont disponibles ; sinon consommer le
    résultat de Finance, sans lui substituer une appréciation de risque inventée.
  - Rendre une autorisation, un blocage, une demande de réexamen ou un résultat indéterminé, avec motif, portée, règle et
    version utilisées.
  - Vérifier la validité du résultat pour l’étape et la version de commande concernées ; une modification pertinente peut
    nécessiter un nouveau contrôle.
  - Distinguer information manquante, périmée ou réponse indisponible d’un refus financier ; aucune de ces absences ne constitue
    une autorisation implicite.
  - Les calculs nécessaires à cette décision en font partie ; aucune capacité supplémentaire de récupération ou de Visibility
    n’est créée par défaut.
  behaviors: []
  decomposition_rationale: Une responsabilité décisionnelle distincte suffit. Calcul local sur règles autorisées et consommation
    d’un résultat externe sont des modes de réalisation, pas deux comportements métier imposés.
  benefits:
  - Montrer au métier le savoir-faire qu’il nomme Credit Check.
  - Séparer le résultat financier du registre de commandes et du moteur de processus.
  - Distinguer la couverture physique d’Availability de l’admissibilité financière.
  boundaries:
    finance: Finance conserve l’autorité sur le risque, les limites, l’encours et l’exposition d’entreprise, ainsi que les
      dérogations. Le calcul financier peut rester chez elle.
    references: Party / Role et Agreement portent les profils, règles et conditions de référence. L’encours courant et le
      résultat relatif à une commande ne deviennent pas automatiquement des références maîtres.
    sales_order: Sales Order conserve identité, engagements, blocage et validité de la transition ; il applique seulement
      le résultat utilisable et autorisé.
    process_management: Le processus sollicite la décision, organise l’attente ou le travail humain et conduit la suite. Sentry
      ne se donne pas de dérogation financière.
    availability: Une autorisation de crédit ne prouve ni disponibilité, ni promesse, ni réservation de stock.
    fulfilment: La coordination ne reçoit de suite que dans la portée autorisée et après vérification des autres conditions
      ; un contrôle favorable ne vaut pas réalisation physique.
  integration_limit: Les données nécessaires et le résultat peuvent être obtenus à la demande ; aucun appel technique, fournisseur,
    interface ou réalisation installée n’est présumé. Reference Ingestion conserve son rôle sur les seules références.
  pending_choice: Capacité et rattachement appliqués sous U894 ; les nouvelles rédactions restent proposées et la publication
    est distincte.
glossary_alignment_plan:
  term_id: TER155
  preserve_current_identity: true
  current_name: Customer Credit Control
  business_phrase: Credit Check
  capability_name: Credit Check Decision
  changes:
  - Rendre Credit Check découvrable depuis le terme existant et expliciter le résultat décisionnel dans sa définition courte
    et son contexte.
  - Conserver le lien avec les règles et profils de référence sans assimiler l’encours ou le résultat de commande à un référentiel.
  - Relier les nouvelles rédactions au terme métier et aux responsabilités du modèle ; préserver les publications historiques.
use_case_proposal:
  existing_scenario_id: customer-credit-hold
  proposed_name: Customer Credit Check and Hold
  proposed_title: Contrôler le crédit avant d’avancer dans une vente
  existing_main_path_id: customer-credit-hold-path
  preserve_no_response_path_id: credit-review-no-response-path
  purpose: Éprouver la décision financière et ses effets sur la progression d’une commande, sans créer un scénario concurrent.
  nature: illustrative
  situation: Une commande client de 3 000 euros doit franchir une étape soumise au contrôle de crédit. La limite est de 10
    000 euros et l’exposition avant cette commande est de 8 000 euros, selon le périmètre fourni par Finance.
  assumptions:
  - Cas fictif ; ces montants et ce calcul ne constituent ni une règle universelle ni une observation Beaumanoir.
  - La règle financière du cas porte sur l’exposition projetée et la limite ; l’exposition préalable exclut explicitement
    cette commande pour éviter un double compte.
  - Montants, devise, parties, périmètre et validité sont compatibles et communiqués ; d’autres règles peuvent exister dans
    d’autres cas.
  steps:
  - title: Obtenir la base du contrôle
    action: Disposer de la version de commande et des profils ou règles valides ; obtenir l’exposition courante de Finance
      ou son résultat corrélé à cette commande.
    result: Informations identifiées et suffisantes pour ce contrôle, sans inventer l’encours à partir du seul classement
      client.
    capability_ids:
    - master-data-ingestion
    - credit-check-decision
    - D04.i
    boundary: Reference Ingestion reçoit les profils et règles ; Credit Check Decision obtient les données ou le résultat
      nécessaires à la décision particulière.
  - title: Déterminer si la vente peut avancer
    action: Dans le cas décrit, l’exposition projetée est de 11 000 euros. Le contrôle ne permet pas le franchissement de
      l’étape ; le résultat garde son motif et sa portée.
    result: Sales Order conserve le blocage correspondant ; Process Management maintient l’attente ou sollicite la suite prévue.
    capability_ids:
    - credit-check-decision
    - D04.i
    - order-workflow-orchestration
  - title: Réexaminer sur une information financière reconnue
    action: Finance reconnaît un paiement et fournit une exposition préalable révisée à 6 000 euros. Process Sentry sollicite
      le nouveau contrôle.
    result: Une nouvelle décision est demandée pour la version et l’étape concernées ; l’information seule ne lève pas le
      blocage.
    capability_ids:
    - order-workflow-sentry
    - credit-check-decision
  - title: Appliquer le résultat autorisé
    action: Avec 9 000 euros projetés et les autres règles du cas satisfaites, le contrôle autorise l’étape. Sales Order enregistre
      la levée dans cette portée.
    result: Process Orchestration peut poursuivre lorsque les autres conditions sont remplies, sans créer de nouvelle commande
      ni déduire une disponibilité physique.
    capability_ids:
    - credit-check-decision
    - D04.i
    - order-workflow-orchestration
  variants:
  - Une dérogation est nécessaire: le travail humain recueille la décision d’une personne habilitée, son auteur, son motif
      et sa portée. La seule sollicitation ne vaut pas accord.
  - La réponse manque ou les données sont périmées: le contrôle reste indéterminé et l’étape n’est pas autorisée par défaut.
      Conserver le parcours existant sans réponse.
  - Le montant, le payeur ou une autre donnée pertinente change: vérifier si le contrôle précédent couvre encore la version
      de commande ; sinon demander un nouveau résultat.
  - Plusieurs commandes sont traitées: Finance reste responsable de l’exposition dans son périmètre ; un montant disponible
      ancien n’autorise pas silencieusement toutes les ventes concurrentes.
  invariant: Une même commande continue après la décision autorisée. Autorisation financière, engagement commercial, disponibilité
    physique et exécution restent distincts.
market_comparison:
- vendor: Microsoft
  product: Dynamics 365 Finance
  concept: Credit management blocking rules and sales order release
  similarities: Les règles financières confrontent la commande aux informations de crédit et peuvent retenir sa progression,
    puis permettre une reprise contrôlée.
  differences: Le produit couvre aussi la gestion des limites et d’autres fonctions financières. La capacité FLOW proposée
    porte seulement l’admissibilité d’une étape de vente.
  flow_choice: Credit Check Decision matérialise ce résultat ; les données de référence, la transition de commande et le parcours
    gardent leurs responsables.
  source_id: S01
  evidence_limits: Recouvrement fonctionnel partiel ; la documentation ne prescrit ni ce nom de capacité ni sa Business Area
    FLOW.
- vendor: SAP
  product: SAP S/4HANA Sales / SAP Credit Management
  concept: Credit check in sales order processing
  similarities: Le contrôle intégré à la vente peut conduire au blocage, à l’examen financier puis à la libération de la commande.
  differences: La solution comprend aussi notation et calcul de limites, qui restent hors de la capacité opérationnelle FLOW
    proposée.
  flow_choice: Faire apparaître la décision de passage au contrôle financier, tout en conservant l’autorité de Finance sur
    le risque et les dérogations.
  source_id: S02
  evidence_limits: Recouvrement partiel ; l’intégration dans un produit ne démontre pas un placement organisationnel identique
    ni une réalisation Beaumanoir.
