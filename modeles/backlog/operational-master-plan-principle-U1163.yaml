distinct_contribution:
  complete_order_context: Le cycle complet des commandes précise les informations et engagements disponibles pour décider.
  coordinated_decisions: Le résultat global de la Supply précise les objectifs et les conséquences à comparer entre décisions.
  operational_master_plan: Le nouveau principe précise où et quand la décision, les opérations et le retour sur leurs effets
    se rejoignent.
