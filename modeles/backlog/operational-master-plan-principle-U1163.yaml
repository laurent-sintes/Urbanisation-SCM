glossary_alignment: TER100, TER111 et TER133 décrivent déjà un plan opérationnel versionné, les décisions et l’application
  autorisée, avec des moteurs éventuellement distincts. Le principe proposé les explicite sans transférer les faits ni les
  engagements. Aucun changement de sens requis dans le glossaire à ce stade.
integration_proposal:
- Présenter ce choix après le cycle complet des commandes, avant les choix de frontières et de représentation.
- À l’application, ajouter le principe canonique et ses appuis, puis des liens de lecture ciblés depuis Master Plan et son
  terme métier. Conserver les définitions courtes et les tooltips simples.
- Capturer uniquement les champs et portées effectivement approuvés sur le lot final ; ajouter les exigences de livraison
  à cette étape.
qualification: Proposition de formulation et de comparaison après U1163. Le bénéfice est attendu et conditionnel ; aucune
  adoption globale des textes, équivalence éditeur, supériorité universelle ou réalisation installée présumée.
