proposed_principle:
  proposed_id: PRINCIPLE-OPERATIONAL-MASTER-PLAN
  name: Operational Master Planning and Decision Feedback
  label_fr: Le Master Plan place la décision au cœur des opérations
  summary: Le Master Plan rapproche commandes, stocks, arrivées attendues et règles applicables pour comparer les options
    pendant les opérations. Les choix autorisés sont appliqués et leurs résultats observés afin de pouvoir réagir au prochain
    changement.
  statement: Rapprocher dans le Master Plan le contexte opérationnel utile, la comparaison des options, la décision et le
    suivi de ses effets pour raccourcir le délai entre un changement constaté et une réponse applicable.
  rationale: Une décision prise sur une extraction ancienne peut arriver après une nouvelle promesse, une réservation ou un
    retard. Garder le contexte de décision proche des commandes et des faits facilite le réexamen des options au moment où
    elles peuvent encore produire un effet utile.
  implications:
  - Relier observation, comparaison des options, décision, application autorisée et constat du résultat. Rendre explicites
    la fraîcheur des données, les versions, les objectifs, les contraintes et les engagements à préserver.
  - Le sous-domaine Master Plan réunit les responsabilités de préparation, calcul, simulation et arbitrage déjà décrites.
    Master Planning garde le calcul des besoins nets ; Plan Application transmet et suit les changements autorisés. Les familles
    de commandes conservent leurs engagements et leurs règles de transition.
  - Les registres de stock et de processus restent responsables de leurs faits. Le Master Plan mobilise le contexte utile
    sans devenir le propriétaire de toutes les données de l’entreprise.
  - Le pilotage opérationnel peut lire les faits et résultats disponibles sans exiger une extraction complète préalable vers
    une plateforme analytique. Cette possibilité est à étudier par usage, avec les droits, la charge, la conservation et la
    qualité nécessaires.
  expected_benefits:
  - Réduire le temps entre un événement, son appréciation et l’application d’une réponse autorisée.
  - Comparer les options avec un contexte plus actuel et complet, puis vérifier leurs effets.
  - Selon la réalisation retenue, réduire les copies, transferts et traitements entretenus uniquement pour le pilotage opérationnel,
    ainsi que leur délai de mise à jour.
  tradeoffs:
  - Davantage de données ne garantit ni une meilleure décision ni un calcul plus rapide. Qualité, cohérence, fraîcheur, sélection
    des informations utiles et capacité de calcul conditionnent le bénéfice.
  - L’intégration de la décision aux opérations laisse ouverts les moteurs, services et stockages. L’isolation des calculs
    peut protéger les transactions et améliorer la réactivité.
  - Les analyses transverses, l’historique long et les études spécifiques peuvent justifier une plateforme analytique distincte.
    Aucune suppression générale du datalake ou de la BI, aucun gain chiffré ni déploiement Beaumanoir ne sont déduits.
  example: 'Exemple fictif : une arrivée fournisseur est retardée. Le Master Plan rapproche les commandes concernées, le stock
    utilisable, les autres arrivées et les priorités applicables. Il compare réaffectation, transfert et livraison partielle.
    Les capacités responsables appliquent les choix autorisés ; les faits enregistrés permettent ensuite de suivre les commandes
    encore exposées et le résultat des décisions.'
  counterexample: Un tableau de bord signale une pénurie à partir de données extraites la veille, tandis que de nouveaux engagements
    ont été pris. Le calcul d’un nouveau seuil ne suffit pas à établir quelles commandes peuvent encore être modifiées ni
    si le changement a été appliqué.
