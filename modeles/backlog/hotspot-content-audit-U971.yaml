grouping_proposals:
- id: A971-G01
  recommendation: merge_proposal
  members:
  - HS-002
  - HS-011
  related:
  - HS-016
  proposed_title: Construction du plan de fulfilment et partage des décisions avec les logisticiens
  rationale: 'Même arbitrage : quelle maîtrise garder dans FLOW selon le mandat du logisticien ? Le multi-prestataires est
    une variante, pas une seconde question de convergence.'
  boundaries: Distinguer choix du stock/site pour la promesse, choix des services/exécutants, libération des ordres et opérations
    internes. Le magasin/entrepôt de HS-016 reste un sujet lié jusqu’à comparaison détaillée.
  options:
  - FLOW construit et libère les plans de tous les prestataires.
  - Le logisticien propose, FLOW choisit et engage lorsque les garanties sont qualifiées.
  - 'Mandat mixte : proposition pour les partenaires capables de la garantir, construction FLOW pour les partenaires exécutants.'
  location:
  - D06
  - domain-logistics-execution
  identity_policy: Conserver HS-002 comme identité proposée ; ne pas réutiliser ni supprimer HS-011. Le masquer seulement
    après accord et conserver provenance, variantes, options et références dans la fiche commune.
  source_ids:
  - A971-REF-003
  - A971-REF-048
  - A971-REF-049
- id: A971-G02
  recommendation: related_keep_separate
  members:
  - HS-003
  - HS-012
  rationale: 'Même chaîne de stock, mais deux décisions : obtenir une fraîcheur suffisante et rapprocher les faits sans doubles
    comptes. Ne fusionner que si le même contrat et les mêmes critères de décision couvrent les deux.'
- id: A971-G03
  recommendation: related_keep_separate
  members:
  - HS-008
  - HS-025
  rationale: Règle commerciale Wholesale et qualité/performance d’un calcul sont différentes. Un calcul performant ne résout
    pas l’arbitrage de convergence Wholesale.
- id: A971-G04
  recommendation: shared_design_workstream
  members:
  - HS-017
  - HS-030
  rationale: Ressaisies, changements d’écran et tableurs peuvent partager un chantier design. Garder les cas et leurs localisations
    métier ; ils ne prouvent pas une même cause.
- id: A971-G05
  recommendation: related_keep_separate
  members:
  - HS-020
  - HS-024
  - HS-029
  rationale: Fonctions à reconduire, continuité des dossiers et contrat de suivi fournisseur sont trois décisions. CBS dans
    deux titres ne suffit pas à les fusionner.
- id: A971-G06
  recommendation: possible_split
  members:
  - HS-024
  rationale: Séparer CBS et SAV si leurs propriétaires, états et trajectoires de continuité diffèrent ; ne pas créer deux
    identifiants sans cet inventaire.
- id: A971-G07
  recommendation: portfolio_topic
  members:
  - HS-031
  related:
  - HS-001
  - HS-020
  - HS-024
  rationale: Tenir une grille de qualification commune des services ; les arbitrages concrets restent dans les fiches spécialisées,
    pas dans une fusion géante.
