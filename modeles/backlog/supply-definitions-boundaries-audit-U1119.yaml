  - ids:
    - D04
    - D04.i
    - D04.j
    - sales-order-preorder
    - D04.l
    - D04.m
    conclusion: Identité et engagement d’une commande, précommande existante, proposition d’achat amont, retour client/fournisseur
      et résolutions financières sont distingués sans réalisation physique absorbée.
  process_fulfilment_services:
  - boundary: Process Ledger / Inventory Ledger / Orders
    ids:
    - process-ledger
    - D01.g
    - inventory-ownership-ledger
    - D04
    - REL-U1115-inventory-case-references
    - REL-U1115-ownership-case-references
    conclusion: Process Ledger conserve histoire du Case, deux dates, versions et corrections. Les ledgers stock/propriete
      conservent leur autorite et leurs effets. Orders conserve etats, engagements et transitions. Les references ne creent
      ni second effet de stock ni transition autorisee.
  - boundary: Sentry / Tracking / Reconciliation / Ledger
    ids:
    - order-workflow-sentry
    - D07.d
    - D07.c
    - REL-U1113-sentry-events
    - REL-U1113-reconciled-events-sentry
    conclusion: Sentry correle les evenements et qualifie la reaction autorisee ; Tracking capte et integre les faits, Reconciliation
      qualifie le realise face a l attendu. Ledger conserve aussi les evenements sans reaction immediate ; aucune double imputation
      presume.
  - boundary: Ledger / Mining / Visibility / Reporting
    ids:
    - process-ledger
    - process-mining
    - BHV082
    - operational-analysis-reporting
    - REL-U1113-ledger-mining
    - REL-U1113-ledger-visibility
    - REL-U1113-mining-reporting
    conclusion: Mining analyse explicitement les traces de Process Ledger. Visibility restitue situation courante/passee ;
      Reporting utilise les mesures et leur filiation. Le modele ne fait ni de Mining le teneur du registre ni des vues une
      source de traces concurrente.
  - boundary: Process / Fulfilment / Service Orders / Logistics
    ids:
    - order-workflow-orchestration
    - D06.d
    - D06.f
    - subdomain-service-orders
    - ba-goods-processing-order-management
    - domain-warehousing
    - domain-transportation
    - domain-customs-management
    conclusion: Les scopes canoniques donnent le parcours a Process, la coordination deleguee a Fulfilment, les engagements
      de prestation aux familles Service Orders. Passif signifie sans orchestration autonome, avec etats/invariants. Logistics
      organise et realise ses operations internes.
  - boundary: Transport Plan / plan local Logistics
    ids:
    - transport-plan-decision
    - subdomain-transport-planning-dispatch
    - service-order-transport
    - service-order-release-decision
    conclusion: Les scopes distinguent le mandat confie de son organisation locale et refusent deux calculs pour le meme mandat.
      Booking, choix de service, construction de plan et liberation gardent leurs objets/resultats propres.
  - boundary: Services financiers / Finance
    ids:
    - service-order-billing
    - service-order-payment-collection
    - ba-financial-service-order-management
    - subdomain-financial-accounting
    conclusion: Billing tient facture/avoir autorise, Payment encaissement/remboursement clients. Decision commerciale et
      autorites fiscales/financieres, comptabilite, tresorerie et paiements fournisseurs restent distincts.
  - boundary: Rattachement Order Backlog actuel
    ids:
    - domain-plan
    - ba-order-backlog-management
    - D06.b
    conclusion: Le contains courant place Order Backlog Management dans Master Plan. D06.b.scope est coherent sur ce point
      ; la piste fondee sur les reperes U1080 historiques a ete retiree.
  adjacent_domains:
  - boundary: Commerce / Supply Chain Management
    state: coherent_in_scopes
    evidence:
    - id: domain-sales
      field: fields.scope
      quote: Commerce détermine les prix applicables et les dispositifs commerciaux
      collection: nodes
    - id: domain-sales
      field: fields.scope
      quote: '[Sales Order](model:D04.i) tient l’identité et les transitions autorisées ; les canaux ne créent pas un cycle
        concurrent.'
      collection: nodes
    reading: Les opérations magasin et la caisse restent commerciales ; les commandes à servir et leurs engagements sont Supply
      Chain Management. Une vente encaissée/emportée n’est pas forcée en commande restant à servir.
  - boundary: Sourcing and Procurement / Supply Chain Management
    state: coherent_in_scopes
    evidence:
    - id: domain-sourcing-procurement
      field: fields.scope
      quote: '[Purchase Order](model:D04.j) y conserve le document, ses états et ses transitions autorisées ; aucun cycle
        concurrent n’est créé.'
      collection: nodes
    reading: Sources, sélection, accords et Cases d’achat restent Procurement ; le cycle documentaire et les engagements de
      Purchase Order restent Supply Chain Management. Conduire un parcours ne crée pas une seconde autorité de commande.
  - boundary: Logistics / Supply Chain Management
    state: coherent_in_scopes
    evidence:
    - id: domain-logistics-execution
      field: fields.scope
      quote: FLOW coordonne les engagements entre acteurs ; [Logistics](glossary:TER110) décide de ses moyens, de ses vagues
        de préparation et de ses tournées.
      collection: nodes
    - id: domain-customs-management
      field: fields.scope
      quote: '[Customs Clearance Order](model:service-order-customs-clearance) FLOW confie et suit la prestation ; les autorités
        rendent les décisions applicables.'
      collection: nodes
    reading: Réalisation et pilotage local se distinguent des prestations confiées et de la coordination transverse. Le simple
      mot organiser dans deux définitions ne démontre pas un doublon.
  - boundary: Finance / Supply Chain Management
    state: coherent_in_scopes
    evidence:
    - id: domain-finance
      field: fields.scope
      quote: Les domaines opérationnels restent responsables des faits qu’ils transmettent.
      collection: nodes
    - id: TER154
      field: context
      quote: La trésorerie, la tenue comptable générale et le recouvrement des impayés restent hors périmètre.
      collection: terms
    - id: TER190
      field: context
      quote: Finance conserve l’autorité sur le risque, les limites et les dérogations.
      collection: terms
    reading: Le service Payment Supply Chain Management reconnaît encaissements/remboursements clients sans récupérer trésorerie/comptabilité/recouvrement
      ou paiement fournisseurs. Un profil reçu ne vaut pas décision de crédit sur une commande.
  - boundary: Design & Development / Supply Chain Management
    state: coherent_in_scopes
    evidence:
    - id: domain-product-portfolio-collection
      field: fields.scope
      quote: '[Demand & Supply Plan Preparation](model:ba-demand-supply-plan-preparation) qualifie une version prévisionnelle
        pour le [Master Plan](model:domain-plan), sans reprendre l’autorité de la prévision amont.'
      collection: nodes
    - id: TER372
      field: context
      quote: '[Demand & Supply Forecasting](model:subdomain-demand-supply-forecasting) en porte la responsabilité dans [Design
        & Development](glossary:TER105).'
      collection: terms
    reading: Le Forecast Plan source et les définitions produit restent externes ; plans opérationnels, qualification locale,
      calcul net et affectations sont distingués. Définition locale des références ne vaut pas conception produit ni maîtrise
      entreprise.
  - boundary: Operational References / autorités entreprise
    state: local_authority_preserved_in_canonical_definition_and_scope
    evidence:
    - id: business-references
      field: fields.mastership
      quote: Source de vérité locale du domaine pour les sujets de référence ; maîtrise d’entreprise externe.
      collection: nodes
    - id: master-data-ingestion
      field: fields.scope
      quote: Le domaine tient la source de vérité locale Supply ; il ne négocie pas les accords, ne conçoit pas commercialement
        les offres et ne corrige pas silencieusement les maîtres d’entreprise.
      collection: nodes
    reading: 'U479 est présent dans le canonique. Les mastership: external des références désignent les autorités amont et
      ne suffisent pas à prouver que la responsabilité locale est passive.'
false_positives_and_known_limits:
  not_findings:
  - 'D05.a utilisé par Availability ne signifie pas que la capacité appartient encore à Availability : le texte peut décrire
    un consommateur légitime.'
  - Availability peut envisager un transfert pour une promesse ; ce n’est pas la décision de redistribution du stock réseau
    détenue par Stock Redistribution.
  - Le réexamen d’une promesse existante est couvert par Order Promising ; la finalité de D03 « avant confirmation » peut
    s’entendre avant sa confirmation révisée et ne suffit pas à prouver une exclusion.
  - Les deux usages du calcul net dans Master Planning et Requirement-based Replenishment ne suffisent pas à exiger une fusion
    ni une suppression.
  - 'Les capacités de Stewardship ne sont pas des doubles référentiels : elles portent la tenue/cohérence locale ; les références
    restent des informations métier documentaires.'
  - Les préfixes D/BHV historiques ne déterminent ni nature ni parent courant ; aucune anomalie déduite de ces seuls identifiants.
  - objects:
    - domain-sourcing-procurement
    - D03.j
    - TER045
    - D05.f
    reason: La mobilisation CTP par Master Planning est explicitement prévue dans TER045 et D03.j ; ne pas la déclarer contradictoire
      au seul motif que CTP est sous Availability. Faisabilité, proposition, achat et engagement restent distincts.
  - objects:
    - business-references
    - TER123
    - D08
    - D09
    - D11
    - customer-credit-profile
    reason: L’autorité entreprise externe est compatible avec une source de vérité locale active. Le token mastership external
      n’est pas à requalifier globalement sans lire son contexte.
  - objects:
    - TER035
    - TER083
    - TER084
    reason: Les sens local FLOW, ressources et chaîne élargie sont déjà distingués. Le réexamen de Supply Chain Management
      ne doit pas les fusionner par seul voisinage lexical.
  - objects:
    - domain-sales
    - domain-logistics-execution
    reason: Les verbes organiser, préparer et réaliser existent dans les deux domaines, mais scopes magasin/canaux et prestations
      logistiques confiées sont explicités ; aucun doublon canonique démontré sur ce seul vocabulaire.
  process_limits:
  - Aucune couverture installee exhaustive des sources de Process Ledger n est pretendue ; les lacunes sont explicites. Direct
    et via Sentry gardent une identite source unique, sans capture forcee hors Case.
  - Les mecanismes generiques Process Management peuvent servir les Cases Commerce/Procurement sans absorber leurs regles
    ni decisions. Le credit client reste sous son autorite financiere.
  - Les mandats precis de transport et voies de justificatifs financiers conservent les reserves U1115 ; aucune realisation
    ou responsabilite supplementaire deduite.
  - Homonymie partielle Service Management Dynamics/SAP analysee par la racine ; aucune equivalence ni proposition automatique
    de renommage ici.
  market_known_gaps:
