  naming: Supply Chain Management est le nom adopté sous U1121 à périmètre constant. L’applicabilité U1120 et les responsabilités
    réelles priment sur l’exhaustivité d’une suite logicielle.
  proposed_correction_groups: 0
  aligned_during_rename_U1121:
  - SCOPE-U1119-04
  clarifications_applied_U1122: 7
applicability_U1120:
  source_refs:
  - U1120
  production: Beaumanoir ne fabrique pas ; la production n’est donc pas représentée. Cette absence relève de l’applicabilité
    et ne constitue ni une lacune à corriger automatiquement ni une exclusion de principe du Supply Chain Management.
  logistics: La réalisation logistique est externalisée. Le domaine conserve le pilotage des engagements confiés et la coordination
    transverse ; Logistics conserve le choix de ses moyens, l’organisation et la réalisation locales.
  orders: Le domaine couvre le cycle de vie complet des commandes ayant un impact sur le stock, côté achat comme commerce,
    avec leurs engagements et changements autorisés.
  commerce_channels: Le pilotage commercial des canaux, du réseau et du backoffice demeure hors de ce domaine. Aucun cycle
    concurrent de commande ni responsabilité commerciale supplémentaire n’est déduit.
  limits: Ces précisions qualifient le périmètre métier ; elles ne prouvent pas la réalisation installée de chaque capacité.
