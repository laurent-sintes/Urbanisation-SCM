  domain_id: supply-chain-orchestration
  adopted_name: Supply Chain Management
  previous_name: Supply Chain Orchestration
  scope_change: false
  reason: Le domaine gère les commandes et leurs engagements, les stocks et leur propriété, les plans et arbitrages, les politiques,
    les références locales et la conduite des processus, en plus de la coordination des prestations. Ce périmètre justifie
    Management. L’absence de fabrication applicable et le pilotage commercial des canaux hors scope ne retirent pas ces responsabilités.
