  effect: Les définitions, scopes et commentaires FLOW ne donnent pas tous le même responsable au plan collectif, aux paramètres
    de protection et aux affectations. BHV066 attribue aussi les possibilités de promesse à Order Management. Le booking externe
    est distinct d’une affectation interne ou d’une réservation de stock.
  correct_boundary: Master Plan porte le plan collectif ; Order Backlog Management et Supply Assignment décident priorités
    et affectations ; Stock Optimization recommande cibles, droits, conditions et apports. Availability établit les possibilités
    de promesse ; Order Management tient les engagements et transitions ; Inventory Management tient les réservations. Le
    booking de transport porte l’engagement pris auprès d’un prestataire.
  recommendation: Corriger les seuls passages qui attribuent encore une responsabilité à son ancien parent, ainsi que TER177
    et les synthèses FLOW qui les reprennent. Dans Transport Booking Order, nommer Supply Assignment si le texte vise l’affectation
    des ressources aux demandes, ou Reservation si leur protection est visée, sans inventer une nouvelle gestion de capacité
    interne. Conserver les mécanismes et la décomposition des comportements.
  related_clarifications:
  - SCOPE-U1119-CLAR-04
  examples_and_market_check: Les exemples autre collecte/panne et reservation maritime restent compatibles. D06.market_inspiration.flow_scope
    et D06.f.market_inspiration.flow_scope recopient le defaut. Aucun terme autonome Transport Booking Order ni la phrase
    allocation interne dans glossary.yaml ; TER112 et TER017 portent les distinctions actuelles.
  limits: Les mentions d’Availability comme consommateur de plans, de règles ou de possibilités sont légitimes. Elles ne sont
    pas toutes des transferts de responsabilité. Les huit reprises market_comparisons.flow_position de D02.b/D05.d et les
    quatre autres chemins sont des échos de ce même groupe, pas des défauts supplémentaires.
