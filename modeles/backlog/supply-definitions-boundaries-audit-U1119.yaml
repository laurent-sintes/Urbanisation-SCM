      et production des plans locaux sont séparées.
  - ids:
    - D05.f
    - D05.e
    - BHV083
    - ba-master-plan-management
    conclusion: 'Le netting de Master Planning et celui du réassort ne prouvent pas deux propriétaires concurrents : le premier
      établit le bilan versionné global, la décision spécialisée instruit les quantités/dates d’apport et les contraintes.
      Le scope explicite leur coopération.'
  - ids:
    - D03.o
    - D02.e
    - D02.c
    - D04
    conclusion: Choix des affectations, matérialisation autorisée, réservation opposable et confirmation d’engagement restent
      explicitement distincts.
  - ids:
    - delivery-release-decision
    - ba-order-backlog-management
    - D04.i
    conclusion: La décision de livraison du carnet est distincte de son application par Sales Order et de la libération des
      Service Orders en aval.
  - ids:
    - D03
    - ba-order-promising
    - D03.i
    - D03.j
    - D03.k
    conclusion: Availability est recentré sur les possibilités de promesse ; ATP ressources admissibles, CTP faisabilité d’apport,
      PTP compromis économique. Ces angles se composent, sans trois engagements concurrents.
  - ids:
    - D01.f
    - D01.g
    - inventory-ownership-ledger
    - D01.h
    - D01.c
    conclusion: Captation, historique du stock, reconnaissance de propriété, historique de propriété et composition des positions
      ont des résultats distincts ; déplacement, propriété et comptabilité ne sont pas assimilés.
  - ids:
    - D05.h
    - D02.b
    - D02.c
    - demand-fulfilment-policy-management
    conclusion: Recommandation de règles, activation/version applicable et engagement individuel sont séparés. Une politique
      nouvelle ne libère pas silencieusement les réservations existantes.
  - ids:
    - business-references
    - master-data-ingestion
    - cap-merchandise-reference-stewardship
    - cap-partner-agreement-reference-stewardship
    - cap-packaging-reference-stewardship
    - cap-internal-supplies-reference-stewardship
    - cap-service-reference-stewardship
    conclusion: Réception des apports et cohérence des vues métier locales sont distinguées ; la maîtrise d’entreprise demeure
