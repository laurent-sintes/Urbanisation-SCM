method:
  reading: Lectures ciblées inspect_model et structured_io ; comparaison des responsabilités et des parents courants, sans
    déduire un défaut d’un seul nom ou d’un champ omis.
  consolidation: Fusion des constats d’anciennes attributions à Availability des volets planning et processus en un seul groupe.
    Les échos dans le glossaire et les commentaires marché restent rattachés au même groupe.
  evidence: Identifiants persistants, champs et extraits du baseline ; recommandations distinctes des constats et des améliorations
    rédactionnelles facultatives.
  market: La matrice dédiée supply-scope-dynamics-U1119.yaml conserve les comparaisons Dynamics, les appuis SAP S/4HANA, les
    sources et leurs limites. Ce rapport ne reproduit pas un second catalogue de sources.
  agreement: U1121 adopte le nouveau nom du domaine, seul nom nouvellement capturé par record_decision. TER035 est aligné
    éditorialement sur Supply Chain Management avec le même identifiant et la même définition, sans accord autonome sur le
    terme. Les corrections des cinq autres groupes et les clarifications restent proposées ; aucune adoption ni application
    implicite.
executive_summary:
  conclusion: Les principales frontières du domaine restent cohérentes dans l’arbre et les scopes de référence. Sur les six
    groupes de reliquats constatés au baseline, SCOPE-U1119-04 a été aligné pendant U1121 et les cinq autres sont corrigés
    par U1122. Les sept clarifications rédactionnelles sont appliquées dans le même lot, sans nouveau périmètre, maître commun
    ni changement de structure. Les lacunes documentaires et les limites de preuve restent explicites.
  correction_groups: 6
  by_priority:
    P2: 4
    P3: 2
  additional_proposed_clarifications: 0
  order:
  - id: SCOPE-U1119-01
    title: D’anciennes attributions placent encore le collectif et l’optimisation du stock dans Availability
    priority: P2
  - id: SCOPE-U1119-02
    title: Trois commentaires de Fulfilment attribuent encore le parcours à Order Management
    priority: P2
  - id: SCOPE-U1119-03
