rationale: Le domaine gère les plans, les stocks et le cycle des commandes à impact stock, achats comme commerce. La production
  est hors applicabilité Beaumanoir ; la logistique externalisée conserve ses réalisateurs. Le pilotage commercial des canaux,
  le sourcing et les décisions financières restent distincts. Un périmètre produit ERP ne fixe pas le domaine métier.
