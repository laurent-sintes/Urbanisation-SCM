  - subdomain-plans
  preserved: Les seize capacités conservent leurs identités, résultats propres et un seul parent. Les stratégies actives restent
    dans Supply Policy Management ; interpréter les plans ne devient ni leur ingestion ni leur production.
  stock_redistribution_boundary: Son rattachement au Master Plan était cohérent dans U1009. Le regroupement demandé en U1011
    justifie de la présenter avec les autres optimisations du stock ; le plan reste consommateur de sa décision.
  market_reference_source: Références datées et consultées de order-backlog-audit-U999.yaml ; correspondances fonctionnelles
    partielles, pas taxonomie native de trois Business Areas commune aux éditeurs.
  glossary_alignment_if_adopted: Réexaminer les termes des deux optimisations physique/logique et de Plan Visibility, les
    synthèses Availability/Master Plan, les liens aux nœuds retirés et les accords de rattachement ; conserver les définitions
    des capacités distinctes.
