partial_delivery:
  finding: Le partiel est déjà mentionné dans les règles de promesse, PTP et Delivery Release Decision. Il ne ressort pas
    explicitement dans la définition de la capacité comme choix d’une composition de livraison admissible.
  recommendation: Préciser Delivery Release Decision plutôt que créer une capacité générique Optimizer ou une capacité par
    variante de livraison.
  candidate_definition: Choisir les commandes, lignes et quantités à autoriser en livraison complète ou partielle, leur moment
    de libération et le reste à maintenir en attente, selon les engagements, ressources et règles applicables.
  output: 'Composition retenue : périmètre servi, quantités, date ou condition de libération, reliquat, conditions de réexamen
    et motifs du choix. Une possibilité de promettre un reliquat reste distincte de sa confirmation.'
  example: 'Illustration fictive : pour 100 pièces demandées, comparer 60 maintenant puis 40 à une date proposée, ou attendre
    100 ensemble. Une quantité suffisante ne garantit pas un assortiment acceptable : tailles, couleurs, lignes indispensables
    et complétude contractuelle restent des contraintes.'
  boundaries:
    demand-fulfilment-policy-management: 'Définir les stratégies applicables : partiel autorisé, complétude, seuils, dépendances
      et marges de réexamen ; consommer les conditions contractuelles reçues.'
    D03.o: Choisir et réviser les liens ressources-demandes ; la décision de livraison peut demander un autre scénario d’affectation
      sans réaffecter elle-même les ressources.
    BHV006: Comparer les alternatives collectives et leurs effets économiques et de service.
    ba-order-promising: Produire ou réexaminer la proposition de quantité/date par demande ; les contraintes communes de ligne
      et de complétude restent applicables.
    D04.i: Tenir les engagements et appliquer l’autorisation ; maintenir le reste à satisfaire.
    D04.n: Appliquer une restructuration autorisée si nécessaire. Une livraison partielle n’impose pas une seconde commande.
    service-order-release-decision: Choisir le moment et le regroupement des prestations en aval de l’autorisation de la commande.
  sap_optimizer_limit: Le terme désigne un dispositif produit dans le support Boardriders et la documentation SAP AFS historique.
    Ne pas établir une équivalence exclusive Optimizer = livraison partielle, ni inférer une version actuelle de S/4HANA ou
    un déploiement installé.
stock_transfer:
  finding: Une seule capacité Stock Redistribution, D05.c, rattachée à ba-master-plan-management depuis U1009. Inventory Rebalancing
    et Stock Consolidation sont ses comportements, pas des capacités concurrentes.
  distinct_responsibilities:
  - id: D05.a
    name: Physical Stock Target Optimization
    parent: ba-physical-stock-configuration-optimization
    result: Niveaux cibles et seuils de stock à viser ; aucun transfert décidé par cette seule cible.
  - id: D05.c
    name: Stock Redistribution
    parent: ba-master-plan-management
    result: Quantités, origines, destinations et dates de transferts du stock physique existant ; décision de ne rien déplacer
      possible.
  - id: transport-plan-decision
    name: Transport Plan Decision
    parent: ba-service-planning
    result: Chargements, trajets, arrêts et échéances des transports confiés ; réalisation différente du choix métier de redistribution.
  recommendation: Stock Redistribution est regroupée dans Stock Optimization et reste mobilisée par Master Planning, sans
    second parent.
glossary_impact_if_adopted: 'Alignement appliqué U1014 : TER267, TER202, TER133 et les notions historiques conservées ; périmètre
  du carnet explicité dans TER100.'
