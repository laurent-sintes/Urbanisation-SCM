assessment:
  finding: Le remplacement conjoint de Storeland et UR peut laisser cinq responsabilités Retail Commerce GBM à réaffecter.
    Les fonctions documentées incluent relation client et fidélité, calcul du stock cible et réassort, en plus de la vente,
    du réseau et des parcours numériques. UR contribue au backoffice par son couplage à Storeland.
  qualification: 'L’assertion « la partie retail n’existera plus » n’est pas établie : Winstore, SoCloz et d’autres fonctions
    de caisse ou eCommerce peuvent rester. Laurent déclare Y2 comme socle Retail Boardriders, mais les modules et usages
    installés ne sont pas corroborés. Le module Omnicanal Y2 est documenté comme option acquise et activée séparément ; son
    usage Boardriders est inconnu. Aucun écart de coût ou de taille de refonte entre SI n’est chiffré.'
  decision: Créer HS-032 comme point de périmètre à instruire ; comparer construction d’un produit Retail et extension de
    Y2, sans retenir de solution.
