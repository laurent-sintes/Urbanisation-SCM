  - ELM758
  - ELM759
  market_position: Regroupement FLOW inspiré principalement du master planning Microsoft ; conserver les preuves complémentaires
    des responsabilités fashion et des politiques. Aucune équivalence de catalogue Microsoft prétendue.
- id: D05.e
  name: Replenishment
  category:
    id: supply-matching
    display_name: Supply Matching
    order: 20
  definition: Déterminer les apports successifs et leurs ajustements en quantité et en date pour entretenir la disponibilité
    pendant la commercialisation, selon les besoins, les objectifs de stock, les apports engagés et les contraintes applicables.
  definition_status: proposed_or_preserved_not_globally_approved
  nature: decision
  nature_status: implementation_proposal_not_part_of_U749
  behaviors:
  - id: BHV083
    name: Requirement-based Replenishment
    definition: Déterminer les apports pour satisfaire des besoins datés, après déduction des ressources utilisables et des
      apports attendus.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV084
    name: Target-based Replenishment
    definition: Déterminer les apports pour retrouver une cible de stock selon les seuils applicables, sans nécessiter une
      commande identifiée pour chaque apport.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV085
    name: Replenishment Adjustment
    definition: Déterminer comment modifier les apports déjà prévus pour éviter pénuries, excédents ou décalages, en respectant
      les engagements.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  source_refs:
