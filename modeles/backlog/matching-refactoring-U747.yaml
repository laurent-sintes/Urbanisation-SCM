- id: D05.h
  name: Reservation Policy Optimization
  category:
    id: policy-optimization
    display_name: Policy Optimization
    order: 30
  definition: Déterminer dans quelles situations, à quel moment et pour quelle durée réserver des ressources afin de sécuriser
    la promesse, selon le risque de pénurie et le coût d’indisponibilité pour les autres demandes.
  definition_status: proposed_or_preserved_not_globally_approved
  nature: decision
  nature_status: implementation_proposal_not_part_of_U749
  behaviors:
  - id: BHV032
    name: Milestone-Based Reservation Policy
    definition: Déterminer les événements du parcours métier à partir desquels la ressource doit être réservée, puis les conditions
      de maintien de cette protection au fil du parcours.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV033
    name: Time-Fenced Reservation Policy
    definition: Déterminer à quelle distance de la date de besoin commencer à réserver, afin de sécuriser l’échéance sans
      immobiliser trop tôt les ressources.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV034
    name: Demand-Differentiated Reservation Policy
    definition: Déterminer des conditions de réservation différentes selon les engagements de service attachés aux demandes,
      aux clients ou aux canaux, en respectant les priorités et droits d’usage établis.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV035
    name: Risk-Adaptive Reservation Policy
    definition: Adapter les conditions de déclenchement et de durée de réservation à la tension sur les ressources et au risque
      d’immobilisation inutile, dans les limites des engagements déjà accordés.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  source_refs:
  - ELM412
  - ELM342
  market_position: Regroupement FLOW inspiré principalement du master planning Microsoft ; conserver les preuves complémentaires
    des responsabilités fashion et des politiques. Aucune équivalence de catalogue Microsoft prétendue.
