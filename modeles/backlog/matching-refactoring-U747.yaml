    dans la succession du modèle final. Types et rédactions nouvelles restent proposés. Réexamens limités aux valeurs antérieures
    strictement identiques ; rattachement retiré BHV077 suspendu avec provenance.
  method: Conserver Planning mobilise des capacités Decision ; U749 remplace la proposition de réduction à trois capacités,
    pas les frontières métier.
implementation_sequence:
- Après accord, vérifier les empreintes et relire toute évolution du périmètre.
- Allouer des identifiants neufs seulement aux comportements nouveaux ou fusionnés ; préserver ceux déplacés sans changement
  de responsabilité. Ne jamais réutiliser les identifiants retirés.
- Appliquer noms, natures, définitions, parents, catégories et descriptions ; reporter exemples, réserves et sources utiles
  des fiches fusionnées.
- Requalifier les relations une par une selon relation_impact ; reprendre glossaires et liens internes concernés, puis les
  gardes de publication qui dépendent de cette structure.
- Tracer explicitement les successions et accords remplacés ; une ancienne validation ne valide pas automatiquement les champs
  fusionnés.
- Capturer l’accord sur les valeurs finales, actualiser sources et vues backlog, valider les modèles et tests concernés. Publier
  seulement sur demande.
