    des responsabilités fashion et des politiques. Aucune équivalence de catalogue Microsoft prétendue.
- id: D05.c
  name: Stock Redistribution
  category:
    id: supply-matching
    display_name: Supply Matching
    order: 20
  definition: Déterminer les transferts de stock existant entre sites pour mieux répondre aux besoins, reconstituer des assortiments
    utiles ou regrouper des stocks dispersés, en tenant compte des coûts et risques.
  definition_status: proposed_or_preserved_not_globally_approved
  nature: decision
  nature_status: implementation_proposal_not_part_of_U749
  behaviors:
  - id: BHV024
    name: Inventory Rebalancing
    definition: Déterminer les transferts de stock vers les sites où il répondra mieux aux besoins, en préservant ceux des
      sites donneurs.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV025
    name: Stock Consolidation
    definition: Déterminer les regroupements de stocks dispersés pour reconstituer des assortiments utiles ou libérer des
      sites.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  source_refs:
  - ELM369
  - ELM462
  market_position: Regroupement FLOW inspiré principalement du master planning Microsoft ; conserver les preuves complémentaires
    des responsabilités fashion et des politiques. Aucune équivalence de catalogue Microsoft prétendue.
- id: D05.a
  name: Inventory Target Optimization
  category:
    id: policy-optimization
    display_name: Policy Optimization
    order: 30
  definition: Déterminer les objectifs de stock et les seuils associés, par produit, lieu et période, selon les besoins, le
    niveau de service recherché, les délais et les risques.
  definition_status: proposed_or_preserved_not_globally_approved
  nature: decision
  nature_status: implementation_proposal_not_part_of_U749
  behaviors:
  - id: BHV026
    name: Store Demand & Supply Optimization
    definition: Déterminer les objectifs et seuils de stock d’un magasin pour assurer la disponibilité client, selon la demande
      locale, l’assortiment retenu, les contraintes de présentation et de capacité, les délais de réassort et le risque d’excédent.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV027
    name: Distribution Center Demand & Supply Optimization
    definition: Déterminer les objectifs et seuils de stock d’un centre de distribution pour servir les magasins ou canaux
      desservis, selon leurs besoins prévus, les délais fournisseurs, les aléas d’approvisionnement et les contraintes de
      stockage.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV028
    name: Multi-Echelon Demand & Supply Optimization
    definition: Déterminer conjointement les objectifs de stock de plusieurs échelons du réseau, en tenant compte de leurs
      dépendances, pour atteindre le service recherché au meilleur compromis de stock et de risque.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  source_refs:
  - ELM421
  - ELM371
  market_position: Regroupement FLOW inspiré principalement du master planning Microsoft ; conserver les preuves complémentaires
    des responsabilités fashion et des politiques. Aucune équivalence de catalogue Microsoft prétendue.
- id: D05.d
  name: Group Protection Optimization
  category:
    id: policy-optimization
    display_name: Policy Optimization
    order: 30
  definition: Déterminer les quantités à protéger ou les limites d’usage par canal ou groupe de bénéficiaires.
  definition_status: proposed_or_preserved_not_globally_approved
  nature: decision
  nature_status: implementation_proposal_not_part_of_U749
