- id: D03.o
  name: Supply Assignment
  category:
    id: supply-matching
    display_name: Supply Matching
    order: 20
  definition: Déterminer les affectations cohérentes des ressources aux besoins et leurs révisions autorisées dans le master
    plan commun.
  definition_status: proposed_or_preserved_not_globally_approved
  nature: decision
  nature_status: implementation_proposal_not_part_of_U749
  behaviors:
  - key: preserve
    name: Commitment-Preserving Assignment
    definition: Compléter le plan en préservant les affectations qui soutiennent les engagements protégés, dans le périmètre
      fixé.
    example: Une nouvelle commande consomme le solde ; les ressources protégées pour une commande confirmée restent attachées.
    source_refs:
    - ELM759
    - ELM757
    origin_ids: []
    evidence_limits: Microsoft documente une fonction conditionnelle à la version et au paramétrage ; dans FLOW, protection
      ne signifie ni réservation implicite ni garantie contre un aléa physique.
    validation: Principe du comportement validé U749 ; nom anglais et description détaillée proposés.
    id: BHV102
  - key: reassign
    name: Supply Reassignment
    definition: Revoir les liens ressources-besoins autorisés à évoluer afin de produire un plan cohérent lorsque la situation
      change.
    example: Remplacer une réception retardée par une autre ressource ; transmettre un impact de promesse s’il ne peut être
      absorbé.
    source_refs:
    - ELM757
    - ELM748
    origin_ids: []
    evidence_limits: Recalcul des affectations ; le réexamen des confirmations de type BOP reste dans Availability & Promising.
      Adjust Plan pilote la révision ; ce comportement choisit les liens révisés.
    validation: Principe du comportement validé U749 ; nom anglais et description détaillée proposés.
    id: BHV103
  source_refs:
