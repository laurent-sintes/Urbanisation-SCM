boundaries:
- Un master plan cohérent par périmètre opérationnel ; plusieurs simulations possibles, aucune affectation concurrente publiée
  pour la même ressource.
- Availability & Promising conserve ATP/CTP/PTP, sélection et réexamen des promesses de type BOP. Matching calcule les affectations
  et leurs impacts ; Order Management tient les confirmations autorisées.
- les capacités de Policy Optimization recommande ; Supply Protection Policy D02.b et Demand Protection Policy D19.b gouvernent
  les règles actives. Les calculs courants consomment ces règles sans modification silencieuse.
- 'Apply Plan fait appliquer les recommandations autorisées par les propriétaires : Orders, Reservation et Policies. Affectation
  seule ne bloque pas les usages concurrents.'
- Plans externes APS et master plan interne restent distincts ; ni prévision globale ni ordonnancement de production absorbés.
  Les nouveaux achats opérationnels peuvent être proposés sans transformer Matching en APS.
- Fulfilment conserve les adaptations locales qui préservent promesse et grands équilibres ; remonte les impacts non absorbables.
- Initial Stocking, réassort et pénurie restent des cas explicites ; plusieurs stratégies peuvent y contribuer. Pas de capacité
  par cas ou par paramètre.
- Aucune formule de valeur, priorité économique implicite ou garantie d’optimum. Les incompatibilités et hypothèses non confirmées
  restent explicites.
composition_contract:
  inputs:
  - périmètre et horizon
  - Orders et engagements
  - prévision résiduelle sans double compte
  - ressources présentes/futures et faisabilités
  - politiques et protections actives
  - stratégies autorisées et objectifs
  output:
  - liens ressources-besoins avec quantités et dates
  - besoins non couverts et raisons
  - apports/ajustements proposés et conditions
  - effets sur les promesses à faire réexaminer
  - recommandations de paramètres séparées des valeurs actives
  rules:
  - Les stratégies sont combinables par dimension, sans séquence universelle imposée.
  - Un scénario qui compare de nouvelles politiques doit les identifier comme hypothèses, sans les activer.
  - Préservation et réaffectation peuvent porter sur des périmètres distincts ; un même lien ne peut être simultanément gelé
    et librement réaffecté.
  - Requirement-Based et Target-Based partagent le calcul net ; ne pas additionner deux fois un besoin.
  - 'Fair share et livraison complète ne sont pas ajoutés comme comportements ici : pas de validation antérieure ni d’appui
    Microsoft suffisant dans le dossier.'
acceptance_scenarios:
- case: Pénurie sur deux commandes
  expect: Priorités explicites ; total affecté inférieur ou égal à la ressource ; reste non couvert ; aucune confirmation
    changée seule.
- case: Implantation fashion
  expect: Assortiment, tailles, sites et date de lancement conservés ; quantités initiales traçables même sans capacité Initial
    Stocking Decision.
- case: Réassort avec commandes et prévisions
  expect: Consommation de prévision et calcul net ; pas de double approvisionnement par cible et besoin daté.
- case: Ressource retardée, promesse préservée
  expect: Réaffectation autorisée ; confirmation conservée si réalisable ; impact sinon transmis au réexamen de promesse.
- case: Consolidation de tailles
  expect: Assortiment utile reconstitué, coûts et besoins des donneurs pris en compte ; exécution de transfert via Orders/Fulfilment.
- case: Révision de protections
  expect: Recommandation comparée aux règles actives ; aucune nouvelle protection ou réservation appliquée par le calcul seul.
- case: Cible réseau externe
  expect: Pas de recalcul APS implicite ; recommandation locale identifiée et soumise à l’autorité appropriée.
- case: Simulation interrompue puis reprise
  expect: Cadrage, arrêt, relance, suivi et application restent disponibles ; aucun effet de la simulation sur les Orders.
