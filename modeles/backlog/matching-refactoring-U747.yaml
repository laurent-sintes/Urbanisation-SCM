proposal:
- id: D05.f
  name: Master Planning
  category:
    id: master-plan-management
    display_name: Master Plan Management
    order: 10
  definition: Cadrer, maintenir et réviser le master plan commun en mobilisant les capacités de matching, de simulation et
    d’application.
  definition_status: proposed_or_preserved_not_globally_approved
  nature: planning
  nature_status: implementation_proposal_not_part_of_U749
  behaviors:
  - id: D04.s
    name: Scope Planning
    definition: Définir la question à traiter, le périmètre, l’horizon, les objectifs et les hypothèses du travail.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV097
    name: Schedule Planning
    definition: Fixer quand le travail sera lancé, ponctuellement ou selon une récurrence.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV098
    name: Run Planning
    definition: Engager le travail cadré pour produire un résultat de planification en mobilisant les décisions nécessaires.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV099
    name: Stop Planning
    definition: Interrompre un travail devenu inutile ou inapproprié et constater son arrêt effectif.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV100
    name: Rerun Planning
    definition: Engager un nouveau calcul après interruption, échec ou demande de réexamen, avec un cadrage toujours pertinent.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV101
    name: Monitor Plan
    definition: Observer les résultats du plan, les recommandations prises en compte et les nouvelles conditions pour rendre
      visibles les écarts et les besoins de réexamen.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  - id: BHV016
    name: Adjust Plan
    definition: Préparer une révision cohérente du plan face aux changements, en mobilisant les décisions spécialisées et
      en tenant compte des effets déjà acquis.
    validation: Contenu existant conservé ; accord U749 sur les familles présentées, sans nouvelle validation globale des
      descriptions.
  source_refs:
  - ELM748
  - ELM751
  market_position: Regroupement FLOW inspiré principalement du master planning Microsoft ; conserver les preuves complémentaires
    des responsabilités fashion et des politiques. Aucune équivalence de catalogue Microsoft prétendue.
- id: BHV006
  name: Simulation & Analysis
  category:
    id: master-plan-management
    display_name: Master Plan Management
    order: 10
  definition: Construire des alternatives de plan, projeter leurs conséquences et comparer leurs effets sur le service, les
    engagements, les stocks, les coûts et les risques pour éclairer les choix.
