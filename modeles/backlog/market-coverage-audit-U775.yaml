findings:
- id: GAP-01
  title: Inventory Usage Decision
  status: applied_U777
  classification: new_capability
  priority: P1
  current_model_ids:
  - D01.f
  - D01.g
  - D01.c
  - D02.c
  - service-order-inspection
  - D05.i
  market_source_refs:
  - ELM828
  - ELM829
  market_keys:
  - a0
  - a1
  diagnosis: Les faits et statuts sont tenus ; Inspection Order fournit un constat et Return Disposition Decision ne traite
    que les retours. La décision de restreindre ou réautoriser l’usage d’un stock hors retour n’a pas de responsabilité explicite.
  recommendation: 'Ajouter Inventory Usage Decision dans Inventory Management, type decision, catégorie Inventory Foundation
    : déterminer les usages autorisés ou interdits, quantités, portée et conditions de levée à partir des constats et autorisations
    applicables. Zéro comportement initial ; bloquer puis libérer constitue un cycle, pas deux variantes artificielles.'
  boundaries: 'La décision peut être prise par un responsable qualité externe : le modèle métier reste indépendant de son
    implantation. Inventory Tracking capte les faits ; le Ledger tient l’état reconnu. Ni réservation pour une demande, ni
    affectation Matching, ni inspection physique. Clarifier U436 : l’exclusivité de réservation concerne les usages concurrents,
    pas toute interdiction qualité ou réglementaire.'
  illustrative_scenario: 'Des boutons présentent un défaut sur 500 vestes déjà reçues : interdire leur usage, faire contrôler
    le lot, puis libérer uniquement les quantités autorisées sans modifier leur présence physique.'
  proposed_behaviors: []
  review_source_refs:
  - U776
  agreement:
    source_refs:
    - U776
    - U777
    canonical_applied: true
    scope: Lot U775 corrigé U776 et validé U777 ; pas de capacités autonomes Inventory Traceability ou Inventory Usage Decision.
  application: Usage autorisé intégré à Inventory Disposition Decision, sans capacité nouvelle.
- id: GAP-02
  title: Inventory Traceability
  status: applied_U777
  classification: new_capability
  priority: P1
  current_model_ids:
  - D01.c
  - D01.g
  - D01.f
  - operations-visibility
  - service-order-kitting
  market_source_refs:
  - ELM830
  - ELM831
  market_keys:
  - a2
  - a3
  diagnosis: Les positions, mouvements et progressions existent. Reconstituer la chaîne des origines, transformations et destinations
    pour identifier les biens et demandes touchés n’est pas explicite ; un journal seul ne produit pas cette réponse.
  recommendation: Ajouter Inventory Traceability dans Inventory Management, type knowledge, catégorie Inventory Visibility.
    Produire une connaissance de provenance et de propagation à partir des faits tracés, sans nouvelle source de vérité concurrente.
  boundaries: Tracking reste de type integration. Les identifiants de lots/unités, liens de transformation et limites de couverture
    sont indispensables ; ne pas inventer une généalogie à partir d’un solde. Les données de production peuvent venir d’un
    exécutant externe ; la production n’entre pas dans le domaine.
  illustrative_scenario: Retrouver les kits contenant un accessoire défectueux, les magasins livrés et les commandes encore
    ouvertes, puis remonter au lot fournisseur.
  proposed_behaviors:
  - name: Backward Traceability
    definition: Reconstituer les origines et transformations ayant contribué aux biens concernés, avec preuves et lacunes.
  - name: Forward Traceability
    definition: Identifier les biens dérivés, destinations, livraisons et demandes exposées à partir d’une origine identifiée.
  review_source_refs:
  - U776
  agreement:
    source_refs:
    - U776
    - U777
    canonical_applied: true
    scope: Lot U775 corrigé U776 et validé U777 ; pas de capacités autonomes Inventory Traceability ou Inventory Usage Decision.
  application: Filiations dans Tracking et Ledger ; parcours amont/aval dans Visibility, sans comportement isolé.
- id: GAP-03
  title: Transport Plan Decision
  status: applied_U777
  classification: new_capability
  priority: P1
  current_model_ids:
  - D06.e
  - D06.d
  - D06.f
  - service-order-release-decision
  - service-order-transport
  - transport-multi-stop
  - transport-multi-leg
  market_source_refs:
  - ELM832
  - ELM834
  - ELM805
  market_keys:
  - b1
  - c0
  - c1
  diagnosis: Le modèle conserve la demande de trajet, sélectionne les prestataires et libère des lots d’ordres. Le choix d’un
    ensemble cohérent de chargements, arrêts et acheminements est seulement renvoyé à la coordination, sans capacité explicite.
  recommendation: 'Ajouter Transport Plan Decision dans Fulfilment Orchestration, type decision, catégorie Définir et choisir
    les prestations : déterminer le plan de transport demandé, ses regroupements et acheminements compatibles. Le nom est
    une adaptation FLOW des fonctions Transportation/Load Planning.'
  boundaries: Préserver promesses et affectations Matching. Service Selection Decision garde le choix de services/exécutants
    ; Release Decision garde le moment de sollicitation. Les Transport Orders portent le plan confié. Placement 3D, conduite
    et tournées internes non commandées restent chez le prestataire. Ne pas créer un second master plan de matching.
  illustrative_scenario: 'Six magasins doivent recevoir vendredi : regrouper les expéditions en deux chargements compatibles
    et déterminer les arrêts, plutôt que seulement envoyer six ordres au même moment.'
  proposed_behaviors:
  - name: Load Consolidation
    definition: Constituer des chargements compatibles selon marchandises, capacités, destinations et échéances.
  - name: Routing & Scheduling
    definition: Déterminer les étapes, arrêts et échéances du plan confié selon les trajets et contraintes admissibles.
  agreement:
    source_refs:
    - U776
    - U777
    canonical_applied: true
    scope: Lot U775 corrigé U776 et validé U777 ; pas de capacités autonomes Inventory Traceability ou Inventory Usage Decision.
  application: Transport Plan Decision et deux comportements appliqués dans Fulfilment Orchestration.
- id: GAP-04
  title: Scrapping Order
  status: applied_U777
  classification: new_capability
  priority: P1
  current_model_ids:
  - BHV054
  - D05.i
  - service-order-picking
  - service-order-transport
  - D01.g
  - subdomain-service-orders
  market_source_refs:
  - ELM835
  - ELM833
  market_keys:
  - d0
  - b2
  diagnosis: Scrapping est un comportement de Return Order qui conserve la suite du retour. Il ne constitue pas la demande
    de mise au rebut confiée à un exécutant, notamment pour un stock détérioré sans retour.
  recommendation: 'Ajouter Scrapping Order dans Service Order Management, type action, catégorie Prestations d’entrepôt :
    tenir la prestation autorisée de mise au rebut, les quantités, consignes, justificatifs et reliquats. Zéro comportement
    initial.'
  boundaries: La décision d’orientation reste distincte. Une écriture comptable ou une sortie de stock ne prouve pas la réalisation
    physique. Le nom de famille est un choix FLOW, non un ordre natif commun aux deux éditeurs. Ne pas étendre automatiquement
    aux dons, ventes de déstockage ou à toutes les filières de recyclage.
  illustrative_scenario: Des articles abîmés sur site sont orientés vers une filière autorisée ; confier le traitement et
    attendre la preuve portant sur les quantités effectivement traitées.
  proposed_behaviors: []
  agreement:
    source_refs:
    - U776
    - U777
    canonical_applied: true
    scope: Lot U775 corrigé U776 et validé U777 ; pas de capacités autonomes Inventory Traceability ou Inventory Usage Decision.
  application: Scrapping Order appliqué dans Service Order Management, catégorie entrepôt.
- id: GAP-05
  title: Étendre Return Disposition Decision
  status: applied_U777
  classification: scope_extension
  priority: P1
  current_model_ids:
  - D05.i
  - BHV048
  - BHV049
  - service-order-inspection
  market_source_refs:
  - ELM828
  - ELM829
  - ELM835
  - ELM833
  market_keys:
  - a0
  - a1
  - d0
  - b2
  diagnosis: Le choix du devenir logistique est limité aux produits retournés. Un stock endommagé pendant le stockage ou refusé
    au contrôle peut nécessiter les mêmes arbitrages sans Return Order.
  recommendation: Généraliser D05.i en Inventory Disposition Decision, dans Fulfilment Orchestration, en conservant son identité
    et ses deux stratégies Policy-based Disposition et Value Recovery Optimization. Ne pas ajouter une seconde capacité presque
    identique.
  boundaries: 'GAP-01 décide les droits d’usage ; cette décision choisit réparation, reconditionnement, retour fournisseur
    ou sortie définitive autorisée. Matching conserve les déplacements et affectations ; Commerce et Finance conservent leurs
    décisions. Marché : blocage et orientation sont parfois combinés, leur séparation est un choix de responsabilité FLOW.'
  illustrative_scenario: 'Un dégât des eaux touche des manteaux en réserve : comparer nettoyage, réparation et sortie autorisée,
    même sans retour client.'
  proposed_behaviors: []
  agreement:
    source_refs:
    - U776
    - U777
