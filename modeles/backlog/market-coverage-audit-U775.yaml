- id: GAP-06
  title: Deux variantes de prestation d’inspection
  status: proposed
  classification: behavior_gap
  priority: P2
  current_model_ids:
  - service-order-inspection
  - D07.a
  - D05.i
  market_source_refs:
  - ELM837
  - ELM838
  - ELM839
  market_keys:
  - f0
  - f1
  - f2
  diagnosis: Inspection Order décrit le résultat attendu de façon générique. Il ne distingue pas preuve individuelle et conclusion
    portant sur un lot à partir d’un échantillon.
  recommendation: 'Ajouter deux comportements si cette distinction contractuelle est retenue : Unit-by-Unit Inspection et
    Sampling-Based Inspection. Décrire obligations, portée du résultat et conditions de clôture, plutôt que les techniques
    de prélèvement.'
  boundaries: Un taux, une quantité fixe, un écran ou une méthode de test restent des paramètres. L’intérêt de la décomposition
    est la nature de la preuve attendue ; sinon conserver ces précisions dans le protocole de l’Order. La conclusion d’inspection
    ne remplace pas la décision d’usage ou de disposition.
  illustrative_scenario: Contrôler individuellement 50 vestes réparées exige un résultat pour chacune ; apprécier un lot neuf
    de 2 000 pièces par échantillon exige le protocole, l’échantillon et la portée de la conclusion.
  proposed_behaviors:
  - name: Unit-by-Unit Inspection
    definition: Tenir la demande d’un contrôle de chaque unité du périmètre convenu et rapprocher les résultats individuels
      attendus.
  - name: Sampling-Based Inspection
    definition: Tenir la demande d’une appréciation de lot à partir d’un échantillon convenu, avec protocole, preuves et limites
      de représentativité.
- id: GAP-07
  title: 'Alternatives autorisées : expliciter leur provenance'
  status: proposed
  classification: reference_clarification
  priority: P2
  current_model_ids:
  - D08
  - D08.e
  - D12
  - D03.j
  - D03.l
  - D03
  market_source_refs:
  - ELM836
  - ELM540
  market_keys:
  - d1
  - d2
  diagnosis: Les substitutions autorisées sont supposées par CTP, PTP, Matching et un scénario, mais leur provenance, validité
    et conditions de consommation ne sont pas clairement attribuées au référentiel local.
  recommendation: Expliciter dans Product Reference et son ingestion/Visibility les relations d’alternative reçues, leur sens,
    validité et autorité. Les conditions commerciales restent auprès de leur source ; aucune capacité de substitution supplémentaire
    proposée.
  boundaries: 'La similarité produit n’autorise pas une substitution. Les commandes préservent le demandé et l’accepté ; ATP/CTP
    évaluent les options, Promise Selection choisit une proposition. Source SAP lue surtout sur alternatives de site : correspondance
    partielle, pas preuve complète d’équivalences produit.'
  illustrative_scenario: Une référence remplacée par sa nouvelle version est autorisée pour une période ; une couleur seulement
    ressemblante ne devient pas substituable sans accord.
  proposed_behaviors: []
- id: GAP-08
  title: 'Stocktaking Order : famille conditionnelle'
  status: proposed
  classification: conditional_service_family
  priority: P2
  current_model_ids:
  - D01.d
  - BHV029
  - BHV030
  - BHV031
  - subdomain-service-orders
  market_source_refs:
  - ELM207
  - ELM825
  market_keys:
  - d3
  - e0
  diagnosis: Stocktaking couvre déjà la politique, la demande de contrôle et le rapprochement. Il n’existe pas de famille
    distincte pour le comptage confié avec un engagement de prestation autonome.
  recommendation: Ne pas créer par défaut. Si FLOW commande et suit le comptage comme prestation distincte, envisager Stocktaking
    Order dans Service Order Management ; Stocktaking conserverait politique, rapprochement et corrections.
  boundaries: Les work/document éditeurs prouvent des travaux demandés, pas un besoin d’Order autonome dans tous les contextes.
    Sans engagement propre, la capacité existante suffit ; ne pas dupliquer ses trois comportements.
  illustrative_scenario: Un prestataire accepte d’inventorier quatre magasins à une date, livre des résultats partiels puis
    un solde ; cet engagement pourrait justifier la famille.
  proposed_behaviors: []
not_recommended:
- topic: Order Lifecycle / Order Hold Management
  reason: Suspension, reprise, gel, annulation, reliquat et engagements sont explicitement communs aux familles Order. Ne
    pas recréer une capacité retirée.
  model_ids:
  - D04
  - subdomain-service-orders
- topic: Nouvelles variantes ATP par site, transport ou substitution
  reason: Options déjà évaluables ; les comportements retenus distinguent la profondeur. Une alternative n’est pas automatiquement
    du CTP.
  model_ids:
  - D03.i
  - D03.j
  - D03.k
  - D03.l
- topic: Comptage sur seuil ou anomalie
  reason: BHV030 prévoit déjà un seuil ; BHV031 couvre la sollicitation ponctuelle. Aucun manque démontré.
  model_ids:
  - BHV030
  - BHV031
  source_refs:
  - ELM207
  - ELM825
- topic: Recall Management autonome
  reason: 'Le rappel est d’abord un scénario transverse : retrouver les biens concernés, interdire les usages, suspendre les
    Orders, organiser les retours et leur traitement. La décision de rappel et la communication réglementaire/commerciale
    restent sous leur autorité externe ; ne pas importer tout le Quality Management.'
  model_ids:
  - D04
  - D04.l
  - D06.d
  - D05.i
  depends_on:
  - GAP-01
  - GAP-02
- topic: Putaway / Storage Order systématiques
  reason: Le rangement interne appartient à l’exécutant et Receiving Order ne crée pas implicitement une prestation autonome.
    Une garde avec engagements de durée, conditions et restitution mériterait une famille seulement si elle est réellement
    confiée. Pas de double appui primaire assez précis établi sur ce contrat de service dans cette recherche ; piste conditionnelle,
    non recommandation ferme.
  model_ids:
  - service-order-receiving
  - subdomain-service-orders
- topic: Inventaire statistique
  reason: SAP mentionne une voie externe de sample-based inventory ; l’acceptance sampling Dynamics vérifie la qualité, pas
    une extrapolation des quantités de stock. Ne pas fabriquer une équivalence ni un comportement sur cette preuve.
  source_refs:
  - ELM825
  - ELM838
- topic: Fonctions ERP/WMS/TMS internes
  reason: Comptabilité de stock, paie et charge du personnel, slotting, pilotage machines, conduite et placement 3D ne sont
    pas ajoutés. Leurs contraintes et résultats peuvent alimenter l’orchestration sans absorber leur réalisation.
