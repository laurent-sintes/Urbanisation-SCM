          Ce contrôle historique est conservé, sans réactivation ni nouvel accord.
  - id: D01.f
    fields:
      definition: Capter et intégrer les faits et états de stock transmis par les sources, ainsi que les origines et liens
        de filiation des biens, avec leurs dates et corrections.
      scope: |-
        Intégrer événements, états transmis et corrections avec origine, portée, date du fait et date de connaissance. Rapprocher produits, lieux, propriétaires et détenteurs et reconnaître les doublons sans appliquer deux fois un effet. Un solde externe peut être reçu comme référence datée sans inventer les mouvements inconnus. Une estimation ou une demande ne vaut pas un fait réalisé.

        Fournir les faits intégrés à [Inventory Ledger](model:D01.g), qui tient leur historique métier ; [Inventory Visibility](model:D01.c) compose les positions. Operations Tracking peut fournir les effets de prestations, mais ne constitue pas un passage obligatoire pour toutes les sources. Un même fait commun aux deux Tracking ne produit qu’un effet de stock. Une correction documentaire n’est pas une sortie physique.

        Intégrer également les faits de processus utiles à la propriété et les transferts déjà établis par des sources autorisées. Operations Tracking fournit les résultats des prestations ; les échéances convenues peuvent déclencher un examen distinct. Inventory Ownership Transfer Decision applique les conditions de l’accord ; [Inventory Ownership Ledger](model:inventory-ownership-ledger) conserve les changements reconnus. Ne pas déduire automatiquement un transfert de tout événement reçu.

        La traçabilité exige aussi des faits reliant les biens : lot d’origine, composants consommés, coffrets produits, fractionnements et destinations. L’origine technique du message ne remplace pas l’origine métier du produit. Intégrer les liens communiqués sans inventer ceux que les sources ne fournissent pas ; transmettre corrections et identifiants à [Inventory Ledger](model:D01.g). Reconstituer un parcours pour répondre à une question relève de [Inventory Visibility](model:D01.c), pas d’un nouveau comportement isolé de Tracking. Exemple fictif : intégrer que les accessoires du lot A17 ont été incorporés aux coffrets K1 et K2.
  - id: D01.g
    fields:
      scope: |-
        Conserver les réceptions, sorties, déplacements, changements de statut et ajustements reconnus, avec quantités, dimensions, date du fait, date de connaissance et preuves. Le registre constitue une référence métier durable ; [Ledger](glossary:TER056) qualifie sa tenue, indépendamment des outils.

        [Inventory Tracking](model:D01.f) fournit les faits intégrés et [Stocktaking](model:D01.d) les corrections de comptage justifiées. [Inventory Ownership Ledger](model:inventory-ownership-ledger) tient les changements de propriétaire ; les écritures correspondantes sont reliées aux positions de stock sans constituer un second registre de propriété. Un transfert de propriété seul ne crée ni réception physique ni sortie physique supplémentaire.

        [Inventory Visibility](model:D01.c) compose les positions à partir des deux registres et des engagements de quantité. Un solde initial ou externe conserve sa portée sans fabriquer son historique. Une réception corrigée de 100 à 80 garde la justification de la correction ; elle ne devient pas 180 pièces. Valorisation et comptabilité générale restent sous leur responsabilité propre.

        Conserver les filiations reconnues entre entrées, transformations et sorties : origines, lots, composants consommés, produits obtenus, fractionnements et destinations. Une [traçabilité](glossary:TER101) utile ne se réduit pas au fournisseur initial ni à l’origine technique d’un message. Conserver références, quantités, dates et corrections permettant de relier ces faits, avec leurs limites de connaissance ; ne pas fabriquer une généalogie complète à partir d’un simple solde. Inventory Visibility exploite ces liens ; le registre ne prend ni décision de rappel ni décision d’usage. Exemple fictif : conserver le lien entre un lot d’accessoires et les coffrets assemblés, puis leurs sorties vers les magasins.
  - id: D01.c
    fields:
      scope: |-
        Composer les positions par article, lieu, état, propriétaire et détenteur, à partir des faits intégrés par Inventory Tracking, des mouvements reconnus dans [Inventory Ledger](glossary:TER056) et des changements de propriété dans [Inventory Ownership Ledger](model:inventory-ownership-ledger). Une correction tardive actualise la représentation à la date pertinente ; un changement de propriétaire seul ne change pas la quantité physique totale.

        Rapprocher achats, transferts entrants, retours, consignation et prévisions de mouvements de stock. Pour chaque apport attendu, conserver origine, confirmation, échéance, avancement, reliquat, engagements, incertitude et fraîcheur. Distinguer proposition, apport engagé, expédition et réception. Les [Orders](glossary:TER012) et Plans restent maîtres de leurs données ; la planification externe demeure externe.

        Un apport reconnu comme reçu devient un fait de stock et cesse d’être compté comme attente pour la même quantité. Éviter le double compte entre [Orders](glossary:TER012), plans et réalisations. Une donnée absente ou périmée ne vaut ni zéro ni certitude. Propriété, détention, statut douanier, état logique et disponibilité physique restent distincts.

        La projection ne prouve pas qu’une quantité est promettable : les décisions de promesse d’[Availability](glossary:TER112) appliquent les évaluations contextuelles. Cette capacité ne corrige pas les mouvements, ne réserve pas et ne confirme aucun engagement. La visibilité des capacités de production, transport ou prestation reste chez ses responsables.

        Illustration FLOW : un achat de 100 pièces est expédié pour 80 ; la vue expose 80 en transit et un reliquat de 20 à confirmer, avec leurs échéances. Après réception de 60, elle distingue ces 60 présentes des 20 encore en transit et des 20 non expédiées.

        Exploiter la [traçabilité](glossary:TER101) conservée dans [Inventory Ledger](glossary:TER056) pour reconstituer l’origine amont d’un bien ou les destinations aval des biens issus d’un lot, y compris après assemblage ou fractionnement. Signaler les liens manquants et le périmètre réellement documenté ; absence de lien ne prouve pas absence d’impact. La restitution peut éclairer une décision sur un lot défectueux sans décider elle-même de bloquer le stock ou d’organiser un rappel. Exemple fictif : retrouver les coffrets contenant un accessoire défectueux et les magasins qui les ont reçus.
  - id: D04.l
    fields:
      scope: |-
        La capacité couvre les commandes de retour et leurs suites logistiques selon les décisions et autorisations applicables. Le libellé [Return Order](glossary:TER072) désigne une capacité d’action ; [Return Order](glossary:TER072) reste l’objet métier associé.

        Les cinq comportements adoptés U385 sont des parcours métier combinables : Return to Stock, Repair and Refurbishment, Return to Supplier, Return to Customer et Scrapping. Une réparation peut précéder remise en stock ou restitution au client. Les différents produits ou quantités d’un même retour peuvent suivre des parcours différents, sans créer un quatrième niveau.

        [Inventory Disposition Decision](model:D05.i) choisit le devenir. [Return Order](glossary:TER072) prépare et suit sa prise en charge via les capacités responsables : [Supplier Return Order](model:D04.m) porte l’[Order](glossary:TER012) fournisseur, [Fulfilment Orchestration](model:D06) coordonne les prestations et en trace les résultats, [Inventory Management](model:D01) enregistre mouvements et états. La réception physique et la réparation restent chez les exécutants. Décider, solliciter une prestation et constater sa réalisation ne se confondent pas ; reçu, accepté et disponible sont des situations distinctes.

        Exemple fictif : sur dix pièces attendues, six sont reçues et quatre restent attendues. Parmi les six reçues, certaines peuvent être remises en stock et d’autres nécessiter une réparation. Conserver origine, motif, quantités, décisions applicables et preuves de résultat ; aucune réception ou remise en disponibilité ne se déduit du seul état de la commande.

        L’autorisation commerciale du retour, le remboursement et le remplacement client restent à délimiter. Restituer le bien n’est pas envoyer un autre produit ; un règlement sans retour physique ne crée aucune réception fictive. Donation, recyclage et revente secondaire ne sont pas assimilés au rebut. Les règles détaillées, le porteur des décisions commerciales et ces autres axes restent à instruire. Aucun déploiement Beaumanoir présumé.

        U612 : le périmètre comprend les retours B2C et wholesale, y compris lorsque les marchandises sont vendues sous consignation pour un fournisseur. Les comportements existants restent applicables selon le contrat et les autorisations : un fournisseur peut notamment confier une réparation. Cette possibilité ne crée ni règle automatique ni comportement spécifique par contrat. Le nom du propriétaire et son rôle restent explicites. [Supplier Return Order](glossary:TER073) conserve à ce stade sa responsabilité distincte de renvoi au fournisseur ; aucune fusion n’est déduite du renommage.

        Conserver les parcours spécifiques ; le choix du devenir et les prestations sont mobilisés auprès de [Fulfilment](glossary:TER085), pas exécutés par l’[Order](glossary:TER012).

        Cette famille porte le cycle et les engagements de ses [Orders](glossary:TER012) selon le [contrat commun d’Order Management](model:D04) : préparation, révisions, affermissement, protections, autorisation, suspension/reprise, annulation, clôture et conservation. Elle distingue demande, proposition, engagement confirmé et réalisé, rapproche les résultats pour tenir le reste à satisfaire et expose ces informations à [Order Visibility](model:order-visibility). Les variantes décrivent des axes métier combinables ; elles ne recopient pas ce cycle commun.

        L’[Order](glossary:TER012) de retour n’efface pas la vente d’origine.
  - id: D06
    fields:
      scope: |-
        Déterminer les prestations requises, choisir les services et exécutants, coordonner leurs contributions et adapter le plan d’exécution. [Service Order Management](model:subdomain-service-orders) tient les exigences, engagements propres et évolutions des prestations confiées. [Fulfilment](glossary:TER085) conserve la visibilité des capacités communiquées, le tracking, le rapprochement des résultats et la décision de devenir logistique des retours.

        Les [Tasks](glossary:TER089) expriment les contributions et dépendances du processus ; elles ne remplacent pas les [Service Orders](glossary:TER066) comme porteurs des engagements individuels. Une adaptation préserve la promesse d’[Order Management](model:D04) et les grands équilibres du [master plan de Matching](glossary:TER100) ; transmettre les impacts non absorbables à leurs responsables. Les exécutants conservent leurs opérations internes. Exemple fictif : coordonner réétiquetage, préparation et collecte pour tenir une livraison, puis choisir une autre collecte si nécessaire.

        Un changement de trajet ou de prestation peut modifier coûts et tarifs : obtenir leur évaluation pour choisir les solutions locales. Respecter les engagements de la commande et transmettre les effets qui nécessitent leur révision à [Order Management](model:D04) ; aucun surcoût automatiquement refacturé.

        Pour les actes nécessaires à un changement de propriétaire, coordonner la réalisation et capter son résultat, y compris distant. Inventory reçoit les faits utiles ; une demande ou un lancement de processus ne vaut pas changement de propriétaire réalisé.

        [Service Order Release Decision](model:service-order-release-decision) détermine les ensembles et moments de libération des ordres logistiques, y compris leur rétention en fonctionnement normal. Process Orchestration applique le choix ; les exécutants conservent leurs vagues et leur organisation interne.

        Solliciter les décisions de promesse d’[Availability](glossary:TER112) pour les évaluations utiles aux adaptations locales : disponibilités, faisabilité ou dossier économique des options. Une réponse recalculée ne modifie pas automatiquement la promesse confirmée.

        [Transport Plan Decision](model:transport-plan-decision) construit les chargements et parcours des transports confiés. [Inventory Disposition Decision](model:D05.i) détermine les usages autorisés et le devenir des biens, y compris hors retour. Ces décisions peuvent déclencher des prestations externes ; leurs résultats sont suivis sans absorber le [Availability](glossary:TER112) ni la tenue des registres de stock.
  - id: D06.e
    fields:
      scope: |-
        Comparer les options de prestation et vérifier leur admissibilité. Exploiter le catalogue des services, les lieux et relations du réseau, les conditions applicables et la visibilité sur la capacité. Déterminer les services utilisables, puis les moyens à mobiliser.

        Exemple : identifier les transporteurs desservant une destination, compatibles avec les marchandises et les horaires, puis déterminer le service à solliciter.

        La décision reste dans le besoin Supply et les contraintes issus des choix de satisfaction [Availability](model:D03) et des possibilités évaluées par les décisions de promesse d’[Availability](glossary:TER112) et des engagements [Order Management](model:D04). Elle ne reprend pas la décision de couverture de l’[Order](glossary:TER012) ou la révision de sa promesse. Elle peut être mobilisée pour le plan initial ou par Adaptation Decision.

        Choisir les moyens initiaux ou alternatifs en préservant promesse et grands équilibres. Consulter cette décision pendant une étude de faisabilité reste possible.

        Le résultat est le service et l’exécutant proposés ou retenus, avec leurs conditions. Les décisions de promesse [ATP](glossary:TER044), [CTP](glossary:TER045) et [PTP](glossary:TER068) choisissent une proposition de quantité et de date pour la demande ; Process Adaptation Decision détermine une révision locale du plan d’exécution ; [Service Order Release Decision](model:service-order-release-decision) détermine quels ordres libérer et quand. Ces décisions peuvent se solliciter selon le cas, sans ordre universel ni transfert de leurs engagements.

        [Transport Plan Decision](model:transport-plan-decision) construit ou révise les chargements et parcours confiés, en préservant les engagements et les affectations. Cette décision ne se confond ni avec le choix de prestation ou prestataire, ni avec le moment de libération des ordres, ni avec les engagements portés par [Transport Order](model:service-order-transport).
  - id: D06.f
    fields:
      scope: |-
        Déterminer la variation à retenir lorsqu’un fait, un retard ou un échec remet en cause le plan d’exécution. Mobiliser les décisions de service, les capacités communiquées et les informations sur les demandes et réalisations.

        Exemple : un [SLA](glossary:TER076) était compatible avec la collecte, mais une panne retarde la préparation. Déterminer une autre collecte, un autre transporteur ou une réalisation partielle selon les possibilités ; Orchestration coordonne ensuite les prestations du plan retenu.

        Si la variation remet la promesse Supply en cause, fournir à [Order Management](model:D04) les faits et variantes utiles à son réexamen. Cette capacité ne décide pas seule d’une nouvelle promesse. La latitude d’adaptation relève des règles de fonctionnement et ne conditionne pas le catalogue.

        Decision détermine une réponse métier ; Planning conserve le sens reconfigurer, simuler et valider en mobilisant des décisions. La séparation demandée n’ajoute pas automatiquement une capacité Planning ou un contrôle humain obligatoire.

        Frontière : Remonter effet promesse à [Order Management](model:D04) ; [Availability](model:D03) peut revoir son scénario sans décider le transporteur.

        Convention U409 : le Process orchestre des Services. Les [Tasks](glossary:TER089) expriment les contributions au processus ; les services réalisent les prestations sollicitées, humaines, physiques ou numériques. Un appel informatique est un moyen de sollicitation ou de feedback, pas le service métier lui-même. Process Orchestration coordonne la progression ; Process Adaptation Decision choisit les adaptations ; Operations Tracking rend visibles les opérations et Process Tracking leur contribution à la progression du processus. Les exécutants gardent leurs opérations internes. Le périmètre Supply et les responsabilités des sous-domaines restent inchangés ; aucun moteur de workflow ou nouveau niveau descriptif imposé.

        Le plan concerné est le plan d’exécution. Préserver promesse et grands équilibres ; transmettre les impacts non absorbables à [Availability](glossary:TER112) et [Order Management](model:D04), sans seuils à définir ici.

        La rétention anticipée et le regroupement en fonctionnement normal relèvent de [Service Order Release Decision](model:service-order-release-decision). Une adaptation peut modifier les conditions de libération, qui sont alors réévaluées ; ne pas dupliquer la décision de choix des lots.

        [Transport Plan Decision](model:transport-plan-decision) construit ou révise les chargements et parcours confiés, en préservant les engagements et les affectations. Cette décision ne se confond ni avec le choix de prestation ou prestataire, ni avec le moment de libération des ordres, ni avec les engagements portés par [Transport Order](model:service-order-transport).
  - id: D05.i
    fields:
      name: Inventory Disposition Decision
      definition: Déterminer les usages autorisés et le devenir logistique de biens selon leur état constaté, les politiques
        applicables et les possibilités de récupération de valeur, lors d’un retour ou en cours de stockage.
      scope: |-
        La [disposition](glossary:TER102) consiste à déterminer, pour les biens et quantités concernés, si un usage est autorisé, interdit ou soumis à condition et vers quel traitement logistique les orienter. Les issues comprennent : remise en stock utilisable, maintien bloqué, réparation, reconditionnement, renvoi fournisseur ou rebut autorisé. Les produits peuvent provenir d’un retour, d’une réception ou d’un incident constaté sur un stock déjà présent. Le motif du retour n’est pas à lui seul une décision sur le devenir du bien.

        L’inspection fournit les faits ; les politiques fixent les critères ; la décision applique ces critères au cas concret et, si nécessaire, compare les devenirs admissibles. [Policy-based Disposition](model:BHV048) et [Value Recovery Optimization](model:BHV049) restent les deux stratégies combinables, sans séquence obligatoire. Blocage, libération, réparation ou rebut sont des résultats, pas autant de comportements. Une décision peut porter sur une partie du lot. Si les informations manquent, préciser les conditions à lever sans rendre implicitement le stock utilisable.

        L’interdiction d’usage pour non-conformité se distingue de [Reservation](model:D02.c), qui protège une ressource pour un engagement. [Inventory Tracking](model:D01.f) intègre les résultats reconnus ; [Inventory Ledger](model:D01.g) conserve les états et justifications. [Inventory Visibility](model:D01.c) expose les positions selon ces états. Décider une libération ne prouve pas une opération physique, une écriture ou une disponibilité confirmée.

        [Inspection Order](model:service-order-inspection) porte une inspection confiée ; [Scrapping Order](model:service-order-scrapping), les prestations de rebut ; les [Orders](glossary:TER012) de réparation ou de retour fournisseur portent leurs engagements propres. [Process Orchestration](model:D06.d) coordonne les prestations et reçoit leurs résultats via Operations Tracking. La décision peut être exécutée ailleurs ; la capacité ne prescrit ni organisation ni logiciel interne.

        L’autorisation commerciale du retour, le remboursement, le remplacement client et l’avoir fournisseur restent distincts. Stock Redistribution conserve les déplacements entre sites ; le [Availability](glossary:TER112) traite l’impact sur les ressources partagées. Une décision locale ne doit pas masquer un effet sur les affectations ou promesses : solliciter les capacités responsables. Ce n’est pas une seconde planification générale des usages du stock.

        Exemple fictif : cent vestes ont subi un dégât dans l’entrepôt. L’inspection justifie quatre-vingts remises à disposition et vingt maintenues bloquées. Pour ces vingt, la décision examine une remise en état ou un rebut selon les politiques et la valeur récupérable. Les prestations sont ensuite confiées et leurs résultats reconnus séparément.
  - id: BHV048
    fields:
      definition: Déterminer les usages autorisés et l’orientation logistique de biens en appliquant une politique établie
        à leur état et aux conditions du cas.
      scope: |-
        Exemple fictif : article intact et complet orienté vers remise en stock ; défaut relevant d’un accord fournisseur orienté vers renvoi selon cet accord.

        Appliquer une politique au cas ; ni administrer la politique ni inspecter ou réparer le bien. Une règle par défaut ne crée pas un comportement par code.

        Les stratégies peuvent se combiner : une politique borne les choix, une optimisation les départage. Pas une séquence obligatoire ni une opposition règles/IA.

        La stratégie détermine une orientation ; elle n’administre pas les politiques, ne réalise pas le traitement et ne modifie pas le stock. Les constats d’inspection sont des entrées. Les contraintes obligatoires restent applicables, même si une autre issue paraît plus rentable. Libellé FLOW adopté U383 ; aucun catalogue éditeur commun portant ce nom n’est revendiqué. Exemples fictifs, sans preuve de pratique Beaumanoir.

        Le périmètre inclut les biens déjà en stock, sans retour client. Exemple fictif : une inspection conclut que 80 vestes sur 100 sont conformes ; la politique permet leur usage et maintient les 20 autres bloquées jusqu’à décision de traitement. La règle est le critère ; l’autorisation pour ces quantités est le résultat du comportement. Ni la tenue du Ledger ni la réservation d’un article pour une commande ne sont absorbées.
  - id: BHV049
    fields:
      scope: |-
        Exemple fictif textile : comparer remise en état puis revente, seconde main et renvoi fournisseur, selon coût, délai et potentiel de revente avant la fin de saison.

        Les objectifs peuvent être multidimensionnels ; aucun poids imposé. La décision ne réalise pas le traitement, ne calcule pas seule tous les transferts du réseau et n’absorbe pas remboursement ou autorisation commerciale.

        Les stratégies peuvent se combiner : une politique borne les choix, une optimisation les départage. Pas une séquence obligatoire ni une opposition règles/IA.

        La stratégie détermine une orientation ; elle n’administre pas les politiques, ne réalise pas le traitement et ne modifie pas le stock. Les constats d’inspection sont des entrées. Les contraintes obligatoires restent applicables, même si une autre issue paraît plus rentable. Libellé FLOW adopté U383 ; aucun catalogue éditeur commun portant ce nom n’est revendiqué. Exemples fictifs, sans preuve de pratique Beaumanoir.

        Comparer aussi les traitements de biens abîmés hors retour : remise en état, renvoi autorisé ou rebut. Une option interdite reste exclue même si elle paraît plus rentable. Exemple fictif : confronter le coût et le délai de réparation de 20 vestes à leur valeur récupérable ; retenir la filière admissible dans le contexte, puis confier son exécution. Les restrictions d’usage nécessaires restent distinctes de la comparaison économique ; aucune rentabilité ne lève une interdiction obligatoire.
  - id: BHV050
    fields:
      scope: |-
        Parcours de remise en disponibilité : suivre les quantités et conditions à satisfaire, demander les suites nécessaires et rapprocher la remise en disponibilité constatée.

        Exemple fictif : Un vêtement intact reçu en magasin doit être contrôlé et réétiqueté avant de redevenir vendable. Reçu, accepté et disponible restent distincts.

        D05.i retient l’orientation ; D06 organise les prestations et D01 enregistre état et disponibilité. Aucun stock réputé disponible par simple clôture de l’Order.

        Ce comportement appartient à [Return Order](model:D04.l). Il peut se combiner avec les autres parcours du retour selon le produit ou la quantité. Le choix du devenir est porté par [Inventory Disposition Decision](model:D05.i). Les preuves de résultat proviennent des responsabilités opérationnelles compétentes. Aucune inspection, écriture de stock, prestation physique ou décision de remboursement absorbée ; aucun logiciel ni traitement manuel imposé.

        Responsabilité propre de l’Order : tenir les obligations et le reste à satisfaire de cette destination, sur la base de preuves fournies par les capacités compétentes. Le récit transverse figure dans les scénarios ; ce comportement ne réalise ni la prestation ni la correction du stock.
  - id: BHV051
    fields:
      scope: |-
        Parcours avec prestation corrective : préserver le lien au produit et au retour, suivre la prise en charge, le résultat et la suite autorisée.

        Exemple fictif : Une fermeture défectueuse est réparée ; selon la décision applicable, le vêtement revient au client ou au stock. Un échec remonte pour réexaminer le devenir.

        La réalisation de la réparation reste chez l’exécutant et son orchestration dans D06. Le coût acceptable et le choix du devenir sont dans D05.i. Aucun atelier interne imposé.

        Ce comportement appartient à [Return Order](model:D04.l). Il peut se combiner avec les autres parcours du retour selon le produit ou la quantité. Le choix du devenir est porté par [Inventory Disposition Decision](model:D05.i). Les preuves de résultat proviennent des responsabilités opérationnelles compétentes. Aucune inspection, écriture de stock, prestation physique ou décision de remboursement absorbée ; aucun logiciel ni traitement manuel imposé.

        Responsabilité propre de l’Order : tenir les obligations et le reste à satisfaire de cette destination, sur la base de preuves fournies par les capacités compétentes. Le récit transverse figure dans les scénarios ; ce comportement ne réalise ni la prestation ni la correction du stock.
  - id: BHV052
    fields:
      scope: |-
        Relais vers une commande de retour fournisseur liée au retour client ; suivre les quantités transférées à cette responsabilité et leur résultat.

        Exemple fictif : Trois pièces présentant un défaut fournisseur sont rattachées à un Supplier Return Order ; l’expédition ne prouve ni réception fournisseur ni avoir.

        Supplier Return Order D04.m porte la commande fournisseur ; ce comportement porte son articulation avec le retour client. L’accord de reprise est une condition, jamais déduit du choix logistique.

        Ce comportement appartient à [Return Order](model:D04.l). Il peut se combiner avec les autres parcours du retour selon le produit ou la quantité. Le choix du devenir est porté par [Inventory Disposition Decision](model:D05.i). Les preuves de résultat proviennent des responsabilités opérationnelles compétentes. Aucune inspection, écriture de stock, prestation physique ou décision de remboursement absorbée ; aucun logiciel ni traitement manuel imposé.

        Responsabilité propre de l’Order : tenir les obligations et le reste à satisfaire de cette destination, sur la base de preuves fournies par les capacités compétentes. Le récit transverse figure dans les scénarios ; ce comportement ne réalise ni la prestation ni la correction du stock.
  - id: BHV053
    fields:
      scope: |-
        Parcours de restitution du même produit, après réparation ou après décision applicable de ne pas le reprendre ; préserver identité, destinataire et preuve de restitution.

        Exemple fictif : Le produit réparé est rendu au client. Un autre cas peut être le retour non accepté, restitué après la décision compétente.

        Ne décide pas du refus commercial. Ne crée pas implicitement une nouvelle vente, ne remplace pas la réservation/promesse d’un article de remplacement. D06 suit l’acheminement.

        Ce comportement appartient à [Return Order](model:D04.l). Il peut se combiner avec les autres parcours du retour selon le produit ou la quantité. Le choix du devenir est porté par [Inventory Disposition Decision](model:D05.i). Les preuves de résultat proviennent des responsabilités opérationnelles compétentes. Aucune inspection, écriture de stock, prestation physique ou décision de remboursement absorbée ; aucun logiciel ni traitement manuel imposé.

        Responsabilité propre de l’Order : tenir les obligations et le reste à satisfaire de cette destination, sur la base de preuves fournies par les capacités compétentes. Le récit transverse figure dans les scénarios ; ce comportement ne réalise ni la prestation ni la correction du stock.
  - id: BHV054
    fields:
      scope: |-
        Parcours de retrait contrôlé : conserver le motif et l’autorisation, suivre la prestation et rapprocher la preuve avec la sortie de stock.

        Exemple fictif : Un article non récupérable attend une prestation de traitement ; le retour garde sa trace jusqu’au résultat et à l’enregistrement de la sortie.

        D05.i décide du devenir, l’exécutant réalise, D06 trace et D01 enregistre. Ne regroupe pas donation, recyclage et revente secondaire sous le même résultat.

        Ce comportement appartient à [Return Order](model:D04.l). Il peut se combiner avec les autres parcours du retour selon le produit ou la quantité. Le choix du devenir est porté par [Inventory Disposition Decision](model:D05.i). Les preuves de résultat proviennent des responsabilités opérationnelles compétentes. Aucune inspection, écriture de stock, prestation physique ou décision de remboursement absorbée ; aucun logiciel ni traitement manuel imposé.

        Responsabilité propre de l’Order : tenir les obligations et le reste à satisfaire de cette destination, sur la base de preuves fournies par les capacités compétentes. Le récit transverse figure dans les scénarios ; ce comportement ne réalise ni la prestation ni la correction du stock.

        Lorsque le traitement physique est confié comme prestation identifiable, [Scrapping Order](model:service-order-scrapping) en porte l’engagement, les quantités et les preuves. Le comportement du Return Order garde l’issue du retour ; les deux engagements ne se confondent pas.
  - id: subdomain-service-orders
    fields:
      scope: |-
        Tenir les [Service Orders](glossary:TER066) avec les conditions demandées, acceptées et modifiées, les résultats attendus et les suites nécessaires. Les familles de prestations sont des capacités au même niveau que les [Orders](glossary:TER012) entrants. [Transport Order](model:service-order-transport) rend explicites les demandes de déplacement, composables avec les prestations d’entrepôt. Le cycle commun conserve les sollicitations de réception et services humains ou documentaires : la liste des familles explicites n’est pas exhaustive.

        [Order Management](model:D04) porte la demande à satisfaire et sa promesse. [Fulfilment Orchestration](model:D06) compose les prestations, coordonne leurs dépendances et choisit les adaptations ; ce sous-domaine tient leurs engagements individuels. Le [Service Catalog](model:D14) décrit l’offre, les exécutants réalisent le travail. Un ordre n’impose ni achat, ni document, ni canal technique.

        Une commande de prestations logistiques peut porter plusieurs [Service Orders](glossary:TER066), avec l’enchaînement attendu. Une liste ordonnée exprime une séquence simple ; la demande peut aussi préciser des dépendances, des possibilités de réalisation en parallèle et des conditions. [Service Order Management](model:subdomain-service-orders) conserve la demande d’ensemble, les exigences de chaque ordre et les contraintes d’enchaînement demandées, acceptées ou modifiées. [Fulfilment Orchestration](model:D06) organise et pilote leur réalisation en respectant ces engagements. La composition ne crée pas automatiquement une nouvelle famille d’[Order](glossary:TER012) et n’impose pas un ordre distinct pour chaque opération interne.

        Exemple fictif : une commande demande une inspection, puis un réétiquetage et une mise sur cintre. Chaque prestation porte ses exigences ; l’enchaînement convenu est conservé avec la demande et son exécution est coordonnée par [Fulfilment Orchestration](model:D06). Une réparation peut être conditionnée au constat de réparabilité issu de l’inspection.

        les prestations d’entrepôt sont distinguées par dix familles : [Picking Order](model:service-order-picking), [Packing Order](model:service-order-packing) (dont Repacking), [Cross-Docking Order](model:service-order-cross-docking), [Labeling Order](model:service-order-labeling), [Kitting Order](model:service-order-kitting) (dont Dekitting), [Garment Finishing Order](model:service-order-garment-finishing), [Cleaning Order](model:service-order-cleaning), [Repair & Alteration Order](model:service-order-repair-alteration), [Personalization Order](model:service-order-personalization) et [Inspection Order](model:service-order-inspection). Leurs résultats et contraintes peuvent être composés ; [Transport Order](model:service-order-transport) reste une famille distincte. Les exécutants réalisent les opérations.

        le sous-domaine porte aussi [Transport Booking Order](model:service-order-transport-booking), [Document Production Order](model:service-order-document-production), [Customs Clearance Order](model:service-order-customs-clearance), [Billing Order](model:service-order-billing) et [Payment Collection Order](model:service-order-payment-collection). Les demandes peuvent être composées avec les prestations physiques. Le domaine orchestre les services ; leur réalisation financière, documentaire ou douanière peut être confiée ailleurs.

        Chaque famille porte le cycle de ses demandes : activation immédiate, différée ou événementielle, sollicitation, acceptation, conditions et engagements, modification, annulation et clôture. Les résultats partiels conservent le reste de prestation ouvert. Une demande d’annulation ne prouve pas l’arrêt du travail ; un acquittement technique ne prouve pas la réalisation. [Fulfilment](glossary:TER085) coordonne les dépendances et capte les faits ; la famille concernée conserve les engagements individuels. [Receiving Order](model:service-order-receiving) porte les réceptions confiées ; les autres services sans famille spécialisée restent dans le périmètre annoncé, sans ordre artificiel par opération interne. Ces invariants ne constituent pas une capacité sœur des familles.

        [Scrapping Order](model:service-order-scrapping) porte les mises au rebut explicitement confiées, lors d’un retour ou pour des biens déjà stockés. Il se compose avec inspection et autres prestations au sein d’un parcours, avec autorisations, dépendances et preuves ; une décision ou une écriture de sortie ne suffit pas à solder le service.
  - id: service-order-transport
    fields:
      scope: |-
        Tenir les exigences de la prestation de transport confiée, ses conditions acceptées, leurs modifications et les suites à donner aux écarts. Un [Service Order](glossary:TER066) de transport peut être composé avec les prestations de prélèvement et de conditionnement. [Fulfilment Orchestration](model:D06) coordonne l’ensemble ; le transporteur organise ses moyens et ses opérations internes. Les choix d’exécutant et d’adaptation restent dans les responsabilités existantes de [Fulfilment](glossary:TER085). Les constats de suivi et le rapprochement des résultats alimentent la tenue de l’ordre.

        Une seule famille couvre les demandes de transport ; le mode, le transporteur et le type de trajet ne créent pas systématiquement de nouvelles capacités. Le [Service Catalog](model:D14) décrit les offres, variantes et conditions de service. L’engagement de prestation auprès du [Service Provider](glossary:TER088) reste distinct de la promesse de la commande portée par [Order Management](model:D04).

        Exemple fictif : après préparation et emballage de 100 cartons, confier leur déplacement de l’entrepôt vers un magasin avec une fenêtre de collecte et une fenêtre de livraison. Un retard de collecte entraîne une suite de prestation et, si nécessaire, une adaptation coordonnée par [Fulfilment](glossary:TER085) ; il ne modifie pas automatiquement la promesse client.

        [Transport Plan Decision](model:transport-plan-decision) construit ou révise les chargements et parcours confiés, en préservant les engagements et les affectations. Cette décision ne se confond ni avec le choix de prestation ou prestataire, ni avec le moment de libération des ordres, ni avec les engagements portés par [Transport Order](model:service-order-transport).
  - id: transport-multi-stop
    fields:
      scope: |-
        Plusieurs points de résultat : une livraison effectuée ne clôture pas nécessairement l’ensemble de l’ordre.

        L’ordre conserve les arrêts demandés et leurs contraintes. Optimiser la tournée ou décider de sa modification reste dans la coordination ; les tournées internes d’un transporteur ne créent pas ce comportement si FLOW ne les commande pas.

        Exemple fictif : Une tournée dessert trois magasins ; deux sont livrés, le troisième reste à traiter.

        [Transport Plan Decision](model:transport-plan-decision) construit ou révise les chargements et parcours confiés, en préservant les engagements et les affectations. Cette décision ne se confond ni avec le choix de prestation ou prestataire, ni avec le moment de libération des ordres, ni avec les engagements portés par Transport Order.
  - id: transport-multi-leg
    fields:
      scope: |-
        La réalisation d’une étape ou d’un transbordement ne vaut pas livraison finale ; conditions et engagements intermédiaires à préserver.

        Variante seulement si les étapes sont exposées dans la prestation confiée. Plusieurs Transport Orders confiés séparément sont une composition pilotée par Fulfilment, pas des sous-Orders obligatoires ni des sous-comportements.

        Exemple fictif : Pré-acheminement, traversée maritime puis livraison à l’entrepôt ; exigences de remise précisées aux interfaces.

        [Transport Plan Decision](model:transport-plan-decision) construit ou révise les chargements et parcours confiés, en préservant les engagements et les affectations. Cette décision ne se confond ni avec le choix de prestation ou prestataire, ni avec le moment de libération des ordres, ni avec les engagements portés par Transport Order.
  - id: service-order-release-decision
    fields:
      scope: |-
        Déterminer les ordres et quantités éligibles à libérer ensemble, leur moment ou condition de libération et les éléments à maintenir en attente, avec leur justification. Mobiliser exigences de livraison, dates de préparation et d’expédition, complétude attendue, compatibilité des regroupements et capacités communiquées par les exécutants. Comparer les bénéfices du regroupement aux conséquences de l’attente ; aucune optimisation mathématique universelle n’est promise.

        [Process Orchestration](model:D06.d) matérialise l’attente et la libération décidées, puis suit la prise en charge. Les familles de [Service Orders](glossary:TER066) conservent leur identité, leurs exigences et engagements. Une transmission anticipée pour visibilité peut être distincte de l’autorisation de lancement ; aucun protocole ou fichier unique n’est imposé.

        La décision intervient aussi en fonctionnement normal. [Process Adaptation Decision](model:D06.f) traite les aléas remettant le plan d’exécution en cause ; la libération peut ensuite être réévaluée. Les fenêtres, délais maximaux, seuils et exceptions sont des règles ; ne pas créer une capacité par paramètre.

        Respecter la promesse portée par [Order Management](model:D04) et les affectations du [Availability](glossary:TER112). Si la rétention compromet ces engagements, transmettre les impacts à leurs responsables ; ne pas modifier silencieusement dates, quantités ou affectations. Les ordres attendus et capacités communiquées sont des informations datées, sans certitude d’arrivée inventée.

        Libérer ensemble ne garantit pas préparer ensemble ni obtenir une seule palette. Les [Picking Order](model:service-order-picking) et [Packing Order](model:service-order-packing) portent les exigences de traitement commun ; les exécutants conservent vagues, parcours, tâches et palettisation détaillée.

        Exemple fictif : une commande B2B de 300 pièces devient éligible en trois ensembles. Retenir les premiers pour une libération commune compatible avec la promesse, puis demander un packing commun. Le nombre réel de palettes dépend des biens, des exigences et des capacités physiques.

        [Transport Plan Decision](model:transport-plan-decision) construit ou révise les chargements et parcours confiés, en préservant les engagements et les affectations. Cette décision ne se confond ni avec le choix de prestation ou prestataire, ni avec le moment de libération des ordres, ni avec les engagements portés par [Transport Order](model:service-order-transport).
  - id: transport-plan-decision
    fields:
      name: Transport Plan Decision
      definition: Construire et réviser un plan de transport qui regroupe les marchandises en chargements et détermine leurs
        trajets, arrêts et échéances compatibles avec les engagements.
      scope: |-
        Construire le [plan de transport](glossary:TER103) pour organiser les transports confiés en un ensemble réalisable : [Load Consolidation](model:transport-load-consolidation) constitue les chargements ; [Routing & Scheduling](model:transport-routing-scheduling) en détermine les trajets et échéances. Les deux stratégies peuvent s’articuler et être réexaminées sans séquence universelle imposée. Le plan rend explicites les capacités, compatibilités, créneaux et conditions restant à confirmer.

        Préserver les promesses portées par les [Orders](glossary:TER012) et les affectations du [Availability](glossary:TER112). Si aucune solution locale ne les respecte, faire examiner l’adaptation par les capacités responsables ; ne pas réaffecter implicitement la supply ni reconfirmer une commande. Ce plan de transport n’est ni le [Matching Master Plan](glossary:TER100) ni un [Supply Plan](glossary:TER098) prévisionnel externe.

        [Service Selection Decision](model:D06.e) choisit les prestations et prestataires admissibles en articulation avec le plan. [Transport Order](model:service-order-transport) porte les instructions et engagements de transport ; [Transport Booking Order](model:service-order-transport-booking) porte les réservations de transport confiées. [Service Order Release Decision](model:service-order-release-decision) décide quand libérer les ordres : une rétention d’ordres ne constitue pas à elle seule un plan de chargement ou de route.

        L’exécutant réalise les opérations et ses tâches internes. La capacité ne prescrit ni placement physique en trois dimensions, ni conduite, ni optimisation des tournées internes du transporteur qui ne sont pas confiées à l’orchestration. Exemple fictif : répartir les palettes destinées à six magasins entre deux chargements, puis retenir les arrêts et horaires compatibles avec leurs réceptions.
      nature: decision
      category:
        id: define-select
        display_name: Définir et choisir les prestations
        order: 10
    parent_id: D06
  - id: transport-load-consolidation
    fields:
      name: Load Consolidation
      definition: Constituer des chargements compatibles selon les marchandises, capacités, destinations et échéances.
      scope: |-
        Regrouper ou répartir les marchandises à transporter en respectant poids, volume, compatibilité et obligations de livraison. La consolidation porte sur les chargements du plan ; elle ne fusionne pas les commandes entrantes et ne décide pas de libérer les ordres.

        Exemple fictif : douze palettes destinées à six magasins sont réparties en deux chargements de six palettes, compte tenu de la capacité offerte et des destinations. Le trajet et les horaires sont examinés par Routing & Scheduling. Aucun plan de placement physique détaillé dans le véhicule n’est imposé.
      nature: planning_practice
    parent_id: transport-plan-decision
  - id: transport-routing-scheduling
    fields:
      name: Routing & Scheduling
      definition: Déterminer les étapes, arrêts et échéances du plan de transport selon les trajets et contraintes admissibles.
      scope: |-
        Définir ou réviser le parcours des chargements confiés, leurs étapes et horaires, en fonction des correspondances, durées et créneaux connus. Les hypothèses ou confirmations manquantes restent visibles. Un trajet moins coûteux ne justifie pas de modifier silencieusement la promesse.

        Exemple fictif : desservir d’abord le magasin qui réceptionne avant 10 h, puis deux magasins ouverts l’après-midi. Si le parcours devient impossible, examiner une autre solution locale avec Process Adaptation Decision, ou solliciter le réexamen des engagements. Les variantes Multi-Stop Transport et Multi-Leg Transport décrivent les engagements du Transport Order ; ce comportement construit le plan qui les motive.
      nature: planning_practice
    parent_id: transport-plan-decision
  - id: service-order-scrapping
    fields:
      name: Scrapping Order
      definition: Porter une demande de mise au rebut de biens, ses autorisations, quantités, consignes et preuves attendues
        jusqu’à son résultat reconnu.
      scope: |-
        Un [Scrapping Order](glossary:TER104) permet de confier et suivre la mise au rebut comme prestation logistique identifiable. Préciser les biens, quantités, autorisations, consignes de traitement et preuves exigées. L’[Order](glossary:TER012) conserve le réalisé, le reliquat et les écarts ; une clôture partielle doit être explicitement autorisée. Le traitement peut être exécuté par un prestataire externe et durer dans le temps.

        [Inventory Disposition Decision](model:D05.i) détermine le devenir autorisé ; l’[Order](glossary:TER012) ne décide pas de détruire au seul motif d’un écart de stock. [Process Orchestration](model:D06.d) coordonne la prestation ; [Operations Tracking](model:D07.d) reçoit les faits d’exécution et [Service Reconciliation](model:D07.c) les rapproche de l’attendu. [Inventory Tracking](model:D01.f) et [Inventory Ledger](model:D01.g) intègrent et conservent les effets reconnus sur le stock. Une instruction ou une écriture comptable ne prouve pas une destruction physique.

        Le comportement Scrapping de [Return Order](glossary:TER072) continue à porter l’issue du retour et ses obligations ; [Scrapping Order](glossary:TER104) porte la prestation confiée, liée au retour lorsqu’il existe. Le rebut peut aussi concerner un stock abîmé hors retour. Aucune extension automatique aux dons, déstockages commerciaux ou à toutes les filières de recyclage.

        Exemple fictif : vingt vestes sont autorisées au rebut. Le prestataire prouve le traitement de dix-huit ; deux restent en attente. L’[Order](glossary:TER012) conserve ce solde tant qu’une autre clôture n’est pas autorisée. Aucun comportement supplémentaire n’est créé pour chaque motif de rebut.
      nature: action
      category:
        id: warehouse
        display_name: Prestations d’entrepôt
        order: 10
    parent_id: subdomain-service-orders
  editorial_superseded_checks_U797:
  - id: D01.f
    field: scope
    previous_value: |-
      Intégrer événements, états transmis et corrections avec origine, portée, date du fait et date de connaissance. Rapprocher produits, lieux, propriétaires et détenteurs et reconnaître les doublons sans appliquer deux fois un effet. Un solde externe peut être reçu comme référence datée sans inventer les mouvements inconnus. Une estimation ou une demande ne vaut pas un fait réalisé.

      Fournir les faits intégrés à [Inventory Ledger](model:D01.g), qui tient leur historique métier ; [Inventory Visibility](model:D01.c) compose les positions. Operations Tracking peut fournir les effets de prestations, mais ne constitue pas un passage obligatoire pour toutes les sources. Un même fait commun aux deux Tracking ne produit qu’un effet de stock. Une correction documentaire n’est pas une sortie physique.

      Intégrer également les faits de processus utiles à la propriété et les transferts déjà établis par des sources autorisées. Operations Tracking fournit les résultats des prestations ; les échéances convenues peuvent déclencher un examen distinct. Inventory Ownership Transfer Decision applique les conditions de l’accord ; Inventory Ownership Ledger conserve les changements reconnus. Ne pas déduire automatiquement un transfert de tout événement reçu.

      La traçabilité exige aussi des faits reliant les biens : lot d’origine, composants consommés, coffrets produits, fractionnements et destinations. L’origine technique du message ne remplace pas l’origine métier du produit. Intégrer les liens communiqués sans inventer ceux que les sources ne fournissent pas ; transmettre corrections et identifiants à [Inventory Ledger](model:D01.g). Reconstituer un parcours pour répondre à une question relève de [Inventory Visibility](model:D01.c), pas d’un nouveau comportement isolé de Tracking. Exemple fictif : intégrer que les accessoires du lot A17 ont été incorporés aux coffrets K1 et K2.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: D01.g
    field: scope
    previous_value: |-
      Conserver les réceptions, sorties, déplacements, changements de statut et ajustements reconnus, avec quantités, dimensions, date du fait, date de connaissance et preuves. Le registre constitue une référence métier durable ; Ledger qualifie sa tenue, indépendamment des outils.

      [Inventory Tracking](model:D01.f) fournit les faits intégrés et [Stocktaking](model:D01.d) les corrections de comptage justifiées. [Inventory Ownership Ledger](model:inventory-ownership-ledger) tient les changements de propriétaire ; les écritures correspondantes sont reliées aux positions de stock sans constituer un second registre de propriété. Un transfert de propriété seul ne crée ni réception physique ni sortie physique supplémentaire.

      [Inventory Visibility](model:D01.c) compose les positions à partir des deux registres et des engagements de quantité. Un solde initial ou externe conserve sa portée sans fabriquer son historique. Une réception corrigée de 100 à 80 garde la justification de la correction ; elle ne devient pas 180 pièces. Valorisation et comptabilité générale restent sous leur responsabilité propre.

      Conserver les filiations reconnues entre entrées, transformations et sorties : origines, lots, composants consommés, produits obtenus, fractionnements et destinations. Une [traçabilité](glossary:TER101) utile ne se réduit pas au fournisseur initial ni à l’origine technique d’un message. Conserver références, quantités, dates et corrections permettant de relier ces faits, avec leurs limites de connaissance ; ne pas fabriquer une généalogie complète à partir d’un simple solde. Inventory Visibility exploite ces liens ; le registre ne prend ni décision de rappel ni décision d’usage. Exemple fictif : conserver le lien entre un lot d’accessoires et les coffrets assemblés, puis leurs sorties vers les magasins.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: D01.c
    field: scope
    previous_value: |-
      Composer les positions par article, lieu, état, propriétaire et détenteur, à partir des faits intégrés par Inventory Tracking, des mouvements reconnus dans Inventory Ledger et des changements de propriété dans Inventory Ownership Ledger. Une correction tardive actualise la représentation à la date pertinente ; un changement de propriétaire seul ne change pas la quantité physique totale.

      Rapprocher achats, transferts entrants, retours, consignation et prévisions de mouvements de stock. Pour chaque apport attendu, conserver origine, confirmation, échéance, avancement, reliquat, engagements, incertitude et fraîcheur. Distinguer proposition, apport engagé, expédition et réception. Les Orders et Plans restent maîtres de leurs données ; l’APS demeure externe.

      Un apport reconnu comme reçu devient un fait de stock et cesse d’être compté comme attente pour la même quantité. Éviter le double compte entre Orders, plans et réalisations. Une donnée absente ou périmée ne vaut ni zéro ni certitude. Propriété, détention, statut douanier, état logique et disponibilité physique restent distincts.

      La projection ne prouve pas qu’une quantité est promettable : Order Promising applique les évaluations contextuelles. Cette capacité ne corrige pas les mouvements, ne réserve pas et ne confirme aucun engagement. La visibilité des capacités de production, transport ou prestation reste chez ses responsables.

      Illustration FLOW : un achat de 100 pièces est expédié pour 80 ; la vue expose 80 en transit et un reliquat de 20 à confirmer, avec leurs échéances. Après réception de 60, elle distingue ces 60 présentes des 20 encore en transit et des 20 non expédiées.

      Exploiter la [traçabilité](glossary:TER101) conservée dans Inventory Ledger pour reconstituer l’origine amont d’un bien ou les destinations aval des biens issus d’un lot, y compris après assemblage ou fractionnement. Signaler les liens manquants et le périmètre réellement documenté ; absence de lien ne prouve pas absence d’impact. La restitution peut éclairer une décision sur un lot défectueux sans décider elle-même de bloquer le stock ou d’organiser un rappel. Exemple fictif : retrouver les coffrets contenant un accessoire défectueux et les magasins qui les ont reçus.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: D04.l
    field: scope
    previous_value: |-
      La capacité couvre les commandes de retour et leurs suites logistiques selon les décisions et autorisations applicables. Le libellé Return Order désigne une capacité d’action ; [Return Order](glossary:TER072) reste l’objet métier associé.

      Les cinq comportements adoptés U385 sont des parcours métier combinables : Return to Stock, Repair and Refurbishment, Return to Supplier, Return to Customer et Scrapping. Une réparation peut précéder remise en stock ou restitution au client. Les différents produits ou quantités d’un même retour peuvent suivre des parcours différents, sans créer un quatrième niveau.

      [Inventory Disposition Decision](model:D05.i) choisit le devenir. Return Order prépare et suit sa prise en charge via les capacités responsables : [Supplier Return Order](model:D04.m) porte l’Order fournisseur, [Fulfilment Orchestration](model:D06) coordonne les prestations et en trace les résultats, [Inventory Management](model:D01) enregistre mouvements et états. La réception physique et la réparation restent chez les exécutants. Décider, solliciter une prestation et constater sa réalisation ne se confondent pas ; reçu, accepté et disponible sont des situations distinctes.

      Exemple fictif : sur dix pièces attendues, six sont reçues et quatre restent attendues. Parmi les six reçues, certaines peuvent être remises en stock et d’autres nécessiter une réparation. Conserver origine, motif, quantités, décisions applicables et preuves de résultat ; aucune réception ou remise en disponibilité ne se déduit du seul état de la commande.

      L’autorisation commerciale du retour, le remboursement et le remplacement client restent à délimiter. Restituer le bien n’est pas envoyer un autre produit ; un règlement sans retour physique ne crée aucune réception fictive. Donation, recyclage et revente secondaire ne sont pas assimilés au rebut. Les règles détaillées, le porteur des décisions commerciales et ces autres axes restent à instruire. Aucun déploiement Beaumanoir présumé.

      U612 : le périmètre comprend les retours B2C et wholesale, y compris lorsque les marchandises sont vendues sous consignation pour un fournisseur. Les comportements existants restent applicables selon le contrat et les autorisations : un fournisseur peut notamment confier une réparation. Cette possibilité ne crée ni règle automatique ni comportement spécifique par contrat. Le nom du propriétaire et son rôle restent explicites. Supplier Return Order conserve à ce stade sa responsabilité distincte de renvoi au fournisseur ; aucune fusion n’est déduite du renommage.

      Frontière U673 : Conserver les parcours spécifiques ; le choix du devenir et les prestations sont mobilisés auprès de Fulfilment, pas exécutés par l’Order.

      Cette famille porte le cycle et les engagements de ses Orders selon le [contrat commun d’Order Management](model:D04) : préparation, révisions, affermissement, protections, autorisation, suspension/reprise, annulation, clôture et conservation. Elle distingue demande, proposition, engagement confirmé et réalisé, rapproche les résultats pour tenir le reste à satisfaire et expose ces informations à [Order Visibility](model:order-visibility). Les variantes décrivent des axes métier combinables ; elles ne recopient pas ce cycle commun.

      L’Order de retour n’efface pas la vente d’origine.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: D06
    field: scope
    previous_value: |-
      Déterminer les prestations requises, choisir les services et exécutants, coordonner leurs contributions et adapter le plan d’exécution. [Service Order Management](model:subdomain-service-orders) tient les exigences, engagements propres et évolutions des prestations confiées. Fulfilment conserve la visibilité des capacités communiquées, le tracking, le rapprochement des résultats et la décision de devenir logistique des retours.

      Les Tasks expriment les contributions et dépendances du processus ; elles ne remplacent pas les Service Orders comme porteurs des engagements individuels. Une adaptation préserve la promesse d’Order Management et les grands équilibres du master plan de Matching ; transmettre les impacts non absorbables à leurs responsables. Les exécutants conservent leurs opérations internes. Exemple fictif : coordonner réétiquetage, préparation et collecte pour tenir une livraison, puis choisir une autre collecte si nécessaire.

      Un changement de trajet ou de prestation peut modifier coûts et tarifs : obtenir leur évaluation pour choisir les solutions locales. Respecter les engagements de la commande et transmettre les effets qui nécessitent leur révision à Order Management ; aucun surcoût automatiquement refacturé.

      Pour les actes nécessaires à un changement de propriétaire, coordonner la réalisation et capter son résultat, y compris distant. Inventory reçoit les faits utiles ; une demande ou un lancement de processus ne vaut pas changement de propriétaire réalisé.

      [Service Order Release Decision](model:service-order-release-decision) détermine les ensembles et moments de libération des ordres logistiques, y compris leur rétention en fonctionnement normal. Process Orchestration applique le choix ; les exécutants conservent leurs vagues et leur organisation interne.

      Solliciter Order Promising pour les évaluations utiles aux adaptations locales : disponibilités, faisabilité ou dossier économique des options. Une réponse recalculée ne modifie pas automatiquement la promesse confirmée.

      [Transport Plan Decision](model:transport-plan-decision) construit les chargements et parcours des transports confiés. [Inventory Disposition Decision](model:D05.i) détermine les usages autorisés et le devenir des biens, y compris hors retour. Ces décisions peuvent déclencher des prestations externes ; leurs résultats sont suivis sans absorber le Matching ni la tenue des registres de stock.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: D06.e
    field: scope
    previous_value: |-
      Regrouper les responsabilités d’admissibilité et de comparaison d’options auparavant portées par D06.a et D06.c. Exploiter le catalogue des services, les lieux et relations du réseau, les conditions applicables et la visibilité sur la capacité. Déterminer les services utilisables, puis les moyens à mobiliser.

      Exemple : identifier les transporteurs desservant une destination, compatibles avec les marchandises et les horaires, puis déterminer le service à solliciter. La qualification désignait ce contrôle d’admissibilité ; elle n’est plus une capacité distincte dans cette proposition.

      La décision reste dans le besoin Supply et les contraintes issus des choix de satisfaction D03 et des possibilités évaluées par [Order Promising](model:subdomain-order-promising) et des engagements D04. Elle ne reprend pas la décision de couverture de l’Order ou la révision de sa promesse. Elle peut être mobilisée pour le plan initial ou par Adaptation Decision. Le regroupement et cette formulation sont appliqués comme proposition ; aucune validation antérieure de D06.a/c n’est transférée.

      Frontière U673 : Choisir les moyens initiaux ou alternatifs en préservant promesse et grands équilibres. Consulter cette décision pendant une étude de faisabilité reste possible.

      Le résultat est le service et l’exécutant proposés ou retenus, avec leurs conditions. Promise Selection Decision choisit une proposition de quantité et de date pour la demande ; Process Adaptation Decision détermine une révision locale du plan d’exécution ; Service Order Release Decision détermine quels ordres libérer et quand. Ces décisions peuvent se solliciter selon le cas, sans ordre universel ni transfert de leurs engagements.

      [Transport Plan Decision](model:transport-plan-decision) construit ou révise les chargements et parcours confiés, en préservant les engagements et les affectations. Cette décision ne se confond ni avec le choix de prestation ou prestataire, ni avec le moment de libération des ordres, ni avec les engagements portés par Transport Order.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: D06.f
    field: scope
    previous_value: |-
      Déterminer la variation à retenir lorsqu’un fait, un retard ou un échec remet en cause le plan d’exécution. Mobiliser les décisions de service, les capacités communiquées et les informations sur les demandes et réalisations.

      Exemple : un SLA était compatible avec la collecte, mais une panne retarde la préparation. Déterminer une autre collecte, un autre transporteur ou une réalisation partielle selon les possibilités ; Orchestration coordonne ensuite les prestations du plan retenu.

      Si la variation remet la promesse Supply en cause, fournir à D04 les faits et variantes utiles à son réexamen. Cette capacité ne décide pas seule d’une nouvelle promesse. La latitude d’adaptation relève des règles de fonctionnement et ne conditionne pas le catalogue.

      Decision détermine une réponse métier ; Planning conserve le sens reconfigurer, simuler et valider en mobilisant des décisions. La séparation demandée n’ajoute pas automatiquement une capacité Planning ou un contrôle humain obligatoire.

      Frontière : Remonter effet promesse à D04 ; D03 peut revoir son scénario sans décider le transporteur.

      Convention U409 : le Process orchestre des Services. Les Tasks expriment les contributions au processus ; les services réalisent les prestations sollicitées, humaines, physiques ou numériques. Un appel informatique est un moyen de sollicitation ou de feedback, pas le service métier lui-même. Process Orchestration coordonne la progression ; Process Adaptation Decision choisit les adaptations ; Operations Tracking rend visibles les opérations et Process Tracking leur contribution à la progression du processus. Les exécutants gardent leurs opérations internes. Le périmètre Supply et les responsabilités des sous-domaines restent inchangés ; aucun moteur de workflow ou nouveau niveau descriptif imposé.

      Frontière U673 : Le plan concerné est le plan d’exécution. Préserver promesse et grands équilibres ; transmettre les impacts non absorbables à Matching et Order Management, sans seuils à définir ici.

      La rétention anticipée et le regroupement en fonctionnement normal relèvent de [Service Order Release Decision](model:service-order-release-decision). Une adaptation peut modifier les conditions de libération, qui sont alors réévaluées ; ne pas dupliquer la décision de choix des lots.

      [Transport Plan Decision](model:transport-plan-decision) construit ou révise les chargements et parcours confiés, en préservant les engagements et les affectations. Cette décision ne se confond ni avec le choix de prestation ou prestataire, ni avec le moment de libération des ordres, ni avec les engagements portés par Transport Order.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: D05.i
    field: scope
    previous_value: |-
      La [disposition](glossary:TER102) consiste à déterminer, pour les biens et quantités concernés, si un usage est autorisé, interdit ou soumis à condition et vers quel traitement logistique les orienter : remise en stock utilisable, maintien bloqué, réparation, reconditionnement, renvoi fournisseur ou rebut autorisé. Les produits peuvent provenir d’un retour, d’une réception ou d’un incident constaté sur un stock déjà présent. Le motif du retour n’est pas à lui seul une décision sur le devenir du bien.

      L’inspection fournit les faits ; les politiques fixent les critères ; la décision applique ces critères au cas concret et, si nécessaire, compare les devenirs admissibles. [Policy-based Disposition](model:BHV048) et [Value Recovery Optimization](model:BHV049) restent les deux stratégies combinables, sans séquence obligatoire. Blocage, libération, réparation ou rebut sont des résultats, pas autant de comportements. Une décision peut porter sur une partie du lot. Si les informations manquent, préciser les conditions à lever sans rendre implicitement le stock utilisable.

      L’interdiction d’usage pour non-conformité se distingue de [Reservation](model:D02.c), qui protège une ressource pour un engagement. [Inventory Tracking](model:D01.f) intègre les résultats reconnus ; [Inventory Ledger](model:D01.g) conserve les états et justifications. [Inventory Visibility](model:D01.c) expose les positions selon ces états. Décider une libération ne prouve pas une opération physique, une écriture ou une disponibilité confirmée.

      [Inspection Order](model:service-order-inspection) porte une inspection confiée ; [Scrapping Order](model:service-order-scrapping), les prestations de rebut ; les Orders de réparation ou de retour fournisseur portent leurs engagements propres. [Process Orchestration](model:D06.d) coordonne les prestations et reçoit leurs résultats via Operations Tracking. La décision peut être exécutée ailleurs ; la capacité ne prescrit ni organisation ni logiciel interne.

      L’autorisation commerciale du retour, le remboursement, le remplacement client et l’avoir fournisseur restent distincts. Stock Redistribution conserve les déplacements entre sites ; le Matching traite l’impact sur les ressources partagées. Une décision locale ne doit pas masquer un effet sur les affectations ou promesses : solliciter les capacités responsables. Ce n’est pas une seconde planification générale des usages du stock.

      Exemple fictif : cent vestes ont subi un dégât dans l’entrepôt. L’inspection justifie quatre-vingts remises à disposition et vingt maintenues bloquées. Pour ces vingt, la décision examine une remise en état ou un rebut selon les politiques et la valeur récupérable. Les prestations sont ensuite confiées et leurs résultats reconnus séparément.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: subdomain-service-orders
    field: scope
    previous_value: |-
      Tenir les [Service Orders](glossary:TER066) avec les conditions demandées, acceptées et modifiées, les résultats attendus et les suites nécessaires. Les familles de prestations sont des capacités au même niveau que les Orders entrants. [Transport Order](model:service-order-transport) rend explicites les demandes de déplacement, composables avec les prestations d’entrepôt. Le cycle commun conserve les sollicitations de réception et services humains ou documentaires : la liste des familles explicites n’est pas exhaustive.

      [Order Management](model:D04) porte la demande à satisfaire et sa promesse. [Fulfilment Orchestration](model:D06) compose les prestations, coordonne leurs dépendances et choisit les adaptations ; ce sous-domaine tient leurs engagements individuels. Le [Service Catalog](model:D14) décrit l’offre, les exécutants réalisent le travail. Un ordre n’impose ni achat, ni document, ni canal technique.

      Une commande de prestations logistiques peut porter plusieurs [Service Orders](glossary:TER066), avec l’enchaînement attendu. Une liste ordonnée exprime une séquence simple ; la demande peut aussi préciser des dépendances, des possibilités de réalisation en parallèle et des conditions. Service Order Management conserve la demande d’ensemble, les exigences de chaque ordre et les contraintes d’enchaînement demandées, acceptées ou modifiées. [Fulfilment Orchestration](model:D06) organise et pilote leur réalisation en respectant ces engagements. La composition ne crée pas automatiquement une nouvelle famille d’Order et n’impose pas un ordre distinct pour chaque opération interne.

      Exemple fictif : une commande demande une inspection, puis un réétiquetage et une mise sur cintre. Chaque prestation porte ses exigences ; l’enchaînement convenu est conservé avec la demande et son exécution est coordonnée par Fulfilment Orchestration. Une réparation peut être conditionnée au constat de réparabilité issu de l’inspection.

      U707 : les prestations d’entrepôt sont distinguées par dix familles : Picking Order, Packing Order (dont Repacking), Cross-Docking Order, Labeling Order, Kitting Order (dont Dekitting), Garment Finishing Order, Cleaning Order, Repair & Alteration Order, Personalization Order et Inspection Order. Leurs résultats et contraintes peuvent être composés ; Transport Order reste une famille distincte. Les exécutants réalisent les opérations.

      U709 : le sous-domaine porte aussi Transport Booking Order, Document Production Order, Customs Clearance Order, Billing Order et Payment Collection Order. Les demandes peuvent être composées avec les prestations physiques. Le domaine orchestre les services ; leur réalisation financière, documentaire ou douanière peut être confiée ailleurs.

      Chaque famille porte le cycle de ses demandes : activation immédiate, différée ou événementielle, sollicitation, acceptation, conditions et engagements, modification, annulation et clôture. Les résultats partiels conservent le reste de prestation ouvert. Une demande d’annulation ne prouve pas l’arrêt du travail ; un acquittement technique ne prouve pas la réalisation. Fulfilment coordonne les dépendances et capte les faits ; la famille concernée conserve les engagements individuels. [Receiving Order](model:service-order-receiving) porte les réceptions confiées ; les autres services sans famille spécialisée restent dans le périmètre annoncé, sans ordre artificiel par opération interne. Ces invariants ne constituent pas une capacité sœur des familles.

      [Scrapping Order](model:service-order-scrapping) porte les mises au rebut explicitement confiées, lors d’un retour ou pour des biens déjà stockés. Il se compose avec inspection et autres prestations au sein d’un parcours, avec autorisations, dépendances et preuves ; une décision ou une écriture de sortie ne suffit pas à solder le service.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: service-order-transport
    field: scope
    previous_value: |-
      Tenir les exigences de la prestation de transport confiée, ses conditions acceptées, leurs modifications et les suites à donner aux écarts. Un [Service Order](glossary:TER066) de transport peut être composé avec les prestations de prélèvement et de conditionnement. [Fulfilment Orchestration](model:D06) coordonne l’ensemble ; le transporteur organise ses moyens et ses opérations internes. Les choix d’exécutant et d’adaptation restent dans les responsabilités existantes de Fulfilment. Les constats de suivi et le rapprochement des résultats alimentent la tenue de l’ordre.

      Une seule famille couvre les demandes de transport ; le mode, le transporteur et le type de trajet ne créent pas systématiquement de nouvelles capacités. Le [Service Catalog](model:D14) décrit les offres, variantes et conditions de service. L’engagement de prestation auprès du [Service Provider](glossary:TER088) reste distinct de la promesse de la commande portée par [Order Management](model:D04).

      Exemple fictif : après préparation et emballage de 100 cartons, confier leur déplacement de l’entrepôt vers un magasin avec une fenêtre de collecte et une fenêtre de livraison. Un retard de collecte entraîne une suite de prestation et, si nécessaire, une adaptation coordonnée par Fulfilment ; il ne modifie pas automatiquement la promesse client.

      [Transport Plan Decision](model:transport-plan-decision) construit ou révise les chargements et parcours confiés, en préservant les engagements et les affectations. Cette décision ne se confond ni avec le choix de prestation ou prestataire, ni avec le moment de libération des ordres, ni avec les engagements portés par Transport Order.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: service-order-release-decision
    field: scope
    previous_value: |-
      Déterminer les ordres et quantités éligibles à libérer ensemble, leur moment ou condition de libération et les éléments à maintenir en attente, avec leur justification. Mobiliser exigences de livraison, dates de préparation et d’expédition, complétude attendue, compatibilité des regroupements et capacités communiquées par les exécutants. Comparer les bénéfices du regroupement aux conséquences de l’attente ; aucune optimisation mathématique universelle n’est promise.

      [Process Orchestration](model:D06.d) matérialise l’attente et la libération décidées, puis suit la prise en charge. Les familles de Service Orders conservent leur identité, leurs exigences et engagements. Une transmission anticipée pour visibilité peut être distincte de l’autorisation de lancement ; aucun protocole ou fichier unique n’est imposé.

      La décision intervient aussi en fonctionnement normal. [Process Adaptation Decision](model:D06.f) traite les aléas remettant le plan d’exécution en cause ; la libération peut ensuite être réévaluée. Les fenêtres, délais maximaux, seuils et exceptions sont des règles ; ne pas créer une capacité par paramètre.

      Respecter la promesse portée par Order Management et les affectations du Matching. Si la rétention compromet ces engagements, transmettre les impacts à leurs responsables ; ne pas modifier silencieusement dates, quantités ou affectations. Les ordres attendus et capacités communiquées sont des informations datées, sans certitude d’arrivée inventée.

      Libérer ensemble ne garantit pas préparer ensemble ni obtenir une seule palette. Les Picking Order et Packing Order portent les exigences de traitement commun ; les exécutants conservent vagues, parcours, tâches et palettisation détaillée.

      Exemple fictif : une commande B2B de 300 pièces devient éligible en trois ensembles. Retenir les premiers pour une libération commune compatible avec la promesse, puis demander un packing commun. Le nombre réel de palettes dépend des biens, des exigences et des capacités physiques.

      [Transport Plan Decision](model:transport-plan-decision) construit ou révise les chargements et parcours confiés, en préservant les engagements et les affectations. Cette décision ne se confond ni avec le choix de prestation ou prestataire, ni avec le moment de libération des ordres, ni avec les engagements portés par Transport Order.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: transport-plan-decision
    field: scope
    previous_value: |-
      Construire le [plan de transport](glossary:TER103) pour organiser les transports confiés en un ensemble réalisable : [Load Consolidation](model:transport-load-consolidation) constitue les chargements ; [Routing & Scheduling](model:transport-routing-scheduling) en détermine les trajets et échéances. Les deux stratégies peuvent s’articuler et être réexaminées sans séquence universelle imposée. Le plan rend explicites les capacités, compatibilités, créneaux et conditions restant à confirmer.

      Préserver les promesses portées par les Orders et les affectations du Matching. Si aucune solution locale ne les respecte, faire examiner l’adaptation par les capacités responsables ; ne pas réaffecter implicitement la supply ni reconfirmer une commande. Ce plan de transport n’est ni le Matching Master Plan ni un Supply Plan prévisionnel externe.

      [Service Selection Decision](model:D06.e) choisit les prestations et prestataires admissibles en articulation avec le plan. [Transport Order](model:service-order-transport) porte les instructions et engagements de transport ; [Transport Booking Order](model:service-order-transport-booking) porte les réservations de transport confiées. [Service Order Release Decision](model:service-order-release-decision) décide quand libérer les ordres : une rétention d’ordres ne constitue pas à elle seule un plan de chargement ou de route.

      L’exécutant réalise les opérations et ses tâches internes. La capacité ne prescrit ni placement physique en trois dimensions, ni conduite, ni optimisation des tournées internes du transporteur qui ne sont pas confiées à l’orchestration. Exemple fictif : répartir les palettes destinées à six magasins entre deux chargements, puis retenir les arrêts et horaires compatibles avec leurs réceptions.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: service-order-scrapping
    field: scope
    previous_value: |-
      Un [Scrapping Order](glossary:TER104) permet de confier et suivre la mise au rebut comme prestation logistique identifiable. Préciser les biens, quantités, autorisations, consignes de traitement et preuves exigées. L’Order conserve le réalisé, le reliquat et les écarts ; une clôture partielle doit être explicitement autorisée. Le traitement peut être exécuté par un prestataire externe et durer dans le temps.

      [Inventory Disposition Decision](model:D05.i) détermine le devenir autorisé ; l’Order ne décide pas de détruire au seul motif d’un écart de stock. [Process Orchestration](model:D06.d) coordonne la prestation ; [Operations Tracking](model:D07.d) reçoit les faits d’exécution et [Service Reconciliation](model:D07.c) les rapproche de l’attendu. [Inventory Tracking](model:D01.f) et [Inventory Ledger](model:D01.g) intègrent et conservent les effets reconnus sur le stock. Une instruction ou une écriture comptable ne prouve pas une destruction physique.

      Le comportement Scrapping de Return Order continue à porter l’issue du retour et ses obligations ; Scrapping Order porte la prestation confiée, liée au retour lorsqu’il existe. Le rebut peut aussi concerner un stock abîmé hors retour. Aucune extension automatique aux dons, déstockages commerciaux ou à toutes les filières de recyclage.

      Exemple fictif : vingt vestes sont autorisées au rebut. Le prestataire prouve le traitement de dix-huit ; deux restent en attente. L’Order conserve ce solde tant qu’une autre clôture n’est pas autorisée. Aucun comportement supplémentaire n’est créé pour chaque motif de rebut.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
