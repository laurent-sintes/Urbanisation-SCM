  source_version: Documentation en ligne ; édition non précisée
  consulted_content: Commissions et volumes d’affaires éligibles dans les contrats de conditions.
  limits: Appui aux règles de commissions ; le produit inclut calcul et règlement, que FLOW maintient sous Finance.
limits:
- Douze Business Areas proposées ; aucun minimum artificiel de deux par sous-domaine.
- Un regroupement peut porter une seule Business Area si sa frontière est utile.
- Les sources étayent les responsabilités ; aucune nomenclature commune Microsoft/SAP ou équivalence complète.
- Les données client et autorités de conditions restent à qualifier sur preuves ; aucune application installée ou maître d’entreprise
  ajouté.
canonical_changes: Profondeur autorisée appliquée séparément ; noms et décompositions proposés ici non appliqués.
