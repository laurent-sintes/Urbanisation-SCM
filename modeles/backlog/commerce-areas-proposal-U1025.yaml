id: commerce-areas-proposal-U1025
status: proposed_not_applied
source_refs:
- U1023
- U1024
- U1025
depth_rule: commerce-detail-depth-U1025.yaml — applied
proposal_scope: Business Areas des cinq sous-domaines Commerce proposés, sans décomposition en capacités ni réalisation installée.
groups:
- subdomain: Retail Commerce
  business_areas:
  - name: Retail Network Management
    current_id: subdomain-retail-network-management
    definition: Tenir la structure, les rattachements et les règles communes d’exploitation du réseau de magasins.
    name_status: retained_proposed
    kind: business_area
    status: proposed
    market_relationship: partial_overlap
    sources:
    - ms-channels
    - sap-network
  - name: Digital Commerce
    current_id: subdomain-sales-b2c-ecommerce
    definition: Conduire la vente aux particuliers en ligne, de la découverte de l’offre au suivi commercial de la commande.
    name_status: retained_proposed
    kind: business_area
    status: proposed
    market_relationship: partial_overlap
    sources:
    - ms-channels
    - sap-sales
  - name: Store Sales
    current_id: subdomain-sales-b2c-store
    definition: Conduire la vente, la caisse et les parcours commerciaux client en magasin.
    name_status: rename_proposed
    kind: business_area
    status: proposed
    market_relationship: partial_overlap
    sources:
    - ms-store
    - sap-sales
  - name: Store Operations
    current_id: subdomain-store-backoffice-operations
    definition: Gérer les opérations locales de stock, réception, inventaire, préparation et remise de commandes en magasin.
    name_status: rename_proposed
    kind: business_area
    status: proposed
    market_relationship: partial_overlap
    sources:
    - ms-store
    - sap-store
- subdomain: Wholesale Commerce
  business_areas:
  - name: Wholesale Account Management
    definition: Conduire la relation avec les revendeurs et tenir leurs accords commerciaux et conditions négociées.
    sources:
    - ms-sales-agreements
    - sap-network
    - sap-wholesale
    boundary: Consommer les conditions autorisées par Pricing et les résultats Finance ; ne pas reprendre la promesse ni les
      engagements de chaque commande.
    kind: business_area
    status: proposed
    market_relationship: partial_overlap
  - name: Wholesale Sales
    definition: Préparer les sélections des revendeurs, recueillir leurs demandes de vente et assurer leur suivi commercial.
    sources:
    - ms-b2b
    - sap-wholesale
    boundary: Le portail et le représentant sont des modalités ; Sales Order conserve identité, transitions et engagements
      de la commande.
    kind: business_area
    status: proposed
    market_relationship: partial_overlap
- subdomain: Assortment & Catalog Management
  business_areas:
  - name: Assortment Management
    definition: Déterminer quels produits peuvent être proposés par magasin, canal ou client et sur quelle période.
    sources:
    - ms-assortment
    - sap-assortment
    boundary: Offre admissible ; aucune affectation de ressources ou disponibilité physique présumée.
    kind: business_area
    status: proposed
    market_relationship: partial_overlap
  - name: Catalog Management
    definition: Organiser, présenter et publier les produits de l’offre autorisée pour leurs destinataires commerciaux.
    sources:
    - ms-catalogs
    - sap-assortment
    boundary: Présentation et diffusion de l’offre ; ne pas redéfinir les produits, les prix ou l’admissibilité. La liste
      d’assortiment SAP est un appui plus étroit que tout catalogue commercial.
    kind: business_area
    status: proposed
    market_relationship: partial_overlap
- subdomain: Pricing & Promotions Management
  business_areas:
  - name: Pricing Management
    definition: Définir les règles tarifaires et déterminer les prix applicables selon le client, le produit, le canal et
      la date.
    sources:
    - ms-pricing
    - sap-pricing
    boundary: Consommer les mécanismes promotionnels autorisés pour produire le prix contextualisé ; Order Management tient
      le prix engagé.
    kind: business_area
    status: proposed
    market_relationship: partial_overlap
  - name: Promotion Management
    definition: Définir les opérations promotionnelles, leurs produits, bénéficiaires, périodes et règles de cumul ou d’exclusion.
    sources:
    - ms-promotions
    - sap-promotions
    boundary: Les règles promotionnelles sont combinées par Pricing ; la planification des ressources de la promotion reste
      extérieure.
    kind: business_area
    status: proposed
    market_relationship: partial_overlap
- subdomain: Rebates & Incentives Management
  business_areas:
  - name: Rebate Management
    definition: 'Définir les dispositifs de ristournes différées : bénéficiaires, périodes, seuils et volumes ou montants
      éligibles.'
    sources:
    - ms-rebates
    - sap-rebates
    boundary: Définition du dispositif ; calcul des droits et règlement dans Commercial Settlement Management sous Finance.
    kind: business_area
    status: proposed
    market_relationship: partial_overlap
  - name: Sales Incentive Management
    definition: Définir les primes commerciales et commissions de vente, leurs bénéficiaires et leurs conditions.
    sources:
    - ms-commission-rules
    - sap-commission
    boundary: Dispositifs commerciaux ; le calcul et le règlement restent sous Finance, les primes de personnel sous RH/paie.
      Les exemples éditeurs ne couvrent pas tout le périmètre des primes en biens.
    kind: business_area
    status: proposed
    market_relationship: partial_overlap
market_sources_reused: commerce-scope-audit-U1023.yaml — sources primaires consultées dans la session et encore pertinentes.
