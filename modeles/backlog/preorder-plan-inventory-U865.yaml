order_identity: Sales Order conserve son identité en sortant de Preorder. MAP envoie des Planned Purchase Orders (U871), distincts
  des Purchase Orders produits à l’affermissement ; filiation conservée sans identité commune imposée.
asymmetry_explanation: 'La distinction vient de la nature des objets, pas d’une règle générale achat/vente. Un [Planned Purchase
  Order](glossary:TER033) est une proposition calculée par le planning ; son affermissement produit un [Purchase Order](glossary:TER070),
  avec une filiation qui permet les regroupements sans double comptage. Un [Sales Order](glossary:TER069) au statut [Preorder](glossary:TER150)
  porte déjà une demande client identifiée avant disponibilité et progresse par changement de statut avec la même identité.
  Le parallèle côté demande de la proposition d’achat est le besoin prévisionnel, pas la précommande client. Identité et engagement
  restent distincts : un Sales Order existant peut encore être à confirmer.'
