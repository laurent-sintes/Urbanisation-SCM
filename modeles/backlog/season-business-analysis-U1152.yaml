recommendations:
- Définir Season, Seasonality et leur distinction avec Collection dans le glossaire, puis relier les mentions concernées lors
  d’un lot autorisé.
- Expliciter qui définit le calendrier et ses versions, affecte les produits et autorise les modifications. Product Portfolio
  & Collection Management est un candidat à examiner pour le cadrage amont, pas une autorité déjà prouvée.
- 'Faire consommer le contexte saisonnier par les responsabilités existantes : collections, assortiments et prix, achats,
  plans, disponibilité, commandes et traitement des excédents.'
- Ne créer une capacité de gestion du calendrier saisonnier que si la responsabilité propre est établie ; ne pas copier automatiquement
  un écran SAP en sous-domaine FLOW.
- Ne pas déduire qu’un produit ne peut appartenir qu’à une saison ni que sa vente devient impossible après la fin de cette
  saison. Les règles de report et déstockage sont à qualifier.
example:
  nature: Fictif
  situation: Un produit Été 2027 peut être commandé bien avant la saison, livré avant implantation et encore vendu en déstockage
    après la période principale.
  lesson: Saison de référence, fenêtres opérationnelles et éligibilité commerciale sont liées mais distinctes.
conclusion: La saison est métier ; sa représentation applicative matérialise les objets, calendriers et règles. Dans la cartographie,
  rendre explicite la notion et ses usages avant de décider une capacité dédiée.
