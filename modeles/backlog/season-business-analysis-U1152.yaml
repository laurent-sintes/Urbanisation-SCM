distinctions:
- concept: Season
  interpretation: 'Objet métier : période commerciale identifiée, avec produits concernés et fenêtres d’achat, de livraison
    ou de vente éventuellement différentes selon le contexte. Ne présume pas un calendrier unique Beaumanoir.'
- concept: Seasonality
  interpretation: Variations récurrentes de la demande ; une périodicité statistique ne définit pas une saison commerciale.
- concept: Collection
  interpretation: Ensemble de produits conçu et présenté selon une intention ; ses liens aux saisons sont à expliciter, sans
    imposer la hiérarchie native SAP au modèle FLOW.
- concept: Season Management
  interpretation: Une capacité est justifiée si une responsabilité durable définit les saisons, calendriers, affectations
    et changements autorisés. Le seul usage de la saison dans plusieurs capacités ne suffit pas à créer un sous-domaine transversal.
