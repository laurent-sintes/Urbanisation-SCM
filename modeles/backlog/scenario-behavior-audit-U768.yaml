    compte des effets déjà acquis.
  reason: 'Cadrage, suivi et révision du même plan : pratiques de pilotage ; vérifier séparément la maille des opérations
    de lancement.'
  recommendation: Conserver ; un scénario peut mobiliser cette variante sans la remplacer.
