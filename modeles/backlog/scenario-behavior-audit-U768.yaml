method:
  behavior: 'Manière réutilisable et différenciante d’exercer une capacité : mécanisme, politique, périmètre ou résultat propre.'
  scenario: 'Histoire contextualisée : acteur, besoin, événement, ressources et contraintes, actions et contributions des
    capacités, résultat attendu et points de vérification.'
  tests:
  - Le mécanisme ou l’engagement change-t-il si le nom du client, la saison et les quantités changent ?
  - Le texte décrit-il ce que fait sa capacité ou enchaîne-t-il les responsabilités de plusieurs capacités ?
  - Le motif d’une commande est-il pris à tort pour une manière de la gérer ?
  - Le résultat attendu et les limites d’autorité peuvent-ils être éprouvés par le cas ?
  limits:
  - Audit descriptif des 82 comportements courants ; pas de rejeu de U431.
  - Un mapping prouve une illustration explicite, pas une capacité installée ni une validation de la couverture métier.
  - Un comportement peut apparaître dans plusieurs scénarios ; aucune correspondance un à un exigée.
behavior_findings:
- id: BHV002
  name: On-Hand ATP
  parent: D03.i
  verdict: differentiating_behavior
  evidence: Évaluer les quantités et dates promettables à partir du stock courant admissible, après engagements et contraintes
    applicables, sans ajouter de réception future.
  reason: 'Profondeur de calcul : ressources présentes ou futures ; le mécanisme varie, sans récit transverse.'
  recommendation: Conserver ; un scénario peut mobiliser cette variante sans la remplacer.
- id: BHV004
  name: Projected ATP
  parent: D03.i
  verdict: differentiating_behavior
  evidence: Étendre l’évaluation aux réceptions attendues admissibles et aux besoins/engagements sur l’horizon, sans créer
    de nouvel apport.
  reason: 'Profondeur de calcul : ressources présentes ou futures ; le mécanisme varie, sans récit transverse.'
  recommendation: Conserver ; un scénario peut mobiliser cette variante sans la remplacer.
