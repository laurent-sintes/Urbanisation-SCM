  fields:
    name: Initial Stocking
    definition: 'Porter les transferts constituant le stock de départ : implantation d’une saison, d’une capsule ou d’un nouveau
      lieu.'
    finality: Expliciter l’attendu de démarrage.
    scope: |-
      Replenishment dimensionne le besoin ; Transfer Order porte les départs et arrivées attendus.

      Exemple fictif : Acheminer les quantités d’implantation depuis l’entrepôt vers les magasins.

      D04 porte les demandes, leur résultat attendu, le cycle et la conservation dans les familles, et Order Structuring ; D03 optimise leur satisfaction et Order Promising calcule les possibilités de promesse et D04 porte les engagements ; D03 optimise le stock, D01 conserve ses faits/régimes et D06 orchestre les services. Ces capacités restent mobilisables et les opérations utiles doivent être expliquées dans chaque contexte métier.

      Les comportements ne sont ni une séquence obligatoire ni tous exclusifs. Les comportements distinguent les intentions du transfert : constituer le stock initial, l’alimenter pendant l’activité, rééquilibrer les lieux, regrouper des stocks dispersés ou satisfaire une commande identifiée. Identifier les quantités concernées et ne pas additionner des stocks ou attendus deux fois.

      Les modalités de paiement, autorisations, tolérances et échéances contractuelles restent des règles à préciser selon le contexte. Cet exemple n’établit aucune pratique installée chez Beaumanoir.
