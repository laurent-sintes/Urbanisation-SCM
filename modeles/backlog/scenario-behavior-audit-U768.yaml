    de cas complétées ; mapping dans le modèle canonique.
  atlas: Étapes et liens vers les capacités ; scénarios retrouvés depuis chaque capacité contributrice dans le même snapshot.
  publication: Backlog appliqué ; aucune nouvelle publication. La release courante reste 2026-09-25.2.
  coverage_limit: Le mapping décrit des cas illustratifs ; il ne démontre ni exhaustivité des variantes ni validation globale
    du modèle.
