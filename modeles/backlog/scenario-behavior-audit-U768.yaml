- id: BHV072
  revision: 8
  kind: behavior
  fields:
    name: Inventory Rebalancing
    definition: Porter les transferts corrigeant un déséquilibre entre lieux, par exemple d’un magasin disposant d’un excédent
      vers un magasin qui manque de stock.
    finality: Rendre visible la correction d’un déséquilibre.
    scope: |-
      Stock Redistribution choisit ; ce comportement gère les Orders et leur satisfaction.

      Exemple fictif : Déplacer des pièces d’un magasin disposant d’un excédent vers un magasin qui en manque.

      D04 porte les demandes, leur résultat attendu, le cycle et la conservation dans les familles, et Order Structuring ; D03 optimise leur satisfaction et Order Promising calcule les possibilités de promesse et D04 porte les engagements ; D03 optimise le stock, D01 conserve ses faits/régimes et D06 orchestre les services. Ces capacités restent mobilisables et les opérations utiles doivent être expliquées dans chaque contexte métier.

      Les comportements ne sont ni une séquence obligatoire ni tous exclusifs. Les comportements distinguent les intentions du transfert : constituer le stock initial, l’alimenter pendant l’activité, rééquilibrer les lieux, regrouper des stocks dispersés ou satisfaire une commande identifiée. Identifier les quantités concernées et ne pas additionner des stocks ou attendus deux fois.

      Les modalités de paiement, autorisations, tolérances et échéances contractuelles restent des règles à préciser selon le contexte. Cet exemple n’établit aucune pratique installée chez Beaumanoir.
    market_comparisons:
    - vendor: Oracle
      product: Replenishment Planning
      source_title: Overview of Inventory Rebalancing
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faurp/overview-of-inventory-rebalancing.html
      source_version: Oracle Fusion Cloud SCM 26B
      source_locator: Introduction ; Planned orders ; Release
      consulted_on: '2026-09-19'
      evidence_limits: Documentation primaire consultée ; périmètre du produit, sans preuve de déploiement Beaumanoir.
      element_name: Inventory rebalancing
      element_type: Concept et usage documentés
      relationship: Recouvrement partiel
      similarities: Les excédents peuvent couvrir les manques ailleurs dans le réseau.
      differences: Oracle décrit surtout le calcul et la libération du plan.
      flow_position: Conserver l’intention de rééquilibrage et suivre le déplacement décidé.
      status: proposed
      source_refs:
      - U400
      - U401
      - ELM240
      - CMP151
      - U477
      - ELM369
      - CMP189
      concept_name: Inventory rebalancing
      scope_summary: Excédents et manques entre emplacements.
      approach_summary: Proposer puis libérer des transferts de rééquilibrage.
    - vendor: Nextail
      product: Retail inventory optimization
      source_title: Solution specifications
      source_url: https://help.nextail.co/en/solution-specifications
      source_version: Documentation évolutive consultée le 19 septembre 2026
      source_locator: First Allocation ; Replenishment ; Store Transfers
      consulted_on: '2026-09-19'
      evidence_limits: Documentation primaire consultée ; périmètre du produit, sans preuve de déploiement Beaumanoir.
      element_name: Store Transfers
      element_type: Concept et usage documentés
      relationship: Recouvrement partiel
      similarities: Store Transfers redistribue le stock entre magasins.
      differences: Le périmètre retail Nextail n’est pas toutes les formes de transfert FLOW.
      flow_position: Conserver l’intention de rééquilibrage et suivre le déplacement décidé.
      status: proposed
      source_refs:
      - U477
      - ELM375
      - CMP189
      concept_name: Store Transfers
      scope_summary: Rééquilibrage entre magasins.
      approach_summary: Déplacer selon les possibilités de vente attendues.
    nature: process_variant
    market_inspiration:
      choice: Déplacer un excédent vers un site qui en a davantage besoin. Inventory Rebalancing suit les transferts retenus
        pour corriger un déséquilibre du réseau.
      flow_scope: Transferts entre sites donneurs et receveurs.
      flow_approach: Conserver l’intention de rééquilibrage et suivre le déplacement décidé.
      synthesis:
      - Oracle oppose excédents et manques ; Nextail examine les possibilités de vente entre magasins. Les deux recherchent
        une meilleure utilisation du stock existant, avec des objectifs formulés différemment.
      - FLOW distingue la décision de rééquilibrage et les transferts à suivre. Déplacer un excédent n’est pas automatiquement
        le même besoin que regrouper des reliquats ou préparer une ouverture.
      examples:
      - title: Illustration FLOW — Réduire un déséquilibre
        situation: Un magasin a 30 pièces peu demandées ; un autre risque de manquer de dix pièces.
        outcome: Un transfert retenu permet de déplacer une partie de l’excédent.
        lesson: Les quantités sont illustratives ; le comportement porte le transfert, pas le calcul de l’optimum.
        source_title: Overview of Inventory Rebalancing
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faurp/overview-of-inventory-rebalancing.html
