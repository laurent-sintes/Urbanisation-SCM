request:
  verbatim: Je veux un audit global du modèle, surtout sur les relations.
  interpretation: Examiner le modèle courant dans son ensemble, avec priorité aux relations, à leur sens métier, à leur couverture
    documentée et à leur restitution. Un audit global porte tout le périmètre décrit, sans prétendre que toute l’entreprise
    ou ses interfaces installées sont modélisées.
scope:
  included:
  - Hiérarchie, identité, parents uniques et profondeurs déclarées
  - Toutes les 876 relations, dont 347 hiérarchiques et 529 transverses
  - Responsabilités producteur/consommateur, dépendances, autorisations, faits, décision et application
  - Contenus et qualifications des 301 partages de données, doublons et boucles de mobilisation
  - Coopérations entre les quatre systèmes et les douze domaines
  - Synthèses système, contrats détaillés et modes de lecture Flux
  - Principes, descriptions et glossaires qui réexpriment les responsabilités
  - Scénarios, parcours, contributions et participations de contexte
  - Informations, offres applicatives, sélections SI et liens As Is
  - Points chauds, écarts, observations, options, problèmes et documents
  - Portées d’accord et fidélité du backlog à la publication courante
  excluded:
  - Aucun diagnostic de fonctionnement installé ni inventaire technique d’interfaces
  - Aucune réouverture de l’audit des comportements clos U431
  - Aucune capacité périphérique exigée hors profondeur déclarée
  - Aucune relation déduite d’une paire vide, d’un nom de produit ou d’une observation non documentée
  canonical_business_changes: false
  business_adoption: false
  publication: false
  commit: false
