executive_summary:
  conclusion: L’arbre, les références et les contrats structurés sont intègres. Sept incohérences confirmées subsistent dans
    les attributions de responsabilité, la qualification d’une relation et la restitution de certains liens. Un choix de couverture
    des synthèses EA reste à arbitrer. Les 27 relations Commerce/Procurement avec Supply existent ; leur accès depuis une
    vue de domaine est mal orienté. Aucune nouvelle chaîne détaillée absente n’a été démontrée dans le périmètre documenté.
  confirmed_defects: 7
  representation_choices_to_arbitrate: 1
  by_priority:
    P1: 2
    P2: 4
    P3: 2
  priority_meaning:
    P1: Corriger d’abord pour obtenir une lecture fiable des responsabilités et du sens des relations ; aucun incident installé
      allégué.
    P2: Cohérence de périmètre, traçabilité ou choix de représentation à traiter ensuite.
    P3: Consolidation d’un catalogue interne ou précision de qualification affichée.
  first_actions:
  - Aligner l’attribution de couverture, affectation et application avec Master Plan et Availability.
  - Lever le conflit entre fourniture d’autorisation et rôle needs.
  - Aligner les principes de périmètre et les liens des fiches vers les parcours réellement mobilisés.
  known_reserves_are_not_counted_as_new_defects: true
method:
  steps:
  - Vérifier les empreintes du lot publié avant de réutiliser les contrôles réussis.
  - Recalculer indépendamment identifiants, parents, cycles hiérarchiques, auto-relations, doublons et égalité des relations
    publiées.
  - Partager les 529 relations transverses en deux ensembles disjoints, lire leurs significations et qualifications avec les
    fiches de leurs extrémités.
  - Comparer les descriptions et principes au graphe explicite et au glossaire ; un lien résolu ne prouve pas que son sens
    soit correct.
  - Examiner les boucles de besoin comme coopérations conditionnelles, sans les transformer en séquences exécutables.
  - Confronter les six synthèses existantes à l’union structurée de tous leurs détails, puis examiner les directions non synthétisées.
  - Vérifier les liens des catalogues et leurs preuves dans le code de restitution, en réutilisant les recettes inchangées.
  - Comparer chaque constat aux périmètres U1114/U1115 ; séparer reliquat ancien, conséquence nouvelle et réserve connue.
  - Consolider les constats recoupés une seule fois ; conserver les hypothèses non démontrées comme questions ouvertes.
  independent_partition_proof: true
  market_method: Les contradictions internes sont démontrées par les champs canoniques et le code. Les comparaisons primaires
    pertinentes déjà consultées dans cette session sont réutilisées ; aucun nouveau découpage métier ni équivalence produit
    n’est proposé.
