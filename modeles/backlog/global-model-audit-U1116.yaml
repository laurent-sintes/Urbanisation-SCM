    collection: nodes
    id: D03
    field: fields.definition
    quote: Établir ce qui peut être promis pour une demande identifiée, selon les ressources, le plan commun, les règles et
      les engagements.
  - path: modeles/backlog/model.yaml
    collection: nodes
    id: ba-order-backlog-management
    field: fields.definition
    quote: Arbitrer les priorités, les affectations et les passages en livraison des commandes en concurrence dans le Master
      Plan.
  - path: modeles/backlog/glossary.yaml
    collection: terms
    id: TER112
    field: notes
    quote: '[Order Backlog Management](glossary:TER269), dans [Master Plan](glossary:TER111), porte les arbitrages collectifs
      de priorités et d’[affectation](glossary:TER017).'
  - path: modeles/backlog/model.yaml
    collection: principles
    id: PRINCIPLE-TO-PROMISE
    field: statement
    value: Availability regroupe les décisions de promesse et les arbitrages de couverture. Order Promising est la catégorie
      de présentation de ATP, CTP et PTP, trois capacités de décision qui intègrent sélection initiale et réexamen. Aucun
      ordre universel de calcul, confirmation, réservation ou approvisionnement automatique. Inventory Management tient les
      faits et engagements de quantité ; Availability conserve le master plan et les affectations ; Order Management confirme
      les engagements et leurs révisions autorisées.
  - path: modeles/backlog/model.yaml
    collection: principles
    id: PRINCIPLE-INVENTORY-SCENARIO-APPLICATION
    field: statement
    value: 'Planning mobilise des décisions distinctes. L’application du plan relève d’un comportement du Planning concerné
      ; sa décomposition précise doit être justifiée par son effet métier. Les capacités qui définissent, maintiennent et
      fournissent les configurations consommées, notamment Supply Protection, restent extérieures. Appliquer un plan peut
      mobiliser la gestion des Orders, des engagements et la coordination des prestations sans absorber leurs responsabilités.
      Aucun sous-comportement ni capacité Application systématique. La gestion d’une demande propre au travail de Planning
      peut être un comportement de ce Planning ; son suivi reste distinct du plan et de ses effets. Ce choix ne retire pas
      les Orders d’origine interne de leur famille de gestion. Exception locale validée U749 : dans Availability, Simulation
      & Analysis et Plan Application sont des capacités distinctes, coordonnées par Master Planning ; cette maille ne se généralise
      pas aux autres Planning.'
  effect: Le lecteur des commandes, de leur structure ou de la coordination peut attribuer le calcul collectif et les affectations
    à Availability alors que la hiérarchie et les contrats U1113 les placent dans Master Plan / Order Backlog Management.
    Les liens sont résolus et valides techniquement ; leur explication métier reste contradictoire.
  recommendation: 'Corriger ces seuls passages et TER176 dans le même lot : rattacher les décisions de besoin et de couverture
    au Master Plan et les affectations à Supply Assignment / Order Backlog Management ; conserver Availability pour la proposition
    de promesse individuelle. Conserver les identifiants, parents et responsabilités des quatre capacités. Fusionner ce reliquat
    avec le constat global sur les principes de planification pour éviter de compter plusieurs fois la même contradiction.
    Aligner aussi les deux principes courants qui situent encore master plan, affectations et Plan Application dans Availability.
    Le périmètre actuel Master Plan et les responsabilités spécialisées restent inchangés.'
  comparison_to_prior_audits:
    U1112: FL-U1112-01 corrigeait les extrémités et textes de flèches de promesse ; ces quatre scopes n’étaient pas nommés.
    U1114: EA-CAT-02 portait la contradiction Availability dans TER112.market_inspiration.
    U1115: TER112 a été aligné, mais les quatre scopes et TER176.context ci-dessus restent dans leur état ancien. Il ne s’agit
      pas d’une régression introduite par U1115.
  market_evidence_refs:
  - flow-audit-U1112.yaml#MKT-FLOW-MS-PROMISE
  - flow-audit-U1112.yaml#MKT-FLOW-SAP-AATP
  market_comparison: Les passages primaires Dynamics et SAP S/4HANA consultés le 16 octobre et relus dans U1112 étayent des
    possibilités de quantité/date et une proposition de confirmation. Ils n’imposent pas la séparation FLOW ; la correction
    recommandée repose sur les responsabilités déjà canoniques, sans nouvelle taxonomie ni nouveau mécanisme.
  limits:
