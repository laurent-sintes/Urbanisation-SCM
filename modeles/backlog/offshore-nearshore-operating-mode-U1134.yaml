id: offshore-nearshore-operating-mode-U1134
date: '2026-10-21'
source_refs:
- U1132
- U1133
- U1134
- U1135
- U1136
status: Mode métier validé par Laurent sous U1136 ; publication locale demandée.
approval_scope: 'U1136 valide le lot cohérent U1134/U1135 : anticipation offshore possible dès Design & Development, décision
  d''appoint nearshore dans SCM selon accords et délégations, CTP avant engagement initial et pendant la saison, cycle d''achat
  unique et planification logiquement intégrée au SCM. Le mode est possible, pas universel ; l''existant MAP ne prouve ni
  migration ni logiciel unique. Les exemples numériques restent illustratifs ; ni politique chiffrée, correspondance marché
  complète ou paragraphes historiques non discutés ne sont adoptés.'
rationale: 'La décision d''acheter est répartie selon besoin et horizon. Les capacités existantes suffisent : préparation
  de collection, Replenishment, CTP, comparaison PTP, Plan Application et Purchase Order. Aucun déplacement, relation, scénario
  autonome ou nouveau comportement.'
boundaries:
- CTP vérifie la faisabilité et peut éclairer l'engagement initial ; il n'autorise ni ne crée seul l'achat.
- Le SCM peut décider l'appoint dans le cadre négocié et les délégations applicables ; Sourcing and Procurement ne monopolise
  pas la décision de commander.
- La commande appartient déjà au SCM ; les accords et échanges fournisseur restent articulés avec Sourcing and Procurement.
- L'existant MAP est conservé comme constat ; le mode possible ne prouve aucune installation ou bascule.
- Glossaire aligné dans le même lot ; termes offshore/nearshore explicités sans conclusion géographique automatique.
