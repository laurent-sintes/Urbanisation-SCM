schema_version: 1.0.0
id: core-reference-credit-boundaries-U895
status: applied_verified
source_refs:
- U895
- U896
- U897
- U898
canonical_model_modified: true
scope: Réexaminer le périmètre du Core et proposer la référence financière à partir du feedback U895. Aucune publication modifiée.
user_corrections:
- Présenter les références par sens et responsabilité métier ; la mutualisation technique ne structure pas la cartographie.
- Le Credit Check relève des implémentations des Cases B2B ; sa présence comme capacité autonome du Core est remise en cause.
- Un apport du contrôle de gestion doit alimenter les informations de référence utilisées par ces Cases.
- Achat et Vente portent la plupart des implémentations opérationnelles ; Vente distingue B2C/eCom, B2C/Store et Wholesale
  (U896).
- 'B2C et B2B sont volontairement absents de la décomposition du Core : ils qualifient les contextes qui le mobilisent (U897).'
observed_current_model:
  common_references:
    ids:
    - D08
    - product-price-book
    finding: Deux références sont présentées directement sous Operational References comme socle commun aux trois périmètres
      d’usage ; les autres fiches décrivent leurs liens à ce socle.
  credit_capability:
    id: credit-check-decision
    parent: ba-order-lifecycle-management
    published_in: 2026-10-07.3
  party_role: D09 contient déjà le classement de risque et la limite autorisée ; leur séparation de l’identité doit être explicitée.
  ingestion: Reference Ingestion mentionne déjà les profils et règles du contrôle de gestion. Son comportement master-data-ingestion-finance
    reste générique ; l’apport métier ciblé est à préciser.
  policies: subdomain-policies distingue déjà les règles de crédit externes des contrôles actifs sous autorité du Core.
recommendation:
  reference_presentation:
    principle: Décrire Merchandise References, Packaging References et Internal Supplies & Equipment References comme sujets
      métier, sans les présenter comme des vues d’un référentiel technique commun.
    identity_boundary: Un même bien peut avoir plusieurs usages et des références liées. Cette cohérence métier ne décide
      ni stockage commun, ni service partagé, ni découpage de composants.
    follow_up: Revoir le placement de Product Reference et Product Price Book et éviter le doublon Product Reference / Merchandise
      Reference ; le rattachement précis reste à intégrer au lot validé.
  credit_core_boundary:
    retire_candidate_id: credit-check-decision
    case_responsibility: Le Case B2B applique ou sollicite le contrôle de crédit selon les règles autorisées et les données
      financières nécessaires.
    core_responsibility: Recevoir les profils, tenir leurs références utilisables, conduire le parcours et appliquer les transitions
      autorisées aux commandes.
    guard: Ne pas déplacer implicitement la décision financière dans Process Orchestration, Sales Order ou une capacité générique
      renommée.
    finance_authority: Le contrôle de gestion ou l’autorité Finance concernée reste responsable du classement, des limites
      et des dérogations.
  reference_choice:
    proposed_name: Customer Credit Profile
    proposed_kind: reference
    proposed_parent: ba-partner-agreement-references
    definition: Informations financières de référence reçues de l’autorité compétente pour encadrer les ventes à un client
      ou payeur dans un périmètre et une période donnés.
    contents:
    - Classement ou groupe de risque reçu
    - Limite autorisée et devise
    - Restrictions financières applicables reçues
    - 'Périmètre concerné : client, payeur, groupe ou segment selon la source'
    - Origine, version et validité
    party_role_boundary: Party / Role conserve identité, relations et rôle client ou payeur ; le profil financier lui est
      relié sans définir une seconde identité.
    agreement_boundary: Les conditions de paiement et garanties réellement convenues restent dans Agreement ; une limite décidée
      unilatéralement ne devient pas un contrat.
    dynamic_data_boundary: L’encours, l’exposition courante et le résultat d’un contrôle de commande restent des informations
      financières contextualisées, pas des paramètres de référence par défaut.
    alternative_customer_policy: Customer Policy conviendrait à un ensemble plus large de règles de traitement des clients.
      Ce périmètre n’est pas démontré par le seul besoin de crédit.
    alternative_credit_policy: Customer Credit Policy désignerait les règles de crédit elles-mêmes ; classement et limite
      d’un client caractérisent plutôt son profil.
    policies_boundary: Le nom Policy n’attribue pas au sous-domaine Policies la maîtrise de règles reçues de Finance.
  target_information_flow:
  - Contrôle de gestion, autorité émettrice
  - Reference Ingestion / Reference Ingestion from Finance, prise en compte de l’apport
  - Customer Credit Profile dans Partner & Agreement References, référence locale utilisable liée à Party / Role
  - Case B2B, consommation pour son contrôle de crédit
  flow_limit: Flux métier cible demandé par Laurent ; aucune interface ni réalisation installée établie.
  scenario: Conserver customer-credit-hold et ses deux parcours comme illustration B2B. Présenter le Credit Check comme logique
    du Case et relier les contributions aux capacités du Core effectivement mobilisées.
  glossary: Conserver la notion Credit Check dans le glossaire avec son contexte B2B ; aligner les frontières de Party / Role,
    profil financier, Policies et références par usage dans le même lot.
market_comparisons:
- vendor: Microsoft
  product: Dynamics 365 Finance
  source_ids:
  - S01
  - S02
  similarities: Distingue attributs de crédit, limites et groupes clients des règles de blocage et de libération des commandes
    ; les limites peuvent porter sur des groupes avec devise et validité.
  differences: Le produit réalise la gestion et le contrôle de crédit. La proposition FLOW garde uniquement les informations
    de référence dans le Core et place le contrôle dans les Cases B2B.
  choice_justification: Une référence financière contextualisée évite de traiter toute limite comme un attribut universel
    de l’identité Party.
  limits: Recouvrement partiel ; ni nom Customer Credit Profile ni frontière Core/Case prescrits par Dynamics.
- vendor: SAP
  product: SAP S/4HANA Sales / SAP Credit Management
  source_ids:
  - S03
  similarities: Relie clients et Business Partners à des données de crédit ; distingue risque, limite, exposition et contrôle,
    avec des périmètres de crédit par segment.
  differences: La solution intégrée couvre aussi le calcul du risque, des limites et du résultat sur la vente ; ces responsabilités
    ne sont pas toutes dans le Core FLOW proposé.
  choice_justification: La notion de profil relié au partenaire et contextualisé financièrement est pertinente sans reproduire
    la structure logicielle SAP.
  limits: Appui sémantique partiel ; la source ne prescrit ni une nouvelle référence FLOW ni son rattachement. Aucun consensus
    de taxonomie ou déploiement Beaumanoir allégué.
