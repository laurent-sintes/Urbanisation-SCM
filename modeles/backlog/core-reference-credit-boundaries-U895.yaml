core_positioning_U896_U897:
  source_refs:
  - U896
  - U897
  principle: Le Core porte les responsabilités Supply réutilisables et leurs invariants. Achat et Vente portent les parcours
    opérationnels spécialisés et leurs règles de contexte.
  sales_subdomains_user_labels:
  - B2C/eCom
  - B2C/Store
  - Wholesale
  scope_of_approval: Organisation de responsabilité exprimée par Laurent ; les noms canoniques anglais et la décomposition
    détaillée restent à préparer.
  existing_model_gap: Sales est encore défini comme le seul versant commercial et ne présente aucun sous-domaine. Cette restriction
    doit être revue avec le périmètre opérationnel exprimé ; Sourcing and Procurement doit être relu de même.
  canonical_domain_name: Supply Chain Orchestration ; aucun renommage implicite en Supply Chain Management.
  credit_check: Documenter le contrôle spécialisé dans les Cases B2B/Wholesale et retirer la capacité autonome du périmètre
    Core lors de l’application du lot cohérent.
  generic_capabilities: Les Cases mobilisent Order Management, Availability, Inventory Management, Service Management et Process
    Management selon leur besoin ; leur emploi ne crée pas de duplicata par canal.
  reference_boundary: Party / Role identifie les parties ; la référence financière reçue conserve sa provenance et son autorité.
    Le nom et le périmètre Customer Credit Profile restent une recommandation.
  implementation_limit: La cartographie décrit d’abord des responsabilités métier ; cette distinction ne prescrit ni services
    déployés, ni bases de données, ni composants séparés.
  scenario_boundary: Un scénario Wholesale peut illustrer les capacités du Core sans introduire B2B ou le contrôle de crédit
    comme nouveaux parents ou capacités de ce Core.
