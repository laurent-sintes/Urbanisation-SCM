findings:
- id: R50-01
  priority: P1
  kind: contradiction
  title: Plan Visibility encore présenté comme un sous-domaine
  node_ids:
  - supply-chain-orchestration
  - D03
  - subdomain-plans
  evidence:
    scope_quote: Le Domain comprend neuf sous-domaines
    structure: 8 sous-domaines SCM ; subdomain-plans est une Business Area sous D03.
  impact: La fiche de synthèse contredit l’arbre que le client parcourt.
  recommendation: Corriger la liste et éviter les décomptes et listes hiérarchiques recopiés en prose lorsque la structure
    peut les fournir.
  market_sources: []
  gate: before_client_presentation
  status: proposed_not_applied
- id: R50-02
  priority: P1
  kind: lexical_and_boundary
  title: Ingestion des références non alignée
  node_ids:
  - master-data-ingestion
  - D12
  evidence:
    glossary: TER050 = Reference Ingestion ; capacité = Master Data Ingestion.
    scope: Huit sujets et Price Book unique encore décrits dans l’ingestion, contre neuf références et deux Price Books dans
      l’arbre.
    catalog_quote: Les tarifs de produits et services sont portés par [Product Price Book](model:product-price-book).
  impact: L’autorité des données et la séparation des tarifs produits/services peuvent être mal comprises.
  recommendation: Aligner Reference Ingestion et les neuf références ; corriger la phrase qui place les tarifs des services
    dans Product Price Book.
  market_sources: []
  gate: before_client_presentation
  status: proposed_not_applied
- id: R50-03
  priority: P1
  kind: conceptual_contradiction
  title: Commande et représentation documentaire
  node_ids:
  - D04.j
  evidence:
    TER012: Commande définie comme document métier structuré U874.
    TER086: Purchase Order Document distingue encore le document et la commande métier.
    scope: Purchase Order oppose encore objet et document sans expliciter représentation et identité.
  impact: Le lecteur ne sait pas si la commande documentaire est l’objet métier lui-même ou un autre objet.
  recommendation: 'Préserver la décision U874 : distinguer clairement commande structurée, ses éditions/messages et capacité
    qui la gère, puis harmoniser TER086 et les fiches.'
  market_sources: []
  gate: before_client_presentation
  status: proposed_not_applied
- id: R50-04
  priority: P2
  kind: editorial
  title: Définitions trop courtes et noms larges
  node_ids:
  - order-workflow-planning
  - D05.f
  - service-order-payment-collection
  - D03.j
  evidence:
    workflow: Construire ou adapter le parcours.
    planning: Master Planning désigne le plan de matching interne, pas tout le master planning Microsoft.
    payment: Nom Payment plus large que le périmètre d’encaissement retenu.
    ctp: Définition parle de ressources supplémentaires ; le scope précise des capacités pouvant déjà exister.
  impact: Les détails longs réparent des ambiguïtés introduites dès le titre ou la définition courte.
  recommendation: Définitions autonomes incluant objet et frontière ; conserver les noms validés sauf arbitrage ultérieur.
    Mentionner le matching interne, le périmètre d’encaissement et la faisabilité des apports CTP.
  market_sources: []
  gate: before_client_presentation
  status: proposed_not_applied
- id: AV-01
  priority: P1
  kind: responsibility_to_explicit
  title: 'Achats planifiés : admission et affermissement'
  node_ids:
  - plans-ingestion
  - plans-visibility
  - D04.j
  - D03.i
  - D03.j
  - D01.c
  evidence:
    present: Distinction Planned Purchase Order/Purchase Order, filiation et absence de double compte documentées.
    gap: Supply Plan et Plan Ingestion sont décrits hors achats. Le point de réception, la tenue et l’admissibilité de la
      proposition MAP avant affermissement ne sont pas définis aussi explicitement que sa conversion.
  impact: Une proposition planifiée pourrait être ignorée ou traitée à tort comme apport confirmé.
  recommendation: 'Nommer le responsable de réception/tenue et les règles de prise en compte : proposition, affermi, confirmé,
    expédié, reçu ; conserver le lien et retirer l’ancienne attente. Aucun ajout de capacité nécessaire par défaut.'
  market_sources:
  - MS-FIRM
  - SAP-MRP
  gate: scope_to_expose_in_client_workshop
  status: proposed_not_applied
- id: AV-02
  priority: P2
  kind: partial_coverage
  title: 'Alternatives : auteur et admissibilité'
  node_ids:
  - D03.i
  - D03.j
  - D03.k
  - D12
  - D06.e
  evidence:
    present: Réseau ATP, équivalence autorisée en CTP, comparaison économique PTP et scénario substitution-price-service.
    gap: La responsabilité de produire les candidats produit/site/date/service et l’autorité sur l’équivalence ne sont pas
      réunies dans un contrat explicite.
  impact: Une option peu coûteuse pourrait être lue comme automatiquement autorisée.
  recommendation: Décrire les entrées d’autorisation commerciale, la construction des options par les capacités existantes
    et l’évaluation ATP/CTP/PTP. Ne pas recréer Promise Selection Decision ni déplacer les référentiels dans Availability.
  market_sources:
  - MS-DOM
  - SAP-ABC
  gate: scope_to_expose_in_client_workshop
  status: proposed_not_applied
- id: AV-03
  priority: P2
  kind: partial_coverage
  title: 'Promesse complète : maille ligne et commande'
  node_ids:
  - D03.i
  - D03.k
  - D04.n
  - D02.e
  evidence:
    present: Dates, quantités, part non couverte et exemple B2B 60+40 ; exigence de livraison complète dans Plan Application.
    gap: Peu d’explication sur la faisabilité conjointe de plusieurs lignes, d’un kit ou d’un assortiment complet lorsque
      chacune est promettable séparément.
  impact: Une promesse correcte par ligne peut être irréalisable pour une commande devant partir ensemble.
  recommendation: 'Ajouter un cas multi-lignes à livraison complète : synchroniser les dates et contraintes avant confirmation
    ; distinguer fractionnement proposé et scission effective de commande.'
  market_sources:
  - MS-DOM
  - SAP-ABC
  gate: client_challenge_case
  status: proposed_not_applied
- id: AV-04
  priority: P2
  kind: contradiction_and_contract
  title: Validité de proposition et réservation
  node_ids:
  - D02.c
  - D03.i
  - D04.i
  - D05.h
  evidence:
    contradiction: 'D02.c conserve U436 : expiration/consommation/libération restent à préciser, puis U733 les déclare responsabilités
      communes.'
    present: Le scénario last-item-concurrency distingue consultation, réservation unique et annulation.
    gap: Validité de la proposition pendant l’attente de confirmation et réévaluation si la situation change restent peu explicites.
  impact: Une proposition calculée à un instant pourrait être assimilée à un droit garanti jusqu’à acceptation.
  recommendation: Nettoyer la réserve périmée et expliciter validité, éventuelle protection, réexamen avant confirmation et
    libération. Pas de durée arbitraire ni mécanisme logiciel imposé.
  market_sources:
  - MS-RES
  - SAP-BOP
  gate: before_client_presentation
  status: proposed_not_applied
- id: AV-05
  priority: P2
  kind: partial_evidence
  title: Décision sans solution et explication au client
  node_ids:
  - D03.i
  - D03.k
  - BHV006
  - order-visibility
  evidence:
    present: Part non couverte, hypothèses, incertitudes et absence de solution admissible mentionnées.
    gap: Motif limitant, alternatives rejetées et condition permettant de réexaminer sont dispersés ; aucun scénario explicite
      ne clôt sur aucune solution autorisée.
  impact: Le modèle peut donner l’impression qu’une combinaison ATP/CTP/PTP produit toujours une réponse acceptable.
  recommendation: 'Préciser le résultat métier négatif et un cas sans solution : manque, restriction, date, capacité ou coût
    ; tracer l’explication dans les objets existants, sans nouvelle capacité Visibility.'
  market_sources:
  - SAP-RACR
  - MS-ATP
  gate: client_challenge_case
  status: proposed_not_applied
- id: GEN-01
  priority: P1
  kind: scope_gap
  title: 'Retour client : autorisation, avoir, remboursement et remplacement'
  node_ids:
  - D04.l
  - D05.i
  - service-order-billing
  - service-order-payment-collection
  evidence:
    explicit_reserve: 'D04.l : autorisation commerciale du retour, remboursement et remplacement client restent à délimiter.'
    current: Les cinq parcours décrivent principalement le devenir physique ; Payment est borné à l’encaissement.
  impact: Un flux de retour complet ne peut être présenté comme fermé de bout en bout.
  recommendation: 'Décider qui autorise et qui réalise : Sales/Finance/FLOW. Documenter les coopérations et couvrir au moins
    avoir, remboursement et échange ; ne pas inventer automatiquement Refund Management.'
  market_sources:
  - MS-RETURN
  - SAP-RETURN
  gate: scope_to_expose_in_client_workshop
  status: proposed_not_applied
- id: GEN-02
  priority: P2
  kind: scope_gap
  title: Blocage commercial pour risque de crédit
  node_ids:
  - D04.i
  - order-workflow-sentry
  - D19.b
  evidence:
    present: Suspension/reprise et conditions de parcours génériques.
    gap: 'Pas de règle de coopération explicite avec une autorité de crédit dans les définitions/scopes examinés. Absence
      lexicale seule non utilisée comme preuve : les cycles génériques ont été lus.'
  impact: Le parcours B2B peut promettre puis réaliser sans savoir qui impose ou lève le blocage financier.
  recommendation: Préciser les décisions externes consommées, leur effet et leur levée. La finance peut rester hors de FLOW
    ; cela ne dispense pas de représenter l’interface métier.
  market_sources:
  - MS-CREDIT
  - SAP-CREDIT
  gate: scope_to_expose_in_client_workshop
  status: proposed_not_applied
