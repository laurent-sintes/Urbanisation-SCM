    edition: Page évolutive, édition non précisée
    accessed_on: '2026-10-12'
    consulted_content: Customer Journey Transition Paths, Transition Option Summary et Initial Data Load ; comparaison de
      bascules groupées ou progressives et reprise des données ouvertes.
    native_id: null
