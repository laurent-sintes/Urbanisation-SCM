- U973
state: applied_with_U973
baseline_publication: 2026-10-12.4
finding:
  hotspot_id: HS-001
  current_classification: Structurant, cible core_system
  limitation: La justification actuelle confond réalisation transitoire du cœur et modification de sa cible durable.
proposal:
  principle: Distinguer la portée des impacts ; un sujet peut toucher plusieurs portées.
  scopes:
  - id: model
    label: Modèle
    question: Le sujet change-t-il les responsabilités, règles ou contrats durables du SI commun ?
  - id: transition
    label: Transition
    question: Le sujet contraint-il les étapes, dépendances, coexistences, reprises ou conditions de bascule ?
  - id: usage
    label: Usage
    question: Le sujet concerne-t-il la praticité du travail dans les outils ?
  evidence_policy: Qualifier chaque portée séparément ; un impact non établi ne signifie pas absent. Justifier les portées
    retenues.
  boundaries: Garder scope/integration pour la localisation. Gap Analysis, complexité, criticité, visibilité et progression
    restent des dimensions distinctes.
  framing: Un sujet de transition peut être structurant pour le cadrage et la roadmap même sans modification démontrée de
    la cible.
  ux: Afficher Modèle, Transition et Usage comme impacts cumulables ; préciser le libellé Structurant pour la transition lorsque
    cette portée est démontrée.
hs001_proposal:
  primary_impact: transition
  rationale: Reprendre les commandes ouvertes et conserver les échanges nécessaires pendant le remplacement de MM, PP et SD
    impose une trajectoire ; cela ne démontre pas une remise en cause du modèle cible.
  resolution_question: Quelle séquence de bascule et quelles coexistences permettent de poursuivre les opérations, avec FI/CO
    conservé hors du périmètre migré ?
  options_policy: Les options existantes de migration par responsabilités ou de bascule d’un ensemble cohérent restent des
    hypothèses à éprouver.
  model_impact: not_established
market_comparison:
  relation: methodological_support
  common_points: Microsoft traite la stratégie de migration et les données ouvertes ; SAP distingue plusieurs chemins de transition
    et leurs contraintes.
  difference: Ces sources concernent des migrations vers les produits éditeurs ; HS-001 concerne FLOW, sans choix d’un produit
    cible ni équivalence de trajectoire établie.
  conclusion: Les sources éclairent la distinction entre résultat cible et chemin de transition ; la classification proposée
    reste un choix du métamodèle FLOW, pas une taxonomie standard des éditeurs.
  references:
