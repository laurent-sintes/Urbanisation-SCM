      existe, son droit d’usage. Il ne signifie pas à lui seul stock logique, stock virtuel ou stock exclusivement protégé.'
    flow_scope: Regroupement explicite de ressources et de droits associés.
    flow_approach: Préciser appartenance, accès et consommation.
    synthesis:
    - Microsoft donne au pool un rôle de base commune à partager ; Oracle montre plusieurs niveaux de ciblage des ressources.
      Regrouper et réserver sont deux opérations différentes.
    - 'FLOW nomme les règles du pool : ressources incluses, éventuels recouvrements, bénéficiaires et consommation. Le nom
      ne permet pas d’inférer une exclusivité ni une disponibilité supplémentaire.'
    examples:
    - title: Illustration FLOW — regrouper plusieurs dépôts
      situation: Les pièces admissibles de deux dépôts constituent un pool pour certaines demandes.
      outcome: Le regroupement fournit une vue commune ; les restrictions de chaque pièce et les délais restent applicables.
      lesson: Les biens déjà comptés dans les dépôts ne s’ajoutent pas une seconde fois dans le pool.
      source_title: Inventory Visibility inventory allocation
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-allocation
      source_refs:
      - U477
      - ELM410
      - CMP190
- id: TER022
  name: Couverture d’une demande
  short_description: Lien qualifié entre une demande et ce qui permet de la satisfaire, avec quantités, dates et conditions.
  definition: Relation qualifiée entre une demande et les éléments qui permettent ou sont prévus pour la satisfaire, pour
    des quantités, dates et conditions définies.
  context: Sens métier précisé en U260 ; distinct de la convention de description du glossaire de modélisation et de la couverture
    de stock.
  notes: 'Préciser le critère : ressources envisageables, ressources affectées, promesse confirmée ou réalisation constatée.
    Exemple : 100 pièces couvertes de manière candidate par 60 sur stock et 40 sur réception attendue ; cela ne prouve ni
    réservation ni promesse confirmée. Une quantité couverte à une date tardive ne satisfait pas une échéance impérative antérieure.
    « Couvert » seul reste insuffisant. Voir aussi [Couverture de stock](glossary:TER077).'
  source_refs:
  - U203
  - U260
  - U477
  - CMP190
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
