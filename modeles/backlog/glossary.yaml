  market_inspiration:
    choice: 'Désigner ce qui peut être mobilisé pour un résultat : Ressource couvre un bien, un moyen ou un droit, sous des
      conditions explicites. Ce terme de travail est plus large que le stock de marchandises.'
    flow_scope: Biens, moyens et droits mobilisables.
    flow_approach: Préciser disponibilité, accès et usage admissible.
    synthesis:
    - Microsoft éclaire les moyens pris en compte pour répondre aux besoins ; SAP montre qu’un droit peut limiter leur accès.
      Les documents ne proposent pas le même objet ni une définition commune du mot ressource.
    - FLOW utilise Ressource comme terme englobant, puis nomme le bien, le moyen ou le droit concerné. La quantité et l’information
      qui le représente ne doivent pas être comptées comme deux ressources physiques.
    examples:
    - title: Illustration FLOW — cent pièces, un accès limité
      situation: Cent pièces existent dans le réseau, mais un groupe ne peut en confirmer que vingt sur la période.
      outcome: Le stock vaut cent ; le droit de ce groupe borne son accès à vingt.
      lesson: La ressource physique et la règle d’accès ont des rôles différents.
      source_title: Explaining aATP Product Allocation (PAL)
      source_url: https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-aatp-product-allocation-pal-_dd30c229-d63f-4aba-a950-a174280c4a58
