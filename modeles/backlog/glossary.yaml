    consulted_on: '2026-09-19'
    concept_name: Product Allocation (PAL)
    scope_summary: Limites de confirmation par groupe et période.
    approach_summary: Plafonner l’accès à un stock commun.
    evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
      de capacités.
    element_name: Product Allocation (PAL)
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Un droit de confirmation peut limiter l’accès à une quantité.
    differences: Un plafond n’est ni une marchandise supplémentaire ni une garantie d’obtenir le stock.
    flow_position: 'Désigner ce qui peut être mobilisé pour un résultat : Ressource couvre un bien, un moyen ou un droit,
      sous des conditions explicites. Ce terme de travail est plus large que le stock de marchandises.'
    status: proposed
