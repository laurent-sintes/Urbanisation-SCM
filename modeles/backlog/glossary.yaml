      techniques ne sont pas automatiquement des capacités ou comportements ; FLOW exprime les responsabilités et résultats
      métier.'
  market_inspiration:
    choice: Prévenir un destinataire de ce qui vient de se produire lui permet de réagir avec les bonnes références. Notification
      d’événement désigne ce message, distinct du fait lui-même.
    flow_scope: Message qui signale un fait à un destinataire.
    flow_approach: Transmettre le contexte utile sans confondre informer et demander une action.
    synthesis:
    - Fowler distingue la notification d’événement d’une demande d’action déguisée ; le message peut ne contenir que les références
      utiles pour consulter les détails. CloudEvents distingue le fait capté par un système de sa représentation transmise
      et admet plusieurs événements pour ce même fait.
    - Le premier explique l’intention du message ; le second facilite son échange entre systèmes. FLOW retient l’intention
      métier et les références nécessaires, sans prescrire de format, de protocole ou de mode de conservation.
    examples:
    - title: Illustration FLOW — signaler une réception
      situation: Une réception a été enregistrée avec son document ; un message avertit le responsable d’une commande concernée.
      outcome: Le destinataire dispose des références pour consulter le fait et décider de la suite.
      lesson: 'Le message informe : son émission ne constitue ni une nouvelle réception ni, à elle seule, un ordre de poursuivre.'
      source_title: What do you mean by Event-Driven?
      source_url: https://martinfowler.com/articles/201701-event-driven.html
      source_refs:
      - U477
      - ELM459
      - CMP192
