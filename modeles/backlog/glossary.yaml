  definition: Relation entre sociétés juridiquement distinctes d’un même groupe, appliquée ici à une vente et à l’achat correspondant.
    Elle qualifie les parties à l’opération, indépendamment du trajet physique des produits.
  context: 'Exemple fictif : A vend 100 vestes à un client, achète ces vestes à B et B livre directement le client. Les [commandes
    de vente](glossary:TER069) et la [commande d’achat](glossary:TER070) restent distinctes et reliées. Une livraison directe
    n’impose pas, à elle seule, la date de changement de propriétaire.'
  notes: Dans FLOW, [Intercompany Sales](model:BHV069) est une variante d’exécution de [Sales Order](model:D04.i). Le scénario
    explique la coopération des capacités ; il ne crée pas une capacité Intercompany autonome. Les règles de facturation et
    de comptabilité restent dans leurs périmètres respectifs. L’exemple ne décrit aucune pratique installée du groupe.
