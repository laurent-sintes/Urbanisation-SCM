- id: TER097
  name: Price Book
  short_description: Ensemble de tarifs de référence de produits et services.
  definition: Ensemble identifié de tarifs de référence de produits et de services, avec unités, devises, validité et conditions
    d’application.
  context: Supply Chain Orchestration / Operational References
  notes: 'Plusieurs livres tarifaires peuvent coexister selon le contexte, les parties et l’autorité qui les fournit. [Product
    Catalog](glossary:TER049) et [Service Catalog](glossary:TER094) décrivent les offres ; [Assortment](glossary:TER087) sélectionne
    les produits ; [Agreement](glossary:TER048) porte les conditions convenues. Un Price Book peut leur être associé sans
    correspondance un-à-un obligatoire. Le tarif de référence ne constitue ni le prix contextualisé calculé ni le prix engagé
    dans une commande. La maîtrise commerciale reste externe ; Supply conserve la référence locale reçue. Exemple fictif :
    un tarif porte un montant par vêtement et un autre par prestation de réétiquetage, chacun avec sa période et son unité.'
  source_refs:
  - U723
  - ELM721
  - ELM531
