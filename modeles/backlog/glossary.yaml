  short_description: Contribution pilotée par l’orchestration, avec ses conditions et dépendances ; distincte d’un ordre de
    prestation et d’une tâche opérateur.
  definition: Contribution pilotée au sein d’un processus d’orchestration, avec ses conditions d’activation et ses dépendances.
    Elle peut mobiliser des [Service Orders](glossary:TER066) dont [Service Order](glossary:TER066) Management tient les engagements
    individuels ; elle n’est ni l’ordre lui-même ni une tâche opérateur de l’exécutant.
  context: Supply Chain Orchestration
  notes: Une Task peut attendre une condition, déclencher une sollicitation et vérifier le résultat de sa contribution. Les
    réponses et reprises de l’ordre sont tenues par [Service Order](glossary:TER066) Management ; l’orchestration coordonne
    les dépendances et mobilise les adaptations décidées. Un acquittement ne prouve pas une fin physique.
