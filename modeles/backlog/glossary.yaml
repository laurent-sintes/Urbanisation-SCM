- id: TER111
  name: Demand & Supply Planning
  short_description: Élaborer et réviser les plans prévisionnels de demande et de ressources qui alimentent les décisions
    opérationnelles.
  definition: élaborer et réviser les plans prévisionnels de demande et de ressources pour anticiper les besoins et orienter
    les décisions opérationnelles.
  context: 'Domaine de Business Operations extérieur à [Supply Chain Orchestration](model:supply-chain-orchestration). Il
    produit les [Demand Plans](glossary:TER099) et [Supply Plans](glossary:TER098) transmis à [Plan Ingestion](model:plans-ingestion),
    puis exposés par [Plan Visibility](model:subdomain-plans). Des outils de planification avancée peuvent servir ce domaine,
    qui reste indépendant des outils et de l’organisation. Le contrat reçu conserve les versions, horizons, provenance et
    statuts. Le [Supply Plan](glossary:TER098) consommé par FLOW garde son sens actuel : prévisions de mouvements de stock
    hors achats ; cela ne limite pas l’ensemble des plans que le domaine Demand & Supply Planning peut produire. La décomposition
    interne de Demand & Supply Planning reste hors périmètre. Les arbitrages opérationnels et le master plan de [Availability](glossary:TER112)
    restent dans l’orchestration ; recevoir une nouvelle prévision ne les remplace pas et ne crée pas un ordre ferme. Aucun
    outil de planification avancée installé ni flux technique Beaumanoir n’est présumé.'
  notes: 'Domaine métier distinct des documents Demand Plan et Supply Plan et du Matching Master Plan interne. Le rapprochement
    avec SCOR Plan est partiel : certaines décisions de planification restent dans Matching. Le nom explicite les deux volets
    ; aucune famille d’outils ne définit ce domaine.'
  source_refs:
  - U794
  - U797
  - U801
  review:
    state: proposed
    note: Alignement avec le nouveau domaine ; les formulations détaillées ne sont pas un accord mot à mot.
