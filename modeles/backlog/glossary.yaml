    applicables ; elle ne garantit pas à elle seule une disponibilité absolue. Un plafond de consommation ne constitue pas
    automatiquement un minimum protégé. Un seuil Min/Max de réassort ne rend pas automatiquement le stock restant invendable.
    [Supply Assignment](glossary:TER017) conserve le sens d’affectation des ressources aux demandes ; U796 confirme le nom
    Supply Protection Policy. Les identités et les périmètres sont conservés.'
