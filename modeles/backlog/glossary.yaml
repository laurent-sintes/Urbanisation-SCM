      des identifiants GTIN.
    differences: Les domaines sources Commerce, Finance et Design sont des choix FLOW ; ce flux ne démontre pas trois comportements
      natifs d’ingestion chez SAP.
    flow_position: FLOW conserve le périmètre métier de GTIN. Les domaines sources Commerce, Finance et Design sont des choix
      FLOW ; ce flux ne démontre pas trois comportements natifs d’ingestion chez SAP.
    source_title: Introducing the Retail Article Master
    source_url: https://learning.sap.com/courses/discovering-retail-functions-and-business-processes-in-sap-s-4hana-retail/introducing-the-retail-article-master_bd2d9df6-bf54-4612-8fa0-b35c63fbb0d8
    source_version: Documentation évolutive ; périmètre produit du cours ou de la page cité, version globale non présumée.
    source_locator: Introducing the Retail Article Master — passages sur le mécanisme rapproché.
    consulted_on: '2026-09-25'
    evidence_limits: Passages primaires consultés. Correspondance partielle ; aucun consensus, équivalence complète ou déploiement
      Beaumanoir déduit. Les domaines sources Commerce, Finance et Design sont des choix FLOW ; ce flux ne démontre pas trois
      comportements natifs d’ingestion chez SAP.
    status: proposed
    source_refs:
    - U774
    - CMP307
    - ELM063
    term_choice: Le nom GTIN reste celui du modèle FLOW ; la source étaye le rapprochement, pas nécessairement cette appellation
      ni sa maille.
    definition_choice: 'Le référentiel retail distingue article générique et variantes ; les échanges catalogue utilisent
      notamment des identifiants GTIN. Frontière conservée : Les domaines sources Commerce, Finance et Design sont des choix
      FLOW ; ce flux ne démontre pas trois comportements natifs d’ingestion chez SAP.'
  market_inspiration:
    choice: Identifier une référence commerciale partagée par plusieurs exemplaires. GTIN conserve son sens GS1 ; il ne désigne
      pas à lui seul une pièce particulière.
    flow_scope: Référence commerciale, variante ou conditionnement pertinent.
    flow_approach: Séparer identifiant de classe et identité individuelle.
    synthesis:
    - 'GS1 System Architecture situe le GTIN au niveau de la référence commerciale. Le guide d’étiquette logistique le distingue
      du SSCC de l’unité logistique. Les deux répondent à des questions différentes : quel article et quelle unité constituée.'
    - FLOW conserve cette distinction. Lire un GTIN peut reconnaître la référence, mais ne prouve pas quel exemplaire a été
      déplacé ni quel contenant physique est concerné.
    examples:
    - title: Illustration FLOW — même code, deux exemplaires
      situation: Deux pièces portent le même GTIN parce qu’elles partagent la même référence commerciale.
      outcome: La lecture du code reconnaît le type de produit.
      lesson: Elle ne suffit pas à distinguer les deux pièces l’une de l’autre.
      source_title: GS1 Logistic Label Guideline
      source_url: https://www.gs1.org/standards/gs1-logistic-label-guideline/1-3
      source_refs:
      - U477
      - ELM470
      - CMP193
