    flow_position: Alimenter les stocks magasin au fil des ventes selon les seuils retenus. Réassort conserve ce sens exprimé
      pour FLOW, distinct de la mise en place initiale et de la seule sortie de réserve vers le rayon.
    status: proposed
    source_refs:
