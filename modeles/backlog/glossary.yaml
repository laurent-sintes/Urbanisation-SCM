    approach_summary: Combiner référence et numéro individuel.
  - vendor: GS1
    product: Global Traceability Standard
    source_title: GS1 Global Traceability Standard
    source_url: https://www.gs1.org/standards/gs1-global-traceability-standard/current-standard
    source_version: Release 2.0, 2017
    source_locator: Identification levels ; Data recording and sharing ; R21
    consulted_on: '2026-09-19'
    evidence_limits: Passages primaires indexés consultés ; ouverture directe non exploitable. Les exigences GS1 ne sont pas
      imposées au modèle.
    element_name: Instance-level identification
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Occurrence suivie individuellement.
    differences: La sérialisation est une option de suivi, pas une conséquence de tout GTIN.
    flow_position: Distinguer un exemplaire dans un périmètre d’unicité précisé. Serial Number est un identifiant éventuel
      de la pièce, indépendant du code-barres ou autre support utilisé pour le lire.
    status: proposed
    source_refs:
    - U477
    - ELM469
    - CMP193
    concept_name: Instance-level identification
    scope_summary: Occurrence suivie individuellement.
    approach_summary: Préserver une identité distinguant les exemplaires.
  market_inspiration:
    choice: Distinguer un exemplaire dans un périmètre d’unicité précisé. Serial Number est un identifiant éventuel de la
      pièce, indépendant du code-barres ou autre support utilisé pour le lire.
    flow_scope: Identifiant d’exemplaire et domaine d’unicité.
    flow_approach: Associer le numéro au contexte qui le rend distinctif.
    synthesis:
    - GS1 System Architecture décrit l’identification d’un exemplaire commercial par GTIN et numéro de série. Le Global Traceability
      Standard explique l’usage de cette combinaison pour suivre une occurrence précise. Il s’agit de deux appuis GS1, pas
      de deux normes indépendantes du marché.
    - FLOW retient le besoin de préciser l’unicité. Un numéro de série isolé n’est pas présumé unique dans toute l’entreprise
      ou chez tous les fabricants, et le support de lecture ne définit pas son sens.
    examples:
    - title: Illustration FLOW — même numéro, contexte différent
      situation: Deux fabricants peuvent utiliser le même numéro local pour des produits différents.
      outcome: Le contexte de référence permet de déterminer de quel exemplaire on parle.
      lesson: La règle d’unicité doit être connue avant de considérer le numéro comme une identité globale.
      source_title: GS1 Global Traceability Standard
      source_url: https://www.gs1.org/standards/gs1-global-traceability-standard/current-standard
      source_refs:
      - U477
      - ELM469
      - CMP193
