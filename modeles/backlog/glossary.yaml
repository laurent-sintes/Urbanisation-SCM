  market_inspiration:
    choice: Décrire ce qu’un produit permet effectivement de faire aide à comparer son apport au besoin métier. Fonctionnalité
      de produit désigne un comportement offert dans une édition et une configuration données.
    flow_scope: Possibilités documentées d’un produit.
    flow_approach: Vérifier l’édition, les conditions et les effets avant de conclure sur la couverture.
