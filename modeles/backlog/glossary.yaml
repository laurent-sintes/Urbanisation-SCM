  - vendor: Microsoft
    product: Dynamics 365 Commerce
    element_name: Partial orders rule
    concept_name: Partial orders rule
    element_type: Notion ou usage documenté
    relationship: Rapprochement de sens
    scope_summary: Possibilités de découpage proposées par DOM.
