      sans supposer qu’une promesse change en même temps.
    flow_scope: Affectations existantes dans un périmètre révisable.
    flow_approach: Appliquer les nouveaux liens autorisés.
    synthesis:
    - SAP Reassignment remet en jeu les liens d’une ligne. Microsoft montre qu’une ressource reçue peut aussi être rattachée
      à une demande plus précoce selon les règles de préservation. Ces usages rendent visible le changement de couverture.
    - FLOW exige de qualifier ce qui devient différent et ce qui reste protégé. Réaffecter ne donne pas un droit général de
      casser réservations, gels ou engagements.
    examples:
    - title: Illustration FLOW — autre arrivage, même promesse
      situation: Les 40 pièces d’une commande étaient liées à l’arrivage A ; B offre les mêmes quantités et dates admissibles.
      outcome: Le lien peut passer de A à B sans modifier la promesse.
      lesson: SAP étaye la révision de liens ; FLOW précise que son effet sur l’engagement doit être examiné séparément.
      source_title: Backorder Processing — Reassignment
      source_url: https://help.sap.com/docs/PRODUCT_ID/f132c385e0234fe68ae9ff35b2da178c/6b8eb017a1d1431abde00056a249f72b.html
      source_refs:
      - U477
      - ELM378
      - CMP191
