    ; Réassort désigne l’alimentation continue. Les [Orders](glossary:TER012) portent les demandes autorisées et [Fulfilment](glossary:TER085)
    coordonne les prestations.
  notes: |-
    [Replenishment](model:D05.e) intègre les calculs des besoins nets et détermine les quantités et dates à retenir. La décision, la mise à jour transactionnelle, les [Orders](glossary:TER012) nécessaires, leurs promesses et les mouvements physiques restent distincts. Une application automatique est possible ; aucune création directe de [Purchase Order](glossary:TER070) ni validation humaine systématique n’est présumée.

    U313/U316 : dans le contexte retail discuté, distinguer le réassort continu de l’[implantation](glossary:TER079), dont les apports sont décidés par [Replenishment](model:D05.e). Un produit couvrant les deux ne fusionne pas ces responsabilités.
