  - vendor: New Zealand Digital Government
    product: GEA-NZ
    element_name: Categorised capabilities
    concept_name: Categorised capabilities
    element_type: Notion ou usage documenté
    relationship: Rapprochement de sens
    scope_summary: Classement des capacités d’une organisation.
    approach_summary: Repérer lacunes, chevauchements et doublons.
    similarities: Le classement aide à comprendre la carte.
    differences: GEA-NZ renvoie à des taxonomies gouvernementales.
    flow_position: FLOW ne reprend pas une taxonomie externe par défaut.
    source_title: Business capabilities
    source_url: https://dns.govt.nz/standards-and-guidance/technology-and-architecture/government-enterprise-architecture/gea-nz-framework/business-capabilities
