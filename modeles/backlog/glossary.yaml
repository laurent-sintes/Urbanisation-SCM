      Beaumanoir déduit. Une offre logicielle ne prescrit pas le découpage FLOW et ne prouve aucune installation Beaumanoir
      ; les capacités dépassent la couverture d’un seul produit.
    status: proposed
    source_refs:
    - U774
    - CMP307
    - ELM279
    term_choice: Le nom Supply Chain reste celui du modèle FLOW ; la source étaye le rapprochement, pas nécessairement cette
      appellation ni sa maille.
    definition_choice: 'Intelligent Order Management orchestre des commandes entre systèmes et prestataires avec des retours
      d’exécution. Frontière conservée : Une offre logicielle ne prescrit pas le découpage FLOW et ne prouve aucune installation
      Beaumanoir ; les capacités dépassent la couverture d’un seul produit.'
  market_inspiration:
    choice: Nommer l’ensemble des acteurs et activités qui conduisent les produits des fournisseurs aux destinataires, avec
      leurs retours. Supply Chain est plus large que le domaine de coordination Supply Chain Orchestration de FLOW.
    flow_scope: Approvisionnement, transformation éventuelle, stockage, transport, distribution et retours.
    flow_approach: Lire la chaîne dans son ensemble et ses coopérations.
    synthesis:
    - Le CSCMP décrit un périmètre de management intégrant achats, transformation, logistique et partenaires. SCOR DS propose
      une lecture des processus de cette chaîne. Le premier en explique l’étendue, le second fournit des repères de description.
    - FLOW retient le sens large du terme, sans importer la hiérarchie SCOR ni confier toute la chaîne à son domaine d’orchestration.
      Coordonner la réalisation et accomplir chaque opération de la chaîne restent distincts.
    examples:
    - title: Illustration FLOW — une chaîne plus large que sa coordination
      situation: Un produit est acheté, éventuellement transformé, stocké, transporté puis distribué ou retourné.
      outcome: Plusieurs acteurs et responsabilités contribuent à ce parcours.
      lesson: Le domaine FLOW coordonne ses contributions sans reprendre toutes les activités sous un même domaine.
      source_title: SCOR DS Quick Reference Guide
      source_url: https://www.ascm.org/globalassets/documents--files/corporate-transformation/scor-ds-digital-guide_final.pdf
      source_refs:
      - U477
      - ELM465
      - CMP193
- id: TER085
  name: Fulfilment
  short_description: Satisfaction effective d’une commande selon les quantités, délais et conditions retenus.
  definition: 'Ensemble des activités qui organisent et réalisent la satisfaction d’une commande : mobiliser les ressources
    et services nécessaires, coordonner leur mise à disposition et accomplir le résultat attendu selon les quantités, délais
    et conditions retenus.'
  context: La documentation Microsoft distingue optimisation de la satisfaction et opérations effectives de fulfillment. Formulation
    FLOW proposée ; aucune nouvelle capacité agrégée n’est créée par le terme.
  notes: 'Un calcul [ATP](glossary:TER044), une promesse confirmée ou une affectation seule ne prouve pas la réalisation.
    Demand & Supply Optimization recherche comment satisfaire au mieux ; Demand Management établit les possibilités et tient
    les engagements de promesse ; Fulfillment Strategy fixe le cadre ; les exécutants réalisent les prestations. Exemple fictif
    : choisir un stock et un service puis préparer et livrer les pièces attendues. Le marché décrit souvent les commandes
    clients ; l’application aux transferts, achats, retours ou services numériques de FLOW doit préciser le résultat et le
    point de vue, sans prétendre à une équivalence universelle. Les retours ne sont pas automatiquement inclus ou exclus du
    seul fait du mot. Voir [Supply](glossary:TER083) et [Supply Chain](glossary:TER084). Orthographe canonique proposée :
    Fulfillment ; Fulfilment est une variante orthographique.'
