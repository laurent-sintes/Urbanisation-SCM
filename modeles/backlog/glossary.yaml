    - ELM333
    - CMP192
  market_inspiration:
    choice: Rapprocher les capacités selon un critère métier rend la carte plus facile à lire. Regroupement de capacités désigne
      cette organisation de lecture, sans présumer une capacité parente.
    flow_scope: Ensemble de capacités réunies pour une raison explicite.
    flow_approach: Indiquer le critère commun et distinguer regroupement et décomposition.
    synthesis:
    - TOGAF distingue la classification des capacités pour lire une carte et leur décomposition pour détailler une aptitude.
      GEA-NZ recommande également de les classer afin de repérer lacunes et recouvrements. Les deux donnent un but à l’organisation
      de la carte.
    - 'FLOW conserve cette distinction : partager un thème ne signifie pas être les parties d’une même capacité. Une purpose
      peut apporter ce cadre de lecture quand ses problèmes métier sont cohérents ; le regroupement ne crée pas un niveau
      « fonction ».'
