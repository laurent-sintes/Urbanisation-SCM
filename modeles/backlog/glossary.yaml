    - CMP193
    concept_name: In-season replenishment
    scope_summary: Réassort intégré au cycle saisonnier.
    approach_summary: Combiner prévisions, apports et contraintes du magasin.
  market_inspiration:
    choice: Alimenter les stocks magasin au fil des ventes selon les seuils retenus. Réassort conserve ce sens exprimé pour
      FLOW, distinct de la mise en place initiale et de la seule sortie de réserve vers le rayon.
    flow_scope: Apports continus aux stocks magasin.
    flow_approach: Calculer le besoin selon les règles métier applicables.
    synthesis:
    - SAP In-Season Fill-In vise les apports après les premières ventes. RELEX In-season replenishment les inscrit dans un
      cycle comprenant aussi présaison et fin de saison. Les deux sont proches du réassort, avec des méthodes et périmètres
      produits plus larges.
    - FLOW conserve les seuils de sa définition locale sans déduire une formule min/max universelle ou la prévision d’un éditeur.
      Décider les apports, tenir les commandes et livrer restent des responsabilités distinctes.
    examples:
