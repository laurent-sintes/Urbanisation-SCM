method:
- Inventaire transversal des champs descriptifs, portée des principes et parcours de lecture ; comparaison des concepts et
  responsabilité au type réel des objets, sans interpréter leurs préfixes historiques.
- Lecture approfondie ciblée des frontières, commandes, plans/règles, variantes, référentiels, registres et processus ; les
  recherches lexicales sont des indices, pas des anomalies.
- Réutilisation des lectures et contrôles valables de la session et des sources consultées pour U1154/U1156/U1157 ; aucun
  nouvel audit des comportements ni réévaluation de réalisation installée.
- Propositions sans création de capacité, déplacement ou nouvelle relation métier. Le futur contrat de lien reste une proposition
  technique.
conclusion: Les choix structurants restent cohérents. L’enrichissement prioritaire porte sur les raisons de conception à l’endroit
  où elles expliquent la fiche ; quelques alignements éditoriaux sont nécessaires. Aucun nouveau découpage métier n’est justifié
  par cet audit.
findings:
- id: F01
  priority: P1
  nature: missing_reading_contract
  title: Aucun lien de principe dans les descriptions et contrat inline absent
  evidence:
  - app/src/inlineLinks.ts:inlineParts
  - scripts/glossary.py:LINK
  - app/src/components/ModelLinks.tsx:Kind
  - 0 lien principle:, design-principles ou PRINCIPLE-* dans les champs descriptifs inventoriés
  impact: 'Le lecteur voit une liste de principes mais ne sait pas quel passage de la fiche ils justifient. Insérer aujourd’hui
    un lien principle: ne le rendrait pas navigable ni contrôlé.'
  recommendation: 'Ajouter un lien typé principle: vers un id canonique, puis 1 à 3 renvois motivés dans les descriptions
    longues. Valider cibles et publication ; conserver retour et clavier.'
- id: F02
  priority: P1
  nature: insufficient_pedagogy
  title: Le contexte complet des commandes reste implicite dans la pédagogie du domaine SCM
  evidence:
  - supply-chain-orchestration.fields.pedagogical_description.explanation
  - PRINCIPLE-ORDER-DECISION-CONTEXT.statement
  - 'domain-sourcing-procurement.fields.scope: « conserve le document » ; TER109.context'
  impact: Le domaine est surtout expliqué par ressources, flux et optimisation. Le lecteur peut manquer le choix central U1157
    ou réduire Purchase Order à un document.
  recommendation: Ajouter une explication courte du cycle complet dans la pédagogie SCM et harmoniser le passage documentaire
    de Procurement avec sa propre précision ultérieure. Relier DP14 et DP06. Conserver les définitions courtes.
- id: F03
  priority: P1
  nature: reading_coverage_gap
  title: Le principe des variantes est absent du périmètre de définition des variantes
  evidence:
  - 'subdomain-product-definition-variants: deux principes généraux seulement'
  - 'domain-product-definition-lifecycle: deux principes généraux seulement'
  - 'PRINCIPLE-PRODUCT-VARIANTS.scope.targets: D08, D04.i, D04.j, D01'
  impact: Le principe est accessible depuis les consommateurs Supply, sans le lien qui explique l’identité produit au niveau
    où elle est définie.
  recommendation: Relier les descriptions longues des deux périmètres produit et TER058 au principe ; rappeler que taille/couleur
    sont des exemples, sans imposer une grille ni un maître unique.
- id: F04
  priority: P1
  nature: editorial_alignment_gap
  title: Operational References conserve un ancien responsable nommé Plan Visibility
  evidence:
  - 'business-references.fields.mastership: « les prévisions de demande et de mouvements relèvent de Plan Visibility »'
  - 'business-references.fields.scope et TER123.context: Master Plan Management'
  - plans-visibility et demand-plan-visibility ont pour parent ba-master-plan-management ; aucun nœud courant nommé Plan Visibility
  impact: La même fiche désigne différemment le responsable des plans ; le lien entre autorité, réception et interprétation
    est moins clair.
  recommendation: Aligner mastership sur les responsabilités actuelles, distinguer contributions reçues et interprétation
    des plans, contrôler le glossaire déjà aligné, puis relier le principe d’autorité.
- id: F05
  priority: P1
  nature: reading_vs_normative_scope
  title: Les cibles normatives et les liens de lecture remplissent deux rôles
  evidence:
  - scripts/architecture_principles.py:applicable_principles
  - scripts/decision_carry.py:classify_context
  - app/src/designPrinciples.ts:principlesForNode
  - principles.scope.targets
  impact: Élargir scope.targets pour afficher un lien modifie aussi le périmètre normatif de réexamen. Ajouter un renvoi pédagogique
    ne doit pas devenir un nouvel arbitrage de portée.
  recommendation: Porter les renvois dans les textes et en dériver un index de lecture. Conserver scope comme déclaration
    d’applicabilité. Les liens ne donnent pas d’accord sur la fiche et ne créent aucun parent.
- id: F06
  priority: P2
  nature: reader_prioritization
  title: L’héritage donne une couverture complète mais inégalement ciblée
  evidence:
  - 348 fiches ont 2 à 11 principes ; 317 n’ont aucune cible directe
  - 12 fiches affichent 11 principes ; D04.i et D04.j en font partie
  - Business Operations transmet les principes des trois domaines et du contexte complet à 282 fiches
  impact: Le même espace mélange raisons propres à une fiche, choix du domaine et repères généraux. La couverture héritée
    ne garantit pas la pertinence locale.
  recommendation: Afficher d’abord les principes cités dans le texte et directement liés ; ranger les principes de contexte
    et généraux dans un bloc repliable. Dédupliquer par id et conserver la liste complète accessible.
- id: F07
  priority: P2
  nature: legacy_convention_drift
  title: Deux énoncés historiques consultables demandent un alignement
  evidence:
  - PRINCIPLE-DISPLAY-CODES.statement liste UNI/SYS/DOM/SUB/REF/CAP/BHV sans BA
  - 'modeling-glossary.yaml:identification_rules.prefixes contient business_area: BA'
  - PRINCIPLE-BUSINESS-SYSTEM.statement conserve une phrase datée U975 avec Planning & Optimization
  impact: La liste des préfixes est incomplète ; l’énoncé Business System mélange la règle actuelle et un ancien libellé sans
    explication de lecture.
  recommendation: Compléter BA et reformuler la convention courante selon Master Plan et les profondeurs déclarées. Conserver
    les identités et les formulations dans les publications historiques.
- id: F08
  priority: P2
  nature: ambiguous_example
  title: Une leçon sur les références peut être lue comme une copie passive
  evidence:
  - supply-chain-orchestration.fields.examples[title=Recevoir une nouvelle référence produit].lesson
  - PRINCIPLE-REFERENCE-PROJECTIONS.implications et tradeoffs
  impact: « La création et les corrections de la référence restent dans la source de vérité externe » ne distingue pas les
    attributs maîtres de la gestion locale active décrite ailleurs.
  recommendation: Préciser qu’il s’agit des attributs maîtres externes dans cet exemple, puis rappeler provenance, validité
    et cohérence de la référence locale. Qualifier cela comme clarification, pas comme transfert de maîtrise.
coherence_confirmed:
- topic: Business Operations
  evidence:
  - system-business-operations
  - domain-sales
  - domain-sourcing-procurement
  - supply-chain-orchestration
  conclusion: Trois domaines du même système ; prix, canaux, sources et accords conservent leurs autorités. Les commandes
    gardent leur cycle SCM ; le principe explicite ce contexte.
- topic: Logistics
  evidence:
  - domain-logistics-execution
  - PRINCIPLE-FLOW-LOGISTICS
  conclusion: Le type business_system et les trois domaines Warehousing, Transportation et Customs Management concordent.
    Le prestataire ne détermine pas l’identité métier.
- topic: Contextes
  evidence:
  - domain-product-portfolio-collection
  - subdomain-collection-planning
  - domain-plan
  - subdomain-policies
  - TER386
  - TER387
  - TER388
  - TER389
  conclusion: Saisons/capsules ne créent pas de capacité ; les produits reconduits et plans multiples restent possibles. Saison
    commerciale et saisonnalité sont distinctes.
- topic: Intercompany
  evidence:
  - BHV069
  - TER122
  - PRINCIPLE-CONFIGURABLE-CONTEXTS
  conclusion: Intercompany Sales est un comportement process_variant explicite de Sales Order ; il n’est pas une capacité
    globale. Cela est compatible avec un contexte qui influence des comportements sans les imposer partout.
- topic: Variantes
  evidence:
  - subdomain-product-definition-variants
  - D08
  - TER058
  conclusion: Les définitions ne rendent pas la grille obligatoire. Taille et couleur sont des exemples ; les caractéristiques
    et sources responsables peuvent varier par objet.
- topic: Faits et décisions
  evidence:
  - process-ledger
  - process-mining
  - D01.g
  - inventory-ownership-ledger
  - D02.c
  - D02.e
  - D03.o
  conclusion: Les registres de stock et de processus sont distingués ; analyse des traces, calcul, application, engagement
    et réservation conservent des effets différents.
false_positives_rejected:
- term: Operational References
  reason: Nom canonique courant du modèle et de TER123 ; ne pas le remplacer par Authoritative Data sur la foi d’un ancien
    texte documentaire.
- term: grille wholesale
  reason: L’exemple de Sales Pricing Rule Management désigne des tarifs, pas une matrice d’identité Product Variant.
- term: fabrication dans CTP
  reason: La faisabilité d’un apport chez un fournisseur n’établit pas une fabrication réalisée par Beaumanoir.
- term: 317 fiches sans cible directe
  reason: Elles ont des principes hérités ; ce nombre ne prouve pas un manque de contenu ou la nécessité d’ajouter un lien
    à chacune.
- term: Master Data / Order Backlog / références marché
  reason: Ces mots peuvent désigner des responsabilités ou termes natifs valides. Seuls les écarts démontrés au contexte courant
    sont retenus.
recommended_contract:
  authority: Le référentiel des principes reste model.yaml.principles. Les descriptions référencent ces identités sans reproduire
    leurs articles.
  inline_example: '[Pourquoi distinguer variante et grille](principle:PRINCIPLE-PRODUCT-VARIANTS)'
  placement: Explication pédagogique, périmètre, frontières, exemple ou contexte de glossaire. Préserver les définitions courtes
    et tooltips simples.
  volume: Un à trois liens motivés par fiche concernée, selon le contenu ; aucune obligation de quota ni reprise des 14 principes
    partout.
  inverse_index: Calculer les liens de lecture inverses depuis les textes ; les combiner aux cibles explicites sans modifier
    la portée normative pour des besoins d’affichage.
  qualification: Un renvoi explique un choix ; il ne valide ni la description voisine, ni une réalisation installée. Les valeurs
    approuvées et leurs empreintes conservent leur contrat.
  publication: Résolution dans le snapshot sélectionné ; cible absente signalée, jamais complétée depuis le backlog. Liens
    directs et retour au texte d’origine conservent la version.
  technical_surfaces:
  - app/src/inlineLinks.ts
  - app/src/components/ModelLinks.tsx
  - app/src/designPrinciples.ts
  - scripts/glossary.py
  - scripts/decision_carry.py
  - scripts/record_decision.py
  review_note: Définir explicitement les champs et dépendances de lecture. Ne pas ignorer un changement de sens ou un champ
    inconnu pour éviter un réexamen ; ne pas transformer un renvoi en nouvelle règle globale.
  relation_annotation: 'Pour les neuf partages sélectionnés, annoter fields.data_exchange.purpose : les labels et aides courtes
    restent simples. Le renvoi ne constitue pas une nouvelle condition d’exécution ni une nouvelle relation métier.'
  normative_scope_reexamination: Le rattachement normatif de Product Variants au périmètre de définition mérite un arbitrage
    explicite si cette portée est élargie. Un lien de lecture depuis ce périmètre peut expliquer le choix existant sans modifier
    scope.targets ; ces deux opérations restent distinctes.
