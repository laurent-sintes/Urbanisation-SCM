implementation_order:
- step: 1
  title: Alignements de cohérence
  findings:
  - F02
  - F04
  - F07
  - F08
  work: Clarifier les responsabilités dans les descriptions et leurs miroirs de glossaire ; conserver identités, frontières
    et accords historiques.
- step: 2
  title: Lien de lecture typé
  findings:
  - F01
  - F05
  work: 'Parser, valider et afficher principle: ; version, accessibilité, retour et index inverse ; tester la séparation avec
    le périmètre normatif.'
- step: 3
  title: Liens prioritaires dans les fiches
  work: 'Traiter les P1 des recommandations : SCM/Business Operations/Commerce/Procurement, Logistics, variantes, référentiels,
    plans/règles, commandes et faits.'
- step: 4
  title: Compléments et lecture ciblée
  findings:
  - F06
  work: Compléter les P2, les contextes de glossaire et les neuf relations sélectionnées ; distinguer liens directs et hérités
    dans Atlas.
acceptance_checks:
- Chaque lien vise un principe de la même publication, se retrouve depuis la fiche et depuis le principe, avec retour au texte
  d’origine.
- Aucune définition courte surchargée, tooltip long ou action Comprendre redondante ajoutés.
- Aucun élargissement normatif par simple besoin d’affichage ; aucun nouveau parent ou producteur déduit.
- Les anciens snapshots restent lisibles ; nouveaux liens inconnus ou absents échouent explicitement au contrôle.
- Les distinctions contexte/plan/règle/commande, variante/grille, registre/analyse et calcul/engagement/réalisation sont préservées.
- Modèle et glossaire contrôlés ensemble ; aucune adoption de texte déduite de sa publication ou d’un lien.
verification:
  state: passed
  scope: Audit documentaire et contrôles des identités ; validation courante du backlog réutilisée puis contrôlée sur le lot
    final sans build applicatif.
  checks:
  - '49 recommandations distinctes : 32 fiches, 8 contextes de glossaire et 9 finalités de relations existantes.'
  - Les 14 principes sont couverts par des recommandations ; toutes les identités et cibles proposées sont résolues.
  - Empreintes du modèle, du glossaire et des deux fichiers de lecture vérifiées identiques à la base de l’audit.
  - Plan Visibility absent comme nœud courant ; deux Visibility rattachées à Master Plan Management.
  - Operational References est confirmé comme nom courant ; occurrences historiques ou termes natifs écartés des anomalies.
  - Exemples et réserves de maîtrise conservés ; aucune nouvelle définition, portée normative ou relation métier appliquée.
