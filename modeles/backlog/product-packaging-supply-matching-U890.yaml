schema_version: 1.0.0
id: product-packaging-supply-matching-U890
source_refs:
- U890
- U891
recorded_on: '2026-10-07'
status: applied_verified
scope: Lot U890 validé U891 appliqué au modèle, aux glossaires et aux scénarios ; publications historiques conservées.
observations:
- id: O01
  targets:
  - D08
  - TER052
  - TER057
  - TER061
  - service-order-packing
  finding: Product Reference reçoit les Product et variantes avec rôles Article ou Container. Packing Order tient les exigences
    et résultats individuels. Le catalogue ne matérialise pas de référentiel de spécifications de conditionnement distinct.
  meaning: Couverture partielle du packaging ; le rôle Container ne remplace pas une spécification réutilisable.
- id: O02
  targets:
  - D01.f
  - D01.g
  - D01.c
  finding: Tracking, Ledger et Visibility traitent faits, positions et filiations, sans description explicite des structures
    de conditionnement attendues, annoncées et réellement reçues.
  meaning: Ces capacités peuvent être précisées et éprouvées avant de créer automatiquement une nouvelle capacité.
- id: O03
  targets:
  - D03
  - ba-supply-matching
  finding: 'Supply Matching est une Business Area d’Availability : quatre capacités et sept comportements. Availability comporte
    cinq Business Areas, quinze capacités et vingt-sept comportements.'
  meaning: Le nombre d’objets de la seule Business Area ne mesure ni la couverture totale d’Availability ni la complexité
    du calcul.
proposals:
- id: P01
  topic: Séparer les périmètres de lecture des références
  candidate_scopes:
  - name: Merchandise References
    meaning: Biens destinés à la vente, leurs variantes et leurs liens aux offres, assortiments et tarifs.
  - name: Packaging References
    meaning: Contenants, supports et autres matières de conditionnement ; spécifications réutilisables décrivant composition,
      quantités, niveaux, unités et contraintes utiles aux échanges logistiques.
  - name: Internal Supplies & Equipment References
    meaning: Fournitures et équipements utilisés par les magasins, la force de vente et le backoffice ; le traitement des
      actifs et leur comptabilité gardent leurs responsabilités propres.
  boundary: 'Les usages peuvent se combiner : un même bien peut être vendu, utilisé en interne ou servir d’emballage. Conserver
    l’identité commune sans recopier trois maîtres ni présumer trois composants logiciels. La finalité d’usage ne décide pas
    à elle seule si le bien est stocké ou immobilisé.'
  tradeoff: Lecture plus claire, au prix de liens explicites entre les vues et l’identité commune. Le sort de D08 et le placement
    exact des nouvelles références restent à construire avant application.
  application_U891: Appliqué et contrôlé ; les formulations initiales restent conservées comme proposition source. Résultat
    final et limites dans application_U891.
- id: P02
  topic: Distinguer modèle, demande et réalité du conditionnement
  candidate_reference_names:
  - Packaging Material Reference
  - Packaging Specification
  boundary: Le référentiel décrit les modèles et consignes réutilisables. Packing Order porte le résultat demandé pour une
    prestation. Les structures annoncées et réellement reçues sont des informations d’opération et d’inventaire avec identifiants,
    contenu, provenance et écarts ; elles ne deviennent pas des références maîtres.
  example: Consigne fictive de douze pièces par carton ; ordre de préparer cent vingt pièces ; annonce de dix cartons ; réception
    de neuf cartons complets et un carton de dix pièces. Conserver les cent dix-huit pièces reconnues et l’écart de deux,
    sans remplacer le modèle de douze par la réception de dix.
  benefit: Exprimer précisément le besoin adressé à la logistique et interpréter ce qu’elle annonce ou retourne, en gardant
    sa responsabilité sur le geste et la préparation détaillée.
  application_U891: Appliqué et contrôlé ; les formulations initiales restent conservées comme proposition source. Résultat
    final et limites dans application_U891.
- id: P03
  topic: Expliquer les responsabilités de réassort et la place possible d’IRMA
  existing_evidence_refs:
  - U06
  - APP-IRM
  - INF04
  - DEC02
  - DEC03
  - C11
  interpretation: IRMA contribue principalement à Inventory Target Optimization (D05.a) pour les cibles et seuils déclarés.
    Supply Protection Policy (D02.b) tient les paramètres actifs ; Replenishment (D05.e) détermine les apports et ajustements,
    à partir des besoins, cibles et ressources présentes ou attendues.
  architecture_option: Une responsabilité métier de FLOW peut être réalisée par un moteur spécialisé tel qu’IRMA. Maintenir,
    intégrer ou remplacer ce moteur relève d’une décision d’architecture et de produit distincte.
  limits: Aucune interface cible installée ni migration décidée. Le déclenchement Storeland est documenté séparément ; quantité,
    couverture du déploiement et actualité restent à éprouver. L’horizon ou la plateforme ne suffisent pas à classer un calcul
    comme amont ou opérationnel.
  application_U891: Appliqué et contrôlé ; les formulations initiales restent conservées comme proposition source. Résultat
    final et limites dans application_U891.
- id: P04
  topic: Rendre visible la profondeur d’Availability sans gonfler le catalogue
  existing_siblings:
  - Plan Visibility
  - Policy Optimization
  - Order Promising
  - Supply Matching
  - Master Plan Management
  interpretation: Les décisions intègrent leurs calculs et arbitrages. Le matching mobilise priorités, besoins, protections,
    quantités présentes et attendues, contraintes et engagements ; Master Planning compose et révise les scénarios et Plan
    Application matérialise les choix autorisés.
  recommended_changes:
  - Enrichir la synthèse de Supply Matching par les entrées, arbitrages, résultats et coopérations.
  - Montrer où se trouvent promesse, optimisation de cibles, protections et conduite du plan.
  - Éprouver les cas difficiles dans les capacités et scénarios existants avant de proposer de nouveaux savoir-faire.
  cases_to_examine:
  - Pénurie entre plusieurs demandes et prévisions résiduelles, sans double compte.
  - Seuils reçus périmés ou objectifs locaux incompatibles.
  - Conditionnements et tailles de lot empêchant un réassort exact.
  - Arrivées retardées et engagements protégés.
  - Réduction, report ou annulation d’apports déjà fermes.
  - Aucune solution admissible pour satisfaire toutes les demandes.
  limits: L’audit clos U431 n’est pas réouvert. Un objectif, mécanisme ou résultat métier distinct doit justifier toute nouvelle
    capacité ou décomposition.
  application_U891: Appliqué et contrôlé ; les formulations initiales restent conservées comme proposition source. Résultat
    final et limites dans application_U891.
market_comparison:
- topic: Conditionnement
  sources:
  - S01
  - S02
  - S03
  common_ground: SAP distingue matières d’emballage, consignes ou spécifications et unités logistiques concrètes ; Dynamics
    distingue types de contenants, profils ou politiques de packing et containers physiques.
  flow_choice: Séparer références, consignes individuelles et faits reçus, sans reprendre la configuration WMS ni son moteur
    de cartonisation comme taxonomie métier.
  limits: Recouvrement partiel ; aucune équivalence unique entre les objets éditeurs et les capacités FLOW.
- topic: Fournitures internes
  sources:
  - S04
  - S05
  common_ground: SAP et Microsoft documentent les achats pour consommation directe, avec référence possible ou désignation
    adaptée à l’achat.
  flow_choice: Rendre visible la destination interne, tout en gardant indépendants l’identité du bien, sa gestion physique
    en stock et son éventuelle immobilisation.
  limits: Ces sources n’établissent ni un référentiel unique d’équipements internes ni un fonctionnement installé chez Beaumanoir.
- topic: Réassort et matching
  sources:
  - S06
  - S07
  - S08
  common_ground: SAP retail et Dynamics documentent besoins, seuils, cibles, stocks et apports ; Dynamics explicite également
    les arbitrages de priorité.
  flow_choice: Conserver les frontières entre choix des cibles, paramètres actifs, décision d’apports, affectation, mise en
    œuvre et planification amont.
  limits: Les périmètres MRP/retail des éditeurs sont plus larges ou différents ; ces pages ne fixent pas la frontière de
    FLOW et ne prouvent rien sur IRMA.
