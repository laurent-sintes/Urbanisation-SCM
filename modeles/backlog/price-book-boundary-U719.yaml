proposal:
  reference: Price Book — tarifs de produits et de services
  capability: Price Book Visibility
  parent: business-references
  nature: knowledge
  ingestion: Master Data Ingestion reçoit les tarifs de produits et services depuis les domaines compétents ; leur attribution
    à Commerce, Finance ou Design reste à qualifier, notamment pour les prestations logistiques.
  distinctions:
    Product Catalog: Offre de produits présentée.
    Assortment: Sélection de produits pour un périmètre et une période.
    Price Book: Tarifs de référence des produits et services, avec unités, devises, validité et conditions ; plusieurs livres
      possibles.
    Agreement: Conditions convenues entre parties.
    order_price: Prix appliqué et engagement conservé avec la commande.
  boundary: La Supply utilise les prix et obtient les évaluations tarifaires nécessaires à ses choix ; elle ne devient pas
    propriétaire de la politique commerciale. Le calcul peut être réalisé par un service externe.
  substitution: Évaluer le prix client résultant, le coût et les effets économiques selon les règles reçues avant d’accepter
    une alternative ; ne pas déduire automatiquement le nouveau prix du Price Book. Order Management porte toute révision
    autorisée.
  example: 'Article commandé 50, substitut au tarif 60 : une règle peut conserver 50 au client ; évaluer séparément coût et
    marge. Exemple fictif, aucune règle adoptée.'
  benefit: Tarif réutilisable indépendamment du catalogue et évaluation économique des alternatives.
  tradeoff: Maintenir la frontière entre tarif reçu, prix calculé et prix engagé ; éviter un moteur de pricing concurrent.
  open_details:
  - Répartition précise des données tarifaires Product Catalog / Price Book
  - Contrat de consultation ou calcul tarifaire externe
  - Règles de prix lors des substitutions et autorité de leur définition
  transport:
    distinctions:
    - Coût de réalisation du transport
    - Tarif de la prestation logistique
    - Frais facturés au client
    - Prix rendu commercial de l’article selon conditions convenues
    rule: Évaluer les alternatives avec leur trajet, services, délais, coûts et éventuels effets tarifaires. Ne pas propager
      automatiquement un surcoût au prix client engagé.
    references: Un concept Price Book commun aux produits et services ; plusieurs livres selon contexte, prestataire ou autorité.
      Product Catalog et Service Catalog décrivent leurs offres et référencent les tarifs. Aucun tarif unique ni fusion des
      offres imposés.
    boundary: Supply obtient ou calcule l’évaluation économique des options selon sa responsabilité ; le pricing commercial
      reste sous l’autorité du domaine compétent. Order Management prend en compte les modifications autorisées.
  naming:
    status: adopted_U723
    source_refs:
    - U722
    - CMP282
    convention: Catalog pour une collection structurée de produits ou services proposés ; pas un suffixe générique de référentiel.
    retain:
    - Product Catalog
    - Service Catalog
    - Assortment
    candidate: Price Book
    avoid: 'Price Book Catalog pour désigner un ensemble de tarifs : pourrait signifier un catalogue de livres tarifaires.'
    market_limit: Usage fréquent, pas règle universelle ni frontières identiques chez tous les éditeurs.
