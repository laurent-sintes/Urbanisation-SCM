  - id: business-references
    fields:
      name: Operational References
      definition: Fournir les référentiels opérationnels de l’orchestration, alimentés depuis les domaines sources, en portant
        leur référence locale fiable sans transférer la maîtrise d’entreprise.
      scope: |-
        Trois [Business Areas](method:MOD039) portent les références locales : [Partner & Agreement References](model:ba-partner-agreement-references), [Product References](model:ba-product-references), [Service References](model:ba-service-references). Les neuf références restent distinctes et documentaires. Ce sous-domaine porte la composition, l’actualisation et la fourniture de leurs vues utilisables, avec versions, fraîcheur, provenance, validité et incohérences connues. Leur consultation ne justifie pas des capacités autonomes.

        [Master Data Ingestion](model:master-data-ingestion), dans [Integration](model:subdomain-integration), reçoit les apports sourcés et rend compte de leur prise en compte. Une donnée rejetée ou en attente ne devient pas applicable. Operational References conserve la responsabilité de la référence locale utilisable ; aucune maîtrise d’entreprise n’est transférée et aucune capacité générique de remplacement n’est créée.

        Les décisions consommatrices interprètent ces références dans le contexte des demandes : choisir une offre, un service ou une promesse, appliquer les conditions d’un accord. Les règles actives relèvent de [Policies](model:subdomain-policies), les prévisions interprétées de [Plan Visibility](model:subdomain-plans).
  - id: plans-visibility
    fields:
      name: Supply Plan Visibility
      definition: Interpréter les prévisions d’entrées et de sorties de stock hors achats dans le contexte d’une demande de
        la supply chain, pour établir les mouvements prévus pertinents et leurs limites d’utilisation.
      scope: |-
        Qualifier les produits, lieux, périodes, unités, version, provenance et incertitudes au regard de la demande examinée. Distinguer les données applicables, hors périmètre et insuffisamment précises. Une prévision agrégée ne devient pas une quantité détaillée sans règle explicite ; une donnée absente reste inconnue. Cette [Visibility](method:MOD040) produit une connaissance contextualisée, au-delà de l’affichage du plan reçu.

        Le [Supply Plan](glossary:TER098) garde le sens FLOW de mouvements prévus hors achats. [Plan Ingestion](model:plans-ingestion) reçoit les versions et corrections ; [Demand & Supply Planning](model:domain-plan) produit les prévisions. [Availability](model:D03) conserve le calcul de couverture, la consommation de prévision par les [Orders](glossary:TER012) pour éviter le double comptage, les décisions de promesse et le [Matching Master Plan](glossary:TER100). L’interprétation du plan ne crée aucun engagement ni mouvement réalisé.

        Exemple fictif : Pour une demande de 40 robes livrables vendredi, un plan annonce une entrée de 100 robes la semaine suivante sur un autre site. L’entrée prévue est identifiée mais ne constitue pas une ressource disponible pour vendredi ; les dates et le lieu restent attachés à la prévision.
  - id: demand-plan-visibility
    fields:
      name: Demand Plan Visibility
      definition: Interpréter la demande prévisionnelle reçue dans le contexte d’une demande de la supply chain, pour établir
        les besoins prévus pertinents et leurs limites d’utilisation.
      scope: |-
        Qualifier les produits, lieux, périodes, unités, version, provenance et incertitudes au regard de la demande examinée. Distinguer les données applicables, hors périmètre et insuffisamment précises. Une prévision agrégée ne devient pas une quantité détaillée sans règle explicite ; une donnée absente reste inconnue. Cette [Visibility](method:MOD040) produit une connaissance contextualisée, au-delà de l’affichage du plan reçu.

        Le [Demand Plan](glossary:TER099) décrit des besoins prévisionnels, distincts des commandes effectivement reçues. [Plan Ingestion](model:plans-ingestion) reçoit les versions et corrections ; [Demand & Supply Planning](model:domain-plan) produit les prévisions. [Availability](model:D03) conserve le calcul de couverture, la consommation de prévision par les [Orders](glossary:TER012) pour éviter le double comptage, les décisions de promesse et le [Matching Master Plan](glossary:TER100). L’interprétation du plan ne crée aucun engagement ni mouvement réalisé.

        Exemple fictif : Pour une demande de 30 robes en taille M d’une boutique, le plan annonce 200 robes toutes tailles pour la région sur la semaine. Le périmètre et la granularité sont explicités ; aucune part de ces 200 robes n’est attribuée à la boutique ou à la taille M sans règle documentée.

        Les précommandes connues restent qualifiées par leur horizon et leur degré d’engagement. Leur seule présence ne justifie ni une seconde commande ni leur addition automatique à la prévision déjà représentative de ces besoins.
