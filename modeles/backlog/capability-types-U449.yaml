  - id: orchestration
    name: Orchestration
    label_fr: Orchestration
    definition: Coordonner les prestations, leurs dépendances et leur progression dans un processus.
    boundary: Distinguer coordination, choix d’adaptation et réalisation des prestations.
  - id: planning
    name: Planning
    label_fr: Planification
    definition: Construire, comparer et maintenir des scénarios en mobilisant les décisions spécialisées.
    boundary: Les décisions gardent leur résultat propre ; planifier ne signifie pas appliquer toutes les opérations du scénario.
  - id: decision
    name: Decision
    label_fr: Décision
    definition: Déterminer une réponse métier à partir des faits, règles, objectifs et contraintes applicables, en incluant
      les calculs nécessaires.
    boundary: Aucune assimilation à un nom contenant Decision ni à un traitement automatisé ; application transactionnelle
      distincte.
  management_term:
    id: MOD003
    name: Management
    label_fr: Gestion / gouvernance
    definition: Gérer les règles et leur validité, et tenir transactionnellement les données qui les matérialisent.
    role: Qualifier une responsabilité de gestion, à préciser selon l’objet concerné.
    notes:
    - U230 qualifie Stock Protection de gouvernance/management ; U231 précise sa mise à jour transactionnelle.
    - Cette formulation générale est proposée à partir du cas Stock Protection ; elle n’impose pas la même définition à toute
      capacité nommée Management.
    - Le sens d’application transactionnelle est défini par MOD004.
    - 'U538 : la responsabilité de configuration illustrée par Stock Protection reste extérieure au Planning qui la consomme,
      y compris lorsque ce Planning comporte un comportement d’application du plan. Nom canonique de la capacité actuelle
      : Supply Protection, D02.b.'
    source_refs:
