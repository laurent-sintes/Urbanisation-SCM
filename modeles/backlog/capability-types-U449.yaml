field: fields.nature
scope: Une nature principale explicite par capacité, selon le résultat métier dominant. Aucun nouveau niveau ni reclassement
  des couches.
review:
  state: partial
  adopted_scope: 'Typage exhaustif, icônes par type, décisions à la fin et séparation visuelle U449. U586 : ajout du type
    Policy.'
  proposed_scope: 'Définitions de la grille et dix qualifications complétées par Codex ; les 37 natures antérieures gardent
    leur statut propre. U586 : définition Policy et clarification de sa frontière avec Management.'
types:
- id: action
  name: Action
  label_fr: Action
  definition: Effectuer une opération métier ou matérialiser une évolution autorisée des données et engagements.
  boundary: Mobiliser les décisions nécessaires sans s’approprier leur choix ; aucune réalisation physique systématique.
- id: management
  name: Management
  label_fr: Gestion
  definition: Tenir des états, des engagements ou des obligations dans la durée et gérer leurs évolutions.
  boundary: 'Recoupe des actions ; la nature dominante est la tenue cohérente dans le temps. Ne pas l’inférer du mot Management
    dans un nom. U586 : lorsque le résultat dominant est le cadre de règles applicable, le type Policy est disponible ; aucune
    qualification existante ne change automatiquement.'
- id: policy
  name: Policy
  label_fr: Politique
  definition: Définir, maintenir et rendre applicables les règles, politiques et configurations métier dont le Domain porte
    la maîtrise, avec leur portée, leur validité et leurs conditions d’usage.
  boundary: La capacité porte le cadre applicable ; une règle ou un seuil est son contenu. Une Decision détermine une réponse
    ou une recommandation, Planning compose le plan, et leurs propositions de changement passent par la responsabilité Policy.
    Ne pas confondre ce type avec la forme de comportement policy_strategy.
  source_refs:
  - U585
  - U586
  - CMP248
  - U587
  review:
    state: partial
    adopted_scope: Existence du type Policy, instruction explicite U586 ; clé technique policy.
    proposed_scope: Définition, frontières et exemples détaillés rédigés par Codex.
  examples:
  - 'Stock : maintenir les protections par canal et les conditions de leur révision.'
  - 'Demandes : maintenir les critères de priorité, protections contre les révisions et dérogations autorisées.'
  - 'Backing Service Policy : maintenir les exclusions de fournisseurs et limites de sollicitation face aux difficultés ;
    l’offre, les faits observés et les engagements restent distincts (U587).'
  market_refs:
  - ELM410
  - ELM603
  market_position: Microsoft illustre les protections de groupes et Fluent les configurations utilisées par l’orchestration.
    Appuis fonctionnels ; le type de capacité Policy est un choix FLOW demandé par Laurent, sans taxonomie universelle revendiquée.
- id: knowledge
  name: Knowledge
  label_fr: Connaissance / visibilité
  definition: Établir, actualiser et rendre accessible une connaissance fiable des états, faits et résultats attendus.
  boundary: La connaissance peut être calculée ; choisir une réponse métier relève d’une décision distincte.
- id: orchestration
  name: Orchestration
  label_fr: Orchestration
  definition: Coordonner les prestations, leurs dépendances et leur progression dans un processus.
  boundary: Distinguer coordination, choix d’adaptation et réalisation des prestations.
- id: planning
  name: Planning
  label_fr: Planification
  definition: Construire et réviser un plan en mobilisant les décisions nécessaires.
  boundary: Les décisions gardent leur résultat propre ; planifier ne signifie pas appliquer toutes les opérations du scénario.
- id: decision
  name: Decision
  label_fr: Décision
  definition: Déterminer une réponse métier à partir des faits, règles, objectifs et contraintes applicables, en incluant
    les calculs nécessaires.
  boundary: Aucune assimilation à un nom contenant Decision ni à un traitement automatisé ; mise en effet de la réponse distincte.
- id: integration
  name: Integration
  label_fr: Intégration
  definition: Acquérir ou transmettre des informations métier entre domaines ou exécutants, les reconnaître et les rapprocher
    du contexte local pour les rendre utilisables avec leur provenance et leur résultat de prise en compte.
  boundary: Le résultat dominant est la prise en compte fiable de l’échange métier. Protocoles, connecteurs et middleware
    restent des moyens. Décider, coordonner le processus ou tenir l’état métier consolidé ne devient pas Integration du seul
    fait de recevoir des événements.
  source_refs:
  - ELM710
  - ELM711
  - ELM712
  review:
    state: accepted
    note: Type et frontière adoptés cumulativement U717.
- id: ledger
  name: Ledger
  label_fr: Registre
  definition: Tenir un registre métier durable de faits reconnus, datés et justifiés, en assurant leur traçabilité et leurs
    corrections.
  boundary: Integration reçoit les faits, Decision détermine la réponse métier, Ledger tient le registre reconnu et Knowledge
    compose la connaissance. Aucun journal technique, comptabilité générale ou technologie imposés.
  source_refs:
  - U752
  - U756
  - CMP296
  - CMP297
  market_refs:
  - ELM736
  - ELM737
  - ELM739
  - ELM764
  review:
    state: partial
    adopted_scope: Existence et définition du type Ledger ; registres Inventory et Inventory Ownership U756.
    proposed_scope: Compléments rédactionnels.
- id: evaluation
  name: Evaluation
  label_fr: Évaluation
  definition: Type de capacité qui évalue des possibilités, leur faisabilité ou leurs conséquences à partir de faits, règles
    et hypothèses, en explicitant résultats, conditions et incertitudes, sans sélectionner une réponse ni engager sa réalisation.
  boundary: Évaluer sans choisir, confirmer, réserver ni affecter. Decision conserve ses calculs internes ; aucune décomposition
    systématique par formule.
presentation:
  order: Partition stable des capacités de chaque domaine ou référentiel ; non-décisions puis décisions, ordre relatif conservé
    dans chaque partie.
  separator: Une ligne horizontale légère seulement quand les deux parties sont présentes ; aucun séparateur devant un groupe
    vide.
  legacy: Un type absent dans une ancienne publication reste non renseigné. Aucune déduction du nom, de l’identifiant ou du
    backlog.
  publication: Les dix compléments du backlog attendent une prochaine release ; Atlas utilise uniquement la publication sélectionnée.
market_comparisons:
- vendor: OMG
  product: Decision Model and Notation
  element_name: Complementarity of DMN, BPMN and CMMN
  element_type: Principe méthodologique
  relationship: Appui méthodologique
  similarities: Distinguer la décision métier de la coordination du processus qui la mobilise.
  differences: DMN décrit les décisions et règles ; il ne prescrit ni ces six types de capacités ni les icônes et l’ordre
    de lecture FLOW.
  flow_position: Conserver les six natures déjà présentes et compléter les absences ; grille principale de lecture, sans taxonomie
    universelle revendiquée.
  source_title: Decision Model and Notation — OMG
  source_url: https://www.omg.org/dmn/
  source_version: Page de présentation évolutive, aucune version précise de spécification utilisée.
