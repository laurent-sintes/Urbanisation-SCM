    - U231
    - U232
    - U538
    review:
      state: partial
      adopted_scope: 'Qualification et application transactionnelle dans le cas Stock Protection. U538 : configuration apportée
        au Planning maintenue à l’extérieur, exemple Stock Protection.'
      proposed_scope: Généralisation à Management et formulation hors de ce cas.
  source: État courant avant ajout Policy ; qualification historique de Supply Protection conservée, aucun reclassement de
