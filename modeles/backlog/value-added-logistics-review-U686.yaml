fashion_refinement_U687:
  source: U687
  date: '2026-09-24'
  status: applied_U707
  author: Codex
  accepted_direction: Maille famille et filtre fashion ; détails opérationnels conservés comme preuves et exemples.
  scope: Vêtements, chaussures et accessoires ; flux neufs et retours.
  proposal: Remplacer la capacité fourre-tout Value-Added Service Order par des familles de capacités Order dans Service Order
    Management, sans nouveau sous-domaine VAS. Maintenir Picking Order et Cross-Docking Order.
  families:
  - name: Labeling Order
    scope: Étiquetage et réétiquetage, RFID et pose d’antivols ; information, identification ou protection attendue.
    source_refs:
    - ELM669
    - ELM676
    boundary: Regroupe des variantes ; pas un ordre distinct pour chaque technologie.
  - name: Packing Order
    scope: Conditionnement initial, Repacking, pliage, mise sur cintre, présentation cadeau.
    source_refs:
    - ELM665
    - ELM670
    boundary: Élargissement proposé de la capacité existante ; conserver Repacking comme variante descriptive et son identifiant
      lors d’une éventuelle application.
  - name: Kitting Order
    scope: Constitution, séparation et recomposition d’ensembles ou assortiments spécifiés.
    source_refs:
    - ELM668
    - ELM680
    boundary: Kitting / Dekitting regroupés ; ne décide pas des affectations de stock aux magasins. Inclusion encore proposée.
  - name: Garment Finishing Order
    scope: 'Finition d’aspect textile : repassage, défroissage, remise en forme.'
    source_refs:
    - ELM668
    - ELM670
    boundary: Se distingue du support de présentation et du nettoyage.
  - name: Cleaning Order
    scope: Nettoyage et détachage des vêtements, chaussures et accessoires.
    source_refs:
    - ELM667
    - ELM675
    boundary: Résultat de propreté ; techniques au catalogue.
  - name: Repair & Alteration Order
    scope: Correction de défauts et retouches confiées sur articles fashion.
    source_refs:
    - ELM669
    - ELM677
    boundary: Distinguer restauration et modification demandée dans les exigences.
  - name: Personalization Order
    scope: 'Personnalisation du produit : broderie, monogramme, gravure sur accessoires.'
    source_refs:
    - ELM670
