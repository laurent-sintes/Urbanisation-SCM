recommendations:
- name: Labeling / Relabeling
  position: Conserver
  basis:
  - ELM669
  - ELM680
  reason: Exigences sur information, version et lisibilité ; RFID et antivol restent des variantes tant que leurs engagements
    ne justifient pas une décomposition.
- name: Repacking
  position: Conserver avec exemple de mise sur cintre accepté U686
  basis:
  - ELM665
  - ELM669
  reason: Transformation du conditionnement ; ne pas englober nettoyage ou réparation sous le mot français ambigu reconditionnement.
- name: Kitting / Dekitting
  position: Recommander l’inclusion, toujours à arbitrer
  basis:
  - ELM671
  - ELM680
  reason: Conformité de composition distincte de conformité du conditionnement. Défaire/refaire des assortiments nécessite
    aussi une composition explicitement demandée.
- name: Garment Finishing
  position: Proposer un comportement
  basis:
  - ELM668
  - ELM670
  reason: Aspect obtenu, tolérances et produits admissibles diffèrent du conditionnement.
- name: Cleaning
  position: Proposer un comportement
  basis:
  - ELM667
  - ELM675
  reason: État de propreté attendu et résultat parfois partiel ; variantes de traitement dans le catalogue.
- name: Repair & Alteration
  position: Proposer un comportement
  basis:
  - ELM669
  - ELM677
  reason: Défaut ou transformation demandée, réparation autorisée et issue distincts d’un changement d’emballage.
- name: Product Personalization
  position: Proposer un comportement si le domaine couvre ce service
  basis:
  - ELM670
  - ELM671
  reason: Contenu individualisé et transformation du produit ; distinguer message cadeau et personnalisation de l’article.
- name: Inspection, Testing & Grading
  position: Examiner une famille Inspection Order si prestation autonome
  basis:
  - ELM667
  - ELM674
  reason: Livrable de constat plutôt que transformation. Un contrôle intégré au VAS reste une condition de résultat ; ne pas
    créer systématiquement un ordre supplémentaire.
