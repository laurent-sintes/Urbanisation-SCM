  - ms-plans
  - sap-arun
  - oracle-backlog
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: Conserver la capacité Planning ; rendre ses livrables métier visibles avant les modalités Scope/Run/Stop. Expliciter
    la mobilisation collective de CTP et PTP.
- id: BHV006
  current_name: Simulation & Analysis
