  market_refs:
  - ms-plans
  - sap-arun
  - oracle-process
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: Conserver comme capacité, selon les accords existants ; exposer service, coût, risques et demandes gagnantes ou
    pénalisées.
- id: D02.e
