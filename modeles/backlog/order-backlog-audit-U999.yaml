- id: D05.e
  current_name: Replenishment
  concrete_service: Proposer les apports manquants et les ajustements de ceux attendus.
  market_refs:
  - ms-master
  - ms-actions
  - sap-mrp
  - sap-sbc
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: Conserver ; ajouter la responsabilité explicite de proposition FLOW sous faisabilité CTP, sans reprise du carnet
    d’achat MAP.
- id: D05.c
  current_name: Stock Redistribution
  concrete_service: Décider de redistribuer du stock physique entre sites.
  market_refs:
  - ms-master
  - sap-mrp
  - oracle-costs
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: 'Conserver ; ne pas confondre transfert physique et réaffectation des mêmes pièces entre clients. Appuis partiels
    : la consolidation de reliquats multi-sites reste moins précisément étayée dans cette consultation.'
- id: D03.o
  current_name: Supply Assignment
  concrete_service: Choisir les ressources qui couvrent chaque demande et réviser ces choix.
  market_refs:
  - ms-marking
  - sap-arun
  - oracle-backlog
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: 'Conserver ; montrer affectation initiale et réaffectation du carnet. Les effets de protection doivent être explicites
    : une décision FLOW n’a pas tous les effets d’un ARun SAP.'
- id: D03.i
  current_name: Available-to-Promise (ATP)
  concrete_service: Évaluer les quantités et dates promettables avec les ressources présentes ou attendues.
  market_refs:
  - ms-atp
  - sap-atp
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: Conserver dans Order Promising ; peut alimenter le plan collectif. Ne pas appeler ATP toute affectation automatique.
- id: D03.j
  current_name: Capable-to-Promise (CTP)
  concrete_service: Évaluer si un nouvel apport est réalisable et à quelle date.
  market_refs:
  - ms-ctp
  - sap-sbc
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: Conserver dans Order Promising et rendre sa mobilisation par Master Planning explicite ; pas de duplication de
    capacité CTP.
- id: D03.k
  current_name: Profitable-to-Promise (PTP)
  concrete_service: Choisir une possibilité de promesse selon ses effets économiques et les engagements.
  market_refs:
  - ms-dom
  - sap-costs
  - oracle-costs
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: Conserver ; documenter le chiffrage du plan collectif dans Simulation & Analysis. Les appuis Microsoft/SAP sont
    partiels ; ils ne prouvent ni un module nommé PTP ni une optimisation générale des dates selon le pétrole.
- id: D05.a
  current_name: Physical Stock Target Optimization
  concrete_service: Recommander les niveaux et seuils de stock à viser.
  market_refs:
  - ms-targets
  - sap-mrp
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: Conserver comme contribution à Availability ; cette responsabilité justifie de ne pas réduire le sous-domaine
    au carnet de ventes.
- id: D05.d
  current_name: Logical Stock Protection Optimization
  concrete_service: Recommander les droits de stock par canal ou groupe.
  market_refs:
  - ms-allocations
  - sap-atp
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: Conserver ; une révision d’enveloppe est différente d’une réaffectation entre commandes et doit être activée par
    les politiques responsables.
- id: D05.h
  current_name: Reservation Rule Optimization
  concrete_service: Recommander quand et dans quelles conditions protéger une ressource pour une demande.
  market_refs:
  - ms-reservation
  - sap-arun
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: Conserver ; distinguer recommandation de règle, gouvernance de règle et réservation effective. Sources pertinentes
    sur les mécanismes, mais pas de preuve d’un optimiseur complet de règles de réservation.
- id: plans-visibility
  current_name: Supply Plan Visibility
  concrete_service: Interpréter les ressources futures prévues et leurs limites.
  market_refs:
  - ms-forecast
  - sap-retail
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: Conserver ; expliciter le Supply Plan FLOW hors achats. Les achats attendus et propositions d’achat restent d’autres
    objets de couverture.
- id: demand-plan-visibility
  current_name: Demand Plan Visibility
  concrete_service: Interpréter les besoins prévisionnels qui complètent les demandes connues.
  market_refs:
  - ms-forecast
  - sap-program
  relationship: Recouvrement fonctionnel partiel ; aucune équivalence de catalogue de capacités.
  proposal: Conserver ; ne pas additionner les précommandes et la prévision déjà consommée par ces demandes.
findings:
- key: split
  model_refs:
  - ba-master-plan-management
  - ba-supply-matching
  assessment: Le plan et les décisions de couverture sont séparés en deux Business Areas, alors que leurs fiches coopèrent
    au même plan commun.
  recommendation: Réunir ces Business Areas en conservant les sept capacités et leurs identités ; proposer Master Plan Management
    comme nom du regroupement. Le bénéfice est une responsabilité collective lisible, sans fusion des décisions ni séquence
    imposée.
- key: story
  model_refs:
  - D05.f
  - D03.o
  assessment: La couverture est largement présente ; le pilotage continu du carnet ne ressort pas dans la carte. Les sept
    comportements du Planning nomment surtout son pilotage de travail, pas les situations métier.
  recommendation: Introduire le service concret et un scénario autonome montrant la mobilisation des capacités ; ne pas transformer
    colonnes Kanban, réception, affermissement ou release en nouvelles capacités. Ne pas supprimer les comportements adoptés
    par simple préférence éditoriale.
- key: procurement-boundary
  model_refs:
  - D05.f
  - D05.e
  - D03.j
  - D04.j
  term_refs:
  - TER033
  - TER098
  - TER100
  assessment: CTP et Replenishment permettent déjà d’examiner des apports. Certaines clauses de Purchase Order réservent cependant
    le calcul amont des propositions à Demand & Supply Planning. La responsabilité de proposition FLOW voulue U1001/U1003
    doit être rendue compatible avec ces clauses.
  recommendation: FLOW formule un besoin d’apport et une proposition conditionnelle ; MAP conserve la planification et le
    carnet d’achat. Définir retour accepté/refusé/révisé, provenance et substitution de couverture, sans inventer un flux
    installé ni confondre lecture des achats et gestion de leur carnet.
- key: assignment-firmness
  model_refs:
  - D03.i
  - D03.o
  - D02.c
  - D04
  term_refs:
  - TER044
  - TER204
  - TER197
  assessment: ATP, lien de couverture, protection de ressource et engagement de commande sont distincts. Le scénario peut
    les coordonner, mais une fermeté de demande ne fige pas automatiquement sa supply.
  recommendation: Expliciter pour chaque stratégie les effets associés et les révisions autorisées. La ressource attendue
    protégée peut toujours subir un aléa physique ; ne pas déduire une garantie absolue du seul pegging.
- key: strategy
  model_refs:
  - subdomain-policies
  - ba-protection-policies
  - D19.b
  - D02.b
  assessment: Les règles actives existent comme références de protection ; une capacité explicite de maintien de la stratégie
    globale du carnet manque dans ce périmètre de la carte.
  recommendation: Proposer une capacité de type policy, Demand Fulfilment Policy Management, sous la Business Area persistante
    ba-protection-policies, avec extension de son nom et périmètre en Demand & Supply Policies. Elle compose et maintient
    les règles applicables ; les références existantes restent distinctes. Nom FLOW proposé, pas taxonomie commune aux éditeurs.
  market_refs:
  - ms-plans
  - ms-priority
  - ms-reservation
  - sap-bop
  - sap-arun
  - oracle-process
  limits: Rattachement, nom et périmètre nouveaux non adoptés ; pas de nouvel identifiant canonique attribué dans cet audit.
- key: hotspot
  model_refs:
  - D03.o
  - ba-master-plan-management
  - subdomain-policies
  assessment: HS-008 est localisé uniquement sur Supply Assignment et décrit un écart avant promesse ferme ; ce cadrage est
    plus étroit que le sujet global confirmé U1007.
  recommendation: Recentrer titre, problème et analyse d’écart sur le pilotage du carnet et sa stratégie, sans altérer les
    preuves ou choisir une option de convergence.
- key: delivery-release
  model_refs:
  - D04.i
  - D02.e
  - service-order-release-decision
  assessment: La tenue de l’engagement et l’autorisation des transitions sont couvertes dans les familles de commandes. La
    décision collective de sélectionner les commandes à livrer ne possède pas de capacité explicite dans Master Plan Management.
    Service Order Release Decision traite les prestations à libérer, en aval de l’autorisation du parcours de commande.
  recommendation: Ajouter à la proposition une capacité Delivery Release Decision dans Master Plan Management. Séparer la
    décision de sélection, son application par les responsables des commandes et la libération des prestations. Ne pas créer
    une seconde tenue des engagements.
  market_refs:
  - ms-release
  - sap-release
  - sap-arun
proposed_map:
  availability:
    id: D03
    name: Availability
    rename: false
  master_plan_management:
    retained_identity: ba-master-plan-management
    name: Master Plan Management
    merge_candidate: ba-supply-matching
    capabilities:
    - D05.f
    - BHV006
    - D02.e
    - D03.m
    - D05.e
    - D05.c
    - D03.o
    definition: 'Piloter la couverture du carnet de demandes et des besoins prévisionnels complémentaires : décider des priorités
      et affectations, proposer les apports et transferts utiles, comparer les alternatives et appliquer les choix autorisés.'
    additional_proposed_capabilities:
    - Delivery Release Decision
  order_promising:
    identity: ba-order-promising
    capabilities:
    - D03.i
    - D03.j
    - D03.k
    boundary: Réponse proposée à une demande identifiée ; ATP/CTP/PTP mobilisables par le plan collectif, sans duplication.
  policy_capability:
    name: Demand Fulfilment Policy Management
    kind: capability
    nature: policy
    parent_business_area_id: ba-protection-policies
    parent_subdomain_id: subdomain-policies
    parent_name_proposal: Demand & Supply Policies
    definition: 'Définir, maintenir et rendre applicables les stratégies de satisfaction des demandes : admission, priorités,
      droits de ressource, stabilité des affectations, préparation à la livraison et recours aux nouveaux apports.'
    outputs: Règles versionnées, portée, horizon, critères, conditions, autorités et dérogations ; consommation des conditions
      contractuelles reçues, sans négocier les contrats ni réécrire leurs engagements.
    exclusions: Ne classe pas elle-même le carnet, ne calcule pas le plan, ne réserve pas le stock et ne conduit pas le processus.
    decomposition: Aucun comportement proposé à ce stade ; les paramètres d’une stratégie ne deviennent pas des capacités.
  unchanged_contributions:
  - D05.a
  - D05.d
  - D05.h
  - plans-visibility
  - demand-plan-visibility
  delivery_release_capability:
    name: Delivery Release Decision
    kind: capability
    nature: decision
    parent_business_area_id: ba-master-plan-management
    parent_subdomain_id: D03
    definition: Déterminer quelles commandes, lignes et quantités du carnet peuvent être autorisées à entrer en livraison,
      à quel moment, et lesquelles doivent rester en attente.
    inputs:
    - Échéances et engagements applicables
    - Couverture réellement admissible et disponibilité pour la préparation
    - Exigences de complétude et livraison partielle
    - Règles de gestion du carnet et résultats des contrôles requis
    - Dépendances entre commandes, lignes et quantités
    outputs: Périmètre retenu pour libération, date ou condition, périmètre maintenu en attente et motifs. La décision est
      réexaminable avant application selon les règles ; pas de disponibilité future certaine présumée.
    boundaries: Les familles de commandes appliquent l’autorisation sous leurs règles de transition et conservent l’engagement.
      Plan Application transmet et suit le changement retenu sans seconde autorité. Service Order Release Decision détermine
      ensuite le moment et le regroupement des prestations ; Fulfilment Coordination fait appliquer cette décision aval. L’éligibilité
      à livrer ne confirme ni ne réécrit implicitement un engagement client.
    justification: 'Résultat métier distinct de l’affectation et du calcul du plan : choisir ce qui peut effectivement entrer
      en livraison sur le carnet. Décision répétée, unitaire ou collective, utile indépendamment de tout bouton de release
      ou moteur batch.'
    market_refs:
    - ms-release
    - sap-release
    relationship: Recouvrement fonctionnel partiel ; nom et parent FLOW proposés, sans équivalence de taxonomie.
    example: 'Trois commandes sont couvertes : une est trop éloignée de son échéance, une exige une livraison complète dont
      une ligne reste indisponible, la troisième remplit les conditions. Retenir la troisième et expliciter l’attente des
      deux autres.'
    decomposition: Aucun comportement proposé à ce stade ; pas de nouveau cycle de commande.
    status: applied_to_backlog
  commitment_position:
    existing_owner: D04.i
    definition: La famille Sales Order tient la confirmation, la fermeté et les révisions autorisées de ses engagements. Le
      plan propose les changements et la stratégie fixe les conditions. Une décision de libération ne confirme pas la commande
      à leur place.
    decision: Pas de capacité concurrente de gestion des engagements proposée dans Availability ; rendre cette coopération
      visible dans le récit.
story:
- moment: Une commande ou précommande arrive.
  capabilities:
  - D04.i
  - D03.i
  - D03.o
  - D02.e
  meaning: La demande garde son identité ; ATP évalue la possibilité et Supply Assignment choisit le lien de couverture. L’affectation
    initiale peut rester révisable selon la stratégie.
- moment: Le carnet évolue ou une arrivée est retardée.
  capabilities:
  - D05.f
  - D03.m
  - D03.o
  - BHV006
  meaning: Réexaminer ensemble les commandes concernées ; proposer maintien, report, partiel, réaffectation ou refus, avec
    effets sur les autres demandes et droits contractuels.
- moment: Les ressources ne suffisent pas.
  capabilities:
  - D05.e
  - D03.j
  - D05.c
  - D05.d
  meaning: Comparer nouvel apport réalisable, redistribution physique ou changement de droits de canal. MAP garde le pilotage
    des achats et répond aux propositions selon le parcours à préciser.
- moment: Un compromis économique est possible.
  capabilities:
  - D03.k
  - BHV006
  - D05.f
  meaning: Comparer les coûts applicables, stockage, transport, service et risque ; un report n’est permis que dans les marges
    autorisées. Le pétrole cité est une hypothèse de scénario, pas un fait de marché vérifié ici.
- moment: L’engagement se stabilise et les ressources sont protégées.
  capabilities:
  - D04.i
  - D05.h
  - D02.c
  - D02.e
  meaning: Faire appliquer les effets prévus par la stratégie et le contrat ; fermeté, protection contre réoptimisation, réservation
    et promesse restent distinctes.
- moment: Les commandes éligibles passent en livraison.
  capabilities:
  - D04.i
  - D02.e
  - service-order-release-decision
  - D06.d
  meaning: Delivery Release Decision sélectionne les commandes et quantités éligibles ; la famille de commande applique l’autorisation.
    La décision aval de libérer les prestations appartient à Service Order Release Decision et sa mise en œuvre à Fulfilment
    Coordination. Aucun statut global ni seconde gestion des engagements.
  proposed_capabilities:
  - Delivery Release Decision
kanban_position: Analogie utile de carnet piloté par politiques et vieillissement. Un vrai système Kanban exige aussi une
  définition du flux et un contrôle de l’encours ; ce n’est pas démontré par la seule présence de colonnes. Le parcours mobilise
  les capacités sans devenir leur parent.
hotspot_proposal:
  id: HS-008
  source_refs:
  - U953
  - U954
  - U973
  - U999
  - U1001
  - U1003
  - U1007
  title: Pilotage du carnet Wholesale et stratégies de couverture
  location:
    node_ids:
    - ba-master-plan-management
    - subdomain-policies
  location_rationale: Ancrage collectif sur Master Plan Management, avec la stratégie dans Supply Policy Management. Les capacités
    de promesse, stock et commandes sont des contributions à expliquer, pas toutes des ancres nécessaires.
  problem: Les pratiques rapportées pour les Marques Historiques privilégient une décision immédiate sur le stock présent
    ; Boardriders conserve les demandes non couvertes et réarbitre le carnet dans le temps. Quel socle de capacités et quelles
    stratégies configurables permettent de couvrir ces besoins, les réceptions futures, les priorités, les engagements et
    la préparation à la livraison, tout en conservant MAP pour la planification et le carnet d’achat ?
  gap_updates:
  - id: hs-008-wholesale-rules
    subject_node_id: ba-master-plan-management
    title_proposal: Stratégie transactionnelle et pilotage planifié du carnet
    assessment: Écart de règles et de pratiques ; il ne prouve pas une absence de capacité technique dans un SI.
  - id: hs-008-future-supply
    subject_node_id: ba-master-plan-management
    title_proposal: Prise en compte des ressources futures dans le pilotage du carnet
    assessment: Conserver la couverture partielle rapportée et la limite de l’étude SAP de juillet 2025 ; disponibilité technique
      actuelle à vérifier.
  proposal_not_observation: Les propositions d’approvisionnement FLOW et la stratégie cible sont un besoin U999–U1007 ; ne
    pas les présenter comme déjà réalisées chez Boardriders.
  preserve:
  - Identité HS-008
  - Observations et source_refs historiques
  - Quatre options de convergence et leurs identités, sans sélection
  - Scores et réserves existants, sans requalification implicite
  - Sarenza non évalué
  - Aucune généralisation des parts 10 %/60 % sans période et dénominateur
  related_fields_to_reexamine:
  - market_view.flow_assessment
  - complexity.rationale
  - framing_impact.rationale
  - resolution_options.principle and conditions
  - gap_analysis.open_questions
glossary_review:
  checked:
  - TER033
  - TER044
  - TER045
  - TER068
  - TER098
  - TER100
  - TER112
  - TER133
  - TER150
  - TER197
  - TER204
  - TER205
  result: 'Alignement appliqué U1009 : TER133, TER159, alias historique TER134, frontière propositions/MAP et nouvelles notions.
    Compléments rédactionnels proposés ; publications historiques conservées.'
  aligned_items:
  - TER133 et usages de Demand / Supply Matching à aligner avec la fusion
  - 'TER100 et TER033 : distinguer proposition FLOW et calcul/commande MAP'
  - 'TER045 : expliciter mobilisation collective sans nouvelle CTP'
  - TER098 conserve le sens FLOW hors achats ; expliquer cette différence avec le supply plan au sens large du scénario
  - Liens et qualifications HS-008 à aligner dans le même lot
  - Définir Delivery Release Decision et son résultat sans confondre affermissement, confirmation de promesse, autorisation
    de commande et libération des prestations.
  - Demand Fulfilment Strategy défini en TER268 ; aucun ajout d’une notion Kanban méthodologique ni assimilation à un statut
    global.
limits:
- 'Marché consulté : Microsoft Dynamics, SAP S/4HANA, Oracle et méthode Kanban ; pas d’étude exhaustive de tous les éditeurs.'
- 'Documents évolutifs ou sans édition : date et sections conservées ; pas de consensus ni réalisation installée déduits.'
- Portail SAP Help partiellement inaccessible en lecture directe ; SAP Learning fournit des passages complets pour les sujets
  cœur, SBC reste documenté par contenu indexé.
- Les études historiques et accords existants ne sont ni réécrits ni étendus ; audit des comportements clos non rouvert.
- Lot appliqué au backlog U1009 ; aucune publication, aucune réalisation installée nouvelle ni option de convergence choisie.
