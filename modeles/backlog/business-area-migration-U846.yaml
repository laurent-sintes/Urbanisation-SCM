history_commit: 852f73ca4bb8c9f78a2c6caa3ad274f998305308
market_limit: Les appuis méthodologiques U845 restent valides. Les comparaisons fonctionnelles propres aux nouveaux périmètres
  sont non documentées ; aucune correspondance des capacités n’est étendue automatiquement à leur Business Area.
publication_delivery:
  state: applied
  source_refs:
  - U848
  - U853
  - U858
  - U861
  - U865
  summary: '16 Business Areas, 64 capacités regroupées et 17 directes ; aucun savoir-faire supprimé. U858 : contrôles courants
    adaptés au retrait des huit Visibility de références et à la conservation de l’interprétation des plans ; état antérieur
    conservé dans Git (745813e). U861 : commandes passives et pilotage par les tâches du workflow explicités ; identités et
    rattachements conservés. U865 : Plan Visibility dans Availability, Inventory State Management et précommandes ; contrôles
    courants alignés.'
  required_nodes:
  - id: ba-inventory-position-management
    kind: business_area
    parent: D01
    fields:
      name: Inventory State Management
      definition: Établir et restituer les positions de stock fiables et les quantités engagées, avec leurs faits, vérifications
        et corrections.
      finality: Permettre aux responsables des commandes de s’appuyer sur une position de stock expliquée et datée.
      scope: |-
        Les changements de propriétaire sont portés par Inventory Ownership Management ; aucune fusion des registres ou de la réservation.

        Bénéficiaire et résultat : Permettre aux responsables des commandes de s’appuyer sur une position de stock expliquée et datée.

        Exemple fictif : Une réception annoncée de 100 pièces est constatée à 80 : restituer la correction et les engagements concernés sans confondre disponibilité et propriété.

        State désigne la situation quantitative datée : quantités par produit, lieu et état, mouvements reconnus, contrôles et engagements de [Reservation](model:D02.c). Ce périmètre reste distinct de la propriété des biens.
  - id: ba-inventory-ownership-management
    kind: business_area
    parent: D01
    fields:
      name: Inventory Ownership Management
      definition: Déterminer et tracer les changements de propriétaire des biens à partir des faits et conditions applicables.
      finality: Permettre aux responsables des engagements de connaître le propriétaire reconnu des biens et le fait qui justifie
        son changement.
      scope: |-
        La reconnaissance de propriété reste distincte du déplacement physique et de l’écriture comptable.

        Bénéficiaire et résultat : Permettre aux responsables des engagements de connaître le propriétaire reconnu des biens et le fait qui justifie son changement.

        Exemple fictif : Un prélèvement sur stock fournisseur déclenche le transfert prévu au contrat ; le mouvement physique et la comptabilisation restent des responsabilités distinctes.
  - id: ba-master-plan-management
    kind: business_area
    parent: D03
    fields:
      name: Master Plan Management
      definition: Maintenir et réviser un plan commun d’affectation en comparant les alternatives et en coordonnant son application.
      finality: Donner aux responsables de couverture des demandes un plan commun dont les révisions et les conséquences sont
        explicites.
      scope: |-
        Distinct des plans prévisionnels reçus du domaine Demand & Supply Planning.

        Bénéficiaire et résultat : Donner aux responsables de couverture des demandes un plan commun dont les révisions et les conséquences sont explicites.

        Exemple fictif : Une rentrée est retardée : comparer une nouvelle répartition, vérifier les engagements et ne rendre effective que la révision retenue.
  - id: ba-order-promising
    kind: business_area
    parent: D03
    fields:
      name: Order Promising
      definition: Déterminer et réexaminer les propositions de quantités, dates et conditions de satisfaction des demandes.
      finality: Donner au responsable de la commande une proposition admissible de quantité et de date, avec ses conditions.
      scope: |-
        Proposer ne confirme pas un engagement de commande.

        Bénéficiaire et résultat : Donner au responsable de la commande une proposition admissible de quantité et de date, avec ses conditions.

        Exemple fictif : Proposer 60 pièces vendredi et 40 lundi ; la proposition ne devient un engagement que lors de sa confirmation dans la commande.
  - id: ba-supply-matching
    kind: business_area
    parent: D03
    fields:
      name: Supply Matching
      definition: Arbitrer la couverture des besoins par la priorisation, les apports, les transferts et les affectations
        de ressources.
      finality: Permettre aux responsables des demandes de savoir quelles ressources leur sont affectées et quels besoins
        restent découverts.
      scope: |-
        Les familles de commandes portent les demandes et leurs engagements ; les registres portent les effets reconnus.

        Bénéficiaire et résultat : Permettre aux responsables des demandes de savoir quelles ressources leur sont affectées et quels besoins restent découverts.

        Exemple fictif : Deux demandes se partagent 80 pièces : arbitrer selon leurs priorités et expliciter la part non couverte sans réécrire les commandes.
  - id: ba-policy-optimization
    kind: business_area
    parent: D03
    fields:
      name: Policy Optimization
      definition: Recommander les cibles et règles de protection ou de réservation adaptées aux objectifs et contraintes.
      finality: Fournir aux responsables des règles une recommandation justifiée avant toute modification de la règle active.
      scope: |-
        Les règles actives et leur validité demeurent dans Policies.

        Bénéficiaire et résultat : Fournir aux responsables des règles une recommandation justifiée avant toute modification de la règle active.

        Exemple fictif : Recommander une protection de 20 pièces après comparaison des ruptures et surstocks ; Policies conserve la mise en vigueur de la règle.
  - id: ba-order-lifecycle-management
    kind: business_area
    parent: D04
    fields:
      name: Order Lifecycle Management
      definition: Tenir les commandes, leurs engagements et leurs évolutions, préserver leur traçabilité et restituer leur
        état.
      finality: Donner aux parties de la commande une trace fiable de ce qui a été demandé, accepté, modifié et réalisé.
      scope: |-
        La structuration et la visibilité restent des capacités distinctes ; le pilotage du parcours relève de Reactive Workflow Management.

        Bénéficiaire et résultat : Donner aux parties de la commande une trace fiable de ce qui a été demandé, accepté, modifié et réalisé.

        Exemple fictif : Une commande est fractionnée avec accord du client : conserver les engagements et la filiation des parties sans choisir leur transporteur.
  - id: ba-reactive-workflow-management
    kind: business_area
    parent: D04
    fields:
      name: Reactive Workflow Management
      definition: Organiser et conduire le parcours des commandes en réagissant à leur contexte tout en préservant leurs engagements.
      finality: Faire progresser les commandes malgré les changements de contexte, selon des activités et transitions autorisées.
      scope: |-
        Fulfilment conserve la coordination et les adaptations locales des prestations dans le mandat confié.

        Bénéficiaire et résultat : Faire progresser les commandes malgré les changements de contexte, selon des activités et transitions autorisées.

        Exemple fictif : Un paiement confirmé débloque la suite de la commande ; un événement répété ne déclenche pas une seconde prestation. Une adaptation locale reste confiée à Fulfilment Orchestration.

        Le moteur produit les [Tasks](glossary:TER089) qui pilotent le suivi des [Service Orders](glossary:TER066) passifs. La demande et son état restent dans l’Order ; le pilotage est dans les tâches ; la réalisation est chez le prestataire.
  - id: ba-service-planning
    kind: business_area
    parent: D06
    fields:
      name: Service Planning
      definition: Déterminer les prestations nécessaires, leurs exécutants et les plans de transport compatibles avec les
        engagements.
      finality: Fournir aux responsables de la réalisation un ensemble de prestations réalisables et compatibles avec les
        engagements confiés.
      scope: |-
        La visibilité des capacités de service alimente ce périmètre ; aucun type de capacité n’est changé en Planning par son rattachement.

        Bénéficiaire et résultat : Fournir aux responsables de la réalisation un ensemble de prestations réalisables et compatibles avec les engagements confiés.

        Exemple fictif : Prévoir emballage puis collecte selon la capacité annoncée et la date promise ; la famille de commande conserve l’engagement accepté.
  - id: ba-execution-assurance
    kind: business_area
    parent: D06
    fields:
      name: Execution Assurance
      definition: Établir une connaissance fiable de la réalisation des prestations, rapprocher leurs résultats et rendre
        visibles les écarts.
      finality: Permettre aux responsables de la coordination de distinguer réalisation attestée, attente et écart à traiter.
      scope: |-
        Ne décide pas seule des adaptations et ne se substitue pas à Order Workflow Sentry.

        Bénéficiaire et résultat : Permettre aux responsables de la coordination de distinguer réalisation attestée, attente et écart à traiter.

        Exemple fictif : Une collecte est annoncée mais non attestée : rapprocher les faits et rendre visible l’écart sans choisir seul une autre prestation.
  - id: ba-execution-coordination
    kind: business_area
    parent: D06
    fields:
      name: Execution Coordination
      definition: Coordonner, libérer et adapter les prestations dans le mandat confié et les engagements applicables.
      finality: Faire réaliser les prestations confiées dans les limites de la promesse et des autorisations.
      scope: |-
        La décision sur le devenir des biens reste une responsabilité distincte directement rattachée au sous-domaine.

        Bénéficiaire et résultat : Faire réaliser les prestations confiées dans les limites de la promesse et des autorisations.

        Exemple fictif : Décaler une collecte dans la marge autorisée ; si la date promise devient impossible, remonter les faits à Order Management au lieu de changer seul la promesse.
  - id: ba-inbound-information-integration
    kind: business_area
    parent: subdomain-integration
    fields:
      name: Inbound Information Integration
      definition: Recevoir et intégrer les plans et référentiels fournis par les domaines sources.
      finality: Donner aux décisions d’orchestration des données sources utilisables, datées et dont la provenance est conservée.
      scope: |-
        Ne transfère pas leur maîtrise d’entreprise et ne reprend pas les événements des prestations pilotées par Fulfilment.

        Bénéficiaire et résultat : Donner aux décisions d’orchestration des données sources utilisables, datées et dont la provenance est conservée.

        Exemple fictif : Recevoir une révision de plan et son périmètre ; rejeter un lot incohérent sans remplacer silencieusement la dernière version valide.
  - id: ba-outbound-information-provision
    kind: business_area
    parent: subdomain-integration
    fields:
      name: Outbound Information Provision
      definition: Fournir les informations opérationnelles utiles à la comptabilité, à la planification et à l’amélioration
        produit.
      finality: Permettre aux domaines destinataires d’exploiter des faits opérationnels traçables pour leurs propres décisions.
      scope: |-
        Transmettre un fait de gestion ne le transforme pas en écriture comptable.

        Bénéficiaire et résultat : Permettre aux domaines destinataires d’exploiter des faits opérationnels traçables pour leurs propres décisions.

        Exemple fictif : Transmettre une correction de stock à la planification avec son accusé de réception ; le destinataire décide seul de modifier son plan.
  - id: ba-goods-processing-order-management
    kind: business_area
    parent: subdomain-service-orders
    fields:
      name: Goods Processing Order Management
      definition: Tenir les demandes et engagements de prestations portant sur le traitement des biens.
      finality: Donner au donneur d’ordre et au prestataire un engagement explicite sur le traitement demandé aux biens.
      scope: |-
        Couvre préparation, réception, transit, conditionnement, finition, entretien, contrôle et rebut ; ne présume pas leur réalisation dans un entrepôt et ne pilote pas les opérations internes.

        Bénéficiaire et résultat : Donner au donneur d’ordre et au prestataire un engagement explicite sur le traitement demandé aux biens.

        Exemple fictif : Demander un nouvel étiquetage sur 40 pièces et suivre son acceptation puis son résultat ; la réalisation physique appartient au prestataire.

        Les familles sont des commandes passives adressées à la logistique selon une offre de service définie. Elles portent les exigences et résultats ; les [Tasks](glossary:TER089) du moteur de [Reactive Workflow Management](glossary:TER125) pilotent leur suivi. Aucune décision autonome n’est attachée à ces familles.
  - id: ba-transport-order-management
    kind: business_area
    parent: subdomain-service-orders
    fields:
      name: Transport Order Management
      definition: Tenir les demandes et engagements d’acheminement et de réservation de capacité de transport.
      finality: Donner aux parties du transport une demande et un engagement traçables sur l’acheminement ou la capacité réservée.
      scope: |-
        La construction du plan de transport reste dans Fulfilment.

        Bénéficiaire et résultat : Donner aux parties du transport une demande et un engagement traçables sur l’acheminement ou la capacité réservée.

        Exemple fictif : Réserver une capacité avant de connaître toutes les instructions, puis préciser l’acheminement sans confondre réservation et transport réalisé.
  - id: ba-financial-service-order-management
    kind: business_area
    parent: subdomain-service-orders
    fields:
      name: Financial Service Order Management
      definition: Tenir les demandes confiées de facturation et d’encaissement et suivre leurs résultats.
      finality: Permettre au donneur d’ordre de connaître l’état et le résultat des prestations de facturation ou d’encaissement
        confiées.
      scope: |-
        Ne reprend ni la responsabilité comptable ni l’exécution des opérations par les services sollicités.

        Bénéficiaire et résultat : Permettre au donneur d’ordre de connaître l’état et le résultat des prestations de facturation ou d’encaissement confiées.

        Exemple fictif : Confier une facturation et recevoir sa référence de résultat ; les règles fiscales et la tenue des comptes restent sous autorité financière.

        [Billing Order](model:service-order-billing) et [Payment Order](model:service-order-payment-collection) sont des commandes passives de prestations définies. Les [Tasks](glossary:TER089) du workflow pilotent leur suivi ; les services financiers réalisent la facturation et l’encaissement.
