market_basis:
  reuse: Comparaisons effectivement consultées pour U845 ; périmètre toujours pertinent. Les nouveaux noms sont des propositions
    FLOW, pas des termes revendiqués comme communs aux éditeurs.
  sources:
  - vendor: SAP
    url: https://learning.sap.com/courses/sap-enterprise-architecture-framework-foundation-introduction/discovering-the-reference-architecture-content
    support: Business Domain / Business Area / Business Capability et rattachement unique ; exemple relié aux solutions S/4HANA.
    limit: Aucune équivalence niveau à niveau avec la chaîne FLOW ni justification automatique des 16 noms proposés.
  - vendor: Microsoft Dynamics
    url: https://learn.microsoft.com/en-us/dynamics365/guidance/business-processes/about
    support: Regroupement significatif de processus sous Business process area.
    limit: Modèle de processus orienté solution ; ne prouve pas notre découpage de responsabilité.
implementation_batches:
- step: 1
  name: Contrat et glossaire méthodologique
  work:
  - Définir Business Area, profondeur facultative, parentage et relations documentaires.
  - Étendre schémas et validateurs sans modifier les snapshots historiques.
  - Préparer les identités et codes de lecture ; aucun ID retiré réutilisé.
- step: 2
  name: Migration canonique contrôlée
  work:
  - Appliquer les rattachements de cette table aux 81 capacités, sans réécrire leurs savoir-faire.
  - Retirer les relations de parentage remplacées en préservant leur provenance ; créer les nouvelles avec leurs identités
    propres.
  - Aligner les deux glossaires, principes, déclarations de livraison, références et contrôles concernés.
  - Capturer uniquement l’accord obtenu sur le plan final ; réexaminer les accords historiques dont le contexte change.
- step: 3
  name: Lecture Atlas et publication
  work:
  - Arbre, fiche Business Area, recherche, liens directs, fil de navigation, vues de relations et exports.
  - Une fiche Business Area expose finalité, frontières, capacités et scénarios dérivés sans recopier leurs catalogues.
  - Conserver la consultation des anciennes publications avec leurs catégories ; aucun repli sur le backlog.
  - Vérifier candidate et comparaison avant activation ; release, commit et push restent des opérations distinctes.
- step: 4
  name: Contrôles de non-régression
  work:
  - 81 capacités avant/après, mêmes identités, définitions, types et comportements.
  - Un rattachement principal et aucun cycle, orphelin ou doublon.
  - 27 scénarios et 28 parcours conservés ; contributions et liens directs inchangés.
  - Contrôler explicitement les 8 références documentaires et leur accès.
  - Tests de schémas, hiérarchie, recherche, scénarios, accords, codes et export ; build frontend et vérification des vues
    nouvelles et historiques.
validation_requested:
- 16 Business Areas avec les noms, frontières et rattachements de cette proposition.
- Niveau Business Area facultatif ; 17 capacités directement rattachées au sous-domaine.
- Traitement des références comme objets documentaires distincts de la hiérarchie de responsabilité.
delivery_boundary: Ce plan n’est pas une migration appliquée et ne demande pas la publication des Business Areas. Aucun accord
  de champ capturé sur les propositions nouvelles avant validation.
singleton_review:
  source_ref: U847
  status: recommendation_not_yet_approved
  rule: Réexaminer les rattachements directs pour leur sens, non pour leur nombre.
  examples:
  - capability_id: service-order-customs-clearance
    reason: La responsabilité de tenue des prestations douanières et la capacité actuelle se recouvrent fortement ; rattachement
      direct recommandé à cette maille, pas suppression du sujet.
  - capability_id: D05.i
    reason: La décision du devenir des biens est distincte mais une Business Area Goods Disposition pourrait répéter la capacité
      ; ne pas créer ce niveau uniquement pour homogénéiser l’arbre.
