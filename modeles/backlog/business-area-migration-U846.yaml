id: BUSINESS-AREA-MIGRATION-U846
status: applied
source_refs:
- U845
- U846
- U847
- U848
approved_principle: Plan U846/U847 validé intégralement par U848 et appliqué.
canonical_model_changed: true
basis:
  path: modeles/backlog/model.yaml
  content_sha256: 9dafb217987417723a093765f273540e9b968640d079a6dcd97b6224ff78075c
  capabilities: 81
  category_occurrences: 31
recommendation:
  business_areas: 16
  capabilities_in_business_areas: 64
  capabilities_directly_in_subdomains: 17
  optional_level: true
  business_area_definition: Partie cohérente de la responsabilité d’un sous-domaine, définie par sa finalité, ses résultats
    attendus et ses frontières, et portée par des capacités.
  identity: Nouvelle entité business_area, distincte du kind area actuel qui désigne les Subdomains. Proposition de code de
    lecture BA, stable dans chaque publication.
  ownership: Un parent métier principal par capacité ; les mobilisations transversales ne créent pas de copies ni de nouveaux
    parents.
  category_future: Retirer category du modèle courant après migration ; ne pas maintenir deux rattachements concurrents. Conserver
    son interprétation pour les publications historiques.
  reference_objects: Les références restent des objets documentaires avec leurs identités et contenus ; leurs liens de documentation
    se distinguent du rattachement des capacités.
  no_business_rewrite: Les regroupements proposés ne changent ni le sens, ni le type, ni les comportements des capacités ;
    descriptions de frontières et liens sont alignés.
  cardinality: Aucun minimum de deux capacités par Business Area. Une capacité unique est admissible si le périmètre apporte
    une finalité, une frontière ou une lecture stable distincte. La règle zéro ou au moins deux comportements ne s’applique
    pas ici.
  semantic_test: La Business Area exprime le périmètre dont on répond ; la capacité exprime le savoir-faire. Si les deux descriptions
    se confondent, conserver la capacité directement dans le sous-domaine. Ne pas inventer de capacité ni supposer un manque
    pour remplir le périmètre.
  count_status: 16 est le résultat de la proposition actuelle, pas un objectif de nombre ni une contrainte de cardinalité.
business_areas:
- proposed_id: ba-inventory-position-management
  parent_id: D01
  name: Inventory Position Management
  definition: Établir et restituer les positions de stock fiables et les quantités engagées, avec leurs faits, vérifications
    et corrections.
  capability_ids:
  - D01.f
  - D01.g
  - D01.d
  - D02.c
  - D01.c
  boundary: Les changements de propriétaire sont portés par Inventory Ownership Management ; aucune fusion des registres ou
    de la réservation.
- proposed_id: ba-inventory-ownership-management
  parent_id: D01
  name: Inventory Ownership Management
  definition: Déterminer et tracer les changements de propriétaire des biens à partir des faits et conditions applicables.
  capability_ids:
  - D01.h
  - inventory-ownership-ledger
  boundary: La reconnaissance de propriété reste distincte du déplacement physique et de l’écriture comptable.
- proposed_id: ba-master-plan-management
  parent_id: D03
  name: Master Plan Management
  definition: Maintenir et réviser un plan commun d’affectation en comparant les alternatives et en coordonnant son application.
  capability_ids:
  - D02.e
  - D05.f
  - BHV006
  boundary: Distinct des plans prévisionnels reçus du domaine Demand & Supply Planning.
- proposed_id: ba-order-promising
  parent_id: D03
  name: Order Promising
  definition: Déterminer et réexaminer les propositions de quantités, dates et conditions de satisfaction des demandes.
  capability_ids:
  - D03.i
  - D03.j
  - D03.k
  boundary: Proposer ne confirme pas un engagement de commande.
- proposed_id: ba-supply-matching
  parent_id: D03
  name: Supply Matching
  definition: Arbitrer la couverture des besoins par la priorisation, les apports, les transferts et les affectations de ressources.
  capability_ids:
  - D03.m
  - D05.e
  - D05.c
  - D03.o
  boundary: Les familles de commandes portent les demandes et leurs engagements ; les registres portent les effets reconnus.
- proposed_id: ba-policy-optimization
  parent_id: D03
  name: Policy Optimization
  definition: Recommander les cibles et règles de protection ou de réservation adaptées aux objectifs et contraintes.
  capability_ids:
  - D05.a
  - D05.d
  - D05.h
  boundary: Les règles actives et leur validité demeurent dans Policies.
- proposed_id: ba-order-lifecycle-management
  parent_id: D04
  name: Order Lifecycle Management
  definition: 'Tenir les commandes, leurs engagements et leurs évolutions, préserver leur traçabilité et restituer leur état. '
  capability_ids:
  - D04.i
  - D04.j
  - D04.k
  - D04.l
  - D04.m
  - D04.r
  - D04.t
  - D04.n
  - order-visibility
  boundary: La structuration et la visibilité restent des capacités distinctes ; le pilotage du parcours relève de Reactive
    Workflow Management.
- proposed_id: ba-reactive-workflow-management
  parent_id: D04
  name: Reactive Workflow Management
  definition: Organiser et conduire le parcours des commandes en réagissant à leur contexte tout en préservant leurs engagements.
  capability_ids:
  - workflow-definition-management
  - order-workflow-sentry
  - order-workflow-planning
  - order-workflow-orchestration
  boundary: Fulfilment conserve la coordination et les adaptations locales des prestations dans le mandat confié.
- proposed_id: ba-service-planning
  parent_id: D06
  name: Service Planning
  definition: Déterminer les prestations nécessaires, leurs exécutants et les plans de transport compatibles avec les engagements.
  capability_ids:
  - D06.b
  - D07.a
  - D06.e
  - transport-plan-decision
  boundary: La visibilité des capacités de service alimente ce périmètre ; aucun type de capacité n’est changé en Planning
    par son rattachement.
- proposed_id: ba-execution-assurance
  parent_id: D06
  name: Execution Assurance
  definition: Établir une connaissance fiable de la réalisation des prestations, rapprocher leurs résultats et rendre visibles
    les écarts.
  capability_ids:
  - D07.d
  - D07.c
  - operations-visibility
  boundary: Ne décide pas seule des adaptations et ne se substitue pas à Order Workflow Sentry.
- proposed_id: ba-execution-coordination
  parent_id: D06
  name: Execution Coordination
  definition: Coordonner, libérer et adapter les prestations dans le mandat confié et les engagements applicables.
  capability_ids:
  - D06.d
  - D06.f
  - service-order-release-decision
  boundary: La décision sur le devenir des biens reste une responsabilité distincte directement rattachée au sous-domaine.
- proposed_id: ba-inbound-information-integration
  parent_id: subdomain-integration
  name: Inbound Information Integration
  definition: Recevoir et intégrer les plans et référentiels fournis par les domaines sources.
  capability_ids:
  - plans-ingestion
  - master-data-ingestion
  boundary: Ne transfère pas leur maîtrise d’entreprise et ne reprend pas les événements des prestations pilotées par Fulfilment.
- proposed_id: ba-outbound-information-provision
  parent_id: subdomain-integration
  name: Outbound Information Provision
  definition: Fournir les informations opérationnelles utiles à la comptabilité, à la planification et à l’amélioration produit.
  capability_ids:
  - accounting-data-provision
  - planning-data-provision
  - product-feedback
  boundary: Transmettre un fait de gestion ne le transforme pas en écriture comptable.
- proposed_id: ba-goods-processing-order-management
  parent_id: subdomain-service-orders
  name: Goods Processing Order Management
  definition: Tenir les demandes et engagements de prestations portant sur le traitement des biens.
  capability_ids:
  - service-order-picking
  - service-order-packing
  - service-order-cross-docking
  - service-order-labeling
  - service-order-kitting
  - service-order-garment-finishing
  - service-order-cleaning
  - service-order-repair-alteration
  - service-order-personalization
  - service-order-inspection
  - service-order-receiving
  - service-order-scrapping
  boundary: Couvre préparation, réception, transit, conditionnement, finition, entretien, contrôle et rebut ; ne présume pas
    leur réalisation dans un entrepôt et ne pilote pas les opérations internes.
- proposed_id: ba-transport-order-management
  parent_id: subdomain-service-orders
  name: Transport Order Management
  definition: Tenir les demandes et engagements d’acheminement et de réservation de capacité de transport.
  capability_ids:
  - service-order-transport
  - service-order-transport-booking
  boundary: La construction du plan de transport reste dans Fulfilment.
- proposed_id: ba-financial-service-order-management
  parent_id: subdomain-service-orders
  name: Financial Service Order Management
  definition: Tenir les demandes confiées de facturation et d’encaissement et suivre leurs résultats.
  capability_ids:
  - service-order-billing
  - service-order-payment-collection
  boundary: Ne reprend ni la responsabilité comptable ni l’exécution des opérations par les services sollicités.
