- id: MOD039
  name: Business Area
  label_fr: Périmètre de responsabilité métier
  definition: Partie cohérente de la responsabilité d’un sous-domaine, définie par sa finalité, ses résultats et ses frontières.
    Elle porte des capacités ou un périmètre de références documentaires.
  short_description: Périmètre de responsabilité obligatoire entre un sous-domaine et ses capacités ; peut aussi porter des
    références.
  role: Préciser une finalité et des frontières métier avant de détailler les savoir-faire.
  notes:
  - Niveau obligatoire entre sous-domaine et capacité. Une seule capacité est admissible ; aucune capacité artificielle n’est
    créée pour remplir un regroupement.
  - Ne désigne automatiquement ni une équipe, ni un produit, ni une application.
  - 'Chaque capacité a un parent métier unique : une Business Area de son sous-domaine.'
  - Une Area de références porte leur cohérence et leur fourniture locale. Elle les présente sans les transformer en capacités
    ; chaque référence conserve un parent de présentation unique.
