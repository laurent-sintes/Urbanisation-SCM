- id: MOD040
  name: Visibility
  label_fr: Connaissance de la situation métier
  definition: Établir et restituer une connaissance métier exploitable à partir d’informations qui nécessitent un rapprochement,
    une consolidation, une interprétation ou une qualification métier. La simple consultation de données déjà établies ne
    justifie pas une capacité Visibility autonome.
  short_description: Établir une situation métier à partir d’informations à rapprocher ou qualifier, au-delà de leur simple
    consultation.
  role: Distinguer une connaissance métier construite d’un accès aux données.
  notes:
  - 'Justifier une [capacité](method:MOD015) par la connaissance métier produite : rapprochement de faits, consolidation sans
    double compte, interprétation des états, qualification de validité ou traitement des incohérences.'
  - Une consultation, une recherche, un affichage, une copie ou une transformation purement technique ne justifient pas une
    capacité Visibility autonome. Une règle métier simple peut suffire si elle établit un résultat distinct ; aucune complexité
    minimale artificielle.
  - Visibility établit ce qui est connu, estimé ou incertain. Une [Evaluation](method:MOD021) apprécie des possibilités et
    une [Decision](method:MOD001) choisit une réponse. L’acquisition de faits peut contribuer à Visibility sans imposer un
    nouveau découpage technique.
  - Convention de nommage et de périmètre FLOW, rattachée à la nature Knowledge lorsqu’elle est pertinente ; ni nouveau type,
    ni niveau hiérarchique, ni prescription d’outil.
  - Avant un retrait, conserver les données, leurs sources, les responsabilités utiles et les dépendances des scénarios. Ne
    pas créer automatiquement une capacité générique de remplacement.
  examples:
  - '[Inventory Visibility](model:D01.c) rapproche stock, apports attendus et engagements sans compter deux fois une réception.'
  - '[Service Capacity Visibility](model:D06.b) interprète les informations fournisseur et distingue plafond, charge, disponibilité
    annoncée et inconnues.'
  - '[Operations Visibility](model:operations-visibility) consolide faits et attentes pour exposer la progression et les informations
    absentes.'
  - Lire le tarif reçu d’un [Product Price Book](model:product-price-book) et [Service Price Book](model:service-price-book)
    reste un accès au référentiel ; le choix économique appartient à la décision consommatrice.
  - '[Supply Plan Visibility](model:plans-visibility) et [Demand Plan Visibility](model:demand-plan-visibility) interprètent
    les prévisions pour une demande donnée, sans inventer une précision absente ni décider de sa couverture.'
  source_refs:
  - U855
  - U856
  - U857
  - U858
  review:
    state: proposed
    note: Ajout demandé U856 ; rédaction du critère U855, sans accord individuel sur les suppressions proposées.
  market_comparison:
    common: Les produits documentent des vues calculées et des rapprochements métier, distincts des données sources.
    difference: Le marché consulté ne prescrit pas de créer une capacité Visibility pour chaque objet ni notre critère de
      granularité.
    flow_position: 'Convention FLOW : résultat de connaissance distinct, indépendant de la complexité technique.'
    sources:
    - url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-on-hand-list
      consulted_on: '2026-10-06'
      support: 'Dynamics 365 Supply Chain Management : positions agrégées, quantités physiques et réservées, distinction des
        calculs selon les dimensions.'
    - url: https://learning.sap.com/courses/implementing-sap-s-4hana-cloud-public-edition-sourcing-and-procurement/introducing-procurement-overview-page-and-real-time-reporting-and-monitoring-for-procurement_b1220cd8-8141-476c-bd30-0de739fdb2f6
      consulted_on: '2026-10-06'
      support: 'SAP S/4HANA : indicateurs et suivi des achats et confirmations ; appui à la connaissance construite, pas à
        une taxonomie Visibility universelle.'
    source_refs:
    - U856
