purpose: Vocabulaire de modélisation en support à la définition des objets du modèle ; distinct du glossaire métier.
boundary:
  business_glossary: modeles/backlog/glossary.yaml
  rule: Ne pas fusionner ce registre avec le glossaire métier ni ajouter ses termes au catalogue métier publié.
  coverage: Vocabulaire de modélisation U229–U232, couverture U260 et comportement U262 ; aucune reclassification exhaustive
    des termes historiques réalisée.
  links: Les identifiants MOD appartiennent au méta modèle. Atlas sépare les deux glossaires selon une association méthodologique
    figée ; les liens TER historiques restent résolus dans leur publication.
identification_rules:
  policy: typed-tree-v1
  source_refs:
  - U782
  - U783
  - U848
  persistent_identity: id immuable, sans réutilisation après retrait ; porte les relations, accords et liens historiques.
  prefixes:
    business_system: SYS
    domain: DOM
    area: SUB
    reference: REF
    capability: CAP
    behavior: BHV
    business_area: BA
  format: PREFIX-NNN ; padding minimal de trois chiffres, sans limite à 999.
  scope: Séquence globale distincte par type, sur les éléments effectivement publiés ; catégories, rôles, termes, relations
    et illustrations hors de cette numérotation.
  traversal: Parcours en profondeur préordre sur les relations explicites ; types de capacités puis Déclenchement avant Activité.
    Les catégories restent interprétées uniquement pour les publications historiques.
  freeze: display_index généré dans le snapshot à la préparation ; codes, racines et listes d’enfants figés. Aucun calcul
    dépendant de la largeur, des filtres, du repli ou de la recherche.
  evolution: Insertion ou déplacement peut décaler les codes dans une nouvelle publication ; les anciennes conservent leurs
    codes ou leur absence historique.
  navigation: Recherche par code visible ou id persistant ; liens partagés par id et version. Un code seul ne désigne pas
    durablement un objet entre publications.
  display: Même ordre dans l’arbre, les cartes et les fiches ; la disposition du graphe Relations et le classement des résultats
    de recherche sont indépendants.
  authority: Convention de présentation FLOW adoptée U783 ; ne modifie ni identité, ni parent, ni responsabilité métier.
  references:
  - url: https://www.apqc.org/process-frameworks/pcf-faqs
    consulted_on: '2026-09-26'
    support: Distinction hierarchy ID / PCF element ID. Analogie d’identification ; le PCF décrit des processus et ne prescrit
      pas les préfixes FLOW.
  - url: https://learn.microsoft.com/en-us/power-apps/maker/data-platform/access-migrate-linked-tables
    consulted_on: '2026-09-26'
    support: Identité système distincte des valeurs présentées. Appui technique Dataverse, pas une norme de numérotation des
      capacités.
terms:
- id: MOD001
  name: Decision
  label_fr: Décision
  definition: Déterminer une réponse métier à partir d’hypothèses, d’objectifs et de contraintes.
  role: Qualifier une responsabilité de décision dans le modèle.
  source_refs:
  - U229
  - U232
  review:
    state: partial
    adopted_scope: Préférence pour Decision et distinction avec Planning ; aucun choix de capacité spécifique adopté.
    proposed_scope: Définition synthétique rédigée par Codex.
  short_description: Choisir une réponse métier selon les faits, objectifs et contraintes.
  editorial_notes:
  - Les capacités de Planning se nourrissent des capacités de décision selon U229.
  - Le calcul est un moyen possible ; U229 préfère Decision et souhaite éviter Calculation comme intitulé de capacité.
  - Une décision modélisée ne prouve pas sa mise en application transactionnelle.
  notes:
  - Une décision produit une réponse ; la capacité responsable rend cette réponse effective.
  parent_term: MOD007
- id: MOD002
  name: Planning
  label_fr: Planification
  definition: Construire et réviser un plan en mobilisant les décisions nécessaires.
  role: Qualifier les responsabilités de planification qui utilisent les décisions.
  source_refs:
  - U229
  - U232
  - U267
  - U269
  - U271
  - U283
  - U284
  - U290
  - U537
  - U538
  - CMP220
  - U806
  review:
    state: partial
    adopted_scope: 'Mobilisation des décisions U229 et trois directions de comportements Inventory Planning U283/U284, appliquées
      U290. U537 : application du plan comme comportement du Planning. U538 : configuration apportée au Planning maintenue
      à l’extérieur.'
    proposed_scope: Définition synthétique, libellé Plan Application et détails des effets rédigés par Codex ; décomposition
      de chaque Planning et reparentage éventuel à instruire.
  short_description: Construire et réviser un plan en mobilisant les décisions nécessaires.
  editorial_notes:
  - Planning mobilise les décisions spécialisées ; elles restent des capacités distinctes.
  - Inventory Planning comporte Scenario Construction, Simulation & Analysis et Scenario Execution Adaptation depuis U290.
    Comparaison, autorisation et mise en action restent des fonctions utiles.
  - Les pratiques peuvent être itératives ou automatisées ; aucun contrôle humain systématique ni cycle technique universel
    n’est imposé.
  - L’application mobilise les capacités opérationnelles responsables. D06 conserve la décision d’adaptation opérationnelle
    ; D05 adapte son scénario de stock.
  - Les accords U269/U271 remplacés sont conservés dans d05-refactoring.yaml et audits/2026-09-17-refonte-appliquee/modeling-glossary-before.yaml.
    La généralisation détaillée à toute capacité Planning reste proposée.
  - 'U537 : l’application du plan relève d’un comportement du Planning concerné. Elle porte la mise en effet du résultat retenu
    et la connaissance de sa prise en compte ; elle ne se réduit pas à un appel technique. Le libellé Plan Application reste
    proposé.'
  - 'U538 : définir, maintenir et fournir une configuration utilisée par le Planning reste une responsabilité extérieure.
    Supply Protection (Stock Protection dans l’exemple utilisateur) gouverne les protections consommées par le Planning ;
    sa mise à jour ne devient pas un comportement de Planning.'
  - Le Planning peut mobiliser une capacité partenaire pour rendre son résultat effectif sans absorber sa responsabilité métier.
    Distinguer application du résultat, maintien de la configuration et réalisation physique ; aucune couche transactionnelle
    générique ni capacité Application systématique.
  - U537 remplace l’exclusion antérieure d’un comportement d’application. Les trois comportements Inventory Planning de U290
    restent historiques et courants tant que leur décomposition précise n’est pas révisée. Aucun ajout automatique identique
    à tous les Plannings.
  notes:
  - Dans FLOW, la planification peut porter l’application du plan retenu en mobilisant les capacités responsables. Elle n’absorbe
    pas leur responsabilité ni l’exécution physique.
  parent_term: MOD007
- id: MOD003
  name: Management
  label_fr: Gestion
  definition: Tenir des états, des engagements ou des obligations dans la durée et gérer leurs évolutions.
  role: Qualifier une responsabilité de gestion, à préciser selon l’objet concerné.
  source_refs:
  - U230
  - U231
  - U232
  - U538
  - U586
  - U806
  review:
    state: partial
    adopted_scope: 'Qualification et application transactionnelle dans le cas Stock Protection. U538 : configuration apportée
      au Planning maintenue à l’extérieur, exemple Stock Protection.'
    proposed_scope: Généralisation à Management et formulation hors de ce cas. Définition générale clarifiée après U586 ;
      les nœuds existants gardent leur nature.
  short_description: Tenir des états, des engagements ou des obligations dans la durée et gérer leurs évolutions.
  editorial_notes:
  - U230 qualifie Stock Protection de gouvernance/management ; U231 précise sa mise à jour transactionnelle.
  - Cette formulation générale est proposée à partir du cas Stock Protection ; elle n’impose pas la même définition à toute
    capacité nommée Management.
  - Le sens d’application transactionnelle est défini par MOD004.
  - 'U538 : la responsabilité de configuration illustrée par Stock Protection reste extérieure au Planning qui la consomme,
    y compris lorsque ce Planning comporte un comportement d’application du plan. Nom canonique de la capacité actuelle :
    Supply Protection, D02.b.'
  - U586 ajoute Policy comme type dédié au cadre de règles applicable. La définition générale de Management est clarifiée
    ; le cas Stock Protection U230/U231 et ses accords restent historiques, sans reclassement automatique de Supply Protection.
    État antérieur conservé dans capability-types-U449.yaml#history_before_U586.
  notes:
  - Gestion tient les états et engagements ; Politique définit le cadre de règles applicable. Le nom d’une capacité ne détermine
    pas son type.
  parent_term: MOD007
- id: MOD004
  name: Application transactionnelle
  definition: Mettre à jour transactionnellement les données, unitairement, en groupe ou en masse, par plusieurs types d’interfaces
    possibles.
  role: Préciser le sens de l’application des résultats dans une capacité de management.
  modalities:
    granularities:
    - Unitairement
    - En groupe
    - En masse
    interfaces:
    - Écrans
    - Batch
    - Flux
    - Streaming
  notes:
  - Ces modalités ne constituent pas des capacités supplémentaires.
  - Ne pas confondre la mise à jour des données, leur utilisation par les capacités consommatrices et un mouvement physique.
  - Aucune technologie, garantie d’atomicité de lot ou interface particulière n’est imposée.
  source_refs:
  - U231
  - U232
  review:
    state: partial
    adopted_scope: Mise à jour transactionnelle et modalités précisées en U231 pour Stock Protection.
    proposed_scope: Reformulation, généralisation et précisions de lecture.
  short_description: Appliquer des changements aux données, seuls ou regroupés, avec les contrôles nécessaires.
  status: retired
  retirement_source_refs:
  - U806
- id: MOD005
  name: Couverture — convention de description
  definition: Qualifier toute affirmation de couverture en indiquant ce qui est couvert, par quoi, dans quel périmètre et
    horizon, et selon quel critère de satisfaction.
  role: Rendre explicites le sens et le degré de réalisation d’une couverture dans la description des objets et capacités.
  notes:
  - Distinguer couverture candidate, affectation enregistrée, promesse confirmée et réalisation constatée ; ces qualifications
    ne constituent pas un cycle universel de statuts.
  - Préciser les quantités, dates, hypothèses et reliquats lorsque le besoin le nécessite ; aucun niveau de lot ou d’exemplaire
    imposé.
  - Les sens métier figurent séparément dans TER022 Couverture d’une demande et TER077 Couverture de stock. Cette convention
    ne crée ni capacité ni relation métier.
  source_refs:
  - U260
  review:
    state: partial
    adopted_scope: Présence du terme couverture dans le glossaire méthodologique demandée par Laurent.
    proposed_scope: Définition, critères et exemples de qualification rédigés par Codex ; aucune adoption détaillée déduite.
  short_description: Préciser ce qui est couvert, par quoi et selon quel critère.
  guide_section: method
- id: MOD006
  name: Capability Behavior
  label_fr: Comportement
  definition: Manière identifiable dont une capacité agit dans une situation donnée. Elle précise ce qui change dans son action
    ou dans le résultat attendu.
  role: Niveau complémentaire de détail sous une capacité ; dernier niveau de sa décomposition descriptive.
  source_refs:
  - U262
  - U263
  - U265
  - U282
  - U283
  - U284
  - U389
  - CMP145
  - U398
  - U399
  - U290
  - U406
  - U409
  - U417
  - U424
  - U435
  - U438
  - U445
  - U499
  - U501
  - U537
  - U538
  - U806
  review:
    state: partial
    adopted_scope: 'Comportement comme niveau complémentaire sous la capacité ; arrêt de la décomposition à ce niveau. U263
      : descriptions factuelles sans qualification marketing. U265 : exigence de justification par une complexité ou un bénéfice
      ciblé. U282 : préférence explicite pour les mécanismes métier plutôt que les opérations, illustrée par Supply Protection.
      U283 retient Mécanisme, Politique, Variante ou bénéfice comme critères différenciants de décomposition. Pour Planning,
      les effets sur les pratiques humaines et les processus distinguent les comportements des fonctions de produits. Ces
      critères ne constituent pas quatre niveaux supplémentaires. U284 confirme la direction U283 et retient Simulation &
      analyse en un seul comportement : les impacts sont intégrés à ce comportement, sans Scenario Impact Analysis autonome
      dans la cible. U389 demande une définition étayée par une liste concrète construite à partir de l’existant et la mémorisation
      de cette règle. U398 : différencier et expliquer les comportements réellement différents d’une capacité selon les capacités
      qui la mobilisent ; interactions nommées pour rendre la logique métier lisible.'
    proposed_scope: Définition générale éditoriale et intitulé anglais de la notion. Les quatre définitions de comportements
      ATP sont adoptées séparément en U263 dans d03-review.yaml. Les formulations détaillées issues de U283 restent à préciser
      ; aucune nouvelle hiérarchie adoptée. La reformulation, les sept formes illustratives et leur analyse transversale U389
      sont éditoriales ; aucune classification exhaustive validée par Laurent n’est présumée.
  concrete_forms:
  - key: policy_strategy
    label: Politique ou stratégie métier
    explanation: Distinguer une logique de choix, de protection ou de contrôle qui change la réponse ou la façon d’agir.
    examples:
    - 'Reservation Policy Decision : Milestone-Based et Risk-Adaptive Reservation Policy (BHV032, BHV035).'
    - 'Return Disposition Decision : Policy-based Disposition et Value Recovery Optimization (BHV048, BHV049).'
    - 'Stocktaking : Periodic Physical Inventory, Cycle Counting, Spot Counting (BHV029–031).'
    boundary: Une valeur de seuil, une fréquence précise ou le choix humain/IA ne suffit pas à créer un comportement.
  - key: process_variant
    label: Variante de processus ou de prise en charge
    explanation: Distinguer un parcours par son résultat attendu, ses obligations, ses acteurs ou ses flux métier, sans détailler
      toutes ses étapes.
    examples:
    - 'Customer Return : Return to Stock, Repair and Refurbishment, Return to Supplier (BHV050–052).'
    - 'Supplier Return : Return for Credit, Return for Replacement, Return for Repair (BHV055–057).'
    boundary: Saisie, validation et clôture ne deviennent pas automatiquement trois comportements sous chaque Order ; les
      parcours peuvent se combiner.
  - key: intervention_mechanism
    label: Mécanisme d’intervention
    explanation: Distinguer comment une capacité produit son effet métier, notamment en préservant ou en révisant un état
      existant.
    examples:
    - 'Supply Assignment : Plan Application, Incremental Supply Assignment, Supply Reassignment (BHV045–047).'
    - 'Supply Protection : Group Supply Protection, Consumption Capping, Safety Stock Policy, Replenishment Regulation (BHV017–020).'
    - 'Stock Redistribution Decision : Inventory Rebalancing et Stock Consolidation (BHV024–025).'
    boundary: Ne pas confondre mécanisme métier et algorithme, API, batch ou liste des opérations CRUD.
  - key: business_scope
    label: Périmètre métier d’intervention ou d’arbitrage
    explanation: Distinguer une portée qui change les contraintes, interdépendances, faits observés ou responsabilités ; ce
      critère vaut aussi pour les décisions.
    examples:
    - 'Inventory Target Decision : Store, Distribution Center et Multi-Echelon Inventory Optimization (BHV026–028).'
    - 'Operations Tracking : Warehouse Visibility, Transportation Visibility, Store Visibility et Process Tracking, intégrés
      comme comportements directs BHV079–082 (U406/U409).'
    boundary: Un comportement par site, équipe ou application n’est pas justifié par le seul changement de périmètre. Le tracking
      est une capacité de connaissance, pas une action au sens strict de fields.nature.
  - key: decision_dimension
    label: Dimension de raisonnement ou d’information prise en compte
    explanation: Distinguer les informations ou contraintes qui changent les possibilités établies par une décision ; les
      dimensions sont combinables.
    examples:
    - 'ATP : engagements existants, stock du réseau, délai de mobilisation opérationnelle et apports futurs (BHV001–004).'
    boundary: Ne pas transformer chaque donnée d’entrée ou étape de calcul en comportement ; Decision garde ses calculs.
  - key: business_effect
    label: Effet sur l’état métier ou l’engagement
    explanation: Distinguer des effets substantiels sur les obligations, l’autorisation, la stabilité ou la continuité du
      traitement.
    examples:
    - 'Fulfillment Commitment : Promise Proposal, Confirmation, Revision (BHV021–023).'
    - 'Order Lifecycle Management : Order Firming, Order Freezing, Order Preparation & Revision, Order Release, Order Hold
      & Resume et Order Termination (BHV036–040, BHV043 ; U424). Order Splitting BHV044 relève d’Order Structuring, déplacée
      dans D04 en U438 ; son parent de capacité est conservé depuis U417.'
    boundary: Le nom d’un statut ou d’un bouton ne suffit pas ; expliquer l’effet métier. Ce critère n’autorise pas à dupliquer
      Lifecycle sous chaque type d’Order.
  - key: planning_practice
    label: Pratique de planification et d’adaptation
    explanation: Distinguer une manière de travailler sur un scénario qui transforme l’analyse, la coordination humaine ou
      les interactions avec l’exécution.
    examples:
    - 'Inventory Planning : Scenario Construction, Simulation & Analysis, Scenario Execution Adaptation (BHV005, BHV006, BHV016).'
    boundary: 'U537 : l’application du plan est un comportement du Planning concerné ; l’ancienne exclusion est remplacée.
      U538 : les configurations qu’il consomme restent portées à l’extérieur. Pas de décomposition automatique de tous les
      Plannings, ni de transfert implicite de l’adaptation opérationnelle de D06.'
  decomposition_rule: Pour définir ou réexaminer un comportement, partir d’exemples du modèle, expliciter sa forme concrète,
    ce qui le distingue des autres comportements de la capacité et son effet métier. Justifier la décomposition par une complexité
    ou un bénéfice ciblé ; ne pas imposer une catégorie exclusive par nature de capacité, une décomposition systématique ou
    un niveau supplémentaire.
  analysis_ref: modeles/backlog/behavior-typology.yaml
  market_comparison:
    comparison_ref: CMP145
    common: BIZBOK décrit Capability Behavior comme une manière d’agir selon les circonstances ; Microsoft illustre plusieurs
      politiques de comptage.
    difference: Les sept formes et le niveau terminal sont des conventions FLOW ; les sources ne prescrivent pas cette typologie
      ni une équivalence de niveaux.
    sources:
    - ELM052
    - ELM234
    consulted_on: '2026-09-18'
  short_description: Manière identifiable dont une capacité agit dans une situation donnée. Elle précise ce qui change dans
    son action ou dans le résultat attendu.
  editorial_notes:
  - U262 retient Comportement et l’arrêt de la décomposition à ce niveau.
  - Un comportement précise une capacité ; il ne devient pas une capacité supplémentaire du catalogue.
  - Plusieurs comportements peuvent se combiner ; ils ne sont pas nécessairement des variantes exclusives ni des étapes successives.
  - L’arrêt concerne la décomposition des capacités. Objets, documents et événements restent des objets du modèle, sans devenir
    des niveaux inférieurs de comportement.
  - Le rapprochement avec Capability Behavior dans BIZBOK est documenté en CMP088. Le choix d’en faire le dernier niveau est
    une convention FLOW.
  - U263 impose des descriptions factuelles, sans niveaux promotionnels tels que Advanced ATP ; les appellations éditeur restent
    dans les correspondances marché.
  - 'U265 : une décomposition en comportements est justifiée par une complexité ou un bénéfice ciblé ; elle n’est pas systématique.
    La justification est portée par fields.decomposition_rationale sur la capacité ; sa rédaction détaillée conserve sa propre
    portée de validation.'
  - 'U282 précise la maille recherchée sur Supply Protection : mécanismes métier de protection, plutôt que liste des opérations
    sur Allocation. Les opérations fonctionnelles restent matière de conception produit ; elles ne constituent pas un nouveau
    niveau inférieur dans le modèle. Les quatre mécanismes BHV017–020 ont été intégrés U290 ; la proposition antérieure reste
    historique.'
  - U283 retient Mécanisme, Politique, Variante ou bénéfice comme critères différenciants de décomposition. Pour Planning,
    les effets sur les pratiques humaines et les processus distinguent les comportements des fonctions de produits. Ces critères
    ne constituent pas quatre niveaux supplémentaires.
  - 'U284 confirme la direction U283 et retient Simulation & analyse en un seul comportement : les impacts sont intégrés à
    ce comportement, sans Scenario Impact Analysis autonome dans la cible.'
  - U389 exige une liste concrète issue de l’existant. Les formes se recouvrent et ne sont ni des sous-niveaux ni une classification
    obligatoire des nœuds.
  - 'Le bénéfice ciblé reste un critère transversal de justification U265/U283 : il peut différencier une manière d’agir,
    mais un bénéfice vague ne remplace pas la description de cette manière d’agir.'
  - U389 a analysé les exemples de visibilité comme propositions distinctes du catalogue de l’époque. Depuis U406/U409, Operations
    Tracking porte Warehouse Visibility, Transportation Visibility, Store Visibility et Process Tracking (BHV079–082). L’analyse
    U389 reste une photographie historique ; leur présence actuelle ne vaut pas publication ni validation globale des détails.
  - 'U398 : la mutualisation peut se lire dans les liens. Décrire le comportement mobilisé et sa différence métier selon le
    contexte ; aucun comportement automatique par appelant et aucun sous-comportement. U399 : règles consignées pour le prochain
    audit et/ou les prochaines améliorations, sans déclencher de nouvelle revue. Convention : modeles/backlog/business-interactions.yaml.'
  - 'U501 : pour Order Backlog Optimization Request, Déclenchement et Activité regroupent visuellement des comportements au
    même niveau terminal. L’angle de lecture est explicite ; il ne crée ni parent intermédiaire, ni séquence obligatoire,
    ni requalification des comportements historiques. Cette décomposition est historique depuis U552 : les modes de sollicitation
    sont des modalités de la gestion de demande, tandis que simulation et autorisation relèvent directement de Order Backlog
    Planning ; aucun sous-comportement.'
  notes: []
- id: MOD007
  name: Capability Nature
  label_fr: Type de capacité
  definition: Qualifier une capacité selon son résultat métier dominant, indépendamment de son nom, de ses comportements et
    de sa réalisation technique.
  role: Fournir une grille de lecture explicite et stable pour les icônes et la présentation des capacités.
  analysis_ref: modeles/backlog/capability-types-U449.yaml
  source_refs:
  - U449
  - CMP169
  - ELM259
  - U500
  - U501
  - U585
  - U586
  - CMP248
  - U618
  - U624
  - U626
  - U767
  review:
    state: partial
    adopted_scope: 'Typage exhaustif, icônes associées, décisions en fin de liste et séparation légère U449. U586 : nouveau
      type de capacité Policy.'
    proposed_scope: Formulation méthodologique, grille détaillée et compléments individuels rédigés par Codex. Définition
      et frontières détaillées du type Policy.
  short_description: Résultat métier dominant qui caractérise une capacité.
  editorial_notes:
  - Les sept valeurs présentes dans FLOW sont action, management, policy, knowledge, orchestration, planning et decision.
    Policy est ajouté par instruction U586.
  - Decision, Planning et Management gardent leurs conventions MOD001–MOD003. Les types peuvent partager des opérations ;
    la responsabilité dominante porte la classification.
  - Les décisions sont présentées après les autres capacités ; cet ordre de lecture ne représente pas un enchaînement.
  - La grille détaillée et les dix compléments proposés sont consignés dans capability-types-U449.yaml ; la nature propre
    de chaque capacité reste portée par son fields.nature.
  - OMG DMN éclaire la distinction décision/processus sans prescrire cette grille de types ni leurs icônes.
  - 'U500/U501 : une capacité qui porte une demande peut préciser Frontoffice (sollicitation externe au Domain), Backoffice
    (sollicitation interne) ou les deux. Ce qualificatif d’origine est distinct de sa nature, du déclencheur et de la provenance
    de l’événement ; aucune valeur n’est inférée du nom ou du parent.'
  - 'Policy : Définir, maintenir et rendre applicables les règles, politiques et configurations métier dont le Domain porte
    la maîtrise, avec leur portée, leur validité et leurs conditions d’usage.'
  - Le type policy qualifie une capacité ; une politique particulière est un contenu qu’elle gouverne. policy_strategy reste
    une forme de comportement, indépendante du type de sa capacité parente.
  - Un même Purpose réunit références et policies U618 ; le type Policy qualifie des capacités distinctes des projections
    et des vues. Purpose, type de capacité et gouvernance des données sont des dimensions distinctes. Aucun comportement par
    paramètre ni nouveau niveau hiérarchique.
  - Un plan peut proposer une révision de politique et faire appliquer sa version autorisée, y compris automatiquement selon
    une délégation ; une hypothèse de simulation ne modifie pas le cadre actif.
  - 'U767 : Evaluation complète les types pour ATP/CTP/PTP, indépendamment de leur mise en œuvre humaine ou automatisée.'
  notes:
  - Le type décrit le résultat dominant de la capacité. Cette grille est une convention FLOW, pas une nouvelle hiérarchie.
    Aucune capacité n’est reclassée par cette présentation.
  values:
    Action: Effectuer une opération métier ou matérialiser une évolution autorisée des données et engagements.
    Gestion: Tenir des états, des engagements ou des obligations dans la durée et gérer leurs évolutions.
    Politique: Définir, maintenir et rendre applicables les règles, politiques et configurations métier dont le Domain porte
      la maîtrise, avec leur portée, leur validité et leurs conditions d’usage.
    Connaissance / visibilité: Établir, actualiser et rendre accessible une connaissance fiable des états, faits et résultats
      attendus.
    Orchestration: Coordonner les prestations, leurs dépendances et leur progression dans un processus.
    Planification: Construire et réviser un plan en mobilisant les décisions nécessaires.
    Décision: Déterminer une réponse métier à partir des faits, règles, objectifs et contraintes applicables, en incluant
      les calculs nécessaires.
    Intégration: Acquérir ou transmettre des informations métier entre domaines ou exécutants, les reconnaître et les rapprocher
      du contexte local pour les rendre utilisables avec leur provenance et leur résultat de prise en compte.
    Registre: Tenir un registre métier durable de faits reconnus, datés et justifiés, en assurant leur traçabilité et leurs
      corrections.
    Évaluation: Type de capacité qui évalue des possibilités, leur faisabilité ou leurs conséquences à partir de faits, règles
      et hypothèses, en explicitant résultats, conditions et incertitudes, sans sélectionner une réponse ni engager sa réalisation.
