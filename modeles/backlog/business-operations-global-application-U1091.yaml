id: BUSINESS-OPERATIONS-GLOBAL-APPLICATION-U1091
date: '2026-10-16'
status: applied_to_backlog
source_refs:
- U1090
- U1091
baseline_audit: business-operations-global-audit-U1090.yaml
decision: Conserver les trois domaines directs et les capacités existantes. Corriger les contrats internes obsolètes ; expliciter
  des liens ciblés et éprouver les passages par les parcours existants. Aucun nouveau maître installé ni moteur unique déduit.
forecast_consumption:
  owner: demand-plan-development
  rule: La capacité construit la prévision résiduelle pour le plan de demande selon une règle autorisée, un horizon, une population
    et les commandes effectivement prises en compte.
  boundaries: Master Planning pilote les calculs ; Availability utilise le plan pour une demande identifiée ; Order Backlog
    décide les priorités et affectations ; Order Management tient les engagements.
  market_comparison: Microsoft documente la réduction des prévisions dans Master planning ; SAP S/4HANA la lie aux stratégies
    de besoins. FLOW place le résultat dans Demand Plan Development pour préserver sa chaîne de responsabilité U1086. Aucun
    algorithme universel n’est retenu.
  microsoft: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/reduction-keys
  sap_s4hana: https://learning.sap.com/courses/exploring-production-planning-in-sap-s-4hana/execute-supply-chain-planning
case_tests:
- path: forecast-to-shortage-arbitration-path
  result: Le retard fournisseur est constaté par Sourcing, porté par Purchase Order, recalculé par Planning, arbitré dans
    le carnet, puis communiqué par Commerce.
- path: pickup-or-direct-shipment-path
  result: Le canal reçoit la demande ; le magasin réalise et date la préparation ; le Core conserve la promesse et réévalue
    les exceptions.
- path: return-credit-refund-path
  result: La variante magasin rend visible la caisse ; Return Order, remboursement et fait de stock conservent leurs responsabilités.
- path: seasonal-order-backlog-path
  result: La proposition Wholesale précède la commande ; les choix d’approvisionnement ne deviennent engagement qu’après autorisation.
- path: fashion-launch-path
  result: Commerce publie assortiment, catalogue et prix avant ingestion des références utiles par le Core.
- path: planning-actuals-feedback-path
  result: Une correction de stock fournit une entrée au calcul interne ; Plan Ingestion reste réservé aux contributions externes.
data_authority_matrix:
- data: Produit et variante
  enterprise_authority: Design & Development pour la définition approuvée ; maître applicatif et chaîne de corrections à vérifier
  core_authority: Merchandise References tient la référence locale Supply
  open_contract: Identité, variante, version, date d’effet, retrait et correction.
- data: Partenaire, personne et accord
  enterprise_authority: À établir par type de partie ; Sourcing et Commerce gouvernent leurs décisions métier, sans maître
    entreprise implicite
  core_authority: Partner & Agreement References tient la vue locale
  open_contract: Identifiants, rôles, droits, confidentialité, validité et corrections.
- data: Magasin et lieu de stockage
  enterprise_authority: Commerce gère le réseau commercial ; maître de lieu entreprise à confirmer
  core_authority: Inventory Management tient les positions et faits reconnus par lieu
  open_contract: Lieu, statut, canal, horaires, fermeture, source des mouvements et correction.
- data: Prix de vente
  enterprise_authority: Commerce détermine le résultat applicable et ses règles
  core_authority: Order Management conserve le prix engagé ; Operational References reçoit le résultat utile
  open_contract: Contexte, date métier, version, correction et priorité des conditions.
- data: Stock physique et propriété
  enterprise_authority: Les opérations magasin et Logistics émettent des faits ; aucune tenue d’entreprise unique n’est inférée
  core_authority: Inventory Management porte la source de vérité locale Supply
  open_contract: Fait, ordre, date, propriétaire, détenteur, doublon, écart et correction.
- data: Plan de demande et plan d’approvisionnement
  enterprise_authority: Planning & Optimization produit les plans Core ; contribution externe possible avec source identifiée
  core_authority: Planning & Optimization tient les versions calculées ; Plan Ingestion qualifie les contributions externes
  open_contract: Horizon, granularité, statut, règle de consommation, version et retrait.
open_points:
- Les systèmes maîtres, identifiants et contrats réels par donnée restent à établir avec Beaumanoir ; la matrice décrit les
  responsabilités cible connues et les preuves manquantes.
- Les règles chiffrées de consommation, périodes, populations et priorités ne sont pas définies ; le modèle attribue leur
  application, pas leurs valeurs.
- Les parcours sont fictifs et ne démontrent ni réalisation installée ni couverture de toutes les variantes. Les autres capacités
  Commerce et Sourcing peuvent être reliées au fil des usages avérés.
- Les textes source originaux des hotspots et les publications historiques sont conservés ; la lecture courante est corrigée
  seulement où sa portée a changé.
