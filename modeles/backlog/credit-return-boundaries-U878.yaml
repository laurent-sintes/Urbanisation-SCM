status: applied
user_fact: Le contrôle de gestion émet les règles et classements de crédit des clients.
credit_proposal:
  reference: Partner & Agreement References reçoit les informations externes ; Party / Role porte le profil client, Agreement
    les conditions réellement convenues. Une règle générale de crédit n’est pas un contrat et ne doit pas être présentée comme
    telle.
  authority: Conserver autorité du contrôle de gestion, versions, périmètres et dates de validité. Policies ne devient pas
    propriétaire des règles financières externes.
  application: 'Order Management applique ou consomme le résultat du contrôle pour suspendre/reprendre selon les autorisations
    ; Sentry réagit aux évolutions. Un classement ne suffit pas à calculer un dépassement : encours et exposition doivent
    provenir d’une source financière appropriée, sans inventer leur disponibilité.'
return_proposal:
  principle: Étendre Return Order aux variantes de résolution client, combinables avec les cinq comportements de devenir physique
    existants.
  candidates:
  - Credit Resolution
  - Refund Resolution
  - Replacement Resolution
  boundary: Return Order porte la résolution et son suivi ; Billing produit/corrige l’avoir, un service de paiement exécute
    le remboursement, Sales Order porte la commande de remplacement. Un avoir et un remboursement peuvent se cumuler.
  remaining_change: Extension de Payment aux remboursements clients appliquée U879.
