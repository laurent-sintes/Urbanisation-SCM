id: SUPPLY-PLAN-SCOPE-CORRECTION-U1013
date: '2026-10-13'
source_refs:
- U1012
- U1013
status: applied_to_backlog
adopted_scope: U1013 corrige l’exclusion des achats du Supply Plan. Les formulations détaillées d’alignement restent des propositions
  éditoriales ; aucun accord sur une interface installée.
boundaries:
- MAP conserve la planification et le carnet d’achat.
- FLOW pilote la satisfaction du carnet et peut proposer des apports via CTP.
- Le plan, la proposition identifiée, la commande affermie et la réception restent distincts ; ne pas compter plusieurs fois
  le même apport.
market_comparison:
  Microsoft:
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/master-plans
    consulted_on: '2026-10-13'
    common: Le planning propose notamment des achats et distingue leur affermissement.
    difference: Master Planning Microsoft couvre aussi la génération de plans d’approvisionnement ; le Master Plan FLOW reste
      centré sur le carnet.
  SAP:
    url: https://learning.sap.com/courses/business-processes-in-sap-s-4hana-sourcing-procurement/running-materials-requirements-planning
    consulted_on: '2026-10-13'
    common: MRP produit des propositions d’achat ou de production, avec dates et quantités.
    difference: Les éléments natifs SAP ne sont pas assimilés aux objets MAP ; MRP ne définit pas tout le pilotage collectif
      FLOW.
master_plan_perimeter:
  status: adopted_and_applied
  source_ref: U1012
  recommendation: Une capacité commune de pilotage, applicable à plusieurs périmètres de carnet ; choisir les frontières selon
    les ressources partageables et les responsabilités d’arbitrage, pas automatiquement selon la marque ou l’enseigne.
  shared_resources: Des périmètres concurrents pour les mêmes ressources exigent un arbitrage commun ou des droits explicitement
    alloués ; aucun double comptage.
  market_limits: Microsoft permet plusieurs plans ; SAP BOP segmente les demandes et stratégies ; Oracle peut traiter le carnet
    entier ou des organisations sélectionnées. Ces fonctions ne prouvent pas une segmentation installée Beaumanoir.
  agreement_source_ref: U1014
