scope: 'Corrections métier de l’audit des flux : cinq priorités puis chaînes manquantes ; modèle et glossaire alignés. Le
  détail cartographique est complété dans le même lot, sans modifier les publications historiques.'
audit: flow-audit-U1112.yaml
finding_resolution:
  FL-U1112-01: 'Corrigé : 12 relations de promesse/plan/politiques/exécution requalifiées, producteurs/destinataires actualisés
    ; doublon U835 retiré ; D01/D06.b et glossaire TER112 alignés.'
  FL-U1112-05: 'Corrigé : qualification→demande, commandes→demande, demande→supply, plans→réconciliation→Master Planning,
    plans→Visibility, affectations/engagements→libération→application→Sales Order documentés.'
  FL-U1112-06: 'Corrigé : 3 dépendances d’application déplacées de Master Planning à Plan Application ; décisions autorisées,
    changements des familles et résultats d’application explicités séparément.'
  FL-U1112-07: 'Corrigé : Supply Plan Visibility fournit des ressources projetées et Demand Plan Visibility fournit la demande
    ; qualification de la prévision source explicitée dans Demand Plan Development.'
  FL-U1112-08: 'Corrigé : composition d’Inventory Visibility depuis ledgers, familles de commandes, Supply Plan Visibility,
    réservation, affectations appliquées et Operations Tracking, avec dates, corrections et non-double-compte.'
  FL-U1112-02:
    status: addressed
    note: Les apports reconnus de Tracking/Stocktaking/décision de propriété vers leurs registres, des registres vers la visibilité
      et du rapprochement vers les commandes sont des partages explicites ; les dépendances restent distinctes, sans conversion
      automatique des relates-to.
  FL-U1112-03:
    status: corrected
    evidence:
    - process-ledger
    - TER375
    - TER376
    result: Registre explicite sous Process Supervision ; producteurs internes et captation externe vers registre, puis registre
      vers visibilité et mining, puis résultats vers reporting. Les dépendances existantes du mining sont requalifiées ; la
      lacune SAP S/4HANA reste explicite.
  FL-U1112-04:
    status: addressed
    note: Contrats explicites producteurs → destinataires et responsabilités locales appliqués dans le lot U1113.
  FL-U1112-09:
    status: addressed
    note: Contrats explicites producteurs → destinataires et responsabilités locales appliqués dans le lot U1113.
