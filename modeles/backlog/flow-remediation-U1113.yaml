    note: Contrats explicites producteurs → destinataires et responsabilités locales appliqués dans le lot U1113.
  FL-U1112-13:
    status: addressed_with_explicit_gaps
    note: Product definitions de Design & Development et credit profiles de Finance reliés à la réception locale ; maîtres
      commerciaux et autres références laissés non qualifiés.
  FL-U1112-16:
    status: addressed_with_explicit_gaps
    note: Prix de vente limités à Sales Order ; settlement conservé comme synthèse conditionnelle, familles et nouvelles demandes
      à qualifier par résultat autorisé.
  FL-U1112-17:
    status: addressed
    note: La carte signale les relations hors cadrage et donne accès à Enterprise Architecture.
  FL-U1112-18:
    status: addressed
    note: Le détail du flux rend le sens, la finalité, les conditions, les effets et le périmètre.
  FL-U1112-19:
    status: addressed
    note: Le détail distingue niveaux et extrémités canoniques des synthèses et relations détaillées ; les apports au niveau
      domaine Warehousing sont limités aux prestations sans périmètre plus précis.
implementation_notes:
- 'Les sources marché de FL01/FL05 sont réutilisées depuis flow-audit-U1112.yaml : Microsoft Order promising et SAP S/4HANA
  aATP appuient la séparation données sources / proposition / confirmation ; elles ne dictent pas la taxonomie FLOW. Les fiches
  de préparation des plans et Master Planning possèdent déjà les comparaisons Dynamics/SAP pertinentes ; aucune nouvelle capacité
  créée.'
- REL-U835-D03-D04 est retirée comme doublon de REL-U673-PROMISING-ORDER après correction ; l’identité historique U673 est
  conservée. Les autres relations utiles relates-to restent des dépendances et ne deviennent pas des flux.
- Les champs glossary TER098/099/100/111/131/133/151/361/363/365/366/374 et TER199 ont été relus pour les responsabilités
  concernées ; TER112.notes seul conservait une ambiguïté sur le matching collectif. Les scopes répétés dans market_inspiration.flow_approach
  de D01 et D06.b sont corrigés dans le même lot.
- 'Aucune mise à jour de REL-U1101-forecast-to-demand-plan, des deux liens Plan Ingestion vers Visibility, ni des portées
  de Plan Ingestion ou Planning Data Provision : sous-lot frontière porté par l’autre agent.'
- La diffusion des plans produits est directe vers leurs consommateurs et leur Visibility ; le ledger garde les faits reconnus,
  les familles de commandes leurs engagements, et les producteurs de réservation/affectation leurs responsabilités distinctes.
- TER375–TER376 et process-ledger absents de tous les YAML courants examinés ; TER377–TER379 non utilisés par cette spec.
- 'Aucun comportement ajouté : responsabilité ledger complète sans décomposition artificielle.'
- Le lien D04 → process-ledger est un contrat de partage au sous-domaine des commandes, sans attribuer le Case à la hiérarchie
  des Orders ni présumer un bus logiciel.
- Les dépendances consumer → provider restent relates-to ; les nouveaux flux utilisent shares-data producteur → consommateur,
  sans conversion automatique.
- Microsoft Dynamics View workflow history et SAP Signavio Data Transformation ont été effectivement consultés le 2026-10-16.
  Business Event Logging SAP S4 ouvert à nouveau sans contenu ; la lacune reste déclarée.
- Fichiers canoniques non modifiés ; le parent applique et capture le lot final de façon séquentielle.
- Les cinq capacités sont conservées et rapprochées des responsabilités métier ; aucune fusion ou disparition de savoir-faire
  n’est déduite.
- Les constats produit et faits comptables sont ceux des deux registres stock ; Planning Data Provision est limité aux positions
  stock documentées U1109.
- Sources commerciales de référence, maîtres du conditionnement/fournitures, composants financiers effectifs et producteurs
  des autres entrées du Master Plan restent explicitement à qualifier.
- 'Le raccordement commercial settlement reste une synthèse à consommateurs conditionnels : aucune famille d’Order ni nouvelle
  demande en biens n’est déduite sans cas établi.'
- Les appuis Microsoft et SAP déjà consultés sont conservés ; la nouvelle BA réemploie les appuis limités sur réception autorisée,
  sans revendiquer une taxonomie d’éditeur.
- Les relations de dépendance ne sont pas converties en flèches de données ; seules les fournitures explicitement décrites
  sont requalifiées.
- Les flux aux niveaux système et détail expriment des vues de responsabilité, pas un nombre d’interfaces à additionner.
- HS-026 conserve son périmètre et ses réserves ; son ancien ancrage de contexte retiré est remplacé par Supply Chain Orchestration,
  sans attribution détaillée inventée.
agreement_scope:
  approved: Sens, rattachements et responsabilités explicitement couverts par le Go et les précisions utilisateur ; captures
    sur les paramètres précis.
  proposed: Compléments de rédaction, contrats détaillés, illustrations, noms de nouveaux périmètres de mise en œuvre et correspondances
    marché rédigés après le Go.
