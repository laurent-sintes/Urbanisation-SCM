- id: D02.c
  current_name: Reservation
  current_nature: action
  proposed_name: Reservation
  proposed_nature: action
  proposed_definition: Établir et tenir un engagement de quantité pour un besoin identifié, dont les usages concurrents doivent
    tenir compte.
  recommendation: Conserver ; Matching affecte, Reservation rend un engagement opposable aux usages concurrents. Expliciter
    création, révision, libération, consommation et expiration conditionnelles sans nouveaux Behaviors CRUD ni paramètres
