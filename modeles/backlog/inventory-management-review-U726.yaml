- id: D01.h
  current_name: Consigned Inventory Management
  current_nature: management
  proposed_name: Inventory Ownership Transfer
  proposed_nature: action
  proposed_definition: Appliquer un changement de propriétaire autorisé aux quantités concernées, selon l’accord et le fait
    déclencheur, en conservant les preuves et les liens aux actes associés.
  recommendation: 'Remplacer le regroupement par régime par une responsabilité ciblée. Préserver BHV063 Consumption-Based
    Ownership Transfer et BHV064 Aging-Based Ownership Transfer. Redistribution de BHV065 Consignment Exit : choix du devenir
    dans Matching, demandes dans Orders, orchestration dans Fulfilment, faits et états dans Ledger/Visibility. Ne pas déplacer
    ce Behavior entier sous une capacité sans en revoir la portée.'
  market_sources:
  - ELM739
  - ELM740
  market_relation: Recouvrement partiel ; nom et typage FLOW recommandés, non imposés par les éditeurs.
  existing_behaviors:
