  proposed_definition: Établir une connaissance fiable du stock, de ses évolutions et des engagements de quantité, en distinguant
    position physique, propriété, détention et conditions d’usage.
  recommendation: Conserver Inventory Management comme sous-domaine et y réintégrer Order Promising selon U730 ; deux catégories
