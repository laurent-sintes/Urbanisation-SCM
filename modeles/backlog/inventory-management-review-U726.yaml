    verdict: 'Le catalogue actuel ne décrit pas les profondeurs demandées : ATP mélange contraintes et horizons, CTP couvre
      des familles d’adaptation avec une variante trop large, PTP n’a aucun comportement.'
    target_behaviors:
    - capability: D03.i
      name: On-Hand ATP
      depth: 1
      definition: Évaluer les quantités et dates promettables à partir du stock courant admissible, après engagements et contraintes
        applicables, sans ajouter de réception future.
      sources:
      - ELM727
      - ELM772
      migration: BHV002 peut conserver son identité en reformulant le périmètre ; le réseau reste possible au même niveau.
    - capability: D03.i
      name: Projected ATP
      depth: 2
      definition: Étendre l’évaluation aux réceptions attendues admissibles et aux besoins/engagements sur l’horizon, sans
        créer de nouvel apport.
      sources:
      - ELM727
      - ELM761
      - ELM762
      migration: Conserver BHV004 et préciser le calcul temporel, les hypothèses et la non-duplication entre plans et Orders.
    - capability: D03.j
      name: Supply-Based CTP
      depth: 1
      definition: Évaluer la possibilité d’obtenir ou de constituer un apport à partir des sources, matières/composants et
        délais connus, sans contrôle détaillé des capacités finies.
      sources:
      - ELM746
      - ELM762
      migration: Recentrer BHV075 ; distinguer disponibilité matière établie et délai fournisseur seulement estimé. Ne crée
        ni achat ni affectation.
    - capability: D03.j
      name: Capacity-Constrained CTP
      depth: 2
      definition: Étendre la faisabilité aux ressources et capacités finies nécessaires, à leurs calendriers, charges et dépendances
        pertinentes.
      sources:
      - ELM746
      - ELM762
      - ELM777
      migration: Recentrer BHV076 ; la capacité peut déjà exister. Fabrication/assemblage multiniveau et prestations nécessaires
        se décrivent ici sans un comportement par ressource. L’extension aux contraintes logistiques est une adaptation FLOW,
        les exemples primaires étant surtout manufacturiers.
    - capability: D03.k
      name: Fulfillment Cost Evaluation
      depth: 1
      definition: Chiffrer les coûts pertinents de chaque option de promesse sur une base explicite et comparable, en distinguant
        ce qui est connu, estimé ou absent.
      sources:
      - ELM762
      - ELM763
      migration: Nouveau comportement proposé ; coûts composants/ressources multiniveaux et effets de fractionnement/consolidation
        sont inclus quand pertinents. Distinguer coût complet et coût additionnel, sans double compte.
    - capability: D03.k
      name: Contextual Economic Impact Evaluation
      depth: 2
      definition: Compléter le chiffrage par les avantages et inconvénients économiques des options dans le contexte local
        de la demande, avec écarts, hypothèses et incertitudes, sans choisir.
      sources:
      - ELM762
      - ELM763
      migration: 'U762 corrige Margin Evaluation : le résultat est un micro dossier économique comparatif. Marge, revenus,
        coûts évités ou autres impacts ne sont inclus que s’ils sont pertinents et étayés ; pas un objectif de rentabilité
        globale. Nom anglais proposé.'
    shared_requirements:
    - Protections, réservations, engagements concurrents et droits de propriété restent appliqués à chaque profondeur ; stock
      courant ne signifie pas stock brut.
    - Périmètre local/réseau, produits substituables autorisés et sources externes sont des périmètres de recherche, pas automatiquement
      des profondeurs ni du CTP.
    - Calendriers, heures limites, délais opérationnels et transport sont nécessaires aux dates ; vérifier des délais diffère
      d’un contrôle des capacités finies.
    - Provenance, fraîcheur, hypothèses, confiance, contraintes non évaluées et conditions restantes accompagnent tout résultat
      ; profond ne signifie pas certain.
    - Complétude, ship-together, fractionnements et regroupements sont des contraintes/scénarios évalués, pas des capacités
      ou comportements par option.
    - Les évaluations ne réservent ni n’affectent, ne créent pas les Orders et ne confirment pas la promesse. Promise Selection
      Decision choisit, les responsables matérialisent.
    coverage_matrix:
    - case: Stock courant net des engagements
      covered_by: On-Hand ATP + exigences communes
    - case: Réceptions futures, retard, concurrence temporelle, prévisions/Orders sans double compte
      covered_by: Projected ATP
    - case: Autre site, fournisseur avec stock existant, produit substituable autorisé, livraison directe
      covered_by: Périmètre et hypothèses ATP ; CTP seulement si une faisabilité d’apport/capacité reste à établir
    - case: Nouvel apport achat ou approvisionnement, assemblage à partir de composants
      covered_by: Supply-Based CTP
    - case: Nomenclature multiniveau, capacités de fabrication, ressources finies et calendrier
      covered_by: Capacity-Constrained CTP ; profondeur et données réellement vérifiées explicites
    - case: Capacité logistique finie nécessaire malgré du stock produit existant
      covered_by: Capacity-Constrained CTP en complément ATP ; adaptation FLOW via capacités communiquées, sans absorption
        du WMS
    - case: Simple délai standard sans contrôle ou disponibilité supposée infinie
      covered_by: Hypothèse/repli explicitement déclaré ; pas une preuve de faisabilité ni comportement CTP détaillé
    - case: Coût matière, achat, transferts amont/aval, composants/ressources, prestations, fractionnement, consolidation
      covered_by: Fulfillment Cost Evaluation
    - case: Revenu, remise applicable, substitution tarifée et marge
      covered_by: Contextual Economic Impact Evaluation, lorsque ces données éclairent effectivement les options locales ;
        marge non obligatoire.
    - case: Incertitude ou hypothèses économiques
      covered_by: Hypothèses/scénarios des évaluations ; aucune prévision de risque inventée
    - case: Comparaison de commandes, BOP, arbitrage de priorités
      covered_by: Évaluations utilisables collectivement ; choix chez Promise Selection Decision et affectation chez Matching
    - case: Simulation, temps réel/batch, API, cache, recours à un APS
      covered_by: Modes ou moyens de réalisation ; pas de profondeur de comportement
    existing_migration:
      BHV001: Intégrer ses exigences d’engagements/protections au périmètre commun ATP ; retrait du comportement seulement
        lors de l’application validée.
      BHV002: On-Hand ATP proposé ; conserver le périmètre réseau en exigences communes.
      BHV003: Intégrer délais/calendriers dans les exigences communes ATP et leurs liens aux services ; retrait du comportement
        seulement lors de l’application validée.
      BHV004: Projected ATP proposé.
      BHV075: Supply-Based CTP proposé.
      BHV076: Capacity-Constrained CTP proposé ; supprimer l’équivalence erronée entre alternative quelconque et CTP.
      D03.k: Deux nouveaux comportements proposés ; conserver le nom PTP et l’absence de sélection.
    parent_changes:
    - Formaliser Evaluation pour les trois capacités.
    - Corriger CTP pour inclure la vérification de capacités existantes, pas uniquement supplémentaires ; aucune création
      automatique de supply.
    - Aligner finality PTP sur l’évaluation sans sélection ; dossier économique local et contextuel des avantages/inconvénients
      réaffirmé U762.
    - Renommer Promise Selection Decision selon U760 et conserver le choix distinct des évaluations.
    exhaustiveness_limit: Les familles documentées sont couvertes par ce découpage et ses contraintes communes ; pas d’exhaustivité
      universelle certifiable. Les noms des comportements sont des propositions FLOW, les niveaux CTP et PTP ne sont pas une
      nomenclature native uniforme des éditeurs.
    validation_boundary: Deux profondeurs par capacité validées et appliquées U767 ; les noms détaillés et formulations sont
      des mises en œuvre FLOW étayées, pas une taxonomie universelle.
    PTP_clarification_U762:
      status: applied_U767
      source_refs:
      - U760
      - U762
      - ELM762
      - ELM763
      result: Micro dossier économique local et contextuel des options, sans gagnant.
      contents:
      - Options et périmètre de comparaison
      - Coûts connus/estimés et postes manquants
      - Écarts, gains, surcoûts et coûts évités par rapport à une référence explicite
      - Revenus ou marge seulement lorsqu’ils sont pertinents et documentés
      - Conditions, hypothèses, incertitudes et avantages/inconvénients économiques
      excluded:
      - Sélection de l’option
      - Score économique assimilé à un choix automatique
      - Optimisation globale des affectations du Matching
      - Décision tarifaire ou modification du prix confirmé
      example: Pour une demande, comparer expédition immédiate fractionnée, attente permettant consolidation et service express
        ; expliciter coûts et économies de chaque option, conditions de délai, éventuels impacts contractuels chiffrables.
        Les impacts inconnus restent inconnus ; Promise Selection Decision arbitre.
