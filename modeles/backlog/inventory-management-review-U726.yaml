    recommendation:
      name: Order Promising
      level: Subdomain
      definition: Évaluer les quantités, dates, conditions et conséquences économiques des possibilités de satisfaction d’une
        demande, puis sélectionner une proposition de promesse utilisable par les processus concernés, sans confirmer l’engagement
        ni affecter les ressources.
      name_reason: Order Promising est documenté par Microsoft et Oracle ; Order précise l’objet de la promesse, pas son moment
        dans le processus ni un rattachement à Order Management. Promising seul est plus court mais laisse l’objet implicite.
      capabilities:
      - D03.i
