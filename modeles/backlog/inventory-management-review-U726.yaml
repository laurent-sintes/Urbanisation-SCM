      - D03.k
      - D03.l
      proposed_categories:
      - name: Promise Evaluation
        members:
        - D03.i
        - D03.j
        - D03.k
      - name: Promise Selection
        members:
        - D03.l
      nature_boundary: ATP/CTP/PTP évaluent ; Promise Selection Decision sélectionne une proposition. Les types et comportements
        détaillés restent dans la proposition evaluation_depth_U761.
    cooperation:
      Inventory Management: Fournit stock, disponibilités et engagements de quantité ; conserve ledger, ownership et réservations.
        Supply Visibility reste amont ; son rapprochement avec Inventory Visibility reste un arbitrage distinct.
      Plan Visibility: Fournit Supply Plan et Demand Plan sans absorber l’APS externe.
      Demand & Supply Matching: Mobilise les évaluations pour éprouver les possibilités ; garde master plan, arbitrages collectifs
        et affectations.
      Fulfilment Orchestration: Réévalue les solutions locales utiles en cherchant à préserver la promesse et les équilibres
        du Matching.
      Order Management: Demande une évaluation ou une proposition lors de la prise ou de la révision d’une commande ; les
        Orders portent l’engagement confirmé.
    limits:
    - Usage à plusieurs étapes, pas séquence universelle ni appel automatique à chaque changement d’état.
    - Une capacité peut être sollicitée seule ; PTP ne choisit pas et CTP ne déclenche pas les achats.
    - Une proposition recalculée ne remplace pas automatiquement une promesse confirmée.
    - Aucun nouveau sous-domaine créé ni identifiant retiré réutilisé dans cette proposition ; conserver les identifiants
      des capacités lors d’une éventuelle application.
    market_comparison: Oracle décrit explicitement un appel de l’orchestration à GOP ; Microsoft expose l’ATP via Inventory
