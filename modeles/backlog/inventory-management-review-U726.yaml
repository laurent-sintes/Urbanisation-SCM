  ownership_decision_U754:
    status: applied_U756
    source_refs:
    - U754
    - CMP297
    - ELM739
    - ELM764
    - ELM740
    category: Inventory Foundation
    capabilities:
    - id: D01.f
      name: Inventory Tracking
      type: integration
      change: Recevoir les faits des stocks et des processus, dont les résultats transmis par Operations Tracking ; ne pas
        créer un Ownership Tracking supplémentaire.
    - id: D01.h
      name: Inventory Ownership Transfer Decision
      type: decision
      definition: Déterminer si les faits des processus, les échéances et les conditions applicables de l’accord conduisent
        à reconnaître ou à demander un transfert de propriété, pour quelles quantités, entre quelles parties et à quelle date,
        avec ou sans consignation.
      behaviors:
      - id: BHV063
        proposed_name: Consumption-Based Ownership Transfer
        scope: Déterminer les conséquences d’une consommation ou vente prévue par accord.
      - id: BHV064
        proposed_name: Aging-Based Ownership Transfer
        scope: Déterminer les conséquences d’une échéance contractuelle ; ne dépend pas uniquement d’un événement de clôture
          d’Order.
      decomposition_rationale: 'Deux mécanismes déclencheurs distincts : fait de consommation/vente et échéance contractuelle.
        Adapter les définitions de l’application vers la détermination ; aucune règle universelle.'
      behavior_review: 'U755 : ces deux comportements restent des cas à préserver ; leur couverture doit être réexaminée pour
        le périmètre élargi aux jalons des achats, ventes et biens en transit.'
    - name: Inventory Ownership Ledger
      type: ledger
      id_assignment: À créer lors de l’application ; D01.h est conservé pour la responsabilité de détermination issue du transfert.
      definition: Tenir le registre des changements de propriétaire reconnus, avec quantités, parties, date d’effet, accord,
        fait déclencheur, acte éventuel et preuve.
      behaviors: []
    - id: D01.g
      name: Inventory Ledger
      type: ledger
      change: Tenir mouvements et états de stock ; référencer les écritures de propriété et leurs effets sans registre de
        propriété concurrent.
    flow:
    - Les Orders portent demandes et engagements ; Agreement porte les conditions applicables.
    - Operations Tracking et/ou Inventory Tracking fournissent les faits reconnus ; les échéances convenues peuvent également
      déclencher un examen.
    - La décision applique les conditions et détermine les conséquences métier.
    - Quand un acte distinct est requis, les Orders et Fulfilment portent son exécution locale ou distante et le résultat
      revient par Tracking.
    - Le registre inscrit seulement le transfert reconnu ; une proposition ne suffit pas. Un transfert déjà établi par une
      autorité externe est intégré sans seconde décision ni exécution.
    - Inventory Visibility compose les positions par propriétaire à partir des registres.
    example: '100 vêtements fournisseur présents ; une vente de 20 satisfait la clause de transfert convenue. Le registre
      conserve la preuve : 20 deviennent propres, 80 restent fournisseur. Ce changement seul ne modifie pas les 100 pièces
      physiques ; leur expédition éventuelle est un autre effet.'
    market_limit: Microsoft documente préparation et comptabilisation du journal ; pas un moteur autonome écoutant les processus.
      Le traitement automatique du journal est explicitement non pris en charge dans la procédure consultée.
    supersedes: U752 proposait D01.h comme Ledger ; U754 conserve D01.h comme Decision et propose un Ledger distinct. Pas
      de validation globale implicite de l’audit.
    implementation:
    - Introduire le type Ledger dans méthode, schémas, validation et Atlas.
    - Réécrire D01.h et ses deux comportements ; créer le registre ; préciser les liens, faits déclencheurs, résultats et
      conditions.
    - Actualiser D01.f, D01.g, D01.c et les interactions avec Agreement, Orders et Fulfilment ; conserver exécution et notification
      des résultats.
    - Actualiser les comparaisons avec deux sources primaires pertinentes par fiche, gardes de livraison et captures du lot
      final validé.
    scope_extension_U755:
      status: proposal_refined
      source_refs:
      - U755
      - CMP298
      - ELM765
      - ELM766
      scope: Changements de propriété du stock dans les achats et ventes avec ou sans consignation, y compris biens en transit
        ; faits issus des processus et faits douaniers pertinents selon les conditions applicables.
      decision: Croiser les faits reçus, les échéances et les conditions applicables de l’accord pour déterminer les conséquences
        sur la propriété ; ne pas faire porter l’interprétation contractuelle au Tracking.
      ledger: Conserver ancien/nouveau propriétaire, quantité, date d’effet, accord et condition appliquée, fait déclencheur,
        justificatif et acte éventuel. Conserver les corrections traçables.
      boundaries:
      - Un fait douanier est à qualifier ; aucun transfert automatique déduit de son seul statut.
      - Distinguer propriétaire, détenteur, disponibilité physique et statut douanier.
      - Les mécanismes comptables Microsoft ne sont pas une règle juridique universelle.
      behavior_review: Consommation et échéance sont des cas conservés mais ne couvrent pas tous les processus. Réexaminer
        les comportements proposés pour couvrir les jalons contractuels des achats/ventes et du transit, sans comportement
        par événement ni second catalogue.
      example: Une réception peut laisser la propriété au fournisseur dans un accord et matérialiser la condition d’acquisition
        dans un autre ; les faits du parcours ne portent pas seuls leur conséquence sur la propriété.
