      route: '#/flows?version=2026-10-16.4&node=system-business-operations&scope=system-business-operations'
      instructions: Dans Flux, ouvrir Business Operations (node et scope identiques au système), activer Afficher les flux
        et Partage de données. Flux principaux montre quatre flèches contenant les 27 relations. Tous les flux montre les
        groupes détaillés au Standard.
      detail: Cliquer une flèche affiche chaque relation publiée avec ses extrémités de capacité, son sens, ses conditions
        et son contenu.
  confirmed_presentation_finding:
    id: U1117-ATLAS-01
    priority: P2
    status: nouveau
    title: Le renvoi « Voir les échanges dans Enterprise Architecture » ne révèle pas les échanges externes internes à Business
      Operations
    evidence:
    - path: app/src/components/FlowMapPanel.tsx
      line: 847
      value: onOpenScope('')
    - path: app/src/App.tsx
      line: 526
      value: 'openMapLevel : node=id, scope=id||''@root'', view flows, mapFocus='''', relation='''', section='''''
    - path: app/src/useAtlasLocation.ts
      line: 23
      value: const next = { ...latestRoute.current, ...changes }
    - path: app/src/components/FlowMapPanel.tsx
      line: 239
      value: Clé publication/périmètre ; exchangeModes.get(key)||main et flowTypeChoices.get(key)||FLOW_TYPES
    - path: app/src/flowMapPresentation.ts
      line: 27
      value: projectRelation rejette source===target ; la frontière principale EA reste au système.
    effect: Depuis Commerce, Procurement ou SCO, l’action promet de voir les échanges hors champ mais arrive, pour une première
      visite EA, sur 0 des 27 relations étudiées. La limite interne des vues de domaine est légitime ; c’est le choix de destination
      et de présentation qui ne répond pas à la promesse du bouton.
    recommendation: Proposer le plus proche périmètre commun qui peut montrer les échanges (ici Business Operations), ou une
      action d’affichage externe qui choisit une profondeur et les types nécessaires. Conserver une action EA distincte si
      utile ; signaler les filtres empêchant la visibilité sans inventer de relation.
  next_contracts_to_qualify:
  - Demande de disponibilité ou proposition avant création de commande.
  - Émission des instructions commerciales de révision ou annulation.
  - Initiation d’un retour à servir, distinct d’un retour physique immédiat de caisse.
  - Passage des propositions Supply vers une validation Procurement lorsque ce parcours est attendu.
  qualification_rule: Ces quatre sujets ne sont pas déclarés couverts par les 27 liens ; leurs producteurs, consommateurs
    et conditions restent à préciser avant toute nouvelle flèche. Ils ne constituent pas quatre relations manquantes démontrées.
  canonical_mutations: false
