request:
  reading_order: Proposer un ordre plus logique ; Master Plan placé en dernier est jugé étrange.
  boundary_links: Vérifier l’impression de liens Commerce et Procurement vers Supply non tous représentés.
current_direct_child_order:
- business-references
- subdomain-policies
- D01
- D03
- D04
- subdomain-process-management
- D06
- subdomain-service-orders
- domain-plan
proposed_reading_order:
- position: 1
  id: business-references
  name: Operational References
  reading_role: Connaître les produits, parties, accords, réseaux et services utilisables dans le domaine.
- position: 2
  id: subdomain-policies
  name: Supply Policy Management
  reading_role: Établir les règles, protections, limites et autorisations applicables.
- position: 3
  id: D01
  name: Inventory Management
  reading_role: Connaître les ressources physiques et leurs engagements de quantité.
- position: 4
  id: D04
  name: Order Management
  reading_role: Tenir les demandes, propositions, engagements et évolutions des commandes.
- position: 5
  id: domain-plan
  name: Master Plan
  reading_role: Équilibrer la demande et les ressources ; arbitrer besoins, couverture et affectations collectives.
- position: 6
  id: D03
  name: Availability
  reading_role: Déterminer ce qui peut être promis pour une demande identifiée, avec les ressources et le plan commun.
- position: 7
  id: subdomain-process-management
  name: Process Management
  reading_role: Conduire les parcours, le travail humain, la supervision et l’analyse des demandes.
- position: 8
  id: D06
  name: Fulfilment Orchestration
  reading_role: Composer, coordonner et adapter les prestations nécessaires.
- position: 9
  id: subdomain-service-orders
  name: Service Management
  reading_role: Tenir les demandes et engagements des prestations sollicitées.
rationale:
  axis: Fondations ; ressources et demandes ; équilibre collectif et promesse individuelle ; conduite du parcours et réalisation
    des prestations.
  master_plan_position: 'Après Inventory Management et Order Management, avant Availability : le lecteur connaît les ressources
    et demandes avant de lire leurs arbitrages collectifs, puis la promesse propre à une demande.'
  preserved_cooperations: Order Management tient aussi les engagements après la promesse et Process Management conduit tout
    le parcours ; l’ordre proposé ne change pas leurs coopérations transverses.
  benefit: Rendre visibles les liens ressources/demandes/plan/promesse et retirer Master Plan de sa position finale sans redécouper
    les responsabilités.
  tradeoff: Un ordre linéaire simplifie la lecture d’un réseau de responsabilités ; les renvois entre sous-domaines restent
    nécessaires.
  boundary: Ordre de lecture proposé, sans séquence obligatoire, changement de parent, renommage ni renumérotation d’une publication
    existante.
market_comparison:
  source_refs:
  - U1094
  - U1117
  evidence:
  - vendor: Microsoft
    product: Dynamics 365 Supply Chain Management
    title: Master planning home page
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/master-planning-home-page
    consulted_on: '2026-10-16'
    locator: Core questions ; three main planning processes
    paraphrase: Le calcul des besoins nets rapproche les commandes actuelles, les ressources et besoins pour construire les
      propositions de plan.
    common_point: Rapprocher ressources et demande pour déterminer la couverture.
    difference: La page décrit un processus et un module Dynamics ; elle ne prescrit aucun ordre d’une carte de capacités
      FLOW.
  - vendor: SAP
    product: SAP S/4HANA Production Planning
    title: Understanding MRP in SAP S/4HANA
    url: https://learning.sap.com/courses/exploring-production-planning-in-sap-s-4hana/understanding-mrp-in-sap-s-4hana
    consulted_on: '2026-10-16'
    locator: Deterministic Planning ; Net Requirements Calculation ; Results of MRP
    paraphrase: Les commandes et prévisions servent de points de départ au besoin ; le calcul confronte stocks et apports
      pour proposer la couverture. Les propositions restent distinctes de leur conversion en commandes.
    common_point: Distinguer demandes, ressources, décisions de plan et engagements d’exécution.
    difference: MRP comprend nomenclatures et planification de fabrication qui ne définissent pas le périmètre complet du
      Master Plan FLOW.
  choice: Le rapprochement demandes/ressources est étayé ; la position de lecture entre Order Management et Availability est
    un choix de cohérence FLOW, sans standard d’ordre ni consensus éditeur allégué.
