  business_coverage_matrix:
  - topic: Demandes de vente à satisfaire
    status: present
    relation_ids:
    - REL-U1091-digital-demand-to-sales-order
    - REL-U1091-wholesale-demand-to-sales-order
    - REL-U1115-store-demand-to-sales-order
    scope_evidence:
    - 'cap-digital-sales-journey-management.fields.scope : soumettre la demande à Sales Order.'
    - 'cap-in-store-sales-journey-management.fields.scope : demande à livrer ou retirer ultérieurement → Sales Order.'
    - 'cap-wholesale-sales-engagement.fields.scope : recueillir la demande ; Sales Order tient identité et engagements.'
    limits: Une vente encaissée et emportée ne crée pas une commande à satisfaire.
  - topic: Révisions et annulations commerciales
    status: partly_explicit_contract_to_qualify_not_confirmed_missing_relation
    relation_ids:
    - REL-U1113-sales-order-cap-digital-sales-journey-management
    - REL-U1113-sales-order-cap-wholesale-sales-engagement
    - REL-U1115-sales-order-to-store-journey
    observation: Le retour Supply vers les canaux inclut explicitement révision/annulation autorisée et versions. Les liens
      entrants nomment une demande commerciale, sans préciser une demande de révision/annulation émise par le canal.
    proof_limit: Les fiches des trois capacités commerciales ne promettent pas explicitement de produire ces instructions.
      Cela justifie de préciser le contrat métier si cet usage est attendu, pas de déclarer une nouvelle relation manquante
      par seule symétrie.
  - topic: Disponibilité ou proposition avant commande
    status: not_documented_as_cross_boundary_interaction
    relation_ids:
    - REL-U673-PROMISING-ORDER
    - REL-U1113-sales-order-cap-digital-sales-journey-management
    - REL-U1113-sales-order-cap-wholesale-sales-engagement
    - REL-U1115-sales-order-to-store-journey
    observation: Availability fournit déjà la proposition à Order Management ; Sales Order restitue ensuite les engagements
      et le suivi aux canaux. Aucun lien direct ni demande préalable Commerce→Availability n’est décrit dans les scopes des
      capacités commerciales relus.
    proof_limit: Présenter un prix ou une offre admissible ne constitue pas une disponibilité. Une interrogation avant création
      de commande ou un affichage de stock en canal reste un besoin à expliciter, sans déduire un appel technique ou un inverse
      obligatoire.
  - topic: Statut, engagements et réalisé de vente
    status: present
    relation_ids:
    - REL-U1113-sales-order-cap-digital-sales-journey-management
    - REL-U1113-sales-order-cap-wholesale-sales-engagement
    - REL-U1115-sales-order-to-store-journey
    - REL-EXECUTION-FACTS-D04.i
    observation: Sales Order restitue acceptation/refus, engagements, versions, révisions, avancement et reste à servir. Son
      réalisé provient de Service Reconciliation ; Commerce n’a pas à refaire cette reconnaissance.
  - topic: Préparation et remise magasin
    status: present
    relation_ids:
    - REL-U1113-store-preparation-mandate
    - REL-U1091-store-preparation-results-to-fulfilment
    - REL-U1113-tracking-reconciliation
    - REL-EXECUTION-FACTS-D04.i
    observation: Mandat autorisé Fulfilment Coordination→magasin ; résultat physique du magasin→Operations Tracking, puis
      rapprochement et tenue de la commande. Le parcours ne requiert pas un deuxième cycle de commande dans Commerce.
  - topic: Stock magasin et effets physiques de caisse
    status: present
    relation_ids:
    - REL-U1091-store-stock-facts-to-inventory
    - REL-U1115-checkout-stock-facts
    - REL-U1113-inventory-tracking-ledger
    observation: Réception, comptage et mouvements locaux alimentent Inventory Tracking ; les remises et retours constatés
      en caisse ont leur propre apport. Les contrats exigent une identité commune si le même fait arrive par deux voies.
  - topic: Constitution des achats
    status: present
    relation_ids:
    - REL-U1115-requisition-to-purchase-order
    - REL-U1115-selected-offer-to-purchase-order
    - REL-U1115-agreement-to-purchase-order
    - REL-U1115-purchase-order-to-requisition
    observation: Demande approuvée, conditions retenues et accord d’achat alimentent Purchase Order selon la voie autorisée
      ; un résultat d’acceptation/état revient à la demande d’achat. Consultation et accord cadre ne sont pas imposés à tout
      achat.
  - topic: Changements d’achat et écarts fournisseur
    status: present
    relation_ids:
    - REL-U1091-supplier-response-to-purchase-order
    - REL-U1091-purchasing-decision-to-purchase-order
    - REL-U1115-purchase-order-to-purchasing-case
    - REL-U1115-purchase-order-to-supplier-follow-up
    observation: Supplier Commitment Follow-up transmet les confirmations annoncées et consomme les engagements applicables.
      Purchasing Case Coordination soumet le changement autorisé et reçoit acceptation/refus/état appliqué. Une annonce fournisseur
      ne modifie pas seule l’engagement.
  - topic: Réception et performance fournisseur
    status: present_via_documented_producer
    relation_ids:
    - REL-U1115-reconciled-service-to-supplier-follow-up
    - REL-U1115-reconciled-service-to-supplier-performance
    - REL-U1115-purchase-order-to-supplier-performance
    - REL-EXECUTION-FACTS-D04.j
    - REL-U1113-tracking-reconciliation
    observation: Procurement reçoit les résultats de réception ou inspection rapprochés de Service Reconciliation et les engagements
      de Purchase Order. Logistics produit les faits physiques ; un lien direct supplémentaire Procurement→réception ne découle
      pas du besoin de suivi.
    limits: Producteur et rattachement de chaque mesure qualité doivent être documentés ; cette réserve U1115 reste ouverte.
  - topic: Retours et échanges
    status: present_for_checkout_physical_returns_and_recognized_loyalty_facts_other_initiation_not_qualified
    relation_ids:
    - REL-U1115-checkout-stock-facts
    - REL-U1115-return-order-facts-to-loyalty
    - REL-EXECUTION-FACTS-D04.l
    - REL-EXECUTION-FACTS-D04.m
    observation: La caisse traite les retours/échanges immédiats et fournit les faits physiques à Inventory Tracking. Return
      Order restitue les faits reconnus utiles à la fidélité. Les familles Return Order et Supplier Return Order ont leur
      réalisé alimenté par Service Reconciliation.
    proof_limit: Aucune fiche Commerce/Procurement ne désigne précisément le producteur d’une demande de retour à servir,
      d’une autorisation de retour ou d’une instruction de retour fournisseur dans ces canaux. Il faut qualifier ce parcours
      avant de choisir ses extrémités ; ne pas traiter tout retour de caisse comme Return Order.
  - topic: Prix et contrôle de crédit
    status: present
    relation_ids:
    - REL-U1115-sales-order-pricing-context
    - REL-U996-contextual-prices
    - REL-U1115-credit-result-to-sales-order
    observation: Sales Order fournit le contexte de prix et reçoit le résultat de Sales Price Determination ; Wholesale Sales
      Engagement relaie le résultat de crédit autorisé par Finance. Le profil de crédit de référence emprunte un autre flux
      Finance→Reference Ingestion et ne remplace pas le résultat transactionnel.
    limits: Les prix d’achat ne viennent pas de Sales Price Determination.
  - topic: Accords d’achat et consommation
    status: present
    relation_ids:
    - REL-U1115-agreement-to-purchase-order
    - REL-U1115-purchase-order-agreement-consumption
    - REL-U858-REFERENCE-012
    observation: Purchase Agreement Lifecycle Management fournit les conditions et prix autorisés ; Purchase Order restitue
      la consommation de l’accord. La consultation de la référence locale Agreement est une dépendance d’information distincte.
    limits: La source de vérité d’entreprise et l’alimentation de chaque référence restent à qualifier ; ne pas conclure que
      la référence locale est la seule voie du contrat transactionnel.
  - topic: Hypothèses commerciales et d’approvisionnement pour la prévision
    status: present_via_external_forecast_responsibility
    relation_ids:
    - REL-U1115-assortment-forecast
    - REL-U1115-sourcing-forecast-assumptions
    - REL-U1115-supplier-offers-forecast
    - REL-U1101-forecast-to-demand-plan
    - REL-U1113-ingested-forecast-qualification
    observation: Assortment, stratégie de sourcing et offres fournisseur contribuent à Demand & Supply Forecasting dans Design
      & Development. Le Forecast Plan revient vers Plan Ingestion puis qualification. Ces coopérations indirectes ne doivent
      pas être recréées comme trois apports indépendants au Master Plan.
  - topic: Ristournes et primes
    status: present_via_finance
    relation_ids:
    - REL-U996-eligible-supply-facts
    - REL-U996-commercial-settlement-results
    observation: Les dispositifs commerciaux et d’achat sont portés par Commerce/Procurement, mais le calcul/règlement des
      droits relève de Commercial Settlement Management dans Finance. Supply fournit ses faits éligibles et reçoit les conséquences
      autorisées. Un lien direct Commerce→Order Management pour le montant du droit ferait perdre cette autorité.
    limits: Une prime en biens ne crée pas seule une demande physique ; producteur et famille à qualifier selon l’accord.
  - topic: Propositions de plans Supply et demande d’achat approuvée
    status: authorization_boundary_present_exact_procurement_handoff_not_mandated
    relation_ids:
    - REL-U1113-master-plan-to-application
    - REL-U1113-application-to-D04-j
    - REL-U1115-requisition-to-purchase-order
    scope_evidence:
    - 'cap-purchase-requisition-handling.fields.scope : Les plans et propositions de FLOW ne valent pas demande approuvée.'
    - 'D02.e.fields.scope : autorisation humaine ou fondée sur des règles selon le changement.'
    observation: La voie Plan Application→Purchase Order est limitée aux choix autorisés. Le modèle n’impose pas le passage
      de chaque proposition par Purchase Requisition Handling.
    proof_limit: Le besoin de qualifier ou faire approuver par Procurement certaines propositions Supply peut être précisé
      ; aucune étape universelle ni nouvelle flèche n’est démontrée par la distinction proposition/demande approuvée seule.
  conclusion: Les 27 frontières documentées sont présentes dans le modèle. Le problème de visibilité des vues par domaine
    est confirmé par l’agent UI. La confrontation des fiches courantes ne prouve aucun lien métier supplémentaire manquant
    avec des extrémités déterminées. Les interactions préalables de disponibilité, révisions émises par les canaux et initiation
    des retours restent à cadrer si elles sont attendues ; elles ne sont pas déclarées absentes par déduction de symétrie.
  confirmed_missing_business_links: []
  representation:
    Business_Operations_main: 27 relations conservées, regroupées en quatre flèches entre domaines.
    Business_Operations_all_standard: 27 relations conservées, 25 groupes de détail.
    Enterprise_Architecture_main: '0 de ces 27 relations : les trois domaines sont internes à Business Operations.'
    Enterprise_Architecture_all_standard: 27 relations, avec détail suffisant pour séparer les domaines et leurs extrémités.
    individual_domain_scopes: '0 lien frontière affiché : une extrémité se trouve hors du monde interne. Le bandeau compte
      15 relations hors périmètre Commerce, 12 Procurement ou 27 Supply.'
    limits: Affichage des flux et Partage de données doivent être actifs ; une caméra ou un filtre mémorisé peut restreindre
      la vue.
  navigation:
    button:
      full_text: Voir les échanges dans Enterprise Architecture
      short_text: Voir l’ensemble
      aria_label: Voir les échanges dans Enterprise Architecture
