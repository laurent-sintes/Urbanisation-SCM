      publication: conservée par fusion de route dans useAtlasLocation
      selection: node vide → sélection de la racine Enterprise Architecture ; mapFocus effacé ; pas de voisinage focus
      mode: Le mode est chargé depuis exchangeModes pour la clé 2026-10-16.4/@root, ou main par défaut. Il n’est pas transporté
        depuis la carte SCO.
      types: Types de flux chargés depuis flowTypeChoices pour la clé EA, ou les deux types par défaut. Partage de données
        n’est pas forcé par le bouton.
      camera: Caméra EA mémorisée et redimensionnée si disponible ; sinon Standard. La caméra du domaine n’est pas transportée.
      other_filters: La route conserve publication, application, composant et filtres de points chauds ; le calque des flèches
        est celui mémorisé pour EA ou visible par défaut.
