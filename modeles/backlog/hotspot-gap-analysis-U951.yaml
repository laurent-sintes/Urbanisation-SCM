id: HOTSPOT-GAP-ANALYSIS-U951
source_refs:
- U951
- U952
- U953
- U954
status: pilot_applied
scope: Dimension facultative d’analyse des différences de réalisation et de gestion d’un métier commun entre SI historiques,
  pour éclairer la convergence vers Core System FLOW.
application_status: Contrat facultatif et pilote HS-008 appliqués au backlog à la demande U953, cadrage confirmé U954. Aucun
  accord global sur les autres hotspots, aucune publication.
recommendation:
  field: gap_analysis
  cardinality: Zéro ou plusieurs écarts documentés dans une fiche Hotspot.
  orthogonal_to:
  - kind (scope / integration)
  - criticité
  - qualification du problème
  - avancement du cadrage
  reasons:
  - Conserver les ancrages métier et les types existants.
  - Distinguer les constats par SI de la question d’unification.
  - Réutiliser les options du hotspot plutôt que créer un catalogue de solutions concurrent.
  - Comparer deux réalisations sur les mêmes identifiants métier, sans dupliquer les arbres par SI.
  limits:
  - Tous les hotspots ne proviennent pas d’un écart entre SI.
  - Un écart peut être légitime et n’impose ni harmonisation ni développement.
  - L’existence d’une capacité métier ne prouve pas sa prise en charge logicielle.
proposed_record:
  id: Identité persistante à attribuer lors de la création ; aucun identifiant réel réservé dans cette proposition.
  subject_node_id: 'Identifiant canonique du périmètre métier commun comparé : Business Area, capacité ou comportement ; la
    maille est lue depuis le nœud.'
  contexts:
  - beaumanoir-historique
  - boardriders
  observations_by_context:
    context_id: Référence à un contexte As Is du registre applicability.yaml.
    assessment_refs: Références aux évaluations d’applicabilité existantes lorsqu’elles sont documentées.
    business_need: Préciser le périmètre et les variantes du besoin commun dans ce contexte ; distinguer applicabilité métier
      et prise en charge par le SI.
    system_coverage:
    - covered
    - partly_covered
    - not_covered
    - not_assessed
    - not_applicable
    handling: Décrire la prise en charge observée, logicielle, manuelle ou mixte ; aucune réalisation par défaut.
    business_rules: Règles comparables avec leurs conditions, résultats et exceptions ; aucune règle supposée.
    source_refs: Preuves de chaque observation, avec périmètre et date lorsque connus.
    evidence_state:
    - to_investigate
    - hypothesis
    - documented
    limits: Réserves et inconnues propres à cette observation.
    evidence_kind: Déclaration utilisateur, document source ou analyse ; ne pas confondre enregistrement de preuve et réalisation
      installée confirmée.
  comparison: Comparer, pour le même périmètre métier, les moyens de réalisation et les règles de gestion ; décrire les effets
    utiles de chaque différence, sans classement implicite de maturité.
  convergence_question: Pour cette responsabilité commune, quelle réalisation commune Core System FLOW peut-il assurer et
    quelles variantes de gestion faut-il préserver ? Sans assimilation automatique à toute Enterprise Architecture.
  business_effects: Conséquences observées ou attendues, explicitement distinguées.
  resolution_option_ids: Liens aux options existantes du hotspot, avec conditions et compromis déjà portés par ces options.
  nature_definitions:
    system_support_gap: Une prise en charge par le SI est absente ou partielle dans un contexte, pour une responsabilité métier
      commune et un périmètre documenté.
    realization_difference: La même responsabilité métier est réalisée par des moyens ou des enchaînements différents, même
      lorsque les deux contextes la prennent en charge.
    business_rule_divergence: Les conditions, décisions, résultats ou exceptions de gestion diffèrent pour une même responsabilité
      métier.
  natures:
  - system_support_gap
  - realization_difference
  - business_rule_divergence
  title: Libellé court de la différence à présenter dans la fiche narrative.
rules:
- Ne pas dupliquer la hiérarchie métier par SI ; rattacher les observations de chaque contexte au même sujet canonique.
- Les trois natures d’écart peuvent se combiner ; une différence de moyens ne prouve ni manque de couverture ni divergence
  de règle.
- Absence de documentation ou d’évaluation ne prouve jamais une absence de couverture.
- Non couvert par le SI ne signifie pas que le métier ne sait pas réaliser ce travail.
- Ne pas conclure sur les enfants d’une Business Area à partir de son seul état ; qualifier chaque sujet utile.
- Ne pas traiter toute différence de paramètre comme une incompatibilité ; expliciter la condition métier et son effet.
- 'Ne pas déduire une impossibilité d’unification : règles communes, variantes justifiées et réalisations distinctes restent
  des options à instruire.'
- Aucune absence ou divergence réelle entre SI n’est constatée par U951 ou U952 sur un sujet précis.
- Sarenza reste non évalué ; les identifiants existants permettent une extension future sans nouvelle étude implicite.
- Une solution crédible peut résoudre le cadrage sans prouver la disparition de l’écart dans les SI installés.
alignment:
  model: 'Catalogue Hotspot inspecté : périmètre/intégration, localisation, problème, options et résolution conservés.'
  business_glossary: TER017 précise le sens SAP dans ce dossier ; TER205 décrit le carnet de commandes. TER018, TER193, TER194
    et TER195 contrôlés, sans changement de périmètre.
  methodological_glossary: MOD044 complété et MOD045 créé ; MOD005 Couverture conservé, distinct d’une preuve de fonction
    installée.
  applicability: Quatre contextes existants ; aucune évaluation enregistrée. Réutiliser leurs identifiants et préserver ce
    registre comme autorité des évaluations.
  as_is: current.json identifie les deux SI partiellement documentés et Sarenza non évalué. Aucun enrichissement de réalisation
    installée.
  target: Core System FLOW repris des mots de Laurent. Aucun nœud portant ce nom retrouvé par inspection ; son identification
    et son périmètre restent à préciser.
