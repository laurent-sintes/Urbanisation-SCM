    servent de grille de comparaison.
  comparison_axis: 'Comparer la réalisation de la même responsabilité métier : moyens, prise en charge par le SI et règles
    de gestion.'
  boundary: Une différence de réalisation ne crée pas une capacité métier différente par défaut. Une fonction absente du SI
    ne prouve pas une capacité absente de l’entité.
  assessment_limit: La grille commune ne constitue pas une évaluation automatique de chaque élément dans chaque contexte.
