current_model:
  D06.d: Coordonne activations et dépendances ; choix des groupes et du moment de libération non explicite.
  D06.f: Adapte face aux aléas ; ne suffit pas à décrire une rétention anticipée en fonctionnement normal.
  D07.a: Détermine les prestations nécessaires, dont préparation/packing communs ; distinct du moment de leur libération.
proposal:
  name: Service Order Release Decision
  nature: decision
  parent: D06
  category:
    id: coordinate-adapt
    display_name: Coordonner et adapter
    order: 20
  definition: Déterminer quels ordres de prestation retenir ou libérer ensemble, et à quel moment, pour organiser leur traitement
    et favoriser les regroupements utiles tout en respectant les engagements.
  result: Ensemble d’ordres et quantités à libérer, moment ou condition de libération, éléments maintenus en attente et justification.
  behaviors:
  - name: Batch Release
    definition: Regrouper les ordres éligibles en lots de libération selon les fenêtres et la charge communiquée par l’exécutant.
  - name: Consolidated Release
    definition: Retenir les ordres ou quantités compatibles jusqu’à une complétude ou un regroupement utile pour leur traitement
      commun, notamment pour une commande ou un client B2B.
  decomposition_rationale: 'Deux bénéfices et mécanismes distincts : organiser la réception de charge et éviter la fragmentation
    du traitement d’un ensemble client. Fenêtres, volumes et délais restent des paramètres de règles.'
  example: Une commande B2B de 300 pièces arrive en trois ensembles éligibles. Retenir les deux premiers jusqu’à la disponibilité
    prévue du troisième, dans la limite de l’engagement ; libérer ensemble avec une exigence de packing commun. Une seule
    palette reste conditionnée par la compatibilité et la capacité réelle.
boundaries:
- Process Orchestration matérialise attente et libération puis suit la prise en charge ; l’envoi seul n’est pas une décision.
- Service Order Management conserve les ordres et leurs engagements. Un lot de libération ne fusionne pas les commandes ni
  les identités.
- Order Management porte les exigences de livraison complète ; Fulfilment optimise dans leur respect.
- Matching conserve l’affectation des ressources ; aucun arbitrage de supply caché dans la rétention.
- Les informations sur ordres à venir et charge sont des entrées datées ; aucune certitude d’arrivée inventée.
- Le WMS organise ses vagues et opérations internes. Regroupement de messages, expédition et palette ne sont pas équivalents.
- Si les ordres sont transmis en avance, distinguer information de prévision et autorisation de lancement ; aucune architecture
  de transmission imposée.
- Process Adaptation Decision traite un aléa qui remet le plan en cause ; la décision de libération peut être réévaluée sans
  recréer une seconde promesse.
market_position:
  common: Release to warehouse, consolidation d’expédition et rétention économique attestées.
  difference: Capacité métier et frontière FLOW proposées ; les sources éditeurs mélangent parfois orchestration et opérations
    WMS.
  naming: Service Order Release Decision proposé, sans consensus de nom revendiqué.
  tradeoff: Bénéfice de regroupement à comparer à l’attente, aux délais de préparation et aux capacités ; tout transmettre
    en une fois n’est pas toujours meilleur.
