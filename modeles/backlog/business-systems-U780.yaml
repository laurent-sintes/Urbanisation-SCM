decisions:
- Commerce est remplacé dans la proposition par Sales et Sourcing and Procurement ; aucun nœud Commerce canonique à retirer.
- Sales Order et Purchase Order conservent leurs parents et descriptions.
- Les systèmes de contexte restent sans décomposition ; l’absence de détail est intentionnelle.
- Les sources d’ingestion restent à identifier à terme ; aucun référentiel externe, propriétaire, flux ou système applicatif
  fictif créé.
market_limits:
- Aucun équivalent exact du niveau Business System établi dans ces documents.
- Comparaisons de périmètres produit et processus, pas consensus de taxonomie.
- La couverture douanière de Logistics Execution reste partiellement étayée par les deux appuis généraux ; aucune certification
  annoncée.
- Enterprise Management & Control dépasse les appuis Finance ; regroupement FLOW, pas équivalence complète.
