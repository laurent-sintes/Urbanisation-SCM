id: principle-sponsor-language-U1162
status: applied
date: '2026-10-23'
source_refs:
- U1162
intent: Rendre compréhensibles pour un sponsor la responsabilité du SCM sur ses données de décision et l’intérêt d’arbitrages
  coordonnés entre commandes et ressources.
qualification: Formulations, raisons et illustrations proposées après la correction U1162 ; aucune adoption globale des champs
  rédigés ni réalisation installée déduite. Les chiffres illustratifs ne sont pas des gains Beaumanoir observés.
preserved: Énoncés normatifs, cibles, identités et responsabilités inchangés ; neuf entrées de lecture et six bonnes pratiques
  conservées.
glossary_check: Operational References (TER123), les unités produit et les accords, Supply Assignment (D03.o / TER017), les
  engagements et les effets distincts restent cohérents avec le modèle et le glossaire. Les définitions, contextes métier
  et aides courtes n’ont pas changé de sens ; aucune modification supplémentaire du glossaire nécessaire.
market_basis: Appuis Microsoft Dynamics et SAP déjà consultés dans les deux principes, observations et limites conservées.
  La tenue des données et la comparaison des options sont explicitées sans nouvelle équivalence produit, supériorité sur les
  ERP ou optimum garanti. L’exemple de 300 € / 220 € reprend le cas fictif du dossier de pilotage SCM et de la fiche du domaine.
