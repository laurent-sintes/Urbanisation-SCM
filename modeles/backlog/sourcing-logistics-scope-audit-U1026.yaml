findings:
- id: SP1026-01
  type: observation
  finding: Les quatre sous-domaines d’achat distinguent déjà fournisseur durable, choix pour un besoin, accord et achat opérationnel
    ; regroupement conservable.
- id: SP1026-02
  type: scope_gap
  finding: Strategic Sourcing décrit surtout les consultations ; la stratégie de sourcing n’est pas explicite.
  recommendation: La rendre visible en Business Area avec lacunes de comparaison signalées ; sinon préférer Sourcing Management
    au périmètre inchangé.
- id: SP1026-03
  type: boundary
  finding: Le plan et le carnet d’achat restent sous MAP ; les propositions de Master Plan FLOW ne deviennent pas un plan
    d’achat concurrent.
- id: LG1026-01
  type: scope_gap
  finding: Les formalités douanières sont incluses dans Logistics mais sans domaine propre.
  recommendation: Customs Management proposé pour porter dossier et procédure ; son périmètre opérationnel reste distinct
    de la conformité d’entreprise.
- id: LG1026-02
  type: mixed_scope
  finding: Value-Added & Returns Operations associe deux responsabilités différentes.
  recommendation: 'Deux sous-domaines : Value-Added Operations et Returns Operations ; pas deux domaines supplémentaires par
    défaut.'
- id: LG1026-03
  type: visibility_gap
  finding: Le pilotage local des moyens et du travail est mentionné mais peu identifiable dans Warehousing.
  recommendation: Warehouse Operations Control avec ressources et travail local.
- id: LG1026-04
  type: boundary
  finding: Transport Plan Decision FLOW et planification locale peuvent se recouvrir si leur mandat n’est pas qualifié.
  recommendation: Conserver la frontière de mandat déjà décrite et éviter deux calculs imposés pour une même décision.
- id: LG1026-05
  type: not_a_domain_by_default
  finding: Cross-docking et reverse logistics mobilisent plusieurs responsabilités ; un parcours transversal ne devient pas
    automatiquement un domaine.
- id: LG1026-06
  type: conditional_future_domain
  finding: Les prestations textiles pourraient justifier un domaine Value-Added Logistics Services si leur responsabilité
    autonome dépasse les opérations d’entrepôt.
  recommendation: Ne pas créer ce quatrième domaine sans qualification de ce mandat ; les documents EWM consultés les placent
    dans les processus d’entrepôt.
- id: LG1026-07
  type: market_attribution_error
  finding: La comparaison Microsoft du système Logistics reprend des numéros de sections de la Feature Scope Description SAP
    dans ses points communs. Le document Microsoft cité ne porte pas ces sections.
  recommendation: 'Corriger cette attribution lors de l’application du lot : décrire séparément l’autonomie de réalisation
    Microsoft et le périmètre fonctionnel SAP ; conserver les preuves anciennes.'
proposed_sourcing:
  name: Sourcing and Procurement
  kind: domain
  definition: Choisir et qualifier les sources d’achat, tenir les accords et conduire les achats opérationnels de biens et
    prestations.
  status: proposed
  market_support_ids:
  - MS-PROC
  - SAP-PROC
  market_relationship: partial_overlap
  term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
  retains_current_id: domain-sourcing-procurement
  proposed_modeling_depth: business_areas
  subdomains:
  - name: Supplier Management
    kind: area
    definition: Qualifier les fournisseurs et conduire leur suivi durable.
    status: proposed
    market_support_ids:
    - MS-SUP
    - SAP-SUP
    market_relationship: partial_overlap
    term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
    business_areas:
    - name: Supplier Qualification
      kind: business_area
      definition: Déterminer l’admissibilité des fournisseurs pour les catégories et périmètres d’achat.
      status: proposed
      market_support_ids:
      - MS-SUP
      - SAP-SUP
      market_relationship: partial_overlap
      term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
      boundary: Qualification durable, pas sélection d’une offre particulière.
    - name: Supplier Performance Management
      kind: business_area
      definition: Évaluer la performance fournisseur et suivre les suites d’amélioration.
      status: proposed
      market_support_ids:
      - MS-PROC
      - SAP-EVAL
      market_relationship: partial_overlap
      term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
      boundary: Consommer les faits d’achat et qualité ; ne pas conduire toutes les relances de commande.
    retains_current_id: subdomain-supplier-management
  - name: Strategic Sourcing
    kind: area
    definition: Définir les orientations de sourcing puis consulter et sélectionner les sources pour les besoins.
    status: proposed
    market_support_ids:
    - MS-RFQ
    - SAP-RFQ
    market_relationship: partial_overlap
    term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
    business_areas:
    - name: Sourcing Strategy Management
      kind: business_area
      definition: Définir les orientations par catégorie d’achat selon dépenses, objectifs et risques.
      status: proposed
      market_support_ids:
      - MS-PROC
      - SAP-PROC
      - SAP-CATEGORY
      market_relationship: partial_overlap
      term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
      boundary: Stratégie d’achat, pas planning de commandes ou carnet MAP.
      market_gaps:
      - family: microsoft_dynamics
        reason: Les politiques et analyses de dépenses sont documentées ; le mandat complet de stratégie par catégorie n’est
          pas établi à cette maille.
        investigated_urls:
        - https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/procurement-sourcing-overview
      - family: sap_s4hana
        reason: Le tableau stratégique consulté appartient à Ariba Category Management, pas à S/4HANA ; aucun équivalent complet
          établi.
        investigated_urls:
        - https://learning.sap.com/courses/sap-s-4hana-sourcing-procurement-innovations/understanding-the-capabilities-of-the-procure-to-pay-solution_d9d06458-9eec-4938-9678-d7c6659e2f1e
        - https://learning.sap.com/courses/managing-a-category-profile/introducing-the-category-management-dashboard
    - name: Sourcing Event Management
      kind: business_area
      definition: Préparer et conduire les consultations de fournisseurs.
      status: proposed
      market_support_ids:
      - MS-RFQ
      - SAP-RFQ
      market_relationship: partial_overlap
      term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
      boundary: Recueillir des offres comparables avant attribution.
    - name: Source Selection
      kind: business_area
      definition: Évaluer les offres, négocier leurs conditions proposées et choisir la source pour le besoin.
      status: proposed
      market_support_ids:
      - MS-RFQ
      - SAP-RFQ
      market_relationship: partial_overlap
      term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
      boundary: Formalisation des accords sous Purchase Contract Management ; pas achat implicitement engagé.
    retains_current_id: subdomain-strategic-sourcing
    scope_change_proposed: Rendre la stratégie explicite ; sinon le nom Sourcing Management serait plus fidèle au périmètre
      actuel limité aux consultations.
  - name: Purchase Contract Management
    kind: area
    definition: Formaliser et maintenir les accords et dispositifs commerciaux d’achat.
    status: proposed
    market_support_ids:
    - MS-AGR
    - SAP-AGR
    market_relationship: partial_overlap
    term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
    business_areas:
    - name: Purchase Agreement Management
      kind: business_area
      definition: Tenir les conditions d’achat, durées, engagements et consommation des accords.
      status: proposed
      market_support_ids:
      - MS-AGR
      - SAP-AGR
      market_relationship: partial_overlap
      term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
      boundary: Accord cadre et prix d’achat distincts du cycle d’une commande.
    - name: Supplier Rebate & Incentive Management
      kind: business_area
      definition: Définir les ristournes et primes commerciales convenues avec les fournisseurs.
      status: proposed
      market_support_ids:
      - MS-REBATE
      - SAP-REBATE
      market_relationship: partial_overlap
      term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
      boundary: Calcul des droits et règlement sous Commercial Settlement Management, pas chez Logistics.
    retains_current_id: subdomain-purchase-contract-management
  - name: Operational Procurement
    kind: area
    definition: Qualifier les demandes d’achat et conduire les achats autorisés avec leurs suites fournisseur.
    status: proposed
    market_support_ids:
    - MS-PROC
    - SAP-COLLAB
    market_relationship: partial_overlap
    term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
    business_areas:
    - name: Purchase Requisition Management
      kind: business_area
      definition: Recueillir les besoins d’achat et réunir leurs validations.
      status: proposed
      market_support_ids:
      - MS-PROC
      - SAP-REQ
      market_relationship: partial_overlap
      term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
      boundary: Les plans et propositions de FLOW ne valent pas demande approuvée.
    - name: Purchasing Execution Coordination
      kind: business_area
      definition: Conduire les actions d’achat autorisées et les échanges nécessaires à leur exécution.
      status: proposed
      market_support_ids:
      - MS-PROC
      - SAP-COLLAB
      market_relationship: partial_overlap
      term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
      boundary: Purchase Order conserve identité, engagements et transitions dans FLOW ; aucun cycle concurrent.
    - name: Supplier Delivery Follow-up
      kind: business_area
      definition: Traiter confirmations, échéances, relances et écarts fournisseur.
      status: proposed
      market_support_ids:
      - MS-PROC
      - SAP-COLLAB
      market_relationship: partial_overlap
      term_choice: Libellé de responsabilité FLOW proposé ; les sources n’imposent pas une nomenclature commune à cette maille.
      boundary: La réalisation du transport et de la réception reste sous Logistics ; MAP garde le carnet d’achat.
    retains_current_id: subdomain-operational-procurement
