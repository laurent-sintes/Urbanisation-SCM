cross_scope_boundaries:
- Commerce définit les dispositifs de vente ; Procurement les accords d’achat ; Finance calcule et règle les droits autorisés.
- MAP conserve achats planifiés et carnet d’achat ; FLOW peut proposer via CTP et consomme les décisions autorisées.
- FLOW porte les engagements et la coordination entre acteurs ; Logistics organise et réalise ses moyens locaux.
- La qualité produit et les exigences d’entreprise restent distinctes des inspections et opérations physiques.
- Commerce Store Operations réalise les opérations du magasin ; frontière avec Warehousing à qualifier sans déplacer automatiquement
  le magasin dans Logistics.
