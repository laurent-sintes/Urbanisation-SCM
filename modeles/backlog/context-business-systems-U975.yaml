    & Returns Operations et Transport Exception Management.
dependency_hypotheses:
- dependency: Définition produit → planning et références FLOW
  risk: Identité, variante, unité ou version non stabilisée.
  status: hypothesis_not_observed
- dependency: Collection Planning → Demand Planning
  risk: Confusion entre intention de collection et prévision chiffrée.
  status: hypothesis_not_observed
- dependency: Plans → Availability
  risk: Mélange de scénarios, versions ou propositions avec des engagements fermes.
  status: hypothesis_not_observed
- dependency: FLOW → Warehousing
  risk: Modification de demande après début de préparation.
  status: hypothesis_not_observed
- dependency: FLOW → Transportation
  risk: Adaptation locale remettant en cause une promesse.
  status: hypothesis_not_observed
- dependency: Logistics → FLOW
  risk: Événements tardifs, dupliqués ou corrigés.
  status: hypothesis_not_observed
- dependency: Finance → Sales / FLOW
  risk: Profil de crédit périmé ou autorité de déblocage ambiguë.
  status: hypothesis_not_observed
- dependency: FLOW → Financial Accounting
  risk: Correction opérationnelle mal traduite ou doublonnée.
  status: hypothesis_not_observed
- dependency: Exigences entreprise → règles locales
  risk: Version applicable, exception ou responsable ambigu.
  status: hypothesis_not_observed
