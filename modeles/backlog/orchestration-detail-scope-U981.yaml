      definition: Recevoir et contrôler les [faits de gestion](glossary:TER120), puis les traduire en [écritures](glossary:TER121)
        selon les règles comptables.
      finality: Recevoir et contrôler les faits de gestion, puis les traduire en écritures selon les règles comptables.
      scope: |-
        Recevoir les [faits de gestion](glossary:TER120) fournis notamment par [Accounting Data Provision](model:accounting-data-provision), contrôler leur complétude et leur cohérence, puis appliquer les règles de [Finance](glossary:TER117) pour produire les [écritures](glossary:TER121) prêtes à enregistrer. Conserver les liens vers les faits et justificatifs, les corrections et les rejets motivés.

        Une information manquante entraîne une attente ou un rejet, sans inventer un montant. L’enregistrement effectif des écritures reste distinct. Exemple fictif : vérifier une réception reconnue de 80 pièces et déterminer son traitement comptable selon les règles applicables ; un composant installé hors du logiciel comptable peut servir cette responsabilité Finance.
