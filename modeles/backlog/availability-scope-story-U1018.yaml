policy_scope:
  existing_subdomain: subdomain-policies
  existing_business_area: ba-protection-policies
  name: Demand & Supply Policies
  responsibility: Définir et tenir les stratégies et règles applicables, notamment via Demand Fulfilment Policy Management.
  boundary: La stratégie peut avoir des variantes par périmètre et consomme les conditions contractuelles reçues ; les seuils
    recommandés par les optimisations ne deviennent pas actifs automatiquement. Aucun déplacement vers Availability proposé.
changes_if_adopted:
- Créer la Business Area Order Backlog Management avec une nouvelle identité, sans réutiliser ba-supply-matching.
- Rattacher Demand Prioritization, Supply Assignment et Delivery Release Decision à cette Business Area.
- Rattacher Replenishment à Stock Optimization ; conserver la séparation de ses comportements existants.
- Master Plan Management conserve ses trois capacités de pilotage et les deux capacités d’interprétation de plans.
- Conserver les seize identités de capacités et un parent explicite chacune.
upstream_downstream_boundary: Le Master Plan pilote la cohérence des décisions de flux amont/aval pour satisfaire le carnet.
  MAP garde le plan d’approvisionnement et le carnet d’achat ; Fulfilment et Logistics gardent la coordination et la réalisation
  des prestations. Le Master Plan ne devient pas un moteur de processus ni propriétaire des engagements.
glossary_review_if_adopted:
- Aligner TER133 et TER202, les contextes des capacités déplacées et la nouvelle notion Order Backlog Management.
- Conserver la finalité CTP de TER045 ; rendre visible son calcul Supply et sa mobilisation par Master Planning.
- Réexaminer les synthèses Availability et les scénarios, sans catalogue Markdown concurrent.
hotspot_follow_up: 'HS-008 : décisions du carnet dans Order Backlog Management, pilotage dans Master Plan Management et stratégies
  dans Supply Policy Management. Preuves, scores et absence de choix de convergence conservés.'
comparison:
  Microsoft: Les master plans mobilisent politiques, ressources et calculs CTP. Leur périmètre inclut la génération d’approvisionnements,
    plus large que le pilotage FLOW qui conserve MAP.
  SAP: BOP arbitre les confirmations et quantités entre demandes ; la planification et la CTP mobilisent d’autres calculs.
    Ces fonctions appuient la distinction, pas le découpage proposé en Business Areas.
  Oracle: Backlog Management distingue planification collective, simulation et publication des résultats ; la publication
    ne se confond pas avec la release en livraison FLOW.
limits:
- Lot U1018 appliqué U1019 ; aucune publication implicite.
- Les seize capacités sont conservées et mobilisables entre périmètres ; pas de calculs indépendants imposés.
- Les nouvelles rédactions de mise en œuvre restent proposées ; aucune réalisation installée nouvelle.
agreement:
  source_ref: U1019
  verbatim: Je valide ce découpage
  scope: Proposition complète U1018 ; descriptions détaillées nouvelles proposées, aucun accord installé ou release.
glossary_review_result: TER269 créé ; TER133, TER202 et les synthèses et contextes concernés alignés ; CTP reste orienté résultat
  demande et mobilisable par le plan collectif.
