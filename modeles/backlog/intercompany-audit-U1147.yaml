findings:
- id: IC01
  priority: P1
  title: Formaliser les engagements réciproques et leurs changements
  node_ids:
  - D04.i
  - D04.j
  - D04.n
  - BHV069
  - order-workflow-orchestration
  coverage: partial
  observation: Le parcours relie explicitement vente A–client, achat A–B et vente B–A. Les relations des familles vers Order
    Structuring sont génériques ; le contrat ne précise pas quelle information fait autorité, les changements attendus par
    contrepartie ni les refus de propagation.
  interpretation_and_risk: Des commandes peuvent rester liées tout en devenant incompatibles en quantité, date ou condition.
    Une modification d’un côté ne vaut pas acceptation de l’autre.
  recommendation: 'Préciser les responsabilités existantes : chaque famille tient ses engagements ; Order Structuring conserve
    les correspondances entre lignes, sociétés et versions ; Process Management conduit les demandes de changement, leurs
    réponses et exceptions. Exprimer dans le parcours et les échanges utiles les propositions, acceptations partielles, refus,
    annulations et reliquats, sans graphe complet entre toutes les commandes.'
  market_refs:
  - MS01
  - MS03
  - SAP01
  common_ground: Les produits documentent des documents liés et des évolutions coordonnées.
  difference_and_limit: FLOW doit exprimer le résultat métier attendu, sans imposer la création automatique des documents
    ni toutes les règles natives ERP.
  glossary_follow_up:
  - TER122
  - TER069
  - TER070
  acceptance_example: 100 vestes liées ; 60 acceptées, 40 reportées ou refusées. Chaque société conserve sa réponse et son
    engagement ; aucun acquittement ne confirme la promesse client.
  decision_state: accepted_recommendation
  adoption_source: U1149
- id: IC02
  priority: P1
  title: Fermer la chaîne de facturation et de traitement acheteur
  node_ids:
  - service-order-billing
  - accounting-data-provision
  - subdomain-financial-accounting
  - D04.i
  - D04.j
  coverage: gap_in_chain
  observation: 'Le parcours intercompany ne mobilise pas Billing : sa dernière étape transmet les faits de stock à Finance.
    Billing couvre émission et correction génériques, sans contrat intercompany ni réception/contrôle explicites de la facture
    fournisseur. Ses quatre relations actuelles portent parent, mandat, résultat et rapprochement de prestation ; aucun échange
    explicite Billing–Financial Accounting.'
  interpretation_and_risk: La comptabilisation des mouvements ne prouve ni facture client A–client, ni facture B–A, ni reconnaissance
    de la dette de A. Une facture unique pour l’ensemble du groupe serait une mauvaise déduction.
  recommendation: Compléter le parcours par les factures distinctes, leurs parties, lignes et références. Clarifier l’émission
    dans Billing ; porter la réception, le contrôle et le traitement acheteur dans Financial Accounting au niveau de contexte
    autorisé. Décrire les faits de facture et retours de traitement près de leur producteur ; ne pas détourner Accounting
    Data Provision, limité aux registres de stock. Définir explicitement les échanges réellement utiles avec Finance.
  market_refs:
  - MS04
  - MS06
  - SAP01
  - SAP05
  common_ground: Les appuis distinguent les relations commerciales et leurs conséquences financières.
  difference_and_limit: Un service générique de facturation ne démontre pas le traitement entrant d’une facture fournisseur.
    Le contrôle financier reste extérieur au domaine Supply.
  glossary_follow_up:
  - TER153
  - TER118
  - TER120
  - TER121
  acceptance_example: Une livraison B–client de 100 pièces peut donner deux factures de vente distinctes ; la facture B–A
    est traitée comme fournisseur chez A. Un écart bloque ou met en attente le traitement concerné sans invalider silencieusement
    les faits de stock.
  decision_state: accepted_recommendation
  adoption_source: U1149
- id: IC03
  priority: P1
  title: Éprouver le transfert intercompany sans client externe
  node_ids:
  - D04.k
  - D04.i
  - D04.j
  - D01.h
  - inventory-ownership-ledger
  coverage: partial
  observation: Transfer Order couvre les déplacements entre sites. Les achats, ventes et changements de propriétaire existent.
    Le seul scénario explicitement intercompany comporte un client externe et une livraison directe.
  interpretation_and_risk: Le déplacement intra-société et le transfert entre personnes morales risquent d’être lus de la
    même manière, alors que les engagements et suites financières peuvent différer.
  recommendation: Ajouter un scénario de transfert de B vers un site de A, sans client final. Préciser le mandat du déplacement
    et, lorsque le montage retenu l’exige, les engagements vente/achat et la facturation. Ne pas rendre les trois commandes
    obligatoires dans toute solution ; un document directeur peut porter le déplacement. Un changement de propriétaire sans
    déplacement reste possible selon accord et preuve.
  market_refs:
  - MS01
  - SAP02
  common_ground: Microsoft décrit l’échange simple entre sociétés ; SAP documente spécifiquement le transfert intercompany.
  difference_and_limit: Le Stock Transport Order SAP n’est pas une équivalence automatique de Transfer Order FLOW et n’impose
    pas une topologie documentaire universelle.
  glossary_follow_up:
  - TER122
  - TER071
  - TER132
  acceptance_example: 'B fournit 100 vestes au site de A pour reconstituer son stock : un seul mouvement physique, des engagements
    juridiques explicités, aucune vente client fictive.'
  decision_state: accepted_recommendation
  adoption_source: U1149
- id: IC04
  priority: P2
  title: Identifier sociétés, groupe et contextes des références
  node_ids:
  - D09
  - D11
  - D04.i
  - D04.j
  coverage: partial
  observation: Party / Role distingue personne morale, rôle et unité interne ; un fournisseur peut être client. Le terme Intercompany
    exige l’appartenance au même groupe. Les références ne rendent pas explicite la qualification intercompany, son origine
    et sa validité pour chaque paire de sociétés.
  interpretation_and_risk: Deux sites, deux marques ou deux rôles ne prouvent pas deux sociétés ni une relation intragroupe.
    L’identité locale d’une commande peut aussi être ambiguë sans sa société.
  recommendation: Préciser société qui porte l’engagement, contrepartie, identifiants d’origine, relation de groupe documentée
    et validité. Relier les sites aux responsabilités connues sans fabriquer un maître d’entreprise ou une cartographie juridique
    Beaumanoir.
  market_refs:
  - MS01
  - MS06
  - SAP02
  common_ground: Les transactions comparées dépendent des entités et de leurs contreparties identifiées.
  difference_and_limit: Company code et legal entity sont des objets produit à contextualiser ; leur identité technique n’est
    pas imposée au modèle métier.
  glossary_follow_up:
  - TER122
  - TER046
  - TER047
  - TER048
  acceptance_example: Deux entrepôts d’une même société ne suffisent pas à qualifier intercompany ; une même société peut
    être acheteur et vendeur dans des accords différents.
  decision_state: accepted_recommendation
  adoption_source: U1149
- id: IC05
  priority: P2
  title: Séparer prix externe, prix interne et valorisation groupe
  node_ids:
  - product-price-book
  - D11
  - cap-sales-pricing-rule-management
  - cap-sales-price-determination
  - subdomain-cost-profitability
  coverage: partial
  observation: Tarifs, prix contextualisés, accords et prix engagés sont couverts. Cost & Profitability Management porte les
    méthodes de valorisation. Aucun contrat explicite ne distingue prix de cession interne, prix client et vue économique
    groupe.
  interpretation_and_risk: Réutiliser le prix final sur toutes les branches peut fausser marge, achat et contrôle financier.
    Le prix de cession et sa justification fiscale ne se déduisent pas d’un résultat de promesse.
  recommendation: Identifier l’autorité qui fournit le prix interne et ses conditions ; conserver origine, validité, devise
    et prix engagé sur les branches concernées. Faire arbitrer le partage exact entre politique financière, accords et détermination
    commerciale ; FLOW consomme les résultats autorisés. Distinguer les coûts/marges de société de la lecture groupe.
  market_refs:
  - MS02
  - MS04
  - SAP03
  common_ground: Les sources permettent de distinguer prix externe, relation interne et vues de valorisation.
  difference_and_limit: La documentation ne justifie pas de transférer automatiquement tout prix interne à Commerce ou tout
    calcul de prix à Finance. Aucun régime fiscal ni règle de marge applicable à Beaumanoir établi.
  glossary_follow_up:
  - TER122
  - TER048
  - TER229
  acceptance_example: 'A vend 100 au client et achète 70 à B : chaque prix garde son sens ; la valeur groupe ne s’obtient
    pas en additionnant les deux chiffres d’affaires.'
  decision_state: accepted_recommendation
  adoption_source: U1149
- id: IC06
  priority: P2
  title: Décrire les retours et corrections réciproques
  node_ids:
  - D04.l
  - D04.m
  - return-credit-resolution
  - service-order-billing
  - inventory-ownership-ledger
  coverage: partial
  observation: Retours client et fournisseur, avoir, remboursement et remplacement existent. Le scénario intercompany reste
    nominal ; les correspondances entre les retours, crédits réciproques et changements de propriété ne sont pas éprouvées.
  interpretation_and_risk: Un retour physique chez B pourrait être pris à tort pour une réception chez A, un avoir unique
    ou une annulation des ventes initiales.
  recommendation: 'Ajouter un parcours de retour partiel intercompany : lieu réel, autorisations, lignes et quantités, destinataires
    des avoirs, éventuel remboursement client, contrepassations ou nouveaux faits de propriété justifiés. Conserver les responsabilités
    existantes et distinguer correction financière, mouvement et remplacement.'
  market_refs:
  - MS01
  - MS05
  - SAP05
  common_ground: Microsoft décrit explicitement les chaînes de retour ; SAP mentionne un processus intercompany de retour
    dans son périmètre classique.
  difference_and_limit: L’extrait SAP n’établit pas une compatibilité universelle du retour avec Advanced Intercompany Sales
    ; le cours SAP01 comporte des restrictions historiques. Aucun automatisme commun n’est supposé.
  glossary_follow_up:
  - TER122
  - TER072
  - TER073
  - TER153
  - TER154
  acceptance_example: 10 vestes retournent du client vers B ; crédit A–client et crédit B–A sont suivis séparément lorsqu’ils
    sont dus, sans réception fictive chez A ni remboursement déduit d’un avoir.
  decision_state: accepted_recommendation
  adoption_source: U1149
- id: IC07
  priority: P2
  title: Mobiliser le pilotage de Case sur toute la chaîne
  node_ids:
  - workflow-definition-management
  - order-workflow-orchestration
  - process-ledger
  - BHV082
  - process-mining
  coverage: existing_mechanism_implicit_use
  observation: Le registre Process et la conduite des parcours existent. Le parcours intercompany ne mobilise pas explicitement
    ces contributeurs pour la corrélation entre sociétés et les exceptions documentaires ou financières.
  interpretation_and_risk: Le lecteur peut comprendre une coopération nominale sans savoir où suivre un engagement réciproque
    refusé ou une branche en attente. Absence d’un contributeur ne prouve pas absence du mécanisme générique.
  recommendation: Identifier le Case responsable et ses liens aux demandes de chaque société, sans imposer un dossier technique
    unique à toutes. Conserver événements d’origine, dates, versions, refus et corrections ; distinguer synchronisation attendue,
    traitement achevé et clôture financière. Réutiliser Process Ledger et les capacités de supervision et d’analyse.
  market_refs:
  - MS03
  - MS04
  - SAP01
  - SAP04
  common_ground: Les sources distinguent coordination opérationnelle et traitement des écarts ; la surveillance de la chaîne
    est un résultat utile.
  difference_and_limit: Value Chain Monitoring SAP n’est pas une équivalence complète du Case Management FLOW. Process Ledger
    n’est ni le registre comptable ni le registre de stock.
  glossary_follow_up:
  - TER064
  - TER375
  acceptance_example: 'La livraison est terminée mais une facture est rejetée chez A : le dossier affiche l’attente financière
    sans recréer une livraison ni déclarer le parcours intégralement achevé.'
  decision_state: accepted_recommendation
  adoption_source: U1149
- id: IC08
  priority: P2
  title: Éprouver transit, contrôle et comptage par société
  node_ids:
  - D01.c
  - D01.g
  - D01.h
  - inventory-ownership-ledger
  - D03.i
  - D03.o
  coverage: strong_base_targeted_clarification
  observation: Les positions par propriétaire/détenteur, la propriété en transit, les deux dates et l’absence de double comptage
    sont explicites. Le scénario relie 100 pièces et trois commandes sans en faire 300. Le contrôle économique n’est pas explicitement
    qualifié comme jalon distinct de la propriété.
  interpretation_and_risk: Une équivalence directe avec le stock valorisé SAP serait excessive. Un stock visible du groupe
    n’est pas automatiquement utilisable pour une autre société, et des commandes liées ne sont pas des besoins indépendants.
  recommendation: Préserver les registres existants. Éprouver droits d’usage, autorisation de fourniture, branches de demande
    et jalons documentés du transit ; Finance garde valorisation et reconnaissance comptable. Qualifier le contrôle économique
    seulement si nécessaire et étayé, distinct de propriété/risque ; aucune nouvelle capacité ou écriture physique déduite.
  market_refs:
  - MS01
  - MS02
  - SAP01
  - SAP02
  common_ground: Les scénarios éditeurs lient plusieurs engagements à un flux de biens ; le transit et les conséquences financières
    doivent être interprétés dans leur contexte.
  difference_and_limit: Le mécanisme SAP Valuated Stock in Transit est un rapprochement partiel avec plusieurs responsabilités
    FLOW, pas un équivalent d’Inventory Ownership Ledger.
  glossary_follow_up:
  - TER122
  - TER132
  - TER071
  acceptance_example: '100 pièces en transit changent de propriétaire selon preuve : quantité physique du groupe inchangée
    ; position par société mise à jour, usage par la promesse sous conditions.'
  decision_state: accepted_recommendation
  adoption_source: U1149
- id: IC09
  priority: P3
  title: Rendre visible la frontière financière intercompany
  node_ids:
  - subdomain-financial-accounting
  - subdomain-cost-profitability
  - subdomain-treasury-cash
  - subdomain-commercial-settlement-management
  - service-order-payment-collection
  coverage: context_not_detailed
  observation: Finance couvre comptes, méthodes de coûts et trésorerie à un niveau de contexte. Rapprochement intercompany,
    soldes réciproques et éliminations de consolidation ne sont pas explicitement détaillés. Payment est limité aux encaissements/remboursements
    clients ; Commercial Settlement Management traite les avantages commerciaux.
  interpretation_and_risk: Ni ces deux dernières fiches ni une analyse consolidée de performance ne prouvent paiement fournisseur,
    compensation des soldes intercompany ou consolidation financière.
  recommendation: Préciser dans les périmètres de contexte et leurs contrats qui reçoit les faits, rapproche les contreparties,
    traite les écarts et produit les résultats consolidés. Finance conserve ses autorités et sa profondeur déclarée. Ne pas
    ajouter automatiquement de capacités comptables ni étendre Payment. Services, trésorerie intragroupe et éliminations complètes
    nécessitent un cadrage séparé s’ils deviennent un besoin approfondi.
  market_refs:
  - MS06
  - MS07
  - SAP03
  - SAP04
  common_ground: Les deux familles séparent opérations commerciales et responsabilités financières intercompany.
  difference_and_limit: Microsoft Finance et SAP ICMR ne sont pas déclarés équivalents fonctionnellement. La couverture cible
    complète et la réalisation installée restent à établir ; une analyse de coûts Supply n’est pas une consolidation légale.
  glossary_follow_up:
  - TER118
  - TER154
  - TER229
  - TER231
  acceptance_example: Une créance B sur A et la dette de A sont rapprochées ; un écart de période reste visible. L’analyse
    groupe neutralise les échanges internes selon les règles financières sans effacer les engagements locaux.
  decision_state: accepted_recommendation
  adoption_source: U1149
- id: IC10
  priority: P2
  title: Élargir l’explication du terme Intercompany sans changer son parent
  node_ids:
  - BHV069
  - D04.i
  coverage: editorial_scope_narrower_than_term
  observation: TER122 définit correctement la relation entre sociétés mais sa description courte la rattache ici à une livraison
    client ; son seul exemple est direct. BHV069 permet déjà de combiner intercompany et mode de livraison.
  interpretation_and_risk: Le lecteur peut confondre intercompany et livraison directe ou croire que toute transaction intragroupe
    est portée par le seul comportement Intercompany Sales.
  recommendation: Élargir l’explication du terme à la relation, illustrer vente directe et fourniture au stock d’une autre
    société, puis distinguer sa portée générale du comportement de vente. Garder BHV069 sous Sales Order ; ne pas créer de
    domaine transversal aspirant achats, stock et Finance.
  market_refs:
  - MS01
  - SAP02
  common_ground: Les cas comparés dépassent la seule livraison directe à un client externe.
  difference_and_limit: Intercompany Sales reste une variante de vente ; le terme général peut éclairer plusieurs coopérations
    sans devenir une capacité universelle.
  glossary_follow_up:
  - TER122
  - TER071
  - TER069
  - TER070
  acceptance_example: Une fourniture de B au stock de A est reconnue comme intercompany même sans client externe ; un simple
    changement d’entrepôt n’en est pas automatiquement un.
  decision_state: accepted_recommendation
  adoption_source: U1149
