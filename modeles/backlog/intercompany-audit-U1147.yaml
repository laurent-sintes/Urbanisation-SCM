  parity: '35 fiches : noms, définitions, finalités, périmètres et justifications de décomposition identiques à la publication
    v089 / 2026-10-22.2. Huit termes : noms, définitions, descriptions courtes, contextes et notes identiques. Contrôle ciblé,
    sans égalité générale présumée.'
verdict: 'Le modèle possède les responsabilités de base et un scénario explicite de vente intercompany en livraison directe.
  La couverture de bout en bout reste partielle : changements des commandes liées, chaîne de factures et traitement acheteur,
  transfert intercompany sans client final et retour réciproque ne disposent pas de contrats suffisamment explicites. Les
  responsabilités financières de contexte ne prouvent pas une gestion intercompany financière complète.'
scope:
  included:
  - Relations entre sociétés juridiquement distinctes d’un même groupe
  - Achats et ventes de biens, stock, propriété, prestations et changements des commandes
  - Facturation, faits comptables et adhérences Finance
  - Scénarios, parcours, relations, supervision et glossaire
  limits:
  - Aucune pratique installée ni flux Beaumanoir présumé.
  - Pas d’audit fiscal ou juridique par pays ; aucune règle de taxe ou de prix de transfert imposée.
  - 'Services intragroupe, financement intragroupe, cash pooling et consolidation exhaustive non détaillés : responsabilités
    de contexte et lacunes signalées seulement.'
  - Pas d’étude de compatibilité technique, de licences ni de couverture d’une configuration produit installée.
  - Audit ciblé ; aucune réouverture de l’audit des comportements clos U431.
comparison_method: Comparer les résultats et responsabilités, pas les modules à la hiérarchie FLOW. Les mécanismes automatiques
  des ERP sont des appuis partiels ; ils ne deviennent pas des capacités supplémentaires ni des automatismes imposés à FLOW.
  Microsoft Dynamics 365 SCM et Finance sont distingués de Business Central, qui n’est pas utilisé pour conclure. Les éditions
  SAP et les limites d’accès sont précisées ci-dessous.
