market_comparisons:
- topic: Cycle de vie et visibilité des Orders
  sources:
  - ELM724
  - ELM725
  conclusion: Responsabilités nécessaires ; leur regroupement sous les familles plutôt qu’une capacité séparée est une convention
    FLOW cohérente avec Service Order Management.
- topic: Possibilité et engagement
  sources:
  - ELM726
  - ELM727
  - ELM725
  conclusion: Ne pas supprimer l’engagement avec le nœud Fulfillment Commitment. Calcul et engagement restent distincts ;
    engagement reçu du fournisseur et engagement émis au client également.
- topic: Consignation
  sources:
  - ELM728
  - ELM729
  conclusion: Conserver les intentions d’apport et reprise ; harmoniser en Action selon la convention FLOW, sans prétendre
    que les éditeurs prescrivent ce type.
- topic: Structuration
  sources:
  - ELM730
  - ELM731
  conclusion: Conserver filiation et ensembles ; le support marché de la fusion générique reste limité, correspondance Infor
    antérieure à préserver avec ses restrictions.
- topic: Archivage
  sources:
  - ELM732
  - ELM733
  conclusion: Fonction réelle, pas nécessité démontrée d’une capacité autonome à la maille retenue. Deux produits Microsoft
    ne prouvent pas consensus.
proposed_addition:
  name: Order Visibility
  nature: knowledge
  parent: D04
  definition: Restituer une vue cohérente des demandes, engagements, réalisations imputées et restes à satisfaire, par Order
    et à travers le carnet.
  boundary: Consomme les états tenus par les familles et les résultats rapprochés par Fulfilment ; ne capte pas directement
    les événements des exécutants, ne modifie pas les Orders et ne recalcule pas la promesse.
  benefit: Point d’accès commun à la connaissance du carnet après retrait des capacités transverses de mutation.
  sources:
  - ELM724
  - ELM725
  status: applied_U725
common_contract:
- Identifier origine, parties, lignes, quantités, lieux et dates demandées.
- Distinguer proposition, intention ferme, engagement confirmé, protection, autorisation de prise en charge et suspension.
- Gérer révisions, annulations et clôture à la portée quantité/ligne/ensemble, selon les autorisations.
- Conserver demandé, proposé, confirmé, réalisé et reste à satisfaire séparément.
- Préserver prix engagé, versions, filiation et historique ; aucun effet réalisé effacé.
- Distinguer conservation historique, archivage, purge et réouverture ; aucune durée ni régime juridique inventé.
cooperation:
  Order Promising: Calcule et recommande les possibilités quantité/date/conditions.
  Demand & Supply Matching: Arbitre la couverture et les affectations ; les engagements appartiennent aux Orders.
  Order Management: Porte la demande et ses engagements et révisions autorisées.
  Service Order Management: Porte les demandes de prestations et leurs engagements spécifiques.
  Fulfilment Orchestration: Coordonne et adapte l’exécution en préservant promesse et grands équilibres ; fournit les résultats
    rapprochés.
  Inventory Management: Porte faits, états et réservations ; une promesse ne vaut pas réservation.
additional_findings:
- id: OM-01
  finding: REL-NEEDS-U290-019 cible D02.e Apply Plan mais décrit Supply Assignment.
  action: Retirer avec D03.n ou requalifier vers le responsable actuel du résultat, jamais conserver le lien par simple remplacement
    de nom.
- id: OM-02
  finding: REL-EXECUTION-PROMISING décrit encore D15 retiré et le calcul de promesse vers D04.
  action: Réécrire selon D18 calcul / D04 engagement et D06 retours d’exécution.
- id: OM-03
  finding: Les scopes empilent anciens noms Demand, Availability et Consignment Replenishment Order ; Purchase Order répète
    Matching.
  action: Réécrire les descriptions courantes, conserver les accords et les anciens textes dans Git.
- id: OM-04
  finding: 'Les Behaviors sont des axes parfois combinables : parcours, relation intercompany, confirmation fournisseur et
    consignation.'
  action: Expliciter les axes non exclusifs sans imposer un arbre de sous-comportements ni dupliquer le cycle commun.
- id: OM-05
  finding: Orders entrants ne signifie pas uniquement commandes émises par un acteur externe ; transferts, propositions APS
    et achats expriment aussi des demandes prises en charge.
  action: Clarifier la frontière par le résultat demandé ; distinguer achat de prestation et ordre de service.
