- id: F12
  axis: market
  priority: P2
  classification: evidence_quality
  title: Le volume documentaire ne constitue pas une justification par fiche
  target_ids:
  - D02.e
  - D05.f
  evidence:
  - 164 fiches possèdent au moins deux URL distinctes, mais cela ne vérifie pas la pertinence des passages.
  - 141 definition_choice reproduisent exactement la définition de la fiche ; 252 comparaisons ne renseignent pas ce champ.
  - Master Planning contient deux URL répétées ; Plan Application porte 21 comparaisons de mailles diverses.
  risk: Accumulation et textes génériques rendent difficiles la lecture du choix de nom et la preuve du périmètre.
  recommendation: Hiérarchiser deux appuis directs par fiche, conserver les sources adjacentes avec leur rôle, dédupliquer
    les répétitions et remplacer les justifications circulaires par un raisonnement. L’absence d’un champ ne prouve pas à
    elle seule l’absence d’argument dans les autres champs.
  acceptance_criterion: Deux passages pertinents et un argument propre au nom/périmètre sont identifiables ; aucun consensus
    déduit du seul nombre de liens.
  source_refs:
  - U770
  status: applied_U771
  application: 389 raisons circulaires ou absentes remplacées par le rapprochement et la limite propres à la comparaison ;
    doublons de Master Planning regroupés ; appuis directs ordonnés sur les fiches surchargées. Pas de certification globale
    des URL ou de consensus.
- id: F13
  axis: vocabulary
  priority: P2
  classification: intentional_difference
  title: Supply Plan et master plan sont des sens FLOW à rendre plus explicites
  target_ids:
  - plans-visibility
  - subdomain-plans
  - D05.f
  - TER078
  evidence:
  - FLOW limite Supply Plan aux mouvements prévus hors achats et réserve le master plan au Matching.
  - Microsoft traite des supply forecasts conduisant notamment à des achats planifiés ; ses master plans englobent plusieurs
    calculs.
  - Le glossaire ne possède pas d’entrée distincte Supply Plan ni Demand Plan.
  risk: Un lecteur du marché peut supposer un périmètre plus large ou confondre le plan externe avec le plan interne.
  recommendation: Conserver le découpage validé ; ajouter au glossaire les sens FLOW de Supply Plan, Demand Plan et master
    plan de matching, avec différences explicites et exemple d’achat projeté. Ne pas renommer automatiquement.
  acceptance_criterion: Un achat projeté APS, un mouvement prévu hors achats et une affectation interne sont distinguables.
  source_refs:
  - U770
  - ELM748
  - ELM782
  status: applied_U771
  application: Correction ou clarification appliquée aux champs concernés ; les choix FLOW et responsabilités distinctes sont
    conservés.
- id: F14
  axis: boundaries
  priority: P2
  classification: clarification
  title: 'Sélection de promesse, de service et adaptation locale : expliciter les décisions'
  target_ids:
  - D03.l
  - D06.e
  - D06.f
  - service-order-release-decision
  - D03.o
  evidence:
  - Promise Selection choisit une proposition ; Service Selection choisit les moyens ; Process Adaptation choisit les adaptations
    ; Release choisit ensembles et moments.
  - D06.e.scope renvoie encore aux possibilités de promesse D18, identifiant absent du modèle courant.
  risk: Sur une alternative express ou autre site, plusieurs capacités peuvent sembler choisir la même solution.
  recommendation: 'Conserver les capacités ; expliciter leurs sorties et coopérations : option de promesse, prestation/exécutant,
    révision locale du plan, décision de libération, affectation collective. Corriger D18. Aucune chaîne universelle ni nouvelle
    règle d’autorité nécessaire.'
  acceptance_criterion: Le scénario transport retardé identifie une seule responsabilité par décision et le recours à Promising/Matching
    si leurs engagements sont touchés.
  source_refs:
  - U770
  status: applied_U771
  application: Correction ou clarification appliquée aux champs concernés ; les choix FLOW et responsabilités distinctes sont
    conservés.
- id: F15
  axis: boundaries
  priority: P2
  classification: clarification
  title: 'Service Reconciliation et encaissement : distinguer résultat et comptabilité'
  target_ids:
  - D07.c
  - service-order-payment-collection
  evidence:
  - 'D07.c.scope : « aucun rapprochement financier ».'
  - Le scénario remote-payment-ambiguous lui fait rapprocher 600 reçus sur 1 000 demandés, doublons et contradiction.
  - Payment Collection exclut l’absorption automatique du rapprochement financier.
  risk: L’exclusion générale peut interdire le rapprochement du résultat de la prestation que le scénario demande pourtant.
  recommendation: Distinguer rapprochement opérationnel demande/résultat de collecte et rapprochement bancaire/comptable restant
    externe. La preuve financière est fournie par le service compétent ; Service Reconciliation qualifie le résultat reçu.
  acceptance_criterion: Le cas partiel est traitable sans que FLOW certifie les écritures, le règlement bancaire ou l’affectation
    comptable.
  source_refs:
  - U770
  status: applied_U771
  application: Correction ou clarification appliquée aux champs concernés ; les choix FLOW et responsabilités distinctes sont
    conservés.
- id: F16
  axis: boundaries
  priority: P2
  classification: open_modeling_choice
  title: 'Réception : responsabilité annoncée mais aucune famille spécialisée'
  target_ids:
  - subdomain-service-orders
  - D07.a
  - D07.c
  evidence:
  - Le scope de Service Order Management conserve explicitement les prestations de réception sans famille spécialisée.
  - Les 16 familles d’Orders actuelles ne comportent pas de Receiving Order.
  - Microsoft distingue demandes entrantes d’entrepôt et retours de réception ; cela atteste un objet de prestation, pas une
    capacité FLOW obligatoire.
  risk: Un cas de réception confiée ne peut pas pointer une capacité d’Order explicite ; les 71 capacités mobilisées ne prouvent
    donc pas que toutes les responsabilités annoncées sont couvertes.
  recommendation: Arbitrer Receiving Order si la réception est une prestation autonome commandée et suivie ; sinon documenter
    sa prise en charge exacte par une famille existante. Ne pas créer un ordre par fait reçu ni automatiquement Putaway/Storage
    Orders.
  acceptance_criterion: Un scénario de réception confiée désigne la capacité qui porte demande, engagement et reste à satisfaire.
  source_refs:
  - U770
  - ELM364
  - ELM445
  status: applied_U771
  application: Receiving Order ajouté avec deux documents primaires, catégorie entrepôt, cycle propre et scénario de réception
    partielle.
