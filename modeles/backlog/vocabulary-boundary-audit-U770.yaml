  target_ids:
  - D02.b
  - D19.b
  - D05.d
  - D03.m
  evidence:
  - Supply Protection porte enveloppes, plafonds et règles sur ressources ; Demand Protection porte éligibilité, priorité
    et protection contre réoptimisation.
  - Un même groupe web peut apparaître des deux côtés.
  risk: La même condition pourrait être saisie deux fois et diverger si son objet protégé n’est pas explicite.
  recommendation: 'Garder les deux capacités : déclarer pour chaque règle si elle contraint la ressource mobilisable ou le
    traitement d’une demande. Les optimisations proposent, les Policy activent, les décisions consomment. Référencer la même
    règle lorsque nécessaire plutôt que la dupliquer.'
  acceptance_criterion: Le cas stock protégé pour le web distingue enveloppe ressource, demande prioritaire et réservation
    individuelle.
  source_refs:
  - U770
  status: applied_U771
  application: Correction ou clarification appliquée aux champs concernés ; les choix FLOW et responsabilités distinctes sont
    conservés.
- id: F22
  axis: market
  priority: P2
  classification: intentional_difference
  title: 'Noms d’Orders de services et PTP : conserver les adaptations FLOW explicites'
  target_ids:
  - subdomain-service-orders
  - D03.k
  - service-order-document-production
  - service-order-billing
  - service-order-payment-collection
  evidence:
  - Les fiches d’Orders fashion indiquent correctement que les prestataires documentent des opérations, pas une taxonomie
    normalisée d’Orders.
  - Oracle PTP sélectionne une possibilité de moindre coût ; FLOW sépare l’évaluation de la sélection.
  - Microsoft DOM optimise également les sources ; il n’est pas une capacité native nommée PTP.
  risk: Une simplification des commentaires pourrait transformer une analogie pertinente en équivalence de marché non démontrée.
  recommendation: Préserver ces écarts volontaires ; présenter les noms composés comme FLOW et la correspondance comme appui
    sémantique ou recouvrement partiel. Aucun renommage automatique ni fusion pour coller à un produit.
  acceptance_criterion: Les fiches distinguent toujours choix FLOW, terme natif et résultat réellement étayé.
  source_refs:
  - U770
  - ELM372
  - ELM393
  status: applied_U771
  application: Écarts volontaires conservés et explicités ; aucune équivalence native ajoutée.
boundary_matrix:
- pair: Inventory Tracking / Ledger / Visibility
  diagnosis: Coopération saine
  recommendation: Recevoir les faits ; tenir les écritures reconnues ; composer les positions. Ne pas fusionner intégration,
    registre et consultation.
- pair: Inventory Visibility / ATP
  diagnosis: Coopération saine
  recommendation: La vue décrit les ressources et engagements ; ATP évalue leur admissibilité pour une demande. Le stock projeté
    ne vaut pas une promesse.
- pair: ATP / CTP
  diagnosis: Frontière définie, glossaire à corriger
  recommendation: Ressources admissibles de référence / faisabilité conditionnelle de ressources à obtenir ou constituer.
    Une autre date ou un autre site ne suffit pas à caractériser CTP.
- pair: PTP / Promise Selection
  diagnosis: Frontière définie, glossaire contradictoire
  recommendation: Dossier économique local / proposition choisie. Pas de fusion.
- pair: Supply Assignment / Plan Application
  diagnosis: Frontière définie, prose résiduelle ambiguë
  recommendation: Déterminer les liens / matérialiser les changements autorisés et recueillir leur résultat.
- pair: Purchase Order de service / Service Order
  diagnosis: Coopération saine
  recommendation: Engagement d’achat envers le fournisseur / exigences et engagement de la prestation confiée. Pas de rapport
    un-à-un obligatoire.
- pair: Transfer Order / Transport Order
  diagnosis: Coopération saine
  recommendation: Besoin de déplacement entre sites / prestation d’acheminement confiée ; un transfert peut mobiliser plusieurs
    prestations.
- pair: Transport Booking / Reservation
  diagnosis: Coopération saine
  recommendation: Engagement de capacité auprès d’un prestataire / droit interne sur une ressource pour un besoin. Des noms
    proches ne justifient pas une fusion.
- pair: Return Order / Return Disposition / Repair Order
  diagnosis: Coopération saine après U769
  recommendation: Tenir le retour / déterminer le devenir / tenir la prestation de réparation. Les scénarios racontent leur
    coopération.
- pair: Document Production / Billing / Customs Clearance
  diagnosis: Coopération saine à préserver
  recommendation: Produire ou assembler un livrable / demander émission de facture / confier une procédure douanière. Une
    pièce documentaire peut servir les deux autres sans créer leurs faits.
- pair: Operations Tracking / Service Reconciliation / Operations Visibility / Service Orders
  diagnosis: Clarification ciblée F08/F15
  recommendation: Faits intégrés / conformité et écarts / état restitué / engagement et solde individuels ; la même donnée
    consommée ne constitue pas un doublon de responsabilité.
- pair: Master Planning / Simulation / décisions spécialisées
  diagnosis: Coopération saine
  recommendation: Pilotage du plan / comparaison d’alternatives / décisions contributrices. Les quatre comportements Schedule/Run/Stop/Rerun
    ne deviennent pas des capacités ou des scénarios par cet audit.
