  editorial_superseded_checks_U797:
  - id: D02.e
    field: scope
    previous_value: |-
      Le plan porte l’échéancier des mises à jour. Plan Application peut appliquer une partie des changements. Il distingue les changements appliqués, en attente ou refusés.

      L’application peut être progressive selon cet échéancier ou sélective sur une partie des changements. Cette sélection volontaire est distincte d’une application incomplète provoquée par un refus. L’échéancier concerne la mise en application des changements ; [Schedule Planning](model:BHV097) programme le travail de planification. Ces modalités restent décrites dans Plan Application, sans sous-comportement.

      Faire appliquer les recommandations autorisées du plan commun et établir les effets effectivement pris en compte, refusés ou partiels. Vérifier leurs conditions et interdépendances au moment de l'application ; une recommandation devenue inapplicable reste visible pour réexamen. Aucun retour arrière global ni transaction atomique du plan n'est supposé.

      Les familles d'effets comprennent les liens ressources-besoins, les nouveaux apports et ajustements d'Orders, les changements autorisés d'échéanciers et de promesses et les politiques à rendre applicables. Elles décrivent le contenu de cette capacité, sans décomposition systématique. Les décisions gardent les arbitrages ; Order Management porte commandes et engagements, Inventory Management les réservations, et Policies les règles actives. Fulfilment Orchestration coordonne les prestations.

      L’application des affectations retenues par Supply Assignment consiste à matérialiser et maintenir les liens entre ressources présentes ou futures et commandes ou besoins prévisionnels identifiés, même avant toute commande. Compléter des liens existants, réaffecter ou libérer ceux qui sont modifiables restent des modalités combinables. Seule la réservation bloque les usages concurrents ; l'affectation ne crée ni réservation ni promesse. Une prévision ne devient pas une commande du seul fait d'un lien de couverture. Les protections de groupe et gels restent applicables ; préserver un lien pendant un traitement ne crée pas un gel durable.

      Exemples fictifs : affecter 40 pièces d'un arrivage à une commande puis en changer la provenance admissible ; lier 300 pièces attendues aux ventes web encore prévues en novembre. Pour des besoins de 100 et 200 et une ressource de 150, un prorata illustratif de 50 et 100 serait choisi par les décisions, puis matérialisé ici ; il ne réduit pas les demandes ni ne prescrit une politique universelle.

      [Purchase Order](model:D04.j), [Transfer Order](model:D04.k), [Consignment Fill-up Order](model:D04.r) et [les familles d’Orders](model:D04) portent les demandes et leurs changements autorisés. [les engagements portés par les Orders](model:D04) porte les propositions et engagements de satisfaction ; une affectation peut changer sans modifier la promesse, et réciproquement. [Reservation](model:D02.c) tient les engagements de réservation. [Supply Protection Policy](model:D02.b) et les autres capacités Policy mettent en vigueur les règles retenues. L'application les mobilise sans transférer leur responsabilité et sans créer un engagement fournisseur implicite.

      Le résultat et les écarts alimentent [Monitor Plan](model:BHV101) et [Adjust Plan](model:BHV016). Une sollicitation acceptée n'établit pas l'application complète ; l'application partielle ne devient pas silencieusement un nouveau plan. La réalisation physique reste distincte. Exemple fictif : un transfert de 30 pièces est pris en compte mais un achat de 70 est refusé ; conserver le transfert et le refus, rendre visible le manque et faire réexaminer les possibilités. Une politique appliquée et un transfert partiel sont également deux résultats distincts ; le reliquat reste explicite.

      Plan Application vérifie ou recueille les autorisations nécessaires à l’application des changements sélectionnés, puis fait appliquer ceux qui sont autorisés. Une autorisation ne prouve pas leur prise en compte effective. Les capacités responsables conservent l’autorisation de modifier leurs commandes, promesses ou politiques. L’autorisation peut être humaine ou fondée sur des règles, et différer selon les changements et leurs échéances ; elle ne remplace pas les contrôles des partenaires.

      Pour une commande partiellement engagée, faire examiner chaque changement à la maille de la partie concernée, selon son état réel, ses engagements, protections et dépendances. Une partie non démarrée peut être révisée sous ces conditions ; une partie engagée exige d’examiner les possibilités d’adaptation, d’arrêt ou de reprise avec Fulfilment. Conserver les effets réalisés et traiter explicitement toute correction ou opération inverse. Une livraison complète peut lier les quantités non démarrées aux quantités déjà préparées.

      Supply Assignment choisit les liens ; Plan Application en matérialise les changements autorisés et vérifie leur prise en compte. Les propriétaires des Orders, réservations et politiques conservent leur autorité. La promotion en capacité est locale au Matching et ne généralise pas ce découpage à tout Planning.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: D05.e
    field: scope
    previous_value: |-
      Déterminer les apports initiaux d’[implantation](glossary:TER079), les apports successifs de [réassort](glossary:TER080) et leurs ajustements. Chez Beaumanoir, l’alimentation continue des magasins est guidée par des seuils ; la cadence de révision, les formules et le degré d’automatisation ne sont pas imposés par ce constat. Le réapprovisionnement continu peut aussi concerner les stocks du réseau et les compléments fournisseur déjà couverts par cette capacité.

      **Politique selon les besoins datés.** Déterminer les apports nécessaires à partir des besoins nets et de leurs dates. Les besoins peuvent être traités individuellement ou regroupés dans une période lorsque les contraintes le permettent ; cette agrégation ne justifie pas un comportement par cadence. Exemple fictif : 120 pièces nécessaires à J+7, 70 utilisables et 20 attendues à temps conduisent à examiner un apport complémentaire de 30, avant contraintes de lot et de délai.

      **Politique selon un seuil et une cible.** Déterminer l’apport lorsqu’une position de stock projetée passe sous le seuil applicable, pour retrouver la cible retenue. Exemple fictif : position projetée de 50, seuil de 60 et cible de 100 conduisent à proposer 50 en l’absence d’autres besoins ou restrictions. Si les apports doivent être des multiples de 12, examiner 60 et l’excédent associé. Il ne s’agit pas d’une formule Min/Max universelle.

      [Inventory Target Optimization](model:D05.a) détermine les objectifs et seuils, qui peuvent dépendre des besoins et varier par produit, lieu et période ; ils ne sont pas présumés stables ou indépendants de la demande. [Supply Protection Policy](model:D02.b) gouverne et applique les versions opérationnelles de ces paramètres. Replenishment les utilise pour déterminer les quantités et dates d’apport. Les deux politiques ci-dessus ne forment pas une chaîne où les apports calculés par la première détermineraient les seuils de la seconde.

      Dans les deux politiques, évaluer le stock admissible, les entrées attendues à temps, les actions déjà engagées et les contraintes. Préciser l’horizon, la maille et les règles d’admissibilité ; ne pas déduire deux fois des demandes déjà intégrées à une cible ou couvrir deux fois le même manque. Une décision intègre ses calculs ; aucune capacité Calculation autonome.

      **Ajustement des apports existants.** Réexaminer les apports prévus ou engagés lorsqu’évoluent besoins, cibles ou contraintes. Recommander une augmentation, une réduction, une avance, un report ou, si pertinent, une annulation admissible ; ce n’est pas un mécanisme limité à la création de commandes supplémentaires. Exemple fictif : la cible passe de 100 à 80, alors que 30 pièces sont présentes et 70 attendues. Examiner une réduction ou un report de 20. Si l’engagement fournisseur empêche la modification, expliciter l’excédent résiduel et les options encore possibles. Aucune modification d’un Order ferme n’est déduite du seul recalcul.

      [Replenishment](model:D05.e) conserve les apports de lancement. Le réassort tient compte des apports d’implantation encore attendus, sans les recréer. [Stock Redistribution](model:D05.c) examine le rééquilibrage du stock existant ; coordonner les résultats pour éviter les doublons. Un transfert peut matérialiser un apport courant ou une redistribution selon sa finalité.

      Les résultats précisent quantités, dates et ajustements recommandés. [Order Management](model:D04) et [les familles d’Orders](model:D04) vérifient et appliquent les changements autorisés, avec les accords et protections applicables. [Demand & Supply Matching](model:D03) décide de la satisfaction des demandes et D06 orchestre les services et leur adaptation. La recommandation ne crée ni promesse, ni modification automatique d’un Order, ni mouvement physique. Une application automatisée reste possible selon les règles et autorités ; le porteur détaillé du déclenchement reste à préciser.

      U427 adopte trois comportements : Requirement-based Replenishment, Target-based Replenishment et Replenishment Adjustment. Les deux premiers rendent explicites des politiques distinctes de détermination des apports ; le troisième révise les apports existants et se combine avec les deux. Cette décomposition remplace la conclusion de non-décomposition U425 ; les codes, paramètres et formules produits ne créent pas de sous-comportement. Le point réassort de l’audit est traité, sans présumer une couverture exhaustive du marché.

      Frontière U673 : Les compléments fournisseur ne dupliquent pas les achats projetés par l’APS. Garder les arbitrages opérationnels de couverture et remonter les besoins de révision du plan externe.

      Implantation initiale : Décider les apports d’[implantation](glossary:TER079) destinés à constituer le stock de départ de chaque magasin à la date de lancement. Chez Beaumanoir, les deux saisons été/hiver constituent le contexte rapporté ; collections, capsules ou périodes plus fines sont des extensions possibles, pas des pratiques actuelles déduites. Le résultat précise produits ou variantes, magasins, quantités, dates et éventuels besoins non couverts.

      L’assortiment retenu, les objectifs de stock et les contraintes constituent les entrées. [Inventory Target Optimization](model:D05.a) conserve la détermination des cibles ; cette décision détermine les apports pour les atteindre au lancement. Examiner stock déjà présent et admissible, apports attendus à temps, conditionnements, protections et contraintes de disponibilité. Le calcul net fait partie de la décision ; ne pas compter deux fois les mêmes entrées.

      Exemple fictif : pour un lancement au 1er mars, une cible de 100 pièces, 20 pièces admissibles déjà présentes et 30 attendues à temps laissent 50 pièces à apporter. Si seulement 40 peuvent être disponibles, expliciter le manque de 10 et les options à examiner ; ne pas annoncer implicitement une promesse ni modifier la cible sans mobiliser la décision responsable. Les tailles, couleurs et conditionnements peuvent contraindre le résultat sans constituer automatiquement des comportements supplémentaires.

      Au sein de Replenishment, la finalité distingue l’implantation initiale du réassort en cours de commercialisation. Un complément tardif destiné à achever la mise en place initiale reste à qualifier selon cette finalité ; la date seule ne suffit pas à le transformer en réassort. Les apports d’implantation engagés restent visibles pour les décisions ultérieures de réassort, afin d’éviter les doublons.

      [Master Planning](model:D05.f) mobilise la décision pour ses scénarios. D04 gère les Orders nécessaires, D03 décide comment les satisfaire et D06 pilote les prestations ; retenir ces apports ne réalise ni livraison ni mise en rayon. [Plan Application](model:D02.e) conserve l’affectation des ressources aux commandes. Le choix de l’assortiment et la planification commerciale de saison ne deviennent pas des responsabilités de cette capacité.

      Frontière U673 : La frontière avec le calcul externe est la suivante : déterminer et ajuster les apports de couverture du lancement, sans recalculer l’assortiment ni le plan prévisionnel amont.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
  - id: D05.f
    field: scope
    previous_value: |-
      Cadrer le périmètre, l’horizon et les objectifs du master plan commun, puis coordonner sa construction, son suivi et ses révisions. Couvrir commandes et prévision résiduelle sans double compte, à partir des plans externes et ressources admissibles.

      [Demand Prioritization](model:D03.m) établit les priorités ; [Supply Assignment](model:D03.o) détermine les liens ressources-besoins ; [Replenishment](model:D05.e) recommande les apports et [Stock Redistribution](model:D05.c) les transferts utiles. Les capacités de Policy Optimization recommandent les cibles et protections, sans activer les politiques.

      [Simulation & Analysis](model:BHV006) compare les scénarios ; [Plan Application](model:D02.e) fait appliquer les changements autorisés. Ces capacités coopèrent au même plan sans être des sous-capacités de Master Planning. Aucun moteur unique ni ordre universel des calculs n’est imposé.

      Scope, Schedule, Run, Stop, Rerun, Monitor et Adjust décrivent les pratiques de pilotage. Arrêter un calcul n’annule pas ses effets appliqués. Adjust Plan prépare les révisions en préservant les effets acquis et en faisant examiner les impacts sur les commandes. La comparaison des décalages relève de Simulation & Analysis et le choix des liens révisés de Supply Assignment.

      Exemple : une réception retardée déclenche un réexamen ciblé ; comparer les alternatives, retenir un plan cohérent, puis faire appliquer les changements autorisés. Les confirmations restent portées par les Orders ; ATP/CTP/PTP et le réexamen de promesse relèvent d’[Order Promising](model:subdomain-order-promising). Le plan interne ne remplace pas l’APS et Fulfilment conserve les adaptations locales.

      Le [Matching Master Plan](glossary:TER100) est le plan interne commun ; les [Supply Plans](glossary:TER098) et [Demand Plans](glossary:TER099) sont des informations externes consommées. Cette séparation est propre au périmètre FLOW et ne recopie pas tous les calculs regroupés dans le master planning Microsoft.
    reason: Reprise éditoriale U797 ; ne vaut pas approbation de la nouvelle rédaction.
