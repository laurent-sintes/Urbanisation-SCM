publication_delivery:
  state: applied
  source_refs:
  - U770
  - U771
  - U835
  - U861
  summary: 'Audit lexical appliqué : glossaire et frontières cohérents, appuis marché explicités, Receiving Order et scénario
    ajoutés. U861 : commandes passives et pilotage par les tâches du workflow explicités ; identités et rattachements conservés.'
  required_nodes:
  - id: D02.e
    fields:
      scope: |-
        Déterminer quand et sur quelle partie appliquer un plan, vérifier les conditions et dépendances, puis transmettre les changements aux capacités responsables. L’application peut être immédiate, programmée, progressive ou sélective. Une application volontairement partielle se distingue d’une application incomplète après échec. Programmer les calculs du plan reste la responsabilité de [Master Planning](model:D05.f).

        [Supply Assignment](model:D03.o) choisit les liens entre ressources et besoins ; Plan Application les matérialise, les complète, les révise ou les libère. Ces liens peuvent concerner un stock présent, une arrivée attendue, une commande ou un besoin prévisionnel. Préserver temporairement un lien pendant l’application n’instaure pas un gel durable. Une affectation ne constitue ni réservation, ni promesse, ni protection de groupe.

        Exemples fictifs : réaffecter 40 pièces d’une arrivée ; relier 300 pièces à un besoin prévisionnel de novembre ; appliquer un partage de 150 pièces en lots de 50 et 100. Ce partage n’impose ni règle universelle ni réduction des besoins non couverts.

        Les familles de commandes portent leurs engagements et changements autorisés, y compris achat, transfert et consignation. [Reservation](model:D02.c) bloque les usages concurrents ; [Policies](model:subdomain-policies) rend les règles applicables. Plan Application ne confirme pas à leur place une commande, un engagement fournisseur ou une nouvelle politique. Les décisions de promesse et de programmation restent chez leurs responsables.

        Suivre les changements acceptés, refusés et encore attendus. Une acceptation technique ne prouve pas l’effet métier ni l’exécution physique. Exemple fictif : un transfert de 30 pièces est accepté, un achat de 70 est rejeté ; conserver ce résultat partiel et traiter les 70 restantes. Le suivi permet d’ajuster la suite sans rollback global implicite ni redéfinition silencieuse du plan.

        L’autorisation peut être humaine ou fondée sur des règles selon le changement, les échéances, les partenaires et les contrôles applicables. Examiner chaque portion d’une commande partiellement engagée : une portion non commencée n’est pas automatiquement modifiable. [Fulfilment Orchestration](model:D06) traite les adaptations, arrêts et reprises de réalisation. Conserver les faits déjà réalisés et expliciter tout effet inverse autorisé. Une exigence de livraison complète peut lier plusieurs portions.

        Les adaptations locales de réalisation ne passent pas toutes par un nouveau plan. Lorsqu’elles nécessitent un nouvel arbitrage entre demandes et ressources, les capacités de décision concernées le produisent avant son application.
  - id: D05.e
    fields:
      scope: |-
        Couvrir l’implantation initiale et le réassort pendant la commercialisation, à partir du réseau de stocks et des compléments fournisseurs possibles. Dans le contexte Beaumanoir documenté, le réassort continu des magasins utilise des seuils ; cela ne fixe ni formule, ni cadence, ni automatisation universelle.

        Le calcul fondé sur les besoins déduit les quantités admissibles et attendues à temps. Exemple fictif : un besoin de 120 pièces à J+7, avec 70 disponibles et 20 attendues, laisse 30 pièces à couvrir avant contraintes de lot et de délai. Les besoins peuvent être regroupés par période sans créer un comportement par cadence.

        Le calcul fondé sur une cible détermine l’apport nécessaire quand la position passe sous le seuil. Exemple fictif : avec 50 pièces projetées, un seuil de 60 et une cible de 100, l’apport calculé est de 50. Un conditionnement par 12 conduit à examiner 60 pièces et leur excédent. Ce mécanisme n’impose pas une règle seuil de déclenchement et cible de réassort à toutes les situations.

        [Inventory Target Optimization](model:D05.a) détermine les cibles et seuils ; [Supply Protection Policy](model:D02.b) tient les valeurs applicables ; [Replenishment](glossary:TER074) détermine les apports. Tenir compte des produits, lieux, périodes, stocks admissibles, arrivées à temps, engagements, protections et contraintes. Ne pas déduire deux fois une arrivée ni recompter un besoin déjà intégré dans la cible. Le calcul net fait partie de cette décision.

        Ajuster aussi les apports existants : augmenter, réduire, avancer, reporter ou annuler ce qui peut l’être. Exemple fictif : la cible passe de 100 à 80, avec 30 pièces présentes et 70 attendues. Examiner une réduction ou un report de 20 ; si l’engagement fournisseur l’interdit, rendre l’excédent visible. La décision ne modifie pas automatiquement une commande ferme.

        Les trois comportements — calcul par besoins, calcul par cible et ajustement — peuvent se combiner sans séquence obligatoire. Préserver les apports déjà engagés. [Stock Redistribution](model:D05.c) arbitre la redistribution du stock existant ; un transfert peut servir les deux finalités, sans doubler l’apport. Les propositions d’achat du domaine [Demand & Supply Planning](model:domain-plan) sont prises en compte ; une révision du calcul amont retourne à ce domaine.

        Pour une implantation, déterminer produits, variantes, quantités, dates et besoins non couverts de chaque point. Les assortiments et cibles sont des entrées, non des choix refaits ici. Le contexte documenté distingue saisons été et hiver ; il ne suffit pas à conclure à un fonctionnement par capsules. Tailles, couleurs et conditionnements contraignent le résultat sans créer automatiquement des comportements.

        Exemple fictif : au 1er mars, une cible de 100 pièces, 20 présentes et 30 attendues laissent 50 à apporter. Si seules 40 sont accessibles, expliciter les 10 manquantes et les options, sans changer la cible ni annoncer une promesse. Un complément tardif destiné à achever l’implantation reste qualifié par cette finalité. Les apports initiaux engagés restent visibles pour le réassort ultérieur.

        [Master Planning](model:D05.f) mobilise cette décision dans ses scénarios. Les commandes portent les apports et changements autorisés ; [Supply Assignment](model:D03.o) choisit les affectations et [Plan Application](model:D02.e) les matérialise. [Fulfilment Orchestration](model:D06) coordonne la réalisation. Le résultat exprime quantités, dates, ajustements et manques ; il ne crée pas à lui seul une commande, une promesse ou une livraison. Une application automatique reste possible selon les règles et responsabilités autorisées. Le choix de l’assortiment, la planification commerciale, la prévision amont et la mise en rayon gardent leurs propres responsabilités.
  - id: D05.f
    fields:
      scope: |-
        Cadrer le périmètre, l’horizon et les objectifs du master plan commun, puis coordonner sa construction, son suivi et ses révisions. Couvrir commandes et prévision résiduelle sans double compte, à partir des plans externes et ressources admissibles.

        [Demand Prioritization](model:D03.m) établit les priorités ; [Supply Assignment](model:D03.o) détermine les liens ressources-besoins ; [Replenishment](model:D05.e) recommande les apports et [Stock Redistribution](model:D05.c) les transferts utiles. Les capacités de Policy Optimization recommandent les cibles et protections, sans activer les politiques.

        [Simulation & Analysis](model:BHV006) compare les scénarios ; [Plan Application](model:D02.e) fait appliquer les changements autorisés. Ces capacités coopèrent au même plan sans être des sous-capacités de Master Planning. Aucun moteur unique ni ordre universel des calculs n’est imposé.

        Scope, Schedule, Run, Stop, Rerun, Monitor et Adjust décrivent les pratiques de pilotage. Arrêter un calcul n’annule pas ses effets appliqués. Adjust Plan prépare les révisions en préservant les effets acquis et en faisant examiner les impacts sur les commandes. La comparaison des décalages relève de Simulation & Analysis et le choix des liens révisés de [Supply Assignment](glossary:TER017).

        Exemple : une réception retardée déclenche un réexamen ciblé ; comparer les alternatives, retenir un plan cohérent, puis faire appliquer les changements autorisés. Les confirmations restent portées par les [Orders](glossary:TER012) ; [ATP](glossary:TER044)/[CTP](glossary:TER045)/[PTP](glossary:TER068) et le réexamen de promesse relèvent du groupe [Order Promising](glossary:TER124). Le plan interne ne remplace pas la planification externe et [Fulfilment](glossary:TER085) conserve les adaptations locales.

        Le [Matching Master Plan](glossary:TER100) est le plan interne commun ; les [Supply Plans](glossary:TER098) et [Demand Plans](glossary:TER099) sont des informations externes consommées. Cette séparation est propre au périmètre FLOW et ne recopie pas tous les calculs regroupés dans le master planning Microsoft.
  - id: D07.c
    fields:
      scope: |-
        Rapprocher production, préparation, expédition, réception, consommation et résultats documentaires des prestations demandées et engagées. Les quantités manquantes, écarts et résultats partiels sont qualifiés à la maille pertinente.

        Exemple : 80 unités sont reçues sur les 100 attendues ; qualifier l’écart de prestation et en transmettre les faits à la commande concernée. [Order Management](model:D04) conserve le reliquat de l’[Order](glossary:TER012) et [Inventory Management](model:D01) la représentation des mouvements de stock. Les cinq contributions existantes vers les capacités par type d’[Order](glossary:TER012) sont conservées, avec leur statut proposé. Operations Tracking intègre les faits ; Operations Visibility restitue l’avancement ; Service Reconciliation qualifie le réalisé au regard de l’attendu.

        Frontière : Reliquat prestation différent du reliquat [Order](glossary:TER012) ; le rapprochement bancaire ou comptable reste externe.

        Fournir les écarts aux [Orders](glossary:TER012) et les faits à Inventory ; ne pas tenir à leur place le reliquat commande ou le stock.

        Fournir les faits ou écarts qualifiés à [Service Order Management](model:subdomain-service-orders) pour les suites des ordres de prestation ; ne pas dupliquer la tenue de leurs engagements individuels.

        Pour une prestation d’encaissement, rapprocher la demande du résultat métier communiqué par le service financier : montant confirmé, partiel, rejeté ou non encore qualifié. Ce contrôle du résultat confié ne certifie ni écriture comptable, ni règlement bancaire, ni affectation à une créance. Une notification dupliquée ne produit pas un second résultat.
  - id: D06.d
    fields:
      definition: Coordonner le déclenchement, les dépendances et la progression des prestations jusqu’aux résultats attendus,
        en tenant compte des faits d’exécution et des adaptations autorisées.
      scope: |-
        Coordonner le déclenchement et l’enchaînement des prestations du plan retenu, en tenant compte de leurs dépendances, des prises en charge et des faits d’exécution. Mobiliser les familles de [Service Orders](glossary:TER066) pour tenir les demandes et leurs évolutions.

        Exemple : coordonner la préparation, la disponibilité du document et la collecte. Si la décision d’adaptation retient un autre transporteur, coordonner la modification des prestations concernées et leur nouvel enchaînement.

        La détermination de la variation du plan appartient à Process Adaptation Decision. L’orchestration peut lui transmettre un aléa, mais ne porte plus cette décision dans sa propre définition. Les exécutants conservent l’organisation de leurs opérations internes. Aucun produit logiciel particulier, contrôle humain systématique ou rollback physique universel n’est présumé.

        Frontière : Décision [Process Adaptation Decision](model:D06.f) séparée ; pas de rollback physique ni seconde promesse.

        Convention U409 : le Process orchestre des Services. Les [Tasks](glossary:TER089) expriment les contributions au processus ; les services réalisent les prestations sollicitées, humaines, physiques ou numériques. Un appel informatique est un moyen de sollicitation ou de feedback, pas le service métier lui-même. Process Orchestration coordonne la progression ; Process Adaptation Decision choisit les adaptations ; Operations Tracking intègre les faits d’exécution ; Operations Visibility restitue leur avancement et Process Visibility en expose la contribution à la progression du processus. Les exécutants gardent leurs opérations internes. Le périmètre Supply et les responsabilités des sous-domaines restent inchangés ; aucun produit logiciel particulier ou nouveau niveau descriptif imposé.

        Distinguer le plan d’exécution coordonné du [master plan de matching](glossary:TER100) arbitré dans [Availability](glossary:TER112).

        [Service Order Management](model:subdomain-service-orders) tient le cycle et les engagements des ordres de prestation. L’orchestration utilise leurs réponses et coordonne les conditions d’activation et dépendances ; elle ne recrée pas leur cycle.

        U706/U709 : Coordonner aussi les prestations exécutées à distance : solliciter le service, attendre son résultat métier et poursuivre le flux selon ce résultat. Une acceptation du déclenchement ne vaut pas réalisation.

        Appliquer les attentes et libérations retenues par [Service Order Release Decision](model:service-order-release-decision), puis suivre la prise en charge des ordres. Un lot ne fusionne pas leurs identités. Distinguer une information anticipée de l’autorisation de lancement ; ne pas considérer la transmission comme preuve de réalisation.

        Coordonner les prestations dans le mandat reçu d’[Order Workflow Orchestration](glossary:TER129), qui conduit le parcours de la commande. Une dépendance entre préparation et collecte ne se confond pas avec une attente de confirmation client dans ce parcours. Retourner les résultats et aléas utiles à [Order Workflow Sentry](glossary:TER127) ; ne pas modifier seul les engagements de la commande.

        Exécuter les tâches de coordination confiées par le moteur de [Reactive Workflow Management](glossary:TER125). Les [Service Orders](glossary:TER066) restent des commandes passives ; leurs états et résultats alimentent le suivi conduit par les tâches du workflow. La coordination locale ne choisit pas un nouveau parcours de commande hors du mandat reçu.
  - id: service-order-receiving
    fields:
      name: Receiving Order
      definition: Porter les demandes de réception de marchandises confiées aux exécutants, leurs quantités et conditions
        attendues, leurs engagements et les résultats des réceptions partielles, refusées ou non conformes.
      scope: |-
        Commande passive d’une prestation définie dans le [Service Catalog](model:D14) : elle porte les exigences, paramètres, engagements acceptés, état, résultat et reste à réaliser. Elle ne prend aucune décision et ne produit pas elle-même les activités de suivi. Le moteur de [Reactive Workflow Management](glossary:TER125) produit les [Tasks](glossary:TER089) qui pilotent sa sollicitation, ses attentes et les suites autorisées ; [Fulfilment Orchestration](model:D06) exécute le mandat de coordination confié. Le prestataire réalise la prestation et organise ses opérations internes. Passif ne signifie ni sans état ni sans règles de validité des transitions.

        Porter l’origine attendue, les articles et quantités, le lieu, les créneaux, les consignes de prise en charge et les preuves attendues. Suivre acceptation, révisions, annulation, réception partielle et clôture avec le reste à réaliser. Une annonce d’arrivée ou un document ne prouve pas la réception.

        Une demande de réception peut être liée à un [Purchase Order](glossary:TER070), [Transfer Order](glossary:TER071), [Return Order](glossary:TER072) ou apport consigné ; elle ne remplace pas leurs engagements. Le prestataire reçoit physiquement et organise ses tâches internes. Une inspection autonome peut être confiée à [Inspection Order](model:service-order-inspection) ; un contrôle intégré demeure dans la réception. [Receiving Order](model:service-order-receiving) ne décide pas du devenir d’un retour et ne garantit pas que le stock est vendable.

        [Fulfilment Orchestration](model:D06) coordonne les prestations. Operations Tracking capte leur résultat et Service Reconciliation qualifie l’écart ; [Receiving Order](model:service-order-receiving) tient le solde de sa prestation. Inventory Tracking et [Inventory Ledger](glossary:TER056) prennent en compte les faits de stock reconnus. L’instruction de réception ne crée ni mouvement, ni changement automatique de propriété, ni nouvel achat.

        Créer cet [Order](glossary:TER012) lorsqu’une réception est explicitement confiée et suivie comme prestation. Recevoir seulement une notification ne justifie pas un ordre artificiel. Aucune famille supplémentaire de rangement ou de stockage ni réalisation Beaumanoir n’est déduite.
      nature: action
