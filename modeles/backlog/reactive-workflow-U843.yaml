agreement_scope: Noms, définitions présentées, catégorie et rattachement des quatre capacités à Order Management. Frontières
  convenues avec Policies, familles de commandes et Fulfilment. Les types, formulations détaillées, comparaisons, relations
  transversales et contributions de scénarios rédigés après l’accord restent proposés.
retained: Toutes les capacités et identités de Fulfilment sont conservées ; aucun transfert général ni comportement artificiel.
realization_limit: Le référentiel de Tasks, la sentinelle, l’interprétation de contexte et la construction dynamique évoqués
  par Laurent sont une intention de réalisation. Aucune implantation Camunda, aucune technologie ni architecture logicielle
  imposée par le catalogue métier.
market_position: Microsoft Dynamics documente les flux d’orchestration ; SAP S/4HANA les activités, conditions et blocs flexibles.
  Recouvrements partiels ; la séparation en quatre capacités et le nom Sentry sont des choix FLOW. Camunda apporte des moyens
  possibles, sans prouver ce découpage métier ni une génération arbitraire de parcours.
