findings:
- id: F01
  finding: 'Le socle de description courte existe déjà : fields.definition dans les 348 fiches publiées.'
  evidence: 6 à 60 mots, médiane 17 ; une seule définition dépasse 40 mots. Aucun champ short_description ou long_description
    renseigné.
  recommendation: Conserver les définitions, sans migration ou réécriture générale pour les rebaptiser description courte.
- id: F02
  finding: La fiche possède déjà un contenu riche structuré.
  evidence: 348 périmètres, 323 finalités, 92 listes locales examples représentant 101 exemples, 344 listes market_comparisons
    et 136 market_inspiration.
  limit: '92 listes examples ne signifie pas seulement 92 fiches illustrées : le lecteur réutilise aussi des exemples partagés
    et historiques contenus dans scope ; les scénarios sont autonomes.'
  recommendation: Assembler une lecture pédagogique à partir de ce socle, en ajoutant seulement le contenu explicatif manquant.
- id: F03
  finding: Les exemples existants sont déjà des objets, pas seulement des paragraphes.
  evidence: ReaderExample accepte titre, situation, résultat, enseignement, contraintes, options et contributions ; les parcours
    ont leurs étapes et résultats.
  recommendation: Privilégier un cas concret simple et son résultat ; réutiliser le catalogue de scénarios pour le parcours
    complet.
- id: F04
  finding: Les infobulles métier ne partagent pas un contrat de sélection unique.
  evidence: MapNodeButton privilégie purpose, issu de finality, puis definition. ReferenceLink peut privilégier short_description,
    purpose ou definition selon les options. MetaTypeLabel explique le type et non la fiche concrète.
  recommendation: Unifier à terme la résolution de la définition métier courte, tout en gardant les aides sur les types distinctes.
    Ce constat de sélection ne constitue pas un audit complet de leur accessibilité.
- id: F05
  finding: Une explication en langage courant et des frontières concrètes apportent davantage qu’un allongement uniforme.
  evidence: Inventory Management distingue déjà dans scope stock, propriété, détention et engagements ; Process Mining renvoie
    déjà à Process Ledger mais sa définition suppose de comprendre traces corrélées.
  recommendation: Expliquer les mots et l’effet concret avec un cas. Ajouter un contre-exemple utile pour distinguer un voisin.
- id: F06
  finding: Une référence à un logiciel peut aider certains lecteurs mais ne définit pas la responsabilité métier.
  recommendation: Afficher produit ou composant, partie illustrée, proximité, limites, édition et source. Réutiliser les qualifications
    du catalogue applicatif et des comparaisons ; ne pas en déduire un usage installé chez Beaumanoir.
- id: F07
  finding: Des références stables sont nécessaires pour sélectionner des éléments existants.
  evidence: 4 des 101 exemples locaux ont un id ; aucune entrée market_comparisons n’a d’id. Les scénarios et parcours possèdent
    déjà une identité.
  recommendation: Pour le pilote, identifier seulement les exemples et comparaisons à référencer, ou choisir un objet de catalogue
    déjà identifié. Ne pas utiliser une position de tableau comme identité ; ne pas recopier la même preuve dans une deuxième
    liste.
- id: F08
  finding: Le schéma actuel ferme fields aux attributs inconnus.
  evidence: 'urbanism.schema.json : fields.additionalProperties=false ; definition, finality et scope sont des chaînes, examples
    et market_comparisons ont leur contrat propre.'
  recommendation: Une éventuelle adoption exigera un contrat explicite pour l’objet pédagogique, validation des références,
    publication figée et affichage dédié.
attribute_assessment:
- attribute: Définition courte
  priority: core
  source: fields.definition
  decision_proposed: Conserver la valeur actuelle ; repère bref dans carte, arbre, lien et tête de fiche.
- attribute: Explication en langage courant
  priority: core
  source: Nouveau texte explicatif
  decision_proposed: Deux à quatre phrases sur le service concret rendu. Éviter répétition de la définition et jargon non
    expliqué ; longueur indicative, sans remplissage ni troncature automatique.
- attribute: À quoi cela sert
  priority: reuse
  source: fields.finality
  decision_proposed: Réutiliser la finalité existante ; une lacune doit être qualifiée, pas comblée par une promesse générique.
- attribute: Exemple concret
  priority: core
  source: fields.examples ou scénario/parcours explicitement lié
  decision_proposed: Situation → contribution propre de la fiche → résultat observable. Un exemple court visible ; autres
    cas à la demande. Mention Illustration FLOW pour un cas construit, sans attribution à Beaumanoir.
- attribute: Frontières et confusions fréquentes
  priority: core_when_ambiguous
  source: fields.scope et voisins explicitement documentés
  decision_proposed: Une ou deux distinctions ciblées avec liens vers les voisins. La formulation doit rester cohérente avec
    leurs fiches et le glossaire.
- attribute: Informations reçues et produites
  priority: optional
  source: Relations qualifiées et contributions documentées
  decision_proposed: Montrer seulement si cela éclaire la responsabilité. Ne pas reconstruire automatiquement des flux depuis
    la hiérarchie.
- attribute: Repères du marché
  priority: optional
  source: market_comparisons, market_inspiration et catalogue applicatif
  decision_proposed: Un exemple pertinent peut suffire au premier niveau ; conserver les deux familles Microsoft Dynamics
    et SAP S/4HANA dans le dossier de comparaison, ou leurs lacunes explicites. Le détail reste consultable.
- attribute: Mots à comprendre
  priority: reuse
  source: Glossaires de la même publication
  decision_proposed: Liens contextuels vers les notions, pas un deuxième glossaire manuel par fiche.
- attribute: Procédure complète, FAQ exhaustive, produit unique obligatoire
  priority: not_recommended_as_mandatory
  source: Sans objet
  decision_proposed: Ne pas les imposer à toutes les fiches. Une procédure n’est pas une capacité ; une longue liste de champs
    augmente la rédaction sans garantir la compréhension.
proposed_logical_object:
  status: Illustration de contrat à arbitrer ; non inséré dans le schéma ni le modèle.
  canonical_short_description: fields.definition
  pedagogical_description:
    explanation: Texte nouveau, bref et accessible.
    example_refs: Références optionnelles aux exemples ou scénarios identifiés, rendus sous forme situation/contribution/résultat.
    distinctions: Distinctions utiles, avec identifiant du voisin et explication ; cohérentes avec scope.
    market_comparison_refs: Références optionnelles aux preuves qualifiées existantes ; identité des cibles à définir selon
      F07.
  assembled_without_duplication:
  - finality
  - scope
  - relations documentées
  - glossaire
  - sources et qualifications existantes
  meaning: Bloc éditorial rattaché à la fiche existante, sans nouveau nœud de hiérarchie, autonomie métier ni parent supplémentaire.
  not_a_decision: La proposition ne valide aucun nouveau champ, exemple ou rapprochement marché.
presentation:
  short_help: Garder une aide courte au survol et au focus ; pas de description longue ni liens interactifs dans un tooltip.
  recommended_first_delivery: 'Dans la fiche existante, placer Comprendre ce périmètre après la définition : explication,
    un exemple et une distinction visibles. Conserver détails des frontières et sources dans les rubriques appropriées.'
  from_map: Action explicite Comprendre ouvrant la même fiche sur ce bloc ; préserver sélection, cadrage, position et publication
    au retour. Ne pas détourner le clic existant de navigation ou de sélection.
  optional_later: Un panneau de lecture persistant sur grand écran peut éviter un aller-retour, si les tests montrent ce besoin
    ; il doit réserver son espace et conserver la carte lisible. Sur mobile, privilégier la fiche lisible avec retour plutôt
    qu’une petite fenêtre.
  advanced_material: Références détaillées et variantes à la demande. Ne pas cacher toute l’explication nécessaire à un débutant
    derrière un accordéon ou un mode débutant à découvrir.
  accessibility:
  - Accès au clavier et au tactile
  - Bouton nommé et état explicite
  - Fermeture et retour du focus prévisibles pour un panneau
  - Liens vers les glossaires et sources navigables
  - Contenu lisible sur écran étroit et zoomé
depth_policy:
- levels: Enterprise Architecture et Business System
  guidance: 'Courte orientation : raison d’être du périmètre, domaines inclus et coopérations utiles. Pas d’équivalent logiciel
    unique imposé.'
- levels: Domain et Subdomain
  guidance: 'Priorité forte : rôle, exemple concret et frontières. Enrichir d’abord les points d’entrée du cœur Supply et
    ses adhérences Commerce/Procurement.'
- levels: Business Area
  guidance: Expliquer la responsabilité et ce qu’elle regroupe. Un périmètre de contexte terminal est éligible à une bonne
    explication, sans lui inventer de capacités.
- levels: Capability
  guidance: Bon niveau pour une explication détaillée et des repères produits précis, selon le besoin et la profondeur déjà
    déclarée.
- levels: Business Reference
  guidance: Expliquer données décrites, autorité locale, sources et usages documentés. Illustration de données plutôt que
    procédure artificielle.
- levels: Behavior
  guidance: Enrichissement sélectif, là où la différence de mode d’action est difficile à comprendre ; bénéfice et cas comparatif.
    Pas de reprise systématique des 74 comportements ni de sous-comportements.
- levels: Relations et scénarios
  guidance: Les mobiliser pour comprendre la coopération et le parcours ; pas un nouveau niveau hiérarchique ni un audit général
    de ces objets dans ce lot.
