scope:
  subject: Fiches métier concrètes ; pas les définitions des types du métamodèle.
  questions:
  - Pertinence des attributs
  - Compréhension par les débutants
  - Présentation et infobulles
  - Niveaux et ordre d’enrichissement
  canonical_changes: false
  agreement: false
  publication: false
  limitations:
  - Audit documentaire et statique, sans séance d’observation de débutants.
  - Aucune certification globale d’accessibilité ni audit exhaustif de la pertinence des comparaisons marché existantes.
  - Le code frontend comporte des travaux extérieurs en cours, préservés. Les constats de code ne sont pas une observation
    visuelle du site déployé.
