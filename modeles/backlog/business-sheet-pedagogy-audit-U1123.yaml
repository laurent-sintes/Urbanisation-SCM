  sequence:
  - Valider le contrat minimal et le mode de lecture
  - Rédiger et tester les huit fiches
  - Généraliser aux domaines et sous-domaines prioritaires
  - Compléter les capacités et périmètres contextuels selon les difficultés observées
  - Enrichir les comportements utiles seulement
inventory_illustration:
  status: Illustration FLOW proposée, non ajoutée à la fiche et sans nouveau fait Beaumanoir.
  node_id: D01
  explanation: Cette responsabilité tient une référence fiable des produits en stock et des faits qui la font évoluer. Elle
    aide à distinguer les quantités présentes, les engagements déjà pris et les changements de propriétaire autorisés. La
    manipulation physique des colis est une autre responsabilité.
  example:
    situation: Un prestataire confirme la réception de vingt robes.
    contribution: Le fait reconnu met à jour la référence de stock et conserve son origine et sa date.
    result: On peut expliquer la présence de ces vingt unités et retracer une correction ultérieure.
    boundary: Cette confirmation ne décide pas à elle seule de la propriété ni d’une promesse à un client.
  market_illustrations:
  - product: Microsoft Dynamics 365 Supply Chain Management
    element: Inventory transaction details
    scope: Consultation d’une transaction, dimensions et références physiques/financières.
    relationship: Exemple partiel de réalisation, pas équivalence du sous-domaine D01.
    source: MS-INVENTORY
  - product: SAP S/4HANA Cloud Public Edition
    element: Inventory Management, Retail and Fashion and Vertical Business
    scope: Tenue des stocks et preuve des mouvements ; valorisation et intégrations financières dépassent cette seule illustration.
    relationship: Exemple partiel, sans adoption du découpage SAP ni preuve d’usage installé.
    source: SAP-INVENTORY
external_evidence:
- id: UX-NNG
  title: Progressive Disclosure
  url: https://www.nngroup.com/articles/progressive-disclosure/
  consulted_on: '2026-10-20'
  passage: Article du 3 décembre 2006, principe et bénéfices.
  finding: Distinguer le premier niveau utile des détails spécialisés.
  limit: Recommandation générale de conception, pas preuve d’efficacité dans Atlas ni promesse chiffrée.
- id: UX-GOVUK
  title: Details — GOV.UK Design System
  url: https://design-system.service.gov.uk/components/details/
  consulted_on: '2026-10-20'
  passage: When to use / When not to use / Research on this component.
  finding: Ne pas cacher une information nécessaire à la majorité des utilisateurs ; les aides repliées peuvent être peu découvertes.
  limit: Contexte de services publics ; adaptation à éprouver sur une cartographie.
- id: UX-WAI
  title: Tooltip Pattern — WAI APG
  url: https://www.w3.org/WAI/ARIA/apg/patterns/tooltip/
  consulted_on: '2026-10-20'
  passage: About This Pattern / Keyboard Interaction.
  finding: Le tooltip ne reçoit pas le focus ; un contenu comportant des contrôles navigables appelle un autre pattern.
  limit: Pattern en cours de travail, sans consensus du groupe selon son propre avertissement ; ne pas le présenter comme
    une norme définitive.
- id: UX-WCAG
  title: Understanding SC 1.4.13 — Content on Hover or Focus
  url: https://www.w3.org/WAI/WCAG22/Understanding/content-on-hover-or-focus.html
  consulted_on: '2026-10-20'
  passage: 'Critère et explications : dismissible, hoverable, persistent.'
  finding: Un enrichissement au survol doit conserver ces propriétés ; préférer une lecture explicite prévisible pour un contenu
    long.
  limit: Le document Understanding est informatif ; cet audit statique ne certifie pas la conformité d’Atlas.
- id: MS-INVENTORY
  title: Inventory transaction details
  url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-transactions-details
  consulted_on: '2026-10-20'
  passage: Last updated 2025-11-11 ; Open the Transaction details page / FastTabs overview.
  finding: Transactions avec références sources et dimensions ; distinction d’éléments physiques et financiers.
  limit: Documentation produit évolutive, non preuve d’installation ni de couverture intégrale de D01.
- id: SAP-INVENTORY
  title: Inventory Management — Retail and Fashion and Vertical Business
  url: https://help.sap.com/docs/SAP_S4HANA_CLOUD/64609d0ecac54654b0837cba34555b82/2bdcc4530b29b44ce10000000a174cb4.html?locale=en-US
  consulted_on: '2026-10-20'
  passage: Version affichée 2608 ; Use / Integration / Features.
  finding: Gestion des stocks et document pour chaque mouvement ; articulation avec Warehouse Management et la comptabilité.
  limit: 'Sections consultées dans l’extrait indexé primaire retourné par la recherche ; ouverture HTML directe sans corps
    exploitable. La note de page mentionne également 2602 : version de l’environnement client non déduite. Blog SAP complémentaire
    inaccessible (403), non utilisé comme preuve.'
implementation_if_adopted:
- Étendre le contrat fermé de fields, les types du lecteur et les validations sans modifier les publications historiques.
- Définir les identifiants des seules références pédagogiques choisies ; vérifier leur résolution et la qualification des
  sources.
- Conserver définition, périmètre, finalité et glossaire cohérents ; aucun accord historique ne s’étend automatiquement au
  nouveau bloc.
- Exporter le contenu avec son snapshot ; aucune synthèse à la volée depuis le backlog pour une publication ancienne.
- Réutiliser le même bloc dans la fiche et tout aperçu éventuel, avec une aide courte homogène dans carte et liens.
- Tester mobile, clavier, retour à la carte, liens et absence d’enrichissement courant dans l’historique.
glossary_check:
  business: Structure et sens existants consultés à travers le snapshot ; pas de modification de termes requise par une demande
    d’audit.
  methodological: Descriptions de types distinctes des fiches concrètes ; aucun nouveau type métier ni niveau proposé.
