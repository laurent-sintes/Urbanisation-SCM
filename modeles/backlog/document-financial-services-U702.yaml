conclusion: Élargissement recommandé des prestations orchestrées aux documents, au dédouanement et à la facturation ; encaissement
  conditionné à une responsabilité active. Ne pas confondre processus SCM complet et propriété de toutes ses fonctions financières.
proposals:
- name: Document Production Order
  recommendation: applied_U709_with_stated_boundaries
  result: Obtenir un document ou dossier logistique conforme aux données et exigences confiées, disponible et transmis aux
    destinataires attendus.
  sources:
  - ELM699
  - ELM700
  boundary: La réception, le mouvement de stock et les faits douaniers ne sont pas créés par le document. Mettre en forme
    ou joindre une facture existante ne vaut pas émettre une créance.
  condition: Order autonome seulement si prestation explicitement confiée et suivie ; une sortie automatique de réception
    ne crée pas systématiquement un Order.
  benefit: Rendre visibles délai, complétude, rejet et reprise du livrable documentaire.
  naming_limit: Nom proposé FLOW ; les sources parlent de shipping documents et goods receipt slip, pas d’une famille normalisée
    Document Production Order.
  canonical_id: service-order-document-production
- name: Customs Clearance Order
  recommendation: applied_U709_with_stated_boundaries
  result: Confier et suivre une prestation de dédouanement pour des marchandises, depuis le dossier jusqu’au résultat de la
    procédure et au traitement des écarts.
  sources:
  - ELM703
  - ELM704
  boundary: La production du dossier est un moyen. Le prestataire traite la procédure ; l’autorité conserve sa décision. La
    politique globale de conformité commerce international n’est pas absorbée par cet Order.
  benefit: Distinguer dossier prêt, déclaration traitée et marchandises effectivement libérées.
  naming_limit: Customs clearance est établi ; suffixe Order et maille capacité sont une adaptation FLOW.
  canonical_id: service-order-customs-clearance
- name: Billing Order
  recommendation: applied_U709_with_stated_boundaries
  result: Demander et suivre la facturation des éléments éligibles d’une commande ou prestation, avec confirmation, rejet
    et correction.
  sources:
  - ELM698
  - ELM701
  boundary: La responsabilité financière d’émission, des taxes, de la créance et de la comptabilisation reste chez le service
    de facturation. FLOW porte la demande, les références et la progression nécessaire au flux.
  benefit: Éviter une commande livrée dont la facturation nécessaire reste sans suivi.
  naming_limit: Billing services est documenté ; Billing Order est une proposition locale, pas une nomenclature interéditeurs.
  canonical_id: service-order-billing
- name: Payment Collection Order
  recommendation: applied_U709_with_stated_boundaries
  result: Demander et suivre une opération d’encaissement rattachée à la commande, lorsque FLOW en pilote effectivement le
    déclenchement et les suites.
  sources:
  - ELM701
  - ELM702
  - ELM705
  boundary: Distinguer autorisation, capture, règlement reçu et affectation à une créance. Le service financier ou de paiement
    exécute ; comptabilité, trésorerie, rapprochement et recouvrement des impayés ne sont pas automatiquement inclus.
  condition: 'Si FLOW ne fait que recevoir un statut payé ou une autorisation de poursuivre, conserver une dépendance et un
    statut : pas d’Order artificiel.'
  benefit: Coordonner les étapes financières qui conditionnent l’exécution sans perdre les échecs ou paiements partiels.
  naming_limit: Collection est ambigu avec recouvrement des impayés ; nom provisoire à préciser avec le résultat effectivement
    confié. Autorisation carte seule ne vaut pas encaissement.
  canonical_id: service-order-payment-collection
model_integration:
  service_catalog: Offres, résultats, conditions et fournisseurs des services.
  service_order_management: Demandes confiées et engagements acceptés ; les nouveaux Orders proposés restent ici.
  fulfilment_orchestration: Coordonne le déclenchement et l’attente ; Operations Tracking / Process Tracking captent avancement
    et résultat métier des services distants ; Process Orchestration organise la suite. Retour des faits à Service Order Management
    pour le cycle des Orders.
  order_management: Commande entrante, promesse et états nécessaires ; pas de déplacement des demandes de services vers ce
    sous-domaine.
  matching: Pas d’intégration de comptabilité ou trésorerie dans le master plan de matching.
  categories: 'Documents, Douane et Services financiers liés aux commandes : suggestions de présentation uniquement, non affectées.'
  example: 'Exemple fictif fashion : dossier export prêt, procédure douanière suivie, transport, confirmation de livraison,
    demande de facturation et, si confiée à FLOW, demande d’encaissement. Aucun ordre universel imposé : facturation et paiement
    peuvent précéder le départ selon le contrat.'
tradeoffs:
- Un seul Document Order pour tout masquerait la différence entre produire une pièce, obtenir un dédouanement et encaisser.
- Absorber toute la Finance élargirait fortement le domaine sans preuve de bénéfice dans le périmètre étudié.
- Une famille ne doit pas naître de chaque format documentaire ou étape technique.
- SCOR est un cadre de processus ; les suites éditeurs sont des réalisations. Aucun ne prescrit directement notre découpage.
remote_execution_clarification:
  source_refs:
  - U704
  - U705
  canonical_check:
  - D06.d
  - D07.d
  - BHV082
  - D07.b
  principle: Une demande de service peut déclencher un processus exécuté ailleurs et rester ouverte jusqu’à réception de son
    résultat métier.
  responsibilities:
    service_order_management: Porte la demande, les engagements et le cycle de l’Order ; met à jour son état à partir des
      résultats qualifiés.
    process_orchestration: Coordonne le déclenchement, l’attente du résultat et la poursuite du flux.
    operations_tracking: Capte les faits et résultats des services distants ; Process Tracking les relie à la progression
      du processus.
    executor: Exécute le processus confié et fournit le retour de fin et son résultat.
  completion: L’acceptation de la demande ou l’accusé de réception du déclenchement ne valent pas fin de la prestation. La
    notification de fin doit identifier la demande et le résultat métier, y compris échec ou résultat partiel ; une fin technique
    ne prouve pas un encaissement réussi.
  scope: Précision du fonctionnement déjà couvert ; pas de nouvelle capacité de suivi, pas de réalisation financière imposée
    dans le domaine.
  market_support:
  - ELM701
  - ELM705
  market_comparison: Les services Oracle Create Billing Lines et Wait for Billing documentent demande et attente de retour
    ; l’intégration Payments confirme un exécutant spécialisé. La généralisation à tous les services distants est un choix
    cohérent du modèle FLOW, pas une taxonomie imposée par ces produits.
