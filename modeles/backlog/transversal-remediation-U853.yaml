added_comparisons:
- node_id: D04.n
  source: sap-tm
  support: Grouper et fractionner des quantités pour préparer les livraisons.
  limit: La livraison SAP ne prouve pas la fusion des engagements de commandes FLOW.
- node_id: D05.a
  source: sap-retail
  support: Déterminer des cibles de réapprovisionnement selon stock et besoins attendus.
  limit: Le calcul magasin ne démontre pas l’optimisation multi-échelon de FLOW.
- node_id: D11.b
  source: sap-proc
  support: Restituer les contrats achats, consommations et confirmations.
  limit: Appui achats uniquement ; FLOW couvre aussi les accords utiles à d’autres prestations.
- node_id: D19.a
  source: ms-agreement
  support: Appliquer validité et suspension à la création de prestations.
  limit: Un accord de service ne démontre pas le classement d’un panel de transporteurs.
- node_id: service-order-labeling
  source: sap-vas
  support: Porter les instructions d’étiquetage des biens.
  limit: SAP les rattache aux documents commerciaux ; FLOW tient un engagement de prestation distinct.
- node_id: service-order-billing
  source: ms-flow
  support: Confier des ordres à un prestataire de facturation.
  limit: L’envoi ne démontre pas tout le cycle de la demande de facturation FLOW.
- node_id: BHV019
  source: sap-mrp
  support: Protéger les besoins avec un stock de sécurité.
  limit: Le paramétrage ne prouve pas une optimisation autonome de sa valeur.
- node_id: BHV020
  source: sap-retail
  support: Déclencher le réapprovisionnement selon des seuils de stock.
  limit: Périmètre magasin ; FLOW sépare règle active et recommandation de réglage.
- node_id: BHV026
  source: sap-retail
  support: Calculer un stock cible magasin à partir des besoins attendus.
  limit: Pas de preuve de tous les arbitrages transverses du modèle FLOW.
- node_id: BHV044
  source: sap-tm
  support: Fractionner des quantités entre livraisons.
  limit: Le document de livraison ne se confond pas avec la commande et ses engagements.
- node_id: BHV086
  source: sap-tm
  support: Regrouper des lignes pour une livraison.
  limit: Un groupement logistique ne fusionne pas juridiquement les commandes.
- node_id: BHV075
  source: sap-ppds
  support: Tester une création de ressources pour satisfaire la demande.
  limit: Cas de production documenté ; pas de généralisation à tous les approvisionnements.
- node_id: BHV076
  source: sap-ppds
  support: Prendre en compte les ressources contraintes dans la réponse de production.
  limit: La faisabilité de production ne couvre pas toutes les capacités de service FLOW.
- node_id: BHV078
  source: sap-proc
  support: Suivre les confirmations fournisseur attendues et reçues.
  limit: Visibilité documentée, sans preuve d’un cycle complet de négociation.
- node_id: BHV102
  source: sap-assign
  support: Restreindre les réaffectations selon les statuts des engagements.
  limit: Les statuts SAP ne sont pas les engagements et réservations FLOW.
- node_id: BHV103
  source: sap-assign
  support: Retirer puis refaire une affectation selon les règles applicables.
  limit: FLOW explicite les conséquences sur le plan et les commandes ; pas de traduction automatique des statuts.
- node_id: ba-inventory-position-management
  source: ms-stock
  support: Exposer les quantités et expliquer leur origine.
  limit: La vue produit ne délimite pas à elle seule la responsabilité complète de tenue et correction FLOW.
- node_id: ba-inventory-position-management
  source: sap-mrp
  support: Utiliser stock et engagements pour calculer les besoins nets.
  limit: Le calcul ne couvre pas toute la fiabilisation des positions FLOW.
- node_id: ba-inventory-ownership-management
  source: ms-consign
  support: Tracer le changement de propriétaire au prélèvement.
  limit: Cas fournisseur ; FLOW distingue cette reconnaissance de la décision comptable.
- node_id: ba-inventory-ownership-management
  source: sap-consign
  support: Distinguer stock fournisseur et transfert au prélèvement.
  limit: Le processus SAP regroupe aussi règlement et opérations que FLOW sépare.
- node_id: ba-master-plan-management
  source: ms-plan
  support: Maintenir un plan tenant compte des besoins et ressources.
  limit: Le plan FLOW porte les affectations opérationnelles ; il ne reprend pas tout le module de prévision.
- node_id: ba-master-plan-management
  source: sap-ppds
  support: Réviser un plan sous contraintes de ressources.
  limit: Appui production ; ce module ne définit pas les frontières transverses de FLOW.
- node_id: ba-order-promising
  source: sap-ppds
  support: Proposer une réponse faisable sous contraintes.
  limit: CTP de production seulement, sans assimilation de toute la Business Area à PP/DS.
- node_id: ba-supply-matching
  source: ms-plan
  support: Rapprocher les besoins et apports nécessaires.
  limit: Des ordres planifiés ne valent pas affectation ni engagement confirmé.
- node_id: ba-supply-matching
  source: sap-assign
  support: Affecter les ressources aux demandes selon des priorités.
  limit: La Business Area FLOW englobe plusieurs décisions, pas uniquement la fonction d’affectation SAP.
- node_id: ba-policy-optimization
  source: ms-plan
  support: Calculer les besoins selon les paramètres de protection.
  limit: Le réglage des paramètres ne prouve pas leur optimisation ; la recommandation FLOW reste distincte.
- node_id: ba-policy-optimization
  source: sap-retail
  support: Calculer des cibles de stock.
  limit: Appui limité aux cibles ; pas de preuve d’une optimisation des politiques de réservation.
- node_id: ba-order-lifecycle-management
  source: ms-flow
  support: Valider les commandes puis transmettre leurs résultats aux prestataires.
  limit: Le parcours n’est pas le registre d’engagements FLOW.
- node_id: ba-reactive-workflow-management
  source: ms-flow
  support: Composer un parcours à partir d’actions et de conditions.
  limit: FLOW sépare sentinelle, planification et conduite ; le produit ne prescrit pas ce découpage.
- node_id: ba-reactive-workflow-management
  source: sap-flow
  support: Choisir des activités applicatives selon des conditions.
  limit: Un scénario SAP prédéfini ne prouve pas un moteur général de composition dynamique.
- node_id: ba-service-planning
  source: ms-transport
  support: Planifier les chargements et itinéraires.
  limit: Appui transport, pas ensemble des prestations de traitement des biens.
- node_id: ba-service-planning
  source: sap-tm
  support: Articuler plan de transport et instructions entrepôt.
  limit: FLOW sépare planification, engagement et réalisation physique.
- node_id: ba-execution-assurance
  source: sap-tm
  support: Recevoir les retours entre transport et entrepôt.
  limit: Les statuts produits ne prouvent pas tout le rapprochement et la qualification des écarts FLOW.
- node_id: ba-execution-coordination
  source: ms-flow
  support: Confier la réalisation à un prestataire et organiser les branches de réponse.
  limit: Le parcours de commande est plus large que la coordination locale confiée à Fulfilment.
- node_id: ba-execution-coordination
  source: sap-tm
  support: Coordonner instructions de chargement et autorisation de sortie.
  limit: La coordination transport ne démontre pas toutes les adaptations de prestations FLOW.
- node_id: ba-inbound-information-integration
  source: ms-flow
  support: Recevoir des données de fournisseurs configurés.
  limit: La réception technique ne suffit pas à établir validité, provenance et autorité métier des plans.
- node_id: ba-outbound-information-provision
  source: sap-proc
  support: Extraire les faits achats pour des usages externes.
  limit: Périmètre achats seulement ; pas de preuve de toutes les données comptables, de planification et produit.
- node_id: ba-goods-processing-order-management
  source: ms-service
  support: Tenir des demandes de prestations et leurs étapes.
  limit: Le service de technicien ne constitue pas une preuve des prestations textiles particulières.
- node_id: ba-goods-processing-order-management
  source: sap-vas
  support: Porter des instructions de traitement comme étiquetage et emballage.
  limit: Les instructions sont attachées aux documents ; FLOW tient une demande de prestation distincte.
- node_id: ba-transport-order-management
  source: ms-transport
  support: Construire et suivre des chargements à partir des ordres.
  limit: Ne démontre pas une réservation de capacité autonome avant instructions.
- node_id: ba-transport-order-management
  source: sap-tm
  support: Relier ordres de transport, livraisons et exécution.
  limit: Le cycle exact de réservation anticipée reste à qualifier.
- node_id: ba-financial-service-order-management
  source: ms-flow
  support: Transmettre une demande au prestataire de facturation.
  limit: Ne démontre pas le cycle d’encaissement ni la maîtrise comptable, qui reste externe.
