        flow_position: Établir et restituer les positions de stock fiables et les quantités engagées, avec leurs faits, vérifications
          et corrections.
        definition_choice: Établir et restituer les positions de stock fiables et les quantités engagées, avec leurs faits,
          vérifications et corrections.
        term_choice: Inventory Position Management désigne le périmètre propre à FLOW, sans équivalence de taxonomie revendiquée.
        scope_summary: Exposer les quantités et expliquer leur origine.
        approach_summary: La vue produit ne délimite pas à elle seule la responsabilité complète de tenue et correction FLOW.
