findings:
- id: M01
  priority: P1
  status: corrected_verified
  title: ATP assimile affermissement et confirmation fournisseur
  locations:
  - modeles/backlog/model.yaml / D03.i.fields.scope et copies market_inspiration
  - modeles/backlog/glossary.yaml / TER044.context et copies market_inspiration
  - modeles/backlog/model.yaml / preorder-future-availability-path / coverage
  evidence: À l’affermissement, le texte remplace le Planned Purchase Order par un achat confirmé. Purchase Order distingue
    pourtant création/affermissement et confirmation fournisseur.
  impact: Un apport peut être lu comme certain avant confirmation de sa date et de sa quantité ; contradiction au cœur d’Availability.
  proposed_correction: Remplacer la contribution planifiée par celle du Purchase Order résultant, selon son engagement et
    sa confirmation réels, en conservant filiation et conditions. L’affermissement ne confirme pas automatiquement date et
    quantité fournisseur.
  primary_sources:
  - vendor: Microsoft Dynamics 365
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-order-approval-confirmation
    passage: Approval of purchase orders / Confirming purchase orders
    consulted_on: '2026-10-07'
  - vendor: SAP S/4HANA
    url: https://learning.sap.com/courses/purchasing-in-sap-s-4hana/monitoring-purchase-orders
    passage: Order Confirmation Monitoring / Working with Different Confirmation Types
    consulted_on: '2026-10-07'
- id: M02
  priority: P1
  status: corrected_verified
  title: Le guide et le métamodèle enseignent encore une Business Area facultative
  locations:
  - modeles/backlog/atlas-transformation-methodology.yaml / method / Regrouper par responsabilité et note MOD013
  - modeles/backlog/modeling-glossary.yaml / MOD008 et MOD013
  evidence: Le guide autorise un rattachement direct au sous-domaine et cite Policies. MOD013 et MOD008 conservent la facultativité
    du niveau BA ; MOD013 annonce huit sous-domaines SCM.
  impact: Le lecteur apprend une règle interdite par U880, alors que l’arbre et MOD039 appliquent correctement une BA obligatoire.
  proposed_correction: Toute capacité possède exactement une Business Area dans son sous-domaine. Adapter les notes et exemples
    au modèle courant. La profondeur des domaines de contexte reste limitée comme convenu ; actualiser ou supprimer le compteur
    daté.
- id: M03
  priority: P2
  status: corrected_verified
  title: Les textes des références locales conservent des nombres obsolètes
  locations:
  - modeles/backlog/glossary.yaml / TER123.context et comparaisons FLOW
  - modeles/backlog/model.yaml / master-data-ingestion-finance.fields.scope
  - modeles/backlog/model.yaml / business-references.fields.market_comparisons, market_inspiration et mastership
  - modeles/backlog/model.yaml / comparaisons des ingestions
  evidence: L’arbre et le scope Operational References comportent neuf références ; le glossaire en annonce huit et une ingestion
    évoque sept référentiels.
  impact: Contradictions de synthèse après séparation des Price Books produit/service.
  proposed_correction: Employer les références du périmètre courant et aligner les copies rédactionnelles locales. Préférer
    une formulation sans compteur manuel lorsque le nombre n’apporte pas d’information métier.
- id: M04
  priority: P2
  status: corrected_verified
  title: Consignment Pick-up Order attribue encore les Tasks à un périmètre ancien
  locations:
  - modeles/backlog/model.yaml / D04.t.fields.scope et copies locales concernées
  evidence: Le texte dit Demand suit la demande et Fulfilment les Tasks de collecte et transport.
  impact: Demand n’est plus un périmètre canonique ; le pilotage du parcours et du travail humain revient à Process Management.
  proposed_correction: 'Nommer les responsabilités courantes : Order Management conserve la commande et sa validité ; Process
    Management conduit les Tasks ; Fulfilment conserve sa coordination spécialisée et les exécutants leur exécution locale.'
- id: M05
  priority: P2
  status: corrected_verified
  title: Packing Order laisse croire que Repacking possède encore un identifiant courant
  locations:
  - modeles/backlog/model.yaml / service-order-packing.fields.scope et copies market_inspiration
  - modeles/backlog/model.yaml / retrait vas-repacking sous U711
  evidence: La fiche affirme que l’identifiant Repacking est conservé ; vas-repacking est retiré du catalogue courant.
  impact: Confusion entre connaissance conservée dans Packing et objet métier publié ; risque de réintroduire un objet retiré.
  proposed_correction: Conserver la modalité de repacking dans Packing Order, préciser le retrait du nœud autonome et son
    historique, sans réutiliser son identifiant.
- id: M06
  priority: P2
  status: corrected_verified
  title: Deux scénarios de retour client sont absents du flux de récupération de valeur
  locations:
  - modeles/backlog/model.yaml / scenario_catalog.scenarios / return-credit-refund et return-customer-replacement
  evidence: Les deux scénarios ne portent que obtain-products ; le filtre recover-value les exclut.
  impact: Le lecteur explorant les retours ne retrouve pas avoir/remboursement et remplacement.
  proposed_correction: Ajouter recover-value à leurs value_stream_ids, conserver obtain-products lorsqu’il exprime aussi la
    satisfaction de la demande, sans dupliquer scénario ni parcours.
- id: M07
  priority: P2
  status: corrected_verified
  title: Un parcours de transport confond décision et coordination
  locations:
  - modeles/backlog/model.yaml / transport-loads-six-stores-path / step-4 / contribution D06.f
  evidence: Fulfilment Adaptation Decision doit Choisir et coordonner l’adaptation locale admissible.
  impact: Le scénario contredit la séparation D06.f décision / D06.d coordination.
  proposed_correction: Choisir l’adaptation locale admissible et transmettre les conditions de mise en œuvre à Fulfilment
    Coordination. Ajouter D06.d seulement si sa mobilisation doit être explicitement portée par cette étape.
- id: M08
  priority: P2
  status: corrected_verified
  title: Les informations nécessaires rendent certains scénarios inutilement longs et peu éprouvables
  locations:
  - modeles/backlog/model.yaml / scenario_catalog.paths[*].steps[*].inputs
  - preorder-future-availability-path / firm
  evidence: 75 des 130 étapes portent un input générique ; 16 recopient la description entière, dont 1 095 caractères répétés
    pour l’affermissement de précommande. Quatre inputs vides.
  impact: Les prérequis métier ne sont pas faciles à examiner et la lecture des scénarios de démonstration s’allonge.
  proposed_correction: 'Décrire des inputs concrets et courts sur les scénarios présentés : identité/version, quantités/dates,
    validité, autorité, preuve du résultat précédent. Retirer les répétitions sans inventer de dépendances ni réécrire tout
    le catalogue.'
strengths:
- 80 capacités, chacune sous une seule Business Area ; comportements terminaux sans singleton.
- Order Management conserve identité et validité ; Process Management conduit les parcours ; Fulfilment conserve son mandat
  local.
- Availability traite présent/futur, conditions de promesse, concurrence, protections/réservations, multi-lignes, capacités
  de service et absence de solution admissible.
- Précommande de vente et achat planifié distingués ; intercompany présenté comme usage sans stock fictif.
- Travail humain, habilitations, échéances, erreurs, intervention contrôlée, mining et reporting sont matérialisés sans nouveau
  domaine Case artificiel.
- Transformation multidimensionnelle, produit, DDD, technologie, architecture et décisions progressives ; les deux SVG d’ensemble
  sont conservés.
- Aucun identifiant R52 perdu ; codes de lecture prévisionnels changent par parcours d’arbre, identités conservées.
