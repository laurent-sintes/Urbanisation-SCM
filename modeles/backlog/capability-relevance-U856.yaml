migration_requirements:
- Conserver les huit références documentaires et leur maîtrise locale ; ne pas les supprimer avec leurs capacités de consultation.
- Expliciter avant retrait qui porte réception, validité, provenance et incohérences ; aucun transfert implicite vers Integration.
- Transformer les contributions des capacités retirées en besoins d’information dans les étapes et en responsabilités des
  véritables consommateurs ; ne pas les attribuer arbitrairement à une autre capacité.
- Vérifier schéma, liens de fiches, scénarios, publication_delivery et visualisation des sous-domaines sans capacité, avant
  de retirer des nœuds.
- Retirer sans réutiliser les IDs ; conserver les publications historiques. Aucun remplacement générique imposé.
