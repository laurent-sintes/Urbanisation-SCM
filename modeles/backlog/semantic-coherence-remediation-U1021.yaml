findings:
- id: AUD1020-01
  disposition: implemented
  result: Décision de livraison et effets Sales Order ajoutés aux deux variantes B2B ; libération aval des prestations distincte.
- id: AUD1020-02
  disposition: implemented
  result: Replenishment explicite et réponse de MAP avant achat autorisé ; dépendances conditionnelles conservées.
- id: AUD1020-03
  disposition: implemented
  result: Stock Redistribution conditionnel sur déplacement physique ajouté aux deux cas de transfert.
- id: AUD1020-04
  disposition: implemented
  result: 28 rôles du carnet contextualisés ; stratégie active consommée et optimisation de réservation seulement conditionnelle.
- id: AUD1020-05
  disposition: implemented
  result: Réservation conditionnelle multiligne, achats au jalon de gestion et autorisation préalable du cas de libération
    de prestations explicites.
- id: AUD1020-06
  disposition: implemented
  result: Appui Microsoft Order promising primaire direct ajouté ; limite du choix économique PTP explicite.
- id: AUD1020-07
  disposition: qualified_limits_retained
  result: Source SAP de calcul des charges qualifiée comme entrée de coût ; aucune équivalence complète avec PTP.
- id: AUD1020-08
  disposition: implemented
  result: Quatre définitions clarifiées sans déplacement de périmètre ; contextes et reprises lexicales alignés.
- id: AUD1020-09
  disposition: implemented
  result: Six définitions de contexte Commerce formulées comme services durables ; aucune capacité adjacente créée.
- id: AUD1020-10
  disposition: qualified_limits_retained
  result: Quatre lacunes de famille remplacées par appuis primaires partiels ; 23 lacunes sur 14 fiches conservées avec raisons
    précises.
- id: AUD1020-11
  disposition: implemented
  result: 24 titres génériques remplacés et hypothèses propres aux 24 scénarios et parcours documentées.
- id: AUD1020-12
  disposition: implemented
  result: Quatre variantes critiques ajoutées au scénario saisonnier existant ; restent illustratives et proposées.
- id: AUD1020-13
  disposition: implemented
  result: Ordre des BA contrôlé par display_codes et tests U1020 ; Stock Optimization dernière.
- id: AUD1020-14
  disposition: implemented
  result: Contrôle de synthèse des domaines non vide conservé et rejoué.
market_reexamination:
  new_primary_partial_supports:
  - id: ba-order-promising
    family: microsoft_dynamics
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/delivery-dates-available-promise-calculations
    limit: FLOW distingue possibilité de promesse, confirmation dans la commande et comparaison économique ; cet article ne
      couvre pas tout le choix économique PTP.
  - id: ba-execution-assurance
    family: microsoft_dynamics
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/wms-only-mode-external-erp
    limit: Appui à l’assurance des résultats et des positions ; la source mêle réalisation en entrepôt et échanges, sans couvrir
      toute assurance des prestations ou contrôles FLOW.
  - id: ba-inbound-information-integration
    family: sap_s4hana
    url: https://learning.sap.com/courses/commerce-and-s-4hana-integration-foundations/examining-the-functions-of-sap-s-4hana-cloud-apis-for-the-integration_dd7cfbbd-6ff4-450a-9d2d-4cb803aee269
    limit: Appui partiel à la réception intersystèmes ; la source ne définit ni toute validation sémantique FLOW ni l’ensemble
      des plans et référentiels à ingérer.
