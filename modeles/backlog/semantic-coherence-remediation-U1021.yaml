    family: microsoft_dynamics
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/pim/data-entities
    limit: Exemple partiel de fourniture d’informations de référence ; la source ne couvre pas tout le provisionnement des
      plans ou faits comptables et ne prescrit pas la BA FLOW.
  remaining_gaps:
  - id: D05.h
    family: sap_s4hana
    result: retained_explicit_gap
    reason: 'Les paramètres et statuts d’affectation sont documentés ; l’optimisation autonome des règles de réservation selon
      leurs conséquences ne l’est pas. Appui requis encore à établir pour cette famille produit. Réexamen U1021 : Le paramétrage
      de réservation ne prouve pas une optimisation de ses jalons et régimes selon risque et coût ; lacune S/4HANA conservée.'
    investigated_urls:
    - https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-supply-assignment_af05618d-4954-4f22-9857-3dd12e3940c4
