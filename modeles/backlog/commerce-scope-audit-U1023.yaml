id: commerce-scope-audit-U1023
status: completed_proposal_not_applied
source_refs:
- U1023
scope:
  domain_id: domain-sales
  subdomain_count: 8
  depth: Domain et Subdomain ; aucune Business Area ni capacité adjacente ajoutée
evidence:
  model: modeles/backlog/model.yaml
  glossary: modeles/backlog/glossary.yaml
  consulted_on: '2026-10-13'
  current_publication_unchanged: 2026-10-13.3
findings:
- id: COM1023-01
  type: model_observation
  severity: high
  finding: Huit sous-domaines au même niveau mélangent modalités de vente, clientèles et fonctions commerciales transversales.
  targets:
  - subdomain-sales-b2c-ecommerce
  - subdomain-sales-b2c-store
  - subdomain-sales-wholesale
  - subdomain-assortment-catalog-management
  - subdomain-retail-network-management
  - subdomain-store-backoffice-operations
  - subdomain-pricing-promotions-management
  - subdomain-rebates-incentives-management
  effect: Une liste de noms ne donne pas le récit du domaine.
- id: COM1023-02
  type: model_observation
  severity: high
  finding: Le périmètre retail est distribué entre vente numérique, vente magasin, réseau et opérations magasin.
  effect: Le lecteur doit reconstruire lui-même le commerce au consommateur et ses opérations.
- id: COM1023-03
  type: interpretation
  severity: medium
  finding: Digital Commerce est limité au B2C dans FLOW, alors que numérique peut aussi être une modalité de vente wholesale.
  evidence:
  - ms-b2b
  - ms-channels
  recommendation: Distinguer clientèle et modalité ; ne pas déplacer un portail revendeur vers retail parce qu’il est numérique.
- id: COM1023-04
  type: interpretation
  severity: medium
  finding: Store Commerce a une portée étroite de vente et caisse dans FLOW ; Microsoft emploie le même nom pour un produit
    couvrant aussi stock et réalisation en magasin. Store Backoffice Operations évoque une organisation alors que sa définition
    porte des opérations métier.
  evidence:
  - ms-store
  - sap-store
  recommendation: Au maintien de la granularité actuelle, examiner Store Sales et Store Operations ; sinon préserver leurs
    responsabilités dans un regroupement Retail Commerce. Noms proposés, non appliqués.
- id: COM1023-05
  type: recommendation
  severity: medium
  finding: Offre, prix et avantages différés ont des consommateurs retail et wholesale.
  evidence:
  - ms-assortment
  - sap-assortment
  - ms-pricing
  - sap-pricing
  - ms-rebates
  - sap-rebates
  recommendation: Conserver leurs responsabilités communes hors du seul regroupement retail ; dispositif et règlement restent
    distincts.
- id: COM1023-06
  type: boundary_to_clarify
  severity: medium
  finding: Stock et préparation locale sont décrits dans les opérations magasin ; Warehousing décrit aussi réception, comptage
    et préparation, sans préciser la frontière magasin/entrepôt.
  recommendation: Qualifier le mandat local et les faits reconnus sans supposer un transfert à Logistics. FLOW conserve sa
    référence de stock et sa coordination ; Store Visibility ne couvre pas toutes les ventes.
- id: COM1023-07
  type: coverage_not_demonstrated
  severity: medium
  finding: Relation client, fidélité et après-vente commercial ne disposent pas d’un mandat autonome explicite dans les huit
    sous-domaines. La vente mentionne la relation client mais la profondeur attendue reste inconnue.
  recommendation: Qualifier couverture et autorité avant tout ajout ; aucun nouveau sous-domaine CRM, fidélité ou marketplace
    présumé.
