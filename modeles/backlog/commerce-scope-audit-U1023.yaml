access_limits:
- url: https://learn.microsoft.com/en-us/dynamics365/commerce/b2b/set-up-b2b-site
  result: Erreur de lecture pendant cette consultation ; non retenue comme nouvel appui. Source B2B indirect workflows consultée
    à la place.
recommended_option:
  domain_retained: Commerce
  subdomains:
  - name: Retail Commerce
    kind: area
    definition: Conduire la vente aux particuliers en magasin et en ligne, exploiter le réseau et assurer les opérations locales
      nécessaires à ces parcours.
    combines_current_ids:
    - subdomain-sales-b2c-ecommerce
    - subdomain-sales-b2c-store
    - subdomain-retail-network-management
    - subdomain-store-backoffice-operations
    market_support_ids:
    - ms-channels
    - ms-store
    - sap-fashion
    - sap-store
    - sap-sales
    limits: Regroupement FLOW proposé, pas taxonomie commune aux éditeurs ; retail inclut ici les ventes aux particuliers
      en ligne. Les périmètres de réseau, vente et opérations restent explicités dans la fiche, sans sous-sous-domaines ni
      capacités adjacentes.
    tradeoff: Lecture regroupée à la maille contexte, mais moins de nœuds distincts pour les responsabilités retail ; si ces
      frontières doivent être visibles dans la carte, garder les sous-domaines ou réexaminer la maille Domain.
  - name: Wholesale Commerce
    kind: area
    retains_current_id: subdomain-sales-wholesale
    definition: Conduire la relation commerciale et la vente aux revendeurs, avec leurs conditions négociées et la préparation
      de leurs commandes.
    market_support_ids:
    - ms-b2b
    - sap-wholesale
  - name: Assortment & Catalog Management
    kind: area
    retains_current_id: subdomain-assortment-catalog-management
    definition: Définir et publier l’offre proposée par magasin, canal ou partenaire, avec sa présentation commerciale et
      sa période de validité.
    market_support_ids:
    - ms-assortment
    - sap-assortment
  - name: Pricing & Promotions Management
    kind: area
    retains_current_id: subdomain-pricing-promotions-management
    definition: Définir les prix et promotions de vente, déterminer les prix applicables et publier les résultats autorisés.
    market_support_ids:
    - ms-pricing
    - sap-pricing
  - name: Rebates & Incentives Management
    kind: area
    retains_current_id: subdomain-rebates-incentives-management
    definition: Définir les dispositifs de ristournes, primes commerciales et commissions de vente, leurs bénéficiaires et
      leurs conditions.
    market_support_ids:
    - ms-rebates
    - sap-rebates
  count: 5
  state: proposed
  identity_rule: Arbitrer les identités conservées et retirées après accord ; ne pas réutiliser un identifiant retiré.
  reason: Un regroupement retail, une responsabilité wholesale et trois responsabilités commerciales communes. La vente en
    ligne reste une modalité de chaque clientèle, sans fusion avec le canal revendeur.
alternative:
  name: Conserver les huit sous-domaines avec ordre et vocabulaire cohérents
  benefit: Préserve la visibilité des quatre responsabilités retail.
  limit: Rapproche les nœuds mais ne crée pas un périmètre retail unique. Aucun niveau intermédiaire fictif ne peut être introduit
    entre Domain et Subdomain.
scenario_checks:
  paths_examined:
  - pickup-or-direct-shipment-path
  - fashion-launch-path
  - transfer-replenishment-order-driven-path
  result: Ces parcours mobilisent les capacités Supply ; les contextes Commerce ne peuvent pas être inférés par un rattachement
    des capacités. Le retrait magasin, l’ouverture de magasins et le transfert conservent leurs frontières actuelles.
  examples_to_test_next:
  - Commande web retirée en magasin
  - Vente encaissée et emportée
  - Réception partielle en magasin
  - Commande saisonnière d’un revendeur par portail
  - Conditions commerciales communes et règlement différé
canonical_changes: Aucune modification du modèle, du glossaire ou de leurs rattachements. Audit et proposition à discuter.
