comparisons:
- id: CMP-U1017-MICROSOFT
  external_element_id: ELM-U1017-MS-CTP
  target_id: D03.j
  baseline: backlog courant après U1014 ; publication 2026-10-13.1
  relationship: Recouvrement partiel
  common: Une possibilité de réponse à une demande identifiée est déterminée en examinant matières, sources, capacités et
    délais.
  difference: FLOW sépare la décision de possibilité, le choix collectif d’apports, la planification d’achat MAP et les engagements
    ; la fonction produit peut enchaîner plusieurs de ces responsabilités.
  recommendation: Conserver le rattachement à Order Promising si le résultat est une possibilité de réponse à la demande.
    Expliciter la construction d’apports et la mobilisation par Master Planning ; ne pas limiter le calcul aux seules données
    de la commande.
  benefit: Rendre lisible la portée Supply du calcul tout en conservant un résultat métier distinct du plan collectif.
  tradeoff: Le parent montre la finalité, pas toutes les ressources examinées ni tous les consommateurs ; la coopération avec
    Master Planning doit être visible.
  limits: Aucune taxonomie de Business Areas commune, interface MAP ni réalisation installée déduite.
  status: proposed
  author: Codex
  date: '2026-10-13'
