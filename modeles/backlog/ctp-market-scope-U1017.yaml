finding: La finalité de CTP est une réponse à une demande ; son périmètre de calcul inclut l’offre à constituer. La maille
  de la réponse ne borne ni la profondeur du calcul ni son mode d’exécution.
flow_assessment:
  D03.j: La définition actuelle est compatible avec cette finalité et son scope prévoit déjà la mobilisation par Master Planning.
  TER045: Définition identique à D03.j contrôlée ; aucun désalignement nouveau.
  clarification_candidates:
  - Rendre visibles dates/quantités possibles, apports nécessaires, contraintes et conditions du résultat CTP.
  - Distinguer créer une proposition ou un élément de planification d’engager effectivement un achat. Le mandat MAP reste
    conservé.
  - 'Le critère FLOW d’apport futur admissible versus apport à constituer ne doit pas être présenté comme une frontière ATP/CTP
    identique chez tous les éditeurs : Oracle peut consommer des apports planifiés dans CTP.'
  boundary: Une étude générale des capacités de production ou une optimisation globale d’approvisionnement n’est pas appelée
    CTP par simple proximité de calcul. Le Master Plan choisit la réponse collective ; la CTP vérifie une possibilité.
illustration: 'Illustration fictive : une demande de 100 pièces ne trouve que 60 pièces disponibles. CTP détermine si 40 pièces
  supplémentaires peuvent être obtenues, quand et sous quelles conditions. Le Master Plan arbitre ensuite cet apport face
  à un report, un partiel ou une priorité différente ; MAP garde la planification d’achat.'
limits:
- Les textes SAP APO historiques ne sont pas utilisés comme preuve S/4HANA.
- La création d’apports décrite par un produit ne transfère pas la planification d’achat à FLOW.
- Aucun déplacement de capacité ni nouvelle publication adopté U1017.
