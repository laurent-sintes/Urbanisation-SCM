proposed_behaviors:
- name: Multi-Stop Transport
  definition: Tenir une demande comportant plusieurs lieux de collecte ou livraison, les exigences par arrêt et les suites
    d’un changement ou d’une réalisation partielle.
  difference: 'Plusieurs points de résultat : une livraison effectuée ne clôture pas nécessairement l’ensemble de l’ordre.'
  example: Une tournée dessert trois magasins ; deux sont livrés, le troisième reste à traiter.
  boundary: L’ordre conserve les arrêts demandés et leurs contraintes. Optimiser la tournée ou décider de sa modification
    reste dans la coordination ; les tournées internes d’un transporteur ne créent pas ce comportement si FLOW ne les commande
    pas.
  sources:
  - ELM685
  - ELM686
- name: Multi-Leg Transport
  definition: Tenir une demande de transport à plusieurs étapes explicites, avec points de remise, exigences intermédiaires
    et résultat final convenus.
  difference: La réalisation d’une étape ou d’un transbordement ne vaut pas livraison finale ; conditions et engagements intermédiaires
    à préserver.
  example: Pré-acheminement, traversée maritime puis livraison à l’entrepôt ; exigences de remise précisées aux interfaces.
  boundary: Variante seulement si les étapes sont exposées dans la prestation confiée. Plusieurs Transport Orders confiés
    séparément sont une composition pilotée par Fulfilment, pas des sous-Orders obligatoires ni des sous-comportements.
  sources:
  - ELM687
  - ELM688
- name: Scheduled Transport
  definition: Tenir une demande rattachée à un départ ou à un service programmé, et les conséquences d’un changement de programme
    ou d’un départ manqué.
  difference: L’engagement dépend d’une occurrence de service identifiée ; changer de départ peut nécessiter une nouvelle
    acceptation.
  example: La navette entre deux entrepôts part chaque soir ; le lot doit être pris en charge sur le départ convenu.
  boundary: Décrire le rattachement et ses suites, pas construire les horaires, le réseau ou une tournée. Une simple date
    demandée ne suffit pas. Deux sources SAP attestent le mécanisme sans consensus interéditeurs.
  sources:
  - ELM689
  - ELM690
- name: Pickup & Delivery Appointments
  definition: Tenir les créneaux de collecte ou livraison convenus avec les parties, leurs confirmations, modifications et
    conséquences sur l’engagement.
  difference: Distinguer une fenêtre souhaitée, un horaire estimé et un rendez-vous effectivement accepté.
  example: Un magasin confirme un créneau de réception ; un retard impose de tenir le créneau renégocié.
  boundary: Aucun Appointment Order systématique. Ne pas recopier la planification de quai ou la décision d’adaptation. Oracle
    documente aussi la collecte ; DHL étaye surtout la livraison.
  sources:
  - ELM691
  - ELM692
- name: Delivery Rescheduling & Redirection
  definition: Tenir les demandes autorisées de report ou changement de lieu de remise et les suites d’une tentative de livraison
    infructueuse.
  difference: Une instruction du destinataire peut modifier le résultat convenu ; conserver demande, acceptation et limites
    données par l’expéditeur.
  example: Après une absence, le destinataire demande un retrait en point relais ; tenir la nouvelle remise acceptée.
  boundary: La demande de changement ne vaut ni acceptation ni modification automatique de la promesse commerciale. Fulfilment
    choisit les adaptations ; Order Management conserve les engagements à satisfaire. Proche du rendez-vous, mais couvre aussi
    changement de lieu et remise après échec.
  sources:
  - ELM692
  - ELM693
capacity_alternative:
  name: Transport Booking Order
  status: adopted_U709_with_applicability_condition
  definition: Gérer une demande autonome de réservation de capacité de transport, sa confirmation, ses changements et sa libération,
    avant ou indépendamment des instructions détaillées de déplacement.
  decision: Recommander une capacité distincte si FLOW porte cet engagement de capacité pour lui-même. Si le booking est seulement
    la prise en charge du même déplacement, rester dans Transport Order et son cycle de vie.
  distinct_result: Capacité confirmée sur un service, départ ou période ; la confirmation ne prouve pas le déplacement des
    marchandises.
  example: Réserver de la place pour un départ maritime de collection, puis préciser les lots effectivement expédiés.
  source_refs:
  - ELM694
  - ELM695
  - ELM696
  common: Booking et pré-réservation de capacité sont explicitement documentés.
  difference: SAP peut confirmer simultanément capacité et prestation ; DCSA décrit un standard maritime d’échanges. Ni indépendance
    obligatoire de tous les bookings, ni équivalence avec une capacité FLOW prouvée.
  benefit: Rendre visible un engagement de capacité antérieur à l’expédition détaillée.
  tradeoff: Éviter de doubler la même commande transport ; lien réservation-utilisation seulement lorsque deux engagements
    sont réellement gérés.
  boundaries:
  - Une allocation interne de ressources reste Matching ; elle n’est pas une réservation commerciale auprès du prestataire.
  - Un accord-cadre de capacité relève des accords de référence ; ne pas le transformer automatiquement en Order.
  - Choix de l’offre et coordination des départs restent Fulfilment ; aucun lien un-à-un imposé entre booking et déplacements.
  open_business_fact: Le domaine FLOW commande-t-il de la capacité transport avant ou indépendamment des instructions détaillées
    de déplacement ? Aucun fait Beaumanoir déduit des sources marché.
  canonical_id: service-order-transport-booking
evaluated_other_splits:
- candidate: Road / Ocean / Air / Rail Orders
  position: Pas de capacités distinctes au seul titre du mode ; exigences et variantes de service.
- candidate: Parcel / Freight / Last-Mile Orders
  position: Pas de séparation prouvée par la seule taille, destination ou offre transporteur ; particularités de remise couvertes
    par variantes proposées.
- candidate: Dedicated / Groupage Transport
  position: Conditions de service et d’engagement à conserver ; pas de comportement automatique pour le plan de chargement
    interne. ELM697 étaye l’offre, pas une responsabilité distincte.
- candidate: Return Transport Order
  position: Sens du trajet et intention de retour portés par le contexte de la demande ; pas une famille transport supplémentaire
    par défaut.
- candidate: Freight Forwarding Order
  position: Peut porter une organisation de bout en bout chez un prestataire ; corpus actuel insuffisant pour proposer une
    capacité séparée dans FLOW.
- candidate: Customs Clearance Order
  position: Résultat différent du déplacement ; hors étude transport actuelle, ne pas absorber implicitement. Étude propre
    nécessaire si le domaine doit commander cette prestation.
not_behaviors:
- 'Transport point à point standard : socle de la capacité, pas ajout obligatoire'
- 'Modes, température, suspension sur cintre, urgence : spécifications sauf mécanisme métier distinct démontré'
- 'Tendering, carrier selection, route optimization : décisions et coordination existantes, pas variantes d’Order'
- 'Tracking et preuve de livraison : informations mobilisées, sans recopier les capacités de suivi'
- 'Création/modification/annulation seules : cycle commun, pas comportement par étape CRUD'
