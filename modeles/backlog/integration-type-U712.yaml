comparison_ref: CMP280
type:
  id: integration
  name: Integration
  label_fr: Intégration
  definition: Acquérir ou transmettre des informations métier entre domaines ou exécutants, les reconnaître et les rapprocher
    du contexte local pour les rendre utilisables avec leur provenance et leur résultat de prise en compte.
  boundary: Le résultat dominant est la prise en compte fiable de l’échange métier. Protocoles, connecteurs et middleware
    restent des moyens. Décider, coordonner le processus ou tenir l’état métier consolidé ne devient pas Integration du seul
    fait de recevoir des événements.
  source_refs:
  - ELM710
  - ELM711
  - ELM712
  candidates:
  - D09.d
  - D11.a
  - D08.d
  - D12.a
  - D13.a
  - D14.a
  - D16.a
  - plans-ingestion
tracking:
  source_refs:
  - U713
  - ELM713
  - ELM714
  rule: Tout Tracking est Integration ; toute Visibility est Knowledge.
  inventory: 'D01.f : Integration ; recentrer la description sur la captation et l’intégration des faits de stock.'
  operations: 'D07.d : Integration ; capter et rapprocher les retours d’exécution.'
  boundary: La restitution des états et de l’avancement appartient aux capacités Visibility. La nature des Behaviors reste
    distincte du type de capacité.
  visibility_correspondence:
    source_refs:
    - U715
    status: applied_U717
    rule: Chaque Tracking alimente une Visibility identifiée ; plusieurs Tracking peuvent alimenter une même Visibility.
    implementation: Réutiliser la Visibility existante qui porte le résultat métier ; qualifier le lien et les faits transmis.
      Ne créer une Visibility que si une responsabilité de restitution manque. Aucune paire automatique et aucune nouvelle
      hiérarchie.
  mapping:
  - tracking: D01.f
    visibility:
    - D01.c
  - tracking: D07.d
    visibility:
    - operations-visibility
    - D18.a
master_data:
  name: Master Data Ingestion
  proposed_parent: business-references
  proposed_type: integration
  decomposition_axis: Domaine fournisseur avec son contrat métier.
  source_refs:
  - ELM710
  - ELM711
  - ELM712
  continuity: Reprend l’axe de provenance par domaine source déjà clarifié U514/U515.
  preserve: Les sept référentiels restent les sujets de référence locaux ; ils ne disparaissent pas avec le regroupement de
    leur ingestion.
  mapping: Un domaine peut fournir plusieurs référentiels et un référentiel peut recevoir plusieurs contributions. Aucun lien
    un-à-un entre les sept sujets et les domaines sources.
  behavior_criterion: Différences d’autorité, d’identification, de validité, de rapprochement et de traitement des corrections.
    Une application ou un format différent ne suffit pas à lui seul.
  migration: 'Appliquée U717/U718 : ingestion commune, sept sujets et vues conservés ; trois Behaviors par domaine fournisseur.
    Contrats et répartition des sujets à qualifier.'
  minimum: Zéro ou au moins deux comportements différenciants selon U711.
  retired_ids:
  - D09.d
  - D11.a
  - D08.d
  - D12.a
  - D13.a
  - D14.a
  - D16.a
  source_domains:
  - Commerce
  - Finance
  - Design
category:
  id: integration
  display_name: Intégration
  purpose: Regrouper localement les capacités dédiées aux échanges entrants ou sortants, si plusieurs capacités rendent ce
    regroupement utile.
  distinction: Integration est le type de capacité ; Intégration est le libellé de catégorie pour le regroupement visuel local.
  recommendation: Pas de sous-domaine technique Integration ajouté. Ne pas créer un bandeau pour une unique ingestion consolidée
    si cela alourdit la lecture.
  source_refs:
  - U716
