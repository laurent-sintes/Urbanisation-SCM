chapters:
- id: start
  title: Pour commencer
  intro: Le modèle décrit les responsabilités métier et leurs coopérations. Le métamodèle définit les concepts et règles utilisés
    pour le construire et le lire.
  sections:
  - title: Des publics métier et SI
    text: Les responsables et experts métier confrontent les descriptions aux situations réelles. La direction, la stratégie
      et la transformation examinent les priorités et les impacts. Les architectes métier, Business Analysts, AMOA et responsables
      produit relient les besoins aux capacités.
    detail: Les architectes d’entreprise, urbanistes SI et architectes de solutions examinent les applications et les échanges
      qui soutiennent ces responsabilités. Le rattachement à une DSI ou à une direction métier ne définit pas à lui seul le
      rôle.
  - title: Lire, contribuer, maintenir
    text: La lecture ne demande ni expertise informatique ni certification. Contribuer demande de comprendre le métier et
      de savoir expliquer une responsabilité sur un cas concret. Maintenir le modèle exige aussi de maîtriser ses conventions.
    detail: Ces rôles peuvent être cumulés. Être lecteur ou contributeur ne confère pas automatiquement une autorité de validation.
      Les auteurs préservent les preuves, les identités et les portées d’accord.
  - title: Choisir sa profondeur de lecture
    text: Systèmes et domaines donnent le contexte ; sous-domaines et capacités expliquent les responsabilités ; comportements
      et scénarios permettent d’approfondir les mécanismes et les situations.
    example: Distinguer choisir une promesse, affecter les ressources et tenir un engagement relève de l’architecture métier.
      Choisir les applications et leurs échanges relève de l’architecture SI.
- id: metamodel
  title: Le métamodèle
  intro: Business System → Domain → Subdomain → Capability → Behavior. Les regroupements situent les aptitudes métier ; les
    comportements précisent leurs manières de s’exercer.
  sections:
  - title: Une capacité, un résultat identifiable
    text: |-
      Une capacité est une aptitude durable de l’entreprise à produire un résultat métier identifiable, indépendamment de son organisation et de ses outils. Elle exprime ce que l’entreprise sait faire pour agir, décider, tenir des engagements ou des actifs métier, et produire ou exploiter une connaissance.

      Son périmètre permet d’identifier sa contribution propre dans des scénarios métier : les informations et conditions qu’elle mobilise, le résultat qu’elle produit et ses limites de responsabilité. Ses comportements précisent les manières significatives dont elle s’exerce.
  - title: Des relations explicites
    text: Une décomposition, une dépendance et une présentation expriment des liens différents. Les catégories et les types
      de capacités sont des attributs de lecture, sans niveau hiérarchique supplémentaire.
    detail: Une capacité peut être mobilisée dans plusieurs scénarios. Un scénario ne crée pas de nouvelle hiérarchie et son
      ordre ne prescrit pas un processus universel.
  - title: Les comportements
    text: Les comportements décrivent des manières métier significatives d’exercer une capacité. Une capacité possède zéro
      ou au moins deux comportements différenciants, avec une justification de cette décomposition.
    example: Une stratégie ou une variante qui change le résultat métier peut être utile à décrire. Un bouton, un paramètre
      ou une étape technique ne suffit pas.
- id: method
  title: La méthode
  intro: Partir du service concret rendu, préciser les frontières, puis éprouver les capacités sur des scénarios indépendants
    de l’organisation et des outils.
  sections:
  - title: Définir le résultat et la frontière
    text: Partir d’un résultat métier identifiable, préciser le bénéficiaire et les limites de responsabilité. Une capacité
      est durable et indépendante des outils et de l’organisation.
  - title: Structurer par flux de valeur
    text: Un flux décrit la valeur pour un bénéficiaire et ses étapes. Chaque scénario possède une identité unique et peut
      concerner plusieurs flux. Événement, objet métier et type de situation sont des filtres transverses.
  - title: Décrire le scénario
    text: Préciser situation, déclencheur, conditions et résultat recherché. Distinguer illustration et situation documentée.
      Les exemples courts peuvent rester dans les fiches sans devenir des scénarios.
  - title: Explorer les parcours
    text: Un scénario peut être étudié selon plusieurs réponses. Chaque parcours explicite les étapes, contributions des capacités,
      dépendances et résultats. Étapes de valeur et étapes de mobilisation ne se confondent pas.
  - title: Vérifier la couverture
    text: Vérifier les résultats nécessaires, les capacités responsables, les informations et conditions, puis leur utilisation.
      Distinguer trou métier, documentation insuffisante, lien absent et responsabilité externe. Une capacité citée ne prouve
      pas la couverture exhaustive.
- id: references
  title: Les références
  intro: BIZBOK et TOGAF éclairent la méthode. FLOW conserve des conventions explicites adaptées à son périmètre, sans revendiquer
    une application intégrale de ces référentiels.
  sections:
  - title: BIZBOK — capacités et valeur
    text: Le rapprochement des capacités, de leurs résultats et des étapes de création de valeur aide à examiner leurs contributions
      métier. La structure complète de la Guild n’est pas transposée automatiquement.
    detail: Business Architecture Metamodel Guide v3.0, septembre 2024, §5.1 ; consulté le 27 septembre 2026. Document primaire
      public. Une étape de value stream ne constitue pas automatiquement un scénarios FLOW.
    url: https://cdn.ymaws.com/www.businessarchitectureguild.org/resource/resmgr/whitepapers/Business_Architecture_Metamo.pdf
  - title: TOGAF — aptitude et granularité
    text: Une capacité exprime une aptitude. La profondeur de description doit servir les besoins de compréhension et de décision,
      sans quota universel de capacités.
    detail: Business Capabilities, G189, 2018, §3.2.2 ; consulté le 27 septembre 2026. Publication originale The Open Group
      dans une copie hébergée par Governance Foundation.
    url: https://governance.foundation/assets/frameworks/togaf/g189%20-%20Business%20Capbility.pdf
  - title: TOGAF — Business Scenarios
    text: Le Business Scenario TOGAF décrit un problème et ses résultats attendus dans un contexte pouvant inclure organisation
      et technologie. Le scénarios FLOW reste indépendant de ces choix de réalisation.
    detail: Business Scenarios, G176, 2017, chapitre 1 ; consulté le 27 septembre 2026. Appui méthodologique, sans équivalence
      exacte de vocabulaire.
    url: https://governance.foundation/assets/frameworks/togaf/g176%20-%20TOGAF%20SERIES%20GUIDE%20BUSINESS%20SCENARIOS.pdf
  - title: Les choix FLOW
    text: Le rang quatre des capacités, la décomposition terminale en comportements et la visibilité des décisions sont des
      conventions locales. Les niveaux numérotés des référentiels ne garantissent pas une maille comparable.
  - title: TOGAF — Value Streams
    text: Flux de valeur, bénéficiaire, valeur attendue, étapes et mapping vers les capacités. Les noms et classements du
      catalogue FLOW sont des choix locaux.
    url: https://governance.foundation/assets/frameworks/togaf/g178_2%20-%20Value%20Streams.pdf
