  excerpt: Go
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U321. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U33
  title: Définition stricte des capacités et vocabulaire métier commun
  excerpt: |-
    Il faut absolument qu'on reste sur la définition de capacité : ce que sait faire l'entreprise indépendamment de son organisation et de ses outils.

    Mais c'est bien de chercher plus loin pour expliquer et illustrer les capacités.

    A mon avis, il faut ensuite un glossaire clair sur les mots qu'on retrouve dans les capacités : ressource, stock, demande en tout genre etc. Ainsi que sur les verbes afin de normaliser les actions.

    Qu'en penses-tu ?
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U33. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U45
  title: Donner au domaine le sens d’un espace problématique
  excerpt: En tout cas il faut donner du sens à ces niveaux. Le plus important c'est "domaine" => la définition d'evans (DDD)
    qui le décrit comme un espace problématique est ce qui me guide dans la catégorisation. Qu'en penses-tu ?
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U45. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U46
  title: Problèmes liés dans un périmètre cohérent et étape de cartographie
  excerpt: |-
    La notion d'espace problématique est dans son livre si je me souviens bien : un ensemble de problèmes définissables dans un périmètre cohérent car les problèmes sont liés.

    Bounded context me semble trop précis et fait état d'un certain niveau d'avancement dans la conception de l'application et ce n'est pas ce qu'on veut à mon humble avis.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U46. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U322
  title: Indépendance du modèle métier et de l’architecture de solution
  excerpt: Attention au modèle business qui est complètement décorrélé de la solution. Souvent on a une capacité implémentée
    par une brique logiciel/ solution mais pas nécessairement. Il peut parfois y avoir dans les solution de la mutualisation,
    de la généricité, des choix et des contraintes techniques qui font qu'il y a des regroupements forts ou des dispersions
    (microservices) justifiés.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U322. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U262
  title: Retenir Comportement comme dernier niveau de détail d’une capacité
  excerpt: Comportement est exactement ce que je cherche pour mon niveau de décomposition complémentaire. Et je ne crois pas
    qu'il faille descendre plus bas.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U262. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U265
  title: Audit de granularité avec comportements et simplification des instructions
  excerpt: 'P.S. : Il faut que la décomposition en comportement soit justifiée par une complexité ou un bénéfice ciblé =>
    cette notion est en enregistrer dans le modèle.'
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U265. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U283
  title: Critères différenciants des comportements et réexamen de Planning
  excerpt: |-
    Mécanisme, Politique, Variante, ou benefice sont les critères différenciants qui permettent de décomposer une capacité. Je suis très satisfait de ta proposition.
    Pour les capacité de "planification", les mécanismes de construction de scénarios alternatifs, d'adaptation de l'execution d'un scénario, et de simulation sont vraiment des comportements dans le sens où ça implique des impacts sur les comportements humains de l'entreprise et de ses processus. Les autres comportements sont des fonctions qu'on retrouvera dans les produits.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U283. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U288
  title: Promise Management avec trois comportements de promesse
  excerpt: |-
    "J’ai retenu une fusion à soumettre à ton arbitrage : les trois capacités de gestion de promesse pourraient devenir Promise Management, en gardant proposition, confirmation et révision comme fonctions.   ". Comme comportement tu veux dire :)

    Oui c'est une bonne idée.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U288. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U229
  title: Conserver Decision et distinguer Planning des capacités qui le nourrissent
  excerpt: Ce qui m'ennuie c'est que j'aimerais garder "Décision" du manière générale et éviter "Calculation". Et "Planning"
    est un terme qui désigne le fait de "reconfigurer, simuler, valider". Les capacités "Planning" se nourrissent de "Décision"
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U229. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U231
  title: Préciser l'application transactionnelle des données de Stock Protection
  excerpt: '**"Stock Protection — management** : gouverner les politiques, leur validité et leur application.  " => "application"
    signifie mettre à jour transactionnellement les données unitairement, en groupe ou en masse par plusieurs types d''interfaces
    possibles (écrans, batch, flux, stereaming)'
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U231. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U61
  title: Objets métier, faits de gestion, documents et émergence depuis les capacités
  excerpt: |-
    Dans la plateforme qu'on veut développer, on fait la différence entre les objets métier (sorte d'aggregateRoot) et les faits de gestion qui sont des événements associés à des documents qui sont des états d'aggregateRoot ou des objets non modifiables produits ou captés.

    Ma question est : est-ce que les capacités, dans leur définition, leur expression, font émerger ces éléments ou on considère que c'est la conception IT qui les fera émerger ?

    Que peut on constater dans l'urbanisme SAP, BIZBOK ou TM ?
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U61. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U62
  title: Objets métier dans les modèles processus et transactionnels
  excerpt: |-
    Oui, les processus s'appuient souvent sur des objets métier (approche Case Management) : par exemple "Demande de réassort".

    Mais d'autres objets existent aussi dans les domaines transactionnels.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U62. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U111
  title: Publier les 36 capacités avec leur statut de validation
  excerpt: Même si les 36 capacités n'ont pas été releasées, publie les dans la release avec le statut "non validé" par exemple
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U111. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: AGENTS-2026-09-18
  title: Conventions de modélisation et portée des accords
  excerpt: |-
    - **Capacité → Comportement** est la décomposition descriptive terminale (U262). Un comportement appartient explicitement à une seule capacité de même couche ; aucun sous-comportement. Plusieurs comportements peuvent se combiner sans former une séquence.

    - Objets métier, documents et événements restent distincts ; ils ne sont pas des niveaux inférieurs de comportement. Leurs liens ne présument ni possession exclusive, ni cardinalité, ni ordre d’exécution.

    - Déduire l’arbre uniquement des relations explicites. `contains`, `presents` et les liens métier transversaux ont des sens différents. Business References est un groupe de présentation ; Universe est un niveau d’urbanisme. Un lien « a besoin de » n’est pas une décomposition.

    Publier ne vaut pas valider. Un Go s’applique au contenu présenté et à sa portée : champs, valeurs et rattachements explicites. Ne pas étendre un accord aux compléments éditoriaux, descendants ou nouvelles valeurs. Conserver empreintes et accords historiques ; `lifecycle`, `review` et décisions `ADOPT-*` ne remplacent pas la qualification champ par champ.

    - Distinguer décision, mise à jour transactionnelle, déclenchement et réalisation physique, sans imposer une organisation humaine, un découpage logiciel, l’atomicité d’un lot ou un contrôle manuel. L’automatisation est possible.
  scope: Extraits figés d’AGENTS.md, sections 2, 3 et 5, au 18 septembre 2026. Ils restituent les règles courantes à cette
    date ; ils ne réécrivent pas la publication métier du 16 septembre.
- id: U450
  title: Présentation Atlas et types de comportements
  excerpt: Présenter séparément le glossaire du méta modèle et le glossaire métier ; Comprendre le méta modèle doit être accessible
    dans Atlas.
  scope: 'U450 : synthèse de la demande, pas un verbatim intégral ; U451 : réponse exacte. Sources internes conservées, non
    affichées dans Atlas.'
- id: U451
  title: Présentation Atlas et types de comportements
  excerpt: Les formes propres aux comportements
  scope: 'U450 : synthèse de la demande, pas un verbatim intégral ; U451 : réponse exacte. Sources internes conservées, non
    affichées dans Atlas.'
- id: U455
  title: Abandonner les couches transactionnelle/processus au profit des interactions entre univers et domaines
  excerpt: Concernant "Couches transactionnelle/processus", je pense qu'il faut oublier le concept qui est très "SAP". Il
    n'y a pas de "couches" à proprement parler, ce sont des domaines et univers qui sont en interaction. Par exemple, Commerce
    capte des intentions et les transforme en engagement via la Supply qui elle même le concrétise via la logistique.
  scope: Verbatim de la contribution ; principe adopté, formulation pédagogique proposée.
- id: U456
  title: Conserver Atlas dans un périmètre strictement métier
  excerpt: D'autre pas part, je souhaite qu'Atlas reste dans un scope métier et de déborde pas sur les solutions ou les produits.
  scope: Verbatim de la contribution ; principe adopté, formulation pédagogique proposée.
- id: U461
  title: Lien fait de gestion–document confirmé
  excerpt: Oui, conserver le lien fait–document
  scope: 'Réponse du 19 septembre 2026 : tout fait de gestion est associé à un document métier identifié, éventuellement structuré
    sans PDF. Versions, correction et nombre exact de documents non adoptés par extension.'
- id: U464
  title: Définir les informations métier indépendamment de leur implémentation
  excerpt: |-
    Prochaine étape : la data. Ou plutot les informations métier. Il faut définir la notion d'Information dans le méta modèle et dire que ce n'est pas un modèle de données implémentable, une information est groupe de données insécables minimum, portant son propre sens et explicitant les capacités.
    Recherche dans la théorie des données la définition exacte et limpide de cette notion
  scope: Demande et intention ; la définition proposée et l’interprétation précise de la maille minimale ne sont pas adoptées
    par anticipation.
- id: U466
  title: Distinguer proposition et engagement de satisfaction
  excerpt: Deux informations métier reliées (recommandé)
  scope: Réponse au choix entre deux informations reliées et une seule information à versions proposées/confirmées. Adopte
    la distinction et leur coexistence possible, sans valider les détails des fiches.
- id: U482
  title: Adopter Authoritative Data et Domain → Area → Capability → Behavior
  excerpt: |-
    Ok pour "Authoritative Data"
    Ok pour Domain Area et remonter Domaine d'un niveau
  scope: Accord sur le nom du groupe et les noms/positions des niveaux. Identifiants, capacités, comportements et responsabilités
    conservés ; aucun regroupement ou fusion implicite.
- id: U479
  title: Préciser l’autorité locale des références dans Supply Chain Orchestration
  excerpt: Ce sont les source de vérité dans une scope entreprise qui sont en dehors de la Supply Chain Orchestration. Mais
    pour cet univers, sa source de vérité locale est gérée / portée par le domaine des données de référence.
  scope: Distingue autorité locale et maîtrise d’entreprise, sans transfert automatique des maîtres externes ni nouvelle règle
    de résolution des écarts.
- id: U585
  title: Politiques maîtrisées, effets du plan et case management
  excerpt: Je pense qu'il faut séparer ces référentiels des référentiels importés (projection)
  scope: Précisions enregistrées dans connaissance/01-contributions-utilisateur.md, U585. Définition des politiques internes
    et portée des adaptations du plan ; noms et parents détaillés à instruire.
- id: U586
  title: Nouveau type de capacité Policy
  excerpt: 'Je souhaite créer un nouveau type de capacité : la policy.'
  scope: Instruction explicite de créer le type ; définition détaillée et frontières éditoriales proposées, sans reclassement
    automatique des capacités existantes.
- id: U624
  title: Adopter Purpose / Finalité à la place d’Area
  excerpt: Ok, je valide
  scope: Accord contextuel sur Purpose / Finalité, sa définition et la hiérarchie Domain → Purpose → Capability → Behavior.
    Convention FLOW ; aucun déplacement de capacité ni accord global sur les critères de marché.
- id: U626
  title: Mettre à jour les notions à la suite de l’audit U625
  excerpt: Tu peux mettre à jour un maximum de notions ?
  scope: Autorisation de consolider et enrichir les notions ; les compléments non explicitement adoptés restent proposés.
    Aucun accord global ni publication implicite.
- id: U753
  title: Définition de capacité
  excerpt: mets à jour la définition de capacité également
  scope: Responsabilité durable indépendante des outils et de l’organisation.
- id: U756
  title: Registres et décision de propriété
  excerpt: Je valide
  scope: Ledger et reconnaissance du changement de propriétaire.
- id: U764
  title: Scénarios multiples
  excerpt: Je valide
  scope: Illustrations multiples et partagées sans niveau supplémentaire.
- id: U766
  title: Order Promising autonome
  excerpt: Je valide ta proposition
  scope: Finalité de promesse distincte de la tenue du stock.
- id: U767
  title: Évaluation et sélection
  excerpt: Je valide
  scope: Deux profondeurs par évaluation ; visibilité fusionnée ; sélection et réexamen distincts. Evaluation formalise le
    principe acquis.
- id: U787
  title: Capacités et scénarios métier
  excerpt: Définitions et règle de granularité ; distinction cas, scénario et parcours de mobilisation.
  scope: Accord méthodologique ; aucune validation globale des réalisations.
- id: U788
  title: Méthode accessible dans Atlas
  excerpt: Quatre rubriques, publics métier et SI, liens contextuels et édition liée à la publication.
  scope: Publication méthodologique et interface ; aucune modification des capacités opérationnelles.
- id: U793
  title: Scénarios autonomes et flux de valeur
  excerpt: Exécuter les six lots U792.
  scope: Contrat, migration, Atlas et publication locale ; contenus nouveaux proposés.
- id: U797
  title: Lisibilité du référentiel
  excerpt: Tu peux reprendre tout ça en autonomie ?
  scope: Reprise éditoriale et ergonomique ; aucune approbation globale de la nouvelle rédaction.
glossary:
  terms:
  - id: MOD001
    name: Decision
    label_fr: Décision
    definition: Déterminer une réponse métier à partir d’hypothèses, d’objectifs et de contraintes.
    notes:
    - Les capacités de Planning se nourrissent des capacités de décision selon U229.
    - Le calcul est un moyen possible ; U229 préfère Decision et souhaite éviter Calculation comme intitulé de capacité.
    - Une décision modélisée ne prouve pas sa mise en application transactionnelle.
    short_description: Choisir une réponse métier selon les faits, objectifs et contraintes.
  - id: MOD002
    name: Planning
    label_fr: Planification
    definition: Construire et actualiser des plans, simuler et analyser leurs conséquences, puis appliquer le plan retenu
      et adapter sa mise en œuvre, en mobilisant les décisions spécialisées et les capacités partenaires.
    notes:
    - Planning mobilise les décisions spécialisées ; elles restent des capacités distinctes.
    - Inventory Planning comporte Scenario Construction, Simulation & Analysis et Scenario Execution Adaptation depuis U290.
      Comparaison, autorisation et mise en action restent des fonctions utiles.
    - Les pratiques peuvent être itératives ou automatisées ; aucun contrôle humain systématique ni cycle technique universel
      n’est imposé.
    - L’application mobilise les capacités opérationnelles responsables. D06 conserve la décision d’adaptation opérationnelle
      ; D05 adapte son scénario de stock.
    - Les accords U269/U271 remplacés sont conservés dans d05-refactoring.yaml et audits/2026-09-17-refonte-appliquee/modeling-glossary-before.yaml.
      La généralisation détaillée à toute capacité Planning reste proposée.
    - 'U537 : l’application du plan relève d’un comportement du Planning concerné. Elle porte la mise en effet du résultat
      retenu et la connaissance de sa prise en compte ; elle ne se réduit pas à un appel technique. Le libellé Plan Application
      reste proposé.'
    - 'U538 : définir, maintenir et fournir une configuration utilisée par le Planning reste une responsabilité extérieure.
      Supply Protection (Stock Protection dans l’exemple utilisateur) gouverne les protections consommées par le Planning
      ; sa mise à jour ne devient pas un comportement de Planning.'
    - Le Planning peut mobiliser une capacité partenaire pour rendre son résultat effectif sans absorber sa responsabilité
      métier. Distinguer application du résultat, maintien de la configuration et réalisation physique ; aucune couche transactionnelle
      générique ni capacité Application systématique.
    - U537 remplace l’exclusion antérieure d’un comportement d’application. Les trois comportements Inventory Planning de
      U290 restent historiques et courants tant que leur décomposition précise n’est pas révisée. Aucun ajout automatique
      identique à tous les Plannings.
    short_description: Construire et réviser un plan en mobilisant les décisions nécessaires, puis en suivre l’application.
  - id: MOD003
    name: Management
    label_fr: Gestion / gouvernance
    definition: Maintenir dans la durée un ensemble cohérent d’états, engagements ou obligations et gouverner ses évolutions.
    notes:
    - U230 qualifie Stock Protection de gouvernance/management ; U231 précise sa mise à jour transactionnelle.
    - Cette formulation générale est proposée à partir du cas Stock Protection ; elle n’impose pas la même définition à toute
      capacité nommée Management.
    - Le sens d’application transactionnelle est défini par MOD004.
    - 'U538 : la responsabilité de configuration illustrée par Stock Protection reste extérieure au Planning qui la consomme,
      y compris lorsque ce Planning comporte un comportement d’application du plan. Nom canonique de la capacité actuelle
      : Supply Protection, D02.b.'
    - U586 ajoute Policy comme type dédié au cadre de règles applicable. La définition générale de Management est clarifiée
      ; le cas Stock Protection U230/U231 et ses accords restent historiques, sans reclassement automatique de Supply Protection.
      État antérieur conservé dans capability-types-U449.yaml#history_before_U586.
    short_description: Tenir des états ou engagements dans la durée et gérer leurs évolutions.
  - id: MOD004
    name: Application transactionnelle
    definition: Mettre à jour transactionnellement les données, unitairement, en groupe ou en masse, par plusieurs types d’interfaces
      possibles.
    notes:
    - Ces modalités ne constituent pas des capacités supplémentaires.
    - Ne pas confondre la mise à jour des données, leur utilisation par les capacités consommatrices et un mouvement physique.
    - Aucune technologie, garantie d’atomicité de lot ou interface particulière n’est imposée.
    short_description: Appliquer des changements aux données, seuls ou regroupés, avec les contrôles nécessaires.
  - id: MOD005
    name: Couverture — convention de description
    definition: Qualifier toute affirmation de couverture en indiquant ce qui est couvert, par quoi, dans quel périmètre et
      horizon, et selon quel critère de satisfaction.
    notes:
    - Distinguer couverture candidate, affectation enregistrée, promesse confirmée et réalisation constatée ; ces qualifications
      ne constituent pas un cycle universel de statuts.
    - Préciser les quantités, dates, hypothèses et reliquats lorsque le besoin le nécessite ; aucun niveau de lot ou d’exemplaire
      imposé.
    - Les sens métier figurent séparément dans TER022 Couverture d’une demande et TER077 Couverture de stock. Cette convention
      ne crée ni capacité ni relation métier.
    short_description: Préciser ce qui est couvert, par quoi et selon quel critère.
  - id: MOD006
    name: Capability Behavior
    label_fr: Comportement
    definition: 'Un comportement décrit une manière métier identifiable dont une capacité agit dans certaines circonstances
      : politique ou stratégie, mécanisme, variante de prise en charge, périmètre significatif, dimension de raisonnement,
      effet sur un engagement ou pratique de planification. Il précise ce qui change dans la réponse, l’action ou le résultat
      attendu, sans détailler les fonctions du produit.'
    notes:
    - U262 retient Comportement et l’arrêt de la décomposition à ce niveau.
    - Un comportement précise une capacité ; il ne devient pas une capacité supplémentaire du catalogue.
    - Plusieurs comportements peuvent se combiner ; ils ne sont pas nécessairement des variantes exclusives ni des étapes
      successives.
    - L’arrêt concerne la décomposition des capacités. Objets, documents et événements restent des objets du modèle, sans
      devenir des niveaux inférieurs de comportement.
    - Le rapprochement avec Capability Behavior dans BIZBOK est documenté en CMP088. Le choix d’en faire le dernier niveau
      est une convention FLOW.
    - U263 impose des descriptions factuelles, sans niveaux promotionnels tels que Advanced ATP ; les appellations éditeur
      restent dans les correspondances marché.
    - 'U265 : une décomposition en comportements est justifiée par une complexité ou un bénéfice ciblé ; elle n’est pas systématique.
      La justification est portée par fields.decomposition_rationale sur la capacité ; sa rédaction détaillée conserve sa
      propre portée de validation.'
    - 'U282 précise la maille recherchée sur Supply Protection : mécanismes métier de protection, plutôt que liste des opérations
      sur Allocation. Les opérations fonctionnelles restent matière de conception produit ; elles ne constituent pas un nouveau
      niveau inférieur dans le modèle. Les quatre mécanismes BHV017–020 ont été intégrés U290 ; la proposition antérieure
      reste historique.'
    - U283 retient Mécanisme, Politique, Variante ou bénéfice comme critères différenciants de décomposition. Pour Planning,
      les effets sur les pratiques humaines et les processus distinguent les comportements des fonctions de produits. Ces
      critères ne constituent pas quatre niveaux supplémentaires.
    - 'U284 confirme la direction U283 et retient Simulation & analyse en un seul comportement : les impacts sont intégrés
      à ce comportement, sans Scenario Impact Analysis autonome dans la cible.'
    - U389 exige une liste concrète issue de l’existant. Les formes se recouvrent et ne sont ni des sous-niveaux ni une classification
      obligatoire des nœuds.
    - 'Le bénéfice ciblé reste un critère transversal de justification U265/U283 : il peut différencier une manière d’agir,
      mais un bénéfice vague ne remplace pas la description de cette manière d’agir.'
    - U389 a analysé les exemples de visibilité comme propositions distinctes du catalogue de l’époque. Depuis U406/U409,
      Operations Tracking porte Warehouse Visibility, Transportation Visibility, Store Visibility et Process Tracking (BHV079–082).
      L’analyse U389 reste une photographie historique ; leur présence actuelle ne vaut pas publication ni validation globale
      des détails.
    - 'U398 : la mutualisation peut se lire dans les liens. Décrire le comportement mobilisé et sa différence métier selon
      le contexte ; aucun comportement automatique par appelant et aucun sous-comportement. U399 : règles consignées pour
      le prochain audit et/ou les prochaines améliorations, sans déclencher de nouvelle revue. Convention : modeles/backlog/business-interactions.yaml.'
    - 'U501 : pour Order Backlog Optimization Request, Déclenchement et Activité regroupent visuellement des comportements
      au même niveau terminal. L’angle de lecture est explicite ; il ne crée ni parent intermédiaire, ni séquence obligatoire,
      ni requalification des comportements historiques. Cette décomposition est historique depuis U552 : les modes de sollicitation
      sont des modalités de la gestion de demande, tandis que simulation et autorisation relèvent directement de Order Backlog
      Planning ; aucun sous-comportement.'
    short_description: Manière significative dont une capacité agit selon la situation.
  - id: MOD007
    name: Capability Nature
    label_fr: Type de capacité
    definition: Qualifier une capacité selon son résultat métier dominant, indépendamment de son nom, de ses comportements
      et de sa réalisation technique.
    notes:
    - Les sept valeurs présentes dans FLOW sont action, management, policy, knowledge, orchestration, planning et decision.
      Policy est ajouté par instruction U586.
    - Decision, Planning et Management gardent leurs conventions MOD001–MOD003. Les types peuvent partager des opérations
      ; la responsabilité dominante porte la classification.
    - Les décisions sont présentées après les autres capacités ; cet ordre de lecture ne représente pas un enchaînement.
    - La grille détaillée et les dix compléments proposés sont consignés dans capability-types-U449.yaml ; la nature propre
      de chaque capacité reste portée par son fields.nature.
    - OMG DMN éclaire la distinction décision/processus sans prescrire cette grille de types ni leurs icônes.
    - 'U500/U501 : une capacité qui porte une demande peut préciser Frontoffice (sollicitation externe au Domain), Backoffice
      (sollicitation interne) ou les deux. Ce qualificatif d’origine est distinct de sa nature, du déclencheur et de la provenance
      de l’événement ; aucune valeur n’est inférée du nom ou du parent.'
    - 'Policy : Définir, maintenir et rendre applicables les règles, politiques et configurations métier dont le Domain porte
      la maîtrise, avec leur portée, leur validité et leurs conditions d’usage.'
    - Le type policy qualifie une capacité ; une politique particulière est un contenu qu’elle gouverne. policy_strategy reste
      une forme de comportement, indépendante du type de sa capacité parente.
    - Un même Purpose réunit références et policies U618 ; le type Policy qualifie des capacités distinctes des projections
      et des vues. Purpose, type de capacité et gouvernance des données sont des dimensions distinctes. Aucun comportement
      par paramètre ni nouveau niveau hiérarchique.
    - Un plan peut proposer une révision de politique et faire appliquer sa version autorisée, y compris automatiquement selon
      une délégation ; une hypothèse de simulation ne modifie pas le cadre actif.
    - 'U767 : Evaluation complète les types pour ATP/CTP/PTP, indépendamment de leur mise en œuvre humaine ou automatisée.'
    short_description: Résultat métier dominant qui caractérise une capacité.
  - id: MOD008
    name: Domain
    label_fr: Domaine
    definition: Grand périmètre cohérent de responsabilités métier au sein d’un Business System. Il peut être détaillé en
      Subdomains puis en capacités et comportements selon la profondeur utile à FLOW.
    notes:
    - U482 remplace Universe par Domain à ce niveau. L’identifiant MOD008 est conservé ; les publications historiques gardent
      leur vocabulaire.
    - U780 ajoute Business System au-dessus de Domain ; la profondeur de description varie selon le périmètre. Les publications
      historiques gardent leurs niveaux.
    short_description: Grand périmètre de responsabilités métier au sein d’un système métier.
  - id: MOD013
    name: Subdomain
    label_fr: Sous-domaine
    definition: Périmètre cohérent de responsabilités métier au sein d’un Domain, regroupant les capacités qui les portent.
    notes:
    - 'U673 : Subdomain remplace Purpose dans le backlog ; les publications historiques conservent Area ou Purpose selon leur
      version.'
    - Un seul sous-domaine de rattachement par capacité ; ses coopérations avec les autres ne créent pas de second parent.
    - Les sept référentiels organisent les sujets de Master Data sans niveau descriptif supplémentaire.
    - Le découpage métier ne prescrit pas un bounded context logiciel ni une architecture de services.
    short_description: Regroupement cohérent de capacités au sein d’un domaine.
  - id: MOD009
    name: Business Reference
    label_fr: Référentiel métier
    definition: Ensemble cohérent de données de référence nécessaires aux capacités métier. Sa gouvernance précise si le domaine
      porte leur CRUD (Domain-managed), reçoit une vérité externe (Projection), ou construit et rafraîchit une vue (Domain-View).
      Les responsabilités peuvent porter sur des ensembles distincts autour du même sujet.
    short_description: Données de référence dont les capacités ont besoin, avec une responsabilité de gestion explicite.
  - id: MOD010
    name: Model Relationship
    label_fr: Relation du modèle
    definition: Lien explicite décrivant une appartenance, une présentation ou une interaction métier entre éléments.
    short_description: 'Lien explicite entre des éléments du modèle : appartenance, présentation ou interaction.'
  - id: MOD011
    name: Behavior Nature
    label_fr: Type de comportement
    definition: Forme qui explique ce qui distingue une manière d’agir au sein d’une capacité.
    short_description: Critère qui distingue une manière d’agir au sein d’une capacité.
  - id: MOD012
    name: Information
    label_fr: Information métier
    definition: |-
      Ensemble minimal d’éléments qui, reliés dans un contexte donné, portent un sens métier déterminé et explicitent ce qu’une capacité connaît, utilise, produit ou fait évoluer.

      L’information est décrite indépendamment de sa représentation informatique. La cartographie des informations métier ne constitue pas un modèle de données implémentable.
    notes:
    - Définition proposée pour FLOW, inspirée de notions distinctes ; aucune norme consultée ne donne exactement cette définition
      d’Information.
    - Le minimum se juge au regard d’une question métier et d’un contexte explicites. Le sens peut s’appuyer sur d’autres
      informations identifiées, sans recopier tout leur contenu.
    - Insécable signifie ici que les éléments et leurs relations nécessaires au sens étudié doivent être conservés. Cela ne
      prouve ni l’irréductibilité logique d’un fait élémentaire ni l’indivisibilité d’un stockage ou d’une mise à jour.
    - Si deux parties portent des sens autonomes utiles à des questions distinctes, les décrire comme informations reliées.
      Une commande, un dossier complet ou une fiche produit ne sont pas déclarés minimaux par leur seul nom.
    - Le modèle décrit des types d’information ; un exemple chiffré illustre une occurrence. Une valeur isolée n’a pas nécessairement
      de sens métier sans son contexte.
    - Information, objet métier, document et fait de gestion ne sont pas des synonymes. Une information décrit quelque chose
      de pertinent ; le document la formalise ; un fait de gestion rend compte d’un événement métier.
    - Le fait élémentaire de la logique ou d’ORM n’est pas automatiquement un fait de gestion FLOW. La règle U461 fait–document
      demeure attachée aux faits de gestion ; elle ne requiert pas un document distinct pour chaque propriété ou proposition.
    - 'Les informations sont reliées aux capacités par un rôle explicite : connaître, utiliser, établir, modifier ou constater.
      Ces verbes pédagogiques ne créent pas de nouveaux types de relation dans le schéma.'
    - Pour une information de référence projetée, préciser l’autorité et l’alimentation métier utiles, sans inventer de maître
      installé ni transférer sa responsabilité à Supply.
    short_description: Connaissance métier utilisée, produite ou modifiée par une capacité, indépendamment de son format informatique.
  - id: MOD014
    name: Data Governance
    label_fr: Gouvernance des données
    definition: Responsabilité du domaine sur les données ou sur la construction et le rafraîchissement de leur vue, indépendante
      du type de capacité.
    short_description: Responsabilité de tenir les données ou leur vue et de les actualiser.
  - id: MOD015
    name: Capability
    label_fr: Capacité
    definition: |-
      Une capacité est une aptitude durable de l’entreprise à produire un résultat métier identifiable, indépendamment de son organisation et de ses outils. Elle exprime ce que l’entreprise sait faire pour agir, décider, tenir des engagements ou des actifs métier, et produire ou exploiter une connaissance.

      Son périmètre permet d’identifier sa contribution propre dans des scénarios métier : les informations et conditions qu’elle mobilise, le résultat qu’elle produit et ses limites de responsabilité. Ses comportements précisent les manières significatives dont elle s’exerce.
    notes:
    - Un produit peut contribuer à plusieurs capacités ; une fonctionnalité ne suffit pas à définir une capacité.
    - Le glossaire métier TER001 conserve un renvoi historique vers cette autorité méthodologique.
    - 'Critère U751/U752 : imaginer des humains avec du papier, un stylo et des calepins, puis décrire ce qu’ils font et les
      actifs qu’ils tiennent pour faire fonctionner l’entreprise. Ce test révèle la responsabilité métier ; il ne prescrit
      pas une réalisation manuelle.'
    - 'Certains documents, registres et ensembles de données constituent des actifs durables de l’entreprise. Leur nom peut
      désigner une capacité de les produire, les tenir ou les exploiter : Sales Order, Inventory Ledger ou Inventory Visibility,
      avec une définition qui explicite le service rendu.'
    - La présence d’un actif ne crée pas automatiquement une capacité par document, table, champ ou écriture. Justifier la
      responsabilité durable, son résultat et sa maille ; un nom orienté actif n’est pas à lui seul un défaut de modélisation.
    - Les domaines et sous-domaines regroupent finalités, connaissances ou problématiques pour partager et collaborer. Ils
      ne reproduisent ni organigramme ni découpage technologique ; automatisation et mutualisation peuvent conduire à des
      réalisations transversales.
    - Une capacité est suffisamment détaillée lorsque sa contribution à un scénario métier peut être expliquée sans masquer
      des responsabilités métier distinctes. Une décomposition supplémentaire se justifie lorsqu’elle rend identifiable un
      résultat ou une responsabilité utile au pilotage ; une étape, un paramètre, un document ou une fonction d’outil ne suffit
      pas à créer une capacité.
    - 'U787 : TOGAF et BIZBOK constituent les appuis méthodologiques. Le niveau 4 FLOW, les comportements terminaux et la
      finesse des décisions restent des conventions locales ; les numéros de niveau ne prouvent pas une équivalence de granularité.
      Voir MOD027 et MOD028 ; MOD026 conserve la notion historique retirée sous U791.'
    short_description: Savoir-faire durable produisant un résultat métier, indépendant de l’organisation et des outils.
  - id: MOD016
    name: Capability Realization
    definition: 'Moyens concrets mobilisés pour exercer une capacité : acteurs, pratiques, outils et échanges.'
    short_description: Acteurs, pratiques, outils et échanges qui permettent d’exercer une capacité.
  - id: MOD017
    name: Function
    definition: 'Mot à qualifier avant emploi : il ne désigne pas un niveau unique adopté dans notre modèle.'
    short_description: 'Terme à préciser : il ne correspond pas à un niveau unique de ce modèle.'
  - id: MOD018
    name: Product Functionality
    definition: Comportement ou ensemble de comportements offert par un produit dans une édition et une configuration données.
    short_description: Possibilité offerte par un logiciel dans une version et une configuration données.
  - id: MOD019
    name: Capability Grouping
    definition: Ensemble de capacités rapprochées selon un critère métier explicite pour faciliter la lecture de la carte.
    short_description: Rapprochement de capacités selon un critère métier pour faciliter la lecture.
  - id: MOD020
    name: Ledger
    definition: Type de capacité qui tient un registre métier durable de faits reconnus, datés et justifiés, en assurant leur
      traçabilité et leurs corrections.
    notes:
    - Le registre est un actif métier ; son nom désigne la capacité de le tenir.
    - Une écriture proposée ne vaut pas un fait reconnu ; conserver fondement et corrections.
    - Convention de typage FLOW, pas une taxonomie éditeur ni une technologie imposée.
    short_description: Capacité de tenir un registre durable de faits reconnus, datés, justifiés et corrigibles.
  - id: MOD021
    name: Evaluation
    definition: Type de capacité qui évalue des possibilités, leur faisabilité ou leurs conséquences à partir de faits, règles
      et hypothèses, en explicitant résultats, conditions et incertitudes, sans sélectionner une réponse ni engager sa réalisation.
    notes:
    - ATP, CTP et PTP sont de type Evaluation ; Promise Selection Decision choisit une proposition.
    - 'Une décision conserve ses calculs internes : aucune capacité créée pour chaque formule.'
    - Knowledge établit et expose la connaissance de la situation ; Evaluation apprécie des possibilités dans un contexte.
    - Convention FLOW ; le marché peut réunir évaluation et sélection dans une même fonction.
    short_description: Évaluer des possibilités et leurs conséquences sans choisir ni engager leur réalisation.
  - id: MOD022
    name: Business System
    label_fr: Système métier
    definition: Ensemble de domaines métier qui coopèrent pour une finalité commune, indépendamment de leur organisation et
      de leurs applications.
    notes:
    - La notion méthodologique reste distincte des noms des systèmes dans le glossaire métier.
    - 'Design & Development et Enterprise Management & Control : contexte ; Business Operations : domaines ; Supply Chain
      Orchestration : capacités et comportements.'
    - Les sources marché comparent les périmètres ; elles ne définissent pas un équivalent exact de ce niveau FLOW.
    short_description: Ensemble de domaines qui coopèrent pour une finalité commune.
  - id: MOD023
    name: Persistent Identifier
    label_fr: Identifiant persistant
    definition: Repère immuable qui distingue un élément au fil des publications, déplacements et changements de code visible.
    short_description: Identifiant stable qui suit un élément malgré ses déplacements ou renommages.
  - id: MOD024
    name: Display Code
    label_fr: Code de lecture
    definition: Repère court composé d’un préfixe de type et d’un numéro suivant l’ordre de lecture dans une publication déterminée.
    short_description: Code court facilitant le repérage d’un élément dans une publication.
  - id: MOD025
    name: Reading Order
    label_fr: Ordre de lecture
    definition: Ordre de référence du parcours de l’arbre, partagé par les cartes et fiches, figé avec la publication.
    short_description: Ordre de lecture de l’arbre, fixé pour une publication.
  - id: MOD026
    name: Business Use Case
    label_fr: Cas d’usage métier
    definition: |-
      Un cas d’usage métier décrit comment l’entreprise répond à une intention ou à un événement métier pour atteindre un résultat observable ayant une valeur pour une partie prenante. Il précise la situation initiale, le déclencheur, le résultat attendu, les conditions et les variantes significatives, ainsi que les capacités mobilisées et leurs contributions.

      Il reste indépendant de l’organisation et des outils : les participants sont décrits par leurs rôles métier, sans imposer une équipe, une application ou un mode de réalisation.
    notes:
    - 'U791 : notion retirée du métamodèle actif. Cette entrée conserve le sens historique U787 et son identifiant ; utiliser
      MOD027 Business Scenario et MOD028 Capability Mobilization Path. Aucun objet distinct Business Use Case n’est requis
      dans FLOW.'
    - Le cas d’usage expose l’objectif et l’ensemble des chemins possibles ; un scénario décrit un chemin particulier.
    - 'Exemple illustratif : réexaminer la satisfaction d’une commande après une rupture d’approvisionnement.'
    - Le Business Scenario TOGAF peut inclure l’environnement organisationnel et technique ; il est plus large que cette convention
      FLOW. Aucun synonyme exact ni conformité UML revendiqués.
    status: retired
    short_description: Ancienne notion du modèle, remplacée par scénario métier et parcours de mobilisation.
  - id: MOD027
    name: Business Scenario
    label_fr: Scénario métier
    definition: Description d’une situation métier délimitée, de son déclencheur, des conditions qui la caractérisent et du
      résultat recherché pour une partie prenante. Il sert à examiner comment l’entreprise peut répondre à cette situation,
      indépendamment de son organisation et de ses outils.
    notes:
    - Le scénario possède une identité autonome ; il n’appartient pas à un Domain, un Subdomain ou une Capability. Les relations
      de mobilisation et les affichages contextuels restent possibles.
    - Un scénario peut être examiné selon plusieurs parcours de mobilisation des capacités. Son résultat recherché ne préjuge
      pas de la réponse retenue.
    - 'Exemple illustratif : une réception retardée menace une livraison promise ; rechercher un stock alternatif ou réviser
      la promesse constituent deux réponses à examiner.'
    - 'Convention FLOW : ce scénario n’est pas une reprise exacte du Business Scenario TOGAF, qui peut aussi décrire organisation
      et technologie, ni du Scenario BIZBOK, qui désigne une application de l’architecture métier à une problématique d’entreprise.'
    - 'U792 : navigation principale du catalogue autonome par flux de valeur, avec filtres transverses (événement, objet métier,
      situation nominale/exception/reprise, capacités mobilisées). Identité unique, rattachements multiples possibles. Les
      flux doivent être formalisés avant qualification ; leur liste n’est pas encore adoptée. U793 : scenario_catalog porte
      les scénarios autonomes ; les illustrations locales restent dans fields.examples et les anciennes publications gardent
      leur contrat. Les petits exemples pédagogiques ne deviennent pas automatiquement des scénarios structurés.'
    short_description: Situation métier décrite par son déclencheur, ses conditions et le résultat recherché.
  - id: MOD028
    name: Capability Mobilization Path
    label_fr: Parcours de mobilisation des capacités métier
    definition: Un parcours de mobilisation décrit, pour un scénario métier donné, les étapes nécessaires à l’obtention du
      résultat recherché et les contributions des capacités à ces étapes. Il explicite les dépendances et les résultats intermédiaires
      utiles à l’analyse de couverture, sans prescrire l’organisation, l’affectation des tâches ni les outils de réalisation.
    notes:
    - Une capacité peut intervenir plusieurs fois ; plusieurs peuvent contribuer en parallèle ; certaines entretiennent continuellement
      une connaissance ou un registre.
    - 'À chaque étape : quel résultat métier est nécessaire ? Quelle capacité en porte la responsabilité ? Quelles informations,
      décisions ou conditions lui sont nécessaires ? Qui utilise son résultat pour poursuivre ou terminer le parcours ?'
    - Un trou apparaît lorsqu’un résultat nécessaire reste sans responsable identifié, ou lorsqu’une étape suppose une information
      ou un engagement que personne ne produit. Distinguer capacité manquante, description insuffisante, lien absent ou responsabilité
      externe au périmètre.
    - Le parcours permet de vérifier la couverture des situations examinées, pas de prouver à lui seul l’exhaustivité du modèle.
    - La capacité définit l’aptitude durable ; le scénario expose la situation et le résultat recherché ; le parcours décrit
      les étapes et les contributions des capacités. Une étape ne constitue pas une capacité ni un comportement.
    - La frontière avec un processus tient à la finalité et au contenu de la représentation, pas à la seule absence de rôles.
      Un processus peut être abstrait ; le parcours FLOW limite son détail à l’analyse de mobilisation et de couverture.
    - 'Ce parcours ne constitue pas automatiquement un Value Stream : un flux de valeur explicite une création de valeur de
      bout en bout pour une partie prenante, tandis qu’un parcours peut étudier une exception locale.'
    short_description: Étapes et contributions des capacités permettant de répondre à un scénario, sans prescrire organisation
      ou outils.
  - id: MOD029
    name: Value Stream
    label_fr: Flux de valeur
    definition: Un flux de valeur décrit, du point de vue d’une partie prenante, la progression vers un résultat qui lui apporte
      une valeur identifiable. Il précise le bénéficiaire, la valeur attendue, le déclencheur, les frontières et les étapes
      de valeur ; il peut traverser plusieurs domaines.
    notes:
    - 'Convention FLOW mise en œuvre sous U793. Flux et étapes de valeur : appui BIZBOK/TOGAF ; étape de mobilisation : convention
      locale. Aucun alignement automatique entre niveaux ou étapes.'
    short_description: Progression vers un résultat qui apporte une valeur à un bénéficiaire.
  - id: MOD030
    name: Value Stream Stage
    label_fr: Étape de valeur
    definition: Une étape de valeur représente une progression identifiable vers la valeur attendue d’un flux. Elle précise
      le résultat de valeur et les conditions d’entrée et de sortie ; elle ne correspond pas automatiquement à une étape d’un
      parcours particulier.
    notes:
    - 'Convention FLOW mise en œuvre sous U793. Flux et étapes de valeur : appui BIZBOK/TOGAF ; étape de mobilisation : convention
      locale. Aucun alignement automatique entre niveaux ou étapes.'
    short_description: Progression identifiable dans un flux de valeur, avec un résultat et des conditions d’entrée et de
      sortie.
  - id: MOD031
    name: Capability Mobilization Step
    label_fr: Étape de mobilisation des capacités
    definition: Une étape de mobilisation décrit une contribution au résultat d’un parcours donné, les capacités qui y contribuent,
      les informations et conditions nécessaires et le résultat intermédiaire. Elle ne constitue pas un niveau de décomposition
      des capacités.
    notes:
    - 'Convention FLOW mise en œuvre sous U793. Flux et étapes de valeur : appui BIZBOK/TOGAF ; étape de mobilisation : convention
      locale. Aucun alignement automatique entre niveaux ou étapes.'
    short_description: Contribution intermédiaire à un parcours, avec les capacités, informations et conditions nécessaires.
  model_term_ids:
