lessons:
- id: business-first
  label: Le métier d’abord
  title: Des responsabilités métier qui coopèrent
  rule: Une capacité décrit ce que l’entreprise sait faire durablement. Business System → Domain → Subdomain → Capability
    → Behavior distingue le grand périmètre, ses responsabilités, les aptitudes et leurs manières d’agir.
  established_at: '2026-09-19'
  scene:
    kind: responsibilities
    caption: 'Illustration métier : possibilités, refus et écarts peuvent circuler en retour. Cet exemple n’ajoute aucun périmètre
      au catalogue.'
    items:
    - label: Sales / Sourcing and Procurement
      text: Exprimer l’intention et les attentes
    - label: Supply Chain Orchestration
      text: Établir un engagement de satisfaction
    - label: Logistics Execution
      text: Concrétiser les prestations attendues
  question: Plusieurs responsabilités métier contribuent à satisfaire une commande. Cela les transforme-t-il en une hiérarchie
    de couches ?
  choices:
  - label: Non, il s’agit d’une coopération
    feedback: Une interaction indique ce qui est attendu ou partagé. Elle ne crée ni parent-enfant ni responsabilité unique.
  - label: Oui, chaque étape devient une couche du modèle
    feedback: L’ordre d’un parcours ne définit pas la structure de la carte. Les retours, refus et écarts mobilisent aussi
      plusieurs responsabilités.
  explanation: La carte organise des problèmes métier durables. Les interactions expliquent leur coopération. Un parcours
    traverse plusieurs responsabilités sans créer un étage supplémentaire dans la décomposition.
  contributor:
    criterion: Décris le résultat, les limites et les informations échangées ; distingue ce qui est demandé, décidé, engagé
      et constaté.
    boundary: Atlas reste une référence métier. Les choix de produits, applications et réalisations sont documentés séparément,
      hors d’Atlas.
    scope: Principes U455/U456 appliqués ; exemple de coopération et formulation pédagogique proposés, aucun périmètre ajouté.
      U482 adopte le vocabulaire Domain et Purpose, à responsabilités constantes.
    source_refs:
    - U33
    - U455
    - U456
    - U482
  model_links:
  - id: D03.n
    label: Fulfillment Commitment
  - id: D04.i
    label: Sales Order
- id: useful-detail
  label: Le bon détail
  title: Décomposer doit apporter quelque chose
  rule: Un comportement explique une façon d’agir utile. Il est le dernier niveau descriptif sous une capacité ; son ajout
    doit être justifié.
  established_at: '2026-09-17'
  scene:
    kind: decomposition
    parent: Fulfillment Commitment · capacité
    caption: Des responsabilités distinctes · aucune séquence universelle imposée par la carte
    items:
    - label: Comportement
      text: Proposer la promesse
    - label: Comportement
      text: Confirmer la promesse
    - label: Comportement
      text: Réviser la promesse
  question: On ajoute un bouton « Exporter ». Faut-il créer un comportement ?
  choices:
  - label: Le bouton suffit à justifier le découpage
    feedback: Une opération d’interface ne suffit pas. La question utile est ce qu’un comportement supplémentaire permet de
      comprendre du métier.
  - label: Seulement si un bénéfice métier distinct le justifie
    feedback: Le découpage demande une complexité ou un bénéfice ciblé. Mécanisme, politique ou variante peuvent le justifier
      ; un bouton seul ne le fait pas.
  explanation: Le découpage demande une complexité ou un bénéfice ciblé. Mécanisme, politique ou variante peuvent le justifier
    ; un bouton seul ne le fait pas.
  contributor:
    criterion: Énonce la complexité ou le bénéfice précis de la décomposition, puis explique ce qui distingue chaque manière
      d’agir.
    boundary: Un comportement appartient à une seule capacité, explicitement reliée à son parent. Il n’a pas de sous-comportement
      ; plusieurs comportements peuvent se combiner.
    scope: Niveau terminal et critères retenus le 17 septembre. Promise Management est l’exemple adopté U288, postérieur à
      v007 ; il ne représente pas un extrait de cette publication. Formulations pédagogiques proposées.
    source_refs:
    - U262
    - U265
    - U283
    - U288
    - AGENTS-2026-09-18
    - U455
  model_links:
  - id: D03.n
    label: Fulfillment Commitment
- id: meaningful-links
  label: Le sens des liens
  title: Avoir besoin de ne veut pas dire contenir
  rule: Les liens d’appartenance construisent l’arbre. Les dépendances expliquent comment des responsabilités distinctes se
    mobilisent.
  established_at: '2026-09-16'
  scene:
    kind: dependency
    connector: mobilise
    caption: Un lien de mobilisation, pas un nouveau niveau de décomposition.
    items:
    - label: Capacité
      text: Inventory Optimization Planning
    - label: Capacité distincte
      text: Replenishment Decision
  question: Planning mobilise une décision spécialisée. Cette décision devient-elle son comportement ?
  choices:
  - label: Elle reste une capacité distincte
    feedback: La décision garde sa responsabilité propre. On explique le lien de mobilisation sans la transformer en comportement
      du Planning.
  - label: Elle devient un enfant de Planning
    feedback: Ce placement confondrait dépendance et décomposition. Une relation métier n’ajoute pas automatiquement une branche
      dans l’arbre.
  explanation: La décision garde sa responsabilité propre. On explique le lien de mobilisation sans la transformer en comportement
    du Planning.
  contributor:
    criterion: 'Précise le sens du lien : contient, présente, utilise une information ou mobilise une décision. Décris les
      conditions et effets connus.'
    boundary: Les référentiels restent distincts et présentent les capacités de leur sujet. Une relation de présentation ne
      fusionne pas les références et ne crée pas un niveau métier supplémentaire.
    scope: Mobilisation des décisions explicitée U229 ; la scène illustre ce principe sans ajouter de relation au catalogue.
      Formulations pédagogiques proposées.
    source_refs:
    - U229
    - AGENTS-2026-09-18
    - U482
    - U507
    - U509
  model_links:
  - id: D05.f
    label: Inventory Optimization Planning
  - id: D05.e
    label: Replenishment Decision
- id: responsibilities
  label: Les responsabilités
  title: Un choix, une mise à jour, une action physique
  rule: Décider d’un ajustement, l’enregistrer et le réaliser portent des effets différents, même lorsque tout est automatisé.
  established_at: '2026-09-16'
  scene:
    kind: responsibilities
    caption: Trois effets à distinguer · pas de workflow universel dessiné ici
    items:
    - label: Décision
      text: Choisir de transférer 20 unités
    - label: Transaction
      text: Enregistrer la commande de transfert
    - label: Réalisation
      text: Déplacer les unités
  question: La commande de transfert est enregistrée. Les unités ont-elles nécessairement bougé ?
  choices:
  - label: Oui, l’enregistrement prouve la réalisation
    feedback: L’enregistrement ne prouve pas le déplacement. Il faut distinguer le résultat de la transaction et celui de
      l’exécution.
  - label: Non, la réalisation doit être constatée
    feedback: L’enregistrement change les données transactionnelles. La réalisation physique est un autre fait, dont il faut
      pouvoir connaître le résultat.
  explanation: L’enregistrement change les données transactionnelles. La réalisation physique est un autre fait, dont il faut
    pouvoir connaître le résultat.
  contributor:
    criterion: 'Pour chaque responsabilité, demande quel effet elle produit : une réponse métier, des données mises à jour
      ou une prestation réalisée.'
    boundary: Planning mobilise les décisions et les capacités opérationnelles. Écran, batch ou streaming ne créent pas à
      eux seuls de nouvelles capacités.
    scope: L’effet transactionnel est précisé U231. Le transfert de 20 unités est un exemple pédagogique proposé, sans processus
      universel, organisation humaine ni automatisation imposée.
    source_refs:
    - U231
    - AGENTS-2026-09-18
  model_links:
  - id: D05.c
    label: Stock Redistribution Decision
  - id: D04.k
    label: Transfer Order
- id: business-objects
  label: Les objets du métier
  title: Les objets gravitent autour des capacités
  rule: Objet métier, document et fait de gestion restent distincts. Dans FLOW, tout fait de gestion est associé à un document
    métier identifié, éventuellement structuré sans PDF ; aucun n’est un sous-comportement.
  established_at: '2026-09-19'
  scene:
    kind: objects
    caption: 'Exemple fictif : le document de réception identifié consigne le fait ; la commande porte ce qui était attendu.'
    items:
    - label: Objet métier
      text: La commande d’achat attendue
    - label: Document
      text: Le document de réception REC-EXEMPLE-01
    - label: Fait de gestion
      text: 60 pièces reçues vendredi
  question: Un comportement utilise un document. Le document devient-il un niveau en dessous ?
  choices:
  - label: Non, il est relié avec un sens explicite
    feedback: Le document reste un document. Le lien indique par exemple qu’il est produit ou utilisé, sans en faire un sous-comportement.
  - label: Oui, il prolonge la décomposition
    feedback: Cela mélangerait la manière d’agir et l’objet utilisé. Leur relation mérite d’être décrite, pas transformée
      en décomposition.
  explanation: Le document reste un document. Le lien indique par exemple qu’il est produit ou utilisé, sans en faire un sous-comportement.
    Un document métier peut être un enregistrement structuré sans PDF. La convention FLOW relie chaque fait de gestion à un
    document identifié. Une Information explicite le sens métier utile à une capacité, avec les éléments et le contexte nécessaires.
    Sa maille minimale se juge sur ce sens ; la cartographie ne prescrit pas de modèle de données implémentable.
  contributor:
    criterion: Décris ce que représente l’élément, puis précise s’il est produit, utilisé, référencé ou constaté. Ne déduis
      pas le lien de sa position visuelle.
    boundary: Le lien fait–document est requis dans FLOW ; il ne fixe ni nombre exact de documents, ni règles de version/correction,
      ni propriétaire unique. Ces détails se précisent selon le contexte.
    scope: 'U461 confirme le lien fait–document. Exemple et formulation pédagogique proposés ; aucun objet canonique ajouté,
      aucune autre convention de cycle de vie adoptée. U464 : notion Information et règle de granularité proposées, sans assimiler
      tout fait logique à un fait de gestion.'
    source_refs:
    - U61
    - U62
    - U262
    - AGENTS-2026-09-18
    - U461
    - U464
  model_links: []
- id: two-vocabularies
  label: Deux vocabulaires
  title: Distinguer le méta modèle du modèle métier
  rule: Le méta modèle décrit comment la carte est construite. Le modèle métier décrit les notions et responsabilités de l’entreprise.
  established_at: '2026-09-19'
  scene:
    kind: objects
    caption: Deux vocabulaires complémentaires, consultables séparément.
    items:
    - label: Méta modèle
      text: Système métier · Domaine · Sous-domaine · Capacité · Comportement · Relation
    - label: Modèle métier
      text: Stock · Commande · Réservation · Promesse
  question: Où chercher la différence entre une capacité et un comportement ?
  choices:
  - label: Dans le glossaire du méta modèle
    feedback: Il définit les éléments de la carte et leurs relations.
  - label: Dans le glossaire métier
    feedback: Le glossaire métier explique les notions de l’entreprise, par exemple un stock ou une commande.
  explanation: Utilise le glossaire du méta modèle pour comprendre la structure ; utilise le glossaire métier pour comprendre
    les responsabilités Supply.
  contributor:
    criterion: Décris une notion métier dans le glossaire métier et une règle de construction dans le méta modèle.
    boundary: Une relation métier ne crée pas une décomposition ; un terme du méta modèle ne devient pas une capacité.
    scope: Présentation demandée U450 ; formulation pédagogique proposée.
    source_refs:
    - U450
    - U451
    - U482
  model_links: []
