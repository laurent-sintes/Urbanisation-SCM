    source_sha256: c30e4eee196252c495fe80f25f21ec079dc720d326e338a1c50df545f257036a
    text: Précision Comparer également les tailles de lots et conditionnements admissibles, par produit et flux, en mobilisant
      [Replenishment](glossary:TER074), [ATP](glossary:TER044), [CTP](glossary:TER045) et [PTP](glossary:TER068) selon le
      besoin. Conserver pour chaque variante les quantités et dates réalisables, opérations supplémentaires, charge, reliquats,
      coûts et effets sur le service. Distinguer les options physiquement accessibles pour la décision courante des variantes
