glossary:
  terms:
  - id: MOD001
    notes:
    - Une décision produit une réponse ; la capacité responsable rend cette réponse effective.
    editorial_notes:
    - Les capacités de Planning se nourrissent des capacités de décision selon U229.
    - Le calcul est un moyen possible ; U229 préfère Decision et souhaite éviter Calculation comme intitulé de capacité.
    parent_term: MOD007
    name: Decision
    label_fr: Décision
    definition: Déterminer une réponse métier à partir d’hypothèses, d’objectifs et de contraintes.
    short_description: Choisir une réponse métier selon les faits, objectifs et contraintes.
  - id: MOD002
    notes:
    - Dans FLOW, la planification peut porter l’application du plan retenu en mobilisant les capacités responsables. Elle
      n’absorbe pas leur responsabilité ni l’exécution physique.
    editorial_notes:
    - Inventory Planning comporte Scenario Construction, Simulation & Analysis et Scenario Execution Adaptation depuis U290.
      Comparaison, autorisation et mise en action restent des fonctions utiles.
    - Les accords U269/U271 remplacés sont conservés dans d05-refactoring.yaml et audits/2026-09-17-refonte-appliquee/modeling-glossary-before.yaml.
      La généralisation détaillée à toute capacité Planning reste proposée.
    - 'U537 : l’application du plan relève d’un comportement du Planning concerné. Elle porte la mise en effet du résultat
      retenu et la connaissance de sa prise en compte ; elle ne se réduit pas à un appel technique. Le libellé Plan Application
      reste proposé.'
    - 'U538 : définir, maintenir et fournir une configuration utilisée par le Planning reste une responsabilité extérieure.
      Supply Protection (Stock Protection dans l’exemple utilisateur) gouverne les protections consommées par le Planning
      ; sa mise à jour ne devient pas un comportement de Planning.'
    - U537 remplace l’exclusion antérieure d’un comportement d’application. Les trois comportements Inventory Planning de
      U290 restent historiques et courants tant que leur décomposition précise n’est pas révisée. Aucun ajout automatique
      identique à tous les Plannings.
    parent_term: MOD007
    name: Planning
    label_fr: Planification
    definition: Construire et réviser un plan en mobilisant les décisions nécessaires.
    short_description: Construire et réviser un plan en mobilisant les décisions nécessaires.
  - id: MOD003
    notes:
    - Gestion tient les états et engagements ; Politique définit le cadre de règles applicable. Le nom d’une capacité ne détermine
      pas son type.
    editorial_notes:
    - U230 qualifie Stock Protection de gouvernance/management ; U231 précise sa mise à jour transactionnelle.
    - 'U538 : la responsabilité de configuration illustrée par Stock Protection reste extérieure au Planning qui la consomme,
      y compris lorsque ce Planning comporte un comportement d’application du plan. Nom canonique de la capacité actuelle
      : Supply Protection, D02.b.'
    - U586 ajoute Policy comme type dédié au cadre de règles applicable. La définition générale de Management est clarifiée
      ; le cas Stock Protection U230/U231 et ses accords restent historiques, sans reclassement automatique de Supply Protection.
      État antérieur conservé dans capability-types-U449.yaml#history_before_U586.
    parent_term: MOD007
    name: Management
    label_fr: Gestion
    definition: Tenir des états, des engagements ou des obligations dans la durée et gérer leurs évolutions.
    short_description: Tenir des états, des engagements ou des obligations dans la durée et gérer leurs évolutions.
  - id: MOD005
    notes:
    - Distinguer couverture candidate, affectation enregistrée, promesse confirmée et réalisation constatée ; ces qualifications
      ne constituent pas un cycle universel de statuts.
    - Préciser les quantités, dates, hypothèses et reliquats lorsque le besoin le nécessite ; aucun niveau de lot ou d’exemplaire
      imposé.
    - Les sens métier figurent séparément dans TER022 Couverture d’une demande et TER077 Couverture de stock. Cette convention
      ne crée ni capacité ni relation métier.
    guide_section: method
    name: Couverture — convention de description
    definition: Qualifier toute affirmation de couverture en indiquant ce qui est couvert, par quoi, dans quel périmètre et
      horizon, et selon quel critère de satisfaction.
    short_description: Préciser ce qui est couvert, par quoi et selon quel critère.
  - id: MOD006
    notes: []
    editorial_notes:
    - U262 retient Comportement et l’arrêt de la décomposition à ce niveau.
    - U263 impose des descriptions factuelles, sans niveaux promotionnels tels que Advanced ATP ; les appellations éditeur
      restent dans les correspondances marché.
    - 'U265 : une décomposition en comportements est justifiée par une complexité ou un bénéfice ciblé ; elle n’est pas systématique.
      La justification est portée par fields.decomposition_rationale sur la capacité ; sa rédaction détaillée conserve sa
      propre portée de validation.'
    - 'U282 précise la maille recherchée sur Supply Protection : mécanismes métier de protection, plutôt que liste des opérations
      sur Allocation. Les opérations fonctionnelles restent matière de conception produit ; elles ne constituent pas un nouveau
      niveau inférieur dans le modèle. Les quatre mécanismes BHV017–020 ont été intégrés U290 ; la proposition antérieure
      reste historique.'
    - U283 retient Mécanisme, Politique, Variante ou bénéfice comme critères différenciants de décomposition. Pour Planning,
      les effets sur les pratiques humaines et les processus distinguent les comportements des fonctions de produits. Ces
      critères ne constituent pas quatre niveaux supplémentaires.
    - 'U284 confirme la direction U283 et retient Simulation & analyse en un seul comportement : les impacts sont intégrés
      à ce comportement, sans Scenario Impact Analysis autonome dans la cible.'
    - U389 exige une liste concrète issue de l’existant. Les formes se recouvrent et ne sont ni des sous-niveaux ni une classification
      obligatoire des nœuds.
    - 'Le bénéfice ciblé reste un critère transversal de justification U265/U283 : il peut différencier une manière d’agir,
      mais un bénéfice vague ne remplace pas la description de cette manière d’agir.'
    - U389 a analysé les exemples de visibilité comme propositions distinctes du catalogue de l’époque. Depuis U406/U409,
      Operations Tracking porte Warehouse Visibility, Transportation Visibility, Store Visibility et Process Tracking (BHV079–082).
      L’analyse U389 reste une photographie historique ; leur présence actuelle ne vaut pas publication ni validation globale
      des détails.
    - 'U398 : la mutualisation peut se lire dans les liens. Décrire le comportement mobilisé et sa différence métier selon
      le contexte ; aucun comportement automatique par appelant et aucun sous-comportement. U399 : règles consignées pour
      le prochain audit et/ou les prochaines améliorations, sans déclencher de nouvelle revue. Convention : modeles/backlog/business-interactions.yaml.'
    - 'U501 : pour Order Backlog Optimization Request, Déclenchement et Activité regroupent visuellement des comportements
      au même niveau terminal. L’angle de lecture est explicite ; il ne crée ni parent intermédiaire, ni séquence obligatoire,
      ni requalification des comportements historiques. Cette décomposition est historique depuis U552 : les modes de sollicitation
      sont des modalités de la gestion de demande, tandis que simulation et autorisation relèvent directement de Order Backlog
      Planning ; aucun sous-comportement.'
    name: Capability Behavior
    label_fr: Comportement
    definition: Manière identifiable dont une capacité agit dans une situation donnée. Elle précise ce qui change dans son
      action ou dans le résultat attendu.
    short_description: Manière identifiable dont une capacité agit dans une situation donnée. Elle précise ce qui change dans
      son action ou dans le résultat attendu.
  - id: MOD007
    notes:
    - Le type décrit le résultat dominant de la capacité. Cette grille est une convention FLOW, pas une nouvelle hiérarchie.
      Aucune capacité n’est reclassée par cette présentation.
    editorial_notes:
    - Les sept valeurs présentes dans FLOW sont action, management, policy, knowledge, orchestration, planning et decision.
      Policy est ajouté par instruction U586.
    - La grille détaillée et les dix compléments proposés sont consignés dans capability-types-U449.yaml ; la nature propre
      de chaque capacité reste portée par son fields.nature.
    - 'U500/U501 : une capacité qui porte une demande peut préciser Frontoffice (sollicitation externe au Domain), Backoffice
      (sollicitation interne) ou les deux. Ce qualificatif d’origine est distinct de sa nature, du déclencheur et de la provenance
      de l’événement ; aucune valeur n’est inférée du nom ou du parent.'
    - Un même Purpose réunit références et policies U618 ; le type Policy qualifie des capacités distinctes des projections
      et des vues. Purpose, type de capacité et gouvernance des données sont des dimensions distinctes. Aucun comportement
      par paramètre ni nouveau niveau hiérarchique.
    - 'U767 : Evaluation complète les types pour ATP/CTP/PTP, indépendamment de leur mise en œuvre humaine ou automatisée.'
    values:
      Action: Effectuer une opération métier ou matérialiser une évolution autorisée des données et engagements.
      Gestion: Tenir des états, des engagements ou des obligations dans la durée et gérer leurs évolutions.
      Politique: Définir, maintenir et rendre applicables les règles, politiques et configurations métier dont le Domain porte
        la maîtrise, avec leur portée, leur validité et leurs conditions d’usage.
      Connaissance / visibilité: Établir, actualiser et rendre accessible une connaissance fiable des états, faits et résultats
        attendus.
      Orchestration: Conduire les activités et attentes d’un parcours, solliciter les contributions autorisées et suivre leurs
        résultats. La coordination des prestations confiées en constitue un périmètre spécialisé.
      Planification: Construire et réviser un plan en mobilisant les décisions nécessaires.
      Décision: Déterminer une réponse métier à partir des faits, règles, objectifs et contraintes applicables, en incluant
        les calculs nécessaires.
      Intégration: Acquérir ou transmettre des informations métier entre domaines ou exécutants, les reconnaître et les rapprocher
        du contexte local pour les rendre utilisables avec leur provenance et leur résultat de prise en compte.
      Registre: Tenir un registre métier durable de faits reconnus, datés et justifiés, en assurant leur traçabilité et leurs
        corrections.
      Évaluation: Type de capacité qui évalue des possibilités, leur faisabilité ou leurs conséquences à partir de faits,
        règles et hypothèses, en explicitant résultats, conditions et incertitudes, sans sélectionner une réponse ni engager
        sa réalisation.
    source_refs:
    - U887
    name: Capability Nature
    label_fr: Type de capacité
    definition: Qualifier une capacité selon son résultat métier dominant, indépendamment de son nom, de ses comportements
      et de sa réalisation technique.
    short_description: Résultat métier dominant qui caractérise une capacité.
  - id: MOD008
    notes:
    - U482 remplace Universe par Domain à ce niveau. L’identifiant MOD008 est conservé ; les publications historiques gardent
      leur vocabulaire.
    - U780 ajoute Business System au-dessus de Domain ; la profondeur de description varie selon le périmètre. Les publications
      historiques gardent leurs niveaux.
    editorial_notes:
    - U482 remplace Universe par Domain à ce niveau. L’identifiant MOD008 est conservé ; les publications historiques gardent
      leur vocabulaire.
    - U780 ajoute Business System au-dessus de Domain ; la profondeur de description varie selon le périmètre. Les publications
      historiques gardent leurs niveaux.
    source_refs:
    - U889
    name: Domain
    label_fr: Domaine
    definition: Grand périmètre cohérent de responsabilités métier au sein d’un [Business System](method:MOD022). La profondeur
      de description dépend du périmètre. Lorsqu’un domaine est détaillé jusqu’aux [capacités](method:MOD015), ses [sous-domaines](method:MOD013)
      les regroupent obligatoirement dans des [Business Areas](method:MOD039).
    short_description: Grand périmètre de responsabilités métier au sein d’un système métier.
  - id: MOD013
    notes:
    - 'Chaque [capacité](method:MOD015) possède exactement un parent métier : une [Business Area](method:MOD039) de son [sous-domaine](method:MOD013).
      Le rattachement direct au sous-domaine est interdit dans le modèle courant ; les publications historiques conservent
      leur structure.'
    - Les référentiels d’Operational References restent des objets documentaires, liés aux capacités sans former un niveau
      de responsabilité.
    - La structure métier ne prescrit ni équipe, ni application, ni découpage logiciel.
    editorial_notes:
    - 'U673 : Subdomain remplace Purpose dans le backlog ; les publications historiques conservent Area ou Purpose selon leur
      version.'
    source_refs:
    - U889
    name: Subdomain
    label_fr: Sous-domaine
    definition: Périmètre cohérent de responsabilités métier au sein d’un [Domain](method:MOD008). Ses [capacités](method:MOD015)
      appartiennent chacune à une [Business Area](method:MOD039) de ce sous-domaine.
    short_description: Regroupement cohérent de capacités au sein d’un domaine.
  - id: MOD009
    notes:
    - 'La responsabilité sur ces données est précisée séparément : qui les tient, qui les fournit et qui construit les vues
      utiles.'
    - Une capacité peut utiliser une référence (uses-reference) ou l’alimenter avec des apports sourcés (supplies-reference).
      Ces liens portent conditions et effets, sans rattachement hiérarchique ni transfert de maîtrise ; les associations entre
      références restent distinctes.
    - Un sujet partagé n’impose pas un référentiel technique commun. Une source extérieure peut garder l’autorité d’entreprise
      tandis que le domaine tient une référence locale utilisable et justifiée.
    name: Business Reference
    label_fr: Référentiel métier
    definition: Données de référence décrivant un sujet métier et nécessaires aux capacités pour exercer leurs responsabilités.
    short_description: Données de référence décrivant un sujet métier, avec responsabilités de source et d’usage explicites.
  - id: MOD010
    name: Model Relationship
    label_fr: Relation du modèle
    definition: Lien explicite décrivant une appartenance, une présentation ou une interaction métier entre éléments.
    short_description: 'Lien explicite entre des éléments du modèle : appartenance, présentation ou interaction.'
  - id: MOD011
    notes:
    - Un comportement peut se distinguer par une politique, un mécanisme, une variante de prise en charge, un périmètre, une
      dimension de raisonnement, un effet sur un engagement ou une pratique de planification. Ces formes ne sont pas des sous-niveaux.
    name: Behavior Nature
    label_fr: Type de comportement
    definition: Forme qui explique ce qui distingue une manière d’agir au sein d’une capacité.
    short_description: Critère qui distingue une manière d’agir au sein d’une capacité.
  - id: MOD012
    notes:
    - Définition proposée pour FLOW, inspirée de notions distinctes ; aucune norme consultée ne donne exactement cette définition
      d’Information.
    - Le minimum se juge au regard d’une question métier et d’un contexte explicites. Le sens peut s’appuyer sur d’autres
      informations identifiées, sans recopier tout leur contenu.
    - Insécable signifie ici que les éléments et leurs relations nécessaires au sens étudié doivent être conservés. Cela ne
      prouve ni l’irréductibilité logique d’un fait élémentaire ni l’indivisibilité d’un stockage ou d’une mise à jour.
    - Si deux parties portent des sens autonomes utiles à des questions distinctes, les décrire comme informations reliées.
      Une commande, un dossier complet ou une fiche produit ne sont pas déclarés minimaux par leur seul nom.
    - Le modèle décrit des types d’information ; un exemple chiffré illustre une occurrence. Une valeur isolée n’a pas nécessairement
      de sens métier sans son contexte.
    - Information, objet métier, document et fait de gestion ne sont pas des synonymes. Une information décrit quelque chose
      de pertinent ; le document la formalise ; un fait de gestion rend compte d’un événement métier.
    - 'Les informations sont reliées aux capacités par un rôle explicite : connaître, utiliser, établir, modifier ou constater.
      Ces verbes pédagogiques ne créent pas de nouveaux types de relation dans le schéma.'
    - Pour une information de référence projetée, préciser l’autorité et l’alimentation métier utiles, sans inventer de maître
      installé ni transférer sa responsabilité à Supply.
    editorial_notes:
    - Le fait élémentaire de la logique ou d’ORM n’est pas automatiquement un fait de gestion FLOW. La règle U461 fait–document
      demeure attachée aux faits de gestion ; elle ne requiert pas un document distinct pour chaque propriété ou proposition.
    name: Information
    label_fr: Information métier
    definition: |-
      Ensemble minimal d’éléments qui, reliés dans un contexte donné, portent un sens métier déterminé et explicitent ce qu’une capacité connaît, utilise, produit ou fait évoluer.

      L’information est décrite indépendamment de sa représentation informatique. La cartographie des informations métier ne constitue pas un modèle de données implémentable.
    short_description: Connaissance métier utilisée, produite ou modifiée par une capacité, indépendamment de son format informatique.
  - id: MOD014
    values:
      Domain-managed: 'Le domaine tient les données : il les crée, les consulte, les modifie et les retire.'
      Projection: Le domaine reçoit des données sous autorité d’une source extérieure et tient une référence locale utilisable,
        avec provenance et validité ; cette responsabilité ne se réduit pas à une copie passive.
      Domain-View: Le domaine construit et actualise une vue à partir des données disponibles.
    notes: []
    name: Data Responsibility
    label_fr: Responsabilité sur les données
    definition: Responsabilité de tenir les données d’un domaine, de recevoir celles d’une source externe ou de construire
      une vue utile aux capacités.
    short_description: Responsabilité de tenir les données d’un domaine, de recevoir celles d’une source externe ou de construire
      une vue utile aux capacités.
  - id: MOD015
    notes:
    - Un produit peut contribuer à plusieurs capacités ; une fonctionnalité ne suffit pas à définir une capacité.
    - Le glossaire métier TER001 conserve un renvoi historique vers cette autorité méthodologique.
    - 'Certains documents, registres et ensembles de données constituent des actifs durables de l’entreprise. Leur nom peut
      désigner une capacité de les produire, les tenir ou les exploiter : Sales Order, Inventory Ledger ou Inventory Visibility,
      avec une définition qui explicite le service rendu.'
    - La présence d’un actif ne crée pas automatiquement une capacité par document, table, champ ou écriture. Justifier la
      responsabilité durable, son résultat et sa maille ; un nom orienté actif n’est pas à lui seul un défaut de modélisation.
    - Les domaines et sous-domaines regroupent finalités, connaissances ou problématiques pour partager et collaborer. Ils
      ne reproduisent ni organigramme ni découpage technologique ; automatisation et mutualisation peuvent conduire à des
      réalisations transversales.
    - Une capacité est suffisamment détaillée lorsque sa contribution à un scénario métier peut être expliquée sans masquer
      des responsabilités métier distinctes. Une décomposition supplémentaire se justifie lorsqu’elle rend identifiable un
      résultat ou une responsabilité utile au pilotage ; une étape, un paramètre, un document ou une fonction d’outil ne suffit
      pas à créer une capacité.
    - 'Le parcours mobilise des capacités et traverse leurs responsabilités ; il ne devient pas leur parent dans la hiérarchie.
      [Process Management](model:subdomain-process-management) porte le savoir-faire de définition, conduite, supervision
      et analyse de ces parcours. [Process, Tasks & Order Visibility](model:BHV082) est une capacité : son identité persistante
      BHV082 ne détermine pas sa nature ni son code de lecture.'
    editorial_notes:
    - 'Critère U751/U752 : imaginer des humains avec du papier, un stylo et des calepins, puis décrire ce qu’ils font et les
      actifs qu’ils tiennent pour faire fonctionner l’entreprise. Ce test révèle la responsabilité métier ; il ne prescrit
      pas une réalisation manuelle.'
    - 'U787 : TOGAF et BIZBOK constituent les appuis méthodologiques. Le niveau 4 FLOW, les comportements terminaux et la
      finesse des décisions restent des conventions locales ; les numéros de niveau ne prouvent pas une équivalence de granularité.
      Voir MOD027 et MOD028 ; MOD026 conserve la notion historique retirée sous U791.'
    name: Capability
    label_fr: Capacité
    definition: |-
      Une capacité est une aptitude durable de l’entreprise à produire un résultat métier identifiable, indépendamment de son organisation et de ses outils. Elle exprime ce que l’entreprise sait faire pour agir, décider, tenir des engagements ou des actifs métier, et produire ou exploiter une connaissance.

      Son périmètre permet d’identifier sa contribution propre dans des scénarios métier : les informations et conditions qu’elle mobilise, le résultat qu’elle produit et ses limites de responsabilité. Ses comportements précisent les manières significatives dont elle s’exerce.
    short_description: Savoir-faire durable produisant un résultat métier, indépendant de l’organisation et des outils.
  - id: MOD016
    name: Capability Realization
    definition: 'Moyens concrets mobilisés pour exercer une capacité : acteurs, pratiques, outils et échanges.'
    short_description: Acteurs, pratiques, outils et échanges qui permettent d’exercer une capacité.
  - id: MOD017
    guide_section: method
    name: Function
    definition: 'Mot à qualifier avant emploi : il ne désigne pas un niveau unique adopté dans notre modèle.'
    short_description: 'Terme à préciser : il ne correspond pas à un niveau unique de ce modèle.'
  - id: MOD018
    name: Product Functionality
    definition: Possibilité offerte par un logiciel dans une version et une configuration données.
    short_description: Possibilité offerte par un logiciel dans une version et une configuration données.
    label_fr: Fonctionnalité de produit
  - id: MOD019
    guide_section: method
    name: Capability Grouping
    definition: Ensemble de capacités rapprochées selon un critère métier explicite pour faciliter la lecture de la carte.
    short_description: Rapprochement de capacités selon un critère métier pour faciliter la lecture.
  - id: MOD020
    notes:
    - Le registre est un actif métier ; son nom désigne la capacité de le tenir.
    - Une écriture proposée ne vaut pas un fait reconnu ; conserver fondement et corrections.
    - Convention de typage FLOW, pas une taxonomie éditeur ni une technologie imposée.
    parent_term: MOD007
    name: Ledger
    definition: Type de capacité qui tient un registre métier durable de faits reconnus, datés et justifiés, en assurant leur
      traçabilité et leurs corrections.
    short_description: Capacité de tenir un registre durable de faits reconnus, datés, justifiés et corrigibles.
  - id: MOD021
    notes:
    - '[ATP](glossary:TER044), [CTP](glossary:TER045) et [PTP](glossary:TER068) sont des capacités de décision : elles déterminent
      une proposition et conservent leurs évaluations internes. La confirmation de l’engagement appartient à [Order Management](model:D04).'
    - 'Une décision conserve ses calculs internes : aucune capacité créée pour chaque formule.'
    - Knowledge établit et expose la connaissance de la situation ; Evaluation apprécie des possibilités dans un contexte.
    - Convention FLOW ; le marché peut réunir évaluation et sélection dans une même fonction.
    parent_term: MOD007
    name: Evaluation
    definition: Type de capacité qui évalue des possibilités, leur faisabilité ou leurs conséquences à partir de faits, règles
      et hypothèses, en explicitant résultats, conditions et incertitudes, sans sélectionner une réponse ni engager sa réalisation.
    short_description: Évaluer des possibilités et leurs conséquences sans choisir ni engager leur réalisation.
  - id: MOD022
    notes:
    - La notion méthodologique reste distincte des noms des systèmes dans le glossaire métier.
    - 'Design & Development et Enterprise Management & Control : contexte ; Business Operations : domaines ; Supply Chain
      Orchestration : capacités et comportements.'
    - Les sources marché comparent les périmètres ; elles ne définissent pas un équivalent exact de ce niveau FLOW.
    name: Business System
    label_fr: Système métier
    definition: Ensemble de domaines métier qui coopèrent pour une finalité commune, indépendamment de leur organisation et
      de leurs applications.
    short_description: Ensemble de domaines qui coopèrent pour une finalité commune.
  - id: MOD023
    guide_section: codes
    name: Persistent Identifier
    label_fr: Identifiant persistant
    definition: Identité stable d’un élément, distincte de son nom et de son code de lecture. Une migration exceptionnelle
      exige une décision explicite et la mise à jour de ses références.
    short_description: Identité stable d’un élément, distincte de son nom et de son code de lecture. Une migration exceptionnelle
      exige une décision explicite et la mise à jour de ses références.
  - id: MOD024
    guide_section: codes
    name: Display Code
    label_fr: Code de lecture
    definition: Repère court composé d’un préfixe de type et d’un numéro suivant l’ordre de lecture dans une publication déterminée.
    short_description: Code court facilitant le repérage d’un élément dans une publication.
  - id: MOD025
    guide_section: codes
    name: Reading Order
    label_fr: Ordre de lecture
    definition: Ordre de référence du parcours de l’arbre, partagé par les cartes et fiches, figé avec la publication.
    short_description: Ordre de lecture de l’arbre, fixé pour une publication.
  - id: MOD026
    notes:
    - Le cas d’usage expose l’objectif et l’ensemble des chemins possibles ; un scénario décrit un chemin particulier.
    - 'Exemple illustratif : réexaminer la satisfaction d’une commande après une rupture d’approvisionnement.'
    - Le Business Scenario [TOGAF](guide:references#method-section-1) peut inclure l’environnement organisationnel et technique
      ; il est plus large que cette convention FLOW. Aucun synonyme exact ni conformité UML revendiqués.
    status: retired
    editorial_notes:
    - 'U791 : notion retirée du métamodèle actif. Cette entrée conserve le sens historique U787 et son identifiant ; utiliser
      MOD027 Business Scenario et MOD028 Capability Mobilization Path. Aucun objet distinct Business Use Case n’est requis
      dans FLOW.'
    name: Business Use Case
    label_fr: Cas d’usage métier
    definition: |-
      Un cas d’usage métier décrit comment l’entreprise répond à une intention ou à un événement métier pour atteindre un résultat observable ayant une valeur pour une partie prenante. Il précise la situation initiale, le déclencheur, le résultat attendu, les conditions et les variantes significatives, ainsi que les capacités mobilisées et leurs contributions.

      Il reste indépendant de l’organisation et des outils : les participants sont décrits par leurs rôles métier, sans imposer une équipe, une application ou un mode de réalisation.
    short_description: Ancienne notion du modèle, remplacée par scénario métier et parcours de mobilisation.
  - id: MOD027
    notes:
    - Le scénario possède une identité autonome ; il n’appartient pas à un Domain, un Subdomain ou une Capability. Les relations
      de mobilisation et les affichages contextuels restent possibles.
    - Un scénario peut être examiné selon plusieurs parcours de mobilisation des capacités. Son résultat recherché ne préjuge
      pas de la réponse retenue.
    - 'Exemple illustratif : une réception retardée menace une livraison promise ; rechercher un stock alternatif ou réviser
      la promesse constituent deux réponses à examiner.'
    - 'Convention FLOW : ce scénario n’est pas une reprise exacte du Business Scenario [TOGAF](guide:references#method-section-1),
      qui peut aussi décrire organisation et technologie, ni du Scenario [BIZBOK](guide:references#method-section-0), qui
      désigne une application de l’architecture métier à une problématique d’entreprise.'
    - Le catalogue se parcourt par flux de valeur et se filtre par événement, objet métier, situation et capacités mobilisées.
      Un scénario conserve une seule identité, même lorsqu’il contribue à plusieurs flux.
    editorial_notes:
    - 'U792 : navigation principale du catalogue autonome par flux de valeur, avec filtres transverses (événement, objet métier,
      situation nominale/exception/reprise, capacités mobilisées). Identité unique, rattachements multiples possibles. Les
      flux doivent être formalisés avant qualification ; leur liste n’est pas encore adoptée. U793 : scenario_catalog porte
      les scénarios autonomes ; les illustrations locales restent dans fields.examples et les anciennes publications gardent
      leur contrat. Les petits exemples pédagogiques ne deviennent pas automatiquement des scénarios structurés.'
    name: Business Scenario
    label_fr: Scénario métier
    definition: Description d’une situation métier délimitée, de son déclencheur, des conditions qui la caractérisent et du
      résultat recherché pour une partie prenante. Il sert à examiner comment l’entreprise peut répondre à cette situation,
      indépendamment de son organisation et de ses outils.
    short_description: Situation métier décrite par son déclencheur, ses conditions et le résultat recherché.
  - id: MOD028
    notes:
    - Une capacité peut intervenir plusieurs fois ; plusieurs peuvent contribuer en parallèle ; certaines entretiennent continuellement
      une connaissance ou un registre.
    - 'À chaque étape : quel résultat métier est nécessaire ? Quelle capacité en porte la responsabilité ? Quelles informations,
      décisions ou conditions lui sont nécessaires ? Qui utilise son résultat pour poursuivre ou terminer le parcours ?'
    - Un trou apparaît lorsqu’un résultat nécessaire reste sans responsable identifié, ou lorsqu’une étape suppose une information
      ou un engagement que personne ne produit. Distinguer capacité manquante, description insuffisante, lien absent ou responsabilité
      externe au périmètre.
    - Le parcours permet de vérifier la couverture des situations examinées, pas de prouver à lui seul l’exhaustivité du modèle.
    - La capacité définit l’aptitude durable ; le scénario expose la situation et le résultat recherché ; le parcours décrit
      les étapes et les contributions des capacités. Une étape ne constitue pas une capacité ni un comportement.
    - La frontière avec un processus tient à la finalité et au contenu de la représentation, pas à la seule absence de rôles.
      Un processus peut être abstrait ; le parcours FLOW limite son détail à l’analyse de mobilisation et de couverture.
    - 'Ce parcours ne constitue pas automatiquement un Value Stream : un flux de valeur explicite une création de valeur de
      bout en bout pour une partie prenante, tandis qu’un parcours peut étudier une exception locale.'
    - 'U1115 : les participants de contexte sont liés séparément dans context_participants avec rôle, conditions et sources,
      à leur profondeur déclarée [Domain](method:MOD008), [Subdomain](method:MOD013) ou [Business Area](method:MOD039). Cette
      [participation de contexte](method:MOD051) ne remplace pas une contribution de [capacité](method:MOD015) ou [référence](method:MOD009)
      et ne crée ni capacité périphérique ni parent métier.'
    name: Capability Mobilization Path
    label_fr: Parcours de mobilisation des capacités métier
    definition: Un parcours de mobilisation décrit, pour un scénario métier donné, les étapes nécessaires à l’obtention du
      résultat recherché et les contributions des capacités à ces étapes. Il explicite les dépendances et les résultats intermédiaires
      utiles à l’analyse de couverture, sans prescrire l’organisation, l’affectation des tâches ni les outils de réalisation.
    short_description: Étapes et contributions des capacités permettant de répondre à un scénario, sans prescrire organisation
      ou outils.
  - id: MOD029
    notes:
    - Les étapes de valeur et les étapes de mobilisation décrivent des points de vue différents ; aucune correspondance automatique
      entre elles n’est supposée.
    editorial_notes:
    - 'Convention FLOW mise en œuvre sous U793. Flux et étapes de valeur : appui BIZBOK/TOGAF ; étape de mobilisation : convention
      locale. Aucun alignement automatique entre niveaux ou étapes.'
    name: Value Stream
    label_fr: Flux de valeur
    definition: Un flux de valeur décrit, du point de vue d’une partie prenante, la progression vers un résultat qui lui apporte
      une valeur identifiable. Il précise le bénéficiaire, la valeur attendue, le déclencheur, les frontières et les étapes
      de valeur ; il peut traverser plusieurs domaines.
    short_description: Progression vers un résultat qui apporte une valeur à un bénéficiaire.
  - id: MOD030
    notes:
    - Les étapes de valeur et les étapes de mobilisation décrivent des points de vue différents ; aucune correspondance automatique
      entre elles n’est supposée.
    editorial_notes:
    - 'Convention FLOW mise en œuvre sous U793. Flux et étapes de valeur : appui BIZBOK/TOGAF ; étape de mobilisation : convention
      locale. Aucun alignement automatique entre niveaux ou étapes.'
    name: Value Stream Stage
    label_fr: Étape de valeur
    definition: Une étape de valeur représente une progression identifiable vers la valeur attendue d’un flux. Elle précise
      le résultat de valeur et les conditions d’entrée et de sortie ; elle ne correspond pas automatiquement à une étape d’un
      parcours particulier.
    short_description: Progression identifiable dans un flux de valeur, avec un résultat et des conditions d’entrée et de
      sortie.
  - id: MOD031
    notes:
    - Les étapes de valeur et les étapes de mobilisation décrivent des points de vue différents ; aucune correspondance automatique
      entre elles n’est supposée.
    editorial_notes:
    - 'Convention FLOW mise en œuvre sous U793. Flux et étapes de valeur : appui BIZBOK/TOGAF ; étape de mobilisation : convention
      locale. Aucun alignement automatique entre niveaux ou étapes.'
    name: Capability Mobilization Step
    label_fr: Étape de mobilisation des capacités
    definition: Une étape de mobilisation décrit une contribution au résultat d’un parcours donné, les capacités qui y contribuent,
      les informations et conditions nécessaires et le résultat intermédiaire. Elle ne constitue pas un niveau de décomposition
      des capacités.
    short_description: Contribution intermédiaire à un parcours, avec les capacités, informations et conditions nécessaires.
  - id: MOD032
    notes:
    - Notion méthodologique ; ne crée ni objet du métamodèle, ni pouvoir de décision supplémentaire.
    name: Enterprise Architecture Practice
    label_fr: Pratique d’architecture d’entreprise
    definition: Fonction et pratique qui relie stratégie, métier, organisation, informations et technologie pour maintenir
      une cohérence durable pendant et après les transformations.
    short_description: Fonction et pratique qui relie stratégie, métier, organisation, informations et technologie pour maintenir
      une cohérence durable pendant et après les transformations.
  - id: MOD033
    notes:
    - Notion méthodologique ; ne crée ni objet du métamodèle, ni pouvoir de décision supplémentaire.
    name: Domain-Driven Design
    label_fr: Conception guidée par le domaine
    definition: Approche de conception logicielle qui construit un langage et des modèles avec les experts métier, puis délimite
      leur portée et leurs coopérations.
    short_description: Approche de conception logicielle qui construit un langage et des modèles avec les experts métier,
      puis délimite leur portée et leurs coopérations.
  - id: MOD034
    notes:
    - Notion méthodologique ; ne crée ni objet du métamodèle, ni pouvoir de décision supplémentaire.
    name: Product Approach
    label_fr: Démarche produit
    definition: Manière de travailler qui part des problèmes des utilisateurs et des résultats attendus, éprouve des réponses,
      les réalise et mesure leurs effets dans la durée.
    short_description: Manière de travailler qui part des problèmes des utilisateurs et des résultats attendus, éprouve des
      réponses, les réalise et mesure leurs effets dans la durée.
  - id: MOD035
    notes:
    - Notion méthodologique ; ne crée ni objet du métamodèle, ni pouvoir de décision supplémentaire.
    name: Bounded Context
    label_fr: Contexte délimité
    definition: Périmètre dans lequel un modèle logiciel et son langage ont un sens cohérent, avec des relations explicites
      vers les autres contextes.
    short_description: Périmètre dans lequel un modèle logiciel et son langage ont un sens cohérent, avec des relations explicites
      vers les autres contextes.
  - id: MOD036
    notes:
    - Notion méthodologique ; ne crée ni objet du métamodèle, ni pouvoir de décision supplémentaire.
    name: Architecture Decision Record
    label_fr: Fiche de décision d’architecture
    definition: Fiche courte conservant le contexte, les options, le choix, ses raisons et ses conséquences ; elle peut être
      ouverte avant la décision puis actualisée avec son état.
    short_description: Fiche courte conservant le contexte, les options, le choix, ses raisons et ses conséquences ; elle
      peut être ouverte avant la décision puis actualisée avec son état.
  - id: MOD037
    notes:
    - Notion méthodologique ; ne crée ni objet du métamodèle, ni pouvoir de décision supplémentaire.
    name: Transformation Leader
    label_fr: Responsable de la transformation
    definition: 'Rôle de conduite de la transformation porté ici par la direction de programme : coordonner résultats, équipe,
      dépendances et préparation des décisions dans son mandat.'
    short_description: 'Rôle de conduite de la transformation porté ici par la direction de programme : coordonner résultats,
      équipe, dépendances et préparation des décisions dans son mandat.'
  - id: MOD038
    notes:
    - Notion méthodologique ; ne crée ni objet du métamodèle, ni pouvoir de décision supplémentaire.
    name: Transformation Board
    label_fr: Comité de pilotage de transformation
    definition: Nom proposé pour le comité mensuel existant réunissant les sponsors concernés pour les arbitrages structurants,
      le suivi des bénéfices et les réorientations relevant de son autorité.
    short_description: Nom proposé pour le comité mensuel existant réunissant les sponsors concernés pour les arbitrages structurants,
      le suivi des bénéfices et les réorientations relevant de son autorité.
  - id: MOD039
    notes:
    - Niveau obligatoire entre sous-domaine et capacité ; une seule capacité reste admissible.
    - Ne désigne automatiquement ni une équipe, ni un produit, ni une application.
    - Chaque capacité est rattachée à une Business Area de son sous-domaine.
    - Une Area de références porte leur cohérence et leur fourniture locale. Elle les présente sans les transformer en capacités
      ; chaque référence conserve un parent de présentation unique.
    name: Business Area
    label_fr: Périmètre de responsabilité métier
    definition: Partie cohérente de la responsabilité d’un sous-domaine, définie par sa finalité, ses résultats et ses frontières.
      Elle porte des capacités ou des références documentaires ; dans un domaine explicitement limité à ce niveau, elle peut
      rester un périmètre de contexte sans descendants.
    short_description: Périmètre de responsabilité obligatoire entre un sous-domaine et ses capacités ; peut aussi porter
      des références.
  - id: MOD040
    role: Distinguer une connaissance métier construite d’un accès aux données.
    notes:
    - 'Justifier une [capacité](method:MOD015) par la connaissance métier produite : rapprochement de faits, consolidation
      sans double compte, interprétation des états, qualification de validité ou traitement des incohérences.'
    - Une consultation, une recherche, un affichage, une copie ou une transformation purement technique ne justifient pas
      une capacité Visibility autonome. Une règle métier simple peut suffire si elle établit un résultat distinct ; aucune
      complexité minimale artificielle.
    - Visibility établit ce qui est connu, estimé ou incertain. Une [Evaluation](method:MOD021) apprécie des possibilités
      et une [Decision](method:MOD001) choisit une réponse. L’acquisition de faits peut contribuer à Visibility sans imposer
      un nouveau découpage technique.
    - Convention de nommage et de périmètre FLOW, rattachée à la nature Knowledge lorsqu’elle est pertinente ; ni nouveau
      type, ni niveau hiérarchique, ni prescription d’outil.
    - Avant un retrait, conserver les données, leurs sources, les responsabilités utiles et les dépendances des scénarios.
      Ne pas créer automatiquement une capacité générique de remplacement.
    examples:
    - '[Inventory Visibility](model:D01.c) rapproche stock, apports attendus et engagements sans compter deux fois une réception.'
    - '[Service Capacity Visibility](model:D06.b) interprète les informations fournisseur et distingue plafond, charge, disponibilité
      annoncée et inconnues.'
    - '[Operations Visibility](model:operations-visibility) consolide faits et attentes pour exposer la progression et les
      informations absentes.'
    - Lire le tarif reçu d’un [Product Price Book](model:product-price-book) et [Service Price Book](model:service-price-book)
      reste un accès au référentiel ; le choix économique appartient à la décision consommatrice.
    - '[Supply Plan Visibility](model:plans-visibility) et [Demand Plan Visibility](model:demand-plan-visibility) interprètent
      les prévisions pour une demande donnée, sans inventer une précision absente ni décider de sa couverture.'
    name: Visibility
    label_fr: Connaissance de la situation métier
    definition: Établir et restituer une connaissance métier exploitable à partir d’informations qui nécessitent un rapprochement,
      une consolidation, une interprétation ou une qualification métier. La simple consultation de données déjà établies ne
      justifie pas une capacité Visibility autonome.
    short_description: Établir une situation métier à partir d’informations à rapprocher ou qualifier, au-delà de leur simple
      consultation.
  - id: MOD041
    notes:
    - Cette frontière ne crée aucun niveau hiérarchique ni composant logiciel obligatoire. Dans FLOW, Supply Chain Management
      approfondit les aptitudes génériques ; Achat et Vente portent les Cases contextualisés.
    - 'Exemple : le Case Wholesale applique le contrôle de crédit à une vente avec des données financières sourcées ; il ne
      transforme pas cette règle en capacité générique du Core.'
    name: Business Core and Operational Context
    label_fr: Core métier et contexte opérationnel
    definition: Le Core porte des aptitudes génériques ; le contexte opérationnel combine ces aptitudes et les règles propres
      à une activité pour traiter ses demandes.
    short_description: Le Core porte des aptitudes génériques ; le contexte opérationnel combine ces aptitudes et les règles
      propres à une activité pour traiter ses demandes.
  - id: MOD042
    notes:
    - Préciser l’objet de la décision, les limites d’autorité, les preuves nécessaires et le destinataire d’une escalade.
      Un rôle de coordination ne donne pas automatiquement le pouvoir d’engager l’entreprise.
    - La méthode aide à expliciter ce mandat ; elle ne prétend pas que le mandat réel du programme est déjà arrêté.
    name: Decision Mandate
    label_fr: Mandat de décision
    definition: Périmètre explicite des décisions qu’un rôle ou une instance peut prendre, avec limites, conditions et modalités
      d’escalade.
    short_description: Périmètre explicite des décisions qu’un rôle ou une instance peut prendre, avec limites, conditions
      et modalités d’escalade.
  - id: MOD043
    notes:
    - Objet racine du modèle cible, distinct de la pratique Enterprise Architecture Practice (MOD032).
    name: Enterprise Architecture
    label_fr: Architecture d’entreprise cible
    definition: Objet racine du modèle cible. Il réunit les Business Systems par des relations explicites et permet de situer
      chaque responsabilité dans la cible, sans décrire à lui seul les applications qui les réaliseront.
    short_description: Représentation du SI Beaumanoir cible, au-dessus des systèmes métier.
  - id: MOD044
    notes:
    - La validation reconnaît le sujet et son périmètre ; elle ne confirme pas un dysfonctionnement ni une solution.
    - Impact sur le modèle, irritant d’usage, criticité et avancement du cadrage restent distincts. Les impacts à qualifier
      ne sont pas classés par défaut comme irritants.
    - Une décision argumentée de convergence totale, partielle ou de non-convergence peut résoudre le cadrage sans changement
      technique obligatoire. Une solution crédible ne prouve ni choix définitif ni réalisation.
    - Une option recommandée prête à arbitrer nomme la proposition et sa justification. Elle précède la clôture du cadrage
      et ne constitue ni une option retenue ni une réalisation.
    name: Hotspot
    label_fr: Point chaud
    definition: Sujet à creuser et à arbitrer, suivi dans une fiche autonome. Il peut concerner un écart entre modes de fonctionnement,
      une complexité d’implémentation, une contrainte de transition, un irritant d’usage ou une autre question de cadrage.
      Sa révélation ne démontre pas un dysfonctionnement. Un point chaud de périmètre est ancré sur un ou plusieurs objets
      du modèle ; un point chaud d’intégration relie exactement deux objets. Sa gravité combine la complexité d’arbitrage
      et la difficulté d’implémentation selon une grille publiée, sans mesurer automatiquement l’urgence ni l’impact.
    short_description: Sujet à creuser et à arbitrer, avec ou sans écart entre modes de fonctionnement.
  - id: MOD045
    notes:
    - Dimension facultative d’un hotspot ; comparer les SI, les périmètres d’un même SI, ou les deux, sans confondre différence
      et problème.
    - Chaque observation conserve son périmètre, ses sources, la nature de sa preuve et ses limites. Non évalué ne signifie
      pas absent.
    name: Gap Analysis
    label_fr: Analyse des écarts
    definition: Analyse des différences de prise en charge par le SI, de moyens de réalisation ou de règles de gestion d’un
      périmètre métier commun. Elle compare plusieurs SI, plusieurs parcours ou populations dans un même SI, ou les deux.
      Chaque observation précise ses sources, ses limites et, si nécessaire, son périmètre ; les écarts alimentent la question
      de convergence et les options à instruire.
    short_description: Comparer les réalisations et règles d’une même responsabilité métier entre SI ou entre périmètres d’un
      même SI.
  - id: MOD049
    notes:
    - Une question appartient au problème de cadrage ; ses Options peuvent rester à définir sans inventer de réponse.
    name: Hotspot Problem
    label_fr: Problème de cadrage
    definition: Un problème de cadrage formule une question précise issue du signal initial et de son analyse. Il peut s’appuyer
      sur une ou plusieurs analyses d’écarts sans se confondre avec elles. Chaque problème possède ses propres Options ; si
      elles ne sont pas encore définies, la liste reste vide et la question ouverte. Plusieurs problèmes peuvent appartenir
      au même Hotspot, sans partager implicitement leurs Options.
    short_description: Question de décision révélée par l’analyse d’un Hotspot, avec ses Options propres.
  - id: MOD050
    notes:
    - Chaque Option est rattachée à la question qu’elle cherche à résoudre ; sa présence ne vaut pas choix.
    name: Hotspot Option
    label_fr: Option
    definition: Une Option décrit une réponse possible à la question d’un problème de cadrage. Son principe, ses effets, conditions,
      compromis, complexité et niveau de preuve restent qualifiés. Une Option peut être proposée, crédible, recommandée ou
      retenue selon les champs explicites de la fiche ; sa présence seule ne la valide pas.
    short_description: Réponse possible à la question d’un problème de cadrage, sans choix implicite.
  - id: MOD051
    notes:
    - Convention FLOW U1115 répondant à la limite identifiée par EA-CAT-04 ; aucune équivalence de métamodèle éditeur n’est
      affirmée.
    - Les contributions d’une étape continuent à viser des capacités ou références ; un participant ne prouve ni capacité
      descendante ni réalisation installée.
    - Les anciens snapshots sans ce lien restent inchangés et ne sont pas complétés par le backlog.
    source_refs:
    - U1114
    - U1115
    review:
      state: proposed
      note: Mise en œuvre du Go sur l’audit EA ; terme et rédaction éditoriale proposés, sans accord étendu aux participants
        individuels.
    name: Context Participation
    label_fr: Participation de contexte
    definition: Une participation de contexte relie une étape d’un [parcours](method:MOD028) à un [Domain](method:MOD008),
      [Subdomain](method:MOD013) ou [Business Area](method:MOD039) de contexte à sa profondeur déclarée. Elle explique son
      rôle dans le résultat attendu, les conditions de sa participation et les sources qui la documentent. Elle reste distincte
      de la mobilisation d’une [capacité](method:MOD015) ou [référence](method:MOD009) et n’ajoute aucune appartenance à la
      hiérarchie métier.
    short_description: Lien sourcé entre une étape de parcours et une responsabilité de contexte, sans capacité artificielle.
  - id: MOD046
    notes:
    - Question d’architecture transverse de HS-023 ; l’autorité des règles reste dans Control Plane. Une trace de modification
      seule ne démontre pas la chaîne complète.
    - Références et limites de comparaison conservées dans la fiche HS-023 ; aucun standard, produit ou composant installé
      n’est déduit.
    name: Decision Provenance
    label_fr: Provenance des décisions
    definition: Chaîne reliant les données connues au moment du choix, les règles et leurs versions, les personnes ou mécanismes
      intervenus, le résultat et les effets qui en découlent. Elle aide à comprendre une décision produite à travers plusieurs
      composants. Une trace de modification seule ne reconstitue pas cette chaîne.
    short_description: Retrouver les données, règles, acteurs et effets qui ont conduit à une décision.
