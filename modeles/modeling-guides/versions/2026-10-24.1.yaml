    text: Précision Lorsque la possibilité étudiée dépend du conditionnement, vérifier les quantités admissibles, les conversions
      d'unités, les consignes applicables et les opérations nécessaires pour obtenir le résultat demandé. Une scission de
      commande ne réalise pas un déconditionnement physique. Si l'option nécessite une ouverture ou un reconditionnement autorisé,
      contrôler les matières, capacités, calendriers et délais correspondants. Expliquer la quantité et la date réalisables,
      les contraintes bloquantes et les hypothèses restant à confirmer. Le résultat peut alimenter la comparaison de conditionnements
      par [Simulation & Analysis](model:BHV006) ; il ne définit pas à lui seul un conditionnement optimal. Des packs déjà
      disponibles et admissibles relèvent d'[ATP](glossary:TER044) ; tout choix de conditionnement n'est donc pas un calcul
      [CTP](glossary:TER045).
