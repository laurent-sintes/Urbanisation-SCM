  - collection: terms
    id: TER006
    field_path:
    - context
    source_sha256: c8afb556dffd711e911d854a196b72b7e6e19165612c50d8d87cec1983adbdcf
    text: 'En [intercompany](glossary:TER122), relier les positions des sociétés et les branches de [commande](glossary:TER012)
      au même flux de biens. Un [stock](glossary:TER005) visible chez B n’est pas automatiquement utilisable pour une [promesse](glossary:TER014)
      de A : les droits d’usage, engagements et autorisations restent à vérifier. Distinguer les quantités en transit de leurs
      propriétaires et détenteurs ; un changement de propriétaire ne crée pas de quantité physique supplémentaire. Les vues
      par société et la vue groupe ne s’additionnent pas. La [valorisation](glossary:TER229) et la reconnaissance comptable
      du transit restent financières.'
  - collection: terms
    id: TER012
    field_path:
    - market_inspiration
    - flow_approach
    source_sha256: f1b088ecf1a894d8699a7d6f3f4d70632f44cc56d633a8c66ed6d62e35265dcd
    text: |-
      Dans le vocabulaire FLOW retenu, un Order porte identité, contenu, destinataire, engagements et état. Il peut être échangé sous forme de données structurées ; il ne se réduit pas à un fichier imprimable. Un appel technique ou un service interne ne crée pas automatiquement un Order. Les usages natifs des éditeurs peuvent être plus larges.

      Relier aussi les engagements réciproques [intercompany](glossary:TER122) : société porteuse et contrepartie, identités d’origine, lignes, quantités, versions et rôle dans la chaîne. Lier la vente de B à A et l’achat de A auprès de B ne les fusionne pas ; la vente éventuelle de A au client garde son identité. Conserver correspondances et périmètre des changements ; chaque famille de [commande](glossary:TER012) demeure responsable de leur validité et de leur acceptation. Le [dossier](glossary:TER064) exploite ces liens pour solliciter et suivre les réponses. Les mêmes 100 pièces ne deviennent pas trois besoins indépendants.
