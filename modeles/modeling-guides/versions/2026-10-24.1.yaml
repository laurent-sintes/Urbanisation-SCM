  - collection: principles
    id: PRINCIPLE-INVENTORY-SCENARIO-APPLICATION
    field_path:
    - statement
    source_sha256: 2934372094b347b0b9ed05cab1952d66410fd0bb4486ee42967f9eaa719c3e44
    text: Planning mobilise des décisions distinctes. L’application du plan relève d’un comportement du Planning concerné
      ; sa décomposition précise doit être justifiée par son effet métier. Les capacités qui définissent, maintiennent et
      fournissent les configurations consommées, notamment Supply Protection, restent extérieures. Appliquer un plan peut
      mobiliser la gestion des Orders, des engagements et la coordination des prestations sans absorber leurs responsabilités.
      Aucun sous-comportement ni capacité Application systématique. La gestion d’une demande propre au travail de Planning
      peut être un comportement de ce Planning ; son suivi reste distinct du plan et de ses effets. Ce choix ne retire pas
      les Orders d’origine interne de leur famille de gestion. L’exception locale distingue [Simulation & Analysis](model:BHV006)
      et [Plan Application](model:D02.e) de [Master Planning](model:D05.f). Ces capacités appartiennent désormais à [Master
      Plan](glossary:TER111) ; cette maille ne se généralise pas aux autres responsabilités de planification.
  - collection: principles
    id: PRINCIPLE-BUSINESS-SCENARIOS
    field_path:
    - statement
    source_sha256: 1b43ebb3c4f67e6a3866452c456d6f0b19dca04b4bd718c0ed364e5fc03a2607
    text: 'le scénario métier décrit une situation, son déclencheur, ses conditions et le résultat recherché. Il possède une
      identité autonome, sans appartenance à un Domain, un Subdomain ou une Capability. Les liens de mobilisation et les affichages
      contextuels depuis les fiches restent pertinents. Un parcours décrit, pour ce scénario, les étapes, les contributions
      des capacités, les dépendances et les résultats intermédiaires utiles à l’analyse de couverture, sans prescrire organisation,
      affectation des tâches ou outils. Une étape mobilise une ou plusieurs capacités ; elle n’est ni une capacité ni un comportement.
      Répétitions et parallélismes sont possibles, sans ordre universel entre capacités. L’absence de rôles ne suffit pas
      à distinguer un processus. Vérifier les résultats nécessaires, les capacités responsables, les informations et conditions,
      puis l’utilisation des résultats ; qualifier capacité manquante, description insuffisante, lien absent ou responsabilité
      externe. La couverture reste limitée aux situations examinées. Une illustration est distinguée d’une observation réelle.
      MOD027 et MOD028 font autorité ; MOD026 est retiré du métamodèle actif, son identité historique conservée. U792 : organiser
      le catalogue autonome par flux de valeur et filtres transverses : événement déclencheur, objet métier, situation nominale,
      exception ou reprise, capacités mobilisées. Un scénario conserve une identité unique et peut concerner plusieurs flux.
      Les étapes du flux de valeur et du parcours restent distinctes ; domaines et capacités sont des angles de consultation
      dérivés des contributions explicites. Chaque flux doit définir bénéficiaire, valeur attendue, déclencheur, frontières
      et étapes avant qualification. Les finalités illustratives ne constituent pas une liste de flux adoptée. U793 : scenario_catalog
      porte les flux, scénarios, parcours et liens autonomes. Les illustrations locales restent dans les fiches. Les contenus
      et classements rédigés pour la migration sont proposés et ne constituent pas des observations installées. Le stockage
      historique est conservé pour la lecture des anciennes publications.'
  - collection: principles
    id: PRINCIPLE-DISPLAY-CODES
    field_path:
    - statement
    source_sha256: d339f506db39503476f23b007542bbeb7b95d4f2b19cfd7fe95f492fc8a6ffd8
    text: 'Identité persistante distincte du code de lecture : UNI/SYS/DOM/SUB/BA/REF/CAP/BHV, trois chiffres au minimum,
      séquence globale par type dans le parcours en profondeur de l’arbre de haut en bas. Arbre, cartes et fiches partagent
      le même ordre. Filtres, recherche, repli et placement du graphe ne renumérotent rien. Codes et ordre sont figés dans
      chaque nouvelle publication ; historiques inchangés. Recherche par code ou identité ; liens par identité et version.
      Règles méthodologiques détaillées : identification_rules dans modeling-glossary.yaml. Convention FLOW, sans changement
      de responsabilité ni parent.'
