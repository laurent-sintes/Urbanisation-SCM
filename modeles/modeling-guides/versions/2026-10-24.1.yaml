lessons:
- id: business-first
  label: Le métier d’abord
  title: Des responsabilités métier qui coopèrent
  rule: Une capacité décrit ce que l’entreprise sait faire durablement. Business System → Domain → Subdomain → Business Area
    → Capability → Behavior distingue le grand périmètre, ses responsabilités, les aptitudes et leurs manières d’agir.
  established_at: '2026-09-19'
  scene:
    kind: responsibilities
    caption: 'Illustration métier : possibilités, refus et écarts peuvent circuler en retour. Cet exemple n’ajoute aucun périmètre
      au catalogue.'
    items:
    - label: Sales / Sourcing and Procurement
      text: Exprimer l’intention et les attentes
    - label: Supply Chain Management
      text: Établir un engagement de satisfaction
    - label: Logistics Execution
      text: Concrétiser les prestations attendues
  question: Plusieurs responsabilités métier contribuent à satisfaire une commande. Cela les transforme-t-il en une hiérarchie
    de couches ?
  choices:
  - label: Non, il s’agit d’une coopération
    feedback: Une interaction indique ce qui est attendu ou partagé. Elle ne crée ni parent-enfant ni responsabilité unique.
  - label: Oui, chaque étape devient une couche du modèle
    feedback: L’ordre d’un parcours ne définit pas la structure de la carte. Les retours, refus et écarts mobilisent aussi
      plusieurs responsabilités.
  explanation: La carte organise des problèmes métier durables. Les interactions expliquent leur coopération. Un parcours
    traverse plusieurs responsabilités sans créer un étage supplémentaire dans la décomposition.
  contributor:
    criterion: Décris le résultat, les limites et les informations échangées ; distingue ce qui est demandé, décidé, engagé
      et constaté.
    boundary: Atlas reste une référence métier. Les choix de produits, applications et réalisations sont documentés séparément,
      hors d’Atlas.
    scope: Principes U455/U456 appliqués ; exemple de coopération et formulation pédagogique proposés, aucun périmètre ajouté.
      U482 adopte le vocabulaire Domain et Purpose, à responsabilités constantes.
    source_refs:
    - U33
    - U455
    - U456
    - U482
  model_links:
  - id: D03.n
    label: Fulfillment Commitment
  - id: D04.i
    label: Sales Order
- id: useful-detail
  label: Le bon détail
  title: Décomposer doit apporter quelque chose
  rule: Un comportement explique une façon d’agir utile. Il est le dernier niveau descriptif sous une capacité ; son ajout
    doit être justifié.
  established_at: '2026-09-17'
  scene:
    kind: decomposition
    parent: Fulfillment Commitment · capacité
    caption: Des responsabilités distinctes · aucune séquence universelle imposée par la carte
    items:
    - label: Comportement
      text: Proposer la promesse
    - label: Comportement
      text: Confirmer la promesse
    - label: Comportement
      text: Réviser la promesse
  question: On ajoute un bouton « Exporter ». Faut-il créer un comportement ?
  choices:
  - label: Le bouton suffit à justifier le découpage
    feedback: Une opération d’interface ne suffit pas. La question utile est ce qu’un comportement supplémentaire permet de
      comprendre du métier.
  - label: Seulement si un bénéfice métier distinct le justifie
    feedback: Le découpage demande une complexité ou un bénéfice ciblé. Mécanisme, politique ou variante peuvent le justifier
      ; un bouton seul ne le fait pas.
  explanation: Le découpage demande une complexité ou un bénéfice ciblé. Mécanisme, politique ou variante peuvent le justifier
    ; un bouton seul ne le fait pas.
  contributor:
    criterion: Énonce la complexité ou le bénéfice précis de la décomposition, puis explique ce qui distingue chaque manière
      d’agir.
    boundary: Un comportement appartient à une seule capacité, explicitement reliée à son parent. Il n’a pas de sous-comportement
      ; plusieurs comportements peuvent se combiner.
    scope: Niveau terminal et critères retenus le 17 septembre. Promise Management est l’exemple adopté U288, postérieur à
      v007 ; il ne représente pas un extrait de cette publication. Formulations pédagogiques proposées.
    source_refs:
    - U262
    - U265
    - U283
    - U288
    - AGENTS-2026-09-18
    - U455
  model_links:
  - id: D03.n
    label: Fulfillment Commitment
- id: meaningful-links
  label: Le sens des liens
  title: Avoir besoin de ne veut pas dire contenir
  rule: Les liens d’appartenance construisent l’arbre. Les dépendances expliquent comment des responsabilités distinctes se
    mobilisent.
  established_at: '2026-09-16'
  scene:
    kind: dependency
    connector: mobilise
    caption: Un lien de mobilisation, pas un nouveau niveau de décomposition.
    items:
    - label: Capacité
      text: Inventory Optimization Planning
    - label: Capacité distincte
      text: Replenishment Decision
  question: Planning mobilise une décision spécialisée. Cette décision devient-elle son comportement ?
  choices:
  - label: Elle reste une capacité distincte
    feedback: La décision garde sa responsabilité propre. On explique le lien de mobilisation sans la transformer en comportement
      du Planning.
  - label: Elle devient un enfant de Planning
    feedback: Ce placement confondrait dépendance et décomposition. Une relation métier n’ajoute pas automatiquement une branche
      dans l’arbre.
  explanation: La décision garde sa responsabilité propre. On explique le lien de mobilisation sans la transformer en comportement
    du Planning.
  contributor:
    criterion: 'Précise le sens du lien : contient, présente, utilise une information ou mobilise une décision. Décris les
      conditions et effets connus.'
    boundary: Les référentiels restent distincts et présentent les capacités de leur sujet. Une relation de présentation ne
      fusionne pas les références et ne crée pas un niveau métier supplémentaire.
    scope: Mobilisation des décisions explicitée U229 ; la scène illustre ce principe sans ajouter de relation au catalogue.
      Formulations pédagogiques proposées.
    source_refs:
    - U229
    - AGENTS-2026-09-18
    - U482
    - U507
    - U509
  model_links:
  - id: D05.f
    label: Inventory Optimization Planning
  - id: D05.e
    label: Replenishment Decision
- id: responsibilities
  label: Les responsabilités
  title: Un choix, une mise à jour, une action physique
  rule: Décider d’un ajustement, l’enregistrer et le réaliser portent des effets différents, même lorsque tout est automatisé.
  established_at: '2026-09-16'
  scene:
    kind: responsibilities
    caption: Trois effets à distinguer · pas de workflow universel dessiné ici
    items:
    - label: Décision
      text: Choisir de transférer 20 unités
    - label: Transaction
      text: Enregistrer la commande de transfert
    - label: Réalisation
      text: Déplacer les unités
  question: La commande de transfert est enregistrée. Les unités ont-elles nécessairement bougé ?
  choices:
  - label: Oui, l’enregistrement prouve la réalisation
    feedback: L’enregistrement ne prouve pas le déplacement. Il faut distinguer le résultat de la transaction et celui de
      l’exécution.
  - label: Non, la réalisation doit être constatée
    feedback: L’enregistrement change les données transactionnelles. La réalisation physique est un autre fait, dont il faut
      pouvoir connaître le résultat.
  explanation: L’enregistrement change les données transactionnelles. La réalisation physique est un autre fait, dont il faut
    pouvoir connaître le résultat.
  contributor:
    criterion: 'Pour chaque responsabilité, demande quel effet elle produit : une réponse métier, des données mises à jour
      ou une prestation réalisée.'
    boundary: Planning mobilise les décisions et les capacités opérationnelles. Écran, batch ou streaming ne créent pas à
      eux seuls de nouvelles capacités.
    scope: L’effet transactionnel est précisé U231. Le transfert de 20 unités est un exemple pédagogique proposé, sans processus
      universel, organisation humaine ni automatisation imposée.
    source_refs:
    - U231
    - AGENTS-2026-09-18
  model_links:
  - id: D05.c
    label: Stock Redistribution Decision
  - id: D04.k
    label: Transfer Order
- id: business-objects
  label: Les objets du métier
  title: Les objets gravitent autour des capacités
  rule: Objet métier, document et fait de gestion restent distincts. Dans FLOW, tout fait de gestion est associé à un document
    métier identifié, éventuellement structuré sans PDF ; aucun n’est un sous-comportement.
  established_at: '2026-09-19'
  scene:
    kind: objects
    caption: 'Exemple fictif : le document de réception identifié consigne le fait ; la commande porte ce qui était attendu.'
    items:
    - label: Objet métier
      text: La commande d’achat attendue
    - label: Document
      text: Le document de réception REC-EXEMPLE-01
    - label: Fait de gestion
      text: 60 pièces reçues vendredi
  question: Un comportement utilise un document. Le document devient-il un niveau en dessous ?
  choices:
  - label: Non, il est relié avec un sens explicite
    feedback: Le document reste un document. Le lien indique par exemple qu’il est produit ou utilisé, sans en faire un sous-comportement.
  - label: Oui, il prolonge la décomposition
    feedback: Cela mélangerait la manière d’agir et l’objet utilisé. Leur relation mérite d’être décrite, pas transformée
      en décomposition.
  explanation: Le document reste un document. Le lien indique par exemple qu’il est produit ou utilisé, sans en faire un sous-comportement.
    Un document métier peut être un enregistrement structuré sans PDF. La convention FLOW relie chaque fait de gestion à un
    document identifié. Une Information explicite le sens métier utile à une capacité, avec les éléments et le contexte nécessaires.
    Sa maille minimale se juge sur ce sens ; la cartographie ne prescrit pas de modèle de données implémentable.
  contributor:
    criterion: Décris ce que représente l’élément, puis précise s’il est produit, utilisé, référencé ou constaté. Ne déduis
      pas le lien de sa position visuelle.
    boundary: Le lien fait–document est requis dans FLOW ; il ne fixe ni nombre exact de documents, ni règles de version/correction,
      ni propriétaire unique. Ces détails se précisent selon le contexte.
    scope: 'U461 confirme le lien fait–document. Exemple et formulation pédagogique proposés ; aucun objet canonique ajouté,
      aucune autre convention de cycle de vie adoptée. U464 : notion Information et règle de granularité proposées, sans assimiler
      tout fait logique à un fait de gestion.'
    source_refs:
    - U61
    - U62
    - U262
    - AGENTS-2026-09-18
    - U461
    - U464
  model_links: []
- id: two-vocabularies
  label: Deux vocabulaires
  title: Distinguer le méta modèle du modèle métier
  rule: Le méta modèle décrit comment la carte est construite. Le modèle métier décrit les notions et responsabilités de l’entreprise.
  established_at: '2026-09-19'
  scene:
    kind: objects
    caption: Deux vocabulaires complémentaires, consultables séparément.
    items:
    - label: Méta modèle
      text: Système métier · Domaine · Sous-domaine · Business Area · Capacité · Comportement · Relation
    - label: Modèle métier
      text: Stock · Commande · Réservation · Promesse
  question: Où chercher la différence entre une capacité et un comportement ?
  choices:
  - label: Dans le glossaire du méta modèle
    feedback: Il définit les éléments de la carte et leurs relations.
  - label: Dans le glossaire métier
    feedback: Le glossaire métier explique les notions de l’entreprise, par exemple un stock ou une commande.
  explanation: Utilise le glossaire du méta modèle pour comprendre la structure ; utilise le glossaire métier pour comprendre
    les responsabilités Supply.
  contributor:
    criterion: Décris une notion métier dans le glossaire métier et une règle de construction dans le méta modèle.
    boundary: Une relation métier ne crée pas une décomposition ; un terme du méta modèle ne devient pas une capacité.
    scope: Présentation demandée U450 ; formulation pédagogique proposée.
    source_refs:
    - U450
    - U451
    - U482
  model_links: []
sources:
- id: U1165
  title: Fidélité des contenus et externalisation des libellés Atlas
  kind: user_contribution
  date: '2026-10-24'
  excerpt: 'Go pour appliquer les préconisations de l’audit dans l’ordre proposé : fidélité des contenus, vocabulaire publié,
    externalisation des libellés, puis contrôles automatiques. Garde les tooltips simples.'
  scope: Publication du vocabulaire et des présentations de lecture existantes ; aucune nouvelle définition ni extension d’accord
    métier.
- id: U1121
  title: Renommage du domaine Supply Chain Management
  kind: user_contribution
  date: '2026-10-16'
  excerpt: Ok, je veux donc renommer ce domaine en supply chain management
  scope: Nom du domaine à périmètre constant ; deux libellés méthodologiques alignés, sans nouvelle règle ni nouveau terme.
- id: U1115
  title: Correction des relations et parcours Enterprise Architecture
  kind: user_contribution
  date: '2026-10-16'
  excerpt: 'Go pour corriger le modèle selon cet audit, dans l’ordre proposé : contradictions et synthèses, chaînes Commerce
    et Procurement, puis coopérations de contexte et parcours EA.'
  scope: Appliquer les corrections de l’audit U1114 et représenter les participants de contexte à leur profondeur déclarée
    ; le terme et sa rédaction de mise en œuvre restent proposés, sans accord étendu aux participants individuels.
- id: U1114
  title: Audit des relations Enterprise Architecture
  kind: user_contribution
  date: '2026-10-16'
  excerpt: Je voudrais un audit complet sur le modèle du point de vue des relations entre objet mais dans un scope enterprise
    architecture.
  scope: Examiner les relations et leurs limites documentaires à l’échelle Enterprise Architecture ; la demande d’audit ne
    vaut pas adoption implicite des corrections.
- id: U1070
  title: Problèmes et Options des Hotspots
  kind: user_contribution
  excerpt: Un Hotspot identifie une douleur mais l'analyse nous conduit à plusieurs problèmes dont chacun est défini par une
    question claire et un ensemble de chemins possibles. Plutot que chemin je préfère le terme Option, c'est celui qu'on utilise.
  scope: Distinguer le signal initial des problèmes de cadrage et employer Option dans le métamodèle.
- id: U971
  title: Audit du contenu et visibilité technique des Hotspots
  kind: user_contribution
  excerpt: Je souhaite un champ "technique" Visible=true par défaut.
  scope: Visibilité et accès discret aux sujets masqués ; propositions de contenu et de localisation non adoptées.
- id: U970
  title: Application de l’audit UX Hotspots
  kind: user_contribution
  excerpt: Applique les préconisations de l’audit
  scope: Documentation, critères explicites et parcours UX ; pas de réévaluation automatique des sujets.
- id: U969
  title: Audit Hotspots et extractions complètes
  excerpt: Ne jamais oublier que metamodele et modele complets doivent se trouver dans les extractions (téléchargement) yaml
    et json.
  scope: Demande de contrôle du catalogue, audit UX et tests de téléchargement ; aucune résolution ou réalisation déduite.
- id: U964
  title: Une différence ne constitue pas automatiquement un problème
  excerpt: Une décision qui conduirait à "chaque marque décide, ça ne pose pas de problème au Core System" est une forme de
    résolution.
  scope: Option conditionnelle pour HS-016 ; compatibilité et choix restent à établir.
- id: U965
  title: Une décision de convergence peut résoudre le cadrage
  excerpt: Oui, s'il y a un gap analysis, parfois, une simple décision de convergence totale / partielle / non convergence
    est la solution
  scope: Formes possibles de résolution, aucune issue choisie automatiquement.
- id: U966
  title: Hotspot comme sujet générique à creuser
  excerpt: Hotspot est une notion générique qui indique qu'il y a un sujet à creuser et à arbitrer.
  scope: Une complexité d'implémentation peut suffire sans analyse d'écarts.
- id: U968
  title: Provenance des décisions et validation des sujets
  excerpt: H023, c'est une problématique architecturale de "Décision Provenance" => cherche la ref sur internet
  scope: Recadrage architectural de HS-023 ; la définition détaillée conserve ses réserves et aucun produit n'est retenu.
- id: U507
  title: Authoritative Data comme Area et visibilité des référentiels
  excerpt: Go, je valide
  scope: Verbatim de connaissance/01-contributions-utilisateur.md, U507. Accord contextuel sur Party / Role, la visibilité
    des six référentiels alors présents et Authoritative Data comme Area ; aucun accord global sur leurs descriptions détaillées.
- id: U509
  title: Product Catalog et Assortment distinct d’Agreement
  excerpt: Go
  scope: Verbatim de connaissance/01-contributions-utilisateur.md, U509. Accord contextuel sur Product Catalog et l’ajout
    d’Assortment comme septième référence distincte dans Authoritative Data ; Agreement peut référencer la sélection convenue
    sans composition obligatoire.
- id: U319
  title: Demande d’étude pour expliquer les principes de modélisation dans Atlas
  excerpt: |-
    Je voudrais espace dans atlas qui explique les principes de modélisation retenus. Il faut imaginer qq chose de compact, ludique, didactique, pas juste un glossaire verbeux et indigeste.
    Je veux juste une étude et des propositions sans modification du source.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U319. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U320
  title: Deux profondeurs de lecture pour le guide Atlas
  excerpt: Les deux, avec deux profondeurs de lecture
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U320. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U321
  title: Intégrer Les clés du modèle dans Atlas
  excerpt: Go
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U321. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U33
  title: Définition stricte des capacités et vocabulaire métier commun
  excerpt: |-
    Il faut absolument qu'on reste sur la définition de capacité : ce que sait faire l'entreprise indépendamment de son organisation et de ses outils.

    Mais c'est bien de chercher plus loin pour expliquer et illustrer les capacités.

    A mon avis, il faut ensuite un glossaire clair sur les mots qu'on retrouve dans les capacités : ressource, stock, demande en tout genre etc. Ainsi que sur les verbes afin de normaliser les actions.

    Qu'en penses-tu ?
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U33. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U45
  title: Donner au domaine le sens d’un espace problématique
  excerpt: En tout cas il faut donner du sens à ces niveaux. Le plus important c'est "domaine" => la définition d'evans (DDD)
    qui le décrit comme un espace problématique est ce qui me guide dans la catégorisation. Qu'en penses-tu ?
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U45. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U46
  title: Problèmes liés dans un périmètre cohérent et étape de cartographie
  excerpt: |-
    La notion d'espace problématique est dans son livre si je me souviens bien : un ensemble de problèmes définissables dans un périmètre cohérent car les problèmes sont liés.

    Bounded context me semble trop précis et fait état d'un certain niveau d'avancement dans la conception de l'application et ce n'est pas ce qu'on veut à mon humble avis.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U46. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U322
  title: Indépendance du modèle métier et de l’architecture de solution
  excerpt: Attention au modèle business qui est complètement décorrélé de la solution. Souvent on a une capacité implémentée
    par une brique logiciel/ solution mais pas nécessairement. Il peut parfois y avoir dans les solution de la mutualisation,
    de la généricité, des choix et des contraintes techniques qui font qu'il y a des regroupements forts ou des dispersions
    (microservices) justifiés.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U322. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U262
  title: Retenir Comportement comme dernier niveau de détail d’une capacité
  excerpt: Comportement est exactement ce que je cherche pour mon niveau de décomposition complémentaire. Et je ne crois pas
    qu'il faille descendre plus bas.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U262. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U265
  title: Audit de granularité avec comportements et simplification des instructions
  excerpt: 'P.S. : Il faut que la décomposition en comportement soit justifiée par une complexité ou un bénéfice ciblé =>
    cette notion est en enregistrer dans le modèle.'
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U265. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U283
  title: Critères différenciants des comportements et réexamen de Planning
  excerpt: |-
    Mécanisme, Politique, Variante, ou benefice sont les critères différenciants qui permettent de décomposer une capacité. Je suis très satisfait de ta proposition.
    Pour les capacité de "planification", les mécanismes de construction de scénarios alternatifs, d'adaptation de l'execution d'un scénario, et de simulation sont vraiment des comportements dans le sens où ça implique des impacts sur les comportements humains de l'entreprise et de ses processus. Les autres comportements sont des fonctions qu'on retrouvera dans les produits.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U283. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U288
  title: Promise Management avec trois comportements de promesse
  excerpt: |-
    "J’ai retenu une fusion à soumettre à ton arbitrage : les trois capacités de gestion de promesse pourraient devenir Promise Management, en gardant proposition, confirmation et révision comme fonctions.   ". Comme comportement tu veux dire :)

    Oui c'est une bonne idée.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U288. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U229
  title: Conserver Decision et distinguer Planning des capacités qui le nourrissent
  excerpt: Ce qui m'ennuie c'est que j'aimerais garder "Décision" du manière générale et éviter "Calculation". Et "Planning"
    est un terme qui désigne le fait de "reconfigurer, simuler, valider". Les capacités "Planning" se nourrissent de "Décision"
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U229. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U231
  title: Préciser l'application transactionnelle des données de Stock Protection
