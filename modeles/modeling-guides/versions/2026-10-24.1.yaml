  - collection: terms
    id: TER382
    field_path:
    - market_comparisons
    - '1'
    - definition_choice
    source_sha256: 13101c66fce05e0db535a9444b9b4ce236bf6a2277574bf04706a8c41f37e3e6
    text: Dans le mode, les achats [offshore](glossary:TER382) forment un socle préparé très en amont, éventuellement dès
      [Design & Development](model:system-design-development). Un coût rendu inférieur, des minimums élevés ou des délais
      longs sont des hypothèses à vérifier par produit, fournisseur et parcours ; ils ne découlent pas automatiquement du
      pays. La comparaison avec le [nearshore](glossary:TER383) porte sur le service, les coûts, les engagements et le stock
      final.
  - collection: terms
    id: TER383
    field_path:
    - market_comparisons
    - '0'
    - flow_position
    source_sha256: 5545ef356ffc4e4c74cde076eebfe389df17848a859cebfc83a8059a906baacd
    text: Dans le mode, le [nearshore](glossary:TER383) peut compléter le socle [offshore](glossary:TER382) après révision
      des besoins. Le [CTP](glossary:TER045) vérifie produit qualifié, matières, capacité, délais et disponibilité utile ;
      le [PTP](glossary:TER068) compare le coût de cette flexibilité à sa valeur. La réservation de capacité peut devoir précéder
      le constat du manque. Aucune marge, rapidité ou capacité garantie n'est déduite de la seule proximité géographique.
