<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="_r_4_-title _r_4_-desc"><title id="_r_4_-title">Six dimensions qui se répondent</title><desc id="_r_4_-desc">Une équipe pluridisciplinaire explore les six dimensions ensemble. Chaque apprentissage peut modifier les autres vues. L’architecture d’entreprise aide à maintenir leur cohérence dans la durée. Stratégie et valeur ; Métier et capacités ; Usages et produit ; Organisation et compétences ; Informations et données ; Solutions et technologie. Une équipe, des questions communes.</desc><defs><marker id="_r_4_-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236159"></path></marker></defs><path d="M400 50V338 M375 68H425 M375 178H425 M375 288H425" fill="none" stroke="#236159" stroke-width="2"></path><g><rect x="25" y="26" width="350" height="84" rx="12" fill="#D9F2EA" stroke="#b9cdc6"></rect><text x="200" y="75" text-anchor="middle" font-size="22" fill="#173f39" font-family="Segoe UI, Arial, sans-serif"><tspan x="200" dy="0">Stratégie et valeur</tspan></text></g><g><rect x="425" y="26" width="350" height="84" rx="12" fill="#DAE0F2" stroke="#b9cdc6"></rect><text x="600" y="75" text-anchor="middle" font-size="22" fill="#173f39" font-family="Segoe UI, Arial, sans-serif"><tspan x="600" dy="0">Métier et capacités</tspan></text></g><g><rect x="25" y="136" width="350" height="84" rx="12" fill="#D9F2EA" stroke="#b9cdc6"></rect><text x="200" y="185" text-anchor="middle" font-size="22" fill="#173f39" font-family="Segoe UI, Arial, sans-serif"><tspan x="200" dy="0">Usages et produit</tspan></text></g><g><rect x="425" y="136" width="350" height="84" rx="12" fill="#DAE0F2" stroke="#b9cdc6"></rect><text x="600" y="172" text-anchor="middle" font-size="22" fill="#173f39" font-family="Segoe UI, Arial, sans-serif"><tspan x="600" dy="0">Organisation et</tspan><tspan x="600" dy="26">compétences</tspan></t