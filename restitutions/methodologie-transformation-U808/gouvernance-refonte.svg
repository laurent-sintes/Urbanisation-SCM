<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="_r_d_-title _r_d_-desc"><title id="_r_d_-title">Collaborer en continu, décider au bon niveau</title><desc id="_r_d_-desc">L’équipe, la direction de programme et les sponsors échangent directement pour préparer les choix. Le comité mensuel prend les décisions structurantes relevant de son autorité. L’architecture d’entreprise contribue à la cohérence, sans instance de validation supplémentaire. Équipe pluridisciplinaire ; Transformation Leader ; Transformation Board. Architecture d’entreprise : cohérence pendant et après la transformation.</desc><defs><marker id="_r_d_-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236159"></path></marker></defs><path d="M335 108L240 153" fill="none" stroke="#236159" stroke-width="2" marker-start="url(#_r_d_-arrow)" marker-end="url(#_r_d_-arrow)"></path><path d="M465 108L560 153" fill="none" stroke="#236159" stroke-width="2" marker-start="url(#_r_d_-arrow)" marker-end="url(#_r_d_-arrow)"></path><path d="M380 200H420" fill="none" stroke="#236159" stroke-width="2" marker-start="url(#_r_d_-arrow)" marker-end="url(#_r_d_-arrow)"></path><g><rect x="225" y="20" width="350" height="84" rx="12" fill="#D9F2EA" stroke="#b9cdc6"></rect><text x="400" y="69" text-anchor="middle" font-size="22" fill="#173f39" font-family="Segoe UI, Arial, sans-serif"><tspan x="400" dy="0">Équipe pluridisciplinaire</tspan></text></g><g><rect x="25" y="158" width="350" height="84" rx="12" fill="#DAE0F2" stroke="#b9cdc6"></rect><text x="200" y="207" text-anchor="middle" font-size="22" fill="#173f39" font-family="Segoe UI, Arial, sans-serif"><tspan x="200" dy="0">Transformation Leader</tspan></text></g><g><rect x="425" y="158" width="350" height="84" rx="12" fill="#D9F2EA" stroke="#b9cdc6"></rect><text x="600" y="207" text-anchor="middle" font-size="22" fill="#173f39" font-family="Segoe UI, Arial, sans-serif"><tspan x="600" dy="0">Transformation Board</tspan></text></g><rect x="25" y="338" width="750" height="58" rx="12" fill="#236159"></rect><text x="400" y="363" text-anchor="middle" fill="white" font-size="18" font-family="Segoe UI, Arial, sans-serif">Architecture d’entreprise<tspan x="400" dy="22">cohérence pendant et après la transformation</tspan></text></svg>