  <text x="64" y="1200" class="section">QUAND VALIDER LES FONDATIONS ?</text>
  <text x="64" y="1230" class="small">Dès le cadrage avec le produit, puis sur preuves : trois portées de décision, selon les risques et les incréments.</text>
  <line x1="64" y1="1253" x2="1536" y2="1253" stroke="#cfdae0"/>
  <text x="64" y="1290" class="step">Contraintes et exigences</text>
  <text x="64" y="1324" class="body">Limites et besoins de service connus</text>
  <text x="64" y="1353" class="small">Dès le cadrage ; hypothèses ouvertes</text>
  <text x="584" y="1290" class="step">Options éprouvées</text>
  <text x="584" y="1324" class="body">Faisabilité et compromis démontrés</text>
  <text x="584" y="1353" class="small">Avant un engagement structurant</text>
  <text x="1104" y="1290" class="step">Aptitude à la production</text>
  <text x="1104" y="1324" class="body">Service et exploitation vérifiés</text>
  <text x="1104" y="1353" class="small">Avant chaque mise en service</text>
  <line x1="64" y1="1390" x2="1536" y2="1390" stroke="#cfdae0"/>
  <text x="64" y="1431" class="section">DÉCIDER PROGRESSIVEMENT, AVEC LE MÉTIER</text>
  <text x="64" y="1480" class="step">Mettre en discussion</text>
  <text x="64" y="1511" class="small">Problème, options, conséquences</text>
  <text x="440" y="1480" class="step">Éprouver et partager</text>
  <text x="440" y="1511" class="small">Essais et enseignements visibles</text>
  <text x="816" y="1480" class="step">Affiner et arbitrer</text>
  <text x="816" y="1511" class="small">Choix progressifs et responsables</text>
  <text x="1192" y="1480" class="step">Tracer et réexaminer</text>
  <text x="1192" y="1511" class="small">Décisions, réserves, nouvelles preuves</text>
  <path d="M 410 1473 L 432 1473" class="link"/>
  <path d="M 786 1473 L 808 1473" class="link"/>
  <path d="M 1162 1473 L 1184 1473" class="link"/>
  <text x="64" y="1557" class="body">Des revues fréquentes resserrent les options et réduisent les incertitudes ; une preuve nouvelle peut rouvrir un choix.</text>
  <text x="64" y="1592" class="small">ADR = fiche de décision d’architecture : ouverte pendant l’instruction, discutée puis actualisée après l’arbitrage.</text>
  <line x1="64" y1="1622" x2="1536" y2="1622" stroke="#cfdae0"/>
  <text x="64" y="1657" class="small">Le Gantt planifie les travaux. Ce schéma montre comment instruire les décisions, avec des interactions et des retours.</text>
  <text x="64" y="1689" style="font-size:16px;fill:#637686">Appuis : BIZBOK · TOGAF · DDD · SVPG · Agile · ADR · Well-Architected · PMI · Prosci</text>
  <text x="1536" y="1689" text-anchor="end" style="font-size:16px;fill:#637686">Vue d’ensemble adaptée · 28.09.2026</text>
